<!doctype html>
<html lang="de" data-trainer="bz">
<head>
<script>window.PF_EINZELDATEI = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zellbezüge – vibe learning</title>
<script>/* ../katalog.js */
/* Inhaltsverzeichnis der Übungsplattform
 *
 * Das ist die einzige Stelle, an der ein neues Tool eingetragen werden muss.
 * Menüleiste, Startseite, Bereichsseiten, Speichern und Lehrerbereich lesen von hier.
 *
 * Bereich:  id      = Name des Unterordners in pb_public (nur a–z, 0–9, -)
 *           titel   = Text in der Menüleiste
 *           farbe   = Akzentfarbe im dunklen Design (Nord-Farben, nordtheme.com),
 *           farbeHell = dunklerer Ton derselben Farbe für das helle Design (sonst schlecht lesbar)
 *           farbeSchrift = optional: hellerer Ton für Schrift im dunklen Design, wenn farbe dort zu wenig Kontrast hat
 *           Ohne farbe bekommt der Bereich das neutrale Nord-Blau.
 * Tool:     id      = Kürzel für Speicherstand und Auswertung (nie mehr ändern,
 *                     sonst geht der gespeicherte Fortschritt verloren)
 *           datei   = HTML-Datei im Ordner des Bereichs
 *           titel, text = Anzeige im Menü und auf den Übersichtsseiten
 *
 * In der HTML-Datei eines Tools steht dieselbe id: <html lang="de" data-trainer="…">
 */
window.KATALOG = {
  name: 'vibe learning',
  untertitel: 'Übungen für den IT-Unterricht. Wähle oben einen Bereich aus.',
  bereiche: [
    {
      id: 'excel', titel: 'Excel', farbe: '#a3be8c', farbeHell: '#5e8a45',
      text: 'Tabellenkalkulation: Funktionen, Bedingungen und Verknüpfungen.',
      tools: [
        {id: 'fn',   datei: 'funktionen.html', titel: 'SUMME, MIN, MAX …', text: 'SUMME, MITTELWERT, MIN, MAX, ANZAHL und ANZAHL2 – mit Erklärung, Übungen und Endlos-Modus.'},
        {id: 'wenn', datei: 'wenn.html',       titel: 'WENN-Funktion',     text: 'Die WENN-Funktion üben – von Bausteinen bis zur eigenen Formel.'},
        {id: 'uo',   datei: 'und-oder.html',   titel: 'UND / ODER',        text: 'Bedingungen verknüpfen – mit Erarbeitung, Übungen und Endlos-Modus.'},
        {id: 'bz',   datei: 'bezuege.html',    titel: 'Zellbezüge $',      text: 'Relative und absolute Bezüge: Formeln übertragen und $-Zeichen richtig setzen.'}
      ]
    },
    {id: 'python',      titel: 'Python', farbe: '#b48ead', farbeHell: '#8a5f84', text: 'Programmieren mit Python.',
      tools: [
        {id: 'py', datei: 'editor.html', titel: 'Python-Editor', text: 'Python direkt im Browser schreiben und ausführen – mit Terminal für Ein- und Ausgabe.'},
        {id: 'pyif', datei: 'bedingungen.html', titel: 'Bedingte Anweisung', text: 'if, elif und else: 10 Aufgaben mit Erklärung und automatischer Prüfung.'}
      ]
    },
    {id: 'datenbanken', titel: 'Datenbanken', farbe: '#bf616a', farbeHell: '#a3434c', farbeSchrift: '#e0959b', text: 'Tabellen, Beziehungen und SQL-Abfragen.',       tools: []},
    {id: 'schaltungen', titel: 'Logische Schaltungen', text: 'Gatter, Wahrheitstabellen und Schaltnetze.',  tools: []}
  ]
};

</script>
<script>/* ../nav.js */
/* Menüleiste der Übungsplattform
 *
 * Baut oben auf jeder Seite die Leiste mit den Bereichen aus katalog.js.
 * Fährt man mit der Maus über einen Bereich (am Handy: antippen), klappen
 * dessen Übungen auf. Außerdem füllt das Skript die Startseite (#pf-start)
 * und die Übersichtsseite eines Bereichs (#pf-bereich).
 *
 * Fehlt katalog.js oder nav.js, läuft das Tool trotzdem – nur ohne Menüleiste.
 * In Einzeldateien (werkzeuge/einzeldateien.py, window.PF_EINZELDATEI) zeigt die
 * Leiste nur Name und Hell/Dunkel-Knopf, weil es keine anderen Seiten gibt.
 */
(function () {
  'use strict';
  const K = window.KATALOG;
  if (!K) return;

  // Wurzel der Plattform = Ordner, in dem nav.js liegt (funktioniert auch per Doppelklick)
  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const root = document.documentElement;
  const TOOL = root.dataset.trainer || '';
  let BEREICH = root.dataset.bereich || '';
  K.bereiche.forEach(b => { if (b.tools.some(t => t.id === TOOL)) BEREICH = b.id; });

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const bereichUrl = b => BASE + b.id + '/index.html';
  const toolUrl = (b, t) => BASE + b.id + '/' + t.datei;

  const CSS = `
.pf-nav{background:var(--panel,#f6f8fb);color:var(--text,#2e3440);border-bottom:1px solid var(--border,#cdd3de);position:relative;z-index:60;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pf-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 16px;min-height:50px}
.pf-brand{font:800 18px ui-monospace,Consolas,"Liberation Mono",monospace;color:inherit;text-decoration:none;margin-right:14px;white-space:nowrap}
.pf-brand span{color:var(--accent-text,var(--accent,#5e81ac))}
.pf-menu{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.pf-item{position:relative;--bc:#5e81ac}
html[data-theme=dark] .pf-item{--bc:#88c0d0}
.pf-item>a{display:flex;align-items:center;gap:5px;padding:14px 11px;color:inherit;text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.pf-item>a::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);opacity:.5}
.pf-item:hover>a,.pf-item.open>a{color:var(--bc)}
.pf-item>a[aria-current]{border-bottom-color:var(--bc)}
.pf-drop{display:none;position:absolute;top:100%;left:0;min-width:280px;background:var(--panel,#f6f8fb);border:1px solid var(--border,#cdd3de);border-radius:0 0 12px 12px;box-shadow:0 14px 30px rgba(0,0,0,.18);padding:6px;list-style:none;margin:0}
.pf-item:hover .pf-drop,.pf-item:focus-within .pf-drop,.pf-item.open .pf-drop{display:block}
.pf-drop a{display:block;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none}
.pf-drop a:hover,.pf-drop a:focus{background:var(--panel2,#eceff4);outline:none}
.pf-drop a[aria-current]{color:var(--bc);font-weight:600}
.pf-drop small{display:block;color:var(--muted,#5b6578);font-size:13px}
.pf-drop .pf-all{font-size:13px;color:var(--muted,#5b6578);border-top:1px solid var(--border,#cdd3de);border-radius:0 0 8px 8px;margin-top:4px}
.pf-drop .pf-leer{padding:8px 10px;color:var(--muted,#5b6578);font-style:italic}
.pf-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pf-btn{background:var(--panel2,#eceff4);border:1px solid var(--border,#cdd3de);color:inherit;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:17px;padding:0}
.pf-burger{display:none}
.pf-einzeln .pf-menu{display:none!important}
@media (max-width:760px){
  .pf-burger{display:grid}
  .pf-menu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--panel,#f6f8fb);border-bottom:1px solid var(--border,#cdd3de);box-shadow:0 14px 30px rgba(0,0,0,.18);padding:6px 16px 12px;max-height:80vh;overflow:auto}
  .pf-nav.open .pf-menu{display:flex}
  .pf-item>a{padding:10px 0 4px;border:0}
  .pf-item>a::after{display:none}
  .pf-drop{display:block;position:static;min-width:0;border:0;box-shadow:none;padding:0 0 4px 10px}
}
.pf-fade,.pf-fade *{transition:background-color .35s,color .35s,border-color .35s,fill .35s!important}
.pf-gesperrt{opacity:.5;cursor:default!important}
@media print{.pf-nav{display:none}}`;

  // Farben der Bereiche (katalog.js: farbe = dunkles Design, farbeHell = helles Design,
  // farbeSchrift = optional hellerer Ton für Schrift im dunklen Design).
  // --accent gilt für die ganze Seite des aktuellen Bereichs, --bc nur für den eigenen Menüpunkt.
  function akzentCss(){
    let css = '';
    K.bereiche.forEach(b => {
      if (!b.farbe) return;
      const dunkel = b.farbeSchrift || b.farbe;
      css += `\n.pf-item[data-b="${b.id}"]{--bc:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark] .pf-item[data-b="${b.id}"]{--bc:${dunkel}}`;
      if (b.id === BEREICH) css += `\nhtml[data-theme]{--accent:${b.farbeHell || b.farbe};--accent-text:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark]{--accent:${b.farbe};--accent-text:${dunkel}}`;
    });
    return css;
  }

  const SONNE = '☀', MOND = '☾';
  function theme(){ return root.dataset.theme === 'dark' ? 'dark' : 'light'; }

  function buildNav(){
    const s = document.createElement('style'); s.textContent = CSS + akzentCss(); document.head.appendChild(s);
    const nav = document.createElement('nav');
    nav.className = 'pf-nav' + (window.PF_EINZELDATEI ? ' pf-einzeln' : '');
    nav.setAttribute('aria-label', 'Bereiche');
    const name = esc(K.name).replace(/^(\S+)/, '<span>$1</span>');
    const EINZELN = !!window.PF_EINZELDATEI;
    nav.innerHTML = `<div class="pf-in">
      ${EINZELN ? `<span class="pf-brand">${name}</span>` : `<a class="pf-brand" href="${BASE}index.html">${name}</a>`}
      <ul class="pf-menu">${K.bereiche.map(b => `
        <li class="pf-item" data-b="${esc(b.id)}">
          <a href="${bereichUrl(b)}"${b.id === BEREICH ? ' aria-current="true"' : ''}>${esc(b.titel)}</a>
          <ul class="pf-drop">${b.tools.length
            ? b.tools.map(t => `<li><a href="${toolUrl(b, t)}"${t.id === TOOL ? ' aria-current="page"' : ''}>${esc(t.titel)}</a></li>`).join('')
              + `<li><a class="pf-all" href="${bereichUrl(b)}">Alle Übungen zu ${esc(b.titel)}</a></li>`
            : '<li class="pf-leer">Hier entstehen bald Übungen.</li>'}
          </ul>
        </li>`).join('')}
      </ul>
      <div class="pf-right">
        ${document.getElementById('themeBtn') ? '' : `<button class="pf-btn" id="pfTheme" type="button" aria-label="Hell/Dunkel umschalten">${theme() === 'dark' ? SONNE : MOND}</button>`}
        ${EINZELN ? '' : '<button class="pf-btn pf-burger" type="button" aria-label="Menü">☰</button>'}
      </div>
    </div>`;
    document.body.insertBefore(nav, document.body.firstChild);

    const burger = nav.querySelector('.pf-burger');
    if (burger) burger.addEventListener('click', () => nav.classList.toggle('open'));
    const tb = nav.querySelector('#pfTheme');
    if (tb) tb.addEventListener('click', () => {
      const t = theme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = t; tb.textContent = t === 'dark' ? SONNE : MOND;
      try { localStorage.setItem('wenn-theme', t); } catch (e) {}
    });

    // Geräte ohne Maus: erstes Antippen klappt auf, zweites öffnet die Bereichsseite
    const items = [...nav.querySelectorAll('.pf-item')];
    if (matchMedia('(hover: none)').matches) items.forEach(li => li.firstElementChild.addEventListener('click', e => {
      if (matchMedia('(max-width:760px)').matches || li.classList.contains('open')) return;
      e.preventDefault();
      items.forEach(x => x.classList.toggle('open', x === li));
    }));
    document.addEventListener('click', e => { if (!nav.contains(e.target)){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
  }

  /* ---------- Übersichtsseiten ---------- */
  function kacheln(b){
    if (!b.tools.length) return '<p class="pf-hinweis">Hier entstehen bald Übungen.</p>';
    return `<div class="pf-grid">${b.tools.map(t => `<a class="pf-tile" href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`).join('')}</div>`;
  }
  function buildPages(){
    const start = document.getElementById('pf-start');
    if (start){
      start.innerHTML = `<h1>${esc(K.name)}</h1><p class="pf-lead">${esc(K.untertitel)}</p>`
        + K.bereiche.map(b => `<section class="pf-sec"><h2><a href="${bereichUrl(b)}">${esc(b.titel)}</a></h2><p class="pf-text">${esc(b.text)}</p>${kacheln(b)}</section>`).join('');
    }
    const be = document.getElementById('pf-bereich');
    const b = K.bereiche.find(x => x.id === BEREICH);
    if (be && b){
      document.title = b.titel + ' – ' + K.name;
      be.innerHTML = `<h1>${esc(b.titel)}</h1><p class="pf-lead">${esc(b.text)}</p>${kacheln(b)}`;
    }
  }

  // Hell/Dunkel höchstens einmal pro Sekunde umschalten und weich überblenden – kein Flackern beim schnellen Klicken
  let themeSperre = 0;
  document.addEventListener('click', e => {
    const btn = e.target.closest('#themeBtn,#pfTheme');
    if (!btn) return;
    if (Date.now() < themeSperre){ e.stopImmediatePropagation(); e.preventDefault(); return; }
    themeSperre = Date.now() + 1000;
    root.classList.add('pf-fade'); btn.classList.add('pf-gesperrt');
    setTimeout(() => root.classList.remove('pf-fade'), 400);
    setTimeout(() => btn.classList.remove('pf-gesperrt'), 1000);
  }, true);

  function init(){ buildNav(); buildPages(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>/* ../sync.js */
/* vibe learning – Anmeldung und Anbindung an PocketBase
 *
 * Läuft die Seite über den PocketBase-Server, erscheint beim ersten Öffnen ein
 * Anmeldefenster: ein Feld für Code oder Benutzername (bei Benutzernamen folgt das
 * Passwort), alternativ „Seite ohne Anmeldung nutzen“. Oben rechts in der Leiste
 * steht danach, wer angemeldet ist; dort meldet man sich auch an und ab.
 *
 * Schüler: Fortschritt wird auf dem Server gespeichert, jede gelöste Aufgabe protokolliert.
 * Lehrkraft/Admin: Anmeldung gilt bis zum Schließen des Browsers, im Menü steht
 * der Link zur Verwaltung (lehrer.html).
 * Wird die HTML-Datei direkt geöffnet (oder läuft kein PocketBase dahinter),
 * passiert nichts davon – die Seite speichert dann wie bisher nur im Browser.
 *
 * Die Seite ruft auf:
 *   TrainerSync.changed()      nach jeder Änderung am gespeicherten Stand
 *   TrainerSync.event({...})   wenn eine Aufgabe richtig gelöst wurde
 */
(function () {
  'use strict';

  const CONFIG = {
    api: '/api/trainer',
    verwaltung: 'lehrer.html'   // relativ zum Ordner von sync.js
  };

  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const PAGE = document.documentElement.dataset.trainer || '';          // Tool-id aus katalog.js, leer auf Übersichtsseiten
  const TOOL_IDS = window.KATALOG ? [].concat(...window.KATALOG.bereiche.map(b => b.tools.map(t => t.id))) : [];
  const ALL_PREFIXES = [...new Set(['wenn', 'uo', 'fn', PAGE].concat(TOOL_IDS))].filter(Boolean).map(id => id + '-');
  const OWN = PAGE + '-';
  const SKIP = ['wenn-theme'];                                             // Hell/Dunkel bleibt pro Gerät
  const K = {code: 'ts-code', anzeige: 'ts-anzeige', klasse: 'ts-klasse', queue: 'ts-queue', stand: 'ts-stand-' + PAGE};
  const SS = {gast: 'ts-gast', lehrer: 'ts-lehrer'};                      // gilt nur bis zum Schließen des Browsers

  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} },
    keys(){ try { return Object.keys(localStorage); } catch (e) { return []; } }
  };
  const ss = {
    get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  function lehrerSitzung(){ try { return JSON.parse(ss.get(SS.lehrer) || 'null'); } catch (e) { return null; } }

  const hosted = /^https?:$/.test(location.protocol);
  let aktiv = false, pushTimer = null, pushPending = false, menuEl = null, lastSnap = '';

  /* ---------- Hilfen ---------- */
  function api(path, opt){
    opt = opt || {};
    return fetch(CONFIG.api + path, {
      method: opt.method || 'GET',
      keepalive: !!opt.keepalive,
      headers: {'Content-Type': 'application/json', 'X-Trainer-Code': ls.get(K.code) || ''},
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    });
  }
  const trainerKeys = prefix => ls.keys().filter(k => k.startsWith(prefix) && !SKIP.includes(k));
  function snapshot(prefix){ prefix = prefix || OWN; const d = {}; trainerKeys(prefix).sort().forEach(k => { d[k] = ls.get(k); }); return d; }
  function applySnapshot(d, prefix){
    prefix = prefix || OWN;
    trainerKeys(prefix).forEach(k => ls.del(k));
    Object.keys(d || {}).forEach(k => { if (k.startsWith(prefix) && !SKIP.includes(k) && typeof d[k] === 'string') ls.set(k, d[k]); });
  }
  function wipeLocal(){
    ALL_PREFIXES.forEach(p => trainerKeys(p).forEach(k => ls.del(k)));
    ls.keys().filter(k => k.startsWith('ts-stand-')).forEach(k => ls.del(k));
    [K.queue, K.code, K.klasse, K.anzeige].forEach(k => ls.del(k));
  }
  function reloadOnce(){
    let last = 0; try { last = +sessionStorage.getItem('ts-reload') || 0; } catch (e) {}
    if (Date.now() - last < 8000) return;
    try { sessionStorage.setItem('ts-reload', Date.now()); } catch (e) {}
    location.reload();
  }

  /* ---------- Fortschritt abgleichen ---------- */
  async function pull(){
    if (!PAGE){ setStatus('ok'); return; }
    const r = await api('/state?seite=' + PAGE);
    const local = +ls.get(K.stand) || 0, server = +r.stand || 0;
    if (r.daten && server > local){
      const before = JSON.stringify(snapshot());
      applySnapshot(r.daten);
      ls.set(K.stand, server);
      lastSnap = JSON.stringify(snapshot());
      if (lastSnap !== before) reloadOnce();
    } else if (local > server) await push();
    setStatus('ok');
  }

  async function push(keepalive){
    clearTimeout(pushTimer); pushPending = false;
    if (!aktiv || !PAGE) return;
    const stand = +ls.get(K.stand) || Date.now();
    setStatus('saving');
    try {
      await api('/state', {method: 'POST', body: {seite: PAGE, daten: snapshot(), stand}, keepalive});
      setStatus('ok');
    } catch (err){
      if (err.status === 409){ await pull().catch(() => setStatus('offline')); }
      else if (err.status === 401) abgelaufen();
      else { pushPending = true; setStatus('offline'); }
    }
  }

  function changed(){
    if (!PAGE) return;
    // Seiten schreiben ihren Stand auch beim Öffnen neu – nur echte Änderungen zählen,
    // sonst würde ein frisch geöffnetes Gerät einen neueren Stand vom Server überschreiben.
    const snap = JSON.stringify(snapshot());
    if (snap === lastSnap) return;
    lastSnap = snap;
    ls.set(K.stand, Date.now());
    if (!aktiv) return;
    pushPending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }

  /* ---------- Protokoll gelöster Aufgaben ---------- */
  function queue(){ try { return JSON.parse(ls.get(K.queue) || '[]'); } catch (e) { return []; } }
  function event(ev){
    if (!aktiv || !PAGE) return;
    const q = queue(); q.push(Object.assign({seite: PAGE}, ev)); ls.set(K.queue, JSON.stringify(q.slice(-500)));
    flush();
  }
  let flushing = false;
  async function flush(keepalive){
    if (!aktiv || flushing) return;
    const q = queue(); if (!q.length) return;
    flushing = true;
    try {
      await api('/events', {method: 'POST', body: {events: q.slice(0, 200)}, keepalive});
      ls.set(K.queue, JSON.stringify(queue().slice(Math.min(q.length, 200))));
    } catch (err){
      if (err.status === 401) abgelaufen(); else setStatus('offline');
    } finally { flushing = false; }
    if (queue().length && !keepalive) setTimeout(flush, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && aktiv){ if (pushPending) push(true); flush(true); }
  });
  window.addEventListener('online', () => { if (aktiv){ flush(); if (pushPending) push(); else pull().catch(() => {}); } });


  /* ---------- Gast-Fortschritt beim Anmelden übernehmen ---------- */
  // Für jede Übung: Ist das Konto dort noch leer, wird der Stand dieses Geräts hochgeladen,
  // sonst gilt der Stand vom Server.
  async function uebernehmen(){
    for (const p of ALL_PREFIXES){
      const id = p.slice(0, -1), lokal = snapshot(p);
      const st = await api('/state?seite=' + id);
      const leer = !st.daten || !Object.keys(st.daten).length;
      if (leer){
        if (!Object.keys(lokal).length) continue;
        const stand = Date.now();
        await api('/state', {method: 'POST', body: {seite: id, daten: lokal, stand}});
        ls.set('ts-stand-' + id, stand);
      } else {
        applySnapshot(st.daten, p);
        ls.set('ts-stand-' + id, +st.stand || 0);
      }
    }
  }

  /* ---------- Oberfläche: Anmeldefenster + Menü oben rechts ---------- */
  const CSS = `
.ts-ov{position:fixed;inset:0;z-index:2000;background:rgba(20,24,32,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.ts-box{position:relative;background:var(--panel,#f6f8fb);color:var(--text,#2e3440);border:1px solid var(--border,#cdd3de);border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);font:16px/1.5 system-ui,sans-serif}
.ts-box h2{margin:0 0 6px;font-size:21px}
.ts-box p{margin:0 0 14px;color:var(--muted,#5b6578)}

.ts-dd a:hover,.ts-dd button:hover{background:var(--panel2,#eceff4)}

  function injectCss(){ const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); }
  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function setStatus(st){
    const b = menuEl && menuEl.querySelector('.ts-badge');
    if (!b || !aktiv) return;
    b.className = 'ts-badge ' + st;
    const t = {ok: 'Fortschritt gespeichert', saving: 'Wird gespeichert …', offline: 'Keine Verbindung – wird später gespeichert'}[st] || '';
    b.title = t;
    const i = menuEl.querySelector('.ts-status'); if (i) i.textContent = t;
  }

  // Menü oben rechts: angemeldet (Dropdown mit Abmelden) oder Gast (Klick öffnet die Anmeldung)
  function showMenu(){
    if (menuEl) menuEl.remove();
    const host = document.querySelector('.pf-right') || document.querySelector('.hdr-right') || document.querySelector('header') || document.body;
    const L = lehrerSitzung();
    menuEl = document.createElement('div');
    menuEl.className = 'ts-wrap';
    if (aktiv){
      const klasse = ls.get(K.klasse);
      menuEl.innerHTML = `<button class="ts-badge saving" type="button"><span class="ts-dot"></span>👤 <span class="ts-lang">${escH(ls.get(K.anzeige) || ls.get(K.code))}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(ls.get(K.anzeige) || ls.get(K.code))}</b>${klasse ? ' (Klasse ' + escH(klasse) + ')' : ''}<br><span class="ts-status"></span></div>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else if (L){
      menuEl.innerHTML = `<button class="ts-badge" type="button">👤 <span class="ts-lang">${escH(L.name)}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(L.name)}</b> (${L.rolle === 'admin' ? 'Admin' : 'Lehrkraft'})</div>
        <a href="${BASE + CONFIG.verwaltung}">Verwaltung: Klassen und Auswertung</a>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else {
      menuEl.innerHTML = `<button class="ts-badge gast" type="button" title="Fortschritt wird nicht gespeichert. Klicken zum Anmelden."><span class="ts-dot"></span>Nicht angemeldet<span class="ts-lang">&nbsp;– Fortschritt wird nicht gespeichert</span></button>`;
    }
    host.insertBefore(menuEl, host.firstChild);
    menuEl.querySelector('.ts-badge').addEventListener('click', () => {
      if (!aktiv && !L){ showLogin(); return; }
      menuEl.classList.toggle('open');
    });
    const ab = menuEl.querySelector('[data-a="ab"]');
    if (ab) ab.addEventListener('click', abmelden);
    document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) menuEl.classList.remove('open'); });
  }

  function showLogin(msg){
    if (document.querySelector('.ts-ov')) return;
    const ov = document.createElement('div');
    ov.className = 'ts-ov';
    ov.innerHTML = `<div class="ts-box" role="dialog" aria-modal="true" aria-label="Anmelden">
      <button class="ts-x" type="button" aria-label="Schließen und ohne Anmeldung nutzen" title="Ohne Anmeldung nutzen">×</button>
      <form class="ts-f1" autocomplete="off">
        <h2>Anmelden</h2>
        <p>Gib deinen Zugangscode oder deinen Benutzernamen ein.</p>
        <input class="ts-in" name="kennung" placeholder="Code oder Benutzername" autocapitalize="none" spellcheck="false" aria-label="Code oder Benutzername">
        <button class="ts-btn" type="submit">Weiter</button>
      </form>
      <form class="ts-f2" hidden>
        <h2>Passwort</h2>
        <p>für <b class="ts-wer"></b></p>
        <input class="ts-in" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
        <button class="ts-btn" type="submit">Anmelden</button>
        <button class="ts-zurueck" type="button">Anderen Namen eingeben</button>
      </form>
      <div class="ts-err">${msg || ''}</div>
      <button class="ts-gast" type="button">Seite ohne Anmeldung nutzen<small>Dein Fortschritt wird dann nur in diesem Browser gespeichert.</small></button>
    </div>`;
    document.body.appendChild(ov);
    const f1 = ov.querySelector('.ts-f1'), f2 = ov.querySelector('.ts-f2'), err = ov.querySelector('.ts-err');
    const k = f1.kennung, pw = f2.passwort;
    setTimeout(() => k.focus(), 50);

    const gast = () => { ss.set(SS.gast, '1'); ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') gast(); };
    document.addEventListener('keydown', esc);
    ov.querySelector('.ts-x').addEventListener('click', gast);
    ov.querySelector('.ts-gast').addEventListener('click', gast);
    ov.querySelector('.ts-zurueck').addEventListener('click', () => { f2.hidden = true; f1.hidden = false; err.textContent = ''; k.select(); });

    async function senden(btn, body){
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch(CONFIG.api + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
          .then(async x => { const j = await x.json().catch(() => ({})); if (!x.ok) throw new Error(x.status === 429 ? 'Zu viele Versuche – bitte kurz warten.' : (j.message || 'Anmeldung fehlgeschlagen.')); return j; });
        if (r.passwort){ f1.hidden = true; f2.hidden = false; ov.querySelector('.ts-wer').textContent = body.kennung; pw.value = ''; pw.focus(); return; }
        if (r.rolle === 'schueler'){
          ls.set(K.code, r.cred); ls.set(K.anzeige, r.anzeige); ls.set(K.klasse, r.klasse || '');
          ss.del(SS.lehrer); ss.del('ts-reload');
          aktiv = true;
          await uebernehmen().catch(() => {});
        } else {
          ss.set(SS.lehrer, JSON.stringify({rolle: r.rolle, token: r.token, name: r.name}));
        }
        location.reload();
      } catch (x){
        err.textContent = x.message || 'Anmeldung fehlgeschlagen.';
        (f2.hidden ? k : pw).select();
      } finally { btn.disabled = false; }
    }
    f1.addEventListener('submit', e => {
      e.preventDefault();
      const v = k.value.trim();
      if (!v){ err.textContent = 'Bitte gib deinen Code oder Benutzernamen ein.'; return; }
      senden(f1.querySelector('.ts-btn'), {kennung: v});
    });
    f2.addEventListener('submit', e => {
      e.preventDefault();
      if (!pw.value){ err.textContent = 'Bitte gib dein Passwort ein.'; return; }
      senden(f2.querySelector('.ts-btn'), {kennung: k.value.trim(), passwort: pw.value});
    });
  }

  async function abmelden(){
    if (lehrerSitzung()){ ss.del(SS.lehrer); ss.del(SS.gast); location.reload(); return; }
    if (!confirm(`Abmelden?\n\nAngemeldet als ${ls.get(K.anzeige) || ls.get(K.code)}. Dein Fortschritt bleibt auf dem Server gespeichert.`)) return;
    if (pushPending) await push();
    await flush();
    if (queue().length && !confirm('Einige gelöste Aufgaben konnten noch nicht übertragen werden (keine Verbindung). Trotzdem abmelden?')) return;
    wipeLocal(); ss.del(SS.gast);
    location.reload();
  }
  function abgelaufen(){
    aktiv = false;
    wipeLocal();
    showMenu();
    showLogin('Deine Anmeldung ist nicht mehr gültig. Bitte melde dich neu an.');
  }

  /* ---------- Start ---------- */
  async function start(){
    if (!hosted || window.PF_EINZELDATEI) return;          // Einzeldatei: immer ohne Anmeldung, Fortschritt nur im Browser
    try {
      const h = await fetch('/api/health', {cache: 'no-store'});
      if (!h.ok) return;                                    // kein PocketBase: Seite läuft nur lokal
    } catch (e){ return; }
    injectCss();
    aktiv = !!ls.get(K.code);
    showMenu();
    if (!aktiv){
      if (!lehrerSitzung() && !ss.get(SS.gast)) showLogin();
      return;
    }
    try { await pull(); flush(); }
    catch (err){ if (err.status === 401) abgelaufen(); else setStatus('offline'); }
  }

  lastSnap = JSON.stringify(snapshot());   // Stand beim Laden der Seite (vor deren Initialisierung)
  window.TrainerSync = {changed, event, anmelden: () => showLogin(), get aktiv(){ return aktiv; }, get lehrer(){ return lehrerSitzung(); }, abmelden};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<style>/* basis.css */
/* basis.css – gemeinsame Gestaltung aller Excel-Trainer (Nord-Farben, hell/dunkel über [data-theme=dark]).

 * Seitenspezifisches steht im <style> der Seite. */
:root{
  --bg:#e5e9f0; --panel:#f6f8fb; --panel2:#eceff4; --text:#2e3440; --muted:#5b6578; --border:#cdd3de;
  --accent:#5e8a45; --cond:#5e81ac; --then:#5e8a45; --else:#a8434d; --blk-val:#ebcb8b; --blk-val-text:#2e3440;
  --blk-cond:#8a5f84; --blk-sym:#4c566a; --slot:#e5e9f0; --slot-border:#a7b1c2; --ok-bg:#dfe9d6;
  --err-bg:#f1d9db; --err:#a8434d; --solved-bg:#e3ebdc; --solved-border:#a3be8c; --solved-text:#4a7034;

  --r3:#5e8a45; --r4:#b0663f; --r5:#4c8a89;
}
[data-theme=dark]{
  --bg:#2e3440; --panel:#3b4252; --panel2:#434c5e; --text:#eceff4; --muted:#a9b3c4; --border:#4c566a;
  --cond:#81a1c1; --then:#a3be8c; --else:#bf616a; --slot:#434c5e; --slot-border:#616e88; --ok-bg:#3e4a45;
  --err-bg:#4a3c45; --err:#d4848b; --solved-bg:#3e4a45; --solved-border:#6f8a5c; --solved-text:#a3be8c;
  --flame-off:#4c566a; --flame-num-off:#9aa4b8; --blk-val:#ebcb8b; --blk-val-text:#2e3440; --blk-cond:#b48ead;
  --blk-sym:#8a95ab; --on-color:#2e3440; --accent:#a3be8c; --blk-fn:#8fbcbb; --cell:#3b4252; --cellhd:#434c5e;
  --grid:#4c566a; --r0:#81a1c1; --r1:#d4848b; --r2:#b48ead; --r3:#a3be8c; --r4:#d08770; --r5:#8fbcbb;
}
*{box-sizing:border-box}
html,body{margin:0}

<script>/* basis.js */
/* basis.js – gemeinsamer Kern aller Excel-Trainer (wenn, und-oder, funktionen, bezuege)
 *
 * Einbinden (nach dem Markup, vor den eigenen <script>s), dazu genau eine Ergänzung je Seitenart:
 *   Formeln aus Bausteinen (wenn, und-oder):   basis.css + bausteine.css, basis.js + bausteine.js
 *   Tabellenblatt (funktionen, bezuege):       basis.css + tabelle.css,   basis.js + tabelle.js
 * Alles sind globale Namen, kein Build-Schritt, läuft auch per file://.
 *
 * API
 *   $, esc, rand, clamp, rng, shuffle, pick1, ri, C, B, normQuotes, FErr   Helfer und Zufall
 *   store(k, v), load(k)       localStorage unter KEY + k; store meldet TrainerSync.changed()
 *   isSolved(i), markSolved()  gelöste Übung je Stufe (solved[level])
 *   countSolved()              zählt eine gelöste Übung bzw. Endlos-Aufgabe (Serie, Rekord), → „erstmals“
 *   skipTask()                 Endlos: andere Aufgabe, Serie auf 0
 *   renderHeader()             Flammen (Stufen 1 … solange LEVELS[n] existiert), Modusknöpfe, Theme-Symbol
 *   navPfad(), navLernen(idx, n, info)   Knöpfe Prüfen/Zurücksetzen/Zurück/Weiter je Modus
 *   dockHTML(groups)           Dock für Übungen/Endlos; groups = Gruppennamen (Gruppe = letztes STD-Feld)
 *   navClick(e)                Flammen, Modi, Aufgabenwahl, Dock – am Ende des Klick-Handlers aufrufen
 *   Drag & Drop (Maus/Touch)   Ziehen, Ablageziel hervorheben, Einfügemarke in Zeilen (.iw)
 *   AC                         Autovervollständigung wie in Excel für Eingaben mit Klasse .acin
 *   Verdrahtet: #themeBtn, #checkBtn → check(), #nextBtn → nextTask(), #skipBtn → skipTask(),
 *   Escape schließt die Aufgabenwahl.
 *
 * Die Seite (bzw. bausteine.js/tabelle.js) liefert
 *   KEY, LEVELS, STD; let mode, level, pfadIdx, solved, streak, best, endCounted, pickerOpen
 *   check, loadTask, setLevel, setMode, gotoTask, canNext, nextTask, newEndless, renderDock
 *   Drag-Hooks: dragData(b, e) → Zusatzfelder für D (src:true = Quelle blass) oder null;
 *     dropOk(t); applyDrop(d, type, idx, t); dragTap(d) bei Klick ohne Ziehen; optional dragGhost(g)
 *   AC_FN = [{n, v | a, d}]; optional AC.word(before, inp) → getipptes Wort oder null
 *
 * Gerüst einer Seite
 *   <link rel="stylesheet" href="basis.css"><link rel="stylesheet" href="tabelle.css"> … Markup
 *   <script src="basis.js"><\/script><script src="tabelle.js"><\/script>
 *   <script>
 *     const KEY = 'xy-', LEVELS = [null, {name:'…'}], STD = [[…, 1]];
 *     let mode = load('mode') || 'pfad', level = 1, pfadIdx = 0, solved = {}, streak = 0,
 *         best = 0, endCounted = false, pickerOpen = false, …;
 *     function check(){ … logSolved(countSolved()); … }   function loadTask(){ … }  …
 *     if (mode === 'endlos') newEndless();
 *     loadTask();
 *   <\/script>
 */

/* ================= Teil A: alle Seiten ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rand = () => (Math.random() * 1e9) | 0;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick1 = (r, a) => a[Math.floor(r() * a.length)];
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const C = s => `<code>${s}</code>`, B = s => `<b>${s}</b>`;
function normQuotes(s){ return s.replace(/[„“”″«»]/g, '"'); }
class FErr extends Error { constructor(msg){ super(msg); this.name = 'FErr'; } }

/* Speicher (Schlüssel KEY + k) und Fortschritt */
function store(k, v){ try{ localStorage.setItem(KEY + k, v); }catch(e){} if (window.TrainerSync) TrainerSync.changed(); }
function load(k){ try{ return localStorage.getItem(KEY + k); }catch(e){ return null; } }
function isSolved(i){ return (solved[level] || []).includes(i); }
function markSolved(){ const a = solved[level] || (solved[level] = []); if (!a.includes(pfadIdx)){ a.push(pfadIdx); store('solved', JSON.stringify(solved)); } }
function countSolved(){
  if (mode === 'pfad'){ const erstmals = !isSolved(pfadIdx); markSolved(); return erstmals; }
  const erstmals = !endCounted;
  if (!endCounted){ endCounted = true; streak++; if (streak > best){ best = streak; store('best', best); } }
  return erstmals;
}
function skipTask(){ streak = 0; newEndless(); loadTask(); }

/* Kopfzeile, Navigation, Dock */
function renderHeader(){
  let h = '';
  for (let n = 1; LEVELS[n]; n++){
    h += `<button class="flame${n === level ? ' on' : ''}" data-level="${n}" title="Stufe ${n}: ${esc(LEVELS[n].name)}" aria-label="Stufe ${n}" aria-pressed="${n === level}">
      <svg viewBox="0 0 32 40"><path d="M16 2C18 9 27 14 27 26C27 33 22 38 16 38C10 38 5 33 5 26C5 20 9 16 11 11C12 15 13 17 15 18C16 13 17 8 16 2Z"/>
      <text x="16" y="32" text-anchor="middle">${n}</text></svg></button>`;
  }
  $('#flames').innerHTML = h;
  $('#flames').style.display = mode === 'lernen' ? 'none' : '';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
function navButtons(){ return {nb:$('#nextBtn'), pb:$('#prevBtn'), sb:$('#skipBtn'), cb:$('#checkBtn'), rb:$('#resetBtn'), ob:$('#ovBtn')}; }
function navPfad(){
  const {nb, pb, sb, cb, rb, ob} = navButtons();
  cb.style.display = rb.style.display = nb.style.display = ''; if (ob) ob.style.display = 'none';
  pb.style.display = mode === 'pfad' ? '' : 'none'; pb.disabled = pfadIdx === 0;
  sb.style.display = mode === 'endlos' ? '' : 'none';

/* Drag & Drop (Maus + Touch über Pointer Events) */
let D = null, hoverEl = null, insEl = null, scrollRAF = null;
function findTarget(x, y){
  const el = document.elementFromPoint(x, y);
  let t = el && el.closest && el.closest('[data-drop]');
  // ein Baustein darf nicht in sich selbst abgelegt werden (z. B. Wert in den eigenen Baustein)
  while (t && D.el.contains(t)) t = t.parentElement && t.parentElement.closest('[data-drop]');
  return t && dropOk(t) ? t : null;
}
function rowIndex(row, x, y){
  const kids = [...row.querySelectorAll(':scope > .iw')];
  for (let i = 0; i < kids.length; i++){
    const r = kids[i].getBoundingClientRect();
    if (y < r.top) return i;
    if (y <= r.bottom && x < r.left + r.width / 2) return i;
  }
  return kids.length;
}
function clearHover(){
  if (hoverEl){ hoverEl.classList.remove('drop-hover'); hoverEl = null; }
  if (insEl){ insEl.classList.remove('ins', 'ins-after'); insEl = null; }
}
function updateHover(x, y){
  clearHover();
  const t = findTarget(x, y); if (!t) return;
  hoverEl = t; t.classList.add('drop-hover');
  if (t.dataset.drop === 'row'){
    const kids = [...t.querySelectorAll(':scope > .iw')], i = rowIndex(t, x, y);
    if (kids.length){ insEl = i < kids.length ? kids[i] : kids[kids.length - 1]; insEl.classList.add(i < kids.length ? 'ins' : 'ins-after'); }
  }
}
function autoScroll(){
  if (!D || !D.started) return;
  const topEdge = document.querySelector('header').getBoundingClientRect().bottom + 20;
  if (D.y < topEdge) window.scrollBy(0, -8); else if (D.y > innerHeight - 30) window.scrollBy(0, 8);
  updateHover(D.x, D.y);
  scrollRAF = requestAnimationFrame(autoScroll);
}
function endDrag(cancel){
  cancelAnimationFrame(scrollRAF);
  const t = cancel ? null : findTarget(D.x, D.y);
  const idx = t && t.dataset.drop === 'row' ? rowIndex(t, D.x, D.y) : 0;
  clearHover(); D.ghost.remove(); D.el.classList.remove('drag-src'); document.body.classList.remove('dragging');
  const d = D; D = null;
  if (t) applyDrop(d, t.dataset.drop, idx, t);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.block[data-drag]');
  if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const extra = dragData(b, e); if (!extra) return;
  e.preventDefault();
  D = Object.assign({el:b, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, started:false}, extra);
});
window.addEventListener('pointermove', e => {
  if (!D) return;
  D.x = e.clientX; D.y = e.clientY;
  if (!D.started){
    if (Math.hypot(e.clientX - D.x0, e.clientY - D.y0) < 5) return;
    const r = D.el.getBoundingClientRect(), g = D.el.cloneNode(true);
    ['select', 'input'].forEach(sel => { const gs = g.querySelectorAll(sel); D.el.querySelectorAll(sel).forEach((s, i) => { gs[i].value = s.value; }); });
    if (window.dragGhost) dragGhost(g);
    g.classList.add('drag-ghost'); g.classList.remove('drag-src');
    g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g);
    D.ghost = g; D.dx = D.x0 - r.left; D.dy = D.y0 - r.top; D.started = true;
    if (D.src) D.el.classList.add('drag-src');
    document.body.classList.add('dragging');
    autoScroll();
  }
  D.ghost.style.left = (e.clientX - D.dx) + 'px'; D.ghost.style.top = (e.clientY - D.dy) + 'px';
  updateHover(e.clientX, e.clientY);
}, {passive:false});

});

/* Autovervollständigung wie in Excel: Funktionsliste beim Tippen, Argument-Hinweis in Klammern */
const acCanvas = document.createElement('canvas').getContext('2d');
const AC = {list:[], sel:0, key:'', start:0, token:'', closed:'', input:null,
  digits:false,           // Funktionsnamen dürfen Ziffern enthalten (ANZAHL2)
  prev:/[=(;<>\s,]/,      // erlaubtes Zeichen vor dem getippten Wort
  // getipptes Wort am Cursor (oder null); in #ft erst nach einem „=“
  word:(before, inp) => { const m = before.match(/[A-Za-zÄÖÜäöüß]+$/); return m && (inp.id !== 'ft' || before.trimStart().startsWith('=')) ? m[0] : null; }};
function acArgs(f, i){
  if (f.a) return f.a;
  const n = Math.max(2, i + 1), out = [];
  for (let k = 1; k <= n; k++) out.push(k === 1 ? f.v + k : `[${f.v}${k}]`);
  return [...out, '…'];
}
function acCaretX(inp, idx){
  const cs = getComputedStyle(inp), r = inp.getBoundingClientRect();
  acCanvas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  return r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + acCanvas.measureText(inp.value.slice(0, idx)).width - inp.scrollLeft;
}
function acEls(){
  let pop = document.getElementById('acpop'), tip = document.getElementById('actip');
  if (!pop){
    pop = document.createElement('div'); pop.id = 'acpop'; pop.className = 'acpop'; document.body.appendChild(pop);
    tip = document.createElement('div'); tip.id = 'actip'; tip.className = 'actip'; document.body.appendChild(tip);
    pop.addEventListener('pointerdown', e => { const it = e.target.closest('[data-aci]'); e.preventDefault(); if (it){ AC.sel = +it.dataset.aci; acInsert(); } });
  }
  return {pop, tip};
}
function acHide(){ const {pop, tip} = acEls(); pop.style.display = 'none'; tip.style.display = 'none'; AC.list = []; }
function acPlace(el, x, inp){
  const r = inp.getBoundingClientRect();
  el.style.display = 'block';
  el.style.left = Math.max(8, Math.min(x - 6, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = (r.bottom + 4) + 'px';
}
function acUpdate(inp){
  inp = inp || document.activeElement;
  if (!inp || !inp.matches || !inp.matches('.acin') || document.activeElement !== inp){ acHide(); return; }
  AC.input = inp;
  const {pop, tip} = acEls();
  const pos = inp.selectionStart ?? inp.value.length, before = normQuotes(inp.value.slice(0, pos));
  // Zeichen für Zeichen lesen: Textbereiche überspringen, offene Funktionen merken
  const stack = []; let inStr = false, word = '', wstart = 0;
  for (let i = 0; i < before.length; i++){
    const ch = before[i];
    if (ch === '"'){ inStr = !inStr; word = ''; continue; }
    if (inStr) continue;
    if (/[A-Za-zÄÖÜäöüß]/.test(ch) || (AC.digits && word && /[0-9]/.test(ch))){ if (!word) wstart = i; word += ch; continue; }
    if (ch === '(') stack.push({fn:word.toUpperCase(), i:0, at:wstart});
    else if (ch === ';' && stack.length) stack[stack.length - 1].i++;
    else if (ch === ')') stack.pop();
    word = '';
  }
  // Funktionsliste: nur wenn gerade ein Funktionsname getippt wird (nicht in Text, nicht Teil einer Zelle)
  let list = [], token = '', start = pos;
  const w = !inStr && AC.word(before, inp);
  if (w){
    token = w; start = pos - token.length;
    const prev = before[start - 1];
    if (!prev || AC.prev.test(prev)) list = AC_FN.filter(f => f.n.startsWith(token.toUpperCase()));
    if (list.length === 1 && list[0].n === token.toUpperCase() && inp.value[pos] === '(') list = [];
  }
  const key = start + ':' + token.toUpperCase();
  if (AC.closed === key) list = [];
  if (key !== AC.key) AC.sel = 0;
  AC.key = key; AC.token = token; AC.start = start; AC.list = list;
  if (AC.sel >= list.length) AC.sel = 0;
  if (list.length){
    const f = list[AC.sel];
    pop.innerHTML = `<div class="acl">${list.map((x, i) => `<div class="aci${i === AC.sel ? ' sel' : ''}" data-aci="${i}"><span class="acfx">fx</span>${x.n}</div>`).join('')}</div><div class="acdesc">${esc(f.d)}</div><div class="ackey">Tab ↹ fügt ein · ↑ ↓ wählen</div>`;
    acPlace(pop, acCaretX(inp, start), inp);
    tip.style.display = 'none';
    return;
  }
  pop.style.display = 'none';
  const top = stack[stack.length - 1], f = top && AC_FN.find(x => x.n === top.fn);
  if (f){
    const args = acArgs(f, top.i);
    const act = f.a ? Math.min(top.i, args.length - 1) : top.i;
    tip.innerHTML = `<span class="acfn">${f.n}</span>(${args.map((a, i) => i === act ? `<b>${esc(a)}</b>` : esc(a)).join('; ')})`;
    acPlace(tip, acCaretX(inp, top.at), inp);
  } else tip.style.display = 'none';
}
function acInsert(){
  const inp = AC.input, f = AC.list[AC.sel];
  if (!inp || !f) return;
  const pos = inp.selectionStart ?? inp.value.length;
  const after = inp.value.slice(pos), add = after.startsWith('(') ? f.n : f.n + '(';
  inp.value = inp.value.slice(0, AC.start) + add + after;
  const c = AC.start + f.n.length + 1;
  inp.focus(); inp.setSelectionRange(c, c);
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  acUpdate(inp);
}
document.addEventListener('keydown', e => {
  if (!e.target.matches || !e.target.matches('.acin') || !AC.list.length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); AC.sel = (AC.sel + 1) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); AC.sel = (AC.sel - 1 + AC.list.length) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'Tab'){ e.preventDefault(); acInsert(); }
  else if (e.key === 'Escape'){ e.preventDefault(); AC.closed = AC.key; acUpdate(e.target); }
  else if (e.key === 'Enter'){ acHide(); }
}, true);
document.addEventListener('keyup', e => { if (e.target.matches && e.target.matches('.acin') && !['ArrowDown', 'ArrowUp', 'Tab', 'Escape', 'Enter', 'F4'].includes(e.key)) acUpdate(e.target); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.acin')) acUpdate(e.target); });
document.addEventListener('focusout', () => setTimeout(() => acUpdate(), 0));
window.addEventListener('scroll', () => { if (AC.input && document.activeElement === AC.input) acUpdate(AC.input); }, {passive:true});
window.addEventListener('resize', () => acUpdate());

<script>/* tabelle.js */
/* tabelle.js – Ergänzung zu basis.js für Trainer mit Tabellenblatt (funktionen, bezuege)
 * Laden nach basis.js; dazu tabelle.css nach basis.css.
 *
 * API
 *   Rechenwerk: FUNCS, FDESC, GOAL, ALIAS, ENGLISH, CELLRE, colN, colL, addr, ad, normRef, rangeCells,
 *     normRange, tokenize, parseFormula, refsOf, cellsOfRefs, fnsOf, numsOf, topCall, refsInText,
 *     E, toNum, evalAst, callFn, parseCached, Sheet(cells).val(a), same, fmtNum, fmtVal(v, 'eur'|'usd'|'pct')
 *   Erklärung (learn = {topic, prog:{id:{idx, done}}}): topic, prog, saveLearn, stepDone, markStep,
 *     firstOpen, stepUnlocked, curStep, gotoStep, openTopic, overview
 *   setMode, gotoTask, canNext, nextTask, renderNav, renderDock, renderOverview(introHtml),
 *   renderFeedback, renderChoice(st), checkChoice(), hint(msg)
 *   topicClick(e)   Antworten, Themen, Schritte, Übersicht, dann navClick – am Ende des Klick-Handlers
 *   caret, setCaret, focusInp, applyPT, cellAt, endPT, gridEl, trackCaret   Bezüge mit der Maus einfügen
 *   Verdrahtet: #ovBtn, #prevBtn, #resetBtn, Eingabe in .pin → syncInput, Maus-Ende im #grid
 *
 * Die Seite liefert
 *   TOPICS, GROUPS, AC_FN; let learn, endPick, CUR, S, LS, PT
 *   render, resetS, loadStep, newEndless, setLevel, clearMarks, syncInput(inp, keepSel), logSolved
 */


const FUNCS = ['SUMME', 'MITTELWERT', 'MIN', 'MAX', 'ANZAHL', 'ANZAHL2'];
const FDESC = {
  SUMME:'addiert alle Zahlen',
  MITTELWERT:'berechnet den Durchschnitt',
  MIN:'liefert den kleinsten Wert',
  MAX:'liefert den größten Wert',
  ANZAHL:'zählt die Zellen, in denen eine Zahl steht',
  ANZAHL2:'zählt alle Zellen, die nicht leer sind – auch Zellen mit Text'
};
const GOAL = {SUMME:'die Summe (alles zusammen)', MITTELWERT:'der Durchschnitt', MIN:'der kleinste Wert', MAX:'der größte Wert',
  ANZAHL:'die Anzahl der Zellen mit einer Zahl', ANZAHL2:'die Anzahl aller Einträge'};
// englische oder falsche Funktionsnamen -> Hinweis
const ALIAS = {SUM:'SUMME', AVERAGE:'MITTELWERT', COUNT:'ANZAHL', COUNTA:'ANZAHL2', MINIMUM:'MIN', MAXIMUM:'MAX',
  DURCHSCHNITT:'MITTELWERT', MITTEL:'MITTELWERT', MITTELWERTE:'MITTELWERT', SUMMEN:'SUMME', SUM2:'SUMME', SUMM:'SUMME', SUME:'SUMME',
  ANZAL:'ANZAHL', ANZAHL1:'ANZAHL', ANZAL2:'ANZAHL2', ZÄHLEN:'ANZAHL', ANZAHLZWEI:'ANZAHL2'};
const ENGLISH = ['SUM', 'AVERAGE', 'COUNT', 'COUNTA'];


/* ---- Zellbezüge ---- */
const CELLRE = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,5})$/;
const colN = L => L.toUpperCase().split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
function colL(n){ let s = ''; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function addr(s){ const m = String(s).match(CELLRE); return m ? {c:colN(m[1]), r:+m[2]} : null; }
const ad = (c, r) => colL(c) + r;
const normRef = s => { const a = addr(s); return ad(a.c, a.r); };
function rangeCells(a, b){
  const x = addr(a), y = addr(b), out = [];
  for (let r = Math.min(x.r, y.r); r <= Math.max(x.r, y.r); r++)
    for (let c = Math.min(x.c, y.c); c <= Math.max(x.c, y.c); c++) out.push(ad(c, r));
  return out;
}
function normRange(a, b){
  const x = addr(a), y = addr(b);
  return ad(Math.min(x.c, y.c), Math.min(x.r, y.r)) + ':' + ad(Math.max(x.c, y.c), Math.max(x.r, y.r));
}

/* ---- Zerlegen ---- */
function tokenize(src){
  const t = []; let i = 0; const n = src.length;
  const isL = ch => /[A-Za-zÄÖÜäöüß$]/.test(ch);
  while (i < n){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '"'){
      i++; let v = '', closed = false;
      while (i < n){ if (src[i] === '"'){ if (src[i+1] === '"'){ v += '"'; i += 2; continue; } closed = true; i++; break; } v += src[i++]; }
      if (!closed) throw new FErr('Ein Anführungszeichen wurde geöffnet, aber nicht wieder geschlossen.');
      t.push({type:'str', v}); continue;
    }
    if (/[0-9]/.test(c)){
      let j = i; while (j < n && /[0-9]/.test(src[j])) j++;
      if (src[j] === ',' && /[0-9]/.test(src[j+1] || '')){ j++; while (j < n && /[0-9]/.test(src[j])) j++; }
      if (src[j] === '.' && /[0-9]/.test(src[j+1] || '')) throw new FErr('Dezimalzahlen schreibt man im deutschen Excel mit Komma, z. B. 0,25.');
      if (j < n && isL(src[j])){ let k = j; while (k < n && /[A-Za-z0-9]/.test(src[k])) k++; throw new FErr(`„${src.slice(i, k)}“ verstehe ich nicht. Ein Zellbezug beginnt mit dem Buchstaben der Spalte, z. B. B4.`); }
      t.push({type:'num', v:parseFloat(src.slice(i, j).replace(',', '.'))}); i = j; continue;
    }
    if (isL(c)){
      let j = i; while (j < n && /[A-Za-z0-9ÄÖÜäöüß$_.]/.test(src[j])) j++;
      const w = src.slice(i, j), up = w.toUpperCase();
      let k = j; while (k < n && /\s/.test(src[k])) k++;
      if (src[k] === '('){ t.push({type:'fn', v:up.replace(/\./g, '')}); i = j; continue; }
      if (CELLRE.test(w)){ t.push({type:'ref', v:normRef(w)}); i = j; continue; }
      if (FUNCS.includes(up)) throw new FErr(`Nach ${up} muss eine Klammer folgen: ${up}(…)`);
      if (/^\$?[A-Za-z]{1,3}\$?\d+\$?[A-Za-z]{1,3}\$?\d+$/.test(w)) throw new FErr(`Zwischen den Zellen in „${w}“ fehlt etwas. Für einen Bereich schreibst du einen Doppelpunkt, z. B. B4:B8.`);
      if (ALIAS[up]) throw new FErr(`Meinst du ${ALIAS[up]}? Nach dem Funktionsnamen folgt eine Klammer: ${ALIAS[up]}(…)`);
      throw new FErr(`„${w}“ ist weder ein Zellbezug (wie B4) noch eine Funktion.`);
    }
    if ('+-*/^();:'.includes(c)){ t.push({type:'op', v:c}); i++; continue; }
    if (c === ',') throw new FErr('Im deutschen Excel trennt man die Teile einer Funktion mit einem Semikolon ; – und einen Bereich „von … bis“ schreibt man mit Doppelpunkt, z. B. B4:B8.');
    if (c === '=') throw new FErr('Das = steht nur einmal ganz am Anfang der Formel.');
    if (c === '<' || c === '>') throw new FErr('Vergleiche mit < oder > brauchst du hier nicht.');
    if (c === '€' || c === '%') throw new FErr(`Das Zeichen ${c} gehört nicht in die Formel. Schreibe nur die Zahl bzw. den Zellbezug.`);
    throw new FErr(`Das Zeichen „${c}“ gehört nicht in eine Formel.`);
  }
  return t;
}

/* ---- Parser: + - * / ^, Klammern, Funktionen mit Bereichen ---- */
function noRange(n){ if (n.k === 'range') throw new FErr(`Ein Bereich wie ${n.a}:${n.b} funktioniert nur in einer Funktion, z. B. =SUMME(${n.a}:${n.b}).`); return n; }
function parseFormula(raw){
  const s = normQuotes(String(raw)).trim();
  if (!s) throw new FErr('Gib zuerst eine Formel ein.');
  if (s[0] !== '=') throw new FErr('Eine Formel beginnt in Excel immer mit einem Gleichheitszeichen =.');
  const toks = tokenize(s.slice(1)); let p = 0;
  if (!toks.length) throw new FErr('Nach dem = fehlt noch die Formel.');
  const peek = () => toks[p], next = () => toks[p++];
  const isOp = (t, v) => t && t.type === 'op' && t.v === v;
  function expr(){ let a = term(); while (isOp(peek(), '+') || isOp(peek(), '-')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(term())}; } return a; }
  function term(){ let a = factor(); while (isOp(peek(), '*') || isOp(peek(), '/')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(factor())}; } return a; }
  function factor(){ if (isOp(peek(), '-') || isOp(peek(), '+')){ const o = next().v; return {k:'neg', o, a:noRange(factor())}; } return power(); }
  function power(){ let a = atom(); if (isOp(peek(), '^')){ next(); a = {k:'bin', o:'^', a:noRange(a), b:noRange(factor())}; } return a; }
  function atom(){
    const t = next();
    if (!t) throw new FErr('Die Formel hört zu früh auf – am Ende fehlt noch etwas.');
    if (t.type === 'num') return {k:'num', v:t.v};
    if (t.type === 'str') return {k:'str', v:t.v};
    if (t.type === 'ref'){
      if (isOp(peek(), ':')){
        next(); const u = next();
        if (!u || u.type !== 'ref') throw new FErr('Nach dem Doppelpunkt muss eine Zelle folgen, z. B. B4:B8.');
        return {k:'range', a:t.v, b:u.v};
      }
      return {k:'ref', v:t.v};
    }
    if (t.type === 'fn'){
      const name = t.v; next(); // (
      if (!FUNCS.includes(name)){
        if (ENGLISH.includes(name)) throw new FErr(`Im deutschen Excel heißt die Funktion ${ALIAS[name]} statt ${name}.`);
        if (ALIAS[name]) throw new FErr(`Die Funktion heißt ${ALIAS[name]}, nicht ${name}.`);
        if (CELLRE.test(name)) throw new FErr(`Nach der Zelle ${name} darf keine Klammer folgen. Fehlt ein Rechenzeichen?`);
        throw new FErr(`Die Funktion ${name} gibt es hier nicht. Du brauchst SUMME, MITTELWERT, MIN, MAX, ANZAHL oder ANZAHL2.`);
      }
      if (isOp(peek(), ')')){ next(); throw new FErr(`In die Klammer von ${name} gehört ein Bereich, z. B. ${name}(B4:B8).`); }
      const args = [];
      for (;;){
        if (isOp(peek(), ';') || isOp(peek(), ')')) throw new FErr(`In ${name}(…) fehlt zwischen den Semikolons etwas.`);
        args.push(expr());
        const u = next();
        if (!u) throw new FErr(`Es fehlt die schließende Klammer ) von ${name}.`);
        if (isOp(u, ';')) continue;
        if (isOp(u, ')')) break;
        if (isOp(u, ':')) throw new FErr('Vor und nach dem Doppelpunkt muss je eine Zelle stehen, z. B. B4:B8.');
        throw new FErr(`In ${name}(…) fehlt ein ; oder ein Rechenzeichen zwischen zwei Teilen.`);
      }
      return {k:'call', name, args};
    }
    if (isOp(t, '(')){
      const e = expr(), u = next();
      if (!isOp(u, ')')) throw new FErr('Es fehlt eine schließende Klammer ).');
      return {k:'par', a:noRange(e)};
    }
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel oder an der falschen Stelle.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; trennt nur die Teile innerhalb einer Funktion, z. B. SUMME(B4:B8;D4:D8).');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine Zelle stehen, z. B. B4:B8.');
    throw new FErr(`Das Zeichen ${t.v} steht an der falschen Stelle.`);
  }
  const ast = expr();
  if (p < toks.length){
    const t = toks[p];
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; steht außerhalb einer Funktion. Steht die Klammer ) zu früh?');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine einzelne Zelle stehen, z. B. B4:B8.');
    throw new FErr('Zwischen zwei Teilen der Formel fehlt ein Rechenzeichen.');

  return noRange(ast);
}

function refsOf(n, out = []){

  else if (n.k === 'bin'){ fnsOf(n.a, out); fnsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') fnsOf(n.a, out);

}

  if (!n) return out;

  else if (n.k === 'call') n.args.forEach(x => numsOf(x, out));

function refsInText(s){
  const out = []; let inStr = false, chunk = '';
  const scan = c => { const re = /(^|[^A-Za-z0-9_$ÄÖÜäöüß])(\$?[A-Za-z]{1,3}\$?\d{1,5})(?:\s*:\s*(\$?[A-Za-z]{1,3}\$?\d{1,5}))?(?![A-Za-z0-9(])/g; let m;
    while ((m = re.exec(c))){ const a = normRef(m[2]), b = m[3] ? normRef(m[3]) : a; out.push({a, b, txt:m[3] ? `${a}:${b}` : a}); re.lastIndex = m.index + m[0].length; } };

function evalAst(n, sh){
  switch (n.k){
    case 'num': return {t:'num', v:n.v};
    case 'str': return {t:'str', v:n.v};
    case 'ref': return sh.val(n.v);
    case 'par': return evalAst(n.a, sh);
    case 'neg': { const x = toNum(evalAst(n.a, sh)); return x.t === 'err' ? x : {t:'num', v:n.o === '-' ? -x.v : x.v}; }

  const vals = [];

    if (a.k === 'range') rangeCells(a.a, a.b).forEach(c => vals.push({x:sh.val(c), ref:true}));
    else if (a.k === 'ref') vals.push({x:sh.val(a.v), ref:true});

  if (n.name === 'ANZAHL2') return {t:'num', v:vals.filter(o => o.x.t !== 'empty').length};
  const nums = [];
  for (const o of vals){
    if (o.x.t === 'err') return o.x;

    if (typeof v !== 'number'){ out[k] = v; continue; }
    let w;
    if (Number.isInteger(v)) w = v <= 0 ? v + ri(r, -6, 6) || 1 : Math.max(1, Math.round(v * (0.5 + r() * 1.2)));
    else if (v > 0 && v < 1) w = rd(r, 0.02, 0.45, 2);
    else w = +(v * (0.5 + r() * 1.2)).toFixed(2);
    if (w === v) w = v + 1;
    out[k] = w;
  }
  return out;
}

// Formel in Bausteine zerlegen: Funktion mit Klammer, Zellbezug, Zahl oder einzelnes Zeichen
function piecesOf(ref){
  const out = []; let i = 0;
  while (i < ref.length){
    const rest = ref.slice(i); let m;
    if ((m = rest.match(/^[A-ZÄÖÜ]{2,}\d*\(/))) out.push({lit:m[0]});
    else if ((m = rest.match(/^\$?[A-Z]{1,3}\$?\d{1,5}/))) out.push({cell:true, raw:m[0]});
    else if ((m = rest.match(/^\d+(,\d+)?/))) out.push({lit:m[0]});
    else { m = [rest[0]]; out.push({lit:m[0]}); }
    i += m[0].length;
  }
  return out;
}

  {id:'absolut', name:'Feste Bezüge: $B$2', desc:'Wenn alle Zeilen dieselbe Zelle brauchen – zum Beispiel einen Kurs oder Steuersatz.', steps:[
    {type:'info', title:'Das Problem', sheet:{gid:'kurs', seed:13, formula:'=B4*B2', sel:'C5'}, html:`
      <p>Lena rechnet Euro in Dollar um. In B5 steht <code>=B4*B2</code> – das stimmt. Nach dem Übertragen nach rechts kommt aber in C5 bis F5 <b>0</b> heraus.</p>

      <p>In B5 steht jetzt <code>=B4*$B$2</code>. Klicke auf C5, D5 …: B4 wandert mit, $B$2 bleibt.</p>

    {type:'choice', title:'Frage: Welche Formel?', mono:true, html:'<p>Welche Formel in B5 kann man richtig nach rechts übertragen? Der Kurs steht in B2, die Euro-Beträge in Zeile 4.</p>',
      options:['=B4*B2', '=B4*$B$2', '=$B$4*$B$2', '=$B$4*B2'], correct:[1],
      why:{0:'Aus B2 wird beim Übertragen C2, D2 … – dort steht kein Kurs.', 2:'Mit $B$4 rechnet jede Spalte mit dem Betrag aus B4. Der Betrag soll aber mitwandern.', 3:'Genau falsch herum: Der Betrag soll mitwandern, der Kurs soll fest bleiben.'}},
    {type:'choice', title:'Frage: nach unten', mono:true, html:'<p>In C5 steht <code>=B5*$B$2</code>. Die Formel wird nach unten übertragen. Was steht dann in <b>C8</b>?</p>',
      options:['=B8*$B$2', '=B8*$B$5', '=B5*$B$2', '=C8*$C$2'], correct:[0],
      why:{1:'$B$2 bleibt immer B2 – das $ vor der 2 hält die Zeile fest.', 2:'B5 hat kein $, also wandert es mit.', 3:'Nach unten bleiben die Buchstaben gleich.'}},
    {type:'task', title:'$ setzen', task:['kurs', 13, 1], html:'<p>Setze die $-Zeichen in die Formel. Tipp: Klicke in den Bezug und drücke F4 oder den Knopf <code>$ F4</code>.</p>'},
    {type:'task', title:'Zellen auswählen', task:['lohn', 14, 2], html:'<p>Jetzt wählst du die Zellen selbst aus und setzt die $-Zeichen.</p>'},
