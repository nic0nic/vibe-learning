/* Inhaltsverzeichnis der Übungsplattform

 * Das ist die einzige Stelle, an der ein neues Tool eingetragen werden muss.
 * Menüleiste, Startseite, Bereichsseiten, Speichern und Lehrerbereich lesen von hier.
 *
 * Aufbau:   Fach → (Jahrgangsstufe) → Bereich → Tool. Ordner in pb_public: <Fach>/<Bereich>/
 *           bzw. <Fach>/<Stufe>/<Bereich>/, z. B. IT/excel/wenn.html, BWR/9II/anlagen/…
 * Fach:     id      = Ordnername (z. B. IT, BWR), titel = Anzeige im Fach-Menü, text = Untertitel der Startseite

 * Bereich:  id      = Name des Unterordners (nur a–z, 0–9, -), über alle Fächer eindeutig
 *           titel   = Text in der Menüleiste
 *           farbe   = Akzentfarbe im dunklen Design (Nord-Farben, nordtheme.com),

 * Tool:     id      = Kürzel für Speicherstand und Auswertung, über alle Fächer eindeutig (nie mehr ändern,

 * Am Ende berechnet: KATALOG.gruppen = [{pfad, fach, stufe, titel, text, bereiche}] (Fach bzw. Fach + Stufe)

// Gruppen (Fach bzw. Fach + Jahrgangsstufe) und alle Bereiche mit Ordner, für nav.js, sync.js und lehrer.html
(function (K) {
  K.gruppen = [];
  K.faecher.forEach(f => (f.stufen
    ? f.stufen.map(s => ({pfad: f.id + '/' + s.id, fach: f, stufe: s, titel: f.titel + ' ' + (s.kurz || s.titel), text: s.text || f.text, bereiche: s.bereiche}))
    : [{pfad: f.id, fach: f, stufe: null, titel: f.titel, text: f.text, bereiche: f.bereiche}]).forEach(g => K.gruppen.push(g)));
  K.bereiche = [].concat(...K.gruppen.map(g => g.bereiche.map(b => Object.assign(b, {pfad: g.pfad + '/' + b.id, gruppe: g}))));
  (K.einreichungen || []).forEach(e => {
    const b = K.bereiche.find(x => x.id === e.bereich);
    if (b && e.tool && !b.tools.some(t => t.id === e.tool.id)) b.tools.push(e.tool);
  });
})(window.KATALOG);

<script>/* ../../../nav.js */
/* Menüleiste der Übungsplattform
 *
 * Baut oben auf jeder Seite die Leiste: vorne das Fach-Menü (IT, BWR › Jahrgangsstufe 9 …),
 * dahinter die Bereiche des gewählten Fachs aus katalog.js.
 * Fährt man mit der Maus über einen Bereich (am Handy: antippen), klappen
 * dessen Übungen auf. Außerdem füllt das Skript die Startseite bzw. Fachseite (#pf-start),
 * die Auswahl der Jahrgangsstufe (#pf-fach) und die Übersichtsseite eines Bereichs (#pf-bereich).
 * Das zuletzt gewählte Fach merkt sich der Browser (localStorage pf-fach) für die Startseite.
 *
 * Fehlt katalog.js oder nav.js, läuft das Tool trotzdem – nur ohne Menüleiste.
 * Tools mit gruppe (katalog.js) stehen im Menü in einem Untermenü (klappt beim Darüberfahren auf)
 * und auf der Bereichsseite unter einer Zwischenüberschrift.
 * Tools mit bedingt: true (katalog.js) sind zunächst ausgeblendet; sync.js blendet sie ein,
 * wenn der Server sie für den angemeldeten Schüler freigibt (Klasse pf-sichtbar).
 * In Einzeldateien (werkzeuge/einzeldateien.py, window.PF_EINZELDATEI) zeigt die
 * Leiste nur Name und Hell/Dunkel-Knopf, weil es keine anderen Seiten gibt.
 * Unten auf jeder Seite (außer Einzeldateien) stehen Links zu Impressum und Datenschutz (pb_public/impressum.html, datenschutz.html).
 */
(function () {
  'use strict';
  const K = window.KATALOG;
  if (!K) return;

  // Wurzel der Plattform = Ordner, in dem nav.js liegt (funktioniert auch per Doppelklick)
  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const root = document.documentElement;
  const TOOL = root.dataset.trainer || '';
  // Aktueller Bereich: über das Tool oder <html data-bereich="IT/excel">.
  // Aktuelle Gruppe (Fach bzw. Fach + Jahrgangsstufe): über den Bereich, <html data-gruppe="BWR/9II">
  // oder <html data-fach="BWR">, sonst die zuletzt gewählte (localStorage pf-fach), sonst die erste.
  const BER = K.bereiche.find(b => b.tools.some(t => t.id === TOOL)) || K.bereiche.find(b => b.pfad === root.dataset.bereich) || null;
  const BEREICH = BER ? BER.id : '';
  const FACHSEITE = K.faecher.find(f => f.id === root.dataset.fach) || null;
  let GRUPPE = BER ? BER.gruppe : K.gruppen.find(g => g.pfad === root.dataset.gruppe) || (FACHSEITE && K.gruppen.find(g => g.fach === FACHSEITE));
  if (GRUPPE){ try { localStorage.setItem('pf-fach', GRUPPE.pfad); } catch (e) {} }
  else {
    let zuletzt = null;
    try { zuletzt = localStorage.getItem('pf-fach'); } catch (e) {}
    GRUPPE = K.gruppen.find(g => g.pfad === zuletzt) || K.gruppen[0];
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const bereichUrl = b => BASE + b.pfad + '/index.html';
  const toolUrl = (b, t) => BASE + b.pfad + '/' + t.datei;
  const gruppeUrl = g => BASE + g.pfad + '/index.html';
  const fachUrl = f => BASE + f.id + '/index.html';

  const CSS = `

  // Farben der Bereiche (katalog.js: farbe = dunkles Design, farbeHell = helles Design,
  // farbeSchrift = optional hellerer Ton für Schrift im dunklen Design).
  // --accent gilt für die ganze Seite des aktuellen Bereichs, --bc nur für den eigenen Menüpunkt.
  function akzentCss(){
    let css = '';
    K.bereiche.forEach(b => {
      if (!b.farbe) return;
      const dunkel = b.farbeSchrift || b.farbe;
      css += `\n.pf-item[data-b="${b.id}"]{--bc:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark] .pf-item[data-b="${b.id}"]{--bc:${dunkel}}`;
      if (b.id === BEREICH) css += `\nhtml[data-theme]{--accent:${b.farbeHell || b.farbe};--accent-text:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark]{--accent:${b.farbe};--accent-text:${dunkel}}`;
    });
    return css;
  }

  const SONNE = '☀', MOND = '☾';
  function theme(){ return root.dataset.theme === 'dark' ? 'dark' : 'light'; }

  // Tools derselben gruppe (katalog.js) hintereinander → [{name, tools}], ohne gruppe: name ''
  function gruppen(b){
    const out = [];
    b.tools.forEach(t => {
      const g = out[out.length - 1];
      if (g && g.name === (t.gruppe || '')) g.tools.push(t); else out.push({name: t.gruppe || '', tools: [t]});
    });
    return out;
  }
  const toolLi = (b, t) => `<li${t.bedingt ? ` class="pf-bedingt" data-tool="${esc(t.id)}"` : ''}><a href="${toolUrl(b, t)}"${t.id === TOOL ? ' aria-current="page"' : ''}>${esc(t.titel)}</a></li>`;

  // Fach-Menü: Fächer ohne Stufen direkt, Fächer mit Jahrgangsstufen als Untermenü (wie gruppe bei Tools)
  function fachMenue(){
    const eintrag = (g, text) => `<li><a href="${gruppeUrl(g)}"${g === GRUPPE ? ' aria-current="page"' : ''}>${esc(text)}</a></li>`;
    return `<li class="pf-item pf-fach"><a href="${gruppeUrl(GRUPPE)}" aria-haspopup="true" title="Fach wechseln"><small>Fach</small> ${esc(GRUPPE.titel)}</a>
      <ul class="pf-drop">${K.faecher.map(f => f.stufen
        ? `<li class="pf-sub"><a href="${fachUrl(f)}"${GRUPPE.fach === f ? ' aria-current="true"' : ''} aria-haspopup="true">${esc(f.titel)}</a><ul class="pf-drop2">${f.stufen.map(st => eintrag(K.gruppen.find(g => g.stufe === st), st.titel)).join('')}</ul></li>`
        : eintrag(K.gruppen.find(g => g.fach === f), f.titel)).join('')}</ul></li>`;
  }

  function buildNav(){
    const s = document.createElement('style'); s.textContent = CSS + akzentCss(); document.head.appendChild(s);
    const nav = document.createElement('nav');
    nav.className = 'pf-nav' + (window.PF_EINZELDATEI ? ' pf-einzeln' : '');
    nav.setAttribute('aria-label', 'Bereiche');
    const name = esc(K.name).replace(/^(\S+)/, '<span>$1</span>');
    const EINZELN = !!window.PF_EINZELDATEI;
    nav.innerHTML = `<div class="pf-in">
      ${EINZELN ? `<span class="pf-brand">${name}</span>` : `<a class="pf-brand" href="${BASE}index.html">${name}</a>`}
      <ul class="pf-menu">${fachMenue()}${GRUPPE.bereiche.map(b => `
        <li class="pf-item" data-b="${esc(b.id)}">
          <a href="${bereichUrl(b)}"${b.id === BEREICH ? ' aria-current="true"' : ''}>${esc(b.titel)}</a>
          <ul class="pf-drop">${b.tools.length
            ? gruppen(b).map(g => g.name
              ? `<li class="pf-sub"><a href="${bereichUrl(b)}"${g.tools.some(t => t.id === TOOL) ? ' aria-current="true"' : ''} aria-haspopup="true">${esc(g.name)}</a><ul class="pf-drop2">${g.tools.map(t => toolLi(b, t)).join('')}</ul></li>`
              : g.tools.map(t => toolLi(b, t)).join('')).join('')
              + `<li><a class="pf-all" href="${bereichUrl(b)}">Alle Übungen zu ${esc(b.titel)}</a></li>`
            : '<li class="pf-leer">Hier entstehen bald Übungen.</li>'}
          </ul>
        </li>`).join('')}
      </ul>
      <div class="pf-right">
        ${document.getElementById('themeBtn') ? '' : `<button class="pf-btn" id="pfTheme" type="button" aria-label="Hell/Dunkel umschalten">${theme() === 'dark' ? SONNE : MOND}</button>`}
        ${EINZELN ? '' : '<button class="pf-btn pf-burger" type="button" aria-label="Menü">☰</button>'}
      </div>
    </div>`;
    document.body.insertBefore(nav, document.body.firstChild);
    if (!EINZELN){
      const fuss = document.createElement('footer');
      fuss.className = 'pf-fuss';
      fuss.innerHTML = `<a href="${BASE}impressum.html">Impressum</a> · <a href="${BASE}datenschutz.html">Datenschutz</a>`;
      document.body.appendChild(fuss);
    }

    // Passt die Leiste nicht in die Breite (Fach-Menü, lange Bereichsnamen, Anmeldung), kommt das Menü hinter ☰
    const innen = nav.querySelector('.pf-in');
    // Erst den Zusatz „– Fortschritt wird nicht gespeichert“ weglassen (pf-knapp), erst dann ☰ (pf-eng)
    const voll = () => innen.scrollWidth > innen.clientWidth + 1;
    const platz = () => {
      nav.classList.remove('pf-eng', 'pf-knapp');
      if (EINZELN || !voll()) return;
      nav.classList.add('pf-knapp');
      if (voll()) nav.classList.add('pf-eng');
    };
    platz();
    addEventListener('resize', platz);
    new MutationObserver(platz).observe(nav.querySelector('.pf-right'), {childList: true, subtree: true, characterData: true});
    if (document.fonts) document.fonts.ready.then(platz);
    const schmal = () => matchMedia('(max-width:760px)').matches || nav.classList.contains('pf-eng');

    const burger = nav.querySelector('.pf-burger');
    if (burger) burger.addEventListener('click', () => nav.classList.toggle('open'));
    const tb = nav.querySelector('#pfTheme');
    if (tb) tb.addEventListener('click', () => {
      const t = theme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = t; tb.textContent = t === 'dark' ? SONNE : MOND;
      try { localStorage.setItem('wenn-theme', t); } catch (e) {}
    });

    // Geräte ohne Maus: erstes Antippen klappt auf, zweites öffnet die Bereichsseite
    const items = [...nav.querySelectorAll('.pf-item')];
    if (matchMedia('(hover: none)').matches) items.forEach(li => li.firstElementChild.addEventListener('click', e => {
      if (schmal() || li.classList.contains('open')) return;
      e.preventDefault();
      items.forEach(x => x.classList.toggle('open', x === li));
    }));
    // Untermenüs (gruppe): nach links aufklappen, wenn rechts kein Platz ist; ohne Maus erst antippen
    nav.querySelectorAll('.pf-sub').forEach(sub => {
      sub.addEventListener('mouseenter', () => {
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
      });
      if (matchMedia('(hover: none)').matches) sub.firstElementChild.addEventListener('click', e => {
        if (schmal() || sub.classList.contains('open')) return;
        e.preventDefault();
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
        sub.classList.add('open');
      });
    });
    document.addEventListener('click', e => { if (!nav.contains(e.target)){ nav.querySelectorAll('.pf-sub.open').forEach(x => x.classList.remove('open')); items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
  }

  /* ---------- Übersichtsseiten ---------- */
  // Tools mit gruppe (katalog.js) stehen unter einer gemeinsamen Zwischenüberschrift
  function kacheln(b){
    if (!b.tools.length) return '<p class="pf-hinweis">Hier entstehen bald Übungen.</p>';
    const kachel = t => `<a class="pf-tile${t.bedingt ? ' pf-bedingt' : ''}"${t.bedingt ? ` data-tool="${esc(t.id)}"` : ''} href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`;
    return gruppen(b).map(g => (g.name ? `<h3 class="pf-gruppe">${esc(g.name)}</h3>` : '') + `<div class="pf-grid">${g.tools.map(kachel).join('')}</div>`).join('');
  }
  function buildPages(){
    const start = document.getElementById('pf-start');
    if (start){
      const gruppenseite = !!root.dataset.gruppe;
      if (gruppenseite) document.title = GRUPPE.titel + ' – ' + K.name;
      start.innerHTML = `<h1>${esc(gruppenseite ? GRUPPE.titel : K.name)}</h1><p class="pf-lead">${esc(GRUPPE.text)}${gruppenseite ? '' : ' ' + esc(K.untertitel)}</p>`
        + GRUPPE.bereiche.map(b => `<section class="pf-sec"><h2><a href="${bereichUrl(b)}">${esc(b.titel)}</a></h2><p class="pf-text">${esc(b.text)}</p>${kacheln(b)}</section>`).join('');
    }
    // Fach mit Jahrgangsstufen: Auswahl der Stufe
    const fach = document.getElementById('pf-fach');
    if (fach && FACHSEITE){
      document.title = FACHSEITE.titel + ' – ' + K.name;
      fach.innerHTML = `<h1>${esc(FACHSEITE.titel)}</h1><p class="pf-lead">${esc(FACHSEITE.text)} Wähle die Jahrgangsstufe.</p><div class="pf-grid">`
        + K.gruppen.filter(g => g.fach === FACHSEITE).map(g => `<a class="pf-tile" href="${gruppeUrl(g)}"><b>${esc(g.stufe.titel)}</b><span>${esc(g.text)}</span></a>`).join('') + '</div>';
    }
    const be = document.getElementById('pf-bereich');
    const b = BER;
    if (be && b){
      document.title = b.titel + ' – ' + K.name;
      be.innerHTML = `<h1>${esc(b.titel)}</h1><p class="pf-lead">${esc(b.text)}</p>${kacheln(b)}`;
    }
  }

  // Hell/Dunkel höchstens einmal pro Sekunde umschalten und weich überblenden – kein Flackern beim schnellen Klicken
  let themeSperre = 0;
  document.addEventListener('click', e => {
    const btn = e.target.closest('#themeBtn,#pfTheme');
    if (!btn) return;
    if (Date.now() < themeSperre){ e.stopImmediatePropagation(); e.preventDefault(); return; }
    themeSperre = Date.now() + 1000;
    root.classList.add('pf-fade'); btn.classList.add('pf-gesperrt');
    setTimeout(() => root.classList.remove('pf-fade'), 400);
    setTimeout(() => btn.classList.remove('pf-gesperrt'), 1000);
  }, true);

  function init(){ buildNav(); buildPages(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>/* ../../../sync.js */
/* vibe learning – Anmeldung und Anbindung an PocketBase
 *
 * Läuft die Seite über den PocketBase-Server, erscheint beim ersten Öffnen ein
 * Anmeldefenster: ein Feld für Code oder Benutzername (bei Benutzernamen folgt das
 * Passwort), alternativ „Seite ohne Anmeldung nutzen“. Oben rechts in der Leiste
 * steht danach, wer angemeldet ist; dort meldet man sich auch an und ab.
 *
 * Schüler: Fortschritt wird auf dem Server gespeichert, jede gelöste Aufgabe protokolliert.
 * Lehrkraft/Admin: Anmeldung gilt bis zum Schließen des Browsers, im Menü steht
 * der Link zur Verwaltung (lehrer.html).
 * Wird die HTML-Datei direkt geöffnet (oder läuft kein PocketBase dahinter),
 * passiert nichts davon – die Seite speichert dann wie bisher nur im Browser.
 *
 * Bedingte Menüpunkte (katalog.js: bedingt) blendet das Skript nach der Anmeldung ein,
 * wenn der Server sie für diesen Schüler freigibt (/api/trainer/sichtbar).
 *
 * Die Seite ruft auf:
 *   TrainerSync.changed()      nach jeder Änderung am gespeicherten Stand
 *   TrainerSync.event({...})   wenn eine Aufgabe richtig gelöst wurde
 */
(function () {
  'use strict';

  const CONFIG = {
    api: '/api/trainer',
    verwaltung: 'lehrer.html'   // relativ zum Ordner von sync.js
  };

  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const PAGE = document.documentElement.dataset.trainer || '';          // Tool-id aus katalog.js, leer auf Übersichtsseiten
  const TOOL_IDS = window.KATALOG ? [].concat(...window.KATALOG.bereiche.map(b => b.tools.map(t => t.id))) : [];
  const ALL_PREFIXES = [...new Set(['wenn', 'uo', 'fn', PAGE].concat(TOOL_IDS))].filter(Boolean).map(id => id + '-');
  const OWN = PAGE + '-';
  const SKIP = ['wenn-theme'];                                             // Hell/Dunkel bleibt pro Gerät
  const K = {code: 'ts-code', anzeige: 'ts-anzeige', klasse: 'ts-klasse', queue: 'ts-queue', stand: 'ts-stand-' + PAGE};
  const SS = {gast: 'ts-gast', lehrer: 'ts-lehrer'};                      // gilt nur bis zum Schließen des Browsers

  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} },
    keys(){ try { return Object.keys(localStorage); } catch (e) { return []; } }
  };
  const ss = {
    get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  function lehrerSitzung(){ try { return JSON.parse(ss.get(SS.lehrer) || 'null'); } catch (e) { return null; } }

  const hosted = /^https?:$/.test(location.protocol);
  let aktiv = false, pushTimer = null, pushPending = false, menuEl = null, lastSnap = '';

  /* ---------- Hilfen ---------- */
  function api(path, opt){
    opt = opt || {};
    return fetch(CONFIG.api + path, {
      method: opt.method || 'GET',
      keepalive: !!opt.keepalive,
      headers: {'Content-Type': 'application/json', 'X-Trainer-Code': ls.get(K.code) || ''},
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    });
  }
  const trainerKeys = prefix => ls.keys().filter(k => k.startsWith(prefix) && !SKIP.includes(k));
  function snapshot(prefix){ prefix = prefix || OWN; const d = {}; trainerKeys(prefix).sort().forEach(k => { d[k] = ls.get(k); }); return d; }
  function applySnapshot(d, prefix){
    prefix = prefix || OWN;
    trainerKeys(prefix).forEach(k => ls.del(k));
    Object.keys(d || {}).forEach(k => { if (k.startsWith(prefix) && !SKIP.includes(k) && typeof d[k] === 'string') ls.set(k, d[k]); });
  }
  function wipeLocal(){
    ALL_PREFIXES.forEach(p => trainerKeys(p).forEach(k => ls.del(k)));
    ls.keys().filter(k => k.startsWith('ts-stand-')).forEach(k => ls.del(k));
    [K.queue, K.code, K.klasse, K.anzeige].forEach(k => ls.del(k));
  }
  function reloadOnce(){
    let last = 0; try { last = +sessionStorage.getItem('ts-reload') || 0; } catch (e) {}
    if (Date.now() - last < 8000) return;
    try { sessionStorage.setItem('ts-reload', Date.now()); } catch (e) {}
    location.reload();
  }

  /* ---------- Fortschritt abgleichen ---------- */
  async function pull(){
    if (!PAGE){ setStatus('ok'); return; }
    const r = await api('/state?seite=' + PAGE);
    const local = +ls.get(K.stand) || 0, server = +r.stand || 0;
    if (r.daten && server > local){
      const before = JSON.stringify(snapshot());
      applySnapshot(r.daten);
      ls.set(K.stand, server);
      lastSnap = JSON.stringify(snapshot());
      if (lastSnap !== before) reloadOnce();
    } else if (local > server) await push();
    setStatus('ok');
  }

  async function push(keepalive){
    clearTimeout(pushTimer); pushPending = false;
    if (!aktiv || !PAGE) return;
    const stand = +ls.get(K.stand) || Date.now();
    setStatus('saving');
    try {
      await api('/state', {method: 'POST', body: {seite: PAGE, daten: snapshot(), stand}, keepalive});
      setStatus('ok');
    } catch (err){
      if (err.status === 409){ await pull().catch(() => setStatus('offline')); }
      else if (err.status === 401) abgelaufen();
      else { pushPending = true; setStatus('offline'); }
    }
  }

  function changed(){
    if (!PAGE) return;
    // Seiten schreiben ihren Stand auch beim Öffnen neu – nur echte Änderungen zählen,
    // sonst würde ein frisch geöffnetes Gerät einen neueren Stand vom Server überschreiben.
    const snap = JSON.stringify(snapshot());
    if (snap === lastSnap) return;
    lastSnap = snap;
    ls.set(K.stand, Date.now());
    if (!aktiv) return;
    pushPending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }

  /* ---------- Protokoll gelöster Aufgaben ---------- */
  function queue(){ try { return JSON.parse(ls.get(K.queue) || '[]'); } catch (e) { return []; } }
  function event(ev){
    if (!aktiv || !PAGE) return;
    const q = queue(); q.push(Object.assign({seite: PAGE}, ev)); ls.set(K.queue, JSON.stringify(q.slice(-500)));
    flush();
  }
  let flushing = false;
  async function flush(keepalive){
    if (!aktiv || flushing) return;
    const q = queue(); if (!q.length) return;
    flushing = true;
    try {
      await api('/events', {method: 'POST', body: {events: q.slice(0, 200)}, keepalive});
      ls.set(K.queue, JSON.stringify(queue().slice(Math.min(q.length, 200))));
    } catch (err){
      if (err.status === 401) abgelaufen(); else setStatus('offline');
    } finally { flushing = false; }
    if (queue().length && !keepalive) setTimeout(flush, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && aktiv){ if (pushPending) push(true); flush(true); }
  });
  window.addEventListener('online', () => { if (aktiv){ flush(); if (pushPending) push(); else pull().catch(() => {}); } });


  /* ---------- Gast-Fortschritt beim Anmelden übernehmen ---------- */
  // Für jede Übung: Ist das Konto dort noch leer, wird der Stand dieses Geräts hochgeladen,
  // sonst gilt der Stand vom Server.
  async function uebernehmen(){
    for (const p of ALL_PREFIXES){
      const id = p.slice(0, -1), lokal = snapshot(p);
      const st = await api('/state?seite=' + id);
      const leer = !st.daten || !Object.keys(st.daten).length;
      if (leer){
        if (!Object.keys(lokal).length) continue;
        const stand = Date.now();
        await api('/state', {method: 'POST', body: {seite: id, daten: lokal, stand}});
        ls.set('ts-stand-' + id, stand);
      } else {
        applySnapshot(st.daten, p);
        ls.set('ts-stand-' + id, +st.stand || 0);
      }
    }
  }

  /* ---------- Oberfläche: Anmeldefenster + Menü oben rechts ---------- */
  const CSS = `
.ts-ov{position:fixed;inset:0;z-index:2000;background:rgba(20,24,32,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.ts-box{position:relative;background:var(--panel,#f6f8fb);color:var(--text,#2e3440);border:1px solid var(--border,#cdd3de);border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);font:16px/1.5 system-ui,sans-serif}
.ts-box h2{margin:0 0 6px;font-size:21px}
.ts-box p{margin:0 0 14px;color:var(--muted,#5b6578)}
.ts-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:0;background:none;color:var(--muted,#5b6578);font-size:22px;line-height:1;cursor:pointer}
.ts-x:hover{background:var(--panel2,#eceff4);color:var(--text,#2e3440)}
.ts-in{width:100%;box-sizing:border-box;font:700 20px ui-monospace,Consolas,monospace;letter-spacing:.03em;padding:12px 14px;border-radius:10px;border:2px solid var(--slot-border,var(--border,#a7b1c2));background:var(--slot,var(--panel2,#eceff4));color:var(--text,#2e3440);outline:none}
.ts-in:focus{border-color:var(--accent,#5e81ac)}
.ts-btn{margin-top:12px;width:100%;font:600 17px system-ui,sans-serif;padding:12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent,#5e81ac) 50%,var(--panel,#f6f8fb));background:color-mix(in srgb,var(--accent,#5e81ac) 22%,var(--panel,#f6f8fb));color:color-mix(in srgb,var(--accent,#5e81ac) 60%,var(--text,#2e3440));cursor:pointer}
.ts-btn:disabled{opacity:.6;cursor:wait}
.ts-err{color:var(--err,#a8434d);min-height:1.4em;margin-top:8px;font-size:14px}

.ts-gast{display:block;width:100%;margin-top:18px;padding:12px;border-radius:10px;border:1px solid var(--border,#cdd3de);background:var(--panel2,#eceff4);color:var(--text,#2e3440);font:600 16px system-ui,sans-serif;cursor:pointer}
.ts-gast small{display:block;font-weight:400;font-size:13px;color:var(--muted,#5b6578)}

.ts-badge{display:inline-flex;align-items:center;gap:6px;font:600 13px system-ui,sans-serif;padding:7px 11px;border-radius:999px;border:1px solid var(--border,#cdd3de);background:var(--panel2,#eceff4);color:var(--text,#2e3440);cursor:pointer;white-space:nowrap}
.ts-badge .ts-dot{width:8px;height:8px;border-radius:50%;background:#8a95ab}
.ts-badge.ok .ts-dot{background:var(--then,#a3be8c)}
.ts-badge.saving .ts-dot{background:#ebcb8b}
.ts-badge.offline .ts-dot{background:var(--else,#bf616a)}
.ts-badge.gast{border-color:color-mix(in srgb,#d08770 60%,var(--border,#cdd3de));background:color-mix(in srgb,#d08770 16%,var(--panel,#f6f8fb))}
.ts-badge.gast .ts-dot{background:#d08770}
.ts-dd{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:240px;z-index:70;background:var(--panel,#f6f8fb);color:var(--text,#2e3440);border:1px solid var(--border,#cdd3de);border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.18);padding:6px;font:14px/1.4 system-ui,sans-serif}

.ts-dd a:hover,.ts-dd button:hover{background:var(--panel2,#eceff4)}
@media (max-width:640px){.ts-badge .ts-lang{display:none}}`;

  function injectCss(){ const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); }
  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function setStatus(st){
    const b = menuEl && menuEl.querySelector('.ts-badge');
    if (!b || !aktiv) return;
    b.className = 'ts-badge ' + st;
    const t = {ok: 'Fortschritt gespeichert', saving: 'Wird gespeichert …', offline: 'Keine Verbindung – wird später gespeichert'}[st] || '';
    b.title = t;
    const i = menuEl.querySelector('.ts-status'); if (i) i.textContent = t;
  }

  // Menü oben rechts: angemeldet (Dropdown mit Abmelden) oder Gast (Klick öffnet die Anmeldung)
  function showMenu(){
    if (menuEl) menuEl.remove();
    const host = document.querySelector('.pf-right') || document.querySelector('.hdr-right') || document.querySelector('header') || document.body;
    const L = lehrerSitzung();
    menuEl = document.createElement('div');
    menuEl.className = 'ts-wrap';
    if (aktiv){
      const klasse = ls.get(K.klasse);
      menuEl.innerHTML = `<button class="ts-badge saving" type="button"><span class="ts-dot"></span>👤 <span class="ts-lang">${escH(ls.get(K.anzeige) || ls.get(K.code))}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(ls.get(K.anzeige) || ls.get(K.code))}</b>${klasse ? ' (Klasse ' + escH(klasse) + ')' : ''}<br><span class="ts-status"></span></div>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else if (L){
      menuEl.innerHTML = `<button class="ts-badge" type="button">👤 <span class="ts-lang">${escH(L.name)}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(L.name)}</b> (${L.rolle === 'admin' ? 'Admin' : 'Lehrkraft'})</div>
        <a href="${BASE + CONFIG.verwaltung}">Verwaltung: Klassen und Auswertung</a>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else {
      menuEl.innerHTML = `<button class="ts-badge gast" type="button" title="Fortschritt wird nicht gespeichert. Klicken zum Anmelden."><span class="ts-dot"></span>Nicht angemeldet<span class="ts-lang">&nbsp;– Fortschritt wird nicht gespeichert</span></button>`;
    }
    host.insertBefore(menuEl, host.firstChild);
    menuEl.querySelector('.ts-badge').addEventListener('click', () => {
      if (!aktiv && !L){ showLogin(); return; }
      menuEl.classList.toggle('open');
    });
    const ab = menuEl.querySelector('[data-a="ab"]');
    if (ab) ab.addEventListener('click', abmelden);
    document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) menuEl.classList.remove('open'); });
  }

  function showLogin(msg){
    if (document.querySelector('.ts-ov')) return;
    const ov = document.createElement('div');
    ov.className = 'ts-ov';
    ov.innerHTML = `<div class="ts-box" role="dialog" aria-modal="true" aria-label="Anmelden">
      <button class="ts-x" type="button" aria-label="Schließen und ohne Anmeldung nutzen" title="Ohne Anmeldung nutzen">×</button>
      <form class="ts-f1" autocomplete="off">
        <h2>Anmelden</h2>
        <p>Gib deinen Zugangscode oder deinen Benutzernamen ein.</p>
        <input class="ts-in" name="kennung" placeholder="Code oder Benutzername" autocapitalize="none" spellcheck="false" aria-label="Code oder Benutzername">
        <button class="ts-btn" type="submit">Weiter</button>
      </form>
      <form class="ts-f2" hidden>
        <h2>Passwort</h2>
        <p>für <b class="ts-wer"></b></p>
        <input class="ts-in" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
        <button class="ts-btn" type="submit">Anmelden</button>
        <button class="ts-zurueck" type="button">Anderen Namen eingeben</button>
      </form>
      <div class="ts-err">${msg || ''}</div>
      <button class="ts-gast" type="button">Seite ohne Anmeldung nutzen<small>Dein Fortschritt wird dann nur in diesem Browser gespeichert.</small></button>
    </div>`;
    document.body.appendChild(ov);
    const f1 = ov.querySelector('.ts-f1'), f2 = ov.querySelector('.ts-f2'), err = ov.querySelector('.ts-err');
    const k = f1.kennung, pw = f2.passwort;
    setTimeout(() => k.focus(), 50);

    const gast = () => { ss.set(SS.gast, '1'); ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') gast(); };
    document.addEventListener('keydown', esc);
    ov.querySelector('.ts-x').addEventListener('click', gast);
    ov.querySelector('.ts-gast').addEventListener('click', gast);
    ov.querySelector('.ts-zurueck').addEventListener('click', () => { f2.hidden = true; f1.hidden = false; err.textContent = ''; k.select(); });

    async function senden(btn, body){
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch(CONFIG.api + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
          .then(async x => { const j = await x.json().catch(() => ({})); if (!x.ok) throw new Error(x.status === 429 ? 'Zu viele Versuche – bitte kurz warten.' : (j.message || 'Anmeldung fehlgeschlagen.')); return j; });
        if (r.passwort){ f1.hidden = true; f2.hidden = false; ov.querySelector('.ts-wer').textContent = body.kennung; pw.value = ''; pw.focus(); return; }
        if (r.rolle === 'schueler'){
          ls.set(K.code, r.cred); ls.set(K.anzeige, r.anzeige); ls.set(K.klasse, r.klasse || '');
          ss.del(SS.lehrer); ss.del('ts-reload');
          aktiv = true;
          await uebernehmen().catch(() => {});
        } else {
          ss.set(SS.lehrer, JSON.stringify({rolle: r.rolle, token: r.token, name: r.name}));
        }
        location.reload();
      } catch (x){
        err.textContent = x.message || 'Anmeldung fehlgeschlagen.';
        (f2.hidden ? k : pw).select();
      } finally { btn.disabled = false; }
    }
    f1.addEventListener('submit', e => {
      e.preventDefault();
      const v = k.value.trim();
      if (!v){ err.textContent = 'Bitte gib deinen Code oder Benutzernamen ein.'; return; }
      senden(f1.querySelector('.ts-btn'), {kennung: v});
    });
    f2.addEventListener('submit', e => {
      e.preventDefault();
      if (!pw.value){ err.textContent = 'Bitte gib dein Passwort ein.'; return; }
      senden(f2.querySelector('.ts-btn'), {kennung: k.value.trim(), passwort: pw.value});
    });
  }

  async function abmelden(){
    if (lehrerSitzung()){ ss.del(SS.lehrer); ss.del(SS.gast); location.reload(); return; }
    if (!confirm(`Abmelden?\n\nAngemeldet als ${ls.get(K.anzeige) || ls.get(K.code)}. Dein Fortschritt bleibt auf dem Server gespeichert.`)) return;
    if (pushPending) await push();
    await flush();
    if (queue().length && !confirm('Einige gelöste Aufgaben konnten noch nicht übertragen werden (keine Verbindung). Trotzdem abmelden?')) return;
    wipeLocal(); ss.del(SS.gast); ss.del('ts-sichtbar');
    location.reload();
  }
  function abgelaufen(){
    aktiv = false;
    wipeLocal(); ss.del('ts-sichtbar');
    showMenu();
    showLogin('Deine Anmeldung ist nicht mehr gültig. Bitte melde dich neu an.');
  }

  /* ---------- Bedingte Menüpunkte (z. B. Tipp-Aufgabe nur mit aufgegebener Aufgabe) ---------- */
  function zeigeTools(ids){
    // Tool-ids bestehen nur aus a–z, 0–9 und - (katalog.js); andere werden ignoriert
    ids.filter(id => /^[a-z0-9-]+$/.test(id)).forEach(id => document.querySelectorAll(`[data-tool="${id}"]`).forEach(el => el.classList.add('pf-sichtbar')));
  }
  async function sichtbar(){
    try { zeigeTools(JSON.parse(ss.get('ts-sichtbar') || '[]')); } catch (e) {}   // Stand der letzten Seite, ohne Flackern
    try { const r = await api('/sichtbar'); ss.set('ts-sichtbar', JSON.stringify(r.tools || [])); zeigeTools(r.tools || []); } catch (e) {}
  }

  /* ---------- Start ---------- */
  async function start(){
    if (!hosted || window.PF_EINZELDATEI) return;          // Einzeldatei: immer ohne Anmeldung, Fortschritt nur im Browser
    try {
      const h = await fetch('/api/health', {cache: 'no-store'});
      if (!h.ok) return;                                    // kein PocketBase: Seite läuft nur lokal
    } catch (e){ return; }
    injectCss();
    aktiv = !!ls.get(K.code);
    showMenu();
    if (!aktiv){
      if (!lehrerSitzung() && !ss.get(SS.gast)) showLogin();
      return;
    }
    sichtbar();
    try { await pull(); flush(); }
    catch (err){ if (err.status === 401) abgelaufen(); else setStatus('offline'); }
  }

  lastSnap = JSON.stringify(snapshot());   // Stand beim Laden der Seite (vor deren Initialisierung)
  window.TrainerSync = {changed, event, anmelden: () => showLogin(), get aktiv(){ return aktiv; }, get lehrer(){ return lehrerSitzung(); }, abmelden};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<style>/* ../../bwr.css */
/* bwr.css – Grundlayout der BWR-Seiten (Nord-Farben, hell und dunkel)
 *
 * Einbinden im <head> nach den Skripten, Pfad zum Ordner BWR/, z. B. aus BWR/9II/finanzierung/:
 *   <link rel="stylesheet" href="../../bwr.css">
 * Danach eigene <style>-Regeln der Seite (nur, was keine andere BWR-Seite braucht).
 *
 * Farben:   --bg --panel --panel2 --text --muted --border --accent --err --ok --mono,
 *           --plus/--plus-bg (richtig, Zunahme), --minus/--minus-bg (falsch, Abnahme)
 * Gerüst:   .wrap > .bar (.brand mit <span>, .gruppe, .hint, .spacer) und darunter .karte (h2, h3, p)
 * Knöpfe:   .btn, .btn.on (gewählt), .btn.haupt (Hauptaktion), .btn.klein; Eingaben .feld
 * Texte:    .muted, .tag (kleines Etikett), .nr (Nebenrechnung, klein und grau)
 * Rückmeldung: <div class="fb ok|falsch">…</div>; Knopfzeile .knoepfe; Beleg-Tabelle .beleg (tr.summe)
 * Erinnerung, Material und Aufgabenbausteine: lib/aufgaben.css und lib/aufgaben.js
 */
:root{--bg:#e5e9f0;--panel:#f6f8fb;--panel2:#eceff4;--text:#2e3440;--muted:#5b6578;--border:#cdd3de;--accent:#5e81ac;--err:#a8434d;--ok:#5e8a45;
  --mono:ui-monospace,Consolas,"Liberation Mono",monospace;
  --plus:#4f7a3a;--minus:#a8434d;--plus-bg:#dfeccf;--minus-bg:#f3d9dc}
[data-theme=dark]{--bg:#2e3440;--panel:#3b4252;--panel2:#434c5e;--text:#eceff4;--muted:#a9b3c4;--border:#4c566a;--accent:#88c0d0;--err:#d4848b;--ok:#a3be8c;
  --plus:#b5d39a;--minus:#e0959b;--plus-bg:#3f4d3a;--minus-bg:#553c42}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{width:min(1400px,100%);margin:0 auto;padding:14px 16px 24px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.brand{font:800 20px var(--mono);letter-spacing:-.5px;margin-right:8px}
.brand span{color:var(--accent-text,var(--accent))}
.spacer{flex:1}
.gruppe{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.hint,.muted{color:var(--muted)}
.hint{font-size:13px;margin:0 2px 0 6px}
.btn{font:600 14px system-ui,sans-serif;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--border)}
.btn.on,.btn.haupt{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .btn.on,[data-theme=dark] .btn.haupt{color:#2e3440}
.btn.klein{font-size:13px;padding:4px 9px}
.btn:focus-visible,.feld:focus{outline:2px solid var(--accent);outline-offset:1px}
.feld{font:14px system-ui,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.karte{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.karte h2{font-size:18px;margin:0 0 6px}
.karte h3{font-size:15px;margin:14px 0 6px}
.karte p{margin:0 0 8px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:2px}
[data-theme=dark] .tag{color:#2e3440}
.nr{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.fb{border-radius:8px;padding:7px 10px;margin:8px 0 0;font-size:14px}
.fb.ok{background:var(--plus-bg);color:var(--text)}
.fb.falsch{background:var(--minus-bg);color:var(--text)}
.knoepfe{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.beleg{border-collapse:collapse;width:100%;max-width:520px;font-size:14px}
.beleg td{padding:3px 6px;border-bottom:1px solid var(--border)}
.beleg td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.beleg tr.summe td{font-weight:700;border-bottom:none;border-top:1.5px solid var(--text)}

</style>
<style>/* ../../../lib/aufgaben.css */

.af{--af-ok:var(--ok,#5e8a45);--af-err:var(--err,#a8434d);--af-ok-bg:var(--plus-bg,#dfeccf);--af-err-bg:var(--minus-bg,#f3d9dc)}

.af-msg.ich{align-self:flex-end;flex-direction:row-reverse}
.af-ava{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;font-size:17px}
.af-blase{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px;line-height:1.4;animation:af-rein .25s ease-out}
.af-msg.ich .af-blase{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:14px 14px 4px 14px}
[data-theme=dark] .af-msg.ich .af-blase{color:#2e3440}
.af-blase.ok{background:var(--af-ok-bg)}
.af-blase.falsch{background:var(--af-err-bg)}
.af-blase pre{font:13px/1.5 var(--mono,monospace);margin:6px 0 2px;white-space:pre;overflow-x:auto}
.af-tippt{display:flex;gap:4px;padding:12px 14px}
.af-tippt i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:af-punkt 1s infinite}
.af-tippt i:nth-child(2){animation-delay:.15s}.af-tippt i:nth-child(3){animation-delay:.3s}
@keyframes af-punkt{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes af-rein{from{opacity:0;transform:translateY(6px)}}
.af-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
.af-chip{font:600 15px system-ui,sans-serif;background:var(--panel);color:var(--accent-text,var(--accent));border:2px solid var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer}
.af-chip:hover{background:var(--accent);color:#fff}
.af-chatein{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
.af-chattext{flex:1;min-width:0}
.af-chatende{padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}

<script>/* ../../../lib/aufgaben.js */
/* aufgaben.js – Aufgabenbausteine für alle Fächer: Aufgaben als Daten, Prüfung und Rückmeldung eingebaut
 *
 * Einbinden (Pfad zum Ordner pb_public/lib/, z. B. aus BWR/9II/finanzierung/ ../../../lib/):
 *   <link rel="stylesheet" href="../../../lib/aufgaben.css">   <script src="../../../lib/aufgaben.js"><\/script>
 * Farben kommen aus den Variablen der Seite (--panel, --panel2, --border, --accent, --text, --muted).
 *
 * Aufgabe = Objekt mit typ. Für alle Typen: nr (z. B. '7.1'), frage (Aufgabenstellung, HTML),
 * erinnerung und material (HTML, stehen über der Aufgabe; erinnerungZu:true = Erinnerung startet zugeklappt), ok (Text bei Erfolg),
 * danach (weitere Aufgabe, erscheint erst nach richtiger Lösung, z. B. Handlungsempfehlung).
 *   mc           options:[Texte], correct:[Indizes] (mehrere = Mehrfachauswahl, oder multi:true), why:{Index: Erklärung},
 *                after (Text nach Erfolg), mono, mischen:false (Reihenfolge behalten), sofort:false
 *                (bei genau einer richtigen Antwort wird sonst beim Antippen sofort geprüft).
 *                Dasselbe Format wie type:'choice' in den Excel-Erklärungen.
 *   zahlen       felder:[{t (Text), l (Lösung), e (Einheit), h (Hinweis bei Fehler), tol (Toleranz, Std. 0,005)}]
 *                Eingabe im deutschen Format (1.234,50 €), Knopftext über knopf:'…'
 *   luecken      text:'… [[richtig|falsch|falsch]] …' → Auswahllisten (erste Antwort richtig, wird gemischt)
 *   zuordnen     felder:[[id, Titel]], karten:[{t (Text), z (Feld-id)}]; Ziehen mit Maus/Finger oder
 *                erst Karte, dann Feld antippen. Richtige bleiben liegen, falsche gehen zurück.
 *   tabelle      Tabelle zum Ausfüllen (z. B. Tilgungsplan): spalten:['Jahr', 'Zinsen', …],
 *                zeilen:[['1', 40000, {l:2000}, …], …] – Text bzw. Zahl = vorgegeben (Zahlen mit 2 Nachkommastellen),
 *                {l: Lösung} = Eingabefeld; hinweise:{Spaltenindex: 'Zinsen = Restschuld · 5 %'}, tol (Std. 0,005),
 *                einheit (z. B. '€', erscheint im Spaltenkopf). Falsche Felder werden rot, Hinweise je Spalte.
 *   freitext     felder:['1. Sicherheit', '2. Sicherheit'] (Beschriftungen, je ein Eingabefeld),
 *                antworten:[['Grundschuld'], ['Zession', 'Abtretung von Forderungen'], …] (je Eintrag Schreibweisen);
 *                ein Feld ist richtig, wenn ein Begriff darin vorkommt (Groß/klein, ä/ae egal), jedes Feld braucht
 *                einen anderen Eintrag. Tippfehler (Abstand bis 45 % bei langen, 30 % bei kurzen Wörtern) gelten als
 *                „fast richtig“ mit Hinweis auf die Schreibweise; tippfehler:'ok' zählt sie als richtig.
 *   chat         Lern-Chat wie bei LearningSnacks: name, bild (Emoji), nachrichten:[…], jede Nachricht ist
 *                'Text des Bots' (HTML erlaubt) oder eine Frage {bot:'Frage', …} mit einer Antwortform:
 *                  antworten:[{t:'mehr', ok:true, r:'Genau! …'}, {t:'weniger', r:'Nein, …'}]   (Knöpfe)
 *                  zahl:{l:11900, e:'€', tol}   oder   freitext:{antworten:[…]} (wie Typ freitext)
 *                  dazu r (Antwort des Bots bei richtig) und rFalsch (Erklärung bei falsch)
 *                Bei Fehlern erklärt der Bot und macht weiter; am Ende Punkte und „Noch einmal“.
 *                Gilt als gelöst (fertig), sobald der Chat einmal ganz durchlaufen ist.
 *   buchungssatz konten:['2800 BK', …] (Auswahlliste), soll:[['0700 MA', 40000], …], haben:[…],
 *                steuer:['2600 VORST', '4800 UST'] (für den Hinweis), nebenrechnung (HTML nach Lösung)
 *                prüft: Konten, Soll/Haben vertauscht, fehlende Steuer, Beträge; Lösung im Skill-Format
 *
 * API
 *   Aufgaben.baue(el, a, {fertig})  Baustein in Element el; fertig(a) nach richtiger Lösung (inkl. danach)
 *   Aufgaben.sequenz({el, key, schritte})  Erarbeitung aus Schritten mit Knöpfen, ✓, Zähler, Zurück/Weiter:
 *       schritt = {id, kurz (Knopf), titel, html (String oder Funktion), erinnerung, erinnerungZu, material,
 *                  aufgaben:[…], nach(el) (nach dem Zeichnen, für eigene Grafiken)}
 *       Schritte mit Aufgaben melden TrainerSync.event (modus 'erarbeitung', aufgabe = schritt.id),
 *       Info-Schritte gelten beim Weitergehen als erledigt. Gespeichert: <key>-stand {schritt, erledigt}.
 *   Aufgaben.mc.html(a, auswahl:Set, geprueft, reihenfolge?) / Aufgaben.mc.pruefen(a, auswahl) → {ok, gruende}
 *       für Seiten mit eigenem Ablauf (Excel-Erklärungen: tabelle.js, und-oder.html)
 *   Aufgaben.finde(antworten, text) → {i (Eintrag), wort, fast} oder null   (Freitext-Abgleich, auch einzeln nutzbar)
 *   Helfer: zahl('1.234,50 €') → 1234.5, eur(n) → '1.234,50 €', mischen(liste), esc(text), bsText(soll, haben)
 */
(function(){
'use strict';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const r2 = n => Math.round(n * 100) / 100;
const zahlText = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2});
const eur = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
function zahl(s){
  s = String(s == null ? '' : s).replace(/€|%|Tage?|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? +s : NaN;
}
function mischen(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const erinnerungHTML = x => x.erinnerung ? `<details class="erinnerung"${x.erinnerungZu ? '' : ' open'}><summary>Erinnerung${x.erinnerungZu ? ' (zum Aufklappen)' : ''}</summary>${x.erinnerung}</details>` : '';
const fbHTML = fb => fb ? `<div class="af-fb ${fb.ok ? 'ok' : 'falsch'}">${fb.t}</div>` : '';
const nummern = n => [...Array(n).keys()];
// Buchungssatz im Format des BWR-Skills: „an“ auf der letzten Soll-Zeile, weitere Haben-Konten bündig darunter
function bsText(soll, haben){
  const w1 = Math.max(...soll.map(x => x[0].length)), b1 = Math.max(...soll.map(x => eur(x[1]).length));
  const w2 = Math.max(...haben.map(x => x[0].length)), b2 = Math.max(...haben.map(x => eur(x[1]).length));
  const z = (x, w, b) => x[0].padEnd(w) + '  ' + eur(x[1]).padStart(b);
  const zeilen = soll.map((x, i) => z(x, w1, b1) + (i === soll.length - 1 ? '   an   ' + z(haben[0], w2, b2) : ''));
  haben.slice(1).forEach(x => zeilen.push(' '.repeat(w1 + b1 + 10) + z(x, w2, b2)));
  return zeilen.join('\n');
}

/* ---------- Freitext-Abgleich mit Tippfehlern ---------- */
const norm = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
function abstand(a, b){   // Damerau-Levenshtein (vertauschte Nachbarn zählen 1)
  const d = [];
  for (let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++){
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
function finde(antworten, text){
  const t = norm(text); if (!t) return null;
  const woerter = t.split(' '), stuecke = [];
  for (let n = 1; n <= 3; n++) for (let i = 0; i + n <= woerter.length; i++) stuecke.push(woerter.slice(i, i + n).join(''));
  let best = null;
  antworten.forEach((eintrag, i) => [].concat(eintrag).forEach(wort => {
    const v = norm(wort), vz = v.replace(/ /g, '');
    if ((' ' + t + ' ').includes(v) || t.replace(/ /g, '').includes(vz)){ if (!best || best.fast) best = {i, wort:[].concat(eintrag)[0], fast:false, d:0}; return; }
    const tol = Math.max(1, Math.floor(vz.length * (vz.length >= 10 ? 0.45 : 0.3)));
    stuecke.forEach(s => { const d = abstand(s, vz); if (d <= tol && (!best || (best.fast && d < best.d))) best = {i, wort:[].concat(eintrag)[0], fast:true, d}; });
  }));
  return best;
}

/* ---------- Typen: zustand(a), html(a, z), pruefen(a, z) → {ok, t} ---------- */
const mehrfach = a => !!a.multi || a.correct.length > 1;
const mc = {
  html(a, sel, geprueft, ord){
    return `<div class="opts${a.mono ? ' mono' : ''}">` + (ord || nummern(a.options.length)).map(i => {
      let c = sel.has(i) ? ' sel' : '';
      if (geprueft && sel.has(i)) c += a.correct.includes(i) ? ' good' : ' bad';
      return `<button class="opt${c}" type="button" data-opt="${i}">${esc(a.options[i])}</button>`;
    }).join('') + `</div><div class="ohint">${mehrfach(a) ? 'Mehrere Antworten möglich.' : 'Genau eine Antwort ist richtig.'}</div>`;
  },
  pruefen(a, sel){
    const falsch = [...sel].filter(i => !a.correct.includes(i)), fehlt = a.correct.filter(i => !sel.has(i));
    const gruende = falsch.map(i => (a.why && a.why[i]) || `„${esc(a.options[i])}“ passt nicht.`);
    if (!falsch.length && fehlt.length) gruende.push(fehlt.length === 1 ? 'Es fehlt noch eine richtige Antwort.' : `Es fehlen noch ${fehlt.length} richtige Antworten.`);
    return {ok:!falsch.length && !fehlt.length, gruende};
  }
};
const TYPEN = {
  mc:{
    zustand:a => ({sel:new Set(), ord:a.mischen === false ? null : mischen(nummern(a.options.length))}),
    sofort:a => a.sofort !== false && !mehrfach(a),
    html:(a, z) => mc.html(a, z.sel, z.geprueft, z.ord),
    pruefen(a, z){
      if (!z.sel.size) return {ok:false, t:'Wähle zuerst eine Antwort aus.'};
      z.geprueft = true;
      const r = mc.pruefen(a, z.sel);
      return r.ok ? {ok:true, t:'✓ <b>Richtig!</b>' + (a.after ? ' ' + a.after : '')} : {ok:false, t:'Noch nicht ganz.<br>' + r.gruende.join('<br>')};
    }
  },
  zahlen:{
    zustand:() => ({ein:{}, ok:{}}),
    html:(a, z) => '<div class="af-felder">' + a.felder.map((f, i) => {
      const r = z.ok[i];
      return `<div class="af-zeile"><span class="af-t">${f.t}</span><input class="feld af-zahl${r === true ? ' richtig' : r === false ? ' falsch' : ''}" data-f="${i}" value="${esc(z.ein[i] || '')}" inputmode="decimal" autocomplete="off" aria-label="${esc(String(f.t).replace(/<[^>]+>/g, ''))}"${r === true ? ' readonly' : ''}>`
        + `<span class="af-e">${f.e || ''}</span><span class="af-m">${r === true ? '✓' : r === false ? '✗' : ''}</span></div>`
        + (r === false && f.h ? `<div class="af-hinweis">${f.h}</div>` : '');
    }).join('') + '</div>',
    pruefen(a, z){
      a.felder.forEach((f, i) => { z.ok[i] = Math.abs(zahl(z.ein[i]) - f.l) <= (f.tol == null ? 0.005 : f.tol); });
      return a.felder.every((f, i) => z.ok[i]) ? {ok:true, t:'✓ ' + (a.ok || 'Alles richtig!')} : {ok:false, t:'Noch nicht alles richtig. Die rot markierten Felder stimmen nicht.'};
    }
  },
  luecken:{
    zustand(a){
      const teile = String(a.text).split(/\[\[(.*?)\]\]/).map((s, i) => i % 2 ? s.split('|') : s);
      return {teile, wahl:{}, ok:{}, ord:teile.map(t => Array.isArray(t) ? mischen(nummern(t.length)) : null)};
    },
    html(a, z){
      let n = 0;
      return '<p class="af-luecken">' + z.teile.map((t, j) => {
        if (!Array.isArray(t)) return t;
        const i = n++, r = z.ok[i];
        return `<select data-l="${i}" class="${r === true ? 'richtig' : r === false ? 'falsch' : ''}" aria-label="Lücke ${i + 1}"><option value="">– wählen –</option>`
          + z.ord[j].map(k => `<option value="${k}"${String(z.wahl[i]) === String(k) ? ' selected' : ''}>${esc(t[k])}</option>`).join('') + '</select>';
      }).join('') + '</p>';
    },
    pruefen(a, z){
      const n = z.teile.filter(Array.isArray).length;
      for (let i = 0; i < n; i++) z.ok[i] = String(z.wahl[i]) === '0';
      return nummern(n).every(i => z.ok[i]) ? {ok:true, t:'✓ ' + (a.ok || 'Alles richtig!')} : {ok:false, t:'Noch nicht alles richtig. Die rot markierten Lücken stimmen nicht.'};
    }
  },
  zuordnen:{
    zustand:a => ({platz:{}, fix:{}, ord:mischen(nummern(a.karten.length)), wahl:null, weg:[]}),
    html(a, z){
      const karte = i => `<div class="af-karte${z.fix[i] ? ' fix' : ''}${z.wahl === i ? ' gewaehlt' : ''}${z.weg.includes(i) ? ' weg' : ''}" data-karte="${i}" tabindex="0" role="button">${a.karten[i].t}</div>`;
      const frei = z.ord.filter(i => z.platz[i] == null);
      return `<div class="af-pool" data-zone="">${frei.map(karte).join('') || '<span class="af-leer">Alle Karten sind verteilt.</span>'}</div>`
        + `<div class="af-zonen" style="--n:${a.felder.length}">${a.felder.map(([id, t]) => `<div class="af-zone" data-zone="${esc(id)}"><div class="af-zt">${t}</div>${z.ord.filter(i => z.platz[i] === id).map(karte).join('')}</div>`).join('')}</div>`;
    },
    pruefen(a, z){
      z.weg = []; z.wahl = null;
      a.karten.forEach((k, i) => { if (z.platz[i] != null){ if (z.platz[i] === k.z) z.fix[i] = true; else { z.weg.push(i); delete z.platz[i]; } } });
      const n = a.karten.filter((k, i) => z.fix[i]).length;
      if (n === a.karten.length) return {ok:true, t:`✓ ${a.ok || `Alle ${n} Karten richtig zugeordnet!`}`};
      if (!n && !z.weg.length) return {ok:false, t:'Ziehe zuerst Karten in die Felder.'};
      return {ok:false, t:`${n} von ${a.karten.length} richtig. ${z.weg.length ? `${z.weg.length} ${z.weg.length === 1 ? 'Karte ist' : 'Karten sind'} zurück in den Stapel gewandert. ` : ''}Ordne die übrigen Karten zu.`};
    }
  },
  tabelle:{
    zustand:() => ({ein:{}, ok:{}}),
    html(a, z){
      const fmt = v => typeof v === 'number' ? zahlText(v) : esc(v == null ? '' : v);
      const kopf = a.spalten.map(s => `<th>${esc(s)}${a.einheit && s !== a.spalten[0] ? ` <small>(${esc(a.einheit)})</small>` : ''}</th>`).join('');
      const zeilen = a.zeilen.map((r, i) => '<tr>' + r.map((c, j) => {
        if (!c || typeof c !== 'object') return `<td${typeof c === 'number' ? ' class="zahl"' : ''}>${fmt(c)}</td>`;
        const k = i + '-' + j, s = z.ok[k];
        return `<td><input class="feld af-zahl${s === true ? ' richtig' : s === false ? ' falsch' : ''}" data-f="${k}" value="${esc(z.ein[k] || '')}" inputmode="decimal" autocomplete="off" aria-label="${esc(a.spalten[j] + ', Zeile ' + (i + 1))}"${s === true ? ' readonly' : ''}></td>`;
      }).join('') + '</tr>').join('');
      const falsch = Object.keys(z.ok).filter(k => z.ok[k] === false).map(k => +k.split('-')[1]);
      const hin = [...new Set(falsch)].filter(j => a.hinweise && a.hinweise[j]).map(j => `<div class="af-hinweis"><b>${esc(a.spalten[j])}:</b> ${a.hinweise[j]}</div>`).join('');
      return `<div class="af-tabelle"><table><thead><tr>${kopf}</tr></thead><tbody>${zeilen}</tbody></table></div>${hin}`;
    },
    pruefen(a, z){
      let alle = 0, richtig = 0, leer = 0;
      a.zeilen.forEach((r, i) => r.forEach((c, j) => {
        if (!c || typeof c !== 'object') return;
        const k = i + '-' + j, v = zahl(z.ein[k]); alle++;
        if (isNaN(v)){ leer++; delete z.ok[k]; return; }
        z.ok[k] = Math.abs(v - c.l) <= (a.tol == null ? 0.005 : a.tol); if (z.ok[k]) richtig++;
      }));
      if (richtig === alle) return {ok:true, t:'✓ ' + (a.ok || 'Alles richtig ausgefüllt!')};
      return {ok:false, t:`${richtig} von ${alle} Feldern richtig.${leer ? ` ${leer} ${leer === 1 ? 'Feld ist' : 'Felder sind'} noch leer.` : ''}${richtig < alle - leer ? ' Die rot markierten Felder stimmen nicht.' : ''}`};
    }
  },
  freitext:{
    zustand:() => ({ein:{}, st:{}, msg:{}}),
    html:(a, z) => '<div class="af-felder">' + a.felder.map((f, i) => {
      const s = z.st[i];
      return `<div class="af-zeile"><label class="af-t" for="af-ft-${i}">${f}</label><input class="feld af-text${s === 'ok' ? ' richtig' : s === 'fast' ? ' fast' : s ? ' falsch' : ''}" id="af-ft-${i}" data-f="${i}" value="${esc(z.ein[i] || '')}" autocomplete="off" spellcheck="false"${s === 'ok' ? ' readonly' : ''}>`
        + `<span class="af-m">${s === 'ok' ? '✓' : s === 'fast' ? '≈' : s ? '✗' : ''}</span></div>` + (z.msg[i] ? `<div class="af-hinweis">${z.msg[i]}</div>` : '');
    }).join('') + '</div>',
    pruefen(a, z){
      const belegt = {};
      z.st = {}; z.msg = {};
      a.felder.forEach((f, i) => {
        const r = finde(a.antworten, z.ein[i]);
        if (!norm(z.ein[i])){ z.st[i] = 'leer'; z.msg[i] = 'Dieses Feld ist noch leer.'; }
        else if (!r){ z.st[i] = 'falsch'; z.msg[i] = a.h || 'Das passt nicht. Schau noch einmal in die Erklärung.'; }
        else if (belegt[r.i] != null){ z.st[i] = 'falsch'; z.msg[i] = 'Das hast du schon in einem anderen Feld genannt. Nenne etwas anderes.'; }
        else if (r.fast && a.tippfehler !== 'ok'){ z.st[i] = 'fast'; z.msg[i] = `Fast richtig – meinst du „${esc(r.wort)}“? Prüfe die Schreibweise.`; belegt[r.i] = i; }
        else { z.st[i] = 'ok'; if (r.fast) z.msg[i] = `Richtig. Schreibweise: „${esc(r.wort)}“.`; belegt[r.i] = i; }
      });
      return a.felder.every((f, i) => z.st[i] === 'ok') ? {ok:true, t:'✓ ' + (a.ok || 'Alles richtig!')} : {ok:false, t:'Noch nicht alles richtig.'};
    }
  },
  chat:{
    zustand:() => ({i:0, log:[], warte:null, punkte:0, fragen:0, tippt:false, ende:false}),
    sofort:() => true,
    html(a, z){
      const ava = `<span class="af-ava" aria-hidden="true">${a.bild || '🤖'}</span>`;
      const blase = m => m.wer === 'ich' ? `<div class="af-msg ich"><div class="af-blase">${esc(m.text)}</div></div>`
        : `<div class="af-msg bot">${ava}<div class="af-blase${m.art ? ' ' + m.art : ''}">${m.html}</div></div>`;
      let ein = '';
      const q = z.warte != null ? a.nachrichten[z.warte] : null;
      if (q && q.antworten) ein = `<div class="af-chips">${q.antworten.map((x, j) => `<button class="af-chip" type="button" data-ca="${j}">${esc(x.t)}</button>`).join('')}</div>`;
      else if (q) ein = `<div class="af-chatein"><input class="feld af-chattext" ${q.zahl ? 'inputmode="decimal"' : ''} autocomplete="off" placeholder="${q.zahl ? 'Zahl eingeben' : 'Antwort eingeben'}" aria-label="Deine Antwort">${q.zahl && q.zahl.e ? `<span>${q.zahl.e}</span>` : ''}<button class="btn haupt af-senden" type="button">Senden</button></div>`;
      else if (z.ende) ein = `<div class="af-chatende"><b>Geschafft!</b> Du hast ${z.punkte} von ${z.fragen} Fragen auf Anhieb richtig beantwortet. <button class="btn klein af-neu" type="button">Noch einmal</button></div>`;
      return `<div class="af-chat"><div class="af-chatkopf">${ava}<b>${esc(a.name || 'Lern-Chat')}</b></div><div class="af-verlauf" aria-live="polite">${z.log.map(blase).join('')}`
        + (z.tippt ? `<div class="af-msg bot">${ava}<div class="af-blase af-tippt" aria-label="schreibt …"><i></i><i></i><i></i></div></div>` : '') + `</div>${ein}</div>`;
    },
    start(ctx){ const z = ctx.z; z.ctx = ctx; if (!z.log.length && !z.tippt) chatWeiter(z, ctx.a); },
    nach(el){ const v = el.querySelector('.af-verlauf'); if (v) v.scrollTop = v.scrollHeight; const i = el.querySelector('.af-chattext'); if (i && document.activeElement && el.contains(document.activeElement) === false && el.dataset.fokus) i.focus(); },
    pruefen:() => ({ok:false, t:''})
  },
  buchungssatz:{
    zustand:() => ({soll:[{k:'', b:''}], haben:[{k:'', b:''}]}),
    html(a, z){
      if (z.geloest) return `<pre class="af-bs">${esc(bsText(a.soll, a.haben))}</pre>` + (a.nebenrechnung ? `<div class="af-hinweis">${a.nebenrechnung}</div>` : '');
      const opt = k => '<option value="">Konto …</option>' + a.konten.map(x => `<option${x === k ? ' selected' : ''}>${esc(x)}</option>`).join('');
      const zeile = (s, x, i) => `<div class="af-bz"><select class="feld" data-seite="${s}" data-i="${i}" data-w="k" aria-label="${s === 'soll' ? 'Soll' : 'Haben'}-Konto ${i + 1}">${opt(x.k)}</select>`
        + `<input class="feld af-zahl" data-seite="${s}" data-i="${i}" data-w="b" value="${esc(x.b)}" placeholder="Betrag" inputmode="decimal" autocomplete="off" aria-label="Betrag in €">`
        + (z[s].length > 1 ? `<button class="af-x" type="button" data-weg="${s}" data-i="${i}" aria-label="Zeile entfernen">×</button>` : '') + '</div>';
      const spalte = (s, t) => `<div class="af-spalte"><div class="af-sk">${t}</div>${z[s].map((x, i) => zeile(s, x, i)).join('')}<button class="btn klein" type="button" data-plus="${s}">+ Konto</button></div>`;
      return `<div class="af-builder">${spalte('soll', 'Soll')}<div class="af-an">an</div>${spalte('haben', 'Haben')}</div>`;
    },
    pruefen(a, z){
      const ein = s => z[s].filter(x => x.k || String(x.b).trim()).map(x => ({k:x.k, b:zahl(x.b)}));
      const s = ein('soll'), h = ein('haben'), alle = [...s, ...h], ks = l => l.map(x => x.k || x[0]).sort().join('|');
      const los = [...a.soll, ...a.haben], n = los.length;
      let t = null;
      if (!s.length || !h.length) t = 'Trage mindestens ein Soll-Konto und ein Haben-Konto ein.';
      else if (alle.some(x => !x.k)) t = 'Wähle zu jedem Betrag ein Konto aus.';
      else if (alle.some(x => isNaN(x.b))) t = 'Trage zu jedem Konto einen Betrag ein, z. B. 12.500,00.';
      else if (new Set(alle.map(x => x.k)).size !== alle.length) t = 'Jedes Konto darf nur einmal im Buchungssatz stehen.';
      else if (ks(s) === ks(a.haben) && ks(h) === ks(a.soll)) t = 'Soll und Haben sind vertauscht. Überlege bei jedem Konto: Nimmt es zu oder ab, und auf welcher Seite steht es?';
      else if (ks(s) !== ks(a.soll) || ks(h) !== ks(a.haben)){
        const st = los.find(x => (a.steuer || []).includes(x[0]) && !alle.some(y => y.k === x[0]));
        t = 'Die Konten stimmen noch nicht. ' + (st ? `Denke an das Konto ${st[0]}.` : alle.length > n ? 'Es sind zu viele Konten.' : alle.length < n ? 'Es fehlt ein Konto.' : 'Überlege, welche Konten sich durch den Geschäftsfall verändern.');
      } else {
        const soll = (l, k) => l.find(x => x[0] === k)[1];
        const falsch = [...s.filter(x => Math.abs(x.b - soll(a.soll, x.k)) > 0.005), ...h.filter(x => Math.abs(x.b - soll(a.haben, x.k)) > 0.005)];
        if (falsch.length) t = `Die Konten stimmen. Prüfe den Betrag bei ${falsch.map(x => x.k).join(', ')}.`;
      }
      return t ? {ok:false, t} : {ok:true, t:'✓ ' + (a.ok || 'Richtig!')};
    }
  }
};

/* ---------- Lern-Chat: Ablauf ---------- */
const textVon = m => typeof m === 'string' ? m : m.bot;
function chatSage(z, html, art, dann){
  z.tippt = true; z.ctx.zeichne();
  const fertig = () => { z.tippt = false; z.weiter = null; z.log.push({wer:'bot', html, art}); dann(); };
  z.weiter = fertig;
  z.timer = setTimeout(fertig, Math.min(1600, 350 + String(html).replace(/<[^>]+>/g, '').length * 12));
}
function chatWeiter(z, a){
  if (z.i >= a.nachrichten.length){
    z.ende = true; z.ctx.zeichne();
    if (!z.geloest){ z.geloest = true; if (z.ctx.opt.fertig) z.ctx.opt.fertig(a); }
    return;
  }
  const m = a.nachrichten[z.i];
  chatSage(z, textVon(m), null, () => {
    if (typeof m === 'object' && (m.antworten || m.zahl || m.freitext)){ z.warte = z.i; z.ctx.zeichne(); return; }
    z.i++; z.ctx.zeichne(); chatWeiter(z, a);
  });
}
function chatAntwort(ctx, wert, j){
  const {a, z} = ctx, q = a.nachrichten[z.warte];
  if (!q) return;
  let ok, text, r;
  if (q.antworten){ const x = q.antworten[j]; ok = !!x.ok; text = x.t; r = x.r; }
  else if (q.zahl){ if (!String(wert).trim()) return; ok = Math.abs(zahl(wert) - q.zahl.l) <= (q.zahl.tol == null ? 0.005 : q.zahl.tol); text = wert + (q.zahl.e && !/€|%/.test(wert) ? ' ' + q.zahl.e : ''); }
  else { if (!String(wert).trim()) return; const f = finde(q.freitext.antworten, wert); ok = !!f; text = wert; if (f && f.fast) r = (q.r || 'Richtig!') + ` (Schreibweise: „${esc(f.wort)}“)`; }
  z.fragen++; if (ok) z.punkte++;
  z.log.push({wer:'ich', text}); z.warte = null; z.i++;
  chatSage(z, r || (ok ? q.r || '👍 Richtig!' : q.rFalsch || 'Das stimmt leider nicht.'), ok ? 'ok' : 'falsch', () => chatWeiter(z, a));
}

/* ---------- Baustein zeichnen und bedienen ---------- */
function baue(el, a, opt){
  opt = opt || {};
  const typ = TYPEN[a.typ];
  if (!typ) throw new Error('aufgaben.js: unbekannter typ ' + a.typ);
  const z = a._z || (a._z = typ.zustand(a));
  const ctx = {a, z, typ, opt, el, zeichne(){
    const sofort = typ.sofort && typ.sofort(a);
    el.innerHTML = erinnerungHTML(a)
      + (a.material ? `<div class="material">${a.material}</div>` : '')
      + (a.frage ? `<p class="af-frage">${a.nr ? `<span class="af-nr">${a.nr}</span>` : ''}${a.frage}</p>` : '')
      + typ.html(a, z)
      + (!z.geloest && !sofort ? `<div class="af-knoepfe"><button class="btn haupt af-pruefen" type="button">${a.knopf || 'Prüfen'}</button></div>` : '')
      + fbHTML(z.fb) + (z.geloest && a.danach ? '<div class="af-danach"></div>' : '');
    if (z.geloest && a.danach) baue(el.querySelector('.af-danach'), a.danach, opt);
    if (typ.nach) typ.nach(el, a, z);
  }};
  el.classList.add('af'); el._af = ctx;
  if (typ.start) typ.start(ctx); else ctx.zeichne();
  if (typ.start && !el.innerHTML) ctx.zeichne();
  return ctx;
}
function pruefe(ctx){
  const {a, z, typ, opt} = ctx, r = typ.pruefen(a, z);
  z.fb = {ok:r.ok, t:r.t};
  if (r.ok && !z.geloest){ z.geloest = true; if (!a.danach && opt.fertig) opt.fertig(a); }
  ctx.zeichne();
  if (r.ok && a.danach && a.danach._z && a.danach._z.geloest && opt.fertig) opt.fertig(a);
}
const ctxVon = t => { const w = t.closest && t.closest('.af'); return w && w._af; };

document.addEventListener('click', e => {
  const ctx = ctxVon(e.target); if (!ctx || zieht) return;
  const {a, z} = ctx, t = e.target;
  if (t.closest('.af-pruefen')) return pruefe(ctx);
  if (a.typ === 'chat'){
    const c = t.closest('[data-ca]');
    if (c) return chatAntwort(ctx, null, +c.dataset.ca);
    if (t.closest('.af-senden')){ const i = ctx.el.querySelector('.af-chattext'); ctx.el.dataset.fokus = '1'; return chatAntwort(ctx, i ? i.value : ''); }
    if (t.closest('.af-neu')){ clearTimeout(z.timer); Object.assign(z, TYPEN.chat.zustand(), {geloest:z.geloest, ctx}); return chatWeiter(z, a); }
    if (z.tippt && z.weiter && t.closest('.af-verlauf')){ clearTimeout(z.timer); return z.weiter(); }
    return;
  }
  const o = t.closest('[data-opt]');
  if (o && a.typ === 'mc'){
    if (z.geloest) return;
    const i = +o.dataset.opt;
    if (mehrfach(a)){ z.sel.has(i) ? z.sel.delete(i) : z.sel.add(i); } else z.sel = new Set([i]);
    z.geprueft = false; z.fb = null;
    return ctx.typ.sofort(a) ? pruefe(ctx) : ctx.zeichne();
  }
  if (a.typ === 'zuordnen'){
    const k = t.closest('[data-karte]'), zo = t.closest('[data-zone]');
    if (k && !z.fix[+k.dataset.karte]){ z.wahl = z.wahl === +k.dataset.karte ? null : +k.dataset.karte; z.weg = []; return ctx.zeichne(); }
    if (zo && z.wahl != null){ legen(ctx, z.wahl, zo.dataset.zone); z.wahl = null; return ctx.zeichne(); }
  }
  if (a.typ === 'buchungssatz'){
    const p = t.closest('[data-plus]'), w = t.closest('[data-weg]');
    if (p){ z[p.dataset.plus].push({k:'', b:''}); return ctx.zeichne(); }
    if (w){ z[w.dataset.weg].splice(+w.dataset.i, 1); return ctx.zeichne(); }
  }
});
document.addEventListener('input', e => {
  const ctx = ctxVon(e.target); if (!ctx) return;
  const t = e.target, d = t.dataset;
  if (d.f != null) ctx.z.ein[d.f] = t.value;
  else if (d.seite) ctx.z[d.seite][+d.i][d.w] = t.value;
});
document.addEventListener('change', e => {
  const ctx = ctxVon(e.target); if (!ctx || e.target.dataset.l == null) return;
  ctx.z.wahl[e.target.dataset.l] = e.target.value; delete ctx.z.ok[e.target.dataset.l]; e.target.className = '';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const ctx = ctxVon(e.target); if (!ctx) return;
  if (e.target.matches('.af-chattext')){ e.preventDefault(); ctx.el.dataset.fokus = '1'; chatAntwort(ctx, e.target.value); }
  else if (e.target.matches('input')){ e.preventDefault(); pruefe(ctx); }
  else if (e.target.matches('[data-karte]')){ e.preventDefault(); e.target.click(); }
});

/* Zuordnen: Ziehen mit Maus, Stift oder Finger */
let zieht = false, zug = null;
function legen(ctx, i, zone){ const z = ctx.z; if (z.fix[i]) return; if (!zone) delete z.platz[i]; else z.platz[i] = zone; z.weg = []; z.fb = null; }
document.addEventListener('pointerdown', e => {
  const k = e.target.closest && e.target.closest('.af-karte'); if (!k || k.classList.contains('fix')) return;
  zug = {ctx:ctxVon(k), i:+k.dataset.karte, el:k, x:e.clientX, y:e.clientY, geist:null};
});
document.addEventListener('pointermove', e => {
  if (!zug) return;
  if (!zug.geist){
    if (Math.hypot(e.clientX - zug.x, e.clientY - zug.y) < 6) return;
    zug.geist = zug.el.cloneNode(true); zug.geist.className = 'af-karte af-geist'; document.body.appendChild(zug.geist);
    zug.el.classList.add('quelle'); zieht = true;
  }
  e.preventDefault();
  zug.geist.style.left = (e.clientX - 110) + 'px'; zug.geist.style.top = (e.clientY - 18) + 'px';
  zug.ctx.el.querySelectorAll('.ziel').forEach(x => x.classList.remove('ziel'));
  const ziel = document.elementFromPoint(e.clientX, e.clientY), zo = ziel && ziel.closest('.af-zone');
  if (zo && zug.ctx.el.contains(zo)) zo.classList.add('ziel');
});
document.addEventListener('pointerup', e => {
  if (!zug) return;
  const g = zug; zug = null;
  if (!g.geist) return;
  g.geist.remove();
  const ziel = document.elementFromPoint(e.clientX, e.clientY), zo = ziel && ziel.closest('[data-zone]');
  if (zo && g.ctx.el.contains(zo)) legen(g.ctx, g.i, zo.dataset.zone);
  g.ctx.zeichne(); setTimeout(() => { zieht = false; }, 0);
});
document.addEventListener('pointercancel', () => { if (zug && zug.geist){ zug.geist.remove(); zug.ctx.zeichne(); } zug = null; zieht = false; });

/* ---------- Sequenz (Erarbeitung aus Schritten) ---------- */
function sequenz(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, S = cfg.schritte, KEY = cfg.key + '-stand';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.erledigt) stand.erledigt = {};
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  const istAufgabe = s => !!(s.aufgaben && s.aufgaben.length), anzahl = S.filter(istAufgabe).length;
  let akt = Math.min(Math.max(stand.schritt || 0, 0), S.length - 1);
  root.innerHTML = '<div class="af-kopf"><nav class="af-schritte" aria-label="Schritte"></nav><span class="af-zaehler"></span></div><main class="karte af-inhalt" aria-live="polite"></main>';
  const nav = root.querySelector('.af-schritte'), inhalt = root.querySelector('.af-inhalt'), zaehler = root.querySelector('.af-zaehler');
  function erledigt(s){
    const erstmals = !stand.erledigt[s.id];
    stand.erledigt[s.id] = true; speichern();
    if (istAufgabe(s) && window.TrainerSync) TrainerSync.event({modus:'erarbeitung', stufe:0, aufgabe:s.id, titel:s.titel || s.kurz, gesamt:anzahl, erstmals});
    leiste();
  }
  function leiste(){
    nav.innerHTML = S.map((x, i) => `<button class="btn${i === akt ? ' on' : ''}${stand.erledigt[x.id] ? ' erl' : ''}" type="button" data-schritt="${i}"${i === akt ? ' aria-current="step"' : ''}>${x.kurz}</button>`).join('');
    zaehler.textContent = anzahl ? `${S.filter(x => istAufgabe(x) && stand.erledigt[x.id]).length} von ${anzahl} Aufgaben gelöst` : '';
  }
  function zeichne(oben){
    const s = S[akt];
    leiste();
    inhalt.innerHTML = (istAufgabe(s) && stand.erledigt[s.id] ? '<p class="af-erledigt">✓ Diesen Schritt hast du schon gelöst. Du kannst ihn noch einmal bearbeiten.</p>' : '')
      + (typeof s.html === 'function' ? s.html() : s.html || '')
      + erinnerungHTML(s)
      + (s.material ? `<div class="material">${s.material}</div>` : '')
      + (s.aufgaben || []).map(() => '<div class="af-aufgabe"></div>').join('')
      + `<div class="af-unten"><button class="btn" type="button" data-weiter="-1"${akt ? '' : ' disabled'}>◀ Zurück</button><button class="btn haupt" type="button" data-weiter="1"${akt < S.length - 1 ? '' : ' disabled'}>Weiter ▶</button></div>`;
    const plaetze = inhalt.querySelectorAll(':scope > .af-aufgabe');
    (s.aufgaben || []).forEach((a, i) => baue(plaetze[i], a, {fertig:() => { if (s.aufgaben.every(x => geloest(x))) erledigt(s); }}));
    if (s.nach) s.nach(inhalt);
    if (oben) window.scrollTo(0, 0);
  }
  const geloest = a => !!(a._z && a._z.geloest && (!a.danach || geloest(a.danach)));
  function gehe(i){
    if (!istAufgabe(S[akt]) && i > akt && !stand.erledigt[S[akt].id]) erledigt(S[akt]);
    akt = Math.min(Math.max(i, 0), S.length - 1); stand.schritt = akt; speichern(); zeichne(true);
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-schritt], [data-weiter]'); if (!b || !root.contains(b)) return;
    if (b.dataset.schritt != null) gehe(+b.dataset.schritt); else gehe(akt + +b.dataset.weiter);
  });
  zeichne();
  return {gehe, get schritt(){ return akt; }, stand};
}

window.Aufgaben = {baue, sequenz, mc, mehrfach, finde, zahl, eur, mischen, esc, bsText, TYPEN};
})();

</script>

<body>
<div class="wrap">
  <div class="bar"><div class="brand">Darlehens<span>arten</span></div></div>
  <div id="app"></div>
</div>
<script>
'use strict';
const {eur} = Aufgaben;
// Darlehen über 40.000,00 €, 4 Jahre, 5 % Zinsen p. a.: [Restschuld Anfang, Zinsen, Tilgung, Rate, Restschuld Ende]
const PLAN = {
  abzahlung: [[40000, 2000, 10000, 12000, 30000], [30000, 1500, 10000, 11500, 20000], [20000, 1000, 10000, 11000, 10000], [10000, 500, 10000, 10500, 0]],
  annuitaet: [[40000, 2000, 9280.47, 11280.47, 30719.53], [30719.53, 1535.98, 9744.49, 11280.47, 20975.04], [20975.04, 1048.75, 10231.72, 11280.47, 10743.32], [10743.32, 537.17, 10743.32, 11280.49, 0]],
  fest: [[40000, 2000, 0, 2000, 40000], [40000, 2000, 0, 2000, 40000], [40000, 2000, 0, 2000, 40000], [40000, 2000, 40000, 42000, 0]]
};
const SPALTEN = ['Jahr', 'Restschuld am Jahresanfang', 'Zinsen (5 %)', 'Tilgung', 'Rate', 'Restschuld am Jahresende'];
const HINWEISE = {1: 'Restschuld am Jahresanfang = Restschuld am Ende des Vorjahres', 2: 'Zinsen = Restschuld am Jahresanfang · 5 : 100 (auf Cent runden)',
  3: 'Tilgung = Rate – Zinsen', 4: 'Rate = Zinsen + Tilgung', 5: 'Restschuld am Jahresende = Restschuld am Jahresanfang – Tilgung'};
// Tabelle als Formular: vorgegeben sind die Spalten in „fest“ und die Restschuld am Anfang des 1. Jahres, der Rest sind Eingabefelder
function tabelle(art, fest){
  return {typ:'tabelle', einheit:'€', spalten:SPALTEN, hinweise:HINWEISE,
    zeilen:PLAN[art].map((r, i) => [String(i + 1), ...r.map((v, j) => fest.includes(j + 1) || (i === 0 && j === 0) ? v : {l:v})])};
}
const ANGEBOT = '<div class="mt">Material: Angebot der Hausbank</div><p>Darlehen für einen Transporter: <b>40.000,00 €</b>, Laufzeit <b>4 Jahre</b>, Zinssatz <b>5 % pro Jahr</b>. Zinsen und Tilgung werden einmal am Jahresende gezahlt.</p>';

// Säulen: je Jahr Tilgung (unten, Akzentfarbe) und Zinsen (oben, schraffiert), Höhe = Rate
function saeulen(art, titel){
  const p = PLAN[art], mx = Math.max(...p.map(r => r[3])), H = 140, sc = H / mx;   // je Grafik auf die höchste Rate skaliert
  let h = `<svg class="saeulen" viewBox="0 0 320 210" role="img" aria-label="${titel}: Raten je Jahr aus Tilgung und Zinsen">
    <defs><pattern id="dSchr" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="z2"/><line x1="0" y1="0" x2="0" y2="7" class="schr"/></pattern></defs>
    <line class="achse" x1="30" y1="170" x2="310" y2="170"/>`;
  p.forEach((r, i) => {
    const x = 50 + i * 65, t = r[2] * sc, z = r[1] * sc, y = 170 - t - z;
    h += `<rect class="t" x="${x}" y="${170 - t}" width="40" height="${t}"/><rect class="z" x="${x}" y="${y}" width="40" height="${z}"/><rect class="rand" x="${x}" y="${y}" width="40" height="${t + z}"/>`
      + `<text x="${x + 20}" y="${y - 6}">${Math.round(r[3]).toLocaleString('de-DE')} €</text><text x="${x + 20}" y="186">${i + 1}. Jahr</text>`;
  });
  return h + `<text x="170" y="205" style="font-weight:700">${titel}</text></svg>`;
}
const LEGENDE = '<p class="legende"><i style="background:var(--accent)"></i>Tilgung <i style="background:repeating-linear-gradient(45deg,var(--panel2) 0 3px,var(--muted) 3px 5px)"></i>Zinsen · Höhe der Säule = Rate des Jahres</p>';
