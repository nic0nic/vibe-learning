/* ---------- Sequenz (Erarbeitung aus Schritten) ---------- */
function sequenz(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, S = cfg.schritte, KEY = cfg.key + '-stand';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.erledigt) stand.erledigt = {};
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  const istAufgabe = s => !!(s.aufgaben && s.aufgaben.length) || !!s.training, anzahl = S.filter(istAufgabe).length;
  let akt = Math.min(Math.max(stand.schritt || 0, 0), S.length - 1);
  root.innerHTML = '<div class="af-kopf"><nav class="af-schritte" aria-label="Schritte"></nav><span class="af-zaehler"></span></div><main class="karte af-inhalt" aria-live="polite"></main>';
  const nav = root.querySelector('.af-schritte'), inhalt = root.querySelector('.af-inhalt'), zaehler = root.querySelector('.af-zaehler');
  function erledigt(s){
    const erstmals = !stand.erledigt[s.id];
    stand.erledigt[s.id] = true; speichern();
    if (istAufgabe(s) && window.TrainerSync) TrainerSync.event({modus:'erarbeitung', stufe:0, aufgabe:s.id, titel:s.titel || s.kurz, gesamt:anzahl, erstmals});
    leiste();
  }
  function leiste(){
    nav.innerHTML = S.map((x, i) => `<button class="btn${i === akt ? ' on' : ''}${stand.erledigt[x.id] ? ' erl' : ''}" type="button" data-schritt="${i}"${i === akt ? ' aria-current="step"' : ''}>${x.kurz}</button>`).join('');
    zaehler.textContent = anzahl ? `${S.filter(x => istAufgabe(x) && stand.erledigt[x.id]).length} von ${anzahl} Aufgaben gelöst` : '';
  }
  function zeichne(oben){
    const s = S[akt];
    leiste();
    inhalt.innerHTML = (istAufgabe(s) && stand.erledigt[s.id] ? '<p class="af-erledigt">✓ Diesen Schritt hast du schon gelöst. Du kannst ihn noch einmal bearbeiten.</p>' : '')
      + (typeof s.html === 'function' ? s.html() : s.html || '')
      + erinnerungHTML(s)
      + (s.material ? `<div class="material">${s.material}</div>` : '')
      + (s.aufgaben || []).map(() => '<div class="af-aufgabe"></div>').join('')
      + (s.training ? '<div class="af-training"></div>' : '')
      + `<div class="af-unten"><button class="btn" type="button" data-weiter="-1"${akt ? '' : ' disabled'}>◀ Zurück</button><button class="btn haupt" type="button" data-weiter="1"${akt < S.length - 1 ? '' : ' disabled'}>Weiter ▶</button></div>`;
    const plaetze = inhalt.querySelectorAll(':scope > .af-aufgabe');
    (s.aufgaben || []).forEach((a, i) => baue(plaetze[i], a, {fertig:() => { if (s.aufgaben.every(x => geloest(x))) erledigt(s); }}));
    if (s.training) training({el:inhalt.querySelector('.af-training'), key:cfg.key + '-' + s.id, training:s.training, titel:s.titel || s.kurz, fertig:() => erledigt(s)});
    if (s.nach) s.nach(inhalt);
    if (oben) window.scrollTo(0, 0);
  }
  const geloest = a => !!(a._z && a._z.geloest);
  function gehe(i){
    if (!istAufgabe(S[akt]) && i > akt && !stand.erledigt[S[akt].id]) erledigt(S[akt]);
    akt = Math.min(Math.max(i, 0), S.length - 1); stand.schritt = akt; speichern(); zeichne(true);
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-schritt], [data-weiter]'); if (!b || !root.contains(b)) return;
    if (b.dataset.schritt != null) gehe(+b.dataset.schritt); else gehe(akt + +b.dataset.weiter);
  });
  zeichne();
  return {gehe, get schritt(){ return akt; }, stand};
}

/* ---------- Endlos (zufällige Aufgaben je Stufe, Serie und Rekord) ---------- */
const FLAMME = n => `<svg viewBox="0 0 32 40" aria-hidden="true"><path d="M16 2C18 9 27 14 27 26C27 33 22 38 16 38C10 38 5 33 5 26C5 20 9 16 11 11C12 15 13 17 15 18C16 13 17 8 16 2Z"/><text x="16" y="32" text-anchor="middle">${n}</text></svg>`;
function endlos(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, ST = cfg.stufen, KEY = cfg.key + '-endlos';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.rekord) stand.rekord = {};
  let stufe = Math.min(Math.max(stand.stufe || 1, 1), ST.length), serie = 0, akt = null, geloest = false;
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  root.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="af-fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs></svg>'
    + '<div class="af-kopf"><nav class="af-flammen" aria-label="Stufen"></nav><span class="af-serie"></span></div>'
    + '<main class="karte af-inhalt" aria-live="polite"><h2 class="af-stufe"></h2><div class="af-aufgabe"></div>'
    + '<div class="af-unten"><button class="btn" type="button" data-anders>↻ Andere Aufgabe</button><button class="btn haupt" type="button" data-naechste>Nächste Aufgabe ▶</button></div></main>';
  const $ = s => root.querySelector(s);
  function kopf(){
    $('.af-flammen').innerHTML = ST.map((x, i) => `<button class="af-flamme${i + 1 === stufe ? ' on' : ''}" type="button" data-stufe="${i + 1}" title="Stufe ${i + 1}: ${esc(x.name)}" aria-label="Stufe ${i + 1}: ${esc(x.name)}" aria-pressed="${i + 1 === stufe}">${FLAMME(i + 1)}</button>`).join('');
    $('.af-serie').innerHTML = `🔥 Serie: <b>${serie}</b> <span class="muted">· Rekord ${stand.rekord[stufe] || 0}</span>`;
    $('.af-stufe').textContent = `Stufe ${stufe}: ${ST[stufe - 1].name}`;
    $('[data-naechste]').disabled = !geloest;
    $('[data-anders]').disabled = geloest;
  }
  function neu(){
    geloest = false; akt = ST[stufe - 1].neu();
    baue($('.af-aufgabe'), akt, {fertig:() => {
      if (geloest) return;
      geloest = true; serie++;
      if (serie > (stand.rekord[stufe] || 0)){ stand.rekord[stufe] = serie; speichern(); }
      if (window.TrainerSync) TrainerSync.event({modus:'endlos', stufe, aufgabe:'s' + stufe, titel:ST[stufe - 1].name, gesamt:0, erstmals:true});
      kopf(); $('[data-naechste]').focus();
    }});
    kopf();
  }
  function setze(n){ stufe = n; stand.stufe = n; serie = 0; speichern(); neu(); }
  root.addEventListener('click', e => {
    const f = e.target.closest('[data-stufe]'); if (f) return setze(+f.dataset.stufe);
    if (e.target.closest('[data-anders]')){ serie = 0; return neu(); }
    if (e.target.closest('[data-naechste]') && geloest) return neu();
  });
  neu();
  return {neu, stufe:setze};
}

/* ---------- Training: Aufgaben auf Zeit und/oder endlos ---------- */
const trStufen = T => Array.isArray(T.stufen) && T.stufen.length ? T.stufen : [{name:'', szenarien:T.szenarien, woerterbuch:T.woerterbuch}];
const alternativen = s => String(s == null ? '' : s).split('|').map(x => x.trim()).filter(Boolean);
// Ablenker für Zahlen: eigene falsche Formeln zuerst, dann typische Fehler (±1, ±2, ±10, Ziffern vertauscht)
function zahlAblenker(l, falsch, runden){
  const d = Number.isInteger(l) ? 1 : runden ? Math.pow(10, -Math.max(0, runden - 1)) : 0.1;
  const r = x => Math.round(x * 1e9) / 1e9;
  const tausch = Number.isInteger(l) && Math.abs(l) >= 10 ? +String(Math.abs(l)).split('').reverse().join('') * Math.sign(l) : null;
  const kand = [...falsch, ...mischen([l + d, l - d, l + 2 * d, l - 2 * d, l + 10 * d, l - 10 * d, tausch].filter(x => x != null))].map(r);
  const aus = [];
  kand.forEach(x => { if (Math.abs(x - l) > 1e-9 && (l < 0 || x >= 0) && !aus.some(y => Math.abs(y - x) < 1e-9) && aus.length < 3) aus.push(x); });
  return aus;
}
// Aufgabengeber einer Stufe → () => {frage (HTML), loesung (Text), optionen (MC: [{t, ok}]), pruefe(text) → 'ok' | 'fast' | 'falsch', zahl}
function trGeber(st, T){
  const mc = T.antwort === 'mc';
  if (Array.isArray(st.szenarien) && st.szenarien.length){
    if (!window.Formel) throw new Error('aufgaben.js: Training mit Szenarien braucht lib/formel.js');
    return () => {
      const sz = st.szenarien[Math.floor(Math.random() * st.szenarien.length)], w = Formel.wuerfle(sz);
      const txt = x => Formel.zahlText(x) + (sz.einheit ? ' ' + sz.einheit : '');
      const tol = sz.runden != null ? 0.5 * Math.pow(10, -sz.runden) + 1e-9 : 1e-6;
      return {frage:w.frage, loesung:txt(w.loesung), zahl:true,
        optionen:mc ? mischen([{t:txt(w.loesung), ok:true}, ...zahlAblenker(w.loesung, w.falsch, sz.runden).map(x => ({t:txt(x), ok:false}))]) : null,
        pruefe:s => { const z = zahl(String(s).replace(/−/g, '-')); return !isNaN(z) && Math.abs(z - w.loesung) <= tol ? 'ok' : 'falsch'; }};
    };
  }
  const W = st.woerterbuch || {}, E = (W.eintraege || []).filter(x => Array.isArray(x) && alternativen(x[0]).length && alternativen(x[1]).length);
  const sp = Array.isArray(W.sprachen) ? W.sprachen : [];
  let stapel = [], zuletzt = -1;
  return () => {
    if (!stapel.length){ stapel = mischen(E.map((_, i) => i)); if (stapel.length > 1 && stapel[stapel.length - 1] === zuletzt) stapel.unshift(stapel.pop()); }
    const i = zuletzt = stapel.pop(), rueck = W.richtung === 'b-a' || (W.richtung === 'beide' && Math.random() < 0.5);
    const von = alternativen(E[i][rueck ? 1 : 0]), nach = alternativen(E[i][rueck ? 0 : 1]);
    const kopf = sp[0] || sp[1] ? `<span class="tr-sprache">${esc(sp[rueck ? 1 : 0] || '')} → ${esc(sp[rueck ? 0 : 1] || '')}</span>` : '';
    let optionen = null;
    if (mc){
      const andere = [];
      mischen(E.filter((_, j) => j !== i)).forEach(x => { const t = alternativen(x[rueck ? 0 : 1])[0]; if (!nach.some(n => norm(n) === norm(t)) && !andere.some(a => norm(a) === norm(t))) andere.push(t); });
      optionen = mischen([{t:nach[0], ok:true}, ...andere.slice(0, 3).map(t => ({t, ok:false}))]);
    }
    return {frage:kopf + `<span class="tr-wort">${esc(von.join(' / '))}</span>`, loesung:nach.join(' / '), optionen,
      pruefe(s){
        const t = norm(s); if (!t) return 'falsch';
        if (nach.some(n => norm(n) === t)) return 'ok';
        const nah = nach.some(n => { const v = norm(n).replace(/ /g, ''); return abstand(t.replace(/ /g, ''), v) <= Math.max(1, Math.floor(v.length * 0.2)); });
        return nah ? (W.tippfehler ? 'ok' : 'fast') : 'falsch';
      }};
  };
}
function training(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, T = cfg.training || {}, ST = trStufen(T), KEY = cfg.key + '-training';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.best) stand.best = {};
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  const mc = T.antwort === 'mc', anzahl = T.anzahl > 0 ? Math.round(T.anzahl) : 0, endlos = !anzahl;
  const Z = T.zeit && T.zeit.start > 0 ? {start:+T.zeit.start, schritt:+T.zeit.schritt || 0, min:T.zeit.min > 0 ? +T.zeit.min : 0.5} : null;
  let stufe = Math.min(Math.max(stand.stufe || 0, 0), ST.length - 1), gib = null, phase = 'start', akt = null, richtige = 0, nr = 0, fehler = [];
  let raf = 0, warte = 0, t0 = 0, dauer = 0;
  root.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="af-fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs></svg>'
    + '<div class="tr"><div class="af-kopf"><nav class="af-flammen" aria-label="Stufen"></nav><span class="tr-info"></span></div><div class="tr-karte" aria-live="polite"></div></div>';
  root.classList.add('af-training');
  const $ = s => root.querySelector(s), karte = $('.tr-karte'), lebt = () => root.isConnected;
  const best = () => stand.best[stufe] || 0;
  const zeitText = s => String(Math.round(s * 100) / 100).replace('.', ',') + ' s';
  function kopf(){
    $('.af-flammen').innerHTML = ST.length > 1 ? ST.map((x, i) => `<button class="af-flamme${i === stufe ? ' on' : ''}" type="button" data-trstufe="${i}" title="Stufe ${i + 1}${x.name ? ': ' + esc(x.name) : ''}" aria-label="Stufe ${i + 1}${x.name ? ': ' + esc(x.name) : ''}" aria-pressed="${i === stufe}">${FLAMME(i + 1)}</button>`).join('') : '';
    $('.tr-info').innerHTML = phase === 'start' || phase === 'ende' ? `Bestleistung: <b>${best()}</b>${endlos ? '' : ' von ' + anzahl}`
      : endlos ? `🔥 Serie: <b>${richtige}</b> <span class="muted">· Bestleistung ${best()}</span>` : `Aufgabe ${nr} von ${anzahl} <span class="muted">· ✓ ${richtige}</span>`;
  }
  function halt(){ cancelAnimationFrame(raf); clearTimeout(warte); }
  function startBild(){
    halt(); phase = 'start';
    try { gib = trGeber(ST[stufe], T); } catch (e) { karte.innerHTML = `<p class="af-fb falsch">${esc(e.message)}</p>`; return; }
    const name = ST[stufe].name ? `<h2 class="tr-titel">${ST.length > 1 ? `Stufe ${stufe + 1}: ` : ''}${esc(ST[stufe].name)}</h2>` : '';
    const zeit = Z ? `Für jede Aufgabe hast du <b>${zeitText(Z.start)}</b>${Z.schritt < 0 ? `, nach jeder richtigen Antwort ${zeitText(-Z.schritt)} weniger (mindestens ${zeitText(Z.min)})` : Z.schritt > 0 ? `, nach jeder richtigen Antwort ${zeitText(Z.schritt)} mehr` : ''}.` : 'Ohne Zeitdruck.';
    karte.innerHTML = name + `<ul class="tr-regeln"><li>${endlos ? 'Endlos: Wie lang wird deine Serie? Ein Fehler beendet sie.' : `${anzahl} Aufgaben – wie viele schaffst du?`}</li><li>${zeit}</li><li>${mc ? 'Klicke die richtige Antwort an (oder Taste 1–4).' : 'Tippe die Antwort ein und drücke Enter.'}${T.versuche ? ' Bei einem Fehler darfst du es nochmal versuchen.' : ''}</li></ul>`
      + `<button class="btn haupt tr-start" type="button">▶ Start</button>`;
    kopf(); const b = $('.tr-start'); if (b && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) b.focus({preventScroll:true});
  }
  function starte(){ halt(); richtige = 0; nr = 0; fehler = []; phase = 'laeuft'; naechste(); }
  function naechste(){
    halt();
    if (!lebt()) return;
    if (!endlos && nr >= anzahl) return ende();
    nr++; phase = 'laeuft';
    try { akt = gib(); } catch (e) { karte.innerHTML = `<p class="af-fb falsch">${esc(e.message)}</p>`; return; }
    karte.innerHTML = (Z ? '<div class="tr-zeit" aria-hidden="true"><div class="tr-balken"></div></div>' : '') + `<div class="tr-frage">${akt.frage}</div>`
      + (mc ? `<div class="tr-mc">${akt.optionen.map((o, i) => `<button class="tr-opt" type="button" data-tropt="${i}"><span class="tr-taste">${i + 1}</span>${esc(o.t)}</button>`).join('')}</div>`
        : `<div class="tr-form"><input class="feld tr-ein" ${akt.zahl ? 'inputmode="decimal" ' : ''}autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Antwort"><button class="btn haupt tr-ok" type="button">OK</button></div>`)
      + `<div class="tr-rueck"></div>` + (Z ? '' : '<button class="btn klein tr-weiss" type="button">Weiß ich nicht</button>');
    kopf();
    const ein = $('.tr-ein'); if (ein) ein.focus({preventScroll:true});
    if (Z){ dauer = Math.max(Z.min, Z.start + richtige * Z.schritt); t0 = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(){
    if (!lebt() || phase !== 'laeuft') return;
    const rest = 1 - (performance.now() - t0) / (dauer * 1000), b = $('.tr-balken');
    if (b){ b.style.width = Math.max(0, rest * 100) + '%'; b.classList.toggle('knapp', rest < 0.3); }
    if (rest <= 0) return falsch('zeit', '');
    raf = requestAnimationFrame(tick);
  }
  function antwort(text, opt){
    if (phase !== 'laeuft') return;
    const r = opt != null ? (akt.optionen[opt].ok ? 'ok' : 'falsch') : akt.pruefe(text);
    if (r === 'ok') return gut();
    if (T.versuche){
      const rk = $('.tr-rueck'); rk.className = 'tr-rueck falsch'; rk.textContent = r === 'fast' ? 'Fast – achte auf die Schreibweise. Nochmal!' : 'Nicht ganz – nochmal!';
      karte.classList.remove('tr-wackeln'); void karte.offsetWidth; karte.classList.add('tr-wackeln');
      if (opt != null){ const b = root.querySelector(`[data-tropt="${opt}"]`); if (b){ b.disabled = true; b.classList.add('falsch'); } }
      else { const e = $('.tr-ein'); e.value = ''; e.focus(); }
      return;
    }
    falsch(r, opt != null ? akt.optionen[opt].t : text);
  }
  function gut(){
    halt(); richtige++; phase = 'pause';
    karte.classList.add('tr-gut'); const rk = $('.tr-rueck'); rk.className = 'tr-rueck ok'; rk.textContent = '✓ Richtig';
    kopf(); warte = setTimeout(() => { karte.classList.remove('tr-gut'); naechste(); }, 450);
  }
  function falsch(grund, eingabe){
    halt(); phase = 'loesung';
    fehler.push({frage:akt.frage, loesung:akt.loesung, eingabe, zeit:grund === 'zeit'});
    const rk = $('.tr-rueck'); rk.className = 'tr-rueck falsch';
    rk.innerHTML = `${grund === 'zeit' ? '⏱ Zeit abgelaufen.' : grund === 'fast' ? 'Fast – achte auf die Schreibweise.' : '✗ Leider falsch.'} Richtig ist: <b>${esc(akt.loesung)}</b> <span class="muted">(Enter: weiter)</span>`;
    if (mc) root.querySelectorAll('[data-tropt]').forEach(b => { b.disabled = true; if (akt.optionen[+b.dataset.tropt].ok) b.classList.add('richtig'); else if (akt.optionen[+b.dataset.tropt].t === eingabe) b.classList.add('falsch'); });
    const e = $('.tr-ein'); if (e) e.readOnly = true;
    const w = $('.tr-weiss'); if (w) w.remove();
    warte = setTimeout(weiter, grund === 'zeit' ? 1800 : 2200);
  }
  function weiter(){ if (phase !== 'loesung') return; if (endlos) ende(); else naechste(); }
  function ende(){
    halt(); phase = 'ende';
    const alt = best(), neu = richtige > alt;
    if (neu){ stand.best[stufe] = richtige; speichern(); }
    const titel = (cfg.titel || 'Training') + (ST[stufe].name ? ' · ' + ST[stufe].name : '');
    if (window.TrainerSync) TrainerSync.event({modus:'endlos', stufe:stufe + 1, aufgabe:'training', titel:`${titel}: ${endlos ? 'Serie ' + richtige : richtige + ' von ' + anzahl}`, gesamt:0, erstmals:true});
    const liste = fehler.length ? `<details class="tr-fehler"${endlos ? ' open' : ''}><summary>${endlos ? 'Daran lag es' : `Fehler (${fehler.length})`}</summary><table><tr><th>Aufgabe</th><th>deine Antwort</th><th>richtig</th></tr>${fehler.slice(-12).map(f => `<tr><td>${f.frage}</td><td>${f.zeit ? '⏱' : f.eingabe ? esc(f.eingabe) : '–'}</td><td><b>${esc(f.loesung)}</b></td></tr>`).join('')}</table></details>` : '';
    karte.innerHTML = `<h2 class="tr-ergebnis">${endlos ? `Serie: ${richtige}` : `${richtige} von ${anzahl} richtig`}</h2>`
      + `<p>${neu ? '🎉 <b>Neue Bestleistung!</b>' : `Bestleistung: ${alt}${endlos ? '' : ' von ' + anzahl}`}</p>` + liste
      + `<button class="btn haupt tr-start" type="button">↻ ${endlos ? 'Neue Serie' : 'Nochmal'}</button>`;
    kopf(); $('.tr-start').focus({preventScroll:true});
    if (cfg.fertig && richtige >= (T.ziel != null ? T.ziel : endlos ? 10 : 0)) cfg.fertig();
  }
  root.addEventListener('click', e => {
    const f = e.target.closest('[data-trstufe]'); if (f){ stufe = +f.dataset.trstufe; stand.stufe = stufe; speichern(); return startBild(); }
    if (e.target.closest('.tr-start')) return starte();
    const o = e.target.closest('[data-tropt]'); if (o && !o.disabled) return antwort(null, +o.dataset.tropt);
    if (e.target.closest('.tr-weiss')) return falsch('weiss', '');
    if (e.target.closest('.tr-ok')) return absenden();
  });
  // kein <form>: in abgeschotteten iframes (Vorschau, Moodle) schickt der Browser Formulare nicht ab
  function absenden(){ const e = $('.tr-ein'); if (!e) return; if (phase === 'loesung') return weiter(); if (e.value.trim()) antwort(e.value); }
  function taste(e){
    if (!lebt()){ document.removeEventListener('keydown', taste); return; }
    if (e.target.closest && e.target.closest('input,textarea,select') && !e.target.closest('.af-training')) return;
    if (phase === 'loesung' && e.key === 'Enter'){ e.preventDefault(); return weiter(); }
    if (phase === 'laeuft' && e.key === 'Enter' && e.target.matches && e.target.matches('.tr-ein')){ e.preventDefault(); return absenden(); }
    if (mc && phase === 'laeuft' && /^[1-4]$/.test(e.key) && akt.optionen[+e.key - 1]){ const b = root.querySelector(`[data-tropt="${+e.key - 1}"]`); if (b && !b.disabled){ e.preventDefault(); antwort(null, +e.key - 1); } }
  }
  document.addEventListener('keydown', taste);
  startBild();
  return {stop:halt, start:starte};
}

window.Aufgaben = {baue, sequenz, endlos, training, mc, mehrfach, finde, zahl, eur, mischen, esc, bsText, TYPEN};
})();

</script>

<body>
<div class="wrap">
  <div class="bar"><div class="brand">Kurzfristige<span> Kredite</span></div></div>
  <div id="app"></div>
</div>
<script>
'use strict';
const {eur} = Aufgaben, $ = s => document.querySelector(s);

/* ---------- Material (Werte aus dem Heft, Kapitel 7) ---------- */
const R = {netto:10000, ust:1900, brutto:11900, zinsenKK:58.31, bruttoSkonto:238, nettoSkonto:200, ueberweisung:11662};
const RECHNUNG = `<div class="mt">Material: Eingangsrechnung eines Holzlieferanten (Auszug)</div>
  <table class="beleg"><tr><td>Rechnungsdatum</td><td>02.11.</td></tr><tr><td>Holz (Mahagoni), Warenwert netto</td><td>${eur(R.netto)}</td></tr>
  <tr><td>+ 19 % Umsatzsteuer</td><td>${eur(R.ust)}</td></tr><tr class="summe"><td>Rechnungsbetrag</td><td>${eur(R.brutto)}</td></tr></table>
  <p style="margin:8px 0 0">Zahlungsbedingungen: Zahlbar innerhalb von 30 Tagen ohne Abzug; bei Zahlung innerhalb von 10 Tagen 2 % Skonto.</p>`;
const KK_TEXT = `<p style="margin:8px 0 0">Saitgig hat zurzeit kein Guthaben. Nutzt Jakob das Skonto, muss er den Überweisungsbetrag mit dem Kontokorrentkredit bezahlen. Die Bank verlangt dafür für die 20 Tage <b>${eur(R.zinsenKK)}</b> Zinsen.</p>`;

/* ---------- Grafik Kontokorrentkredit ---------- */
function kkGrafik(){
  const P = [[0, 20], [1, 8], [2, -30], [3, -45], [4, -25], [5, 10], [6, -5], [7, -50], [8, -82], [9, -62], [10, -20], [11, 15]];
  const X = t => 70 + t * 48, Y = v => 40 + (30 - v) * 1.7;
  const pts = P.map(([t, v]) => X(t) + ',' + Y(v)).join(' '), flaeche = `${X(0)},${Y(0)} ${pts} ${X(11)},${Y(0)}`;
  return `<svg class="grafik" viewBox="0 0 640 280" role="img" aria-label="Kontostand eines Geschäftsbankkontos im Zeitverlauf mit Kreditlinie">
    <defs><pattern id="kkSchr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="schr"/></pattern>
    <clipPath id="kkU0"><rect x="0" y="${Y(0)}" width="640" height="300"/></clipPath><clipPath id="kkUL"><rect x="0" y="${Y(-70)}" width="640" height="300"/></clipPath></defs>
    <polygon points="${flaeche}" fill="url(#kkSchr)" clip-path="url(#kkU0)"/><polygon points="${flaeche}" class="ueberzogen" clip-path="url(#kkUL)"/>
    <line class="achse" x1="62" x2="632" y1="${Y(0)}" y2="${Y(0)}"/><line class="achse" x1="62" x2="62" y1="22" y2="256"/>
    <line class="limit" x1="62" x2="632" y1="${Y(-70)}" y2="${Y(-70)}"/><polyline class="kurve" points="${pts}"/>
    <text x="6" y="18">Kontostand</text><text x="56" y="${Y(0) + 4}" text-anchor="end">0 €</text><text x="632" y="${Y(0) + 18}" text-anchor="end">Zeit</text>
    <text x="70" y="${Y(-70) - 7}" class="rotT">Kreditlinie (Limit) – 70.000 €</text>
    <text x="${X(0) + 4}" y="${Y(20) - 10}">Guthaben</text><text x="${X(5)}" y="${Y(10) - 10}" text-anchor="middle">Kunde zahlt ein</text>
    <text x="${X(8) - 14}" y="${Y(-70) + 19}" text-anchor="end" class="rotT">geduldete Überziehung (noch teurer!) →</text>
    <text x="62" y="276">schraffiert = Kontokorrentkredit beansprucht → Zinsen</text></svg>`;
}

/* ---------- Zeitleiste Lieferantenkredit: Zahlungsdatum → Dauer der Kredite ---------- */
let lkTag = 10;
const datum = d => { const n = 2 + d; return n <= 30 ? String(n).padStart(2, '0') + '.11.' : String(n - 30).padStart(2, '0') + '.12.'; };
function tagAus(s){
  const m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
  if (!m) return null;
  const tag = +m[1], monat = +m[2], d = monat === 11 ? tag - 2 : monat === 12 ? 28 + tag : NaN;
  return d >= 0 && d <= 40 && tag >= 1 && tag <= (monat === 11 ? 30 : 31) ? d : null;
}
function zeitleiste(d){
  const X = t => 30 + t * 15, mitte = (a, b) => (X(a) + X(b)) / 2, lx = Math.min(Math.max(X(d), 60), 600);
  let h = `<svg class="grafik" viewBox="0 0 660 230" role="img" aria-label="Zeitleiste des Lieferantenkredits mit Zahlung am ${datum(d)}">
    <defs><pattern id="tlSchr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ebcb8b" fill-opacity=".35"/><line x1="0" y1="0" x2="0" y2="8" class="schr"/></pattern></defs>
    <rect class="gruen" x="${X(0)}" y="34" width="${X(10) - X(0)}" height="38"/><rect class="orange" x="${X(10)}" y="34" width="${X(30) - X(10)}" height="38"/><rect class="rot" x="${X(30)}" y="34" width="${X(40) - X(30)}" height="38"/>
    <text class="bt" x="${mitte(0, 10)}" y="50">10 Tage Skontofrist</text><text class="bt k" x="${mitte(0, 10)}" y="65">kostenlos</text>
    <text class="bt" x="${mitte(10, 30)}" y="50">20 Tage bis zum Zahlungsziel</text><text class="bt k" x="${mitte(10, 30)}" y="65">Preis = entgangenes Skonto</text>
    <text class="bt" x="${mitte(30, 40)}" y="57">zu spät</text>`;
  for (let t = 0; t <= 40; t++) h += `<line class="tick" x1="${X(t)}" x2="${X(t)}" y1="72" y2="${t % 5 ? 76 : 80}"/>`;
  [[0, 'Rechnung'], [10, 'Ende Skontofrist'], [30, 'Zahlungsziel']].forEach(([t, s]) => { h += `<text class="key" x="${X(t)}" y="94">${datum(t)}</text><text class="dt" x="${X(t)}" y="107">${s}</text>`; });
  [5, 15, 20, 25, 35, 40].forEach(t => { h += `<text class="dt" x="${X(t)}" y="94">${datum(t)}</text>`; });
  h += `<path d="M${X(d) - 6},24 L${X(d) + 6},24 L${X(d)},33 z" style="fill:var(--text)"/><line class="marke" x1="${X(d)}" x2="${X(d)}" y1="76" y2="214"/><text class="mt" x="${lx}" y="18" text-anchor="middle">Zahlung am ${datum(d)}</text>`;
  if (d > 0) h += `<rect class="lk" x="${X(0)}" y="136" width="${X(d) - X(0)}" height="16" rx="3"/>`;
  h += `<text x="${X(0)}" y="130">${d > 0 ? `Lieferantenkredit: ${d} ${d === 1 ? 'Tag' : 'Tage'} (02.11. bis ${datum(d)})` : 'Sofortige Zahlung: kein Lieferantenkredit'}</text>`;
  if (d <= 10) h += `<rect class="kk" x="${X(d)}" y="186" width="${X(30) - X(d)}" height="16" rx="3"/><text x="${Math.min(X(d), 330)}" y="180">Kontokorrentkredit: ${30 - d} Tage (${datum(d)} bis 02.12.)</text>`;
  return h + '</svg>';
}
function standText(d){
  if (d <= 10) return `<b>Zahlung mit Skonto.</b> Jakob überweist ${eur(R.ueberweisung)}. Der Lieferantenkredit dauert ${d} ${d === 1 ? 'Tag' : 'Tage'} und ist kostenlos. Weil Saitgig kein Guthaben hat, zahlt Jakob mit dem Kontokorrentkredit. Er läuft so lange, bis Jakob ohnehin hätte zahlen müssen (Zahlungsziel 02.12.): <b>${30 - d} Tage</b>.`;
  if (d <= 30) return `<b>Zahlung ohne Abzug.</b> Jakob überweist ${eur(R.brutto)}. Der Lieferantenkredit dauert ${d} Tage – die Tage nach dem 12.11. bezahlt Jakob mit dem entgangenen Skonto.`;
  return `<b>Zu spät!</b> Das Zahlungsziel (02.12.) ist um ${d - 30} ${d - 30 === 1 ? 'Tag' : 'Tage'} überschritten. Saitgig gerät in Zahlungsverzug – der Lieferer kann mahnen und Verzugszinsen verlangen.`;
}
function setzeTag(d, vomRegler){
  lkTag = d; $('#lkBild').innerHTML = zeitleiste(d); $('#lkStand').innerHTML = standText(d);
  if (vomRegler) $('#lkDatum').value = datum(d); else $('#lkRegler').value = d;
}
document.addEventListener('input', e => {
  if (e.target.id === 'lkRegler') setzeTag(+e.target.value, true);
  if (e.target.id === 'lkDatum'){
    const d = tagAus(e.target.value);
    $('#lkHinweis').textContent = d == null ? 'Gib ein Datum zwischen 02.11. und 12.12. ein, z. B. 20.11.' : 'Gib ein Datum ein (z. B. 20.11.) oder verschiebe den Regler.';
    if (d != null) setzeTag(d, false);
  }
});
document.addEventListener('change', e => { if (e.target.id === 'lkDatum' && tagAus(e.target.value) != null) e.target.value = datum(tagAus(e.target.value)); });

/* ---------- Schritte ---------- */
Aufgaben.sequenz({el:'#app', key:'kurzkredit', schritte:[
  {id:'kontokorrent', kurz:'Kontokorrentkredit', titel:'Kontokorrentkredit', html:() => `<h2>Kontokorrentkredit</h2>
    <p>Nicht jeder Kredit ist ein großes Darlehen. Für den laufenden Geschäftsverkehr nutzen Unternehmen kurzfristige Kredite.</p>
    <div class="info"><p><b>Kontokorrentkredit</b> (ital. <i>conto corrente</i> = laufendes Konto): Die Bank erlaubt dem Unternehmen, sein <b>Geschäftsbankkonto</b> bis zu einer <b>Kreditlinie</b> (Kreditlimit = Obergrenze) zu überziehen – ohne weitere Rücksprache. Er dient zur Finanzierung des laufenden Geschäftsverkehrs, zur <b>Sicherung der Liquidität</b> und zur Überbrückung kurzfristiger Zahlungsengpässe.</p></div>
    ${kkGrafik()}
    <ul class="merk"><li>kurzfristiger Kredit; <b>Zinsen nur für die tatsächlich beanspruchte Höhe und Dauer</b></li>
    <li>vergleichsweise <b>teure</b> Kreditart; wird das Limit überschritten (geduldete Überziehung), fallen noch höhere Überziehungszinsen an</li>
    <li><b>Tilgung automatisch</b> durch Zahlungseingänge (z. B. Kunden überweisen); die Bank kann die Kreditlinie jederzeit anpassen</li>
    <li>zusätzlich können Kontoführungsgebühren anfallen → Konto <b>6750 KGV</b> (Kosten des Geldverkehrs); Zinsen → <b>7510 ZAW</b></li></ul>`},

  {id:'dispo', kurz:'Dispositionskredit', titel:'Dispositionskredit', html:`<h2>Dispositionskredit („Dispo“)</h2>
    <div class="info"><p>Der <b>Dispositionskredit</b> funktioniert genauso wie der Kontokorrentkredit, wird aber <b>Privatkunden</b> auf dem <b>Girokonto</b> eingeräumt. Die Höhe hängt von der <b>Kreditwürdigkeit</b> und den <b>regelmäßigen Geldeingängen</b> (z. B. Gehalt) ab.</p>
    <p>Vorteil: hohe Flexibilität. Nachteil: sehr hohe Zinsen → nur in Ausnahmefällen nutzen!</p></div>
    <div class="alltag"><b>Aus dem Alltag · Der Dispo auf deinem ersten Girokonto</b>Mit dem ersten Ausbildungsgehalt bietet dir die Bank vielleicht einen Dispo von 1.000 € an. Bequem – aber teuer: Dispozinsen liegen oft bei über 10 % im Jahr. Wer dauerhaft „im Minus“ lebt, zahlt jeden Monat drauf.</div>
    <table class="beleg vergleich" style="max-width:none"><tr><td></td><td><b>Kontokorrentkredit</b></td><td><b>Dispositionskredit</b></td></tr>
    <tr><td>für wen?</td><td>Unternehmen</td><td>Privatkunden</td></tr><tr><td>welches Konto?</td><td>Geschäftsbankkonto</td><td>Girokonto</td></tr></table>`},

  {id:'lieferantenkredit', kurz:'Lieferantenkredit', titel:'Lieferantenkredit auf der Zeitleiste', html:() => `<h2>Lieferantenkredit</h2>
    <div class="info"><p>Gibt ein Lieferer ein <b>Zahlungsziel</b> (z. B. „zahlbar innerhalb von 30 Tagen“), gewährt er seinem Kunden einen <b>Kredit</b>. Bietet er zusätzlich <b>Skonto</b> an (z. B. „2 % Skonto bei Zahlung innerhalb von 10 Tagen“), gilt: Bis zum Ende der <b>Skontofrist</b> ist der Lieferantenkredit <b>zinslos</b>. Wer später zahlt, verzichtet auf das Skonto – der entgangene <b>Nettoskonto</b> ist der Preis für die restlichen Tage.</p>
    <p>Rechnet man 2 % für 20 Tage auf ein ganzes Jahr hoch, entspricht das einem Zinssatz von etwa <b>36 %</b>! Ein Kontokorrentkredit kostet meist nur 8–12 %. Deshalb gilt: <b>Skonto nutzen – notfalls mit dem Kontokorrentkredit.</b></p></div>
    <div class="material">${RECHNUNG}</div>
    <h3>Probiere aus: Wann bezahlt Jakob die Rechnung?</h3>
    <div class="datum"><label>Zahlungsdatum <input class="feld" type="text" id="lkDatum" value="${datum(lkTag)}" autocomplete="off" aria-describedby="lkHinweis"></label>
      <input type="range" id="lkRegler" min="0" max="40" step="1" value="${lkTag}" aria-label="Zahlungsdatum verschieben"></div>
    <div class="nr" id="lkHinweis">Gib ein Datum ein (z. B. 20.11.) oder verschiebe den Regler.</div>
    <div id="lkBild">${zeitleiste(lkTag)}</div><div class="stand" id="lkStand">${standText(lkTag)}</div>`,
    aufgaben:[{typ:'zahlen', frage:'Beantworte die Fragen mithilfe der Zeitleiste.',
      ok:'Alles richtig! Je früher Jakob mit Skonto zahlt, desto länger muss der Kontokorrentkredit laufen – bis zum Zahlungsziel.',
      felder:[
        {t:'Lies ab: Wie viele Tage ist der Lieferantenkredit kostenlos?', l:10, e:'Tage', h:'Schau auf den grünen Abschnitt der Zeitleiste.'},
        {t:'Jakob zahlt am letzten Tag der Skontofrist (12.11.) mit dem Kontokorrentkredit. Lies ab: Wie viele Tage müsste der Kontokorrentkredit bis zum Zahlungsziel laufen?', l:20, e:'Tage', h:'Stelle das Datum 12.11. ein und lies den schraffierten Balken ab.'},
        {t:'Jakob zahlt schon am 06.11. mit Skonto. Stelle das Datum ein und lies ab: Wie viele Tage müsste der Kontokorrentkredit dann laufen?', l:26, e:'Tage', h:'Stelle das Datum 06.11. ein und lies den schraffierten Balken ab.'}]}]},

  {id:'a71', kurz:'7.1', titel:'7.1 Merkmale zuordnen',
    erinnerung:'<p><b>Kontokorrentkredit:</b> Unternehmen überziehen ihr Geschäftsbankkonto bis zur Kreditlinie. <b>Dispositionskredit:</b> dasselbe für Privatkunden auf dem Girokonto. <b>Lieferantenkredit:</b> der Lieferer gewährt ein Zahlungsziel; bis zum Ende der Skontofrist kostenlos.</p>',
    aufgaben:[{typ:'zuordnen', nr:'7.1', frage:'Ordne die Merkmale dem passenden Kredit zu. Ziehe jede Karte in ein Feld (oder tippe erst die Karte, dann das Feld an).',
      ok:'Alle 12 Merkmale richtig zugeordnet!',
      felder:[['kk', 'Kontokorrentkredit'], ['dispo', 'Dispositionskredit'], ['lk', 'Lieferantenkredit']],
      karten:[
        {t:'Das Geschäftsbankkonto darf bis zur Kreditlinie überzogen werden.', z:'kk'},

        {t:'Die Bank bietet ihn dir vielleicht mit deinem ersten Ausbildungsgehalt an.', z:'dispo'},

        {t:'Sein Preis ist das entgangene Skonto.', z:'lk'},

  {id:'a72', kurz:'7.2', titel:'7.2 Kontokorrent- und Dispositionskredit',
    erinnerung:'<p>Beide Kredite erlauben es, ein Konto bis zu einer Obergrenze zu überziehen; Zinsen fallen nur für die beanspruchte Höhe und Dauer an. Der <b>Kontokorrentkredit</b> ist für Unternehmen, der <b>Dispositionskredit</b> für Privatkunden.</p>',
    aufgaben:[
      {typ:'mc', nr:'7.2', frage:'Unterscheide Kontokorrentkredit und Dispositionskredit: Welche Aussage unterscheidet beide richtig?',
        options:['Kontokorrentkredit: Unternehmen auf dem Geschäftsbankkonto – Dispositionskredit: Privatkunden auf dem Girokonto',
          'Kontokorrentkredit: Privatkunden auf dem Girokonto – Dispositionskredit: Unternehmen auf dem Geschäftsbankkonto',
          'Der Kontokorrentkredit ist zinslos, der Dispositionskredit nicht.', 'Der Dispositionskredit ist langfristig, der Kontokorrentkredit kurzfristig.'], correct:[0],
        why:{1:'Genau vertauscht: Unternehmen haben ein Geschäftsbankkonto, Privatkunden ein Girokonto.', 2:'Für beide Kredite verlangt die Bank Zinsen.', 3:'Beide Kredite sind kurzfristig.'}},
      {typ:'mc', frage:'Wovon hängt die Höhe eines Dispositionskredits vor allem ab?',
        options:['von der Kreditwürdigkeit und den regelmäßigen Geldeingängen, z. B. dem Gehalt', 'vom Skontosatz der Lieferer', 'von der Zahl der Maschinen im Unternehmen', 'von der Laufzeit eines Darlehens'], correct:[0],
        why:{1:'Skonto gehört zum Lieferantenkredit.', 2:'Den Dispo bekommen Privatkunden, nicht Unternehmen.', 3:'Der Dispo hat keine feste Laufzeit wie ein Darlehen.'}},
      {typ:'mc', frage:'Was haben Kontokorrent- und Dispositionskredit gemeinsam?',
        options:['Das Konto darf bis zu einer Obergrenze überzogen werden; Zinsen fallen nur für die beanspruchte Höhe und Dauer an.',
          'Beide sind bis zum Ende einer Frist kostenlos.', 'Beide dienen zur langfristigen Finanzierung von Maschinen.', 'Beide gewährt ein Lieferer.'], correct:[0],
        why:{1:'Kostenlos bis zum Ende einer Frist ist nur der Lieferantenkredit (Skontofrist).', 2:'Beide sind kurzfristig – Maschinen finanziert man langfristig (Goldene Finanzierungsregel).', 3:'Beide gewährt die Bank.'}}]},

  {id:'a73', kurz:'7.3', titel:'7.3 Skonto berechnen und buchen',
    erinnerung:'<p>Bruttoskonto = Rechnungsbetrag · Skontosatz : 100<br>Nettoskonto = Bruttoskonto : 1,19<br>Überweisungsbetrag = Rechnungsbetrag – Bruttoskonto</p>',
    material:RECHNUNG,
    aufgaben:[{typ:'kombi', teile:[{typ:'zahlen', nr:'7.3', knopf:'Ergebnisse überprüfen',
      frage:'Berechne den Bruttoskonto, den Nettoskonto und den Überweisungsbetrag, wenn Jakob innerhalb der Skontofrist zahlt. Trage deine Ergebnisse ein und überprüfe sie.',
      ok:`Richtig! Bruttoskonto ${eur(R.bruttoSkonto)}, Nettoskonto ${eur(R.nettoSkonto)} (Steuerberichtigung ${eur(R.bruttoSkonto - R.nettoSkonto)}), Überweisungsbetrag ${eur(R.ueberweisung)}.`,
      felder:[
        {t:'Bruttoskonto', l:R.bruttoSkonto, e:'€', h:'Bruttoskonto = Rechnungsbetrag · Skontosatz : 100'},
        {t:'Nettoskonto', l:R.nettoSkonto, e:'€', h:'Nettoskonto = Bruttoskonto : 1,19'},
        {t:'Überweisungsbetrag', l:R.ueberweisung, e:'€', h:'Überweisungsbetrag = Rechnungsbetrag – Bruttoskonto'}]}, {typ:'buchungssatz', frage:'Jakob überweist den Rechnungsbetrag innerhalb der Skontofrist mit Skontoabzug. Bilde den Buchungssatz für die Zahlung.',
        konten:['2600 VORST', '2800 BK', '4400 VE', '4800 UST', '6000 AWR', '6002 NR', '7510 ZAW'],
        soll:[['4400 VE', R.brutto]], haben:[['2800 BK', R.ueberweisung], ['6002 NR', R.nettoSkonto], ['2600 VORST', R.bruttoSkonto - R.nettoSkonto]],
        steuer:['2600 VORST'],
        betraege:[['Rechnungsbetrag', R.brutto], ['Bruttoskonto', R.bruttoSkonto], ['Nettoskonto', R.nettoSkonto], ['Steuerberichtigung', R.bruttoSkonto - R.nettoSkonto], ['Überweisungsbetrag', R.ueberweisung]],
        nebenrechnung:`Steuerberichtigung = Bruttoskonto – Nettoskonto = ${eur(R.bruttoSkonto)} – ${eur(R.nettoSkonto)} = ${eur(R.bruttoSkonto - R.nettoSkonto)}`}]}]},

  {id:'a74', kurz:'7.4', titel:'7.4 Kostenvergleich',
    erinnerung:'<p><b>Kosten des Lieferantenkredits</b> = entgangener Nettoskonto (siehe 7.3: Nettoskonto = Rechnungsbetrag · 2 % : 1,19). <b>Kosten des Kontokorrentkredits</b> = Zinsen der Bank. <b>Kostenvorteil</b> = Differenz beider Kosten.</p>',
    material:RECHNUNG + KK_TEXT,

      felder:[

        {t:'Kosten des Kontokorrentkredits', l:R.zinsenKK, e:'€', h:'Die Kosten des Kontokorrentkredits sind die Zinsen der Bank (siehe Material).'},
        {t:'Kostenvorteil bei Aufnahme des Kontokorrentkredits', l:R.nettoSkonto - R.zinsenKK, e:'€', h:'Kostenvorteil = Kosten des Lieferantenkredits – Kosten des Kontokorrentkredits'}]}, {typ:'mc', frage:'Welche Handlungsempfehlung leitet sich daraus für Jakob ab?',
        options:['Jakob sollte innerhalb der Skontofrist (bis 12.11.) mit dem Kontokorrentkredit zahlen und Skonto abziehen.',
          'Jakob sollte bis zum 02.12. warten und ohne Abzug zahlen, weil dann keine Zinsen anfallen.',
          'Jakob sollte für die Rechnung ein langfristiges Darlehen aufnehmen.', 'Jakob sollte die Rechnung erst nach dem 02.12. bezahlen.'], correct:[0],
        after:'Der Kontokorrentkredit kostet nur 58,31 €, das Skonto bringt 200,00 € – Jakob spart 141,69 €.',
        why:{1:'Dann zahlt er zwar keine Bankzinsen, verliert aber 200,00 € Skonto – das ist teurer als 58,31 € Zinsen.', 2:'Ein Darlehen passt nicht zu einer kurzfristigen Rechnung über 20 Tage (Goldene Finanzierungsregel).', 3:'Dann gerät Saitgig in Zahlungsverzug.'}}]}]},

  {id:'a75', kurz:'7.5', titel:'7.5 Lückentext Kontokorrentkredit',
    erinnerung:'<p>Der Kontokorrentkredit ist ein <b>kurzfristiger</b> Kredit und eine vergleichsweise <b>teure</b> Kreditart. Er dient zur Sicherung der Liquidität und zur Überbrückung kurzfristiger Zahlungsengpässe – bis zur <b>Kreditlinie</b>.</p>',
    aufgaben:[{typ:'luecken', nr:'7.5', frage:'Begründe, warum Jakob die Rechnung nicht dauerhaft über den Kontokorrentkredit finanzieren sollte. Vervollständige dazu den Text.',
      ok:'Richtig! Der Kontokorrentkredit ist nur für kurzfristige Engpässe gedacht.',
      text:'Der Kontokorrentkredit ist eine [[teure|günstige|zinslose]] und [[kurzfristige|langfristige]] Kreditart. Er soll nur [[kurzfristige Zahlungsengpässe|langfristige Investitionen|fehlendes Eigenkapital]] überbrücken. Wird er dauerhaft beansprucht, kosten die [[Zinsen|Skonti|Tilgungen]] viel Geld, und die [[Kreditlinie|Skontofrist|Eigenkapitalquote]] fehlt für andere Zahlungen.'}]},

  {id:'ueberblick', kurz:'Überblick', titel:'Überblick', html:`<h2>Überblick · Kurzfristige Kredite</h2>
    <div class="info"><p><b>Kontokorrentkredit:</b> Überziehung des Geschäftsbankkontos bis zur Kreditlinie; Zinsen nur für beanspruchte Höhe und Dauer; Tilgung durch Zahlungseingänge.</p>
    <p><b>Dispositionskredit:</b> wie Kontokorrentkredit, aber für Privatkunden auf dem Girokonto.</p>
    <p><b>Lieferantenkredit:</b> bis zum Ende der Skontofrist kostenlos, danach sehr teuer, weil der Nettoskonto verloren geht → Skonto ausnutzen.</p></div>
    <p class="muted">Übertrage den Überblick in dein Heft (Seite 2, Kapitel 7) und vergleiche mit dem Lösungsblatt L7.</p>`}
]});
