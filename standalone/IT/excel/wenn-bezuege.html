// Gruppen (Fach bzw. Fach + Jahrgangsstufe) und alle Bereiche mit Ordner, für nav.js, sync.js und lehrer.html
(function (K) {
  K.gruppen = [];
  K.faecher.forEach(f => (f.stufen
    ? f.stufen.map(s => ({pfad: f.id + '/' + s.id, fach: f, stufe: s, titel: f.titel + ' ' + (s.kurz || s.titel), text: s.text || f.text, bereiche: s.bereiche}))
    : [{pfad: f.id, fach: f, stufe: null, titel: f.titel, text: f.text, bereiche: f.bereiche}]).forEach(g => K.gruppen.push(g)));
  K.bereiche = [].concat(...K.gruppen.map(g => g.bereiche.map(b => Object.assign(b, {pfad: g.pfad + '/' + b.id, gruppe: g}))));
  (K.einreichungen || []).forEach(e => {
    const b = K.bereiche.find(x => x.id === e.bereich);
    if (b && e.tool && !b.tools.some(t => t.id === e.tool.id)) b.tools.push(e.tool);
  });
})(window.KATALOG);

<script>/* ../../nav.js */
/* Menüleiste der Übungsplattform
 *
 * Baut oben auf jeder Seite die Leiste: vorne das Fach-Menü (IT, BWR › Jahrgangsstufe 9 …),
 * dahinter die Bereiche des gewählten Fachs aus katalog.js.
 * Fährt man mit der Maus über einen Bereich (am Handy: antippen), klappen
 * dessen Übungen auf. Außerdem füllt das Skript die Startseite bzw. Fachseite (#pf-start),
 * die Auswahl der Jahrgangsstufe (#pf-fach) und die Übersichtsseite eines Bereichs (#pf-bereich).
 * Das zuletzt gewählte Fach merkt sich der Browser (localStorage pf-fach) für die Startseite.
 *
 * Fehlt katalog.js oder nav.js, läuft das Tool trotzdem – nur ohne Menüleiste.
 * Tools mit gruppe (katalog.js) stehen im Menü in einem Untermenü (klappt beim Darüberfahren auf)
 * und auf der Bereichsseite unter einer Zwischenüberschrift.
 * Tools mit bedingt: true (katalog.js) sind zunächst ausgeblendet; sync.js blendet sie ein,
 * wenn der Server sie für den angemeldeten Schüler freigibt (Klasse pf-sichtbar).
 * In Einzeldateien (werkzeuge/einzeldateien.py, window.PF_EINZELDATEI) zeigt die
 * Leiste nur Name und Hell/Dunkel-Knopf, weil es keine anderen Seiten gibt.
 * Unten auf jeder Seite (außer Einzeldateien) stehen Links zu Impressum und Datenschutz (pb_public/impressum.html, datenschutz.html).
 */

  'use strict';
  const K = window.KATALOG;
  if (!K) return;

  // Wurzel der Plattform = Ordner, in dem nav.js liegt (funktioniert auch per Doppelklick)
  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const root = document.documentElement;

  // Aktueller Bereich: über das Tool oder <html data-bereich="IT/excel">.
  // Aktuelle Gruppe (Fach bzw. Fach + Jahrgangsstufe): über den Bereich, <html data-gruppe="BWR/9II">
  // oder <html data-fach="BWR">, sonst die zuletzt gewählte (localStorage pf-fach), sonst die erste.
  const BER = K.bereiche.find(b => b.tools.some(t => t.id === TOOL)) || K.bereiche.find(b => b.pfad === root.dataset.bereich) || null;
  const BEREICH = BER ? BER.id : '';
  const FACHSEITE = K.faecher.find(f => f.id === root.dataset.fach) || null;
  let GRUPPE = BER ? BER.gruppe : K.gruppen.find(g => g.pfad === root.dataset.gruppe) || (FACHSEITE && K.gruppen.find(g => g.fach === FACHSEITE));
  if (GRUPPE){ try { localStorage.setItem('pf-fach', GRUPPE.pfad); } catch (e) {} }
  else {
    let zuletzt = null;
    try { zuletzt = localStorage.getItem('pf-fach'); } catch (e) {}
    GRUPPE = K.gruppen.find(g => g.pfad === zuletzt) || K.gruppen[0];
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const bereichUrl = b => BASE + b.pfad + '/index.html';
  const toolUrl = (b, t) => BASE + b.pfad + '/' + t.datei;
  const gruppeUrl = g => BASE + g.pfad + '/index.html';
  const fachUrl = f => BASE + f.id + '/index.html';

  const CSS = `

@media print{.pf-nav{display:none}}`;

  // Farben der Bereiche (katalog.js: farbe = dunkles Design, farbeHell = helles Design,
  // farbeSchrift = optional hellerer Ton für Schrift im dunklen Design).
  // --accent gilt für die ganze Seite des aktuellen Bereichs, --bc nur für den eigenen Menüpunkt.
  function akzentCss(){
    let css = '';
    K.bereiche.forEach(b => {
      if (!b.farbe) return;
      const dunkel = b.farbeSchrift || b.farbe;
      css += `\n.pf-item[data-b="${b.id}"]{--bc:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark] .pf-item[data-b="${b.id}"]{--bc:${dunkel}}`;
      if (b.id === BEREICH) css += `\nhtml[data-theme]{--accent:${b.farbeHell || b.farbe};--accent-text:${b.farbeHell || b.farbe}}\nhtml[data-theme=dark]{--accent:${b.farbe};--accent-text:${dunkel}}`;
    });
    return css;
  }

  const SONNE = '☀', MOND = '☾';
  function theme(){ return root.dataset.theme === 'dark' ? 'dark' : 'light'; }

  // Tools derselben gruppe (katalog.js) hintereinander → [{name, tools}], ohne gruppe: name ''
  function gruppen(b){
    const out = [];
    b.tools.forEach(t => {
      const g = out[out.length - 1];
      if (g && g.name === (t.gruppe || '')) g.tools.push(t); else out.push({name: t.gruppe || '', tools: [t]});
    });
    return out;
  }
  const toolLi = (b, t) => `<li${t.bedingt ? ` class="pf-bedingt" data-tool="${esc(t.id)}"` : ''}><a href="${toolUrl(b, t)}"${t.id === TOOL ? ' aria-current="page"' : ''}>${esc(t.titel)}</a></li>`;

  // Fach-Menü: Fächer ohne Stufen direkt, Fächer mit Jahrgangsstufen als Untermenü (wie gruppe bei Tools)
  function fachMenue(){
    const eintrag = (g, text) => `<li><a href="${gruppeUrl(g)}"${g === GRUPPE ? ' aria-current="page"' : ''}>${esc(text)}</a></li>`;
    return `<li class="pf-item pf-fach"><a href="${gruppeUrl(GRUPPE)}" aria-haspopup="true" title="Fach wechseln"><small>Fach</small> ${esc(GRUPPE.titel)}</a>
      <ul class="pf-drop">${K.faecher.map(f => f.stufen
        ? `<li class="pf-sub"><a href="${fachUrl(f)}"${GRUPPE.fach === f ? ' aria-current="true"' : ''} aria-haspopup="true">${esc(f.titel)}</a><ul class="pf-drop2">${f.stufen.map(st => eintrag(K.gruppen.find(g => g.stufe === st), st.titel)).join('')}</ul></li>`
        : eintrag(K.gruppen.find(g => g.fach === f), f.titel)).join('')}</ul></li>`;
  }

  function buildNav(){
    const s = document.createElement('style'); s.textContent = CSS + akzentCss(); document.head.appendChild(s);
    const nav = document.createElement('nav');
    nav.className = 'pf-nav' + (window.PF_EINZELDATEI ? ' pf-einzeln' : '');
    nav.setAttribute('aria-label', 'Bereiche');
    const name = esc(K.name).replace(/^(\S+)/, '<span>$1</span>');
    const EINZELN = !!window.PF_EINZELDATEI;
    nav.innerHTML = `<div class="pf-in">
      ${EINZELN ? `<span class="pf-brand">${name}</span>` : `<a class="pf-brand" href="${BASE}index.html">${name}</a>`}
      <ul class="pf-menu">${fachMenue()}${GRUPPE.bereiche.map(b => `
        <li class="pf-item" data-b="${esc(b.id)}">
          <a href="${bereichUrl(b)}"${b.id === BEREICH ? ' aria-current="true"' : ''}>${esc(b.titel)}</a>
          <ul class="pf-drop">${b.tools.length
            ? gruppen(b).map(g => g.name
              ? `<li class="pf-sub"><a href="${bereichUrl(b)}"${g.tools.some(t => t.id === TOOL) ? ' aria-current="true"' : ''} aria-haspopup="true">${esc(g.name)}</a><ul class="pf-drop2">${g.tools.map(t => toolLi(b, t)).join('')}</ul></li>`
              : g.tools.map(t => toolLi(b, t)).join('')).join('')
              + `<li><a class="pf-all" href="${bereichUrl(b)}">Alle Übungen zu ${esc(b.titel)}</a></li>`
            : '<li class="pf-leer">Hier entstehen bald Übungen.</li>'}
          </ul>
        </li>`).join('')}
      </ul>
      <div class="pf-right">
        ${document.getElementById('themeBtn') ? '' : `<button class="pf-btn" id="pfTheme" type="button" aria-label="Hell/Dunkel umschalten">${theme() === 'dark' ? SONNE : MOND}</button>`}
        ${EINZELN ? '' : '<button class="pf-btn pf-burger" type="button" aria-label="Menü">☰</button>'}
      </div>
    </div>`;
    document.body.insertBefore(nav, document.body.firstChild);
    if (!EINZELN){
      const fuss = document.createElement('footer');
      fuss.className = 'pf-fuss';
      fuss.innerHTML = `<a href="${BASE}impressum.html">Impressum</a> · <a href="${BASE}datenschutz.html">Datenschutz</a>`;
      document.body.appendChild(fuss);
    }

    // Passt die Leiste nicht in die Breite (Fach-Menü, lange Bereichsnamen, Anmeldung), kommt das Menü hinter ☰
    const innen = nav.querySelector('.pf-in');
    // Erst den Zusatz „– Fortschritt wird nicht gespeichert“ weglassen (pf-knapp), erst dann ☰ (pf-eng)
    const voll = () => innen.scrollWidth > innen.clientWidth + 1;
    const platz = () => {
      nav.classList.remove('pf-eng', 'pf-knapp');
      if (EINZELN || !voll()) return;
      nav.classList.add('pf-knapp');
      if (voll()) nav.classList.add('pf-eng');
    };
    platz();
    addEventListener('resize', platz);
    new MutationObserver(platz).observe(nav.querySelector('.pf-right'), {childList: true, subtree: true, characterData: true});
    if (document.fonts) document.fonts.ready.then(platz);
    const schmal = () => matchMedia('(max-width:760px)').matches || nav.classList.contains('pf-eng');

    const burger = nav.querySelector('.pf-burger');
    if (burger) burger.addEventListener('click', () => nav.classList.toggle('open'));
    const tb = nav.querySelector('#pfTheme');
    if (tb) tb.addEventListener('click', () => {
      const t = theme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = t; tb.textContent = t === 'dark' ? SONNE : MOND;
      try { localStorage.setItem('wenn-theme', t); } catch (e) {}
    });

    // Geräte ohne Maus: erstes Antippen klappt auf, zweites öffnet die Bereichsseite
    const items = [...nav.querySelectorAll('.pf-item')];
    if (matchMedia('(hover: none)').matches) items.forEach(li => li.firstElementChild.addEventListener('click', e => {
      if (schmal() || li.classList.contains('open')) return;
      e.preventDefault();
      items.forEach(x => x.classList.toggle('open', x === li));
    }));
    // Untermenüs (gruppe): nach links aufklappen, wenn rechts kein Platz ist; ohne Maus erst antippen
    nav.querySelectorAll('.pf-sub').forEach(sub => {
      sub.addEventListener('mouseenter', () => {
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
      });
      if (matchMedia('(hover: none)').matches) sub.firstElementChild.addEventListener('click', e => {
        if (schmal() || sub.classList.contains('open')) return;
        e.preventDefault();
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
        sub.classList.add('open');
      });
    });
    document.addEventListener('click', e => { if (!nav.contains(e.target)){ nav.querySelectorAll('.pf-sub.open').forEach(x => x.classList.remove('open')); items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
  }

  /* ---------- Übersichtsseiten ---------- */
  // Tools mit gruppe (katalog.js) stehen unter einer gemeinsamen Zwischenüberschrift
  function kacheln(b){
    if (!b.tools.length) return '<p class="pf-hinweis">Hier entstehen bald Übungen.</p>';
    const kachel = t => `<a class="pf-tile${t.bedingt ? ' pf-bedingt' : ''}"${t.bedingt ? ` data-tool="${esc(t.id)}"` : ''} href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`;
    return gruppen(b).map(g => (g.name ? `<h3 class="pf-gruppe">${esc(g.name)}</h3>` : '') + `<div class="pf-grid">${g.tools.map(kachel).join('')}</div>`).join('');
  }
  function buildPages(){
    const start = document.getElementById('pf-start');
    if (start){
      const gruppenseite = !!root.dataset.gruppe;
      if (gruppenseite) document.title = GRUPPE.titel + ' – ' + K.name;
      start.innerHTML = `<h1>${esc(gruppenseite ? GRUPPE.titel : K.name)}</h1><p class="pf-lead">${esc(GRUPPE.text)}${gruppenseite ? '' : ' ' + esc(K.untertitel)}</p>`
        + GRUPPE.bereiche.map(b => `<section class="pf-sec"><h2><a href="${bereichUrl(b)}">${esc(b.titel)}</a></h2><p class="pf-text">${esc(b.text)}</p>${kacheln(b)}</section>`).join('');
    }
    // Fach mit Jahrgangsstufen: Auswahl der Stufe
    const fach = document.getElementById('pf-fach');
    if (fach && FACHSEITE){
      document.title = FACHSEITE.titel + ' – ' + K.name;
      fach.innerHTML = `<h1>${esc(FACHSEITE.titel)}</h1><p class="pf-lead">${esc(FACHSEITE.text)} Wähle die Jahrgangsstufe.</p><div class="pf-grid">`
        + K.gruppen.filter(g => g.fach === FACHSEITE).map(g => `<a class="pf-tile" href="${gruppeUrl(g)}"><b>${esc(g.stufe.titel)}</b><span>${esc(g.text)}</span></a>`).join('') + '</div>';
    }
    const be = document.getElementById('pf-bereich');
    const b = BER;
    if (be && b){
      document.title = b.titel + ' – ' + K.name;
      be.innerHTML = `<h1>${esc(b.titel)}</h1><p class="pf-lead">${esc(b.text)}</p>${kacheln(b)}`;
    }
  }

  // Hell/Dunkel höchstens einmal pro Sekunde umschalten und weich überblenden – kein Flackern beim schnellen Klicken
  let themeSperre = 0;
  document.addEventListener('click', e => {
    const btn = e.target.closest('#themeBtn,#pfTheme');
    if (!btn) return;
    if (Date.now() < themeSperre){ e.stopImmediatePropagation(); e.preventDefault(); return; }
    themeSperre = Date.now() + 1000;
    root.classList.add('pf-fade'); btn.classList.add('pf-gesperrt');
    setTimeout(() => root.classList.remove('pf-fade'), 400);
    setTimeout(() => btn.classList.remove('pf-gesperrt'), 1000);
  }, true);

  function init(){ buildNav(); buildPages(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>/* ../../sync.js */
/* vibe learning – Anmeldung und Anbindung an PocketBase
 *
 * Läuft die Seite über den PocketBase-Server, erscheint beim ersten Öffnen ein
 * Anmeldefenster: ein Feld für Code oder Benutzername (bei Benutzernamen folgt das
 * Passwort), alternativ „Seite ohne Anmeldung nutzen“. Oben rechts in der Leiste
 * steht danach, wer angemeldet ist; dort meldet man sich auch an und ab.
 *
 * Schüler: Fortschritt wird auf dem Server gespeichert, jede gelöste Aufgabe protokolliert.
 * Lehrkraft/Admin: Anmeldung gilt bis zum Schließen des Browsers, im Menü steht
 * der Link zur Verwaltung (lehrer.html).
 * Wird die HTML-Datei direkt geöffnet (oder läuft kein PocketBase dahinter),
 * passiert nichts davon – die Seite speichert dann wie bisher nur im Browser.
 *
 * Bedingte Menüpunkte (katalog.js: bedingt) blendet das Skript nach der Anmeldung ein,
 * wenn der Server sie für diesen Schüler freigibt (/api/trainer/sichtbar).
 *
 * Die Seite ruft auf:
 *   TrainerSync.changed()      nach jeder Änderung am gespeicherten Stand
 *   TrainerSync.event({...})   wenn eine Aufgabe richtig gelöst wurde
 */
(function () {
  'use strict';

  const CONFIG = {
    api: '/api/trainer',
    verwaltung: 'lehrer.html'   // relativ zum Ordner von sync.js
  };

  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const PAGE = document.documentElement.dataset.trainer || '';          // Tool-id aus katalog.js, leer auf Übersichtsseiten
  const TOOL_IDS = window.KATALOG ? [].concat(...window.KATALOG.bereiche.map(b => b.tools.map(t => t.id))) : [];
  const ALL_PREFIXES = [...new Set(['wenn', 'uo', 'fn', PAGE].concat(TOOL_IDS))].filter(Boolean).map(id => id + '-');
  const OWN = PAGE + '-';
  const SKIP = ['wenn-theme'];                                             // Hell/Dunkel bleibt pro Gerät
  const K = {code: 'ts-code', anzeige: 'ts-anzeige', klasse: 'ts-klasse', queue: 'ts-queue', stand: 'ts-stand-' + PAGE};
  const SS = {gast: 'ts-gast', lehrer: 'ts-lehrer'};                      // gilt nur bis zum Schließen des Browsers

  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} },
    keys(){ try { return Object.keys(localStorage); } catch (e) { return []; } }
  };
  const ss = {
    get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  function lehrerSitzung(){ try { return JSON.parse(ss.get(SS.lehrer) || 'null'); } catch (e) { return null; } }

  const hosted = /^https?:$/.test(location.protocol);
  let aktiv = false, pushTimer = null, pushPending = false, menuEl = null, lastSnap = '';

  /* ---------- Hilfen ---------- */
  function api(path, opt){
    opt = opt || {};
    return fetch(CONFIG.api + path, {
      method: opt.method || 'GET',
      keepalive: !!opt.keepalive,
      headers: {'Content-Type': 'application/json', 'X-Trainer-Code': ls.get(K.code) || ''},
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    });
  }
  const trainerKeys = prefix => ls.keys().filter(k => k.startsWith(prefix) && !SKIP.includes(k));
  function snapshot(prefix){ prefix = prefix || OWN; const d = {}; trainerKeys(prefix).sort().forEach(k => { d[k] = ls.get(k); }); return d; }
  function applySnapshot(d, prefix){
    prefix = prefix || OWN;
    trainerKeys(prefix).forEach(k => ls.del(k));
    Object.keys(d || {}).forEach(k => { if (k.startsWith(prefix) && !SKIP.includes(k) && typeof d[k] === 'string') ls.set(k, d[k]); });
  }
  function wipeLocal(){
    ALL_PREFIXES.forEach(p => trainerKeys(p).forEach(k => ls.del(k)));
    ls.keys().filter(k => k.startsWith('ts-stand-')).forEach(k => ls.del(k));
    [K.queue, K.code, K.klasse, K.anzeige].forEach(k => ls.del(k));
  }
  function reloadOnce(){
    let last = 0; try { last = +sessionStorage.getItem('ts-reload') || 0; } catch (e) {}
    if (Date.now() - last < 8000) return;
    try { sessionStorage.setItem('ts-reload', Date.now()); } catch (e) {}
    location.reload();
  }

  /* ---------- Fortschritt abgleichen ---------- */
  async function pull(){
    if (!PAGE){ setStatus('ok'); return; }
    const r = await api('/state?seite=' + PAGE);
    const local = +ls.get(K.stand) || 0, server = +r.stand || 0;
    if (r.daten && server > local){
      const before = JSON.stringify(snapshot());
      applySnapshot(r.daten);
      ls.set(K.stand, server);
      lastSnap = JSON.stringify(snapshot());
      if (lastSnap !== before) reloadOnce();
    } else if (local > server) await push();
    setStatus('ok');
  }

  async function push(keepalive){
    clearTimeout(pushTimer); pushPending = false;
    if (!aktiv || !PAGE) return;
    const stand = +ls.get(K.stand) || Date.now();
    setStatus('saving');
    try {
      await api('/state', {method: 'POST', body: {seite: PAGE, daten: snapshot(), stand}, keepalive});
      setStatus('ok');
    } catch (err){
      if (err.status === 409){ await pull().catch(() => setStatus('offline')); }
      else if (err.status === 401) abgelaufen();
      else { pushPending = true; setStatus('offline'); }
    }
  }

  function changed(){
    if (!PAGE) return;
    // Seiten schreiben ihren Stand auch beim Öffnen neu – nur echte Änderungen zählen,
    // sonst würde ein frisch geöffnetes Gerät einen neueren Stand vom Server überschreiben.
    const snap = JSON.stringify(snapshot());
    if (snap === lastSnap) return;
    lastSnap = snap;
    ls.set(K.stand, Date.now());
    if (!aktiv) return;
    pushPending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }

  /* ---------- Protokoll gelöster Aufgaben ---------- */
  function queue(){ try { return JSON.parse(ls.get(K.queue) || '[]'); } catch (e) { return []; } }
  function event(ev){
    if (!aktiv || !PAGE) return;
    const q = queue(); q.push(Object.assign({seite: PAGE}, ev)); ls.set(K.queue, JSON.stringify(q.slice(-500)));
    flush();
  }
  let flushing = false;
  async function flush(keepalive){
    if (!aktiv || flushing) return;
    const q = queue(); if (!q.length) return;
    flushing = true;
    try {
      await api('/events', {method: 'POST', body: {events: q.slice(0, 200)}, keepalive});
      ls.set(K.queue, JSON.stringify(queue().slice(Math.min(q.length, 200))));
    } catch (err){
      if (err.status === 401) abgelaufen(); else setStatus('offline');
    } finally { flushing = false; }
    if (queue().length && !keepalive) setTimeout(flush, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && aktiv){ if (pushPending) push(true); flush(true); }
  });
  window.addEventListener('online', () => { if (aktiv){ flush(); if (pushPending) push(); else pull().catch(() => {}); } });


  /* ---------- Gast-Fortschritt beim Anmelden übernehmen ---------- */
  // Für jede Übung: Ist das Konto dort noch leer, wird der Stand dieses Geräts hochgeladen,
  // sonst gilt der Stand vom Server.
  async function uebernehmen(){
    for (const p of ALL_PREFIXES){
      const id = p.slice(0, -1), lokal = snapshot(p);
      const st = await api('/state?seite=' + id);
      const leer = !st.daten || !Object.keys(st.daten).length;
      if (leer){
        if (!Object.keys(lokal).length) continue;
        const stand = Date.now();
        await api('/state', {method: 'POST', body: {seite: id, daten: lokal, stand}});
        ls.set('ts-stand-' + id, stand);
      } else {
        applySnapshot(st.daten, p);
        ls.set('ts-stand-' + id, +st.stand || 0);
      }
    }
  }

  /* ---------- Oberfläche: Anmeldefenster + Menü oben rechts ---------- */
  const CSS = `
.ts-ov{position:fixed;inset:0;z-index:2000;background:rgba(20,24,32,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.ts-box{position:relative;background:var(--panel,#f6f8fb);color:var(--text,#2e3440);border:1px solid var(--border,#cdd3de);border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);font:16px/1.5 system-ui,sans-serif}
.ts-box h2{margin:0 0 6px;font-size:21px}
.ts-box p{margin:0 0 14px;color:var(--muted,#5b6578)}
.ts-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:0;background:none;color:var(--muted,#5b6578);font-size:22px;line-height:1;cursor:pointer}
.ts-x:hover{background:var(--panel2,#eceff4);color:var(--text,#2e3440)}
.ts-in{width:100%;box-sizing:border-box;font:700 20px ui-monospace,Consolas,monospace;letter-spacing:.03em;padding:12px 14px;border-radius:10px;border:2px solid var(--slot-border,var(--border,#a7b1c2));background:var(--slot,var(--panel2,#eceff4));color:var(--text,#2e3440);outline:none}
.ts-in:focus{border-color:var(--accent,#5e81ac)}
.ts-btn{margin-top:12px;width:100%;font:600 17px system-ui,sans-serif;padding:12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent,#5e81ac) 50%,var(--panel,#f6f8fb));background:color-mix(in srgb,var(--accent,#5e81ac) 22%,var(--panel,#f6f8fb));color:color-mix(in srgb,var(--accent,#5e81ac) 60%,var(--text,#2e3440));cursor:pointer}
.ts-btn:disabled{opacity:.6;cursor:wait}

.ts-badge.gast .ts-dot{background:#d08770}

.ts-dd a:hover,.ts-dd button:hover{background:var(--panel2,#eceff4)}
@media (max-width:640px){.ts-badge .ts-lang{display:none}}`;

  function injectCss(){ const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); }
  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function setStatus(st){
    const b = menuEl && menuEl.querySelector('.ts-badge');
    if (!b || !aktiv) return;
    b.className = 'ts-badge ' + st;
    const t = {ok: 'Fortschritt gespeichert', saving: 'Wird gespeichert …', offline: 'Keine Verbindung – wird später gespeichert'}[st] || '';
    b.title = t;
    const i = menuEl.querySelector('.ts-status'); if (i) i.textContent = t;
  }

  // Menü oben rechts: angemeldet (Dropdown mit Abmelden) oder Gast (Klick öffnet die Anmeldung)
  function showMenu(){
    if (menuEl) menuEl.remove();
    const host = document.querySelector('.pf-right') || document.querySelector('.hdr-right') || document.querySelector('header') || document.body;
    const L = lehrerSitzung();
    menuEl = document.createElement('div');
    menuEl.className = 'ts-wrap';
    if (aktiv){
      const klasse = ls.get(K.klasse);
      menuEl.innerHTML = `<button class="ts-badge saving" type="button"><span class="ts-dot"></span>👤 <span class="ts-lang">${escH(ls.get(K.anzeige) || ls.get(K.code))}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(ls.get(K.anzeige) || ls.get(K.code))}</b>${klasse ? ' (Klasse ' + escH(klasse) + ')' : ''}<br><span class="ts-status"></span></div>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else if (L){
      menuEl.innerHTML = `<button class="ts-badge" type="button">👤 <span class="ts-lang">${escH(L.name)}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(L.name)}</b> (${L.rolle === 'admin' ? 'Admin' : 'Lehrkraft'})</div>
        <a href="${BASE + CONFIG.verwaltung}">Verwaltung: Klassen und Auswertung</a>
        <button type="button" data-a="ab">Abmelden</button></div>`;
    } else {
      menuEl.innerHTML = `<button class="ts-badge gast" type="button" title="Fortschritt wird nicht gespeichert. Klicken zum Anmelden."><span class="ts-dot"></span>Nicht angemeldet<span class="ts-lang">&nbsp;– Fortschritt wird nicht gespeichert</span></button>`;
    }
    host.insertBefore(menuEl, host.firstChild);
    menuEl.querySelector('.ts-badge').addEventListener('click', () => {
      if (!aktiv && !L){ showLogin(); return; }
      menuEl.classList.toggle('open');
    });
    const ab = menuEl.querySelector('[data-a="ab"]');
    if (ab) ab.addEventListener('click', abmelden);
    document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) menuEl.classList.remove('open'); });
  }

  function showLogin(msg){
    if (document.querySelector('.ts-ov')) return;
    const ov = document.createElement('div');
    ov.className = 'ts-ov';
    ov.innerHTML = `<div class="ts-box" role="dialog" aria-modal="true" aria-label="Anmelden">
      <button class="ts-x" type="button" aria-label="Schließen und ohne Anmeldung nutzen" title="Ohne Anmeldung nutzen">×</button>
      <form class="ts-f1" autocomplete="off">
        <h2>Anmelden</h2>
        <p>Gib deinen Zugangscode oder deinen Benutzernamen ein.</p>
        <input class="ts-in" name="kennung" placeholder="Code oder Benutzername" autocapitalize="none" spellcheck="false" aria-label="Code oder Benutzername">
        <button class="ts-btn" type="submit">Weiter</button>
      </form>
      <form class="ts-f2" hidden>
        <h2>Passwort</h2>
        <p>für <b class="ts-wer"></b></p>
        <input class="ts-in" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
        <button class="ts-btn" type="submit">Anmelden</button>
        <button class="ts-zurueck" type="button">Anderen Namen eingeben</button>
      </form>
      <div class="ts-err">${msg || ''}</div>
      <button class="ts-gast" type="button">Seite ohne Anmeldung nutzen<small>Dein Fortschritt wird dann nur in diesem Browser gespeichert.</small></button>
    </div>`;
    document.body.appendChild(ov);
    const f1 = ov.querySelector('.ts-f1'), f2 = ov.querySelector('.ts-f2'), err = ov.querySelector('.ts-err');
    const k = f1.kennung, pw = f2.passwort;
    setTimeout(() => k.focus(), 50);

    const gast = () => { ss.set(SS.gast, '1'); ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') gast(); };
    document.addEventListener('keydown', esc);
    ov.querySelector('.ts-x').addEventListener('click', gast);
    ov.querySelector('.ts-gast').addEventListener('click', gast);
    ov.querySelector('.ts-zurueck').addEventListener('click', () => { f2.hidden = true; f1.hidden = false; err.textContent = ''; k.select(); });

    async function senden(btn, body){
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch(CONFIG.api + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
          .then(async x => { const j = await x.json().catch(() => ({})); if (!x.ok) throw new Error(x.status === 429 ? 'Zu viele Versuche – bitte kurz warten.' : (j.message || 'Anmeldung fehlgeschlagen.')); return j; });
        if (r.passwort){ f1.hidden = true; f2.hidden = false; ov.querySelector('.ts-wer').textContent = body.kennung; pw.value = ''; pw.focus(); return; }
        if (r.rolle === 'schueler'){
          ls.set(K.code, r.cred); ls.set(K.anzeige, r.anzeige); ls.set(K.klasse, r.klasse || '');
          ss.del(SS.lehrer); ss.del('ts-reload');
          aktiv = true;
          await uebernehmen().catch(() => {});
        } else {
          ss.set(SS.lehrer, JSON.stringify({rolle: r.rolle, token: r.token, name: r.name}));
        }
        location.reload();
      } catch (x){
        err.textContent = x.message || 'Anmeldung fehlgeschlagen.';
        (f2.hidden ? k : pw).select();
      } finally { btn.disabled = false; }
    }
    f1.addEventListener('submit', e => {
      e.preventDefault();
      const v = k.value.trim();
      if (!v){ err.textContent = 'Bitte gib deinen Code oder Benutzernamen ein.'; return; }
      senden(f1.querySelector('.ts-btn'), {kennung: v});
    });
    f2.addEventListener('submit', e => {
      e.preventDefault();
      if (!pw.value){ err.textContent = 'Bitte gib dein Passwort ein.'; return; }
      senden(f2.querySelector('.ts-btn'), {kennung: k.value.trim(), passwort: pw.value});
    });
  }

  async function abmelden(){
    if (lehrerSitzung()){ ss.del(SS.lehrer); ss.del(SS.gast); location.reload(); return; }
    if (!confirm(`Abmelden?\n\nAngemeldet als ${ls.get(K.anzeige) || ls.get(K.code)}. Dein Fortschritt bleibt auf dem Server gespeichert.`)) return;
    if (pushPending) await push();
    await flush();
    if (queue().length && !confirm('Einige gelöste Aufgaben konnten noch nicht übertragen werden (keine Verbindung). Trotzdem abmelden?')) return;
    wipeLocal(); ss.del(SS.gast); ss.del('ts-sichtbar');
    location.reload();
  }
  function abgelaufen(){
    aktiv = false;
    wipeLocal(); ss.del('ts-sichtbar');
    showMenu();
    showLogin('Deine Anmeldung ist nicht mehr gültig. Bitte melde dich neu an.');
  }

  /* ---------- Bedingte Menüpunkte (z. B. Tipp-Aufgabe nur mit aufgegebener Aufgabe) ---------- */
  function zeigeTools(ids){
    // Tool-ids bestehen nur aus a–z, 0–9 und - (katalog.js); andere werden ignoriert
    ids.filter(id => /^[a-z0-9-]+$/.test(id)).forEach(id => document.querySelectorAll(`[data-tool="${id}"]`).forEach(el => el.classList.add('pf-sichtbar')));
  }
  async function sichtbar(){
    try { zeigeTools(JSON.parse(ss.get('ts-sichtbar') || '[]')); } catch (e) {}   // Stand der letzten Seite, ohne Flackern
    try { const r = await api('/sichtbar'); ss.set('ts-sichtbar', JSON.stringify(r.tools || [])); zeigeTools(r.tools || []); } catch (e) {}
  }

  /* ---------- Start ---------- */
  async function start(){
    if (!hosted || window.PF_EINZELDATEI) return;          // Einzeldatei: immer ohne Anmeldung, Fortschritt nur im Browser
    try {
      const h = await fetch('/api/health', {cache: 'no-store'});
      if (!h.ok) return;                                    // kein PocketBase: Seite läuft nur lokal
    } catch (e){ return; }
    injectCss();
    aktiv = !!ls.get(K.code);
    showMenu();
    if (!aktiv){
      if (!lehrerSitzung() && !ss.get(SS.gast)) showLogin();
      return;
    }
    sichtbar();
    try { await pull(); flush(); }
    catch (err){ if (err.status === 401) abgelaufen(); else setStatus('offline'); }
  }

  lastSnap = JSON.stringify(snapshot());   // Stand beim Laden der Seite (vor deren Initialisierung)
  window.TrainerSync = {changed, event, anmelden: () => showLogin(), get aktiv(){ return aktiv; }, get lehrer(){ return lehrerSitzung(); }, abmelden};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<style>/* basis.css */
/* basis.css – gemeinsame Gestaltung aller Excel-Trainer (Nord-Farben, hell/dunkel über [data-theme=dark]).

:root{

  --blk-fn:#4c8a89; --cell:#ffffff; --cellhd:#eceff4; --grid:#cdd3de; --r0:#5e81ac; --r1:#a8434d; --r2:#8a5f84;
  --r3:#5e8a45; --r4:#b0663f; --r5:#4c8a89;
}

  --bg:#2e3440; --panel:#3b4252; --panel2:#434c5e; --text:#eceff4; --muted:#a9b3c4; --border:#4c566a;
  --cond:#81a1c1; --then:#a3be8c; --else:#bf616a; --slot:#434c5e; --slot-border:#616e88; --ok-bg:#3e4a45;
  --err-bg:#4a3c45; --err:#d4848b; --solved-bg:#3e4a45; --solved-border:#6f8a5c; --solved-text:#a3be8c;
  --flame-off:#4c566a; --flame-num-off:#9aa4b8; --blk-val:#ebcb8b; --blk-val-text:#2e3440; --blk-cond:#b48ead;
  --blk-sym:#8a95ab; --on-color:#2e3440; --accent:#a3be8c; --blk-fn:#8fbcbb; --cell:#3b4252; --cellhd:#434c5e;
  --grid:#4c566a; --r0:#81a1c1; --r1:#d4848b; --r2:#b48ead; --r3:#a3be8c; --r4:#d08770; --r5:#8fbcbb;
}
*{box-sizing:border-box}

<script>/* ../../lib/aufgaben.js */
/* aufgaben.js – Aufgabenbausteine für alle Fächer: Aufgaben als Daten, Prüfung und Rückmeldung eingebaut
 *
 * Einbinden (Pfad zum Ordner pb_public/lib/, z. B. aus BWR/9II/finanzierung/ ../../../lib/):
 *   <link rel="stylesheet" href="../../../lib/aufgaben.css">   <script src="../../../lib/aufgaben.js"><\/script>
 * Farben kommen aus den Variablen der Seite (--panel, --panel2, --border, --accent, --text, --muted).
 *
 * Aufgabe = Objekt mit typ. Für alle Typen: nr (z. B. '7.1'), frage (Aufgabenstellung, HTML),
 * erinnerung und material (HTML, stehen über der Aufgabe; erinnerungZu:true = Erinnerung startet zugeklappt), ok (Text bei Erfolg),
 * Formeln mit Bruchstrich in jedem HTML-Text: <span class="bruch"><span>Zähler</span><span>Nenner</span></span> (aufgaben.css),
 * danach (weitere Aufgabe, erscheint erst nach richtiger Lösung, z. B. Handlungsempfehlung).
 *   mc           options:[Texte], correct:[Indizes] (mehrere = Mehrfachauswahl, oder multi:true), why:{Index: Erklärung},
 *                after (Text nach Erfolg), mono, mischen:false (Reihenfolge behalten), sofort:false
 *                (bei genau einer richtigen Antwort wird sonst beim Antippen sofort geprüft).
 *                Dasselbe Format wie type:'choice' in den Excel-Erklärungen.
 *   zahlen       felder:[{t (Text), l (Lösung), e (Einheit), h (Hinweis bei Fehler), tol (Toleranz, Std. 0,005)}]
 *                Eingabe im deutschen Format (1.234,50 €), Knopftext über knopf:'…'
 *   luecken      text:'… [[richtig|falsch|falsch]] …' → Auswahllisten (erste Antwort richtig, wird gemischt)
 *                ziehen:true → Wortbank statt Auswahllisten: Wörter in die Lücken ziehen oder erst Wort, dann Lücke
 *                antippen (Wort in der Lücke antippen = zurück). Bank: je Lücke das richtige Wort, dazu die falschen
 *                Antworten der Lücken und extra:['…'] (weitere Ablenker), Doppelte nur einmal. [[Wort]] ohne | reicht hier.
 *   zuordnen     felder:[[id, Titel]], karten:[{t (Text), z (Feld-id)}]; Ziehen mit Maus/Finger oder
 *                erst Karte, dann Feld antippen. Richtige bleiben liegen, falsche gehen zurück.
 *   tabelle      Tabelle zum Ausfüllen (z. B. Tilgungsplan): spalten:['Jahr', 'Zinsen', …],
 *                zeilen:[['1', 40000, {l:2000}, …], …] – Text bzw. Zahl = vorgegeben (Zahlen mit 2 Nachkommastellen),
 *                {l: Lösung} = Eingabefeld; hinweise:{Spaltenindex: 'Zinsen = Restschuld · 5 %'}, tol (Std. 0,005),
 *                einheit (z. B. '€', erscheint im Spaltenkopf). Falsche Felder werden rot, Hinweise je Spalte.
 *   freitext     felder:['1. Sicherheit', '2. Sicherheit'] (Beschriftungen, je ein Eingabefeld),
 *                antworten:[['Grundschuld'], ['Zession', 'Abtretung von Forderungen'], …] (je Eintrag Schreibweisen);
 *                ein Feld ist richtig, wenn ein Begriff darin vorkommt (Groß/klein, ä/ae egal), jedes Feld braucht
 *                einen anderen Eintrag. Tippfehler (Abstand bis 45 % bei langen, 30 % bei kurzen Wörtern) gelten als
 *                „fast richtig“ mit Hinweis auf die Schreibweise; tippfehler:'ok' zählt sie als richtig.
 *   chat         Lern-Chat wie bei LearningSnacks: name, bild (Emoji), nachrichten:[…], jede Nachricht ist
 *                'Text des Bots' (HTML erlaubt) oder eine Frage {bot:'Frage', …} mit einer Antwortform:
 *                  antworten:[{t:'mehr', ok:true, r:'Genau! …'}, {t:'weniger', r:'Nein, …'}]   (Knöpfe)
 *                  zahl:{l:11900, e:'€', tol}   oder   freitext:{antworten:[…]} (wie Typ freitext)
 *                  dazu r (Antwort des Bots bei richtig) und rFalsch (Erklärung bei falsch)
 *                Bei Fehlern erklärt der Bot und macht weiter; am Ende Punkte und „Noch einmal“.
 *                Gilt als gelöst (fertig), sobald der Chat einmal ganz durchlaufen ist.
 *   buchungssatz konten:['2800 BK', …] (Auswahlliste), soll:[['0700 MA', 40000], …], haben:[…],
 *                steuer:['2600 VORST', '4800 UST'] (für den Hinweis), nebenrechnung (HTML nach Lösung)
 *                prüft: Konten, Soll/Haben vertauscht, fehlende Steuer, Beträge; Lösung im Skill-Format
 *
 * API
 *   Aufgaben.baue(el, a, {fertig})  Baustein in Element el; fertig(a) nach richtiger Lösung (inkl. danach)
 *   Aufgaben.sequenz({el, key, schritte})  Erarbeitung aus Schritten mit Knöpfen, ✓, Zähler, Zurück/Weiter:
 *       schritt = {id, kurz (Knopf), titel, html (String oder Funktion), erinnerung, erinnerungZu, material,
 *                  aufgaben:[…], nach(el) (nach dem Zeichnen, für eigene Grafiken)}
 *       Schritte mit Aufgaben melden TrainerSync.event (modus 'erarbeitung', aufgabe = schritt.id),
 *       Info-Schritte gelten beim Weitergehen als erledigt. Gespeichert: <key>-stand {schritt, erledigt}.
 *   Aufgaben.endlos({el, key, stufen})  Endlos-Modus wie in den Excel-Übungen: Stufen als Flammen, Serie und Rekord,
 *       „Andere Aufgabe“ (Serie auf 0), „Nächste Aufgabe“ nach richtiger Lösung.
 *       stufe = {name, neu() → Aufgabe (beliebiger Typ, frisch erzeugt; h/ok für Rechenweg nutzen)}
 *       Meldet TrainerSync.event (modus 'endlos', stufe 1…n). Gespeichert: <key>-endlos {stufe, rekord:{stufe: n}}.
 *       Rückgabe {neu() (neue Aufgabe), stufe(n) (Stufe wechseln)}. Vorbild: BWR/9II/finanzierung/zinsrechnung.html
 *   Aufgaben.mc.html(a, auswahl:Set, geprueft, reihenfolge?) / Aufgaben.mc.pruefen(a, auswahl) → {ok, gruende}
 *       für Seiten mit eigenem Ablauf (Excel-Erklärungen: tabelle.js, und-oder.html)
 *   Aufgaben.finde(antworten, text) → {i (Eintrag), wort, fast} oder null   (Freitext-Abgleich, auch einzeln nutzbar)
 *   Helfer: zahl('1.234,50 €') → 1234.5, eur(n) → '1.234,50 €', mischen(liste), esc(text), bsText(soll, haben)
 */
(function(){
'use strict';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const r2 = n => Math.round(n * 100) / 100;
const zahlText = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2});
const eur = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
function zahl(s){
  s = String(s == null ? '' : s).replace(/€|%|Tage?|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? +s : NaN;
}
function mischen(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const erinnerungHTML = x => x.erinnerung ? `<details class="erinnerung"${x.erinnerungZu ? '' : ' open'}><summary>Erinnerung${x.erinnerungZu ? ' (zum Aufklappen)' : ''}</summary>${x.erinnerung}</details>` : '';

// Buchungssatz im Format des BWR-Skills: „an“ auf der letzten Soll-Zeile, weitere Haben-Konten bündig darunter
function bsText(soll, haben){
  const w1 = Math.max(...soll.map(x => x[0].length)), b1 = Math.max(...soll.map(x => eur(x[1]).length));
  const w2 = Math.max(...haben.map(x => x[0].length)), b2 = Math.max(...haben.map(x => eur(x[1]).length));
  const z = (x, w, b) => x[0].padEnd(w) + '  ' + eur(x[1]).padStart(b);
  const zeilen = soll.map((x, i) => z(x, w1, b1) + (i === soll.length - 1 ? '   an   ' + z(haben[0], w2, b2) : ''));
  haben.slice(1).forEach(x => zeilen.push(' '.repeat(w1 + b1 + 10) + z(x, w2, b2)));
  return zeilen.join('\n');
}

/* ---------- Freitext-Abgleich mit Tippfehlern ---------- */
const norm = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
function abstand(a, b){   // Damerau-Levenshtein (vertauschte Nachbarn zählen 1)
  const d = [];
  for (let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++){
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
function finde(antworten, text){
  const t = norm(text); if (!t) return null;
  const woerter = t.split(' '), stuecke = [];
  for (let n = 1; n <= 3; n++) for (let i = 0; i + n <= woerter.length; i++) stuecke.push(woerter.slice(i, i + n).join(''));
  let best = null;
  antworten.forEach((eintrag, i) => [].concat(eintrag).forEach(wort => {
    const v = norm(wort), vz = v.replace(/ /g, '');
    if ((' ' + t + ' ').includes(v) || t.replace(/ /g, '').includes(vz)){ if (!best || best.fast) best = {i, wort:[].concat(eintrag)[0], fast:false, d:0}; return; }
    const tol = Math.max(1, Math.floor(vz.length * (vz.length >= 10 ? 0.45 : 0.3)));
    stuecke.forEach(s => { const d = abstand(s, vz); if (d <= tol && (!best || (best.fast && d < best.d))) best = {i, wort:[].concat(eintrag)[0], fast:true, d}; });
  }));
  return best;
}
