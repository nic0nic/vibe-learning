      else if (ks(s) === ks(a.haben) && ks(h) === ks(a.soll)) t = 'Soll und Haben sind vertauscht. Überlege bei jedem Konto: Nimmt es zu oder ab, und auf welcher Seite steht es?';
      else if (ks(s) !== ks(a.soll) || ks(h) !== ks(a.haben)){
        const st = los.find(x => (a.steuer || []).includes(x[0]) && !alle.some(y => y.k === x[0]));
        t = 'Die Konten stimmen noch nicht. ' + (st ? `Denke an das Konto ${st[0]}.` : alle.length > n ? 'Es sind zu viele Konten.' : alle.length < n ? 'Es fehlt ein Konto.' : 'Überlege, welche Konten sich durch den Geschäftsfall verändern.');
      } else {
        const soll = (l, k) => l.find(x => x[0] === k)[1];
        const falsch = [...s.filter(x => Math.abs(x.b - soll(a.soll, x.k)) > 0.005), ...h.filter(x => Math.abs(x.b - soll(a.haben, x.k)) > 0.005)];
        if (falsch.length) t = `Die Konten stimmen. Prüfe den Betrag bei ${falsch.map(x => x.k).join(', ')}.`;
      }
      return t ? {ok:false, t} : {ok:true, t:'✓ ' + (a.ok || 'Richtig!')};
    }
  }
};

/* ---------- Lern-Chat: Ablauf ---------- */
const textVon = m => typeof m === 'string' ? m : m.bot;
function chatSage(z, html, art, dann){
  z.tippt = true; z.ctx.zeichne();
  const fertig = () => { z.tippt = false; z.weiter = null; z.log.push({wer:'bot', html, art}); dann(); };
  z.weiter = fertig;
  z.timer = setTimeout(fertig, Math.min(1600, 350 + String(html).replace(/<[^>]+>/g, '').length * 12));
}
function chatWeiter(z, a){
  if (z.i >= a.nachrichten.length){
    z.ende = true; z.ctx.zeichne();
    if (!z.geloest){ z.geloest = true; if (z.ctx.opt.fertig) z.ctx.opt.fertig(a); }
    return;
  }
  const m = a.nachrichten[z.i];
  chatSage(z, textVon(m), null, () => {
    if (typeof m === 'object' && (m.antworten || m.zahl || m.freitext)){ z.warte = z.i; z.ctx.zeichne(); return; }
    z.i++; z.ctx.zeichne(); chatWeiter(z, a);
  });
}
function chatAntwort(ctx, wert, j){
  const {a, z} = ctx, q = a.nachrichten[z.warte];
  if (!q) return;
  let ok, text, r;
  if (q.antworten){ const x = q.antworten[j]; ok = !!x.ok; text = x.t; r = x.r; }
  else if (q.zahl){ if (!String(wert).trim()) return; ok = Math.abs(zahl(wert) - q.zahl.l) <= (q.zahl.tol == null ? 0.005 : q.zahl.tol); text = wert + (q.zahl.e && !/€|%/.test(wert) ? ' ' + q.zahl.e : ''); }
  else { if (!String(wert).trim()) return; const f = finde(q.freitext.antworten, wert); ok = !!f; text = wert; if (f && f.fast) r = (q.r || 'Richtig!') + ` (Schreibweise: „${esc(f.wort)}“)`; }
  z.fragen++; if (ok) z.punkte++;
  z.log.push({wer:'ich', text}); z.warte = null; z.i++;
  chatSage(z, r || (ok ? q.r || '👍 Richtig!' : q.rFalsch || 'Das stimmt leider nicht.'), ok ? 'ok' : 'falsch', () => chatWeiter(z, a));
}

/* ---------- Baustein zeichnen und bedienen ---------- */
function baue(el, a, opt){
  opt = opt || {};
  const typ = TYPEN[a.typ];
  if (!typ) throw new Error('aufgaben.js: unbekannter typ ' + a.typ);
  const z = a._z || (a._z = typ.zustand(a));
  const ctx = {a, z, typ, opt, el, zeichne(){
    const sofort = typ.sofort && typ.sofort(a);
    el.innerHTML = erinnerungHTML(a)
      + (a.material ? `<div class="material">${a.material}</div>` : '')
      + (a.frage ? `<p class="af-frage">${a.nr ? `<span class="af-nr">${a.nr}</span>` : ''}${a.frage}</p>` : '')
      + typ.html(a, z)
      + (!z.geloest && !sofort ? `<div class="af-knoepfe"><button class="btn haupt af-pruefen" type="button">${a.knopf || 'Prüfen'}</button></div>` : '')
      + fbHTML(z.fb) + (z.geloest && a.danach ? '<div class="af-danach"></div>' : '');
    if (z.geloest && a.danach) baue(el.querySelector('.af-danach'), a.danach, opt);
    if (typ.nach) typ.nach(el, a, z);
  }};
  el.classList.add('af'); el._af = ctx;
  if (typ.start) typ.start(ctx); else ctx.zeichne();
  if (typ.start && !el.innerHTML) ctx.zeichne();
  return ctx;
}
function pruefe(ctx){
  const {a, z, typ, opt} = ctx, r = typ.pruefen(a, z);
  z.fb = {ok:r.ok, t:r.t};
  if (r.ok && !z.geloest){ z.geloest = true; if (!a.danach && opt.fertig) opt.fertig(a); }
  ctx.zeichne();
  if (r.ok && a.danach && a.danach._z && a.danach._z.geloest && opt.fertig) opt.fertig(a);
}
const ctxVon = t => { const w = t.closest && t.closest('.af'); return w && w._af; };

document.addEventListener('click', e => {
  const ctx = ctxVon(e.target); if (!ctx || zieht) return;
  const {a, z} = ctx, t = e.target;
  if (t.closest('.af-pruefen')) return pruefe(ctx);
  if (a.typ === 'chat'){
    const c = t.closest('[data-ca]');
    if (c) return chatAntwort(ctx, null, +c.dataset.ca);
    if (t.closest('.af-senden')){ const i = ctx.el.querySelector('.af-chattext'); ctx.el.dataset.fokus = '1'; return chatAntwort(ctx, i ? i.value : ''); }
    if (t.closest('.af-neu')){ clearTimeout(z.timer); Object.assign(z, TYPEN.chat.zustand(), {geloest:z.geloest, ctx}); return chatWeiter(z, a); }
    if (z.tippt && z.weiter && t.closest('.af-verlauf')){ clearTimeout(z.timer); return z.weiter(); }
    return;
  }
  const o = t.closest('[data-opt]');
  if (o && a.typ === 'mc'){
    if (z.geloest) return;
    const i = +o.dataset.opt;
    if (mehrfach(a)){ z.sel.has(i) ? z.sel.delete(i) : z.sel.add(i); } else z.sel = new Set([i]);
    z.geprueft = false; z.fb = null;
    return ctx.typ.sofort(a) ? pruefe(ctx) : ctx.zeichne();
  }
  if (a.typ === 'zuordnen' || (a.typ === 'luecken' && a.ziehen)){
    const k = t.closest('[data-karte]'), zo = t.closest('[data-zone]');
    // Lückentext: Wort in einer Lücke antippen (nichts gewählt) → zurück in die Wortbank
    if (k && a.typ === 'luecken' && z.wahl == null && z.platz[+k.dataset.karte] != null && !z.fix[+k.dataset.karte]){ legen(ctx, +k.dataset.karte, ''); return ctx.zeichne(); }
    const inLuecke = k && a.typ === 'luecken' && z.platz[+k.dataset.karte] != null && z.wahl != null && z.wahl !== +k.dataset.karte;
    if (k && !z.fix[+k.dataset.karte] && !inLuecke){ z.wahl = z.wahl === +k.dataset.karte ? null : +k.dataset.karte; z.weg = []; return ctx.zeichne(); }
    if (zo && z.wahl != null){ legen(ctx, z.wahl, zo.dataset.zone); z.wahl = null; return ctx.zeichne(); }
  }
  if (a.typ === 'buchungssatz'){
    const p = t.closest('[data-plus]'), w = t.closest('[data-weg]');
    if (p){ z[p.dataset.plus].push({k:'', b:''}); return ctx.zeichne(); }
    if (w){ z[w.dataset.weg].splice(+w.dataset.i, 1); return ctx.zeichne(); }
  }
});
document.addEventListener('input', e => {
  const ctx = ctxVon(e.target); if (!ctx) return;
  const t = e.target, d = t.dataset;
  if (d.f != null) ctx.z.ein[d.f] = t.value;
  else if (d.seite) ctx.z[d.seite][+d.i][d.w] = t.value;
});
document.addEventListener('change', e => {
  const ctx = ctxVon(e.target); if (!ctx || e.target.dataset.l == null) return;
  ctx.z.wahl[e.target.dataset.l] = e.target.value; delete ctx.z.ok[e.target.dataset.l]; e.target.className = '';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const ctx = ctxVon(e.target); if (!ctx) return;
  if (e.target.matches('.af-chattext')){ e.preventDefault(); ctx.el.dataset.fokus = '1'; chatAntwort(ctx, e.target.value); }
  else if (e.target.matches('input')){ e.preventDefault(); pruefe(ctx); }
  else if (e.target.matches('[data-karte]')){ e.preventDefault(); e.target.click(); }
});

/* Zuordnen: Ziehen mit Maus, Stift oder Finger */
let zieht = false, zug = null;
function legen(ctx, i, zone){
  const z = ctx.z; if (z.fix[i]) return;
  if (ctx.typ.legen) ctx.typ.legen(z, i, zone); else if (!zone) delete z.platz[i]; else z.platz[i] = zone;
  z.weg = []; z.fb = null;
}
document.addEventListener('pointerdown', e => {
  const k = e.target.closest && e.target.closest('.af-karte'); if (!k || k.classList.contains('fix')) return;
  zug = {ctx:ctxVon(k), i:+k.dataset.karte, el:k, x:e.clientX, y:e.clientY, geist:null};
});
document.addEventListener('pointermove', e => {
  if (!zug) return;
  if (!zug.geist){
    if (Math.hypot(e.clientX - zug.x, e.clientY - zug.y) < 6) return;
    zug.geist = zug.el.cloneNode(true); zug.geist.className = 'af-karte af-geist'; document.body.appendChild(zug.geist);
    zug.el.classList.add('quelle'); zieht = true;
  }
  e.preventDefault();
  zug.geist.style.left = (e.clientX - 110) + 'px'; zug.geist.style.top = (e.clientY - 18) + 'px';
  zug.ctx.el.querySelectorAll('.ziel').forEach(x => x.classList.remove('ziel'));
  const ziel = document.elementFromPoint(e.clientX, e.clientY), zo = ziel && ziel.closest('.af-zone');
  if (zo && zug.ctx.el.contains(zo)) zo.classList.add('ziel');
});
document.addEventListener('pointerup', e => {
  if (!zug) return;
  const g = zug; zug = null;
  if (!g.geist) return;
  g.geist.remove();
  const ziel = document.elementFromPoint(e.clientX, e.clientY), zo = ziel && ziel.closest('[data-zone]');
  if (zo && g.ctx.el.contains(zo)) legen(g.ctx, g.i, zo.dataset.zone);
  g.ctx.zeichne(); setTimeout(() => { zieht = false; }, 0);
});
document.addEventListener('pointercancel', () => { if (zug && zug.geist){ zug.geist.remove(); zug.ctx.zeichne(); } zug = null; zieht = false; });

/* ---------- Sequenz (Erarbeitung aus Schritten) ---------- */
function sequenz(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, S = cfg.schritte, KEY = cfg.key + '-stand';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.erledigt) stand.erledigt = {};
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  const istAufgabe = s => !!(s.aufgaben && s.aufgaben.length), anzahl = S.filter(istAufgabe).length;
  let akt = Math.min(Math.max(stand.schritt || 0, 0), S.length - 1);
  root.innerHTML = '<div class="af-kopf"><nav class="af-schritte" aria-label="Schritte"></nav><span class="af-zaehler"></span></div><main class="karte af-inhalt" aria-live="polite"></main>';
  const nav = root.querySelector('.af-schritte'), inhalt = root.querySelector('.af-inhalt'), zaehler = root.querySelector('.af-zaehler');
  function erledigt(s){
    const erstmals = !stand.erledigt[s.id];
    stand.erledigt[s.id] = true; speichern();
    if (istAufgabe(s) && window.TrainerSync) TrainerSync.event({modus:'erarbeitung', stufe:0, aufgabe:s.id, titel:s.titel || s.kurz, gesamt:anzahl, erstmals});
    leiste();
  }
  function leiste(){
    nav.innerHTML = S.map((x, i) => `<button class="btn${i === akt ? ' on' : ''}${stand.erledigt[x.id] ? ' erl' : ''}" type="button" data-schritt="${i}"${i === akt ? ' aria-current="step"' : ''}>${x.kurz}</button>`).join('');
    zaehler.textContent = anzahl ? `${S.filter(x => istAufgabe(x) && stand.erledigt[x.id]).length} von ${anzahl} Aufgaben gelöst` : '';
  }
  function zeichne(oben){
    const s = S[akt];
    leiste();
    inhalt.innerHTML = (istAufgabe(s) && stand.erledigt[s.id] ? '<p class="af-erledigt">✓ Diesen Schritt hast du schon gelöst. Du kannst ihn noch einmal bearbeiten.</p>' : '')
      + (typeof s.html === 'function' ? s.html() : s.html || '')
      + erinnerungHTML(s)
      + (s.material ? `<div class="material">${s.material}</div>` : '')
      + (s.aufgaben || []).map(() => '<div class="af-aufgabe"></div>').join('')
      + `<div class="af-unten"><button class="btn" type="button" data-weiter="-1"${akt ? '' : ' disabled'}>◀ Zurück</button><button class="btn haupt" type="button" data-weiter="1"${akt < S.length - 1 ? '' : ' disabled'}>Weiter ▶</button></div>`;
    const plaetze = inhalt.querySelectorAll(':scope > .af-aufgabe');
    (s.aufgaben || []).forEach((a, i) => baue(plaetze[i], a, {fertig:() => { if (s.aufgaben.every(x => geloest(x))) erledigt(s); }}));
    if (s.nach) s.nach(inhalt);
    if (oben) window.scrollTo(0, 0);
  }
  const geloest = a => !!(a._z && a._z.geloest && (!a.danach || geloest(a.danach)));
  function gehe(i){
    if (!istAufgabe(S[akt]) && i > akt && !stand.erledigt[S[akt].id]) erledigt(S[akt]);
    akt = Math.min(Math.max(i, 0), S.length - 1); stand.schritt = akt; speichern(); zeichne(true);
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-schritt], [data-weiter]'); if (!b || !root.contains(b)) return;
    if (b.dataset.schritt != null) gehe(+b.dataset.schritt); else gehe(akt + +b.dataset.weiter);
  });
  zeichne();
  return {gehe, get schritt(){ return akt; }, stand};
}

/* ---------- Endlos (zufällige Aufgaben je Stufe, Serie und Rekord) ---------- */
const FLAMME = n => `<svg viewBox="0 0 32 40" aria-hidden="true"><path d="M16 2C18 9 27 14 27 26C27 33 22 38 16 38C10 38 5 33 5 26C5 20 9 16 11 11C12 15 13 17 15 18C16 13 17 8 16 2Z"/><text x="16" y="32" text-anchor="middle">${n}</text></svg>`;
function endlos(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, ST = cfg.stufen, KEY = cfg.key + '-endlos';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.rekord) stand.rekord = {};
  let stufe = Math.min(Math.max(stand.stufe || 1, 1), ST.length), serie = 0, akt = null, geloest = false;
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  root.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="af-fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs></svg>'
    + '<div class="af-kopf"><nav class="af-flammen" aria-label="Stufen"></nav><span class="af-serie"></span></div>'
    + '<main class="karte af-inhalt" aria-live="polite"><h2 class="af-stufe"></h2><div class="af-aufgabe"></div>'
    + '<div class="af-unten"><button class="btn" type="button" data-anders>↻ Andere Aufgabe</button><button class="btn haupt" type="button" data-naechste>Nächste Aufgabe ▶</button></div></main>';
  const $ = s => root.querySelector(s);
  function kopf(){
    $('.af-flammen').innerHTML = ST.map((x, i) => `<button class="af-flamme${i + 1 === stufe ? ' on' : ''}" type="button" data-stufe="${i + 1}" title="Stufe ${i + 1}: ${esc(x.name)}" aria-label="Stufe ${i + 1}: ${esc(x.name)}" aria-pressed="${i + 1 === stufe}">${FLAMME(i + 1)}</button>`).join('');
    $('.af-serie').innerHTML = `🔥 Serie: <b>${serie}</b> <span class="muted">· Rekord ${stand.rekord[stufe] || 0}</span>`;
    $('.af-stufe').textContent = `Stufe ${stufe}: ${ST[stufe - 1].name}`;
    $('[data-naechste]').disabled = !geloest;
    $('[data-anders]').disabled = geloest;
  }
  function neu(){
    geloest = false; akt = ST[stufe - 1].neu();
    baue($('.af-aufgabe'), akt, {fertig:() => {
      if (geloest) return;
      geloest = true; serie++;
      if (serie > (stand.rekord[stufe] || 0)){ stand.rekord[stufe] = serie; speichern(); }
      if (window.TrainerSync) TrainerSync.event({modus:'endlos', stufe, aufgabe:'s' + stufe, titel:ST[stufe - 1].name, gesamt:0, erstmals:true});
      kopf(); $('[data-naechste]').focus();
    }});
    kopf();
  }
  function setze(n){ stufe = n; stand.stufe = n; serie = 0; speichern(); neu(); }
  root.addEventListener('click', e => {
    const f = e.target.closest('[data-stufe]'); if (f) return setze(+f.dataset.stufe);
    if (e.target.closest('[data-anders]')){ serie = 0; return neu(); }
    if (e.target.closest('[data-naechste]') && geloest) return neu();
  });
  neu();
  return {neu, stufe:setze};
}

window.Aufgaben = {baue, sequenz, endlos, mc, mehrfach, finde, zahl, eur, mischen, esc, bsText, TYPEN};
})();

</script>
<script>/* basis.js */
/* basis.js – gemeinsamer Kern aller Excel-Trainer (wenn, und-oder, funktionen, bezuege)
 *
 * Einbinden (nach dem Markup, vor den eigenen <script>s), dazu genau eine Ergänzung je Seitenart:
 *   Formeln aus Bausteinen (wenn, und-oder):   basis.css + bausteine.css, basis.js + bausteine.js
 *   Tabellenblatt (funktionen, bezuege):       basis.css + tabelle.css,   basis.js + tabelle.js
 * Alles sind globale Namen, kein Build-Schritt, läuft auch per file://.
 *
 * API
 *   $, esc, rand, clamp, rng, shuffle, pick1, ri, C, B, normQuotes, FErr   Helfer und Zufall
 *   store(k, v), load(k)       localStorage unter KEY + k; store meldet TrainerSync.changed()
 *   isSolved(i), markSolved()  gelöste Übung je Stufe (solved[level])
 *   countSolved()              zählt eine gelöste Übung bzw. Endlos-Aufgabe (Serie, Rekord), → „erstmals“
 *   skipTask()                 Endlos: andere Aufgabe, Serie auf 0
 *   renderHeader()             Flammen (Stufen 1 … solange LEVELS[n] existiert), Modusknöpfe, Theme-Symbol
 *   navPfad(), navLernen(idx, n, info)   Knöpfe Prüfen/Zurücksetzen/Zurück/Weiter je Modus
 *   dockHTML(groups)           Dock für Übungen/Endlos; groups = Gruppennamen (Gruppe = letztes STD-Feld)
 *   navClick(e)                Flammen, Modi, Aufgabenwahl, Dock – am Ende des Klick-Handlers aufrufen
 *   Drag & Drop (Maus/Touch)   Ziehen, Ablageziel hervorheben, Einfügemarke in Zeilen (.iw)
 *   AC                         Autovervollständigung wie in Excel für Eingaben mit Klasse .acin
 *   Verdrahtet: #themeBtn, #checkBtn → check(), #nextBtn → nextTask(), #skipBtn → skipTask(),
 *   Escape schließt die Aufgabenwahl.
 *
 * Die Seite (bzw. bausteine.js/tabelle.js) liefert
 *   KEY, LEVELS, STD; let mode, level, pfadIdx, solved, streak, best, endCounted, pickerOpen
 *   check, loadTask, setLevel, setMode, gotoTask, canNext, nextTask, newEndless, renderDock
 *   Drag-Hooks: dragData(b, e) → Zusatzfelder für D (src:true = Quelle blass) oder null;
 *     dropOk(t); applyDrop(d, type, idx, t); dragTap(d) bei Klick ohne Ziehen; optional dragGhost(g)
 *   AC_FN = [{n, v | a, d}]; optional AC.word(before, inp) → getipptes Wort oder null
 *
 * Gerüst einer Seite
 *   <link rel="stylesheet" href="basis.css"><link rel="stylesheet" href="tabelle.css"> … Markup
 *   <script src="basis.js"><\/script><script src="tabelle.js"><\/script>
 *   <script>
 *     const KEY = 'xy-', LEVELS = [null, {name:'…'}], STD = [[…, 1]];
 *     let mode = load('mode') || 'pfad', level = 1, pfadIdx = 0, solved = {}, streak = 0,
 *         best = 0, endCounted = false, pickerOpen = false, …;
 *     function check(){ … logSolved(countSolved()); … }   function loadTask(){ … }  …
 *     if (mode === 'endlos') newEndless();
 *     loadTask();
 *   <\/script>
 */

/* ================= Teil A: alle Seiten ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rand = () => (Math.random() * 1e9) | 0;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick1 = (r, a) => a[Math.floor(r() * a.length)];
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const C = s => `<code>${s}</code>`, B = s => `<b>${s}</b>`;
function normQuotes(s){ return s.replace(/[„“”″«»]/g, '"'); }
class FErr extends Error { constructor(msg){ super(msg); this.name = 'FErr'; } }

/* Speicher (Schlüssel KEY + k) und Fortschritt */
function store(k, v){ try{ localStorage.setItem(KEY + k, v); }catch(e){} if (window.TrainerSync) TrainerSync.changed(); }
function load(k){ try{ return localStorage.getItem(KEY + k); }catch(e){ return null; } }
function isSolved(i){ return (solved[level] || []).includes(i); }
function markSolved(){ const a = solved[level] || (solved[level] = []); if (!a.includes(pfadIdx)){ a.push(pfadIdx); store('solved', JSON.stringify(solved)); } }
function countSolved(){
  if (mode === 'pfad'){ const erstmals = !isSolved(pfadIdx); markSolved(); return erstmals; }
  const erstmals = !endCounted;
  if (!endCounted){ endCounted = true; streak++; if (streak > best){ best = streak; store('best', best); } }
  return erstmals;
}
function skipTask(){ streak = 0; newEndless(); loadTask(); }

/* Kopfzeile, Navigation, Dock */
function renderHeader(){
  let h = '';
  for (let n = 1; LEVELS[n]; n++){
    h += `<button class="flame${n === level ? ' on' : ''}" data-level="${n}" title="Stufe ${n}: ${esc(LEVELS[n].name)}" aria-label="Stufe ${n}" aria-pressed="${n === level}">
      <svg viewBox="0 0 32 40"><path d="M16 2C18 9 27 14 27 26C27 33 22 38 16 38C10 38 5 33 5 26C5 20 9 16 11 11C12 15 13 17 15 18C16 13 17 8 16 2Z"/>
      <text x="16" y="32" text-anchor="middle">${n}</text></svg></button>`;
  }
  $('#flames').innerHTML = h;
  $('#flames').style.display = mode === 'lernen' ? 'none' : '';
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
function navButtons(){ return {nb:$('#nextBtn'), pb:$('#prevBtn'), sb:$('#skipBtn'), cb:$('#checkBtn'), rb:$('#resetBtn'), ob:$('#ovBtn')}; }
function navPfad(){
  const {nb, pb, sb, cb, rb, ob} = navButtons();
  cb.style.display = rb.style.display = nb.style.display = ''; if (ob) ob.style.display = 'none';
  pb.style.display = mode === 'pfad' ? '' : 'none'; pb.disabled = pfadIdx === 0;
  sb.style.display = mode === 'endlos' ? '' : 'none';
  const ok = canNext(); nb.disabled = !ok;
  if (mode === 'pfad' && pfadIdx === STD.length - 1 && isSolved(pfadIdx)) nb.textContent = 'Alle Übungen geschafft 🎉';
  else nb.textContent = (ok ? '' : '🔒 ') + 'Nächste Aufgabe ▶';
  nb.title = ok ? '' : 'Erst die aktuelle Aufgabe richtig lösen';
}
function navLernen(idx, n, info){
  const {nb, pb, sb, cb, rb, ob} = navButtons();
  pb.style.display = ''; pb.disabled = idx === 0; sb.style.display = 'none'; if (ob) ob.style.display = '';
  cb.style.display = rb.style.display = info ? 'none' : '';
  nb.style.display = idx === n - 1 ? 'none' : '';
  const ok = canNext(); nb.disabled = !ok;
  nb.textContent = (ok ? '' : '🔒 ') + 'Weiter ▶';
  nb.title = ok ? '' : 'Erst die Aufgabe in diesem Schritt richtig lösen';
}
function dockHTML(groups){
  if (mode === 'endlos') return `<div class="dockbtn static">🔥 Serie: ${streak} <span class="sub">· Rekord ${best}</span></div>`;
  let h = `<button class="dockbtn" id="dockBtn" aria-expanded="${pickerOpen}">▦ Aufgabe ${pfadIdx + 1}/${STD.length} <span class="sub">· ${(solved[level] || []).length} gelöst</span></button>`;
  if (!pickerOpen) return h;
  const btn = i => `<button data-goto="${i}" class="${isSolved(i) ? 'solved' : ''}${i === pfadIdx ? ' cur' : ''}">${i + 1}</button>`;
  h += `<div class="picker"><div class="ptitle">Zu Aufgabe springen – grün = auf Stufe ${level} gelöst</div>`;
  if (!groups) h += '<div class="pg">' + STD.map((_, i) => btn(i)).join('') + '</div>';
  else for (let g = 1; g < groups.length; g++)
    h += `<div class="pgl">${esc(groups[g])}</div><div class="pg">` + STD.map((e, i) => e[e.length - 1] !== g ? '' : btn(i)).join('') + '</div>';
  return h + '</div>';
}
function navClick(e){
  const f = e.target.closest('.flame'); if (f){ setLevel(+f.dataset.level); return; }
  const m = e.target.closest('.modes button'); if (m){ setMode(m.dataset.mode); return; }
  const g = e.target.closest('[data-goto]'); if (g){ gotoTask(+g.dataset.goto); return; }
  if (e.target.closest('#dockBtn')){ pickerOpen = !pickerOpen; renderDock(); return; }
  if (pickerOpen && !e.target.closest('.picker')){ pickerOpen = false; renderDock(); }
}
$('#checkBtn').addEventListener('click', () => check());
$('#nextBtn').addEventListener('click', () => nextTask());
$('#skipBtn').addEventListener('click', () => skipTask());
$('#themeBtn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('wenn-theme', t); } catch (e) {} renderHeader();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pickerOpen){ pickerOpen = false; renderDock(); } });

/* Drag & Drop (Maus + Touch über Pointer Events) */
let D = null, hoverEl = null, insEl = null, scrollRAF = null;
function findTarget(x, y){
  const el = document.elementFromPoint(x, y);
  let t = el && el.closest && el.closest('[data-drop]');
  // ein Baustein darf nicht in sich selbst abgelegt werden (z. B. Wert in den eigenen Baustein)
  while (t && D.el.contains(t)) t = t.parentElement && t.parentElement.closest('[data-drop]');
  return t && dropOk(t) ? t : null;
}
function rowIndex(row, x, y){
  const kids = [...row.querySelectorAll(':scope > .iw')];
  for (let i = 0; i < kids.length; i++){
    const r = kids[i].getBoundingClientRect();
    if (y < r.top) return i;
    if (y <= r.bottom && x < r.left + r.width / 2) return i;
  }
  return kids.length;
}
function clearHover(){
  if (hoverEl){ hoverEl.classList.remove('drop-hover'); hoverEl = null; }
  if (insEl){ insEl.classList.remove('ins', 'ins-after'); insEl = null; }
}
function updateHover(x, y){
  clearHover();
  const t = findTarget(x, y); if (!t) return;
  hoverEl = t; t.classList.add('drop-hover');
  if (t.dataset.drop === 'row'){
    const kids = [...t.querySelectorAll(':scope > .iw')], i = rowIndex(t, x, y);
    if (kids.length){ insEl = i < kids.length ? kids[i] : kids[kids.length - 1]; insEl.classList.add(i < kids.length ? 'ins' : 'ins-after'); }
  }
}
function autoScroll(){
  if (!D || !D.started) return;
  const topEdge = document.querySelector('header').getBoundingClientRect().bottom + 20;
  if (D.y < topEdge) window.scrollBy(0, -8); else if (D.y > innerHeight - 30) window.scrollBy(0, 8);
  updateHover(D.x, D.y);
  scrollRAF = requestAnimationFrame(autoScroll);
}
function endDrag(cancel){
  cancelAnimationFrame(scrollRAF);
  const t = cancel ? null : findTarget(D.x, D.y);
  const idx = t && t.dataset.drop === 'row' ? rowIndex(t, D.x, D.y) : 0;
  clearHover(); D.ghost.remove(); D.el.classList.remove('drag-src'); document.body.classList.remove('dragging');
  const d = D; D = null;
  if (t) applyDrop(d, t.dataset.drop, idx, t);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.block[data-drag]');
  if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const extra = dragData(b, e); if (!extra) return;
  e.preventDefault();
  D = Object.assign({el:b, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, started:false}, extra);
});
window.addEventListener('pointermove', e => {
  if (!D) return;
  D.x = e.clientX; D.y = e.clientY;
  if (!D.started){
    if (Math.hypot(e.clientX - D.x0, e.clientY - D.y0) < 5) return;
    const r = D.el.getBoundingClientRect(), g = D.el.cloneNode(true);
    ['select', 'input'].forEach(sel => { const gs = g.querySelectorAll(sel); D.el.querySelectorAll(sel).forEach((s, i) => { gs[i].value = s.value; }); });
    if (window.dragGhost) dragGhost(g);
    g.classList.add('drag-ghost'); g.classList.remove('drag-src');
    g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g);
    D.ghost = g; D.dx = D.x0 - r.left; D.dy = D.y0 - r.top; D.started = true;
    if (D.src) D.el.classList.add('drag-src');
    document.body.classList.add('dragging');
    autoScroll();
  }
  D.ghost.style.left = (e.clientX - D.dx) + 'px'; D.ghost.style.top = (e.clientY - D.dy) + 'px';
  updateHover(e.clientX, e.clientY);
}, {passive:false});
window.addEventListener('pointerup', () => {
  if (!D) return;
  if (D.started){ endDrag(false); return; }
  const d = D; D = null;
  dragTap(d);
});
window.addEventListener('pointercancel', () => { if (!D) return; if (D.started) endDrag(true); else D = null; });

/* Autovervollständigung wie in Excel: Funktionsliste beim Tippen, Argument-Hinweis in Klammern */
const acCanvas = document.createElement('canvas').getContext('2d');
const AC = {list:[], sel:0, key:'', start:0, token:'', closed:'', input:null,
  digits:false,           // Funktionsnamen dürfen Ziffern enthalten (ANZAHL2)
  prev:/[=(;<>\s,]/,      // erlaubtes Zeichen vor dem getippten Wort
  // getipptes Wort am Cursor (oder null); in #ft erst nach einem „=“
  word:(before, inp) => { const m = before.match(/[A-Za-zÄÖÜäöüß]+$/); return m && (inp.id !== 'ft' || before.trimStart().startsWith('=')) ? m[0] : null; }};
function acArgs(f, i){
  if (f.a) return f.a;
  const n = Math.max(2, i + 1), out = [];
  for (let k = 1; k <= n; k++) out.push(k === 1 ? f.v + k : `[${f.v}${k}]`);
  return [...out, '…'];
}
function acCaretX(inp, idx){
  const cs = getComputedStyle(inp), r = inp.getBoundingClientRect();
  acCanvas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  return r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + acCanvas.measureText(inp.value.slice(0, idx)).width - inp.scrollLeft;
}
function acEls(){
  let pop = document.getElementById('acpop'), tip = document.getElementById('actip');
  if (!pop){
    pop = document.createElement('div'); pop.id = 'acpop'; pop.className = 'acpop'; document.body.appendChild(pop);
    tip = document.createElement('div'); tip.id = 'actip'; tip.className = 'actip'; document.body.appendChild(tip);
    pop.addEventListener('pointerdown', e => { const it = e.target.closest('[data-aci]'); e.preventDefault(); if (it){ AC.sel = +it.dataset.aci; acInsert(); } });
  }
  return {pop, tip};
}
function acHide(){ const {pop, tip} = acEls(); pop.style.display = 'none'; tip.style.display = 'none'; AC.list = []; }
function acPlace(el, x, inp){
  const r = inp.getBoundingClientRect();
  el.style.display = 'block';
  el.style.left = Math.max(8, Math.min(x - 6, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = (r.bottom + 4) + 'px';
}
function acUpdate(inp){
  inp = inp || document.activeElement;
  if (!inp || !inp.matches || !inp.matches('.acin') || document.activeElement !== inp){ acHide(); return; }
  AC.input = inp;
  const {pop, tip} = acEls();
  const pos = inp.selectionStart ?? inp.value.length, before = normQuotes(inp.value.slice(0, pos));
  // Zeichen für Zeichen lesen: Textbereiche überspringen, offene Funktionen merken
  const stack = []; let inStr = false, word = '', wstart = 0;
  for (let i = 0; i < before.length; i++){
    const ch = before[i];
    if (ch === '"'){ inStr = !inStr; word = ''; continue; }
    if (inStr) continue;
    if (/[A-Za-zÄÖÜäöüß]/.test(ch) || (AC.digits && word && /[0-9]/.test(ch))){ if (!word) wstart = i; word += ch; continue; }
    if (ch === '(') stack.push({fn:word.toUpperCase(), i:0, at:wstart});
    else if (ch === ';' && stack.length) stack[stack.length - 1].i++;
    else if (ch === ')') stack.pop();
    word = '';
  }
  // Funktionsliste: nur wenn gerade ein Funktionsname getippt wird (nicht in Text, nicht Teil einer Zelle)
  let list = [], token = '', start = pos;
  const w = !inStr && AC.word(before, inp);
  if (w){
    token = w; start = pos - token.length;
    const prev = before[start - 1];
    if (!prev || AC.prev.test(prev)) list = AC_FN.filter(f => f.n.startsWith(token.toUpperCase()));
    if (list.length === 1 && list[0].n === token.toUpperCase() && inp.value[pos] === '(') list = [];
  }
  const key = start + ':' + token.toUpperCase();
  if (AC.closed === key) list = [];
  if (key !== AC.key) AC.sel = 0;
  AC.key = key; AC.token = token; AC.start = start; AC.list = list;
  if (AC.sel >= list.length) AC.sel = 0;
  if (list.length){
    const f = list[AC.sel];
    pop.innerHTML = `<div class="acl">${list.map((x, i) => `<div class="aci${i === AC.sel ? ' sel' : ''}" data-aci="${i}"><span class="acfx">fx</span>${x.n}</div>`).join('')}</div><div class="acdesc">${esc(f.d)}</div><div class="ackey">Tab ↹ fügt ein · ↑ ↓ wählen</div>`;
    acPlace(pop, acCaretX(inp, start), inp);
    tip.style.display = 'none';
    return;
  }
  pop.style.display = 'none';
  const top = stack[stack.length - 1], f = top && AC_FN.find(x => x.n === top.fn);
  if (f){
    const args = acArgs(f, top.i);
    const act = f.a ? Math.min(top.i, args.length - 1) : top.i;
    tip.innerHTML = `<span class="acfn">${f.n}</span>(${args.map((a, i) => i === act ? `<b>${esc(a)}</b>` : esc(a)).join('; ')})`;
    acPlace(tip, acCaretX(inp, top.at), inp);
  } else tip.style.display = 'none';
}
function acInsert(){
  const inp = AC.input, f = AC.list[AC.sel];
  if (!inp || !f) return;
  const pos = inp.selectionStart ?? inp.value.length;
  const after = inp.value.slice(pos), add = after.startsWith('(') ? f.n : f.n + '(';
  inp.value = inp.value.slice(0, AC.start) + add + after;
  const c = AC.start + f.n.length + 1;
  inp.focus(); inp.setSelectionRange(c, c);
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  acUpdate(inp);
}
document.addEventListener('keydown', e => {
  if (!e.target.matches || !e.target.matches('.acin') || !AC.list.length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); AC.sel = (AC.sel + 1) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); AC.sel = (AC.sel - 1 + AC.list.length) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'Tab'){ e.preventDefault(); acInsert(); }
  else if (e.key === 'Escape'){ e.preventDefault(); AC.closed = AC.key; acUpdate(e.target); }
  else if (e.key === 'Enter'){ acHide(); }
}, true);
document.addEventListener('keyup', e => { if (e.target.matches && e.target.matches('.acin') && !['ArrowDown', 'ArrowUp', 'Tab', 'Escape', 'Enter', 'F4'].includes(e.key)) acUpdate(e.target); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.acin')) acUpdate(e.target); });
document.addEventListener('focusout', () => setTimeout(() => acUpdate(), 0));
window.addEventListener('scroll', () => { if (AC.input && document.activeElement === AC.input) acUpdate(AC.input); }, {passive:true});
window.addEventListener('resize', () => acUpdate());

</script>
<script>/* tabelle.js */
/* tabelle.js – Ergänzung zu basis.js für Trainer mit Tabellenblatt (funktionen, bezuege)
 * Laden nach basis.js; dazu tabelle.css nach basis.css.
 *
 * API
 *   Rechenwerk: FUNCS, FDESC, GOAL, ALIAS, ENGLISH, CELLRE, colN, colL, addr, ad, normRef, rangeCells,
 *     normRange, tokenize, parseFormula, refsOf, cellsOfRefs, fnsOf, numsOf, topCall, refsInText,
 *     E, toNum, evalAst, callFn, parseCached, Sheet(cells).val(a), same, fmtNum, fmtVal(v, 'eur'|'usd'|'pct')
 *   Erklärung (learn = {topic, prog:{id:{idx, done}}}): topic, prog, saveLearn, stepDone, markStep,
 *     firstOpen, stepUnlocked, curStep, gotoStep, openTopic, overview
 *   setMode, gotoTask, canNext, nextTask, renderNav, renderDock, renderOverview(introHtml),
 *   renderFeedback, renderChoice(st), checkChoice(), hint(msg)
 *   topicClick(e)   Antworten, Themen, Schritte, Übersicht, dann navClick – am Ende des Klick-Handlers
 *   caret, setCaret, focusInp, applyPT, cellAt, endPT, gridEl, trackCaret   Bezüge mit der Maus einfügen
 *   Verdrahtet: #ovBtn, #prevBtn, #resetBtn, Eingabe in .pin → syncInput, Maus-Ende im #grid
 *
 * Vergleiche und WENN/UND/ODER: logikAn() einmal aufrufen (vor dem ersten Rechnen). Dann gibt es = <> < > <= >=
 *   (Ergebnis WAHR/FALSCH, Texte ohne Groß-/Kleinschreibung) und die Funktionen WENN, UND, ODER.
 *
 * Braucht ../../lib/aufgaben.js (Multiple Choice: Aufgaben.mc), vor basis.js einbinden.
 *
 * Die Seite liefert
 *   TOPICS, GROUPS, AC_FN; let learn, endPick, CUR, S, LS, PT
 *   render, resetS, loadStep, newEndless, setLevel, clearMarks, syncInput(inp, keepSel), logSolved
 */


const FUNCS = ['SUMME', 'MITTELWERT', 'MIN', 'MAX', 'ANZAHL', 'ANZAHL2'];
const FDESC = {
  SUMME:'addiert alle Zahlen',
  MITTELWERT:'berechnet den Durchschnitt',
  MIN:'liefert den kleinsten Wert',
  MAX:'liefert den größten Wert',
  ANZAHL:'zählt die Zellen, in denen eine Zahl steht',
  ANZAHL2:'zählt alle Zellen, die nicht leer sind – auch Zellen mit Text'
};
const GOAL = {SUMME:'die Summe (alles zusammen)', MITTELWERT:'der Durchschnitt', MIN:'der kleinste Wert', MAX:'der größte Wert',
  ANZAHL:'die Anzahl der Zellen mit einer Zahl', ANZAHL2:'die Anzahl aller Einträge'};
// englische oder falsche Funktionsnamen -> Hinweis
const ALIAS = {SUM:'SUMME', AVERAGE:'MITTELWERT', COUNT:'ANZAHL', COUNTA:'ANZAHL2', MINIMUM:'MIN', MAXIMUM:'MAX',
  DURCHSCHNITT:'MITTELWERT', MITTEL:'MITTELWERT', MITTELWERTE:'MITTELWERT', SUMMEN:'SUMME', SUM2:'SUMME', SUMM:'SUMME', SUME:'SUMME',
  ANZAL:'ANZAHL', ANZAHL1:'ANZAHL', ANZAL2:'ANZAHL2', ZÄHLEN:'ANZAHL', ANZAHLZWEI:'ANZAHL2'};
const ENGLISH = ['SUM', 'AVERAGE', 'COUNT', 'COUNTA'];
let LOGIK = false;
function logikAn(){
  if (LOGIK) return; LOGIK = true;
  FUNCS.push('WENN', 'UND', 'ODER');
  Object.assign(FDESC, {WENN:'liefert je nach Bedingung den Dann- oder den Sonst-Wert', UND:'ist WAHR, wenn alle Bedingungen erfüllt sind', ODER:'ist WAHR, wenn mindestens eine Bedingung erfüllt ist'});
  Object.assign(ALIAS, {IF:'WENN', AND:'UND', OR:'ODER', WEN:'WENN', WENNN:'WENN', UN:'UND', ODR:'ODER'});
  ENGLISH.push('IF', 'AND', 'OR');
}
const fnListe = () => FUNCS.slice(0, -1).join(', ') + ' oder ' + FUNCS[FUNCS.length - 1];


/* ---- Zellbezüge ---- */
const CELLRE = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,5})$/;
const colN = L => L.toUpperCase().split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
function colL(n){ let s = ''; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function addr(s){ const m = String(s).match(CELLRE); return m ? {c:colN(m[1]), r:+m[2]} : null; }
const ad = (c, r) => colL(c) + r;
const normRef = s => { const a = addr(s); return ad(a.c, a.r); };
function rangeCells(a, b){
  const x = addr(a), y = addr(b), out = [];
  for (let r = Math.min(x.r, y.r); r <= Math.max(x.r, y.r); r++)
    for (let c = Math.min(x.c, y.c); c <= Math.max(x.c, y.c); c++) out.push(ad(c, r));
  return out;
}
function normRange(a, b){
  const x = addr(a), y = addr(b);
  return ad(Math.min(x.c, y.c), Math.min(x.r, y.r)) + ':' + ad(Math.max(x.c, y.c), Math.max(x.r, y.r));
}

/* ---- Zerlegen ---- */
function tokenize(src){
  const t = []; let i = 0; const n = src.length;
  const isL = ch => /[A-Za-zÄÖÜäöüß$]/.test(ch);
  while (i < n){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '"'){
      i++; let v = '', closed = false;
      while (i < n){ if (src[i] === '"'){ if (src[i+1] === '"'){ v += '"'; i += 2; continue; } closed = true; i++; break; } v += src[i++]; }
      if (!closed) throw new FErr('Ein Anführungszeichen wurde geöffnet, aber nicht wieder geschlossen.');
      t.push({type:'str', v}); continue;
    }
    if (/[0-9]/.test(c)){
      let j = i; while (j < n && /[0-9]/.test(src[j])) j++;
      if (src[j] === ',' && /[0-9]/.test(src[j+1] || '')){ j++; while (j < n && /[0-9]/.test(src[j])) j++; }
      if (src[j] === '.' && /[0-9]/.test(src[j+1] || '')) throw new FErr('Dezimalzahlen schreibt man im deutschen Excel mit Komma, z. B. 0,25.');
      if (j < n && isL(src[j])){ let k = j; while (k < n && /[A-Za-z0-9]/.test(src[k])) k++; throw new FErr(`„${src.slice(i, k)}“ verstehe ich nicht. Ein Zellbezug beginnt mit dem Buchstaben der Spalte, z. B. B4.`); }
      t.push({type:'num', v:parseFloat(src.slice(i, j).replace(',', '.'))}); i = j; continue;
    }
    if (isL(c)){
      let j = i; while (j < n && /[A-Za-z0-9ÄÖÜäöüß$_.]/.test(src[j])) j++;
      const w = src.slice(i, j), up = w.toUpperCase();
      let k = j; while (k < n && /\s/.test(src[k])) k++;
      if (src[k] === '('){ t.push({type:'fn', v:up.replace(/\./g, '')}); i = j; continue; }
      if (CELLRE.test(w)){ t.push({type:'ref', v:normRef(w)}); i = j; continue; }
      if (FUNCS.includes(up)) throw new FErr(`Nach ${up} muss eine Klammer folgen: ${up}(…)`);
      if (/^\$?[A-Za-z]{1,3}\$?\d+\$?[A-Za-z]{1,3}\$?\d+$/.test(w)) throw new FErr(`Zwischen den Zellen in „${w}“ fehlt etwas. Für einen Bereich schreibst du einen Doppelpunkt, z. B. B4:B8.`);
      if (ALIAS[up]) throw new FErr(`Meinst du ${ALIAS[up]}? Nach dem Funktionsnamen folgt eine Klammer: ${ALIAS[up]}(…)`);
      if (LOGIK && /^[A-Za-zÄÖÜäöüß]+$/.test(w)) throw new FErr(`„${w}“ ist weder ein Zellbezug (wie B4) noch eine Funktion. Ist das ein Text? Texte stehen in Anführungszeichen: "${w}"`);
      throw new FErr(`„${w}“ ist weder ein Zellbezug (wie B4) noch eine Funktion.`);
    }
    if ('+-*/^();:'.includes(c)){ t.push({type:'op', v:c}); i++; continue; }
    if (c === ',') throw new FErr('Im deutschen Excel trennt man die Teile einer Funktion mit einem Semikolon ; – und einen Bereich „von … bis“ schreibt man mit Doppelpunkt, z. B. B4:B8.');
    if (LOGIK && (c === '<' || c === '>' || c === '=')){
      const zwei = src.slice(i, i + 2);
      if (zwei === '=<' || zwei === '=>') throw new FErr(`Schreibe ${zwei[1]}= statt ${zwei}: Das Gleichheitszeichen steht hinten.`);
      const v = ['<=', '>=', '<>'].includes(zwei) ? zwei : c;
      t.push({type:'op', v}); i += v.length; continue;
    }
    if (c === '=') throw new FErr('Das = steht nur einmal ganz am Anfang der Formel.');
    if (c === '<' || c === '>') throw new FErr('Vergleiche mit < oder > brauchst du hier nicht.');
    if (c === '€' || c === '%') throw new FErr(`Das Zeichen ${c} gehört nicht in die Formel. Schreibe nur die Zahl bzw. den Zellbezug.`);
    throw new FErr(`Das Zeichen „${c}“ gehört nicht in eine Formel.`);
  }
  return t;
}

/* ---- Parser: + - * / ^, Klammern, Funktionen mit Bereichen ---- */
function noRange(n){ if (n.k === 'range') throw new FErr(`Ein Bereich wie ${n.a}:${n.b} funktioniert nur in einer Funktion, z. B. =SUMME(${n.a}:${n.b}).`); return n; }
function parseFormula(raw){
  const s = normQuotes(String(raw)).trim();
  if (!s) throw new FErr('Gib zuerst eine Formel ein.');
  if (s[0] !== '=') throw new FErr('Eine Formel beginnt in Excel immer mit einem Gleichheitszeichen =.');
  const toks = tokenize(s.slice(1)); let p = 0;
  if (!toks.length) throw new FErr('Nach dem = fehlt noch die Formel.');
  const peek = () => toks[p], next = () => toks[p++];
  const isOp = (t, v) => t && t.type === 'op' && t.v === v;
  const CMP = ['=', '<>', '<', '>', '<=', '>='];
  function cmp(){ let a = expr(); const t = peek(); if (t && t.type === 'op' && CMP.includes(t.v)){ next(); a = {k:'cmp', o:t.v, a:noRange(a), b:noRange(expr())};
    const u = peek(); if (u && u.type === 'op' && CMP.includes(u.v)) throw new FErr('Ein Vergleich hat nur ein Vergleichszeichen. Mehrere Bedingungen verknüpfst du mit UND(…) oder ODER(…).'); } return a; }
  function expr(){ let a = term(); while (isOp(peek(), '+') || isOp(peek(), '-')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(term())}; } return a; }
  function term(){ let a = factor(); while (isOp(peek(), '*') || isOp(peek(), '/')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(factor())}; } return a; }
  function factor(){ if (isOp(peek(), '-') || isOp(peek(), '+')){ const o = next().v; return {k:'neg', o, a:noRange(factor())}; } return power(); }
  function power(){ let a = atom(); if (isOp(peek(), '^')){ next(); a = {k:'bin', o:'^', a:noRange(a), b:noRange(factor())}; } return a; }
  function atom(){
    const t = next();
    if (!t) throw new FErr('Die Formel hört zu früh auf – am Ende fehlt noch etwas.');
    if (t.type === 'num') return {k:'num', v:t.v};
    if (t.type === 'str') return {k:'str', v:t.v};
    if (t.type === 'ref'){
      if (isOp(peek(), ':')){
        next(); const u = next();
        if (!u || u.type !== 'ref') throw new FErr('Nach dem Doppelpunkt muss eine Zelle folgen, z. B. B4:B8.');
        return {k:'range', a:t.v, b:u.v};
      }
      return {k:'ref', v:t.v};
    }
    if (t.type === 'fn'){
      const name = t.v; next(); // (
      if (!FUNCS.includes(name)){
        if (ENGLISH.includes(name)) throw new FErr(`Im deutschen Excel heißt die Funktion ${ALIAS[name]} statt ${name}.`);
        if (ALIAS[name]) throw new FErr(`Die Funktion heißt ${ALIAS[name]}, nicht ${name}.`);
        if (CELLRE.test(name)) throw new FErr(`Nach der Zelle ${name} darf keine Klammer folgen. Fehlt ein Rechenzeichen?`);
        throw new FErr(`Die Funktion ${name} gibt es hier nicht. Du brauchst ${fnListe()}.`);
      }
      if (isOp(peek(), ')')){ next(); throw new FErr(`In die Klammer von ${name} gehört ein Bereich, z. B. ${name}(B4:B8).`); }
      const args = [];
      for (;;){
        if (isOp(peek(), ';') || isOp(peek(), ')')) throw new FErr(`In ${name}(…) fehlt zwischen den Semikolons etwas.`);
        args.push(cmp());
        const u = next();
        if (!u) throw new FErr(`Es fehlt die schließende Klammer ) von ${name}.`);
        if (isOp(u, ';')) continue;
        if (isOp(u, ')')) break;
        if (isOp(u, ':')) throw new FErr('Vor und nach dem Doppelpunkt muss je eine Zelle stehen, z. B. B4:B8.');
        throw new FErr(`In ${name}(…) fehlt ein ; oder ein Rechenzeichen zwischen zwei Teilen.`);
      }
      if (name === 'WENN' && (args.length < 2 || args.length > 3)) throw new FErr(`WENN hat drei Teile: WENN(Bedingung; Dann-Wert; Sonst-Wert) – deine Formel hat ${args.length}.`);
      if (name === 'WENN' && args[0].k !== 'cmp' && !(args[0].k === 'call' && ['UND', 'ODER'].includes(args[0].name)) && args[0].k !== 'ref') throw new FErr('Der erste Teil von WENN ist eine Bedingung, z. B. B5>=18 oder UND(…).');
      return {k:'call', name, args};
    }
    if (isOp(t, '(')){
      const e = cmp(), u = next();
      if (!isOp(u, ')')) throw new FErr('Es fehlt eine schließende Klammer ).');
      return {k:'par', a:noRange(e)};
    }
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel oder an der falschen Stelle.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; trennt nur die Teile innerhalb einer Funktion, z. B. SUMME(B4:B8;D4:D8).');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine Zelle stehen, z. B. B4:B8.');
    if (t.type === 'op' && /[<>=]/.test(t.v)) throw new FErr(`Vor ${t.v} fehlt etwas: Ein Vergleich braucht links und rechts einen Wert, z. B. B5>=18.`);
    throw new FErr(`Das Zeichen ${t.v} steht an der falschen Stelle.`);
  }
  const ast = cmp();
  if (p < toks.length){
    const t = toks[p];
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; steht außerhalb einer Funktion. Steht die Klammer ) zu früh?');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine einzelne Zelle stehen, z. B. B4:B8.');
    throw new FErr('Zwischen zwei Teilen der Formel fehlt ein Rechenzeichen.');
  }
  return noRange(ast);
}

/* ---- Bezüge einer Formel ---- */
function refsOf(n, out = []){
  if (!n) return out;
  if (n.k === 'ref') out.push({a:n.v, b:n.v});
  else if (n.k === 'range') out.push({a:n.a, b:n.b});
  else if (n.k === 'call') n.args.forEach(x => refsOf(x, out));
  else if (n.k === 'bin' || n.k === 'cmp'){ refsOf(n.a, out); refsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') refsOf(n.a, out);
  return out;
}
const cellsOfRefs = refs => new Set(refs.flatMap(r => rangeCells(r.a, r.b)));
function fnsOf(n, out = new Set()){
  if (!n) return out;
  if (n.k === 'call'){ out.add(n.name); n.args.forEach(x => fnsOf(x, out)); }
  else if (n.k === 'bin' || n.k === 'cmp'){ fnsOf(n.a, out); fnsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') fnsOf(n.a, out);
  return out;
}
function numsOf(n, out = []){
  if (!n) return out;
  if (n.k === 'num') out.push(n.v);
  else if (n.k === 'call') n.args.forEach(x => numsOf(x, out));
  else if (n.k === 'bin' || n.k === 'cmp'){ numsOf(n.a, out); numsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') numsOf(n.a, out);
  return out;
}
function topCall(n){ while (n && n.k === 'par') n = n.a; return n && n.k === 'call' ? n : null; }
// Bezüge in einem (evtl. unfertigen) Formeltext finden – für die Farben in der Tabelle
function refsInText(s){
  const out = []; let inStr = false, chunk = '';
  const scan = c => { const re = /(^|[^A-Za-z0-9_$ÄÖÜäöüß])(\$?[A-Za-z]{1,3}\$?\d{1,5})(?:\s*:\s*(\$?[A-Za-z]{1,3}\$?\d{1,5}))?(?![A-Za-z0-9(])/g; let m;
    while ((m = re.exec(c))){ const a = normRef(m[2]), b = m[3] ? normRef(m[3]) : a; out.push({a, b, txt:m[3] ? `${a}:${b}` : a}); re.lastIndex = m.index + m[0].length; } };
  for (const ch of normQuotes(s)){ if (ch === '"'){ if (!inStr){ scan(chunk); chunk = ''; } inStr = !inStr; continue; } if (!inStr) chunk += ch; }
  scan(chunk);
  return out;
}

/* ---- Auswertung wie in Excel ---- */
const E = v => ({t:'err', v});
function toNum(v){
  if (v.t === 'num' || v.t === 'err') return v;
  if (v.t === 'empty') return {t:'num', v:0};
  if (v.t === 'bool') return {t:'num', v:v.v ? 1 : 0};
  return E('#WERT!');
}
// Vergleich wie in Excel: Zahl < Text < WAHR/FALSCH, Texte ohne Groß-/Kleinschreibung, leere Zelle = 0 bzw. ""
function vergleiche(o, a, b){
  if (a.t === 'err') return a; if (b.t === 'err') return b;
  if (a.t === 'empty') a = b.t === 'str' ? {t:'str', v:''} : b.t === 'bool' ? {t:'bool', v:false} : {t:'num', v:0};
  if (b.t === 'empty') b = a.t === 'str' ? {t:'str', v:''} : a.t === 'bool' ? {t:'bool', v:false} : {t:'num', v:0};
  const rang = {num:0, str:1, bool:2};
  let d;
  if (a.t !== b.t) d = rang[a.t] - rang[b.t];
  else if (a.t === 'str') d = a.v.toLowerCase().localeCompare(b.v.toLowerCase(), 'de');
  else d = (+a.v) - (+b.v);
  const w = {'=':d === 0, '<>':d !== 0, '<':d < 0, '>':d > 0, '<=':d <= 0, '>=':d >= 0}[o];
  return {t:'bool', v:w};
}
function wahr(v){ if (v.t === 'bool') return v.v; if (v.t === 'num') return v.v !== 0; if (v.t === 'empty') return false; return null; }
function evalAst(n, sh){
  switch (n.k){
    case 'num': return {t:'num', v:n.v};
    case 'str': return {t:'str', v:n.v};
    case 'ref': return sh.val(n.v);
    case 'par': return evalAst(n.a, sh);
    case 'neg': { const x = toNum(evalAst(n.a, sh)); return x.t === 'err' ? x : {t:'num', v:n.o === '-' ? -x.v : x.v}; }
    case 'bin': {
      const a = toNum(evalAst(n.a, sh)); if (a.t === 'err') return a;
      const b = toNum(evalAst(n.b, sh)); if (b.t === 'err') return b;
      if (n.o === '+') return {t:'num', v:a.v + b.v};
      if (n.o === '-') return {t:'num', v:a.v - b.v};
      if (n.o === '*') return {t:'num', v:a.v * b.v};
      if (n.o === '/') return b.v === 0 ? E('#DIV/0!') : {t:'num', v:a.v / b.v};
      return {t:'num', v:Math.pow(a.v, b.v)};
    }
    case 'cmp': return vergleiche(n.o, evalAst(n.a, sh), evalAst(n.b, sh));
    case 'call': return callFn(n, sh);
  }
  return E('#WERT!');
}
function callFn(n, sh){
  if (n.name === 'WENN'){
    const b = evalAst(n.args[0], sh); if (b.t === 'err') return b;
    const w = wahr(b); if (w === null) return E('#WERT!');
    const x = w ? n.args[1] : n.args[2];
    if (!x) return {t:'bool', v:false};
    const v = evalAst(x, sh); return v.t === 'empty' ? {t:'num', v:0} : v;
  }
  if (n.name === 'UND' || n.name === 'ODER'){
    const ws = [];
    for (const a of n.args){
      const v = evalAst(a, sh); if (v.t === 'err') return v;
      const w = wahr(v); if (w === null) return E('#WERT!'); ws.push(w);
    }
    return {t:'bool', v:n.name === 'UND' ? ws.every(Boolean) : ws.some(Boolean)};
  }
  const vals = [];
  for (const a of n.args){
    if (a.k === 'range') rangeCells(a.a, a.b).forEach(c => vals.push({x:sh.val(c), ref:true}));
    else if (a.k === 'ref') vals.push({x:sh.val(a.v), ref:true});
    else vals.push({x:evalAst(a, sh), ref:false});
  }
  if (n.name === 'ANZAHL') return {t:'num', v:vals.filter(o => o.x.t === 'num').length};
  if (n.name === 'ANZAHL2') return {t:'num', v:vals.filter(o => o.x.t !== 'empty').length};
  const nums = [];
  for (const o of vals){
    if (o.x.t === 'err') return o.x;
    if (o.x.t === 'num') nums.push(o.x.v);
    else if (!o.ref && o.x.t === 'str') return E('#WERT!');
  }
  if (n.name === 'SUMME') return {t:'num', v:nums.reduce((s, x) => s + x, 0)};
  if (n.name === 'MITTELWERT') return nums.length ? {t:'num', v:nums.reduce((s, x) => s + x, 0) / nums.length} : E('#DIV/0!');
  if (n.name === 'MIN') return {t:'num', v:nums.length ? Math.min(...nums) : 0};
  if (n.name === 'MAX') return {t:'num', v:nums.length ? Math.max(...nums) : 0};
  return E('#NAME?');
}
const PCACHE = new Map();
function parseCached(s){ if (!PCACHE.has(s)){ try { PCACHE.set(s, parseFormula(s)); } catch (e){ PCACHE.set(s, null); } } return PCACHE.get(s); }
class Sheet {
  constructor(cells){ this.cells = cells; this.memo = {}; this.busy = new Set(); }
  with(a, raw){ return new Sheet(Object.assign({}, this.cells, {[a]:raw})); }
  isFormula(a){ const r = this.cells[a]; return typeof r === 'string' && r[0] === '='; }
  val(a){
    if (a in this.memo) return this.memo[a];
    const r = this.cells[a]; let v;
    if (r == null || r === '') v = {t:'empty'};
    else if (typeof r === 'number') v = {t:'num', v:r};
    else if (this.isFormula(a) && r.includes('#BEZUG!')) v = E('#BEZUG!');
    else if (this.isFormula(a)){
      if (this.busy.has(a)) return E('Zirkelbezug');
      this.busy.add(a);
      const ast = parseCached(r);
      v = ast ? evalAst(ast, this) : E('#NAME?');
      this.busy.delete(a);
    } else v = {t:'str', v:r};
    this.memo[a] = v; return v;
  }
}
function same(a, b){
  if (a.t !== b.t) return false;
  if (a.t === 'num') return Math.abs(a.v - b.v) < 1e-9 * Math.max(1, Math.abs(b.v));
  return a.v === b.v;
}
function fmtNum(x, dp){ if (Math.abs(x) >= 1e11) return x.toExponential(2).replace('.', ',').replace('e+', 'E+'); return (dp != null ? x.toFixed(dp) : String(+x.toFixed(2))).replace('.', ','); }
function fmtVal(v, f){
  if (v.t === 'num') return f === 'eur' ? fmtNum(v.v, 2) + ' €' : f === 'usd' ? fmtNum(v.v, 2) + ' $' : f === 'pct' ? fmtNum(v.v * 100) + ' %' : fmtNum(v.v);
  if (v.t === 'empty') return '';
  if (v.t === 'bool') return v.v ? 'WAHR' : 'FALSCH';
  if (v.t === 'err') return v.v === 'Zirkelbezug' ? '0' : v.v;
  return v.v;
}

/* ---- Erklärung: Fortschritt je Thema (learn = {topic, prog:{id:{idx, done}}}) ---- */
const topic = () => TOPICS.find(t => t.id === learn.topic);
function prog(id){ id = id || learn.topic; return learn.prog[id] || (learn.prog[id] = {idx:0, done:[]}); }
function saveLearn(){ store('learn', JSON.stringify(learn)); }
const stepDone = i => prog().done.includes(i);
function markStep(){ const p = prog(); if (!p.done.includes(p.idx)){ p.done.push(p.idx); saveLearn(); } }
function firstOpen(){ const n = topic().steps.length; for (let i = 0; i < n; i++) if (!stepDone(i)) return i; return n - 1; }
const stepUnlocked = i => i <= firstOpen() || stepDone(i);
const curStep = () => topic().steps[prog().idx];
function gotoStep(i){ prog().idx = i; pickerOpen = false; loadStep(); window.scrollTo({top:0, behavior:'smooth'}); }
function openTopic(id){ learn.topic = id; saveLearn(); pickerOpen = false; loadStep(); window.scrollTo({top:0, behavior:'smooth'}); }
function overview(){ learn.topic = null; saveLearn(); pickerOpen = false; loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ---- Modus- und Aufgabensteuerung ---- */
function setMode(m){ if (m === mode) return; mode = m; store('mode', m); pickerOpen = false; if (m === 'endlos' && !endPick) newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function gotoTask(i){ pfadIdx = clamp(i, 0, STD.length - 1); store('idx', pfadIdx); pickerOpen = false; loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function canNext(){
  if (mode === 'lernen') return !!learn.topic && prog().idx < topic().steps.length - 1 && stepDone(prog().idx);
  return mode === 'pfad' ? (pfadIdx < STD.length - 1 && isSolved(pfadIdx)) : endCounted;
}
function nextTask(){
  if (!canNext()) return;
  if (mode === 'lernen'){ gotoStep(prog().idx + 1); return; }
  if (mode === 'pfad') gotoTask(pfadIdx + 1); else { newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
}

/* ---- Fragen in der Erklärung (LS = {sel, checked}) ---- */
function renderChoice(st){

}
function checkChoice(){
  const st = curStep();
  if (!LS.sel.size){ S.fb = {type:'err', html:'Wähle zuerst eine Antwort aus.'}; renderFeedback(); return; }
  LS.checked = true;
  const r = Aufgaben.mc.pruefen(st, LS.sel);
  if (r.ok){
    const erstmals = !stepDone(prog().idx); markStep(); logSolved(erstmals);
    S.fb = {type:'ok', html:'<b>Richtig! 🎉</b>' + (st.after ? `<span class="note">${st.after}</span>` : '') + (canNext() ? '<span class="note">Weiter geht es mit „Weiter“.</span>' : '')};
  } else {
    S.fb = {type:'err', html:'Noch nicht ganz.<br>' + r.gruende.join('<br>')};
  }
  renderChoice(st); renderFeedback(); renderNav();
}
// Klicks auf Antworten, Themen, Schritte und Übersicht, danach navClick; die Seite ruft topicClick(e) am Ende ihres Klick-Handlers
function topicClick(e){
  const o = e.target.closest('[data-opt]');
  if (o && LS){ const st = curStep(), i = +o.dataset.opt;
    if (Aufgaben.mehrfach(st)){ LS.sel.has(i) ? LS.sel.delete(i) : LS.sel.add(i); } else LS.sel = new Set([i]);
    LS.checked = false; S.fb = null; renderChoice(st); renderFeedback(); return; }
  const tp = e.target.closest('[data-topic]'); if (tp){ openTopic(tp.dataset.topic); return; }
  const tg = e.target.closest('[data-topic-go]'); if (tg){ openTopic(tg.dataset.topicGo); return; }
  if (e.target.closest('[data-ov]')){ overview(); return; }
  const mg = e.target.closest('[data-mode-go]'); if (mg){ setMode(mg.dataset.modeGo); return; }
  const sp = e.target.closest('[data-step]'); if (sp){ gotoStep(+sp.dataset.step); return; }
  if (e.target.closest('[data-learnreset]')){ if (confirm('Den Fortschritt in diesem Thema löschen und von vorne beginnen?')){ learn.prog[learn.topic] = {idx:0, done:[]}; gotoStep(0); } return; }
  navClick(e);
}

/* ---- Zellen und Bereiche mit der Maus in Eingaben (.pin) einfügen, wie in Excel ---- */
// Cursorposition einer Eingabe merken, auch wenn sie gerade nicht den Fokus hat
function caret(inp){
  if (document.activeElement === inp) return [inp.selectionStart, inp.selectionEnd];
  const n = inp.value.length;
  return [inp._s != null ? Math.min(inp._s, n) : n, inp._e != null ? Math.min(inp._e, n) : n];
}
function setCaret(inp, c){ inp._s = inp._e = c; if (document.activeElement === inp) inp.setSelectionRange(c, c); }
function focusInp(inp){ const [s, e] = caret(inp); inp.focus({preventScroll:true}); inp.setSelectionRange(s, e); }
// PT = {inp, anchor, cur, start, end, base}: laufende Markierung in der Tabelle
function applyPT(){
  const ref = PT.anchor === PT.cur ? PT.anchor : normRange(PT.anchor, PT.cur);
  PT.inp.value = PT.base.slice(0, PT.start) + ref + PT.base.slice(PT.end);
  setCaret(PT.inp, PT.start + ref.length);
  S.sel = new Set(rangeCells(PT.anchor, PT.cur));
  syncInput(PT.inp, true);
}
function cellAt(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('#grid td[data-c]') : null; }
function endPT(){ if (!PT) return; const inp = PT.inp; PT = null; if (document.body.contains(inp)) focusInp(inp); }
const gridEl = $('#grid');
gridEl.addEventListener('pointerup', endPT);
gridEl.addEventListener('pointercancel', endPT);
gridEl.addEventListener('mousedown', e => { if (CUR && e.target.closest('td[data-c]')) e.preventDefault(); });
gridEl.addEventListener('touchstart', e => { if (CUR && e.target.closest('td[data-c]')) e.preventDefault(); }, {passive:false});
const trackCaret = e => { const t = e.target; if (t.matches && t.matches('.pin')){ t._s = t.selectionStart; t._e = t.selectionEnd; } };
['keyup', 'click', 'select', 'focusout'].forEach(ev => document.addEventListener(ev, trackCaret, true));
document.addEventListener('input', e => { if (e.target.matches('.pin')){ trackCaret(e); syncInput(e.target, false); } });

<script>/* uebertragen.js */
/* uebertragen.js – Formeln übertragen und $-Zeichen setzen, wie in Excel (Seiten: bezuege, wenn-bezuege, und-oder-bezuege)
 * Laden nach basis.js, tabelle.js und dem Skript der Seite; dazu basis.css + tabelle.css.
 * Markup: wie in bezuege.html (#taskcard, #sheetcard mit #fbar/#pools/#grid/#chips, #workcard, #actions, #fb, #dock).
 *
 * Stufen (fest, LEVELS): 1 $-Zeichen setzen · 2 Zellen auswählen und $ setzen · 3 Rechnung aus Bausteinen ·
 *   4 Zeichen als Bausteine · 5 freie Eingabe mit Hinweisen · 6 freie Eingabe ohne Hinweise.
 * Modi: pfad (Übungen aus STD), endlos (Zufall aus GENS), lernen (nur wenn TOPICS nicht leer).
 *   Ein Modus lässt sich über die Adresse wählen: seite.html#pfad bzw. #endlos.
 * Geprüft wird, ob die Formel nach dem Übertragen in allen Zellen dasselbe ergibt wie die Musterlösung,
 *   auch mit 8 veränderten Zahlentabellen (abgeschriebene Zahlen fallen auf). Hinweise nennen falsche $-Zeichen.
 *
 * Die Seite liefert (vor dieser Datei)
 *   KEY = 'bz-'                      Speicherschlüssel
 *   GENS = {id: {title, make(r)}}    Aufgaben-Generator; make(r) mit Zufall r() liefert
 *     {intro, cells: {A4:'Name', B5:12, C5:'=…'}, fmt: {B2:'eur'|'usd'|'pct'}, ffmt (Format der Ergebnisse),
 *      fill: ['D5', 'D9'] (Formel in D5, übertragen bis D9), ref: '=B5*$B$2' (Musterlösung),
 *      what: '… berechnet' (ergänzt „Schreibe in D5 eine Formel, die …“), tip (optional, bis Stufe 4)}
 *   STD = [[gid, seed, gruppe]]      Übungen; GROUPS = [null, 'Gruppenname', …]
 *   TOPICS = [{id, name, desc, steps}] Erklärung (oder []), OV_INTRO (Text der Übersicht)
 *   HILFE    HTML, das bis Stufe 5 unter der Aufgabe steht (z. B. <details> zum $)
 *   SYM4     Zeichen-Bausteine auf Stufe 4, z. B. ['=', '+', '(', ')', 'SUMME(']; Zahlen und Texte der Lösung kommen dazu
 *   AC_FN    Funktionen für die Autovervollständigung (siehe basis.js)
 * Hilfen für Generatoren: rd(r, a, b, Stellen), pickN(r, liste, n), cols('B', 5) → ['B', … 'F']
 */

/* ---- Formel übertragen wie in Excel: relative Teile wandern, $-Teile bleiben ---- */
const REFRE = () => /(^|[^A-Za-z0-9_$ÄÖÜäöüß.])(\$?)([A-Za-z]{1,3})(\$?)(\d{1,5})(?![A-Za-z0-9_(])/g;
function outsideStrings(s, fn){
  let out = '', chunk = '', inStr = false;
  for (const ch of normQuotes(s)){
    if (ch === '"'){ if (!inStr){ out += fn(chunk); chunk = ''; } out += ch; inStr = !inStr; continue; }
    if (inStr) out += ch; else chunk += ch;
  }
  return out + fn(chunk);
}
function shiftFormula(s, dc, dr){
  return outsideStrings(s, part => part.replace(REFRE(), (m, pre, d1, col, d2, row) => {
    const c = colN(col) + (d1 ? 0 : dc), r = +row + (d2 ? 0 : dr);
    if (c < 0 || r < 1) return pre + '#BEZUG!';
    return pre + d1 + colL(c) + d2 + r;
  }));
}
// alle Zellbezüge (auch Bereichsgrenzen) mit ihren $-Zeichen
function refTokens(s){
  const out = [];
  outsideStrings(s, part => { const re = REFRE(); let m;
    while ((m = re.exec(part))){ out.push({raw:(m[2] + m[3] + m[4] + m[5]).toUpperCase(), c:colN(m[3]), r:+m[5], fc:!!m[2], fr:!!m[4]}); re.lastIndex = m.index + m[0].length; }
    return part; });
  return out;
}
const strip$ = s => s.replace(/\$/g, '').replace(/\s+/g, '').toUpperCase();
function offset(T, f){ const a = addr(T.src), b = addr(f); return {dc:b.c - a.c, dr:b.r - a.r}; }
function runCopy(text, T, cells){
  const c = Object.assign({}, cells), forms = {};
  T.fill.forEach(f => { const o = offset(T, f); forms[f] = shiftFormula(text, o.dc, o.dr); c[f] = forms[f]; });
  const sh = new Sheet(c), vals = {};
  T.fill.forEach(f => { vals[f] = sh.val(f); });
  return {vals, forms};
}

/* ---- Zufallszahlen ---- */
const rd = (r, a, b, dp) => +(a + r() * (b - a)).toFixed(dp);
const pickN = (r, arr, n) => shuffle(arr, r).slice(0, n);
const cols = (from, n) => [...Array(n)].map((_, i) => colL(colN(from) + i));
// gleiche Tabelle mit anderen Zahlen – damit abgeschriebene Zahlen auffallen
function perturb(cells, r){
  const out = {};
  for (const [k, v] of Object.entries(cells)){
    if (typeof v !== 'number'){ out[k] = v; continue; }
    let w;
    if (Number.isInteger(v)) w = v <= 0 ? v + ri(r, -6, 6) || 1 : Math.max(1, Math.round(v * (0.5 + r() * 1.2)));

}

// Formel in Bausteine zerlegen: Funktion mit Klammer, Zellbezug, Zahl oder einzelnes Zeichen
function piecesOf(ref){
  const out = []; let i = 0;
  while (i < ref.length){
    const rest = ref.slice(i); let m;
    if ((m = rest.match(/^[A-ZÄÖÜ]{2,}\d*\(/))) out.push({lit:m[0]});
    else if ((m = rest.match(/^\$?[A-Z]{1,3}\$?\d{1,5}/))) out.push({cell:true, raw:m[0]});
    else if ((m = rest.match(/^\d+(,\d+)?/))) out.push({lit:m[0]});
    else if ((m = rest.match(/^"[^"]*"/))) out.push({lit:m[0]});
    else if ((m = rest.match(/^(<=|>=|<>)/))) out.push({lit:m[0]});
    else { m = [rest[0]]; out.push({lit:m[0]}); }
    i += m[0].length;
  }
  return out;
}
// Jeder einzelne falsche $-Bezug (ein Bezug in einem anderen der vier Zustände) soll schon in der gezeigten Tabelle
// ein anderes Ergebnis liefern – sonst würfelt makeTask die Zahlen neu (höchstens 40-mal, sonst bleibt der erste Wurf).
function jederFehlerSichtbar(o){
  const T = {src:o.fill[0], fill:rangeCells(o.fill[0], o.fill[1])}, want = runCopy(o.ref, T, o.cells);
  const re = REFRE(), teile = []; let m;
  while ((m = re.exec(o.ref))){ teile.push({st:m.index + m[1].length, en:m.index + m[0].length, col:m[3], row:m[5], d1:m[2], d2:m[4]}); re.lastIndex = m.index + m[0].length; }
  for (const t of teile) for (const [d1, d2] of [['', ''], ['$', '$'], ['$', ''], ['', '$']]){
    if (d1 === t.d1 && d2 === t.d2) continue;
    const falsch = o.ref.slice(0, t.st) + d1 + t.col + d2 + t.row + o.ref.slice(t.en);
    const mine = runCopy(falsch, T, o.cells);
    if (T.fill.every(f => strip$(mine.forms[f]) === strip$(want.forms[f]))) continue;   // bewirkt in dieser Richtung nichts
    if (T.fill.every(f => same(mine.vals[f], want.vals[f]))) return false;
  }
  return true;
}
function makeTask(gid, seed, lv){
  const G = GENS[gid], s0 = seed == null ? 4711 : seed, r0 = rng(s0);
  const o0 = G.make(r0);
  let o = o0, k = 0;
  while (k++ < 40 && !jederFehlerSichtbar(o)) o = G.make(r0);
  if (!jederFehlerSichtbar(o)) o = o0;   // kein Wurf passt (z. B. Bereich wächst in leere Zellen): beim ersten bleiben
  const [src, end] = o.fill, fill = rangeCells(src, end), a = addr(src), b = addr(end);
  const dir = a.c === b.c ? `nach unten bis ${B(end)}` : a.r === b.r ? `nach rechts bis ${B(end)}` : `in den ganzen Bereich ${B(src + ':' + end)}`;
  const how = {
    2:' Die Rechenzeichen sind schon vorgegeben: Klicke in ein Zell-Feld, dann auf die passende Zelle in der Tabelle, und setze – wo nötig – $-Zeichen.',
    3:' Ziehe die Bausteine in der richtigen Reihenfolge in die Formelzeile. In die Zell-Felder setzt du die passenden Zellen – wo nötig mit $.',
    4:' Baue die Formel aus den Zeichen-Bausteinen. Für jede Zelle ziehst du einen Baustein „Zelle“ in die Formel und wählst dann die Zelle aus – wo nötig mit $.'};
  let text = lv === 1
    ? `In ${B(src)} steht schon eine Formel, die ${o.what}. Sie rechnet in ${src} richtig. Setze die $-Zeichen so, dass sie sich ${dir} übertragen lässt. Wo kein $ nötig ist, lässt du es weg.`
    : `Schreibe in ${B(src)} eine Formel, die ${o.what}. Die Formel soll sich ${dir} übertragen lassen.` + (how[lv] || '');
  if (o.tip && lv <= 4) text += `<br><i>Tipp:</i> ${o.tip}`;
  const fmt = Object.assign({}, o.fmt || {});
  if (o.ffmt) fill.forEach(f => { fmt[f] = o.ffmt; });
  const vr = rng(s0 ^ 0x5bd1e995), variants = [];
  for (let i = 0; i < 8; i++) variants.push(perturb(o.cells, vr));
  const top = Math.min(...Object.keys(o.cells).map(k => addr(k).r));
  return {gid, seed:s0, lv, title:G.title, intro:o.intro, cells:o.cells, fmt, src, end, fill, ref:o.ref, text, variants, top,
    dcMax:b.c - a.c, drMax:b.r - a.r, pre:lv === 1 ? o.ref.replace(/\$/g, '') : '',
    pieces:piecesOf(o.ref), nums:piecesOf(o.ref).filter(p => /^[\d"]/.test(p.lit || '')).map(p => p.lit)};
}

/* ---------- F4: $-Zeichen am Cursor durchschalten ---------- */
function f4(inp){

  while ((m = re.exec(v))){ const st = m.index + m[1].length, en = m.index + m[0].length; if (s >= st && s <= en){ hit = {st, en, m}; break; } re.lastIndex = en; }

  const nw = (nx === 1 || nx === 3 ? '$' : '') + cl.toUpperCase() + (nx === 1 || nx === 2 ? '$' : '') + rw;

/* ---------- Zellen mit der Maus einfügen (wie in Excel) ---------- */
function insertionPoint(inp){
  const v = inp.value, [s, e] = caret(inp), before = v.slice(0, s);
  const okBefore = pc => /[=(;+\-*/^:<>]/.test(pc);
  const m = before.match(/\$?[A-Za-z]{1,3}\$?\d{1,5}(?:\s*:\s*\$?[A-Za-z]{1,3}\$?\d{1,5})?$/);
  if (m){
    const st = s - m[0].length, pre = v.slice(0, st).replace(/\s+$/, '');
    if (okBefore(pre.slice(-1))) return {start:st, end:Math.max(s, e)};
  }
  const pc = before.replace(/\s+$/, '').slice(-1);
  if (okBefore(pc)) return {start:s, end:e};
  return {err:'Hier kann kein Bezug eingefügt werden. Setze den Cursor hinter „=“, ein Rechenzeichen oder „(“.'};
}

  if (isBlk()){
    const gaps = [...document.querySelectorAll('.cg')];
    const g = gaps.find(x => +x.dataset.ci === S.gi) || gaps.find(x => !x.value);
    if (!g){ hint(gaps.length ? 'Klicke zuerst in das Zell-Feld, das du ändern möchtest.' : 'Ziehe zuerst einen Baustein „Zelle“ in die Formel – dann kannst du eine Zelle auswählen.'); return; }
    if (a === CUR.src){ hint(`In ${a} steht deine Formel selbst.`); return; }
    g.value = a; setCaret(g, a.length); syncInput(g, false); focusInp(g);
    return;
  }
  const inp = $('#ft');
  if (a === CUR.src){ hint(`In ${a} steht deine Formel selbst.`); focusInp(inp); return; }
  if (!inp.value.trim()){ inp.value = '='; setCaret(inp, 1); }
  const at = insertionPoint(inp);
  if (at.err){ hint(at.err); focusInp(inp); return; }
  $('#selhint').textContent = '';
  PT = {inp, anchor:a, cur:a, start:at.start, end:at.end, base:inp.value};
  applyPT();
  try { gridEl.setPointerCapture(e.pointerId); } catch (x) {}
});
gridEl.addEventListener('pointermove', e => {
  if (!PT) return;
  const td = cellAt(e.clientX, e.clientY);
  if (td && td.dataset.c !== PT.cur && td.dataset.c !== CUR.src){ PT.cur = td.dataset.c; applyPT(); }
});
/* ---------- Prüfen ---------- */
const cellName = t => ad(t.c, t.r);
// Bezüge der Schülerformel den Bezügen der Musterlösung zuordnen (gleiche Zelle) und $-Fehler benennen
function refHints(text, T){
  const mine = refTokens(text), want = refTokens(T.ref), used = new Set(), out = [];
  const far = T.end, o = offset(T, far);
  let unmatched = 0;
  want.forEach(q => {
    const i = mine.findIndex((s, k) => !used.has(k) && s.c === q.c && s.r === q.r);
    if (i < 0){ unmatched++; return; }
    used.add(i); const s = mine[i];
    const colBad = T.dcMax > 0 && s.fc !== q.fc, rowBad = T.drMax > 0 && s.fr !== q.fr;
    if (!colBad && !rowBad) return;
    let m = `Aus ${C(s.raw)} wird beim Übertragen nach ${far} ${C(shiftFormula(s.raw, o.dc, o.dr))}.`;
    if (colBad) m += q.fc ? ` Die Spalte ${colL(q.c)} soll aber fest bleiben – setze ein $ vor das ${colL(q.c)}.` : ` Die Spalte soll aber mitwandern – vor dem ${colL(q.c)} darf kein $ stehen.`;
    if (rowBad) m += q.fr ? ` Die Zeile ${q.r} soll aber fest bleiben – setze ein $ vor die ${q.r}.` : ` Die Zeile soll aber mitwandern – vor der ${q.r} darf kein $ stehen.`;
    out.push(m);
  });
  const extra = mine.filter((s, k) => !used.has(k));
  if (unmatched || extra.length) out.unshift(extra.length
    ? `Prüfe ${extra.length > 1 ? 'die Bezüge' : 'den Bezug'} ${extra.map(s => C(s.raw)).join(', ')} – ist das die richtige Zelle für diese Rechnung?`
    : 'In deiner Formel fehlt noch ein Wert aus der Tabelle.');
  return [...new Set(out)];
}
// halbe $-Zeichen, die hier nichts bewirken (z. B. $B5, wenn nur nach unten übertragen wird); $B$2 gilt immer als fester Bezug
function extraDollars(text, T){
  return refTokens(text).filter(s => s.fc !== s.fr && ((s.fc && T.dcMax === 0) || (s.fr && T.drMax === 0))).map(s => s.raw);
}
function judge(text, T){
  const lv = T.lv;
  let ast;
  try { ast = parseFormula(text); }
  catch (e){ if (!(e instanceof FErr)) throw e; return {err:lv >= 6 ? 'Die Formel enthält einen Fehler.' : esc(e.message)}; }
  if (!refsOf(ast).length) return {err:'Deine Formel enthält keinen Zellbezug. Verwende Zellen wie B5 – nur dann kann Excel die Formel beim Übertragen anpassen.'};
  const runs = [T.cells, ...T.variants];
  let first = null;
  for (let k = 0; k < runs.length; k++){
    const mine = runCopy(text, T, runs[k]), want = runCopy(T.ref, T, runs[k]);
    const bad = T.fill.filter(f => !same(mine.vals[f], want.vals[f]));
    if (k === 0) first = {mine, bad};
    if (!bad.length) continue;
    const res = {vals:first.mine.vals, forms:first.mine.forms, bad:k === 0 ? bad : [], peek:k === 0 ? bad[0] : null};
    const f = bad[0], fmt = T.fmt[f], hints = lv < 6 ? refHints(text, T) : [];
    let msg;
    if (k > 0){
      const nums = numsOf(ast).filter(x => x !== 1 && x !== 100);
      msg = nums.length
        ? `Deine Formel liefert hier nur zufällig das richtige Ergebnis. Du hast die Zahl ${fmtNum(nums[0])} abgeschrieben – verwende stattdessen den Zellbezug. Dann rechnet Excel richtig weiter, wenn sich ein Wert in der Tabelle ändert.`
        : 'Deine Formel liefert nur mit genau diesen Zahlen das richtige Ergebnis – sobald sich ein Wert in der Tabelle ändert, nicht mehr.' + (hints.length ? '<br>' + hints.join('<br>') : '');
    } else if (f === T.src){
      msg = `Schon in ${B(T.src)} stimmt das Ergebnis noch nicht: Deine Formel ergibt ${esc(fmtVal(mine.vals[f], fmt) || '0')}.`;
      if (lv < 6) msg += '<br>' + (hints.length ? hints.join('<br>') : 'Prüfe, ob du die richtigen Zellen und Rechenzeichen verwendest.');
    } else if (lv >= 6){
      msg = `In ${B(T.src)} stimmt das Ergebnis – aber nach dem Übertragen nicht mehr überall, zum Beispiel in ${B(f)}. Klicke auf die rot markierten Zellen, um die Formeln zu sehen.`;
    } else {
      const v = mine.vals[f];
      msg = `In ${B(T.src)} stimmt das Ergebnis – aber nach dem Übertragen nicht mehr. In ${B(f)} steht dann ${C(esc(mine.forms[f]))}` +
        (v.t === 'err' ? `, und Excel zeigt ${C(esc(v.v === 'Zirkelbezug' ? 'einen Zirkelbezug' : v.v))}.` : v.t === 'empty' ? '.' : ` – das ergibt ${esc(fmtVal(v, fmt))}.`) +
        (hints.length ? '<br>' + hints.join('<br>') : '');
    }
    if (lv === 1 && strip$(text) !== strip$(T.pre)) msg += '<span class="note">Auf dieser Stufe musst du nur $-Zeichen setzen – der Rest der Formel stimmt schon. Mit „Zurücksetzen“ bekommst du die Formel wieder.</span>';
    return Object.assign(res, {err:msg});
  }
  const notes = [];
  if (lv < 6){ const x = extraDollars(text, T); if (x.length) notes.push(`Kleiner Hinweis: Die $-Zeichen in ${x.map(C).join(', ')} bewirken hier nichts, weil die Formel nur ${T.dcMax ? 'nach rechts' : 'nach unten'} übertragen wird. Sie schaden aber auch nicht.`); }
  return {ok:true, vals:first.mine.vals, forms:first.mine.forms, bad:[], notes};
}

function check(){
  if (!CUR){ if (LS) checkChoice(); return; }
  if (S.success) return;
  const text = liveText();
  let miss = null;
  if (isBlk() && !S.row.length) miss = 'Ziehe zuerst Bausteine in die Formelzeile.';
  else if (isBlk() && S.row.some(x => x.t === 'cell' && !x.v.trim())) miss = 'Es ist noch ein Zell-Feld leer. Klicke hinein und wähle eine Zelle in der Tabelle aus.';
  else if (!text.trim()) miss = `Schreibe zuerst eine Formel in ${CUR.src}.`;
  if (miss){ S.fb = {type:'err', html:miss}; renderFeedback(); return; }
  const j = judge(text, CUR);
  S.vals = j.vals || null; S.forms = j.forms || null; S.bad = new Set(j.bad || []); S.peek = j.peek || null;
  if (j.ok){
    S.success = true;
    let erstmals;
    if (mode === 'lernen'){ erstmals = !stepDone(prog().idx); markStep(); }
    else erstmals = countSolved();
    logSolved(erstmals);
    const nx = canNext() ? `<span class="note">Weiter geht es mit „${mode === 'lernen' ? 'Weiter' : 'Nächste Aufgabe'}“.</span>` : '';
    S.fb = {type:'ok', html:`<b>Richtig! 🎉</b> Die Formel stimmt in allen Zellen von ${CUR.src} bis ${CUR.end}.<br><span class="fcol">${esc(text)}</span>` +
      j.notes.map(n => `<span class="note">${n}</span>`).join('') + '<span class="note">Klicke auf eine Zelle im grünen Bereich, um zu sehen, welche Formel dort nach dem Übertragen steht.</span>' + nx};
  } else S.fb = {type:'err', html:j.err};
  renderGrid(); renderFeedback(); renderNav();
}

function clearMarks(){
  if (!S.success && !S.fb && !S.vals) return;
  S.success = false; S.fb = null; S.vals = null; S.forms = null; S.bad = new Set(); S.peek = null;
  renderFeedback();
}

/* ---------- Autovervollständigung (basis.js): Funktionen dieser Seite ---------- */
AC.word = before => { const m = before.match(/[A-Za-zÄÖÜäöüß]+$/); return m && m[0].length >= 2 && before.trimStart().startsWith('=') ? m[0] : null; };

document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.cg')) S.gi = +e.target.dataset.ci; });
/* ---------- Ereignisse ---------- */
document.addEventListener('pointerdown', e => { if (e.target.closest('#f4Btn')) e.preventDefault(); });
document.addEventListener('click', e => {
  if (e.target.closest('#f4Btn')){ f4(); return; }
  if (e.target.closest('.cg')) return;
  topicClick(e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'F4' && (e.target.id === 'ft' || e.target.matches('.cg'))){ e.preventDefault(); f4(e.target); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.pin')){ e.preventDefault(); check(); }
});
if (mode === 'endlos') newEndless();
loadTask();

</script>
