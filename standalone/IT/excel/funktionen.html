/* Autovervollständigung wie in Excel: Funktionsliste beim Tippen, Argument-Hinweis in Klammern */
const acCanvas = document.createElement('canvas').getContext('2d');
const AC = {list:[], sel:0, key:'', start:0, token:'', closed:'', input:null,
  digits:false,           // Funktionsnamen dürfen Ziffern enthalten (ANZAHL2)
  prev:/[=(;<>\s,]/,      // erlaubtes Zeichen vor dem getippten Wort
  // getipptes Wort am Cursor (oder null); in #ft erst nach einem „=“
  word:(before, inp) => { const m = before.match(/[A-Za-zÄÖÜäöüß]+$/); return m && (inp.id !== 'ft' || before.trimStart().startsWith('=')) ? m[0] : null; }};
function acArgs(f, i){
  if (f.a) return f.a;
  const n = Math.max(2, i + 1), out = [];
  for (let k = 1; k <= n; k++) out.push(k === 1 ? f.v + k : `[${f.v}${k}]`);
  return [...out, '…'];
}
function acCaretX(inp, idx){
  const cs = getComputedStyle(inp), r = inp.getBoundingClientRect();
  acCanvas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  return r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + acCanvas.measureText(inp.value.slice(0, idx)).width - inp.scrollLeft;
}
function acEls(){
  let pop = document.getElementById('acpop'), tip = document.getElementById('actip');
  if (!pop){
    pop = document.createElement('div'); pop.id = 'acpop'; pop.className = 'acpop'; document.body.appendChild(pop);
    tip = document.createElement('div'); tip.id = 'actip'; tip.className = 'actip'; document.body.appendChild(tip);
    pop.addEventListener('pointerdown', e => { const it = e.target.closest('[data-aci]'); e.preventDefault(); if (it){ AC.sel = +it.dataset.aci; acInsert(); } });
  }
  return {pop, tip};
}
function acHide(){ const {pop, tip} = acEls(); pop.style.display = 'none'; tip.style.display = 'none'; AC.list = []; }
function acPlace(el, x, inp){
  const r = inp.getBoundingClientRect();
  el.style.display = 'block';
  el.style.left = Math.max(8, Math.min(x - 6, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = (r.bottom + 4) + 'px';
}
function acUpdate(inp){
  inp = inp || document.activeElement;
  if (!inp || !inp.matches || !inp.matches('.acin') || document.activeElement !== inp){ acHide(); return; }
  AC.input = inp;
  const {pop, tip} = acEls();
  const pos = inp.selectionStart ?? inp.value.length, before = normQuotes(inp.value.slice(0, pos));
  // Zeichen für Zeichen lesen: Textbereiche überspringen, offene Funktionen merken
  const stack = []; let inStr = false, word = '', wstart = 0;
  for (let i = 0; i < before.length; i++){
    const ch = before[i];
    if (ch === '"'){ inStr = !inStr; word = ''; continue; }
    if (inStr) continue;
    if (/[A-Za-zÄÖÜäöüß]/.test(ch) || (AC.digits && word && /[0-9]/.test(ch))){ if (!word) wstart = i; word += ch; continue; }

    else if (ch === ';' && stack.length) stack[stack.length - 1].i++;

  let list = [], token = '', start = pos;

  if (w){
    token = w; start = pos - token.length;
    const prev = before[start - 1];
    if (!prev || AC.prev.test(prev)) list = AC_FN.filter(f => f.n.startsWith(token.toUpperCase()));
    if (list.length === 1 && list[0].n === token.toUpperCase() && inp.value[pos] === '(') list = [];
  }
  const key = start + ':' + token.toUpperCase();
  if (AC.closed === key) list = [];
  if (key !== AC.key) AC.sel = 0;
  AC.key = key; AC.token = token; AC.start = start; AC.list = list;
  if (AC.sel >= list.length) AC.sel = 0;
  if (list.length){
    const f = list[AC.sel];
    pop.innerHTML = `<div class="acl">${list.map((x, i) => `<div class="aci${i === AC.sel ? ' sel' : ''}" data-aci="${i}"><span class="acfx">fx</span>${x.n}</div>`).join('')}</div><div class="acdesc">${esc(f.d)}</div><div class="ackey">Tab ↹ fügt ein · ↑ ↓ wählen</div>`;
    acPlace(pop, acCaretX(inp, start), inp);
    tip.style.display = 'none';
    return;
  }
  pop.style.display = 'none';
  const top = stack[stack.length - 1], f = top && AC_FN.find(x => x.n === top.fn);
  if (f){
    const args = acArgs(f, top.i);
    const act = f.a ? Math.min(top.i, args.length - 1) : top.i;
    tip.innerHTML = `<span class="acfn">${f.n}</span>(${args.map((a, i) => i === act ? `<b>${esc(a)}</b>` : esc(a)).join('; ')})`;
    acPlace(tip, acCaretX(inp, top.at), inp);
  } else tip.style.display = 'none';
}
function acInsert(){
  const inp = AC.input, f = AC.list[AC.sel];
  if (!inp || !f) return;
  const pos = inp.selectionStart ?? inp.value.length;
  const after = inp.value.slice(pos), add = after.startsWith('(') ? f.n : f.n + '(';
  inp.value = inp.value.slice(0, AC.start) + add + after;
  const c = AC.start + f.n.length + 1;
  inp.focus(); inp.setSelectionRange(c, c);
  inp.dispatchEvent(new Event('input', {bubbles:true}));
  acUpdate(inp);
}
document.addEventListener('keydown', e => {
  if (!e.target.matches || !e.target.matches('.acin') || !AC.list.length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); AC.sel = (AC.sel + 1) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); AC.sel = (AC.sel - 1 + AC.list.length) % AC.list.length; acUpdate(e.target); }
  else if (e.key === 'Tab'){ e.preventDefault(); acInsert(); }
  else if (e.key === 'Escape'){ e.preventDefault(); AC.closed = AC.key; acUpdate(e.target); }
  else if (e.key === 'Enter'){ acHide(); }
}, true);
document.addEventListener('keyup', e => { if (e.target.matches && e.target.matches('.acin') && !['ArrowDown', 'ArrowUp', 'Tab', 'Escape', 'Enter', 'F4'].includes(e.key)) acUpdate(e.target); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.acin')) acUpdate(e.target); });
document.addEventListener('focusout', () => setTimeout(() => acUpdate(), 0));
window.addEventListener('scroll', () => { if (AC.input && document.activeElement === AC.input) acUpdate(AC.input); }, {passive:true});
window.addEventListener('resize', () => acUpdate());

</script>
<script>/* tabelle.js */
/* tabelle.js – Ergänzung zu basis.js für Trainer mit Tabellenblatt (funktionen, bezuege)
 * Laden nach basis.js; dazu tabelle.css nach basis.css.
 *
 * API
 *   Rechenwerk: FUNCS, FDESC, GOAL, ALIAS, ENGLISH, CELLRE, colN, colL, addr, ad, normRef, rangeCells,
 *     normRange, tokenize, parseFormula, refsOf, cellsOfRefs, fnsOf, numsOf, topCall, refsInText,
 *     E, toNum, evalAst, callFn, parseCached, Sheet(cells).val(a), same, fmtNum, fmtVal(v, 'eur'|'usd'|'pct')
 *   Erklärung (learn = {topic, prog:{id:{idx, done}}}): topic, prog, saveLearn, stepDone, markStep,
 *     firstOpen, stepUnlocked, curStep, gotoStep, openTopic, overview
 *   setMode, gotoTask, canNext, nextTask, renderNav, renderDock, renderOverview(introHtml),
 *   renderFeedback, renderChoice(st), checkChoice(), hint(msg)
 *   topicClick(e)   Antworten, Themen, Schritte, Übersicht, dann navClick – am Ende des Klick-Handlers
 *   caret, setCaret, focusInp, applyPT, cellAt, endPT, gridEl, trackCaret   Bezüge mit der Maus einfügen
 *   Verdrahtet: #ovBtn, #prevBtn, #resetBtn, Eingabe in .pin → syncInput, Maus-Ende im #grid
 *
 * Braucht ../../lib/aufgaben.js (Multiple Choice: Aufgaben.mc), vor basis.js einbinden.
 *
 * Die Seite liefert
 *   TOPICS, GROUPS, AC_FN; let learn, endPick, CUR, S, LS, PT
 *   render, resetS, loadStep, newEndless, setLevel, clearMarks, syncInput(inp, keepSel), logSolved
 */


const FUNCS = ['SUMME', 'MITTELWERT', 'MIN', 'MAX', 'ANZAHL', 'ANZAHL2'];
const FDESC = {
  SUMME:'addiert alle Zahlen',
  MITTELWERT:'berechnet den Durchschnitt',
  MIN:'liefert den kleinsten Wert',
  MAX:'liefert den größten Wert',
  ANZAHL:'zählt die Zellen, in denen eine Zahl steht',
  ANZAHL2:'zählt alle Zellen, die nicht leer sind – auch Zellen mit Text'
};
const GOAL = {SUMME:'die Summe (alles zusammen)', MITTELWERT:'der Durchschnitt', MIN:'der kleinste Wert', MAX:'der größte Wert',
  ANZAHL:'die Anzahl der Zellen mit einer Zahl', ANZAHL2:'die Anzahl aller Einträge'};
// englische oder falsche Funktionsnamen -> Hinweis
const ALIAS = {SUM:'SUMME', AVERAGE:'MITTELWERT', COUNT:'ANZAHL', COUNTA:'ANZAHL2', MINIMUM:'MIN', MAXIMUM:'MAX',
  DURCHSCHNITT:'MITTELWERT', MITTEL:'MITTELWERT', MITTELWERTE:'MITTELWERT', SUMMEN:'SUMME', SUM2:'SUMME', SUMM:'SUMME', SUME:'SUMME',
  ANZAL:'ANZAHL', ANZAHL1:'ANZAHL', ANZAL2:'ANZAHL2', ZÄHLEN:'ANZAHL', ANZAHLZWEI:'ANZAHL2'};
const ENGLISH = ['SUM', 'AVERAGE', 'COUNT', 'COUNTA'];


/* ---- Zellbezüge ---- */
const CELLRE = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,5})$/;
const colN = L => L.toUpperCase().split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
function colL(n){ let s = ''; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function addr(s){ const m = String(s).match(CELLRE); return m ? {c:colN(m[1]), r:+m[2]} : null; }
const ad = (c, r) => colL(c) + r;
const normRef = s => { const a = addr(s); return ad(a.c, a.r); };
function rangeCells(a, b){
  const x = addr(a), y = addr(b), out = [];
  for (let r = Math.min(x.r, y.r); r <= Math.max(x.r, y.r); r++)
    for (let c = Math.min(x.c, y.c); c <= Math.max(x.c, y.c); c++) out.push(ad(c, r));
  return out;
}
function normRange(a, b){
  const x = addr(a), y = addr(b);
  return ad(Math.min(x.c, y.c), Math.min(x.r, y.r)) + ':' + ad(Math.max(x.c, y.c), Math.max(x.r, y.r));
}

/* ---- Zerlegen ---- */
function tokenize(src){
  const t = []; let i = 0; const n = src.length;
  const isL = ch => /[A-Za-zÄÖÜäöüß$]/.test(ch);
  while (i < n){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '"'){
      i++; let v = '', closed = false;
      while (i < n){ if (src[i] === '"'){ if (src[i+1] === '"'){ v += '"'; i += 2; continue; } closed = true; i++; break; } v += src[i++]; }
      if (!closed) throw new FErr('Ein Anführungszeichen wurde geöffnet, aber nicht wieder geschlossen.');
      t.push({type:'str', v}); continue;
    }
    if (/[0-9]/.test(c)){
      let j = i; while (j < n && /[0-9]/.test(src[j])) j++;
      if (src[j] === ',' && /[0-9]/.test(src[j+1] || '')){ j++; while (j < n && /[0-9]/.test(src[j])) j++; }
      if (src[j] === '.' && /[0-9]/.test(src[j+1] || '')) throw new FErr('Dezimalzahlen schreibt man im deutschen Excel mit Komma, z. B. 0,25.');
      if (j < n && isL(src[j])){ let k = j; while (k < n && /[A-Za-z0-9]/.test(src[k])) k++; throw new FErr(`„${src.slice(i, k)}“ verstehe ich nicht. Ein Zellbezug beginnt mit dem Buchstaben der Spalte, z. B. B4.`); }
      t.push({type:'num', v:parseFloat(src.slice(i, j).replace(',', '.'))}); i = j; continue;
    }
    if (isL(c)){
      let j = i; while (j < n && /[A-Za-z0-9ÄÖÜäöüß$_.]/.test(src[j])) j++;
      const w = src.slice(i, j), up = w.toUpperCase();
      let k = j; while (k < n && /\s/.test(src[k])) k++;
      if (src[k] === '('){ t.push({type:'fn', v:up.replace(/\./g, '')}); i = j; continue; }
      if (CELLRE.test(w)){ t.push({type:'ref', v:normRef(w)}); i = j; continue; }
      if (FUNCS.includes(up)) throw new FErr(`Nach ${up} muss eine Klammer folgen: ${up}(…)`);
      if (/^\$?[A-Za-z]{1,3}\$?\d+\$?[A-Za-z]{1,3}\$?\d+$/.test(w)) throw new FErr(`Zwischen den Zellen in „${w}“ fehlt etwas. Für einen Bereich schreibst du einen Doppelpunkt, z. B. B4:B8.`);
      if (ALIAS[up]) throw new FErr(`Meinst du ${ALIAS[up]}? Nach dem Funktionsnamen folgt eine Klammer: ${ALIAS[up]}(…)`);
      throw new FErr(`„${w}“ ist weder ein Zellbezug (wie B4) noch eine Funktion.`);
    }
    if ('+-*/^();:'.includes(c)){ t.push({type:'op', v:c}); i++; continue; }
    if (c === ',') throw new FErr('Im deutschen Excel trennt man die Teile einer Funktion mit einem Semikolon ; – und einen Bereich „von … bis“ schreibt man mit Doppelpunkt, z. B. B4:B8.');
    if (c === '=') throw new FErr('Das = steht nur einmal ganz am Anfang der Formel.');
    if (c === '<' || c === '>') throw new FErr('Vergleiche mit < oder > brauchst du hier nicht.');
    if (c === '€' || c === '%') throw new FErr(`Das Zeichen ${c} gehört nicht in die Formel. Schreibe nur die Zahl bzw. den Zellbezug.`);
    throw new FErr(`Das Zeichen „${c}“ gehört nicht in eine Formel.`);
  }
  return t;
}

/* ---- Parser: + - * / ^, Klammern, Funktionen mit Bereichen ---- */
function noRange(n){ if (n.k === 'range') throw new FErr(`Ein Bereich wie ${n.a}:${n.b} funktioniert nur in einer Funktion, z. B. =SUMME(${n.a}:${n.b}).`); return n; }
function parseFormula(raw){
  const s = normQuotes(String(raw)).trim();
  if (!s) throw new FErr('Gib zuerst eine Formel ein.');
  if (s[0] !== '=') throw new FErr('Eine Formel beginnt in Excel immer mit einem Gleichheitszeichen =.');
  const toks = tokenize(s.slice(1)); let p = 0;
  if (!toks.length) throw new FErr('Nach dem = fehlt noch die Formel.');
  const peek = () => toks[p], next = () => toks[p++];
  const isOp = (t, v) => t && t.type === 'op' && t.v === v;
  function expr(){ let a = term(); while (isOp(peek(), '+') || isOp(peek(), '-')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(term())}; } return a; }
  function term(){ let a = factor(); while (isOp(peek(), '*') || isOp(peek(), '/')){ const o = next().v; a = {k:'bin', o, a:noRange(a), b:noRange(factor())}; } return a; }
  function factor(){ if (isOp(peek(), '-') || isOp(peek(), '+')){ const o = next().v; return {k:'neg', o, a:noRange(factor())}; } return power(); }
  function power(){ let a = atom(); if (isOp(peek(), '^')){ next(); a = {k:'bin', o:'^', a:noRange(a), b:noRange(factor())}; } return a; }
  function atom(){
    const t = next();
    if (!t) throw new FErr('Die Formel hört zu früh auf – am Ende fehlt noch etwas.');
    if (t.type === 'num') return {k:'num', v:t.v};
    if (t.type === 'str') return {k:'str', v:t.v};
    if (t.type === 'ref'){
      if (isOp(peek(), ':')){
        next(); const u = next();
        if (!u || u.type !== 'ref') throw new FErr('Nach dem Doppelpunkt muss eine Zelle folgen, z. B. B4:B8.');
        return {k:'range', a:t.v, b:u.v};
      }
      return {k:'ref', v:t.v};
    }
    if (t.type === 'fn'){
      const name = t.v; next(); // (
      if (!FUNCS.includes(name)){
        if (ENGLISH.includes(name)) throw new FErr(`Im deutschen Excel heißt die Funktion ${ALIAS[name]} statt ${name}.`);
        if (ALIAS[name]) throw new FErr(`Die Funktion heißt ${ALIAS[name]}, nicht ${name}.`);
        if (CELLRE.test(name)) throw new FErr(`Nach der Zelle ${name} darf keine Klammer folgen. Fehlt ein Rechenzeichen?`);
        throw new FErr(`Die Funktion ${name} gibt es hier nicht. Du brauchst SUMME, MITTELWERT, MIN, MAX, ANZAHL oder ANZAHL2.`);
      }
      if (isOp(peek(), ')')){ next(); throw new FErr(`In die Klammer von ${name} gehört ein Bereich, z. B. ${name}(B4:B8).`); }
      const args = [];
      for (;;){
        if (isOp(peek(), ';') || isOp(peek(), ')')) throw new FErr(`In ${name}(…) fehlt zwischen den Semikolons etwas.`);
        args.push(expr());
        const u = next();
        if (!u) throw new FErr(`Es fehlt die schließende Klammer ) von ${name}.`);
        if (isOp(u, ';')) continue;
        if (isOp(u, ')')) break;
        if (isOp(u, ':')) throw new FErr('Vor und nach dem Doppelpunkt muss je eine Zelle stehen, z. B. B4:B8.');
        throw new FErr(`In ${name}(…) fehlt ein ; oder ein Rechenzeichen zwischen zwei Teilen.`);
      }
      return {k:'call', name, args};
    }
    if (isOp(t, '(')){
      const e = expr(), u = next();
      if (!isOp(u, ')')) throw new FErr('Es fehlt eine schließende Klammer ).');
      return {k:'par', a:noRange(e)};
    }
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel oder an der falschen Stelle.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; trennt nur die Teile innerhalb einer Funktion, z. B. SUMME(B4:B8;D4:D8).');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine Zelle stehen, z. B. B4:B8.');
    throw new FErr(`Das Zeichen ${t.v} steht an der falschen Stelle.`);
  }
  const ast = expr();
  if (p < toks.length){
    const t = toks[p];
    if (isOp(t, ')')) throw new FErr('Hier steht eine Klammer ) zu viel.');
    if (isOp(t, ';')) throw new FErr('Das Semikolon ; steht außerhalb einer Funktion. Steht die Klammer ) zu früh?');
    if (isOp(t, ':')) throw new FErr('Vor dem Doppelpunkt muss eine einzelne Zelle stehen, z. B. B4:B8.');
    throw new FErr('Zwischen zwei Teilen der Formel fehlt ein Rechenzeichen.');
  }
  return noRange(ast);
}

/* ---- Bezüge einer Formel ---- */
function refsOf(n, out = []){
  if (!n) return out;
  if (n.k === 'ref') out.push({a:n.v, b:n.v});
  else if (n.k === 'range') out.push({a:n.a, b:n.b});
  else if (n.k === 'call') n.args.forEach(x => refsOf(x, out));
  else if (n.k === 'bin'){ refsOf(n.a, out); refsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') refsOf(n.a, out);
  return out;
}
const cellsOfRefs = refs => new Set(refs.flatMap(r => rangeCells(r.a, r.b)));
function fnsOf(n, out = new Set()){
  if (!n) return out;
  if (n.k === 'call'){ out.add(n.name); n.args.forEach(x => fnsOf(x, out)); }
  else if (n.k === 'bin'){ fnsOf(n.a, out); fnsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') fnsOf(n.a, out);
  return out;
}
function numsOf(n, out = []){
  if (!n) return out;
  if (n.k === 'num') out.push(n.v);
  else if (n.k === 'call') n.args.forEach(x => numsOf(x, out));
  else if (n.k === 'bin'){ numsOf(n.a, out); numsOf(n.b, out); }
  else if (n.k === 'neg' || n.k === 'par') numsOf(n.a, out);
  return out;
}
function topCall(n){ while (n && n.k === 'par') n = n.a; return n && n.k === 'call' ? n : null; }
// Bezüge in einem (evtl. unfertigen) Formeltext finden – für die Farben in der Tabelle
function refsInText(s){
  const out = []; let inStr = false, chunk = '';
  const scan = c => { const re = /(^|[^A-Za-z0-9_$ÄÖÜäöüß])(\$?[A-Za-z]{1,3}\$?\d{1,5})(?:\s*:\s*(\$?[A-Za-z]{1,3}\$?\d{1,5}))?(?![A-Za-z0-9(])/g; let m;
    while ((m = re.exec(c))){ const a = normRef(m[2]), b = m[3] ? normRef(m[3]) : a; out.push({a, b, txt:m[3] ? `${a}:${b}` : a}); re.lastIndex = m.index + m[0].length; } };
  for (const ch of normQuotes(s)){ if (ch === '"'){ if (!inStr){ scan(chunk); chunk = ''; } inStr = !inStr; continue; } if (!inStr) chunk += ch; }
  scan(chunk);
  return out;
}

/* ---- Auswertung wie in Excel ---- */
const E = v => ({t:'err', v});
function toNum(v){
  if (v.t === 'num' || v.t === 'err') return v;
  if (v.t === 'empty') return {t:'num', v:0};
  return E('#WERT!');
}
function evalAst(n, sh){
  switch (n.k){
    case 'num': return {t:'num', v:n.v};
    case 'str': return {t:'str', v:n.v};
    case 'ref': return sh.val(n.v);
    case 'par': return evalAst(n.a, sh);
    case 'neg': { const x = toNum(evalAst(n.a, sh)); return x.t === 'err' ? x : {t:'num', v:n.o === '-' ? -x.v : x.v}; }
    case 'bin': {
      const a = toNum(evalAst(n.a, sh)); if (a.t === 'err') return a;
      const b = toNum(evalAst(n.b, sh)); if (b.t === 'err') return b;
      if (n.o === '+') return {t:'num', v:a.v + b.v};
      if (n.o === '-') return {t:'num', v:a.v - b.v};
      if (n.o === '*') return {t:'num', v:a.v * b.v};
      if (n.o === '/') return b.v === 0 ? E('#DIV/0!') : {t:'num', v:a.v / b.v};
      return {t:'num', v:Math.pow(a.v, b.v)};
    }
    case 'call': return callFn(n, sh);
  }
  return E('#WERT!');
}
function callFn(n, sh){
  const vals = [];
  for (const a of n.args){
    if (a.k === 'range') rangeCells(a.a, a.b).forEach(c => vals.push({x:sh.val(c), ref:true}));
    else if (a.k === 'ref') vals.push({x:sh.val(a.v), ref:true});
    else vals.push({x:evalAst(a, sh), ref:false});
  }
  if (n.name === 'ANZAHL') return {t:'num', v:vals.filter(o => o.x.t === 'num').length};
  if (n.name === 'ANZAHL2') return {t:'num', v:vals.filter(o => o.x.t !== 'empty').length};
  const nums = [];
  for (const o of vals){
    if (o.x.t === 'err') return o.x;
    if (o.x.t === 'num') nums.push(o.x.v);
    else if (!o.ref && o.x.t === 'str') return E('#WERT!');
  }
  if (n.name === 'SUMME') return {t:'num', v:nums.reduce((s, x) => s + x, 0)};
  if (n.name === 'MITTELWERT') return nums.length ? {t:'num', v:nums.reduce((s, x) => s + x, 0) / nums.length} : E('#DIV/0!');
  if (n.name === 'MIN') return {t:'num', v:nums.length ? Math.min(...nums) : 0};
  if (n.name === 'MAX') return {t:'num', v:nums.length ? Math.max(...nums) : 0};
  return E('#NAME?');
}
const PCACHE = new Map();
function parseCached(s){ if (!PCACHE.has(s)){ try { PCACHE.set(s, parseFormula(s)); } catch (e){ PCACHE.set(s, null); } } return PCACHE.get(s); }
class Sheet {
  constructor(cells){ this.cells = cells; this.memo = {}; this.busy = new Set(); }
  with(a, raw){ return new Sheet(Object.assign({}, this.cells, {[a]:raw})); }
  isFormula(a){ const r = this.cells[a]; return typeof r === 'string' && r[0] === '='; }
  val(a){
    if (a in this.memo) return this.memo[a];
    const r = this.cells[a]; let v;
    if (r == null || r === '') v = {t:'empty'};
    else if (typeof r === 'number') v = {t:'num', v:r};
    else if (this.isFormula(a) && r.includes('#BEZUG!')) v = E('#BEZUG!');
    else if (this.isFormula(a)){
      if (this.busy.has(a)) return E('Zirkelbezug');
      this.busy.add(a);
      const ast = parseCached(r);
      v = ast ? evalAst(ast, this) : E('#NAME?');
      this.busy.delete(a);
    } else v = {t:'str', v:r};
    this.memo[a] = v; return v;
  }
}
function same(a, b){
  if (a.t !== b.t) return false;
  if (a.t === 'num') return Math.abs(a.v - b.v) < 1e-9 * Math.max(1, Math.abs(b.v));
  return a.v === b.v;
}
function fmtNum(x, dp){ if (Math.abs(x) >= 1e11) return x.toExponential(2).replace('.', ',').replace('e+', 'E+'); return (dp != null ? x.toFixed(dp) : String(+x.toFixed(2))).replace('.', ','); }
function fmtVal(v, f){
  if (v.t === 'num') return f === 'eur' ? fmtNum(v.v, 2) + ' €' : f === 'usd' ? fmtNum(v.v, 2) + ' $' : f === 'pct' ? fmtNum(v.v * 100) + ' %' : fmtNum(v.v);
  if (v.t === 'empty') return '';
  if (v.t === 'err') return v.v === 'Zirkelbezug' ? '0' : v.v;
  return v.v;
}

/* ---- Erklärung: Fortschritt je Thema (learn = {topic, prog:{id:{idx, done}}}) ---- */
const topic = () => TOPICS.find(t => t.id === learn.topic);
function prog(id){ id = id || learn.topic; return learn.prog[id] || (learn.prog[id] = {idx:0, done:[]}); }
function saveLearn(){ store('learn', JSON.stringify(learn)); }
const stepDone = i => prog().done.includes(i);
function markStep(){ const p = prog(); if (!p.done.includes(p.idx)){ p.done.push(p.idx); saveLearn(); } }
function firstOpen(){ const n = topic().steps.length; for (let i = 0; i < n; i++) if (!stepDone(i)) return i; return n - 1; }
const stepUnlocked = i => i <= firstOpen() || stepDone(i);
const curStep = () => topic().steps[prog().idx];
function gotoStep(i){ prog().idx = i; pickerOpen = false; loadStep(); window.scrollTo({top:0, behavior:'smooth'}); }
function openTopic(id){ learn.topic = id; saveLearn(); pickerOpen = false; loadStep(); window.scrollTo({top:0, behavior:'smooth'}); }
function overview(){ learn.topic = null; saveLearn(); pickerOpen = false; loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ---- Modus- und Aufgabensteuerung ---- */
function setMode(m){ if (m === mode) return; mode = m; store('mode', m); pickerOpen = false; if (m === 'endlos' && !endPick) newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function gotoTask(i){ pfadIdx = clamp(i, 0, STD.length - 1); store('idx', pfadIdx); pickerOpen = false; loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function canNext(){
  if (mode === 'lernen') return !!learn.topic && prog().idx < topic().steps.length - 1 && stepDone(prog().idx);
  return mode === 'pfad' ? (pfadIdx < STD.length - 1 && isSolved(pfadIdx)) : endCounted;
}
function nextTask(){
  if (!canNext()) return;
  if (mode === 'lernen'){ gotoStep(prog().idx + 1); return; }
  if (mode === 'pfad') gotoTask(pfadIdx + 1); else { newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
}

// Cursorposition einer Eingabe merken, auch wenn sie gerade nicht den Fokus hat
function caret(inp){
  if (document.activeElement === inp) return [inp.selectionStart, inp.selectionEnd];
  const n = inp.value.length;
  return [inp._s != null ? Math.min(inp._s, n) : n, inp._e != null ? Math.min(inp._e, n) : n];
}
function setCaret(inp, c){ inp._s = inp._e = c; if (document.activeElement === inp) inp.setSelectionRange(c, c); }
function focusInp(inp){ const [s, e] = caret(inp); inp.focus({preventScroll:true}); inp.setSelectionRange(s, e); }
// PT = {inp, anchor, cur, start, end, base}: laufende Markierung in der Tabelle
function applyPT(){
  const ref = PT.anchor === PT.cur ? PT.anchor : normRange(PT.anchor, PT.cur);
  PT.inp.value = PT.base.slice(0, PT.start) + ref + PT.base.slice(PT.end);
  setCaret(PT.inp, PT.start + ref.length);
  S.sel = new Set(rangeCells(PT.anchor, PT.cur));
  syncInput(PT.inp, true);
}

function endPT(){ if (!PT) return; const inp = PT.inp; PT = null; if (document.body.contains(inp)) focusInp(inp); }

gridEl.addEventListener('pointercancel', endPT);

const trackCaret = e => { const t = e.target; if (t.matches && t.matches('.pin')){ t._s = t.selectionStart; t._e = t.selectionEnd; } };
['keyup', 'click', 'select', 'focusout'].forEach(ev => document.addEventListener(ev, trackCaret, true));

/* ---- Aufgabe aus Szenario + Vorlage bauen ---- */
function genData(sc, r){ return sc.data.map(row => sc.cols.split('').map((c, j) => sc.g && sc.g[c] ? sc.g[c](r) : row[j])); }
function baseCells(sc, data){
  const cells = {};
  sc.head.forEach((h, i) => { cells[ad(i, sc.top)] = h; });
  sc.names.forEach((nm, i) => {
    const r = sc.top + 1 + i; cells['A' + r] = nm;
    sc.cols.split('').forEach((c, j) => { const v = data[i][j]; if (v != null) cells[c + r] = v; });
  });
  return cells;
}
const isSimpleTpl = t => t.k !== 'x' || !!(t.lv && t.lv.includes(1));
function tplLevels(t){ return t.lv || (t.k === 'x' ? [5] : [1, 2, 3, 4]); }
function buildCells(sc, t, p, data){
  const cells = baseCells(sc, data), fmt = {}, first = sc.top + 1, last = sc.top + sc.names.length;
  let o;
  if (t.k === 'col'){ const R = last + 2; cells['A' + R] = t.lab; o = {target:(t.outCol || p.c) + R, rng:`${p.c}${first}:${p.c}${last}`}; }
  else if (t.k === 'row'){ cells[t.out + sc.top] = t.hdr; o = {target:t.out + p.r, rng:`${t.rng[0]}${p.r}:${t.rng[1]}${p.r}`}; }
  else if (t.k === 'block'){ const R = last + 2; cells['A' + R] = t.lab; o = {target:(t.outCol || 'B') + R, rng:`${t.rng[0]}${first}:${t.rng[1]}${last}`}; }
  else o = t.make({cells, fmt, first, last, top:sc.top, p, c:p.c});
  if (!o.fn && t.fn) o.fn = typeof t.fn === 'function' ? t.fn(p.c) : t.fn;
  if (!o.ref) o.ref = `=${o.fn}(${o.rng})`;
  if (!o.q && t.q) o.q = typeof t.q === 'function' ? t.q(p) : t.q[p.c];
  o.cells = cells; o.fmt = fmt;
  return o;
}
/* Szenario mit leer:true: In den Prüfvarianten fehlen 1–3 ganze Zeilen (Name und Werte), damit sich auch die Länge
   der Liste ändert und eine abgeschriebene Anzahl (z. B. =8-ANZAHL(…)) auffällt. Angezeigt wird die volle Liste. */
function leereZeilen(cells, sc, p, r){
  const rows = shuffle(sc.names.map((_, i) => sc.top + 1 + i).filter(x => x !== p.r), r).slice(0, 1 + Math.floor(r() * 3));
  rows.forEach(x => { delete cells['A' + x]; sc.cols.split('').forEach(c => { delete cells[c + x]; }); });
}
const VERB = ['Berechne', 'Ermittle', 'Bestimme'];
function makeTask(scId, tid, p0, lv, seed, named){
  const sc = SC[scId], t = sc.T.find(x => x.id === tid);
  const r = rng(seed == null ? 4242 : seed);
  const p = Object.assign({}, p0 || {});
  if (t.cols && !p.c) p.c = pick1(r, t.cols.split(''));
  if ((t.k === 'row' || t.rows) && !p.r) p.r = sc.top + 1 + Math.floor(r() * sc.names.length);
  if (p.c) p.h = (sc.noun && sc.noun[p.c]) || sc.head[colN(p.c)];
  if (p.r) p.n = sc.names[p.r - sc.top - 1];
  const o = buildCells(sc, t, p, seed == null ? sc.data : genData(sc, r));
  const variants = [];
  for (let i = 0; i < 8; i++){
    const vr = rng((seed == null ? 99 : seed) * 31 + i * 977 + 1), v = buildCells(sc, t, p, genData(sc, vr)).cells;
    if (sc.leer) leereZeilen(v, sc, p, vr);
    variants.push(v);
  }
  const verb = VERB[(seed == null ? colN(o.target.match(/[A-Z]+/)[0]) + +o.target.match(/\d+/)[0] : Math.floor(r() * 3)) % 3];
  // Aufgaben mit Rechenzeichen gehen erst ab Stufe 3 (Bausteine)
  const simple = !!(o.fn && o.rng && o.ref === `=${o.fn}(${o.rng})`);
  const eff = !simple && lv < 3 ? 3 : lv;
  let text;
  if (!simple) text = o.text;
  else if (eff === 1) text = `In ${B(o.target)} soll mit ${C(o.fn)} berechnet werden, ${o.q}. Markiere dazu den passenden Bereich.`;
  else if (eff === 2) text = `In ${B(o.target)} soll stehen, ${o.q}. Ziehe die passende Funktion in die Formel und markiere den Bereich.`;
  else if (named) text = `${verb} in ${B(o.target)} mit der Funktion ${C(o.fn)}, ${o.q}.`;
  else text = `${verb} in ${B(o.target)}, ${o.q}.`;
  if (t.hint && !named && eff >= 2) text += `<br><span class="intro">${t.hint}</span>`;
  const ops = [...new Set((o.ref.slice(1).replace(/"[^"]*"/g, '').match(/[+\-*/]/g) || []))];
  return {scId, tid, p, lv:eff, wanted:lv, simple, named:!!named, sc, t, title:sc.title, intro:sc.intro, cells:o.cells, fmt:Object.assign({}, o.fmt), colFmt:sc.fmt || {},
    target:o.target, ref:o.ref, fn:o.fn, rng:o.rng, text, need:named && simple && eff >= 3 ? [o.fn] : [], noFn:!!(o.noFn || t.noFn), variants, ops,
    goal:t.goal, after:t.after ? t.after(p) : ''};
}

/* ---------- Prüfen ---------- */
function composed(){

function cellList(list){
  if (!list.length) return '';

function diagnose(ast, refAst, T, book){

      else if (a.name === 'ANZAHL2' && b.name === 'ANZAHL') out.push('ANZAHL2 zählt auch Zellen mit Text mit (z. B. „krank“ oder „fehlt“). Gezählt werden sollen hier nur die Zahlen.');
      else out.push(`${C(a.name)} ${FDESC[a.name]}. Gesucht ist aber ${T.goal || GOAL[b.name]}.`);
    }
    const two = a.args.length === 2 && a.args.every(x => x.k === 'ref') && b.args.length === 1 && b.args[0].k === 'range';
    if (two && new Set([a.args[0].v, a.args[1].v, b.args[0].a, b.args[0].b]).size === 2)
      out.push(`${C(a.args[0].v + ';' + a.args[1].v)} sind nur die zwei Zellen ${a.args[0].v} und ${a.args[1].v}. Für alle Zellen dazwischen schreibst du einen Doppelpunkt: ${C(a.args[0].v + ':' + a.args[1].v)}.`);
    else if (a.name === b.name || ['ANZAHL', 'ANZAHL2'].includes(a.name) && ['ANZAHL', 'ANZAHL2'].includes(b.name)){
      const mine = cellsOfRefs(refsOf(a)), want = cellsOfRefs(refsOf(b));

      const more = moreAll.some(c => book.val(c).t !== 'empty') ? moreAll : [];

}
function judge(src, T){
  let ast;
  try { ast = parseFormula(src); } catch (e){ if (!(e instanceof FErr)) throw e; return {err:esc(e.message)}; }
  const refs = refsOf(ast), cells = cellsOfRefs(refs), refAst = parseFormula(T.ref);
  const myFns = fnsOf(ast), refFns = fnsOf(refAst), f = c => fmtVal(c, fmtOf(T, T.target));
  if (cells.has(T.target)) return {err:`Deine Formel steht in ${T.target} und verwendet ${T.target} selbst. Das nennt Excel einen <b>Zirkelbezug</b>. Nimm ${T.target} aus dem Bereich heraus.`};
  for (const fn of T.need) if (!myFns.has(fn)) return {err:`Verwende hier die Funktion ${C(fn)}.`, task:true};
  if (T.noFn && myFns.size) return {err:'Hier sollst du ohne Funktion rechnen – nur mit den Zellen und einem Rechenzeichen.', task:true};
  const book = new Sheet(T.cells), got = book.with(T.target, src).val(T.target), exp = book.with(T.target, T.ref).val(T.target);
  if (!refs.length) return {err:`Deine Formel ergibt ${C(esc(f(got)))}, enthält aber keinen einzigen Zellbezug. Schreibe keine Zahlen ab, sondern verwende Zellen bzw. Bereiche wie B4:B8. Dann rechnet Excel automatisch neu, wenn sich eine Zahl ändert.`};
  if (refFns.size && !myFns.size && !T.noFn)
    return {err:(same(got, exp) ? 'Das Ergebnis stimmt – aber ' : `Deine Formel ergibt ${C(esc(f(got)))}. Außerdem: `) + 'Verwende eine Funktion, statt alle Zellen einzeln zu verrechnen.', task:same(got, exp)};
  if (!same(got, exp)){
    let h = `Deine Formel ergibt ${C(esc(f(got)))} – das ist noch nicht das gesuchte Ergebnis.`;
    if (got.t === 'err' && got.v === '#WERT!') h += '<br>#WERT! bedeutet: Es wird mit einer Zelle gerechnet, in der Text steht.';
    if (got.t === 'err' && got.v === '#DIV/0!') h += '<br>#DIV/0! bedeutet: Es wird durch 0 geteilt – oder im Bereich steht gar keine Zahl.';
    const d = diagnose(ast, refAst, T, book);
    return {err:h + d.map(x => '<br>' + x).join('')};
  }
  for (const v of T.variants){
    const sh = new Sheet(v);
    if (!same(sh.with(T.target, src).val(T.target), sh.with(T.target, T.ref).val(T.target))){
      const d = diagnose(ast, refAst, T, book);
      return {err:'Deine Formel liefert hier zufällig das richtige Ergebnis – aber nicht mehr, wenn sich die Einträge in der Tabelle ändern.' + d.map(x => '<br>' + x).join('')};
    }
  }
  const notes = [], a = topCall(ast), b = topCall(refAst);
  if (a && b && a.name === b.name){
    const want = cellsOfRefs(refsOf(b)), extra = [...cellsOfRefs(refsOf(a))].filter(c => !want.has(c));
    if (extra.length) notes.push(`Dein Bereich enthält auch ${cellList(extra)}. Das klappt hier nur, weil dort keine Zahl steht. Genauer wäre ${C(b.args.map(x => x.k === 'range' ? x.a + ':' + x.b : fmtNode(x)).join(';'))}.`);
  }
  return {ok:true, ast, val:got, notes};
}
function fmtNode(n){ return n.k === 'ref' ? n.v : n.k === 'num' ? fmtNum(n.v) : '…'; }
function colorFormula(src){
  let i = 0;
  return esc(src).replace(/(^|[^A-Za-z0-9_$ÄÖÜäöüß])(\$?[A-Za-z]{1,3}\$?\d{1,5}(?:\s*:\s*\$?[A-Za-z]{1,3}\$?\d{1,5})?)(?![A-Za-z0-9(])/g,
    (m, pre, ref) => `${pre}<span class="c${(i++) % 6}">${ref}</span>`);
}
const normF = s => normQuotes(s).replace(/[\s$]/g, '').toUpperCase();

function check(){
  if (!CUR){ if (LS) checkChoice(); return; }
  const cur = composed();
  if (cur.missing){ S.fb = {type:'err', html:esc(cur.missing)}; S.success = false; renderFeedback(); return; }
  const res = judge(cur.src, CUR);
  if (!res.ok){
    let html = res.err;
    if (CUR.lv === 5 && !res.task){
      let ok = true; try { parseFormula(cur.src); } catch (e){ ok = false; }
      html = ok ? 'Die Formel ist gültig, liefert aber nicht das gesuchte Ergebnis.' : 'Die Formel enthält einen Fehler.';
    }
    S.success = false; S.fb = {type:'err', html}; renderFeedback(); renderGrid(); return;
  }
  S.success = true; S.result = res.val; S.src = cur.src;
  let erstmals;
  if (mode === 'lernen'){ erstmals = !stepDone(prog().idx); markStep(); }
  else erstmals = countSolved();
  logSolved(erstmals);
  const fm = fmtOf(CUR, CUR.target);
  let h = `<b>Richtig! 🎉</b> In ${B(CUR.target)} steht jetzt ${C(esc(fmtVal(res.val, fm)))}.<br><span class="fcol">${colorFormula(cur.src)}</span>`;
  if (CUR.lv >= 3 && normF(cur.src) !== normF(CUR.ref)) h += `<span class="note">Deine Formel ist gleichwertig zur Musterlösung ${C(esc(CUR.ref))}.</span>`;
  res.notes.forEach(n => { h += `<span class="note">${n}</span>`; });
  if (CUR.after) h += `<span class="note">${CUR.after}</span>`;
  const st = mode === 'lernen' ? curStep() : null;
  if (st && st.after) h += `<span class="note">${st.after}</span>`;
  if (canNext()) h += `<span class="note">Weiter geht es mit „${mode === 'lernen' ? 'Weiter' : 'Nächste Aufgabe'}“.</span>`;
  S.fb = {type:'ok', html:h};
  renderGrid(); renderFeedback(); renderNav();
}

function clearMarks(){
  if (!S.success && !S.fb) return;
  S.success = false; S.fb = null; S.result = null;
  renderFeedback();
}

/* ---------- Autovervollständigung (basis.js): Funktionen dieser Seite ---------- */
const AC_FN = [
  {n:'ANZAHL',     v:'Wert',  d:'Zählt, wie viele Zellen in einem Bereich Zahlen enthalten.'},
  {n:'ANZAHL2',    v:'Wert',  d:'Zählt, wie viele Zellen in einem Bereich nicht leer sind (Zahlen und Text).'},
  {n:'MAX',        v:'Zahl',  d:'Gibt den größten Wert aus einer Reihe von Werten zurück.'},
  {n:'MIN',        v:'Zahl',  d:'Gibt den kleinsten Wert aus einer Reihe von Werten zurück.'},
  {n:'MITTELWERT', v:'Zahl',  d:'Berechnet den Durchschnitt (das arithmetische Mittel) der Argumente.'},
  {n:'SUMME',      v:'Zahl',  d:'Addiert alle Zahlen.'}
];
AC.word = before => { const m = before.match(/[A-Za-zÄÖÜäöüß]+\d*$/); return m && (before.trimStart().startsWith('=') && !/\d$/.test(m[0]) || /^ANZAHL2$/i.test(m[0])) ? m[0] : null; };

/* ---------- Ereignisse ---------- */
document.addEventListener('change', e => {
  if (e.target.id === 'fnsel'){ S.fnsel = e.target.value; clearMarks(); renderGrid(); }
});
document.addEventListener('click', e => {
  if (e.target.closest('#mkBtn')){ openMaker(); return; }
  if (e.target.closest('#mkOk')){ makeBlock(); return; }
  if (e.target.closest('#mkX')){ S.mkOpen = false; S.sel = null; renderPools(); renderGrid(); return; }
  const dl = e.target.closest('[data-del]'); if (dl){ S.made.splice(+dl.dataset.del, 1); renderPools(); return; }
  topicClick(e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.pin')){ e.preventDefault(); if (e.target.id === 'mk') makeBlock(); else check(); }
  if (e.key === 'Escape' && e.target.id === 'mk'){ S.mkOpen = false; renderPools(); }
});
if (mode === 'endlos') newEndless();
loadTask();
</script>
