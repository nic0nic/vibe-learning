<!--
  Die Funktion NICHT in Excel, Aufhänger: Eine WENN-Formel mit UND lässt sich „von der anderen Seite“ mit ODER schreiben
  (UND ↔ ODER, jede Bedingung ins Gegenteil, Dann_Wert und Sonst_Wert tauschen).
  Modus Erarbeitung: Erklärungen, Aufgaben und Übung mit lib/aufgaben.js (Aufgaben.sequenz), am Ende ein Blitz-Training
    (Aufgaben.training): UND oder ODER in der gleichwertigen Formel wählen, Stufen „Umdrehen“ und „Mit NICHT“,
    Schalter „Auf Zeit“ (eigene Bestleistung über training.variante).
  Modus Endlos: Formel umdrehen bzw. ohne NICHT schreiben, 9 Stufen wie bei UND/ODER (wennbau.js: Bausteine → Freitext),
    Sachaufgaben aus uo-szenarien.js. Geprüft wird, ob die Formel immer dasselbe liefert, dazu umgedreht (andere
    Verknüpfung) bzw. ohne NICHT (CUR.muss).
  Gespeichert: nicht-stand = {schritt, erledigt}, nicht-blitz-training = {stufe, best}, nicht-zeit = '1' (Schalter an),
    nicht-mode, nicht-level, nicht-best (basis.js).
-->

      nav.classList.remove('pf-eng', 'pf-knapp');
      if (EINZELN || !voll()) return;
      nav.classList.add('pf-knapp');
      if (voll()) nav.classList.add('pf-eng');
    };
    platz();
    addEventListener('resize', platz);
    new MutationObserver(platz).observe(nav.querySelector('.pf-right'), {childList: true, subtree: true, characterData: true});
    if (document.fonts) document.fonts.ready.then(platz);
    const schmal = () => matchMedia('(max-width:760px)').matches || nav.classList.contains('pf-eng');

    const burger = nav.querySelector('.pf-burger');
    if (burger) burger.addEventListener('click', () => nav.classList.toggle('open'));
    const gb = nav.querySelector('#pfGross');
    if (gb){ grossKnopf(gb); gb.addEventListener('click', () => gross(!imGross())); }
    const vb = nav.querySelector('#pfVoll');
    if (vb){
      vollKnopf(vb);
      vb.addEventListener('click', vollUmschalten);
      new Set([document, VOLL.ownerDocument]).forEach(d => ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => d.addEventListener(ev, () => vollKnopf(vb))));
    }
    const tb = nav.querySelector('#pfTheme');
    if (tb) tb.addEventListener('click', () => {
      const t = theme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = t; tb.textContent = t === 'dark' ? SONNE : MOND;
      try { localStorage.setItem('wenn-theme', t); } catch (e) {}
    });

    // Geräte ohne Maus: erstes Antippen klappt auf, zweites öffnet die Bereichsseite
    const items = [...nav.querySelectorAll('.pf-item')];
    if (matchMedia('(hover: none)').matches) items.forEach(li => li.firstElementChild.addEventListener('click', e => {
      if (schmal() || li.classList.contains('open')) return;
      e.preventDefault();
      items.forEach(x => x.classList.toggle('open', x === li));
    }));
    // Untermenüs (gruppe): nach links aufklappen, wenn rechts kein Platz ist; ohne Maus erst antippen
    nav.querySelectorAll('.pf-sub').forEach(sub => {
      sub.addEventListener('mouseenter', () => {
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
      });
      if (matchMedia('(hover: none)').matches) sub.firstElementChild.addEventListener('click', e => {
        if (schmal() || sub.classList.contains('open')) return;
        e.preventDefault();
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
        sub.classList.add('open');
      });
    });
    document.addEventListener('click', e => { if (!nav.contains(e.target)){ nav.querySelectorAll('.pf-sub.open').forEach(x => x.classList.remove('open')); items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
  }

  /* ---------- Übersichtsseiten ---------- */
  // Tools mit gruppe (katalog.js) stehen unter einer gemeinsamen Zwischenüberschrift
  function kacheln(b){
    if (!b.tools.length) return '<p class="pf-hinweis">Hier entstehen bald Übungen.</p>';
    const kachel = t => `<a class="pf-tile${t.bedingt ? ' pf-bedingt' : ''}"${t.bedingt ? ` data-tool="${esc(t.id)}"` : ''} href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`;
    return gruppen(b).map(g => (g.name ? `<h3 class="pf-gruppe">${esc(g.name)}</h3>` : '') + `<div class="pf-grid">${g.tools.map(kachel).join('')}</div>`).join('');
  }
  function buildPages(){
    const start = document.getElementById('pf-start');
    if (start){
      const gruppenseite = !!root.dataset.gruppe;
      if (gruppenseite) document.title = GRUPPE.titel + ' – ' + K.name;
      start.innerHTML = `<h1>${esc(gruppenseite ? GRUPPE.titel : K.name)}</h1><p class="pf-lead">${esc(GRUPPE.text)}${gruppenseite ? '' : ' ' + esc(K.untertitel)}</p>`
        + GRUPPE.bereiche.map(b => `<section class="pf-sec"><h2><a href="${bereichUrl(b)}">${esc(b.titel)}</a></h2><p class="pf-text">${esc(b.text)}</p>${kacheln(b)}</section>`).join('');
    }
    // Fach mit Jahrgangsstufen: Auswahl der Stufe
    const fach = document.getElementById('pf-fach');
    if (fach && FACHSEITE){
      document.title = FACHSEITE.titel + ' – ' + K.name;
      fach.innerHTML = `<h1>${esc(FACHSEITE.titel)}</h1><p class="pf-lead">${esc(FACHSEITE.text)} Wähle die Jahrgangsstufe.</p><div class="pf-grid">`
        + K.gruppen.filter(g => g.fach === FACHSEITE).map(g => `<a class="pf-tile" href="${gruppeUrl(g)}"><b>${esc(g.stufe.titel)}</b><span>${esc(g.text)}</span></a>`).join('') + '</div>'
        + (fachTools(FACHSEITE).length ? `<section class="pf-sec pf-fachtools"><h2>Für alle Jahrgangsstufen</h2><div class="pf-grid">${fachTools(FACHSEITE).map(([b, t]) => `<a class="pf-tile" href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`).join('')}</div></section>` : '');
    }
    const be = document.getElementById('pf-bereich');
    const b = BER;
    if (be && b){
      document.title = b.titel + ' – ' + K.name;
      be.innerHTML = `<h1>${esc(b.titel)}</h1><p class="pf-lead">${esc(b.text)}</p>${kacheln(b)}`;
    }
  }

  // Hell/Dunkel höchstens einmal pro Sekunde umschalten und weich überblenden – kein Flackern beim schnellen Klicken
  let themeSperre = 0;
  document.addEventListener('click', e => {
    const btn = e.target.closest('#themeBtn,#pfTheme');
    if (!btn) return;
    if (Date.now() < themeSperre){ e.stopImmediatePropagation(); e.preventDefault(); return; }
    themeSperre = Date.now() + 1000;
    root.classList.add('pf-fade'); btn.classList.add('pf-gesperrt');
    setTimeout(() => root.classList.remove('pf-fade'), 400);
    setTimeout(() => btn.classList.remove('pf-gesperrt'), 1000);
  }, true);

  function init(){ buildNav(); buildPages(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

<script>/* ../../sync.js */
/* vibe learning – Anmeldung und Anbindung an PocketBase
 *
 * Läuft die Seite über den PocketBase-Server, erscheint beim ersten Öffnen ein
 * Anmeldefenster: ein Feld für Code oder Benutzername (bei Benutzernamen folgt das
 * Passwort), alternativ „Seite ohne Anmeldung nutzen“. Oben rechts in der Leiste
 * steht danach, wer angemeldet ist; dort meldet man sich auch an und ab.
 *
 * Schüler: Fortschritt wird auf dem Server gespeichert, jede gelöste Aufgabe protokolliert.
 * Lehrkraft/Admin: Anmeldung gilt bis zum Schließen des Browsers, im Menü steht
 * der Link zur Verwaltung (lehrer.html).
 * Wird die HTML-Datei direkt geöffnet (oder läuft kein PocketBase dahinter),
 * passiert nichts davon – die Seite speichert dann wie bisher nur im Browser.
 *
 * Bedingte Menüpunkte (katalog.js: bedingt) blendet das Skript nach der Anmeldung ein,
 * wenn der Server sie für diesen Schüler freigibt (/api/trainer/sichtbar).
 *
 * Die Seite ruft auf:
 *   TrainerSync.changed()      nach jeder Änderung am gespeicherten Stand
 *   TrainerSync.event({...})   wenn eine Aufgabe richtig gelöst wurde
 */
(function () {
  'use strict';

  const CONFIG = {
    api: '/api/trainer',
    verwaltung: 'lehrer.html'   // relativ zum Ordner von sync.js
  };

  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const PAGE = document.documentElement.dataset.trainer || '';          // Tool-id aus katalog.js, leer auf Übersichtsseiten
  const TOOL_IDS = window.KATALOG ? [].concat(...window.KATALOG.bereiche.map(b => b.tools.map(t => t.id))) : [];
  const ALL_PREFIXES = [...new Set(['wenn', 'uo', 'fn', PAGE].concat(TOOL_IDS))].filter(Boolean).map(id => id + '-');
  const OWN = PAGE + '-';
  const SKIP = ['wenn-theme'];                                             // Hell/Dunkel bleibt pro Gerät
  const K = {code: 'ts-code', anzeige: 'ts-anzeige', klasse: 'ts-klasse', queue: 'ts-queue', stand: 'ts-stand-' + PAGE};
  const SS = {gast: 'ts-gast', lehrer: 'ts-lehrer'};                      // gilt nur bis zum Schließen des Browsers

  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} },
    keys(){ try { return Object.keys(localStorage); } catch (e) { return []; } }
  };
  const ss = {
    get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  function lehrerSitzung(){ try { return JSON.parse(ss.get(SS.lehrer) || 'null'); } catch (e) { return null; } }

  const hosted = /^https?:$/.test(location.protocol);
  let aktiv = false, pushTimer = null, pushPending = false, menuEl = null, lastSnap = '';

  /* ---------- Hilfen ---------- */
  function api(path, opt){
    opt = opt || {};
    return fetch(CONFIG.api + path, {
      method: opt.method || 'GET',
      keepalive: !!opt.keepalive,
      headers: {'Content-Type': 'application/json', 'X-Trainer-Code': ls.get(K.code) || ''},
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    });
  }
  const trainerKeys = prefix => ls.keys().filter(k => k.startsWith(prefix) && !SKIP.includes(k));
  function snapshot(prefix){ prefix = prefix || OWN; const d = {}; trainerKeys(prefix).sort().forEach(k => { d[k] = ls.get(k); }); return d; }
  function applySnapshot(d, prefix){
    prefix = prefix || OWN;
    trainerKeys(prefix).forEach(k => ls.del(k));
    Object.keys(d || {}).forEach(k => { if (k.startsWith(prefix) && !SKIP.includes(k) && typeof d[k] === 'string') ls.set(k, d[k]); });
  }
  function wipeLocal(){
    ALL_PREFIXES.forEach(p => trainerKeys(p).forEach(k => ls.del(k)));
    ls.keys().filter(k => k.startsWith('ts-stand-')).forEach(k => ls.del(k));
    [K.queue, K.code, K.klasse, K.anzeige].forEach(k => ls.del(k));
  }
  function reloadOnce(){
    let last = 0; try { last = +sessionStorage.getItem('ts-reload') || 0; } catch (e) {}
    if (Date.now() - last < 8000) return;
    try { sessionStorage.setItem('ts-reload', Date.now()); } catch (e) {}
    location.reload();
  }

  /* ---------- Fortschritt abgleichen ---------- */
  async function pull(){
    if (!PAGE){ setStatus('ok'); return; }
    const r = await api('/state?seite=' + PAGE);
    const local = +ls.get(K.stand) || 0, server = +r.stand || 0;
    if (r.daten && server > local){
      const before = JSON.stringify(snapshot());
      applySnapshot(r.daten);
      ls.set(K.stand, server);
      lastSnap = JSON.stringify(snapshot());
      if (lastSnap !== before) reloadOnce();
    } else if (local > server) await push();
    setStatus('ok');
  }

  async function push(keepalive){
    clearTimeout(pushTimer); pushPending = false;
    if (!aktiv || !PAGE) return;
    const stand = +ls.get(K.stand) || Date.now();
    setStatus('saving');
    try {
      await api('/state', {method: 'POST', body: {seite: PAGE, daten: snapshot(), stand}, keepalive});
      setStatus('ok');
    } catch (err){
      if (err.status === 409){ await pull().catch(() => setStatus('offline')); }
      else if (err.status === 401) abgelaufen();
      else { pushPending = true; setStatus('offline'); }
    }
  }

  function changed(){
    if (!PAGE) return;
    // Seiten schreiben ihren Stand auch beim Öffnen neu – nur echte Änderungen zählen,
    // sonst würde ein frisch geöffnetes Gerät einen neueren Stand vom Server überschreiben.
    const snap = JSON.stringify(snapshot());
    if (snap === lastSnap) return;
    lastSnap = snap;
    ls.set(K.stand, Date.now());
    if (!aktiv) return;
    pushPending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }

  /* ---------- Protokoll gelöster Aufgaben ---------- */
  function queue(){ try { return JSON.parse(ls.get(K.queue) || '[]'); } catch (e) { return []; } }
  function event(ev){
    if (!aktiv || !PAGE) return;
    const q = queue(); q.push(Object.assign({seite: PAGE}, ev)); ls.set(K.queue, JSON.stringify(q.slice(-500)));
    flush();
  }
  let flushing = false;
  async function flush(keepalive){
    if (!aktiv || flushing) return;
    const q = queue(); if (!q.length) return;
    flushing = true;
    try {
      await api('/events', {method: 'POST', body: {events: q.slice(0, 200)}, keepalive});
      ls.set(K.queue, JSON.stringify(queue().slice(Math.min(q.length, 200))));
    } catch (err){
      if (err.status === 401) abgelaufen(); else setStatus('offline');
    } finally { flushing = false; }
    if (queue().length && !keepalive) setTimeout(flush, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && aktiv){ if (pushPending) push(true); flush(true); }
  });
  window.addEventListener('online', () => { if (aktiv){ flush(); if (pushPending) push(); else pull().catch(() => {}); } });


  /* ---------- Gast-Fortschritt beim Anmelden übernehmen ---------- */
  // Für jede Übung: Ist das Konto dort noch leer, wird der Stand dieses Geräts hochgeladen,
  // sonst gilt der Stand vom Server.
  async function uebernehmen(){
    for (const p of ALL_PREFIXES){
      const id = p.slice(0, -1), lokal = snapshot(p);
      const st = await api('/state?seite=' + id);
      const leer = !st.daten || !Object.keys(st.daten).length;
      if (leer){
        if (!Object.keys(lokal).length) continue;
        const stand = Date.now();
        await api('/state', {method: 'POST', body: {seite: id, daten: lokal, stand}});
        ls.set('ts-stand-' + id, stand);
      } else {
        applySnapshot(st.daten, p);
        ls.set('ts-stand-' + id, +st.stand || 0);
      }
    }
  }

  /* ---------- Oberfläche: Anmeldefenster + Menü oben rechts ---------- */
  const CSS = `

.ts-x:hover{background:var(--panel2,#eceff4);color:var(--text,#2e3440)}

@media (max-width:760px){.ts-dwm{position:static;box-shadow:none;border:0;border-left:2px solid var(--border,#cdd3de);border-radius:0;margin:4px 0 0 8px;padding:2px 0 2px 6px;min-width:0}.ts-dwm .ts-dwm{margin-left:12px}}

@media (max-width:640px){.ts-badge .ts-lang{display:none}}`;

  function injectCss(){ const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); }
  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function setStatus(st){
    const b = menuEl && menuEl.querySelector('.ts-badge');
    if (!b || !aktiv) return;
    b.className = 'ts-badge ' + st;
    const t = {ok: 'Fortschritt gespeichert', saving: 'Wird gespeichert …', offline: 'Keine Verbindung – wird später gespeichert'}[st] || '';
    b.title = t;
    const i = menuEl.querySelector('.ts-status'); if (i) i.textContent = t;
  }

  // Einstellung „Design“ (lib/designs.js, nur für Angemeldete, gilt auf diesem Gerät; nav.js schaltet es ein)
  // Untermenü mit allen Designs; Varianten mit gruppe (z. B. Titelkarte) als weiteres Untermenü mit Farbfeldern
  const DESIGN_HTML = `<div class="ts-einst"><button class="ts-dw" type="button" aria-haspopup="menu" aria-expanded="false">Design <span class="ts-akt">Standard</span><span class="ts-pfeil">›</span></button>
    <ul class="ts-dwm" role="menu" aria-label="Design"></ul>
    <small>Experimentell – nicht alle Übungen sind dafür gebaut. Gilt auf diesem Gerät.</small></div>`;
  const designZu = () => { if (!menuEl) return; menuEl.querySelectorAll('.ts-dwm.auf').forEach(u => u.classList.remove('auf'));
    menuEl.querySelectorAll('.ts-dw,.ts-gruppe').forEach(b => { b.setAttribute('aria-expanded', 'false'); b.classList.remove('offen'); }); };
  function designWahl(){
    const knopf = menuEl && menuEl.querySelector('.ts-dw'); if (!knopf) return;
    const menue = menuEl.querySelector('.ts-einst > .ts-dwm');
    const farbe = d => d.farbe ? `<span class="ts-farbe" style="background:${escH(d.farbe)}"></span>` : '';
    let akt = 'standard'; try { akt = localStorage.getItem('pf-design') || 'standard'; } catch (e) {}
    const fuellen = () => {
      if (!window.Designs) return;
      const L = Designs.liste(), d = L.find(x => x.id === akt) || L[0];
      knopf.querySelector('.ts-akt').innerHTML = farbe(d) + escH(d.name);
      const punkt = (x, text) => `<li role="none"><button type="button" role="menuitemradio" aria-checked="${x.id === akt}" data-design="${escH(x.id)}" title="${escH(x.beschreibung)}">${farbe(x)}${escH(text)}</button></li>`;
      const gesehen = new Set();
      menue.innerHTML = L.map(x => {
        if (!x.gruppe) return punkt(x, x.name);
        if (gesehen.has(x.gruppe)) return ''; gesehen.add(x.gruppe);
        const teile = L.filter(y => y.gruppe === x.gruppe);
        return `<li role="none"><button type="button" class="ts-gruppe" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-checked="${teile.some(y => y.id === akt)}">${escH(x.gruppe)}<span class="ts-pfeil">›</span></button>`
          + `<ul class="ts-dwm" role="menu" aria-label="${escH(x.gruppe)}">${teile.map(y => punkt(y, y.kurz)).join('')}</ul></li>`;
      }).join('');
    };
    if (window.Designs) fuellen();
    else { const s = document.createElement('script'); s.src = BASE + 'lib/designs.js'; s.onload = fuellen; document.head.appendChild(s); }
    const schmal = () => matchMedia('(max-width:760px)').matches, hover = () => matchMedia('(hover: hover)').matches && !schmal();
    const gruppe = (g, auf) => {
      menue.querySelectorAll('.ts-gruppe').forEach(x => { const an = x === g && auf; x.classList.toggle('offen', an); x.setAttribute('aria-expanded', String(an)); x.nextElementSibling.classList.toggle('auf', an); });
    };
    const oeffne = auf => { menue.classList.toggle('auf', auf); knopf.setAttribute('aria-expanded', String(auf)); if (!auf) gruppe(null, false); };
    knopf.addEventListener('click', e => { e.stopPropagation(); oeffne(!menue.classList.contains('auf')); });
    knopf.addEventListener('mouseenter', () => { if (hover()) oeffne(true); });
    menuEl.querySelector('.ts-einst').addEventListener('mouseleave', () => { if (hover()) oeffne(false); });
    menue.addEventListener('mouseover', e => {
      if (!hover()) return;
      const b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('ts-gruppe')) gruppe(b, true);
      else if (b.closest('.ts-dwm') === menue) gruppe(null, false);
    });
    menue.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('ts-gruppe')) { gruppe(b, schmal() ? !b.classList.contains('offen') : true); return; }
      const id = b.dataset.design;
      try { if (id === 'standard') localStorage.removeItem('pf-design'); else localStorage.setItem('pf-design', id); } catch (e) {}
      location.reload();
    });
    menuEl.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !menue.classList.contains('auf')) return;
      e.stopPropagation(); oeffne(false); knopf.focus();
    });
  }
  // Menü oben rechts: angemeldet (Dropdown mit Abmelden) oder Gast (Klick öffnet die Anmeldung)
  function showMenu(){
    if (menuEl) menuEl.remove();
    const host = document.querySelector('.pf-right') || document.querySelector('.hdr-right') || document.querySelector('header') || document.body;
    const L = lehrerSitzung();
    menuEl = document.createElement('div');
    menuEl.className = 'ts-wrap';
    if (aktiv){
      const klasse = ls.get(K.klasse);
      menuEl.innerHTML = `<button class="ts-badge saving" type="button"><span class="ts-dot"></span>👤 <span class="ts-lang">${escH(ls.get(K.anzeige) || ls.get(K.code))}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(ls.get(K.anzeige) || ls.get(K.code))}</b>${klasse ? ' (Klasse ' + escH(klasse) + ')' : ''}<br><span class="ts-status"></span></div>
        ${DESIGN_HTML}<button type="button" data-a="ab">Abmelden</button></div>`;
    } else if (L){
      menuEl.innerHTML = `<button class="ts-badge" type="button">👤 <span class="ts-lang">${escH(L.name)}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(L.name)}</b> (${L.rolle === 'admin' ? 'Admin' : 'Lehrkraft'})</div>
        <a href="${BASE + CONFIG.verwaltung}">Verwaltung: Klassen und Auswertung</a>
        ${DESIGN_HTML}<button type="button" data-a="ab">Abmelden</button></div>`;
    } else {
      menuEl.innerHTML = `<button class="ts-badge gast" type="button" title="Fortschritt wird nicht gespeichert. Klicken zum Anmelden."><span class="ts-dot"></span>Nicht angemeldet<span class="ts-lang">&nbsp;– Fortschritt wird nicht gespeichert</span></button>`;
    }
    host.insertBefore(menuEl, host.firstChild);
    menuEl.querySelector('.ts-badge').addEventListener('click', () => {
      if (!aktiv && !L){ showLogin(); return; }
      menuEl.classList.toggle('open');
      if (!menuEl.classList.contains('open')) designZu();
    });
    const ab = menuEl.querySelector('[data-a="ab"]');
    if (ab) ab.addEventListener('click', abmelden);
    designWahl();
    document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) { menuEl.classList.remove('open'); designZu(); } });
  }

  function showLogin(msg){
    if (document.querySelector('.ts-ov')) return;
    const ov = document.createElement('div');
    ov.className = 'ts-ov';
    ov.innerHTML = `<div class="ts-box" role="dialog" aria-modal="true" aria-label="Anmelden">
      <button class="ts-x" type="button" aria-label="Schließen und ohne Anmeldung nutzen" title="Ohne Anmeldung nutzen">×</button>
      <form class="ts-f1" autocomplete="off">
        <h2>Anmelden</h2>
        <p>Gib deinen Zugangscode oder deinen Benutzernamen ein.</p>
        <input class="ts-in" name="kennung" placeholder="Code oder Benutzername" autocapitalize="none" spellcheck="false" aria-label="Code oder Benutzername">
        <button class="ts-btn" type="submit">Weiter</button>
      </form>
      <form class="ts-f2" hidden>
        <h2>Passwort</h2>
        <p>für <b class="ts-wer"></b></p>
        <input class="ts-in" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
        <button class="ts-btn" type="submit">Anmelden</button>
        <button class="ts-zurueck" type="button">Anderen Namen eingeben</button>
      </form>
      <div class="ts-err">${msg || ''}</div>
      <button class="ts-gast" type="button">Seite ohne Anmeldung nutzen<small>Dein Fortschritt wird dann nur in diesem Browser gespeichert.</small></button>
    </div>`;
    document.body.appendChild(ov);
    const f1 = ov.querySelector('.ts-f1'), f2 = ov.querySelector('.ts-f2'), err = ov.querySelector('.ts-err');
    const k = f1.kennung, pw = f2.passwort;
    setTimeout(() => k.focus(), 50);

    const gast = () => { ss.set(SS.gast, '1'); ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') gast(); };
    document.addEventListener('keydown', esc);
    ov.querySelector('.ts-x').addEventListener('click', gast);
    ov.querySelector('.ts-gast').addEventListener('click', gast);
    ov.querySelector('.ts-zurueck').addEventListener('click', () => { f2.hidden = true; f1.hidden = false; err.textContent = ''; k.select(); });

    async function senden(btn, body){
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch(CONFIG.api + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
          .then(async x => { const j = await x.json().catch(() => ({})); if (!x.ok) throw new Error(x.status === 429 ? 'Zu viele Versuche – bitte kurz warten.' : (j.message || 'Anmeldung fehlgeschlagen.')); return j; });
        if (r.passwort){ f1.hidden = true; f2.hidden = false; ov.querySelector('.ts-wer').textContent = body.kennung; pw.value = ''; pw.focus(); return; }
        if (r.rolle === 'schueler'){
          ls.set(K.code, r.cred); ls.set(K.anzeige, r.anzeige); ls.set(K.klasse, r.klasse || '');
          ss.del(SS.lehrer); ss.del('ts-reload');
          aktiv = true;
          await uebernehmen().catch(() => {});
        } else {
          ss.set(SS.lehrer, JSON.stringify({rolle: r.rolle, token: r.token, name: r.name}));
        }
        location.reload();
      } catch (x){
        err.textContent = x.message || 'Anmeldung fehlgeschlagen.';
        (f2.hidden ? k : pw).select();
      } finally { btn.disabled = false; }
    }
    f1.addEventListener('submit', e => {
      e.preventDefault();
      const v = k.value.trim();
      if (!v){ err.textContent = 'Bitte gib deinen Code oder Benutzernamen ein.'; return; }
      senden(f1.querySelector('.ts-btn'), {kennung: v});
    });
    f2.addEventListener('submit', e => {
      e.preventDefault();
      if (!pw.value){ err.textContent = 'Bitte gib dein Passwort ein.'; return; }
      senden(f2.querySelector('.ts-btn'), {kennung: k.value.trim(), passwort: pw.value});
    });
  }

  async function abmelden(){
    const ohneDesign = () => { try { localStorage.removeItem('pf-design'); } catch (e) {} };   // Design gilt nur für Angemeldete
    if (lehrerSitzung()){ ohneDesign(); ss.del(SS.lehrer); ss.del(SS.gast); location.reload(); return; }
    if (!confirm(`Abmelden?\n\nAngemeldet als ${ls.get(K.anzeige) || ls.get(K.code)}. Dein Fortschritt bleibt auf dem Server gespeichert.`)) return;
    if (pushPending) await push();
    await flush();
    if (queue().length && !confirm('Einige gelöste Aufgaben konnten noch nicht übertragen werden (keine Verbindung). Trotzdem abmelden?')) return;
    ohneDesign(); wipeLocal(); ss.del(SS.gast); ss.del('ts-sichtbar');
    location.reload();
  }
  function abgelaufen(){
    aktiv = false;
    wipeLocal(); ss.del('ts-sichtbar');
    showMenu();
    showLogin('Deine Anmeldung ist nicht mehr gültig. Bitte melde dich neu an.');
  }

  /* ---------- Bedingte Menüpunkte (z. B. Tipp-Aufgabe nur mit aufgegebener Aufgabe) ---------- */
  function zeigeTools(ids){
    // Tool-ids bestehen nur aus a–z, 0–9 und - (katalog.js); andere werden ignoriert
    ids.filter(id => /^[a-z0-9-]+$/.test(id)).forEach(id => document.querySelectorAll(`[data-tool="${id}"]`).forEach(el => el.classList.add('pf-sichtbar')));
  }
  async function sichtbar(){
    try { zeigeTools(JSON.parse(ss.get('ts-sichtbar') || '[]')); } catch (e) {}   // Stand der letzten Seite, ohne Flackern
    try { const r = await api('/sichtbar'); ss.set('ts-sichtbar', JSON.stringify(r.tools || [])); zeigeTools(r.tools || []); } catch (e) {}
  }

  /* ---------- Start ---------- */
  async function start(){
    if (!hosted || window.PF_EINZELDATEI) return;          // Einzeldatei: immer ohne Anmeldung, Fortschritt nur im Browser
    try {
      const h = await fetch('/api/health', {cache: 'no-store'});
      if (!h.ok) return;                                    // kein PocketBase: Seite läuft nur lokal
    } catch (e){ return; }
    injectCss();
    aktiv = !!ls.get(K.code);
    showMenu();
    if (!aktiv){
      if (!lehrerSitzung() && !ss.get(SS.gast)) showLogin();
      return;
    }
    sichtbar();
    try { await pull(); flush(); }
    catch (err){ if (err.status === 401) abgelaufen(); else setStatus('offline'); }
  }

  lastSnap = JSON.stringify(snapshot());   // Stand beim Laden der Seite (vor deren Initialisierung)
  window.TrainerSync = {changed, event, anmelden: () => showLogin(), get aktiv(){ return aktiv; }, get lehrer(){ return lehrerSitzung(); }, abmelden};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

.af-chat{border:1px solid var(--border);border-radius:14px;background:var(--panel2);overflow:hidden;max-width:720px}
.af-chatkopf{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.af-verlauf{display:flex;flex-direction:column;gap:8px;padding:12px;max-height:62vh;overflow-y:auto;scroll-behavior:smooth}
.af-msg{display:flex;align-items:flex-end;gap:8px;max-width:88%}
.af-msg.ich{align-self:flex-end;flex-direction:row-reverse}
.af-ava{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;font-size:17px}
.af-blase{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px;line-height:1.4;animation:af-rein .25s ease-out}
.af-msg.ich .af-blase{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:14px 14px 4px 14px}
[data-theme=dark] .af-msg.ich .af-blase{color:#2e3440}
.af-blase.ok{background:var(--af-ok-bg)}
.af-blase.falsch{background:var(--af-err-bg)}
.af-blase pre{font:13px/1.5 var(--mono,monospace);margin:6px 0 2px;white-space:pre;overflow-x:auto}
.af-tippt{display:flex;gap:4px;padding:12px 14px}
.af-tippt i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:af-punkt 1s infinite}
.af-tippt i:nth-child(2){animation-delay:.15s}.af-tippt i:nth-child(3){animation-delay:.3s}
@keyframes af-punkt{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes af-rein{from{opacity:0;transform:translateY(6px)}}
.af-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
.af-chip{font:600 15px system-ui,sans-serif;background:var(--panel);color:var(--accent-text,var(--accent));border:2px solid var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer}
.af-chip:hover{background:var(--accent);color:#fff}
.af-chatein{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
.af-chattext{flex:1;min-width:0}
.af-chatende{padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
/* Bruch in Formeln (alle Fächer): <span class="bruch"><span>Zähler</span><span>Nenner</span></span> */
.bruch{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.3}
.bruch>span{padding:0 .25em}
.bruch>span:first-child{border-bottom:1.5px solid currentColor}
/* Lückentext mit Wortbank (luecken, ziehen:true) */
.af-bank .af-karte{flex:0 0 auto;border-left-width:1px;border-bottom:3px solid var(--accent)}
.af-luecken.af-ziehen{line-height:2.6}
.af-luecke{display:inline-flex;vertical-align:middle;align-items:center;min-width:110px;min-height:38px;margin:2px 3px;padding:2px;border:2px dashed var(--border);border-radius:9px;background:var(--panel2);flex-direction:row}
.af-luecke .af-karte{line-height:1.3;padding:5px 9px;border-left-width:1px;border-bottom:3px solid var(--accent)}
.af-luecke.richtig{border-style:solid;border-color:var(--af-ok)}
/* Buchungssatz: Beträge zum Ziehen (betraege) */
.af-betraege{margin-bottom:12px}
.af-bliste{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.af-betrag{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;background:var(--panel);color:var(--text);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:8px;padding:4px 10px;font:600 15px var(--mono,monospace);cursor:grab;touch-action:none;user-select:none}
.af-betrag small{font:500 12px system-ui,sans-serif;color:var(--muted)}
.af-betrag.gewaehlt{outline:3px solid var(--accent)}
.af-betrag.af-geist{width:auto}
.af-zahl.ziel{outline:3px solid var(--accent)}

/* Training: Aufgaben auf Zeit und/oder endlos (Aufgaben.training) */
.af-training{margin-top:6px}
.tr-karte{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tr-titel{margin:0;font-size:18px}
.tr-regeln{text-align:left;margin:0;padding-left:20px;max-width:560px;color:var(--text)}
.tr-regeln li{margin:3px 0}
.tr-start{font-size:17px;padding:10px 22px}
.tr-zeit{align-self:stretch;height:10px;border-radius:999px;background:var(--border);overflow:hidden}
.tr-balken{height:100%;width:100%;background:var(--ok,#5e8a45);border-radius:999px;transition:background-color .3s}
.tr-balken.knapp{background:var(--err,#a8434d)}
.tr-frage{font:700 clamp(26px,5vw,40px)/1.25 var(--mono,monospace);margin:8px 0 4px;word-break:break-word}
.tr-sprache{display:block;font:600 13px system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.tr-wort{font-family:system-ui,sans-serif}
.tr-form{display:flex;gap:8px;justify-content:center;width:min(420px,100%)}
.tr-ein{flex:1;min-width:0;font-size:22px;text-align:center;padding:8px 10px}
.tr-mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(560px,100%)}
@media (max-width:480px){.tr-mc{grid-template-columns:minmax(0,1fr)}}
.tr-opt{display:flex;align-items:center;gap:10px;text-align:left;font:600 18px system-ui,sans-serif;background:var(--panel);color:var(--text);border:2px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.tr-opt:hover:not(:disabled){border-color:var(--accent)}
.tr-opt.richtig{border-color:var(--ok,#5e8a45);background:var(--plus-bg,#dfeccf)}
.tr-opt.falsch{border-color:var(--err,#a8434d);background:var(--minus-bg,#f3d9dc)}
.tr-opt:disabled{cursor:default}
.tr-taste{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;font:600 12px var(--mono,monospace);color:var(--muted)}
.tr-rueck{min-height:24px;font-size:15px}
.tr-rueck.ok{color:var(--ok,#5e8a45);font-weight:700}
.tr-rueck.falsch{color:var(--err,#a8434d)}
.tr-rueck .muted{color:var(--muted);font-size:13px}
.tr-karte.tr-gut{border-color:var(--ok,#5e8a45);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok,#5e8a45) 30%,transparent)}
.tr-karte.tr-wackeln{animation:af-wackeln .45s}
.tr-ergebnis{margin:4px 0 0;font-size:28px}
.tr-fehler{text-align:left;width:min(560px,100%)}
.tr-fehler table{border-collapse:collapse;width:100%;margin-top:6px;font-size:14px}
.tr-fehler td{border-bottom:1px solid var(--border);padding:4px 8px}
.tr-weiss{color:var(--muted)}
.tr-info{margin-left:auto;font-size:15px}
.tr-fehler th{text-align:left;font-size:12px;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--border)}

/* ---------- Experimentelle Typen (Branch beta) ---------- */
.af .mono,.af .mono .af-karte,.af .mono .af-mw{font-family:var(--mono,monospace)}
.af-znr{flex:none;display:inline-block;min-width:26px;margin-right:8px;text-align:right;color:var(--muted);font:12px var(--mono,monospace);user-select:none}
/* Reihenfolge */
.af-reihe{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.af-rzeile{min-height:0;flex-direction:row;align-items:center;gap:8px;padding:4px 6px;border-width:1px;border-radius:10px}
.af-rzeile .af-karte{flex:1;min-width:0}
.af-reihe.mono .af-karte{white-space:pre-wrap}
.af-rnr{flex:none;width:22px;text-align:center;font:700 13px var(--mono,monospace);color:var(--muted)}
.af-rpfeile{flex:none;display:flex;gap:2px}
.af-rp{font-size:12px;line-height:1;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 7px;cursor:pointer}
.af-rp:disabled{opacity:.3;cursor:default}
/* Offene Antwort */
.af-offen{display:block;width:100%;resize:vertical;line-height:1.45}
.af-muster{border-left:4px solid var(--af-ok);background:var(--panel2);border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0 0}
.af-muster>*:last-child{margin-bottom:0}
.af-kriterien{display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
.af-kriterien label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.af-kriterien input{margin-top:3px;flex:none}
/* Markieren und Verbessern */
.af-mark,.af-verb{border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:6px 0;line-height:2;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.af-mark.mono,.af-verb.mono{font-size:14.5px;line-height:1.9}
.af-mw{font:inherit;color:inherit;background:none;border:0;border-radius:6px;padding:1px 3px;margin:0 -1px;cursor:pointer;white-space:pre-wrap;text-align:left;box-shadow:inset 0 -2px 0 transparent}
.af-mw:hover{box-shadow:inset 0 -2px 0 var(--accent)}
.af-mw.sel{background:var(--accent);color:#fff}
[data-theme=dark] .af-mw.sel{color:#2e3440}
.af-mw.richtig{background:var(--af-ok-bg)!important;color:var(--text);box-shadow:inset 0 -2px 0 var(--af-ok)}
.af-mw.falsch{background:var(--af-err-bg)!important;box-shadow:inset 0 -2px 0 var(--af-err)}
.af-mark.zeilen{padding:6px;line-height:1.6}
.af-mark.zeilen .af-mw{display:flex;width:100%;margin:0;padding:2px 6px}
.af-mleer{height:1.2em}
.af-verb{padding:6px}
.af-vz{display:flex;width:100%;align-items:baseline;font:inherit;color:inherit;text-align:left;background:none;border:0;border-radius:6px;padding:1px 6px;margin:0}
.af-vt{flex:1;min-width:0;white-space:pre-wrap}
button.af-vz{cursor:pointer}
button.af-vz:hover{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.af-vz.aktiv{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.af-vz.fertig mark{background:var(--af-ok-bg);color:var(--text);border-radius:4px;padding:0 2px}
.af-vz.fertig .af-znr::after{content:"✓";color:var(--af-ok);margin-left:2px}
.af-vin{font:inherit;padding:1px 5px;margin:0 2px;max-width:100%}
.af-vinfo{font-size:14px;color:var(--text);margin-bottom:6px}
/* Beschriften */
.af-bild{position:relative;display:block;width:fit-content;min-width:min(100%,300px);max-width:100%;margin:4px 0 22px}
.af-bild img{display:block;width:100%;max-width:100%;height:auto;border:1px solid var(--border);border-radius:10px;user-select:none}
.af-punkt{position:absolute;transform:translate(-50%,-50%);min-height:0;min-width:0;padding:0;border-radius:999px;flex-direction:row;align-items:center;justify-content:center;background:var(--panel);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.af-punkt>b{display:grid;place-items:center;width:28px;height:28px;font:700 13px system-ui,sans-serif}
.af-punkt.voll{border-radius:10px;border-color:var(--accent)}
.af-punkt .af-karte{font-size:13px;padding:3px 7px;border-left-width:1px;border-bottom:3px solid var(--accent);white-space:nowrap}
.af-punkt.richtig{border-color:var(--af-ok)}
/* Blöcke */
.af-block{flex:0 0 auto!important;border-left-width:1px;border-bottom:3px solid var(--accent);font-weight:600;white-space:pre-wrap}
.af-bfeld{min-height:58px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:10px;border-style:dashed}
.af-bfeld.senkrecht{flex-direction:column;align-items:flex-start}
.af-bfeld.richtig{border-style:solid;border-color:var(--af-ok)}
.af-bstart{font-weight:700;margin-right:2px}
.af-bfeld.mono .af-bstart{font-family:var(--mono,monospace)}
/* Karteikarten */
.af-kk-info{font-size:13px;color:var(--muted);margin-bottom:6px}
.af-kk{display:flex;flex-direction:column;gap:8px;min-height:170px;max-width:560px;border:2px solid var(--border);border-radius:14px;background:var(--panel2);padding:12px 16px;cursor:pointer}
.af-kk:hover{border-color:var(--accent)}
.af-kk.offen{background:var(--panel);border-color:var(--accent)}
.af-kk-text{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:18px}
.af-kk-text>*{margin:2px 0}
.af-kk-knoepfe{max-width:560px;justify-content:center}
/* Kreuzworträtsel */
.af-kw{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:6px 0}
.af-kw-gitter{display:grid;grid-template-columns:repeat(var(--kc,10),minmax(0,36px));gap:2px;flex:0 1 auto;max-width:100%}
.af-kwz{position:relative;aspect-ratio:1}
.af-kwz i{position:absolute;top:1px;left:3px;font:600 9px system-ui,sans-serif;color:var(--muted);pointer-events:none}
.af-kwi{width:100%;height:100%;box-sizing:border-box;border:1.5px solid var(--muted);border-radius:5px;background:var(--panel);color:var(--text);text-align:center;font:700 clamp(12px,3.6vw,18px) system-ui,sans-serif;padding:6px 0 0;text-transform:uppercase;caret-color:transparent}
.af-kwi.akt{border-color:var(--accent);background:var(--panel2)}
.af-kwi:focus{outline:3px solid var(--accent);outline-offset:-1px}
.af-kw-listen{flex:1 1 260px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.af-kw-listen ul{list-style:none;margin:4px 0 0;padding:0}
.af-kw-listen li{padding:2px 6px;border-radius:6px;cursor:pointer}
.af-kw-listen li.akt{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.af-kw-listen small{color:var(--muted)}
.af-bfeld+.af-hinweis{margin-top:6px}

</style>
<style>

.block.fn{background:var(--blk-fn);border-radius:14px;padding:6px 12px;gap:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex-wrap:wrap}
.block.fn .fname,.block.fn .fsep{font-size:19px}
.block.fn .slot.hex{min-width:150px;min-height:48px}
.block.fn .slot.hex.dummy{min-width:110px;min-height:38px;opacity:.7}

.slot.fnslot.drop-hover{border-color:var(--accent)}
.fixv{font:700 20px var(--mono);padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--border)}
.fixv.c-then{background:var(--then);color:var(--on-color);border-color:transparent}
.fixv.c-else{background:var(--else);color:var(--on-color);border-color:transparent}
.block.fn.r-cond .slot.hex::after{background:color-mix(in srgb,var(--cond) 55%,#fff)}
.cases{margin:8px 0}
.cases summary{cursor:pointer;color:var(--muted);font-size:14px}
.gegeben{margin:8px 0 10px}
.gegeben code{display:inline-block;font:700 17px var(--mono);padding:6px 10px;word-break:break-all}
.worum{margin-top:8px;font-size:14px}
.worum summary{cursor:pointer;color:var(--muted)}
details.help{margin-top:10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
details.help summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.help p,details.help ul{margin:8px 0}
/* Erarbeitung (lib/aufgaben.js): Knöpfe wie lib/basis.css */
#lern .btn{font:600 14px system-ui,sans-serif;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer}
#lern .btn.on,#lern .btn.haupt{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] #lern .btn.on,[data-theme=dark] #lern .btn.haupt{color:#2e3440}
#lern .btn:disabled{opacity:.45}
#lern .btn.klein{font-size:13px;padding:4px 9px}
#lern .muted{color:var(--muted)}
#lern .karte{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
#lern .karte p{margin:0 0 8px}
#lern h2{font-size:20px;margin:4px 0 8px}
.info{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 12px}
code.fx{font:600 15px var(--mono);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;white-space:nowrap}
.fxblock{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:8px 0 12px}
.fxblock code.fx{white-space:normal;word-break:break-all;font-size:16px;padding:4px 8px}
.merk{border:2px solid var(--accent);border-radius:12px;padding:8px 14px;margin:10px 0;background:var(--panel)}
.merk .mt{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text,var(--accent));margin-bottom:2px}
.merk p,.merk ol{margin:4px 0}
.schritt{color:var(--muted);font-size:13px;margin:6px 0 -2px}
table.gegen{border-collapse:collapse;margin:8px 0 12px;font:15px var(--mono)}
table.gegen td,table.gegen th{border:1px solid var(--border);padding:5px 12px;text-align:center}
table.gegen th{background:var(--panel2);font:600 13px system-ui,sans-serif}
.af-luecken code.fx{white-space:normal;line-height:2.4;background:none;border:0;padding:0;font-size:16px}
.af-luecken select{font:600 14px var(--mono)}
.af-karte code.fx,.af-zt code.fx{white-space:normal;word-break:break-all;font-size:13px}
/* Blitz-Training */
.ef{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 15px system-ui,sans-serif}
.ef .el{color:var(--muted)}
.ef code{font:600 clamp(14px,2.4vw,19px) var(--mono);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;word-break:break-all}
.ef .blank{display:inline-block;min-width:3.6em;text-align:center;border-bottom:3px solid var(--accent);color:var(--accent-text,var(--accent))}
.tr-fehler .ef code{font-size:12px;padding:2px 4px}
.tr-fehler .ef{align-items:flex-start;font-size:12px}
.zeitschalter{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.sys{display:inline-flex;align-items:center;gap:8px;font:600 15px system-ui,sans-serif;background:var(--panel);color:var(--text);border:2px solid var(--border);border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer}
.sys .knopf{position:relative;width:34px;height:20px;border-radius:10px;background:var(--border);transition:background .15s}
.sys .knopf::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sys[aria-checked=true]{border-color:var(--accent)}
.sys[aria-checked=true] .knopf{background:var(--accent)}
.sys[aria-checked=true] .knopf::after{left:16px}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/>
  </linearGradient></defs></svg>

<header>
  <div class="hdr-left">
    <div class="brand"><span>NICHT</span></div>
    <div class="modes" role="group" aria-label="Modus">
      <button data-mode="lernen">Erarbeitung</button><button data-mode="endlos">Endlos</button>
    </div>
  </div>
  <div class="hdr-right">
    <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel umschalten"></button>
    <div class="flames" id="flames" aria-label="Stufe wählen"></div>
  </div>
</header>

<main>
  <div id="lern"></div>
  <div id="engine">
    <section class="card">
      <div class="meta">
        <span class="lvlname" id="lvlname"></span>
        <span id="taskmeta"></span>
      </div>
      <div class="taskrow">
        <div class="tasktext" id="tasktext"></div>
        <div id="grid"></div>
      </div>
    </section>

    <section class="card" id="workcard">
      <div class="worktitle"><span id="wtlabel">Deine Formel</span> <span class="wthint" id="wthint"></span></div>
      <div id="work"></div>
    </section>

    <div class="pools" id="pools"></div>

    <div class="actions">
      <button class="btn primary" id="checkBtn">Prüfen</button>
      <button class="btn" id="resetBtn">Zurücksetzen</button>
      <span class="spacer"></span>
      <button class="btn" id="skipBtn" title="Neue Aufgabe – die Serie beginnt wieder bei 0">Andere Aufgabe</button>
      <button class="btn" id="prevBtn" aria-label="Vorherige Aufgabe">◀</button>
      <button class="btn" id="nextBtn">Nächste Aufgabe ▶</button>
    </div>
    <div id="fb"></div>
  </div>

<script>/* ../../lib/aufgaben.js */
/* aufgaben.js – Aufgabenbausteine für alle Fächer: Aufgaben als Daten, Prüfung und Rückmeldung eingebaut
 *
 * Einbinden (Pfad zum Ordner pb_public/lib/, z. B. aus BWR/9II/finanzierung/ ../../../lib/):
 *   <link rel="stylesheet" href="../../../lib/aufgaben.css">   <script src="../../../lib/aufgaben.js"><\/script>

 * Formeln mit Bruchstrich in jedem HTML-Text: <span class="bruch"><span>Zähler</span><span>Nenner</span></span> (aufgaben.css),
 *   kombi        Kombinierte Aufgabe: teile:[Aufgabe, …] (mindestens zwei, keine Kombi in der Kombi). Teil 2 erscheint
 *                erst, wenn Teil 1 richtig gelöst ist, usw.; erledigt, wenn der letzte Teil gelöst ist (dann ok).
 *                nr, frage, erinnerung, material der Kombi stehen über allen Teilen, jeder Teil hat eigene.
 *                (Früher: danach:{…} an einer Aufgabe – Aufgaben-JSON mit danach wandelt lib/seite.js um.)
 *   mc           options:[Texte], correct:[Indizes] (mehrere = Mehrfachauswahl, oder multi:true), why:{Index: Erklärung},
 *                after (Text nach Erfolg), mono, mischen:false (Reihenfolge behalten), sofort:false

 *                Dasselbe Format wie type:'choice' in den Excel-Erklärungen.
 *   zahlen       felder:[{t (Text), l (Lösung), e (Einheit), h (Hinweis bei Fehler), tol (Toleranz, Std. 0,005)}]

 *                ziehen:true → Wortbank statt Auswahllisten: Wörter in die Lücken ziehen oder erst Wort, dann Lücke
 *                antippen (Wort in der Lücke antippen = zurück). Bank: je Lücke das richtige Wort, dazu die falschen
 *                Antworten der Lücken und extra:['…'] (weitere Ablenker), Doppelte nur einmal. [[Wort]] ohne | reicht hier.
 *   zuordnen     felder:[[id, Titel]], karten:[{t (Text), z (Feld-id)}]; Ziehen mit Maus/Finger oder
 *                erst Karte, dann Feld antippen. Richtige bleiben liegen, falsche gehen zurück.
 *   tabelle      Tabelle zum Ausfüllen (z. B. Tilgungsplan): spalten:['Jahr', 'Zinsen', …],

 *   chat         Lern-Chat wie bei LearningSnacks: name, bild (Emoji), nachrichten:[…], jede Nachricht ist
 *                'Text des Bots' (HTML erlaubt) oder eine Frage {bot:'Frage', …} mit einer Antwortform:
 *                  antworten:[{t:'mehr', ok:true, r:'Genau! …'}, {t:'weniger', r:'Nein, …'}]   (Knöpfe)
 *                  zahl:{l:11900, e:'€', tol}   oder   freitext:{antworten:[…]} (wie Typ freitext)

 *                Bei Fehlern erklärt der Bot und macht weiter; am Ende Punkte und „Noch einmal“.
 *                Gilt als gelöst (fertig), sobald der Chat einmal ganz durchlaufen ist.
 *                Szenario (verzweigter Chat, alles optional, alte Chats laufen unverändert): Nachricht als Objekt mit
 *                  id:'kredit' (Sprungziel), weiter:'id' (danach dorthin statt zur nächsten), ende:true (Chat endet hier);
 *                  Antwort-Knopf mit weiter:'id' bzw. ende:true (gilt vor weiter/ende der Frage).
 *                  Frage, bei der kein Knopf ok:true hat = Entscheidung: zählt nicht als Frage, r erscheint neutral.
 *   buchungssatz konten:['2800 BK', …] (Auswahl), soll:[['0700 MA', 40000], …], haben:[…],
 *                steuer:['2600 VORST', '4800 UST'] (für den Hinweis), nebenrechnung (HTML nach Lösung),
 *                betraege:[['Rechnungsbetrag', 11900], ['', 238], …] → Beträge (z. B. aus einer Kalkulation davor) zum Ziehen,
 *                Bezeichnung darf leer sein (dann nur der Betrag);
 *                auf die Betragsfelder oder erst Betrag, dann Feld antippen; auch Ablenker, mehrfach nutzbar,
 *                jgst:7 → Konten nur mit Kürzel ohne Nummer (konten:['BK', 'UEFE', 'UST']).
 *                Konto eintippen: Liste filtert nach Nummer oder Kürzel (z. B. „ve“ → 4400 VE).
 *                „an“ steht wie im Heft auf der Zeile des letzten Soll-Kontos neben dem ersten Haben-Konto.
 *                prüft: Konten, Soll/Haben vertauscht, fehlende Steuer, Beträge; Lösung im Skill-Format
 *   verbessern   Fehlersuche: text mit Zeilen (\n), Fehler als [[falsch|richtig|auch richtig]] (falsch wird angezeigt;
 *                [[zu viel|]] = Stelle löschen). Ablauf je Fehlerzeile: Zeile anklicken → alle falschen Stellen anklicken
 *                (nochmal = abwählen) → Prüfen → Stellen verbessern → Prüfen. Bei nur einer Zeile entfällt die Zeilenwahl.
 *                Stellen sind durch Leerzeichen getrennte Wörter bzw. die Klammern. mono:true (Code), gross:false (Groß/klein egal), h.
 *   kreuzwort    woerter:[{w:'Bilanz', t:'Hinweis'}] – das Gitter entsteht von selbst (immer gleich); Buchstaben A–Z, Ä, Ö, Ü,
 *                ß wird SS, Leerzeichen und Bindestriche entfallen. Wörter ohne gemeinsamen Buchstaben stehen einzeln darunter.
 *
 * EXPERIMENTELL (Branch beta, Liste in Aufgaben.EXPERIMENTELL): Format und Bedienung können sich noch ändern.
 *   reihenfolge  karten:['erster Schritt', 'zweiter Schritt', …] in der richtigen Reihenfolge (HTML erlaubt), werden gemischt;
 *                ziehen, ▲ ▼ oder erst Karte, dann Zielstelle antippen. mono:true → Karten sind reiner Text in
 *                Schreibmaschinenschrift (Codezeilen, Einrückung bleibt). h (Hinweis bei Fehler). Gleiche Texte sind austauschbar.
 *   offen        Freie Antwort mit Selbstkontrolle: muster (Musterlösung, HTML), kriterien:['nennt …', 'begründet …'] (zum Abhaken,
 *                optional), zeilen (Höhe des Textfelds, Std. 5), min (Mindestzahl Zeichen, Std. 1). Ablauf: schreiben →
 *                „Musterlösung zeigen“ → abhaken → abschließen (= gelöst, unabhängig von den Haken). Der Text wird nicht gespeichert.
 *   markieren    text:'Der [[Hund]] bellt.' – Stellen in [[…]] sind gesucht; angeklickt werden Wörter (Satzzeichen nicht) oder
 *                mit einheit:'zeile' ganze Zeilen (Zeile mit [[ ist gesucht). Reiner Text, Zeilenumbruch mit \n.
 *                mono:true (Code: Schreibmaschinenschrift, Trennung nur an Leerzeichen), anzahl:false (Anzahl nicht verraten), h.
 *   beschriften  bild (Adresse oder data:image/…), alt, punkte:[{x:25, y:40, t:'Begriff'}] (x, y in Prozent des Bildes),
 *                extra:['Ablenker']; Begriffe aus der Wortbank auf die nummerierten Punkte ziehen (oder antippen).
 *   bloecke      Blöcke wie beim blockbasierten Programmieren zu einer Formel oder einem Ablauf zusammensetzen:
 *                bloecke:['Z', '=', 'K', '·', 'p', …] (Vorrat, reiner Text, beliebig oft nutzbar; einmal:true = jeder nur einmal),
 *                loesung:['Z', '=', …] (Reihenfolge) oder loesungen:[[…], […]], start:'Z =' (fester Text davor),
 *                gleichwertig:true → jede rechnerisch gleichwertige Formel zählt (braucht lib/formel.js; „=“ trennt die Seiten),
 *                senkrecht:true (Blöcke untereinander), mono:true, h.
 *   karteikarten karten:[{v:'Vorderseite', r:'Rückseite'}] (HTML), mischen:false; umdrehen, „Gewusst“/„Nicht gewusst“ –
 *                nicht gewusste Karten kommen wieder, gelöst, wenn alle gewusst sind.
 *   Eigene Typen können klick(ctx, ziel), eingabe(ctx, feld) → true = erledigt, taste(ctx, ereignis) → true = erledigt
 *   und legen(z, karte, zone, a) mitbringen (siehe die experimentellen Typen).
 *
 * API
 *   Aufgaben.baue(el, a, {fertig})  Baustein in Element el; fertig(a) nach richtiger Lösung (inkl. danach)
 *   Aufgaben.sequenz({el, key, schritte})  Erarbeitung aus Schritten mit Knöpfen, ✓, Zähler, Zurück/Weiter:
 *       schritt = {id, kurz (Knopf), titel, html (String oder Funktion), erinnerung, erinnerungZu, material,
 *                  aufgaben:[…], nach(el) (nach dem Zeichnen, für eigene Grafiken)}
 *       Schritte mit Aufgaben melden TrainerSync.event (modus 'erarbeitung', aufgabe = schritt.id),
 *       Info-Schritte gelten beim Weitergehen als erledigt. Gespeichert: <key>-stand {schritt, erledigt}.
 *   Aufgaben.endlos({el, key, stufen})  Endlos-Modus wie in den Excel-Übungen: Stufen als Flammen, Serie und Rekord,
 *       „Andere Aufgabe“ (Serie auf 0), „Nächste Aufgabe“ nach richtiger Lösung.
 *       stufe = {name, neu() → Aufgabe (beliebiger Typ, frisch erzeugt; h/ok für Rechenweg nutzen)}
 *       Meldet TrainerSync.event (modus 'endlos', stufe 1…n). Gespeichert: <key>-endlos {stufe, rekord:{stufe: n}}.
 *       Rückgabe {neu() (neue Aufgabe), stufe(n) (Stufe wechseln)}. Vorbild: BWR/9II/finanzierung/zinsrechnung.html
 *   Aufgaben.training({el, key, training, titel, fertig})  Aufgaben auf Zeit und/oder endlos (Schritt mit "training" im

 *       zeit {start, schritt, min}: Balken läuft ab, Zeit je Aufgabe = max(min, start + richtige · schritt).

 *       Je Stufe (training.stufen) auch eigene antwort ('mc' | 'eingabe') und zeit (null = ohne Zeit), z. B. vier Stufen
 *       „Auswählen“, „Auswählen auf Zeit“, „Eintippen“, „Eintippen auf Zeit“ mit denselben Aufgaben.
 *       Eigene Aufgaben (nur in Seiten mit eigenem Code, nicht im JSON): stufe.neu({mc}) → {frage (HTML), loesung (Text),
 *       optionen (bei mc: [{t, ok}], genau eine ok), pruefe(text) → 'ok' | 'fast' | 'falsch' (optional, sonst Vergleich mit loesung)}.
 *       Vorbild: IT/grundlagen/zahlensysteme.html
 *       training.variante() → Text (optional, nur mit Code): Bestleistung getrennt je Variante (z. B. „Binär + Dezimal“),
 *       '' = Standard. Ändert die Seite die Variante, schickt sie das Ereignis 'af-variante' an das .af-training-Element:
 *       das Training kehrt zum Startbild zurück (eine laufende Serie zählt dann nicht).
 *       Gespeichert: <key>-training {stufe, best:{stufe: n, "stufe:variante": n}}. Meldet je Runde/Serie TrainerSync.event (modus 'endlos'),
 *       fertig() nach der ersten Runde (bzw. ab training.ziel richtigen) oder einer Serie ab 10 (bzw. ziel).
 *       In Aufgaben.sequenz: schritt.training statt schritt.aufgaben.
 *   Aufgaben.mc.html(a, auswahl:Set, geprueft, reihenfolge?) / Aufgaben.mc.pruefen(a, auswahl) → {ok, gruende}
 *       für Seiten mit eigenem Ablauf (Excel-Erklärungen: tabelle.js, und-oder.html)
 *   Aufgaben.finde(antworten, text) → {i (Eintrag), wort, fast} oder null   (Freitext-Abgleich, auch einzeln nutzbar)
 *   Helfer: zahl('1.234,50 €') → 1234.5, eur(n) → '1.234,50 €', mischen(liste), esc(text), bsText(soll, haben)

(function(){
'use strict';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const r2 = n => Math.round(n * 100) / 100;
const zahlText = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2});
const eur = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
function zahl(s){
  s = String(s == null ? '' : s).replace(/€|%|Tage?|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? +s : NaN;
}
function mischen(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const erinnerungHTML = x => x.erinnerung ? `<details class="erinnerung"${x.erinnerungZu ? '' : ' open'}><summary>Erinnerung${x.erinnerungZu ? ' (zum Aufklappen)' : ''}</summary>${x.erinnerung}</details>` : '';
const fbHTML = fb => fb ? `<div class="af-fb ${fb.ok ? 'ok' : 'falsch'}">${fb.t}</div>` : '';
const nummern = n => [...Array(n).keys()];
// Buchungssatz im Format des BWR-Skills: „an“ auf der letzten Soll-Zeile, weitere Haben-Konten bündig darunter
function bsText(soll, haben){
  const w1 = Math.max(...soll.map(x => x[0].length)), b1 = Math.max(...soll.map(x => eur(x[1]).length));
  const w2 = Math.max(...haben.map(x => x[0].length)), b2 = Math.max(...haben.map(x => eur(x[1]).length));
  const z = (x, w, b) => x[0].padEnd(w) + '  ' + eur(x[1]).padStart(b);
  const zeilen = soll.map((x, i) => z(x, w1, b1) + (i === soll.length - 1 ? '   an   ' + z(haben[0], w2, b2) : ''));
  haben.slice(1).forEach(x => zeilen.push(' '.repeat(w1 + b1 + 10) + z(x, w2, b2)));
  return zeilen.join('\n');
}

/* ---------- Freitext-Abgleich mit Tippfehlern ---------- */
const norm = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
function abstand(a, b){   // Damerau-Levenshtein (vertauschte Nachbarn zählen 1)
  const d = [];
  for (let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++){
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
function finde(antworten, text){
  const t = norm(text); if (!t) return null;
  const woerter = t.split(' '), stuecke = [];
  for (let n = 1; n <= 3; n++) for (let i = 0; i + n <= woerter.length; i++) stuecke.push(woerter.slice(i, i + n).join(''));
  let best = null;
  antworten.forEach((eintrag, i) => [].concat(eintrag).forEach(wort => {
    const v = norm(wort), vz = v.replace(/ /g, '');
    if ((' ' + t + ' ').includes(v) || t.replace(/ /g, '').includes(vz)){ if (!best || best.fast) best = {i, wort:[].concat(eintrag)[0], fast:false, d:0}; return; }
    const tol = Math.max(1, Math.floor(vz.length * (vz.length >= 10 ? 0.45 : 0.3)));
    stuecke.forEach(s => { const d = abstand(s, vz); if (d <= tol && (!best || (best.fast && d < best.d))) best = {i, wort:[].concat(eintrag)[0], fast:true, d}; });
  }));
  return best;
}

/* ---------- Typen: zustand(a), html(a, z), pruefen(a, z) → {ok, t} ---------- */
const mehrfach = a => !!a.multi || a.correct.length > 1;
const optText = (a, i) => a.html === true ? String(a.options[i]) : esc(a.options[i]);   // HTML nur mit html:true
const mc = {
  html(a, sel, geprueft, ord){
    return `<div class="opts${a.mono ? ' mono' : ''}">` + (ord || nummern(a.options.length)).map(i => {
      let c = sel.has(i) ? ' sel' : '';
      if (geprueft && sel.has(i)) c += a.correct.includes(i) ? ' good' : ' bad';
      return `<button class="opt${c}" type="button" data-opt="${i}">${optText(a, i)}</button>`;
    }).join('') + `</div><div class="ohint">${mehrfach(a) ? 'Mehrere Antworten möglich.' : 'Genau eine Antwort ist richtig.'}</div>`;
  },
  pruefen(a, sel){
    const falsch = [...sel].filter(i => !a.correct.includes(i)), fehlt = a.correct.filter(i => !sel.has(i));
    const gruende = falsch.map(i => (a.why && a.why[i]) || `„${optText(a, i)}“ passt nicht.`);
    if (!falsch.length && fehlt.length) gruende.push(fehlt.length === 1 ? 'Es fehlt noch eine richtige Antwort.' : `Es fehlen noch ${fehlt.length} richtige Antworten.`);
    return {ok:!falsch.length && !fehlt.length, gruende};
  }
};
const TYPEN = {
  mc:{
    zustand:a => ({sel:new Set(), ord:a.mischen === false ? null : mischen(nummern(a.options.length))}),
    sofort:a => a.sofort !== false && !mehrfach(a),
    html:(a, z) => mc.html(a, z.sel, z.geprueft, z.ord),
    pruefen(a, z){
      if (!z.sel.size) return {ok:false, t:'Wähle zuerst eine Antwort aus.'};
      z.geprueft = true;
      const r = mc.pruefen(a, z.sel);
      return r.ok ? {ok:true, t:'✓ <b>Richtig!</b>' + (a.after ? ' ' + a.after : '')} : {ok:false, t:'Noch nicht ganz.<br>' + r.gruende.join('<br>')};
    }
  },
  zahlen:{
    zustand:() => ({ein:{}, ok:{}}),
    html:(a, z) => '<div class="af-felder">' + a.felder.map((f, i) => {
      const r = z.ok[i];
      return `<div class="af-zeile"><span class="af-t">${f.t}</span><input class="feld af-zahl${r === true ? ' richtig' : r === false ? ' falsch' : ''}" data-f="${i}" value="${esc(z.ein[i] || '')}" inputmode="decimal" autocomplete="off" aria-label="${esc(String(f.t).replace(/<[^>]+>/g, ''))}"${r === true ? ' readonly' : ''}>`
        + `<span class="af-e">${f.e || ''}</span><span class="af-m">${r === true ? '✓' : r === false ? '✗' : ''}</span></div>`
        + (r === false && f.h ? `<div class="af-hinweis">${f.h}</div>` : '');
    }).join('') + '</div>',
    pruefen(a, z){
      a.felder.forEach((f, i) => { z.ok[i] = Math.abs(zahl(z.ein[i]) - f.l) <= (f.tol == null ? 0.005 : f.tol); });
      return a.felder.every((f, i) => z.ok[i]) ? {ok:true, t:'✓ ' + (a.ok || 'Alles richtig!')} : {ok:false, t:'Noch nicht alles richtig. Die rot markierten Felder stimmen nicht.'};
    }
  },
  luecken:{
    zustand(a){
      const teile = String(a.text).split(/\[\[(.*?)\]\]/).map((s, i) => i % 2 ? s.split('|').map(w => w.trim()) : s);
      const z = {teile, wahl:{}, ok:{}, ord:teile.map(t => Array.isArray(t) ? mischen(nummern(t.length)) : null)};
      if (a.ziehen){   // Wortbank: je Lücke das richtige Wort, dazu die falschen Antworten und extra (ohne Doppelte)
        const richtig = teile.filter(Array.isArray).map(t => t[0]);
        const sonst = [...new Set([...teile.filter(Array.isArray).flatMap(t => t.slice(1)), ...(a.extra || [])])].filter(w => w && !richtig.includes(w));
        Object.assign(z, {woerter:[...richtig, ...sonst], platz:{}, fix:{}, weg:[], wahl:null});
        z.ord = mischen(nummern(z.woerter.length));
      }
      return z;
    },
    // Wortbank: Wort i in Lücke 'L<n>' bzw. zurück (zone ''); höchstens ein Wort pro Lücke
    legen(z, i, zone){
      const drin = Object.keys(z.platz).find(k => z.platz[k] === zone);
      if (zone && drin != null){ if (z.fix[drin]) return; delete z.platz[drin]; }
      if (!zone) delete z.platz[i]; else z.platz[i] = zone;
    },
    html(a, z){

/* ---------- Lern-Chat: Ablauf ---------- */
const textVon = m => typeof m === 'string' ? m : m.bot;
function chatSage(z, html, art, dann){
  z.tippt = true; z.ctx.zeichne();
  const fertig = () => { z.tippt = false; z.weiter = null; z.log.push({wer:'bot', html, art}); dann(); };
  z.weiter = fertig;
  z.timer = setTimeout(fertig, Math.min(1600, 350 + String(html).replace(/<[^>]+>/g, '').length * 12));
}
function chatWeiter(z, a){

    z.ende = true; z.ctx.zeichne();
    if (!z.geloest){ z.geloest = true; if (z.ctx.opt.fertig) z.ctx.opt.fertig(a); }
    return;
  }
  const m = a.nachrichten[z.i];
  chatSage(z, textVon(m), null, () => {
    if (typeof m === 'object' && (m.antworten || m.zahl || m.freitext)){ z.warte = z.i; z.ctx.zeichne(); return; }
    z.i = chatZiel(a, m, z.i); z.ctx.zeichne(); chatWeiter(z, a);
  });
}
// Szenario: nächste Nachricht nach m (Stelle i) – ende:true beendet, weiter:'id' springt zur Nachricht mit dieser id
function chatZiel(a, m, i, x){
  if (x && x.ende || (m && typeof m === 'object' && m.ende && !(x && x.weiter != null))) return a.nachrichten.length;
  const id = x && x.weiter != null ? x.weiter : m && typeof m === 'object' ? m.weiter : null;
  const j = id == null ? -1 : a.nachrichten.findIndex(n => n && typeof n === 'object' && n.id === id);
  return j >= 0 ? j : i + 1;
}
function chatAntwort(ctx, wert, j){
  const {a, z} = ctx, q = a.nachrichten[z.warte];
  if (!q) return;
  let ok, text, r, x = null;
  const wahl = !!q.antworten && !q.antworten.some(y => y.ok);   // Entscheidung ohne richtig/falsch (Szenario)
  if (q.antworten){ x = q.antworten[j]; ok = !!x.ok; text = x.t; r = x.r; }
  else if (q.zahl){ if (!String(wert).trim()) return; ok = Math.abs(zahl(wert) - q.zahl.l) <= (q.zahl.tol == null ? 0.005 : q.zahl.tol); text = wert + (q.zahl.e && !/€|%/.test(wert) ? ' ' + q.zahl.e : ''); }
  else { if (!String(wert).trim()) return; const f = finde(q.freitext.antworten, wert); ok = !!f; text = wert; if (f && f.fast) r = (q.r || 'Richtig!') + ` (Schreibweise: „${esc(f.wort)}“)`; }
  z.log.push({wer:'ich', text}); z.i = chatZiel(a, q, z.warte, x); z.warte = null;
  if (wahl) return r ? chatSage(z, r, null, () => chatWeiter(z, a)) : chatWeiter(z, a);
  z.fragen++; if (ok) z.punkte++;
  chatSage(z, r || (ok ? q.r || '👍 Richtig!' : q.rFalsch || 'Das stimmt leider nicht.'), ok ? 'ok' : 'falsch', () => chatWeiter(z, a));
}

/* ---------- Baustein zeichnen und bedienen ---------- */
function baue(el, a, opt){
  opt = opt || {};
  if (a.typ === 'kombi') return baueKombi(el, a, opt);
  const typ = TYPEN[a.typ];
  if (!typ) throw new Error('aufgaben.js: unbekannter typ ' + a.typ);
  const z = a._z || (a._z = typ.zustand(a));
  const ctx = {a, z, typ, opt, el, zeichne(){

      + (a.material ? `<div class="material">${a.material}</div>` : '')
      + (a.frage ? `<p class="af-frage">${a.nr ? `<span class="af-nr">${a.nr}</span>` : ''}${a.frage}</p>` : '')
      + typ.html(a, z)
      + (!z.geloest && !sofort ? `<div class="af-knoepfe"><button class="btn haupt af-pruefen" type="button">${a.knopf || 'Prüfen'}</button></div>` : '')
      + fbHTML(z.fb);
    if (typ.nach) typ.nach(el, a, z);

  el.classList.add('af'); el._af = ctx;

}
function pruefe(ctx){
  const {a, z, typ, opt} = ctx, r = typ.pruefen(a, z);

  const neu = r.ok && !z.geloest;

  ctx.zeichne();
  if (neu && opt.fertig) opt.fertig(a);

// Kombinierte Aufgabe: Teile nacheinander, der nächste erscheint nach richtiger Lösung des vorigen
function baueKombi(el, a, opt){
  const z = a._z || (a._z = {geloest:false});
  el.classList.add('af-kombi');
  el.innerHTML = erinnerungHTML(a) + (a.material ? `<div class="material">${a.material}</div>` : '')
    + (a.frage ? `<p class="af-frage">${a.nr ? `<span class="af-nr">${a.nr}</span>` : ''}${a.frage}</p>` : '') + '<div class="af-teile"></div><div class="af-kende"></div>';

    const d = document.createElement('div'); d.className = 'af-teil'; box.appendChild(d);
    baue(d, T[i], {fertig:() => weiter(i)});
  }

    if (i + 1 < T.length){ if (box.children.length === i + 1){ zeige(i + 1); const n = box.children[i + 1]; if (n.scrollIntoView) n.scrollIntoView({behavior:'smooth', block:'nearest'}); } return; }

  while (i + 1 < T.length && T[i]._z && T[i]._z.geloest){ i++; zeige(i); }

}
const ctxVon = t => { const w = t.closest && t.closest('.af'); return w && w._af; };

let KW = null;   // offene Liste {inp, l (Treffer), i (markiert), box}

/* ---------- Sequenz (Erarbeitung aus Schritten) ---------- */

/* ---------- Endlos (zufällige Aufgaben je Stufe, Serie und Rekord) ---------- */

/* ---------- Training: Aufgaben auf Zeit und/oder endlos ---------- */
const trStufen = T => Array.isArray(T.stufen) && T.stufen.length ? T.stufen : [{name:'', szenarien:T.szenarien, woerterbuch:T.woerterbuch}];
const alternativen = s => String(s == null ? '' : s).split('|').map(x => x.trim()).filter(Boolean);
// Ablenker für Zahlen: eigene falsche Formeln zuerst, dann typische Fehler (±1, ±2, ±10, Ziffern vertauscht)
function zahlAblenker(l, falsch, runden){
  const d = Number.isInteger(l) ? 1 : runden ? Math.pow(10, -Math.max(0, runden - 1)) : 0.1;
  const r = x => Math.round(x * 1e9) / 1e9;
  const tausch = Number.isInteger(l) && Math.abs(l) >= 10 ? +String(Math.abs(l)).split('').reverse().join('') * Math.sign(l) : null;
  const kand = [...falsch, ...mischen([l + d, l - d, l + 2 * d, l - 2 * d, l + 10 * d, l - 10 * d, tausch].filter(x => x != null))].map(r);
  const aus = [];
  kand.forEach(x => { if (Math.abs(x - l) > 1e-9 && (l < 0 || x >= 0) && !aus.some(y => Math.abs(y - x) < 1e-9) && aus.length < 3) aus.push(x); });
  return aus;
}
// Aufgabengeber einer Stufe → () => {frage (HTML), loesung (Text), optionen (MC: [{t, ok}]), pruefe(text) → 'ok' | 'fast' | 'falsch', zahl}
function trGeber(st, T){
  const mc = (st.antwort || T.antwort) === 'mc';
  if (typeof st.neu === 'function') return () => {
    const a = st.neu({mc});
    if (!a.pruefe) a.pruefe = s => alternativen(a.loesung).some(n => norm(n) === norm(s)) ? 'ok' : 'falsch';
    return a;
  };
  if (Array.isArray(st.szenarien) && st.szenarien.length){
    if (!window.Formel) throw new Error('aufgaben.js: Training mit Szenarien braucht lib/formel.js');
    return () => {
      const sz = st.szenarien[Math.floor(Math.random() * st.szenarien.length)], w = Formel.wuerfle(sz);
      const txt = x => Formel.zahlText(x) + (sz.einheit ? ' ' + sz.einheit : '');
      const tol = sz.runden != null ? 0.5 * Math.pow(10, -sz.runden) + 1e-9 : 1e-6;
      return {frage:w.frage, loesung:txt(w.loesung), zahl:true,
        optionen:mc ? mischen([{t:txt(w.loesung), ok:true}, ...zahlAblenker(w.loesung, w.falsch, sz.runden).map(x => ({t:txt(x), ok:false}))]) : null,
        pruefe:s => { const z = zahl(String(s).replace(/−/g, '-')); return !isNaN(z) && Math.abs(z - w.loesung) <= tol ? 'ok' : 'falsch'; }};
    };
  }
  const W = st.woerterbuch || {}, E = (W.eintraege || []).filter(x => Array.isArray(x) && alternativen(x[0]).length && alternativen(x[1]).length);
  const sp = Array.isArray(W.sprachen) ? W.sprachen : [];
  let stapel = [], zuletzt = -1;
  return () => {
    if (!stapel.length){ stapel = mischen(E.map((_, i) => i)); if (stapel.length > 1 && stapel[stapel.length - 1] === zuletzt) stapel.unshift(stapel.pop()); }
    const i = zuletzt = stapel.pop(), rueck = W.richtung === 'b-a' || (W.richtung === 'beide' && Math.random() < 0.5);
    const von = alternativen(E[i][rueck ? 1 : 0]), nach = alternativen(E[i][rueck ? 0 : 1]);
    const kopf = sp[0] || sp[1] ? `<span class="tr-sprache">${esc(sp[rueck ? 1 : 0] || '')} → ${esc(sp[rueck ? 0 : 1] || '')}</span>` : '';
    let optionen = null;
    if (mc){
      const andere = [];
      mischen(E.filter((_, j) => j !== i)).forEach(x => { const t = alternativen(x[rueck ? 0 : 1])[0]; if (!nach.some(n => norm(n) === norm(t)) && !andere.some(a => norm(a) === norm(t))) andere.push(t); });
      optionen = mischen([{t:nach[0], ok:true}, ...andere.slice(0, 3).map(t => ({t, ok:false}))]);
    }
    return {frage:kopf + `<span class="tr-wort">${esc(von.join(' / '))}</span>`, loesung:nach.join(' / '), optionen,
      pruefe(s){
        const t = norm(s); if (!t) return 'falsch';
        if (nach.some(n => norm(n) === t)) return 'ok';
        const nah = nach.some(n => { const v = norm(n).replace(/ /g, ''); return abstand(t.replace(/ /g, ''), v) <= Math.max(1, Math.floor(v.length * 0.2)); });
        return nah ? (W.tippfehler ? 'ok' : 'fast') : 'falsch';
      }};
  };
}
function training(cfg){
  const root = typeof cfg.el === 'string' ? document.querySelector(cfg.el) : cfg.el, T = cfg.training || {}, ST = trStufen(T), KEY = cfg.key + '-training';
  let stand = {}; try { stand = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!stand.best) stand.best = {};
  const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); };
  const anzahl = T.anzahl > 0 ? Math.round(T.anzahl) : 0, endlos = !anzahl;

  let stufe = Math.min(Math.max(stand.stufe || 0, 0), ST.length - 1), gib = null, phase = 'start', akt = null, richtige = 0, nr = 0, fehler = [];
  let raf = 0, warte = 0, t0 = 0, dauer = 0;
  root.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="af-fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs></svg>'
    + '<div class="tr"><div class="af-kopf"><nav class="af-flammen" aria-label="Stufen"></nav><span class="tr-info"></span></div><div class="tr-karte" aria-live="polite"></div></div>';
  root.classList.add('af-training');
  const $ = s => root.querySelector(s), karte = $('.tr-karte'), lebt = () => root.isConnected;
  const variante = () => typeof T.variante === 'function' ? String(T.variante() || '') : '';
  const bestKey = () => { const v = variante(); return v ? stufe + ':' + v : stufe; };
  const best = () => stand.best[bestKey()] || 0;
  const zeitText = s => String(Math.round(s * 100) / 100).replace('.', ',') + ' s';
  function kopf(){
    $('.af-flammen').innerHTML = ST.length > 1 ? ST.map((x, i) => `<button class="af-flamme${i === stufe ? ' on' : ''}" type="button" data-trstufe="${i}" title="Stufe ${i + 1}${x.name ? ': ' + esc(x.name) : ''}" aria-label="Stufe ${i + 1}${x.name ? ': ' + esc(x.name) : ''}" aria-pressed="${i === stufe}">${FLAMME(i + 1)}</button>`).join('') : '';
    const v = variante() ? ` <span class="muted">(${esc(variante())})</span>` : '';
    $('.tr-info').innerHTML = phase === 'start' || phase === 'ende' ? `Bestleistung${v}: <b>${best()}</b>${endlos ? '' : ' von ' + anzahl}`
      : endlos ? `🔥 Serie: <b>${richtige}</b> <span class="muted">· Bestleistung ${best()}</span>` : `Aufgabe ${nr} von ${anzahl} <span class="muted">· ✓ ${richtige}</span>`;
  }
  function halt(){ cancelAnimationFrame(raf); clearTimeout(warte); }
  function startBild(){
    halt(); phase = 'start'; modusVon(stufe);
    try { gib = trGeber(ST[stufe], T); } catch (e) { karte.innerHTML = `<p class="af-fb falsch">${esc(e.message)}</p>`; return; }
    const name = ST[stufe].name ? `<h2 class="tr-titel">${ST.length > 1 ? `Stufe ${stufe + 1}: ` : ''}${esc(ST[stufe].name)}</h2>` : '';
    const zeit = Z ? `Für jede Aufgabe hast du <b>${zeitText(Z.start)}</b>${Z.schritt < 0 ? `, nach jeder richtigen Antwort ${zeitText(-Z.schritt)} weniger (mindestens ${zeitText(Z.min)})` : Z.schritt > 0 ? `, nach jeder richtigen Antwort ${zeitText(Z.schritt)} mehr` : ''}.` : 'Ohne Zeitdruck.';
    karte.innerHTML = name + `<ul class="tr-regeln"><li>${endlos ? 'Endlos: Wie lang wird deine Serie? Ein Fehler beendet sie.' : `${anzahl} Aufgaben – wie viele schaffst du?`}</li><li>${zeit}</li><li>${mc ? 'Klicke die richtige Antwort an (oder Taste 1–4).' : 'Tippe die Antwort ein und drücke Enter.'}${T.versuche ? ' Bei einem Fehler darfst du es nochmal versuchen.' : ''}</li></ul>`
      + `<button class="btn haupt tr-start" type="button">▶ Start</button>`;
    kopf(); const b = $('.tr-start'); if (b && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) b.focus({preventScroll:true});
  }

      + (mc ? `<div class="tr-mc">${akt.optionen.map((o, i) => `<button class="tr-opt" type="button" data-tropt="${i}"><span class="tr-taste">${i + 1}</span>${esc(o.t)}</button>`).join('')}</div>`

    rk.innerHTML = `${grund === 'zeit' ? '⏱ Zeit abgelaufen.' : grund === 'fast' ? 'Fast – achte auf die Schreibweise.' : '✗ Leider falsch.'} Richtig ist: <b>${esc(akt.loesung)}</b> <span class="muted">(Enter: weiter)</span>`;

    const liste = fehler.length ? `<details class="tr-fehler"${endlos ? ' open' : ''}><summary>${endlos ? 'Daran lag es' : `Fehler (${fehler.length})`}</summary><table><tr><th>Aufgabe</th><th>deine Antwort</th><th>richtig</th></tr>${fehler.slice(-12).map(f => `<tr><td>${f.frage}</td><td>${f.zeit ? '⏱' : f.eingabe ? esc(f.eingabe) : '–'}</td><td><b>${esc(f.loesung)}</b></td></tr>`).join('')}</table></details>` : '';
    karte.innerHTML = `<h2 class="tr-ergebnis">${endlos ? `Serie: ${richtige}` : `${richtige} von ${anzahl} richtig`}</h2>`
      + `<p>${neu ? '🎉 <b>Neue Bestleistung!</b>' : `Bestleistung: ${alt}${endlos ? '' : ' von ' + anzahl}`}</p>` + liste
      + `<button class="btn haupt tr-start" type="button">↻ ${endlos ? 'Neue Serie' : 'Nochmal'}</button>`;
    kopf(); $('.tr-start').focus({preventScroll:true});

  }
  root.addEventListener('click', e => {
    const f = e.target.closest('[data-trstufe]'); if (f){ stufe = +f.dataset.trstufe; stand.stufe = stufe; speichern(); return startBild(); }
    if (e.target.closest('.tr-start')) return starte();
    const o = e.target.closest('[data-tropt]'); if (o && !o.disabled) return antwort(null, +o.dataset.tropt);

  function absenden(){ const e = $('.tr-ein'); if (!e) return; if (phase === 'loesung') return weiter(); if (e.value.trim()) antwort(e.value); }
  function taste(e){
    if (!lebt()){ document.removeEventListener('keydown', taste); return; }
