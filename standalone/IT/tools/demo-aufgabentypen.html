  {
   "kurz": "Szenario",
   "titel": "Szenario (chat mit Verzweigungen)",
   "html": "<h2>Szenario (chat mit Verzweigungen)<\/h2><p class=\"info\">Der Lern-Chat kann jetzt verzweigen: Entscheidungen führen zu unterschiedlichen Verläufen, zum Beispiel bei einer Kreditberatung oder einem Datenschutz-Fall. Alte Chats laufen unverändert.<\/p><h3>So arbeiten die Schüler<\/h3><p>Wie im Lern-Chat: Knöpfe antippen oder Antworten eintippen. Je nach Antwort geht das Gespräch anders weiter.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>💬 Lern-Chat<\/b> anklicken und <b>🗺 Szenario visuell bauen …<\/b> wählen: Dort setzt du die Nachrichten als Kästen zusammen und ziehst Pfeile zwischen ihnen. Oder den Schalter „Szenario (Verzweigungen)“ einschalten, Nachrichten eine <b>Marke<\/b> geben und bei Antworten „weiter zu“ dieser Marke wählen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>\"id\": \"marke\"<\/code> an einer Nachricht: Sprungziel<\/li><li><code>\"weiter\": \"marke\"<\/code> an einem Antwort-Knopf oder einer Nachricht: dorthin springen statt zur nächsten Nachricht<\/li><li><code>\"ende\": true<\/code>: Der Chat endet hier<\/li><li>Hat kein Knopf <code>\"ok\": true<\/code>, ist es eine Entscheidung ohne richtig und falsch<\/li><li>Text mit Marke als Objekt: <code>{\"bot\": \"Text\", \"id\": \"marke\"}<\/code><\/li><\/ul><p><b>Achte darauf:<\/b> Jeder Zweig braucht ein Ende – entweder eine Nachricht mit „Ende“ oder einen Sprung zu einem gemeinsamen Schluss. Sonst läuft der Chat einfach in den nächsten Zweig weiter.<\/p><h3>Das Szenario unten als Bild<\/h3><p>So zeigt es auch der Baukasten unter „🗺 Szenario visuell bauen …“: Jeder Kasten ist eine Nachricht, jeder Pfeil führt zur nächsten. ● ist ein Anschluss, ■ ein Ende, ein gestrichelter Pfeil springt zurück.<\/p><div class=\"sz-bild\"><\/div><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"chat\",\n \"name\": \"Szenario-Hilfe\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"nachrichten\": [ \"Hallo! Ich bin selbst ein Szenario und zeige dir, wie ich gebaut bin.\", { \"id\": \"menue\", \"bot\": \"Was möchtest du wissen?\", \"antworten\": [ { \"t\": \"Wie springe ich?\", \"weiter\": \"sprung\" }, { \"t\": \"Was ist eine Entscheidung?\", \"weiter\": \"wahl\" }, { \"t\": \"Wie endet ein Chat?\", \"weiter\": \"schluss\" } ] }, { \"id\": \"sprung\", \"bot\": \"Diese Nachricht hat die Marke &lt;code&gt;sprung&lt;/code&gt;. Der Knopf, den du gedrückt hast, hat &lt;code&gt;\\\"weiter\\\": \\\"sprung\\\"&lt;/code&gt;.\" }, { \"bot\": \"Wohin geht es ohne &lt;code&gt;weiter&lt;/code&gt;?\", \"antworten\": [ { \"t\": \"zur nächsten Nachricht\", \"ok\": true, \"r\": \"Genau, einfach der Reihe nach.\" }, { \"t\": \"zum Anfang\", \"r\": \"Nein: Ohne &lt;code&gt;weiter&lt;/code&gt; kommt die nächste Nachricht.\" } ], \"weiter\": \"menue\" }, { \"id\": \"wahl\", \"bot\": \"Die Frage „Was möchtest du wissen?“ ist eine Entscheidung: Kein Knopf hat &lt;code&gt;\\\"ok\\\": true&lt;/code&gt;. Sie zählt nicht als Frage und wird nicht als richtig oder falsch gewertet.\", \"weiter\": \"menue\" }, { \"id\": \"schluss\", \"bot\": \"Eine Nachricht mit &lt;code&gt;\\\"ende\\\": true&lt;/code&gt; beendet den Chat – so wie diese. Mit „Noch einmal“ kannst du die anderen Wege gehen.\", \"ende\": true }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "chat",
     "name": "Szenario-Hilfe",
     "bild": "🧭",
     "nachrichten": [
      "Hallo! Ich bin selbst ein Szenario und zeige dir, wie ich gebaut bin.",
      {
       "id": "menue",
       "bot": "Was möchtest du wissen?",
       "antworten": [
        {
         "t": "Wie springe ich?",
         "weiter": "sprung"
        },
        {
         "t": "Was ist eine Entscheidung?",
         "weiter": "wahl"
        },
        {
         "t": "Wie endet ein Chat?",
         "weiter": "schluss"
        }
       ]
      },
      {
       "id": "sprung",
       "bot": "Diese Nachricht hat die Marke <code>sprung<\/code>. Der Knopf, den du gedrückt hast, hat <code>\"weiter\": \"sprung\"<\/code>."
      },
      {
       "bot": "Wohin geht es ohne <code>weiter<\/code>?",
       "antworten": [
        {
         "t": "zur nächsten Nachricht",
         "ok": true,
         "r": "Genau, einfach der Reihe nach."
        },
        {

   "kurz": "Kombi",
   "titel": "Kombinierte Aufgabe (kombi)",
   "html": "<h2>Kombinierte Aufgabe (kombi)<\/h2><p class=\"info\">Für Aufgaben in mehreren Schritten: erst rechnen, dann buchen, dann beurteilen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Zuerst ist nur Teil 1 zu sehen. Jeder weitere Teil erscheint, sobald der vorige richtig gelöst ist.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🧩 Kombinierte Aufgabe<\/b> (unter „Kombinieren“) anklicken und Bausteine in die Zone „＋ Teil …“ ziehen. Oder einen Baustein auf eine vorhandene Aufgabe ziehen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>teile<\/code>: Liste von mindestens zwei Aufgaben beliebigen Typs (keine Kombi in der Kombi)<\/li><li><code>frage<\/code>, <code>material<\/code>, <code>ok<\/code> der Kombi stehen über bzw. unter allen Teilen<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"kombi\",\n \"frage\": \"Diese Aufgabe besteht aus zwei Teilen.\",\n \"ok\": \"Beide Teile gelöst.\",\n \"teile\": [ { \"typ\": \"zahlen\", \"frage\": \"Teil 1: Wie viele Teile braucht eine kombinierte Aufgabe mindestens?\", \"felder\": [ { \"t\": \"Anzahl\", \"l\": 2, \"h\": \"Mit nur einem Teil wäre es eine einfache Aufgabe.\" } ] }, { \"typ\": \"mc\", \"frage\": \"Teil 2: Wann ist dieser zweite Teil erschienen?\", \"options\": [ \"als Teil 1 richtig gelöst war\", \"sofort beim Öffnen\", \"nach dem ersten Versuch, egal ob richtig\" ], \"correct\": [ 0 ] }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Verbessern",
   "titel": "Fehler verbessern (verbessern)",
   "html": "<h2>Fehler verbessern (verbessern)<\/h2><p class=\"info\">Fehlersuche wie in den Bereichen HTML und Python, aber für beliebige Texte: Rechtschreibung, Grammatik, Code, Buchungssätze.<\/p><h3>So arbeiten die Schüler<\/h3><p>Erst die Zeile mit dem Fehler anklicken. Dann in dieser Zeile alle falschen Stellen anklicken (nochmal klicken wählt wieder ab) und „Prüfen“. Zum Schluss die Stellen verbessern und wieder „Prüfen“. Bei nur einer Zeile entfällt der erste Schritt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🩹 Fehler verbessern<\/b> anklicken und den Text mit den eingebauten Fehlern eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>text<\/code>: reiner Text, Zeilen mit <code>\\n<\/code>, Fehler als <code>[[falsch|richtig]]<\/code> – das <b>Falsche zuerst<\/b>, es wird angezeigt<\/li><li>weitere richtige Lösungen anhängen: <code>[[falsch|richtig|auch richtig]]<\/code>; <code>[[zu viel|]]<\/code> = Stelle löschen<\/li><li>Stellen sind Wörter (durch Leerzeichen getrennt); ein Fehler mitten im Wort braucht eine eigene Klammer: <code>Titel[[&lt;/h2&gt;|&lt;/h1&gt;]]<\/code><\/li><li><code>\"mono\": true<\/code>: Code, <code>\"gross\": false<\/code>: Groß/klein egal, <code>h<\/code>: Hinweis<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"verbessern\",\n \"frage\": \"In dieser Anleitung stecken drei Fehler. Finde und verbessere sie.\",\n \"text\": \"Fehler stehen in [[einfachen|doppelten]] eckigen Klammern.\\nIn der Klammer steht zuerst das [[Richtige|Falsche]] und danach die Verbesserung.\\nDie Schüler klicken zuerst die Zeile mit dem Fehler an.\\nGetrennt wird mit einem senkrechten [[Komma|Strich]].\",\n \"gross\": false,\n \"h\": \"Lies oben unter „Im JSON“ nach.\",\n \"ok\": \"Alle drei Fehler verbessert – so funktioniert der Typ.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

    {
     "typ": "verbessern",
     "frage": "In dieser Anleitung stecken drei Fehler. Finde und verbessere sie.",

     "gross": false,
     "h": "Lies oben unter „Im JSON“ nach.",
     "ok": "Alle drei Fehler verbessert – so funktioniert der Typ."
    }

   "kurz": "Kreuzwort",
   "titel": "Kreuzworträtsel (kreuzwort)",
   "html": "<h2>Kreuzworträtsel (kreuzwort)<\/h2><p class=\"info\">Zum Wiederholen von Fachbegriffen. Sparsam einsetzen: Es kostet die Schüler viel Zeit für wenige Begriffe.<\/p><h3>So arbeiten die Schüler<\/h3><p>Ein Feld oder einen Hinweis anklicken und tippen, der Cursor springt weiter. Leertaste oder nochmaliges Antippen wechselt zwischen waagrecht und senkrecht, die Pfeiltasten bewegen den Cursor. „Prüfen“ färbt falsche Buchstaben rot.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🔠 Kreuzworträtsel<\/b> anklicken und je Zeile Lösungswort und Hinweis eintragen. Das Gitter entsteht von selbst und sieht immer gleich aus.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>woerter<\/code>: Liste aus <code>{\"w\": \"Wort\", \"t\": \"Hinweis\"}<\/code>, 2 bis 25 Wörter<\/li><li>Buchstaben A–Z, Ä, Ö, Ü; ß wird SS, Leerzeichen und Bindestriche entfallen<\/li><li>Wörter ohne gemeinsamen Buchstaben stehen einzeln unter dem Gitter<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"kreuzwort\",\n \"frage\": \"Löse das Rätsel rund um das Kreuzworträtsel.\",\n \"woerter\": [ { \"w\": \"Gitter\", \"t\": \"Es entsteht von selbst aus der Wortliste\" }, { \"w\": \"Hinweis\", \"t\": \"Das steht im Feld t\" }, { \"w\": \"Leertaste\", \"t\": \"Wechselt die Schreibrichtung\" }, { \"w\": \"Baukasten\", \"t\": \"Dort stellst du die Aufgabe zusammen\" }, { \"w\": \"Senkrecht\", \"t\": \"Von oben nach unten\" }, { \"w\": \"Umlaut\", \"t\": \"Ä, Ö oder Ü: ein … bekommt ein eigenes Feld\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Training",
   "titel": "Training: feste Runde (Schritt mit training)",
   "html": "<h2>Training: feste Runde (Schritt mit training)<\/h2><p class=\"info\">Für Drill: Kopfrechnen oder Vokabeln, eine Aufgabe nach der anderen. Das Training hat viele Schalter – diese und die nächsten drei Seiten zeigen sie der Reihe nach. Hier: eine <b>feste Runde<\/b> ohne Zeit, mit <b>mehreren Versuchen<\/b>, Antworten zum <b>Eintippen<\/b>.<\/p><h3>So arbeiten die Schüler<\/h3><p>„Start“ drücken, Antwort eintippen und Enter. Weil „Mehrere Versuche“ an ist, darf eine falsche Antwort korrigiert werden; „Weiß ich nicht“ zeigt die Lösung. Am Ende stehen Ergebnis, Bestleistung und die Fehler.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links ganz oben <b>⏱ Training (Zeit / endlos)<\/b> anklicken. Das Training ist kein Aufgabentyp, sondern ein eigener Schritt und steht allein auf seiner Seite. Im Formular „Aufgaben pro Runde“ eintragen, die Schalter „Zeit“ aus und „Mehrere Versuche“ an. Die Zahlen-Aufgaben entstehen aus Vorlagen mit Zufallswerten.<\/p><p><b>Im JSON:<\/b><\/p><ul><li>Schritt mit <code>training<\/code> statt <code>aufgaben<\/code><\/li><li><code>\"antwort\": \"eingabe\"<\/code>: eintippen (oder <code>\"mc\"<\/code>: aus vier Antworten wählen)<\/li><li><code>anzahl<\/code>: Aufgaben pro Runde; weglassen = endlos<\/li><li><code>\"versuche\": true<\/code>: falsche Antworten dürfen korrigiert werden<\/li><li><code>ziel<\/code>: so viele richtige zählen den Schritt als erledigt (hier 4 von 6)<\/li><li><code>szenarien<\/code>: Vorlagen für Zahlen-Aufgaben, es wird zufällig eine gewählt<\/li><li>Im Szenario: <code>frage<\/code> mit <code>{a}<\/code> (Wert) oder <code>{=a*b}<\/code> (Rechnung), <code>loesung<\/code> als Formel<\/li><li><code>werte<\/code>: <code>[von, bis]<\/code>, <code>[von, bis, Schritt]<\/code>, <code>{\"aus\": [2, 5, 10]}<\/code> oder eine Formel aus früheren Werten<\/li><li><code>bedingung<\/code>: es wird neu gewürfelt, bis sie stimmt; <code>runden<\/code>: Nachkommastellen; <code>einheit<\/code><\/li><\/ul><details><summary>JSON dieses Schritts anzeigen<\/summary><pre>{\n \"kurz\": \"Training\",\n \"titel\": \"Training\",\n \"training\": { \"antwort\": \"eingabe\", \"anzahl\": 6, \"versuche\": true, \"ziel\": 4, \"szenarien\": [ { \"frage\": \"{a} · {b} =\", \"werte\": { \"a\": [ 2, 9 ], \"b\": [ 2, 9 ] }, \"loesung\": \"a * b\" }, { \"frage\": \"{a} − {b} =\", \"werte\": { \"a\": [ 10, 50 ], \"b\": [ 1, 40 ] }, \"bedingung\": \"b &lt; a\", \"loesung\": \"a - b\" }, { \"frage\": \"{p} % von {g} € =\", \"werte\": { \"p\": { \"aus\": [ 10, 20, 25, 50 ] }, \"g\": [ 20, 200, 20 ] }, \"loesung\": \"g * p / 100\", \"einheit\": \"€\" }, { \"frage\": \"{n} Hefte kosten {=n*preis} €. Ein Heft kostet\", \"werte\": { \"n\": [ 2, 6 ], \"preis\": [ 0.5, 2.5, 0.25 ] }, \"loesung\": \"preis\", \"runden\": 2, \"einheit\": \"€\" } ]\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Training Zeit",
   "titel": "Training: endlos auf Zeit, Antworten auswählen",
   "html": "<h2>Training: endlos auf Zeit, Antworten auswählen<\/h2><p class=\"info\">Dieselbe Art Training, aber <b>endlos<\/b> (Serie und Bestleistung), <b>auf Zeit<\/b> und mit <b>Antworten zum Auswählen<\/b>.<\/p><h3>So arbeiten die Schüler<\/h3><p>Der Balken läuft ab. Antwort anklicken oder Taste 1 bis 4 drücken. Nach jeder richtigen Antwort wird die Zeit etwas kürzer. Ein Fehler oder abgelaufene Zeit beendet die Serie.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links ganz oben <b>⏱ Training (Zeit / endlos)<\/b> anklicken. Das Training ist kein Aufgabentyp, sondern ein eigener Schritt und steht allein auf seiner Seite. „Aufgaben pro Runde“ leer lassen (= endlos), Schalter „Zeit“ an und die drei Zeitwerte eintragen, Antwortform „Auswählen“.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>anzahl<\/code> fehlt: endlos, gezählt wird die Serie; ein Fehler beendet sie<\/li><li><code>zeit<\/code>: <code>start<\/code> = Sekunden für die erste Aufgabe, <code>schritt<\/code> = Änderung je richtiger Antwort (negativ = schneller), <code>min<\/code> = kürzeste Zeit<\/li><li><code>\"antwort\": \"mc\"<\/code>: vier Antworten, die falschen entstehen von selbst (knapp daneben, Ziffern vertauscht)<\/li><li><code>falsch<\/code> im Szenario: typische falsche Rechnungen als Formeln – sie erscheinen als Antworten<\/li><li><code>ziel<\/code>: Serie, ab der der Schritt als erledigt gilt (Standard bei endlos: 10, hier 5)<\/li><\/ul><details><summary>JSON dieses Schritts anzeigen<\/summary><pre>{\n \"kurz\": \"Training Zeit\",\n \"titel\": \"Training\",\n \"training\": { \"antwort\": \"mc\", \"zeit\": { \"start\": 8, \"schritt\": -0.3, \"min\": 3 }, \"ziel\": 5, \"szenarien\": [ { \"frage\": \"{a} · {b} =\", \"werte\": { \"a\": [ 3, 9 ], \"b\": [ 3, 9 ] }, \"loesung\": \"a * b\", \"falsch\": [ \"a + b\", \"a * b + a\" ] }, { \"frage\": \"{a} + {b} · {c} =\", \"werte\": { \"a\": [ 2, 9 ], \"b\": [ 2, 5 ], \"c\": [ 2, 5 ] }, \"loesung\": \"a + b * c\", \"falsch\": [ \"(a + b) * c\" ] } ]\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

  {
   "kurz": "Training Vokabeln",
   "titel": "Training: Vokabeln (Wörterbuch)",
   "html": "<h2>Training: Vokabeln (Wörterbuch)<\/h2><p class=\"info\">Statt Zahlen ein <b>Wörterbuch<\/b>: Vokabeln oder Begriffspaare, in eine oder beide Richtungen, mit Tippfehler-Erkennung.<\/p><h3>So arbeiten die Schüler<\/h3><p>Das Wort erscheint, die Übersetzung wird eingetippt. Gibt es mehrere richtige Wörter, reicht eines. Ein kleiner Tippfehler zählt hier als richtig. Jedes Wort kommt einmal, dann beginnt der Stapel neu gemischt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links ganz oben <b>⏱ Training (Zeit / endlos)<\/b> anklicken. Das Training ist kein Aufgabentyp, sondern ein eigener Schritt und steht allein auf seiner Seite. Bei „Inhalt“ auf „Vokabeln“ umschalten. Die Liste lässt sich aus Excel, Quizlet oder Anki einfügen (Tab, Semikolon oder „=“ zwischen den Seiten).<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>woerterbuch<\/code> statt <code>szenarien<\/code><\/li><li><code>eintraege<\/code>: <code>[[\"house\", \"Haus|Gebäude\"], …]<\/code> – <code>|<\/code> trennt mehrere richtige Antworten<\/li><li><code>sprachen<\/code>: die zwei Namen, erscheinen über dem Wort<\/li><li><code>richtung<\/code>: <code>\"a-b\"<\/code>, <code>\"b-a\"<\/code> oder <code>\"beide\"<\/code> (zufällig)<\/li><li><code>\"tippfehler\": true<\/code>: fast richtig zählt als richtig (sonst „Fast – achte auf die Schreibweise“)<\/li><li>Mit <code>\"antwort\": \"mc\"<\/code> braucht das Wörterbuch mindestens 4 Einträge; die falschen Antworten kommen aus den anderen Einträgen<\/li><\/ul><details><summary>JSON dieses Schritts anzeigen<\/summary><pre>{\n \"kurz\": \"Training Vokabeln\",\n \"titel\": \"Training\",\n \"training\": { \"antwort\": \"eingabe\", \"anzahl\": 8, \"versuche\": true, \"woerterbuch\": { \"sprachen\": [ \"Englisch\", \"Deutsch\" ], \"richtung\": \"beide\", \"tippfehler\": true, \"eintraege\": [ [ \"task\", \"Aufgabe\" ], [ \"answer\", \"Antwort|Lösung\" ], [ \"step\", \"Schritt\" ], [ \"level\", \"Stufe|Level\" ], [ \"time\", \"Zeit\" ], [ \"mistake|error\", \"Fehler\" ], [ \"streak\", \"Serie\" ], [ \"practice\", \"Übung|Training\" ] ] }\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "titel": "Training: Stufen mit eigener Antwortform und Zeit",
   "html": "<h2>Training: Stufen mit eigener Antwortform und Zeit<\/h2><p class=\"info\">Mehrere <b>Stufen<\/b> in einem Training. Jede Stufe kann eigenen Inhalt, eine eigene Antwortform und eine eigene Zeit haben – zum Beispiel erst auswählen, dann eintippen, dann beides auf Zeit.<\/p><h3>So arbeiten die Schüler<\/h3><p>Oben die Stufe wählen (Flammen), dann „Start“. Die Bestleistung wird je Stufe gemerkt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links ganz oben <b>⏱ Training (Zeit / endlos)<\/b> anklicken. Das Training ist kein Aufgabentyp, sondern ein eigener Schritt und steht allein auf seiner Seite. Im Formular „＋ Stufe“ anklicken. Je Stufe Name, Inhalt, Antwortform und Zeit einstellen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>stufen<\/code>: Liste aus <code>{\"name\": \"…\", \"szenarien\": […]}<\/code> oder <code>{\"name\": \"…\", \"woerterbuch\": {…}}<\/code><\/li><li>Jede Stufe darf eigenes <code>antwort<\/code> und <code>zeit<\/code> haben; <code>\"zeit\": null<\/code> = diese Stufe ohne Zeit<\/li><li>Was in der Stufe fehlt, gilt vom Training (hier: Eintippen, 6 Sekunden)<\/li><li><code>anzahl<\/code>, <code>versuche<\/code> und <code>ziel<\/code> gelten für alle Stufen gemeinsam<\/li><\/ul><details><summary>JSON dieses Schritts anzeigen<\/summary><pre>{\n \"kurz\": \"Training Stufen\",\n \"titel\": \"Training\",\n \"training\": { \"antwort\": \"eingabe\", \"anzahl\": 5, \"zeit\": { \"start\": 6, \"schritt\": 0, \"min\": 6 }, \"stufen\": [ { \"name\": \"Auswählen ohne Zeit\", \"antwort\": \"mc\", \"zeit\": null, \"szenarien\": [ { \"frage\": \"{a} + {b} =\", \"werte\": { \"a\": [ 10, 60 ], \"b\": [ 10, 39 ] }, \"loesung\": \"a + b\", \"falsch\": [ \"a + b + 10\", \"a + b - 10\" ] } ] }, { \"name\": \"Auswählen auf Zeit\", \"antwort\": \"mc\", \"szenarien\": [ { \"frage\": \"{a} + {b} =\", \"werte\": { \"a\": [ 10, 60 ], \"b\": [ 10, 39 ] }, \"loesung\": \"a + b\", \"falsch\": [ \"a + b + 10\", \"a + b - 10\" ] } ] }, { \"name\": \"Eintippen ohne Zeit\", \"zeit\": null, \"szenarien\": [ { \"frage\": \"{a} + {b} =\", \"werte\": { \"a\": [ 10, 60 ], \"b\": [ 10, 39 ] }, \"loesung\": \"a + b\" } ] }, { \"name\": \"Eintippen auf Zeit\", \"szenarien\": [ { \"frage\": \"{a} + {b} =\", \"werte\": { \"a\": [ 10, 60 ], \"b\": [ 10, 39 ] }, \"loesung\": \"a + b\" } ] }, { \"name\": \"Vokabeln auswählen, 4 Sekunden\", \"antwort\": \"mc\", \"zeit\": { \"start\": 4, \"schritt\": 0, \"min\": 4 }, \"woerterbuch\": { \"sprachen\": [ \"Englisch\", \"Deutsch\" ], \"richtung\": \"a-b\", \"eintraege\": [ [ \"task\", \"Aufgabe\" ], [ \"answer\", \"Antwort\" ], [ \"step\", \"Schritt\" ], [ \"level\", \"Stufe\" ], [ \"time\", \"Zeit\" ], [ \"mistake\", \"Fehler\" ] ] } } ]\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "titel": "Reihenfolge (reihenfolge)",
   "html": "<h2>Reihenfolge (reihenfolge) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für Abläufe und Schemata: Kalkulationsschema, Schritte eines Verfahrens, Zeilen eines Programms.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die Karten erscheinen gemischt. Sie lassen sich ziehen, mit ▲ ▼ verschieben oder man tippt erst eine Karte und dann die Zielstelle an. „Prüfen“ zeigt, welche Karten schon richtig stehen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>⇅ Reihenfolge<\/b> anklicken, die Karten in der richtigen Reihenfolge eintragen. Der Schalter „Code“ zeigt die Karten in Schreibmaschinenschrift und behält die Einrückung.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>karten<\/code>: die Texte in der <b>richtigen<\/b> Reihenfolge, gemischt wird von selbst<\/li><li><code>\"mono\": true<\/code>: Karten sind reiner Text (Codezeilen)<\/li><li><code>h<\/code>: Hinweis bei falscher Reihenfolge<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"reihenfolge\",\n \"frage\": \"Bringe die Schritte in die richtige Reihenfolge: So entsteht eine Reihenfolge-Aufgabe.\",\n \"karten\": [ \"Tools → Übung erstellen öffnen\", \"Links unter „Experimentell (β)“ den Baustein „Reihenfolge“ anklicken\", \"Aufgabenstellung eintragen\", \"Karten in der richtigen Reihenfolge eintragen\", \"Mit „Vorschau“ ausprobieren\", \"Herunterladen oder einreichen\"\n ],\n \"h\": \"Erst öffnen, dann den Baustein wählen, zuletzt herunterladen.\",\n \"ok\": \"Genau so entsteht die Aufgabe.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Offen",
   "titel": "Offene Antwort (offen)",
   "html": "<h2>Offene Antwort (offen) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für „Begründe“, „Beurteile“, „Erläutere“: Antworten, die sich nicht automatisch prüfen lassen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Sie schreiben ihre Antwort, lassen sich die Musterlösung zeigen und haken ab, welche Punkte ihre Antwort enthält. Danach können sie die Antwort überarbeiten oder die Selbstkontrolle abschließen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>📝 Offene Antwort<\/b> anklicken, Musterlösung eintragen und je Zeile ein Kriterium zum Abhaken.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>muster<\/code>: Musterlösung (Formatierung erlaubt)<\/li><li><code>kriterien<\/code>: Liste zum Abhaken (kann fehlen)<\/li><li><code>zeilen<\/code>: Höhe des Textfelds, <code>min<\/code>: Mindestzahl Zeichen<\/li><\/ul><p><b>Wichtig:<\/b> Die Aufgabe gilt als gelöst, sobald die Selbstkontrolle abgeschlossen ist, egal wie viele Haken gesetzt sind. Der Text wird nicht gespeichert und nicht an die Lehrkraft übertragen.<\/p><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"offen\",\n \"frage\": \"Erkläre in zwei Sätzen, wofür sich der Aufgabentyp „Offene Antwort“ eignet und wie die Antwort kontrolliert wird.\",\n \"min\": 30,\n \"muster\": \"&lt;p&gt;Der Typ eignet sich für Aufgaben, die eine eigene Formulierung verlangen, zum Beispiel Begründungen und Beurteilungen. Die Antwort wird nicht automatisch bewertet: Die Schüler vergleichen sie mit der Musterlösung und haken Kriterien ab.&lt;/p&gt;\",\n \"kriterien\": [ \"nennt Aufgaben mit eigener Formulierung (begründen, beurteilen …)\", \"sagt, dass nicht automatisch bewertet wird\", \"nennt Musterlösung und Kriterien zum Abhaken\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Markieren",
   "titel": "Markieren (markieren)",
   "html": "<h2>Markieren (markieren) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für „Finde alle …“: Wortarten, Fachbegriffe, Bestandteile eines Belegs, Zeilen eines Programms.<\/p><h3>So arbeiten die Schüler<\/h3><p>Sie klicken die gesuchten Wörter oder Zeilen an, ein zweiter Klick hebt die Markierung auf. Nach „Prüfen“ bleiben richtige Stellen grün, falsche werden rot und wieder abgewählt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🖍 Markieren<\/b> anklicken und den Text eintragen. Jede gesuchte Stelle kommt in doppelte eckige Klammern. Oben wählst du, ob Wörter oder ganze Zeilen angeklickt werden.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>text<\/code>: reiner Text, gesuchte Stellen als <code>[[so]]<\/code>, neue Zeile mit <code>\\n<\/code><\/li><li><code>\"einheit\": \"zeile\"<\/code>: ganze Zeilen anklicken (gesucht ist jede Zeile mit <code>[[<\/code>)<\/li><li><code>\"mono\": true<\/code>: Code, <code>\"anzahl\": false<\/code>: Anzahl nicht verraten, <code>h<\/code>: Hinweis<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"markieren\",\n \"frage\": \"Markiere alle Feldnamen, die es beim Typ „Markieren“ gibt.\",\n \"text\": \"Der Text der Aufgabe steht im Feld [[text]]. Mit [[einheit]] legst du fest, ob Wörter oder Zeilen angeklickt werden. Für Code gibt es [[mono]], und mit [[anzahl]] verschweigst du, wie viele Stellen gesucht sind. Das Feld karten gehört dagegen zu einem anderen Typ.\",\n \"h\": \"Gesucht sind vier Feldnamen.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "titel": "Bild beschriften (beschriften)",
   "html": "<h2>Bild beschriften (beschriften) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für Abbildungen: Bestandteile eines Belegs, Oberfläche eines Programms, Hardware, Diagramme.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die Begriffe liegen in der Wortbank. Sie werden auf die nummerierten Punkte im Bild gezogen (oder: erst Begriff, dann Punkt antippen). Richtige bleiben liegen, falsche wandern zurück.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🏷 Bild beschriften<\/b> anklicken, mit „Bild auswählen“ ein Bild hochladen (es wird verkleinert und eingebettet) und für jeden Punkt ins Bild klicken. Den Begriff trägst du in der Liste darunter ein.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>bild<\/code>: eingebettetes Bild (<code>data:image/…;base64,…<\/code>, höchstens 600 kB)<\/li><li><code>punkte<\/code>: je <code>x<\/code> und <code>y<\/code> in Prozent von links und oben, <code>t<\/code> = Begriff<\/li><li><code>extra<\/code>: weitere Begriffe als Ablenker, <code>alt<\/code>: Bildbeschreibung<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"beschriften\",\n \"frage\": \"Das Bild zeigt, wie eine Beschriften-Aufgabe aufgebaut ist. Beschrifte die Teile.\",\n \"alt\": \"Schema einer Beschriften-Aufgabe: oben ein gestrichelter Kasten mit Kärtchen, darunter ein Bild mit zwei Kreisen, unten ein Knopf\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"punkte\": [ { \"x\": 80, \"y\": 18.5, \"t\": \"Wortbank\" }, { \"x\": 33, \"y\": 18.5, \"t\": \"Begriff zum Ziehen\" }, { \"x\": 51.5, \"y\": 40, \"t\": \"Punkt im Bild\" }, { \"x\": 15.5, \"y\": 86, \"t\": \"Knopf „Prüfen“\" }\n ],\n \"extra\": [ \"Musterlösung\", \"Lücke\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "html": "<h2>Blöcke bauen (bloecke) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Wie beim blockbasierten Programmieren: Formeln, Buchungssätze in Worten oder kurze Programme aus Bausteinen zusammensetzen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Einen Block antippen setzt ihn ans Ende, ein Block im Feld verschwindet beim Antippen wieder. Durch Ziehen landet ein Block an einer bestimmten Stelle (auf den Block ziehen, vor dem er stehen soll).<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🧱 Blöcke bauen<\/b> anklicken. Je Zeile einen Block für den Vorrat eintragen (auch Ablenker), darunter die Lösung in der richtigen Reihenfolge.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>bloecke<\/code>: Vorrat, <code>loesung<\/code>: Blöcke in der richtigen Reihenfolge (oder <code>loesungen<\/code>: mehrere Listen)<\/li><li><code>\"gleichwertig\": true<\/code>: jede rechnerisch gleichwertige Formel zählt, z. B. K · p oder p · K<\/li><li><code>start<\/code>: fester Text davor, <code>\"einmal\": true<\/code>: jeder Block nur einmal, <code>\"senkrecht\": true<\/code>: untereinander, <code>\"mono\": true<\/code>: Code<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"bloecke\",\n \"mono\": true,\n \"frage\": \"Baue den Anfang einer Blöcke-Aufgabe, so wie er im JSON steht.\",\n \"bloecke\": [ \"{\", \"}\", \"\\\"typ\\\"\", \"\\\"bloecke\\\"\", \"\\\"mc\\\"\", \":\", \",\", \"[\"\n ],\n \"loesung\": [ \"{\", \"\\\"typ\\\"\", \":\", \"\\\"bloecke\\\"\", \"}\"\n ],\n \"h\": \"Erst die geschweifte Klammer, dann Feldname, Doppelpunkt und Wert.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "html": "<h2>Karteikarten (karteikarten) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Zum Lernen von Begriffen und Definitionen, wenn die Schüler sich selbst einschätzen sollen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Karte lesen, umdrehen (Karte anklicken oder Knopf) und ehrlich „Gewusst“ oder „Nicht gewusst“ wählen. Nicht gewusste Karten kommen nach kurzer Zeit wieder. Fertig, wenn alle Karten gewusst sind.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🃏 Karteikarten<\/b> anklicken und je Karte Vorderseite und Rückseite eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>karten<\/code>: Liste aus <code>{\"v\": \"Vorderseite\", \"r\": \"Rückseite\"}<\/code> (Formatierung erlaubt)<\/li><li><code>\"mischen\": false<\/code>: Reihenfolge behalten<\/li><\/ul><p><b>Abgrenzung:<\/b> Für Vokabeln mit Eintippen oder auf Zeit passt der Baustein „⏱ Training“ besser, dort wird die Antwort geprüft.<\/p><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"karteikarten\",\n \"frage\": \"Lerne mit den Karten, wie man Karteikarten erstellt.\",\n \"karten\": [ { \"v\": \"In welchem Feld stehen die Karten?\", \"r\": \"&lt;code&gt;karten&lt;/code&gt;\" }, { \"v\": \"Wofür steht &lt;code&gt;v&lt;/code&gt;?\", \"r\": \"Vorderseite\" }, { \"v\": \"Wofür steht &lt;code&gt;r&lt;/code&gt;?\", \"r\": \"Rückseite\" }, { \"v\": \"Was passiert mit einer Karte, die nicht gewusst wurde?\", \"r\": \"Sie kommt nach etwa drei Karten wieder.\" }, { \"v\": \"Wann gilt die Aufgabe als gelöst?\", \"r\": \"Wenn alle Karten einmal gewusst wurden.\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",
