(function (K) {
  K.gruppen = [];
  K.faecher.forEach(f => (f.stufen
    ? f.stufen.map(s => ({pfad: f.id + '/' + s.id, fach: f, stufe: s, titel: f.titel + ' ' + (s.kurz || s.titel), text: s.text || f.text, bereiche: s.bereiche}))
    : [{pfad: f.id, fach: f, stufe: null, titel: f.titel, text: f.text, bereiche: f.bereiche}]).forEach(g => K.gruppen.push(g)));
  K.bereiche = [].concat(...K.gruppen.map(g => g.bereiche.map(b => Object.assign(b, {pfad: g.pfad + '/' + b.id, gruppe: g}))));
  // Tools eines Fachs für alle Jahrgangsstufen (Fach.tools): eigener Bereich mit Ordner = Fach
  K.faecher.forEach(f => {
    if (!f.stufen || !f.tools || !f.tools.length) return;
    const g = {pfad: f.id, fach: f, stufe: null, titel: f.titel, text: f.text, bereiche: []};
    K.bereiche.push({id: f.id.toLowerCase(), titel: f.titel, text: f.text, farbe: f.farbe, farbeHell: f.farbeHell, farbeSchrift: f.farbeSchrift,
      tools: f.tools, pfad: f.id, gruppe: g, fachweit: true});
  });
  (K.einreichungen || []).forEach(e => {
    const b = K.bereiche.find(x => x.id === e.bereich);
    if (b && e.tool && !b.tools.some(t => t.id === e.tool.id)) b.tools.push(e.tool);
  });
})(window.KATALOG);

<script>/* ../../nav.js */

 * Fährt man mit der Maus über einen Bereich (am Handy: antippen), klappen

      const t = theme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = t; tb.textContent = t === 'dark' ? SONNE : MOND;
      try { localStorage.setItem('wenn-theme', t); } catch (e) {}
    });

    // Geräte ohne Maus: erstes Antippen klappt auf, zweites öffnet die Bereichsseite
    const items = [...nav.querySelectorAll('.pf-item')];
    if (matchMedia('(hover: none)').matches) items.forEach(li => li.firstElementChild.addEventListener('click', e => {
      if (schmal() || li.classList.contains('open')) return;
      e.preventDefault();
      items.forEach(x => x.classList.toggle('open', x === li));
    }));
    // Untermenüs (gruppe): nach links aufklappen, wenn rechts kein Platz ist; ohne Maus erst antippen
    nav.querySelectorAll('.pf-sub').forEach(sub => {
      sub.addEventListener('mouseenter', () => {
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
      });
      if (matchMedia('(hover: none)').matches) sub.firstElementChild.addEventListener('click', e => {
        if (schmal() || sub.classList.contains('open')) return;
        e.preventDefault();
        const r = sub.getBoundingClientRect();
        sub.classList.toggle('links', r.right + 260 > innerWidth);
        sub.classList.add('open');
      });
    });
    document.addEventListener('click', e => { if (!nav.contains(e.target)){ nav.querySelectorAll('.pf-sub.open').forEach(x => x.classList.remove('open')); items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape'){ items.forEach(x => x.classList.remove('open')); nav.classList.remove('open'); } });
  }

  /* ---------- Übersichtsseiten ---------- */
  // Tools mit gruppe (katalog.js) stehen unter einer gemeinsamen Zwischenüberschrift
  function kacheln(b){
    if (!b.tools.length) return '<p class="pf-hinweis">Hier entstehen bald Übungen.</p>';
    const kachel = t => `<a class="pf-tile${t.bedingt ? ' pf-bedingt' : ''}"${t.bedingt ? ` data-tool="${esc(t.id)}"` : ''} href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`;
    return gruppen(b).map(g => (g.name ? `<h3 class="pf-gruppe">${esc(g.name)}</h3>` : '') + `<div class="pf-grid">${g.tools.map(kachel).join('')}</div>`).join('');
  }
  function buildPages(){
    const start = document.getElementById('pf-start');
    if (start){
      const gruppenseite = !!root.dataset.gruppe;
      if (gruppenseite) document.title = GRUPPE.titel + ' – ' + K.name;
      start.innerHTML = `<h1>${esc(gruppenseite ? GRUPPE.titel : K.name)}</h1><p class="pf-lead">${esc(GRUPPE.text)}${gruppenseite ? '' : ' ' + esc(K.untertitel)}</p>`
        + GRUPPE.bereiche.map(b => `<section class="pf-sec"><h2><a href="${bereichUrl(b)}">${esc(b.titel)}</a></h2><p class="pf-text">${esc(b.text)}</p>${kacheln(b)}</section>`).join('');
    }
    // Fach mit Jahrgangsstufen: Auswahl der Stufe
    const fach = document.getElementById('pf-fach');
    if (fach && FACHSEITE){
      document.title = FACHSEITE.titel + ' – ' + K.name;
      fach.innerHTML = `<h1>${esc(FACHSEITE.titel)}</h1><p class="pf-lead">${esc(FACHSEITE.text)} Wähle die Jahrgangsstufe.</p><div class="pf-grid">`
        + K.gruppen.filter(g => g.fach === FACHSEITE).map(g => `<a class="pf-tile" href="${gruppeUrl(g)}"><b>${esc(g.stufe.titel)}</b><span>${esc(g.text)}</span></a>`).join('') + '</div>'
        + (fachTools(FACHSEITE).length ? `<section class="pf-sec pf-fachtools"><h2>Für alle Jahrgangsstufen</h2><div class="pf-grid">${fachTools(FACHSEITE).map(([b, t]) => `<a class="pf-tile" href="${toolUrl(b, t)}"><b>${esc(t.titel)}</b><span>${esc(t.text)}</span></a>`).join('')}</div></section>` : '');
    }
    const be = document.getElementById('pf-bereich');
    const b = BER;
    if (be && b){
      document.title = b.titel + ' – ' + K.name;
      be.innerHTML = `<h1>${esc(b.titel)}</h1><p class="pf-lead">${esc(b.text)}</p>${kacheln(b)}`;
    }
  }

  // Hell/Dunkel höchstens einmal pro Sekunde umschalten und weich überblenden – kein Flackern beim schnellen Klicken
  let themeSperre = 0;
  document.addEventListener('click', e => {
    const btn = e.target.closest('#themeBtn,#pfTheme');
    if (!btn) return;
    if (Date.now() < themeSperre){ e.stopImmediatePropagation(); e.preventDefault(); return; }
    themeSperre = Date.now() + 1000;
    root.classList.add('pf-fade'); btn.classList.add('pf-gesperrt');
    setTimeout(() => root.classList.remove('pf-fade'), 400);
    setTimeout(() => btn.classList.remove('pf-gesperrt'), 1000);
  }, true);

  function init(){ buildNav(); buildPages(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>/* ../../sync.js */
/* vibe learning – Anmeldung und Anbindung an PocketBase
 *
 * Läuft die Seite über den PocketBase-Server, erscheint beim ersten Öffnen ein
 * Anmeldefenster: ein Feld für Code oder Benutzername (bei Benutzernamen folgt das
 * Passwort), alternativ „Seite ohne Anmeldung nutzen“. Oben rechts in der Leiste
 * steht danach, wer angemeldet ist; dort meldet man sich auch an und ab.
 *
 * Schüler: Fortschritt wird auf dem Server gespeichert, jede gelöste Aufgabe protokolliert.
 * Lehrkraft/Admin: Anmeldung gilt bis zum Schließen des Browsers, im Menü steht
 * der Link zur Verwaltung (lehrer.html).
 * Wird die HTML-Datei direkt geöffnet (oder läuft kein PocketBase dahinter),
 * passiert nichts davon – die Seite speichert dann wie bisher nur im Browser.
 *
 * Bedingte Menüpunkte (katalog.js: bedingt) blendet das Skript nach der Anmeldung ein,
 * wenn der Server sie für diesen Schüler freigibt (/api/trainer/sichtbar).
 *
 * Die Seite ruft auf:
 *   TrainerSync.changed()      nach jeder Änderung am gespeicherten Stand
 *   TrainerSync.event({...})   wenn eine Aufgabe richtig gelöst wurde
 */
(function () {
  'use strict';

  const CONFIG = {
    api: '/api/trainer',
    verwaltung: 'lehrer.html'   // relativ zum Ordner von sync.js
  };

  const me = document.currentScript && document.currentScript.src;
  const BASE = me ? me.replace(/[^/]*$/, '') : '';
  const PAGE = document.documentElement.dataset.trainer || '';          // Tool-id aus katalog.js, leer auf Übersichtsseiten
  const TOOL_IDS = window.KATALOG ? [].concat(...window.KATALOG.bereiche.map(b => b.tools.map(t => t.id))) : [];
  const ALL_PREFIXES = [...new Set(['wenn', 'uo', 'fn', PAGE].concat(TOOL_IDS))].filter(Boolean).map(id => id + '-');
  const OWN = PAGE + '-';
  const SKIP = ['wenn-theme'];                                             // Hell/Dunkel bleibt pro Gerät
  const K = {code: 'ts-code', anzeige: 'ts-anzeige', klasse: 'ts-klasse', queue: 'ts-queue', stand: 'ts-stand-' + PAGE};
  const SS = {gast: 'ts-gast', lehrer: 'ts-lehrer'};                      // gilt nur bis zum Schließen des Browsers

  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} },
    keys(){ try { return Object.keys(localStorage); } catch (e) { return []; } }
  };
  const ss = {
    get(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  function lehrerSitzung(){ try { return JSON.parse(ss.get(SS.lehrer) || 'null'); } catch (e) { return null; } }

  const hosted = /^https?:$/.test(location.protocol);
  let aktiv = false, pushTimer = null, pushPending = false, menuEl = null, lastSnap = '';

  /* ---------- Hilfen ---------- */
  function api(path, opt){
    opt = opt || {};
    return fetch(CONFIG.api + path, {
      method: opt.method || 'GET',
      keepalive: !!opt.keepalive,
      headers: {'Content-Type': 'application/json', 'X-Trainer-Code': ls.get(K.code) || ''},
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(async r => {
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    });
  }
  const trainerKeys = prefix => ls.keys().filter(k => k.startsWith(prefix) && !SKIP.includes(k));
  function snapshot(prefix){ prefix = prefix || OWN; const d = {}; trainerKeys(prefix).sort().forEach(k => { d[k] = ls.get(k); }); return d; }
  function applySnapshot(d, prefix){
    prefix = prefix || OWN;
    trainerKeys(prefix).forEach(k => ls.del(k));
    Object.keys(d || {}).forEach(k => { if (k.startsWith(prefix) && !SKIP.includes(k) && typeof d[k] === 'string') ls.set(k, d[k]); });
  }
  function wipeLocal(){
    ALL_PREFIXES.forEach(p => trainerKeys(p).forEach(k => ls.del(k)));
    ls.keys().filter(k => k.startsWith('ts-stand-')).forEach(k => ls.del(k));
    [K.queue, K.code, K.klasse, K.anzeige].forEach(k => ls.del(k));
  }
  function reloadOnce(){
    let last = 0; try { last = +sessionStorage.getItem('ts-reload') || 0; } catch (e) {}
    if (Date.now() - last < 8000) return;
    try { sessionStorage.setItem('ts-reload', Date.now()); } catch (e) {}
    location.reload();
  }

  /* ---------- Fortschritt abgleichen ---------- */
  async function pull(){
    if (!PAGE){ setStatus('ok'); return; }
    const r = await api('/state?seite=' + PAGE);
    const local = +ls.get(K.stand) || 0, server = +r.stand || 0;
    if (r.daten && server > local){
      const before = JSON.stringify(snapshot());
      applySnapshot(r.daten);
      ls.set(K.stand, server);
      lastSnap = JSON.stringify(snapshot());
      if (lastSnap !== before) reloadOnce();
    } else if (local > server) await push();
    setStatus('ok');
  }

  async function push(keepalive){
    clearTimeout(pushTimer); pushPending = false;
    if (!aktiv || !PAGE) return;
    const stand = +ls.get(K.stand) || Date.now();
    setStatus('saving');
    try {
      await api('/state', {method: 'POST', body: {seite: PAGE, daten: snapshot(), stand}, keepalive});
      setStatus('ok');
    } catch (err){
      if (err.status === 409){ await pull().catch(() => setStatus('offline')); }
      else if (err.status === 401) abgelaufen();
      else { pushPending = true; setStatus('offline'); }
    }
  }

  function changed(){
    if (!PAGE) return;
    // Seiten schreiben ihren Stand auch beim Öffnen neu – nur echte Änderungen zählen,
    // sonst würde ein frisch geöffnetes Gerät einen neueren Stand vom Server überschreiben.
    const snap = JSON.stringify(snapshot());
    if (snap === lastSnap) return;
    lastSnap = snap;
    ls.set(K.stand, Date.now());
    if (!aktiv) return;
    pushPending = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 700);
  }

  /* ---------- Protokoll gelöster Aufgaben ---------- */
  function queue(){ try { return JSON.parse(ls.get(K.queue) || '[]'); } catch (e) { return []; } }
  function event(ev){
    if (!aktiv || !PAGE) return;
    const q = queue(); q.push(Object.assign({seite: PAGE}, ev)); ls.set(K.queue, JSON.stringify(q.slice(-500)));
    flush();
  }
  let flushing = false;
  async function flush(keepalive){
    if (!aktiv || flushing) return;
    const q = queue(); if (!q.length) return;
    flushing = true;
    try {
      await api('/events', {method: 'POST', body: {events: q.slice(0, 200)}, keepalive});
      ls.set(K.queue, JSON.stringify(queue().slice(Math.min(q.length, 200))));
    } catch (err){
      if (err.status === 401) abgelaufen(); else setStatus('offline');
    } finally { flushing = false; }
    if (queue().length && !keepalive) setTimeout(flush, 2000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && aktiv){ if (pushPending) push(true); flush(true); }
  });
  window.addEventListener('online', () => { if (aktiv){ flush(); if (pushPending) push(); else pull().catch(() => {}); } });


  /* ---------- Gast-Fortschritt beim Anmelden übernehmen ---------- */
  // Für jede Übung: Ist das Konto dort noch leer, wird der Stand dieses Geräts hochgeladen,
  // sonst gilt der Stand vom Server.
  async function uebernehmen(){
    for (const p of ALL_PREFIXES){
      const id = p.slice(0, -1), lokal = snapshot(p);
      const st = await api('/state?seite=' + id);
      const leer = !st.daten || !Object.keys(st.daten).length;
      if (leer){
        if (!Object.keys(lokal).length) continue;
        const stand = Date.now();
        await api('/state', {method: 'POST', body: {seite: id, daten: lokal, stand}});
        ls.set('ts-stand-' + id, stand);
      } else {
        applySnapshot(st.daten, p);
        ls.set('ts-stand-' + id, +st.stand || 0);
      }
    }
  }

  /* ---------- Oberfläche: Anmeldefenster + Menü oben rechts ---------- */
  const CSS = `

@media (max-width:760px){.ts-dwm{position:static;box-shadow:none;border:0;border-left:2px solid var(--border,#cdd3de);border-radius:0;margin:4px 0 0 8px;padding:2px 0 2px 6px;min-width:0}.ts-dwm .ts-dwm{margin-left:12px}}

.ts-dd .ts-info{padding:8px 10px;color:var(--muted,#5b6578);border-bottom:1px solid var(--border,#cdd3de);margin-bottom:4px}

@media (max-width:640px){.ts-badge .ts-lang{display:none}}`;

  function injectCss(){ const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s); }
  const escH = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function setStatus(st){
    const b = menuEl && menuEl.querySelector('.ts-badge');
    if (!b || !aktiv) return;
    b.className = 'ts-badge ' + st;
    const t = {ok: 'Fortschritt gespeichert', saving: 'Wird gespeichert …', offline: 'Keine Verbindung – wird später gespeichert'}[st] || '';
    b.title = t;
    const i = menuEl.querySelector('.ts-status'); if (i) i.textContent = t;
  }

  // Einstellung „Design“ (lib/designs.js, nur für Angemeldete, gilt auf diesem Gerät; nav.js schaltet es ein)
  // Untermenü mit allen Designs; Varianten mit gruppe (z. B. Titelkarte) als weiteres Untermenü mit Farbfeldern
  const DESIGN_HTML = `<div class="ts-einst"><button class="ts-dw" type="button" aria-haspopup="menu" aria-expanded="false">Design <span class="ts-akt">Standard</span><span class="ts-pfeil">›</span></button>
    <ul class="ts-dwm" role="menu" aria-label="Design"></ul>
    <small>Experimentell – nicht alle Übungen sind dafür gebaut. Gilt auf diesem Gerät.</small></div>`;
  const designZu = () => { if (!menuEl) return; menuEl.querySelectorAll('.ts-dwm.auf').forEach(u => u.classList.remove('auf'));
    menuEl.querySelectorAll('.ts-dw,.ts-gruppe').forEach(b => { b.setAttribute('aria-expanded', 'false'); b.classList.remove('offen'); }); };
  function designWahl(){
    const knopf = menuEl && menuEl.querySelector('.ts-dw'); if (!knopf) return;
    const menue = menuEl.querySelector('.ts-einst > .ts-dwm');
    const farbe = d => d.farbe ? `<span class="ts-farbe" style="background:${escH(d.farbe)}"></span>` : '';
    let akt = 'standard'; try { akt = localStorage.getItem('pf-design') || 'standard'; } catch (e) {}
    const fuellen = () => {
      if (!window.Designs) return;
      const L = Designs.liste(), d = L.find(x => x.id === akt) || L[0];
      knopf.querySelector('.ts-akt').innerHTML = farbe(d) + escH(d.name);
      const punkt = (x, text) => `<li role="none"><button type="button" role="menuitemradio" aria-checked="${x.id === akt}" data-design="${escH(x.id)}" title="${escH(x.beschreibung)}">${farbe(x)}${escH(text)}</button></li>`;
      const gesehen = new Set();
      menue.innerHTML = L.map(x => {
        if (!x.gruppe) return punkt(x, x.name);
        if (gesehen.has(x.gruppe)) return ''; gesehen.add(x.gruppe);
        const teile = L.filter(y => y.gruppe === x.gruppe);
        return `<li role="none"><button type="button" class="ts-gruppe" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-checked="${teile.some(y => y.id === akt)}">${escH(x.gruppe)}<span class="ts-pfeil">›</span></button>`
          + `<ul class="ts-dwm" role="menu" aria-label="${escH(x.gruppe)}">${teile.map(y => punkt(y, y.kurz)).join('')}</ul></li>`;
      }).join('');
    };
    if (window.Designs) fuellen();
    else { const s = document.createElement('script'); s.src = BASE + 'lib/designs.js'; s.onload = fuellen; document.head.appendChild(s); }
    const schmal = () => matchMedia('(max-width:760px)').matches, hover = () => matchMedia('(hover: hover)').matches && !schmal();
    const gruppe = (g, auf) => {
      menue.querySelectorAll('.ts-gruppe').forEach(x => { const an = x === g && auf; x.classList.toggle('offen', an); x.setAttribute('aria-expanded', String(an)); x.nextElementSibling.classList.toggle('auf', an); });
    };
    const oeffne = auf => { menue.classList.toggle('auf', auf); knopf.setAttribute('aria-expanded', String(auf)); if (!auf) gruppe(null, false); };
    knopf.addEventListener('click', e => { e.stopPropagation(); oeffne(!menue.classList.contains('auf')); });
    knopf.addEventListener('mouseenter', () => { if (hover()) oeffne(true); });
    menuEl.querySelector('.ts-einst').addEventListener('mouseleave', () => { if (hover()) oeffne(false); });
    menue.addEventListener('mouseover', e => {
      if (!hover()) return;
      const b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('ts-gruppe')) gruppe(b, true);
      else if (b.closest('.ts-dwm') === menue) gruppe(null, false);
    });
    menue.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('ts-gruppe')) { gruppe(b, schmal() ? !b.classList.contains('offen') : true); return; }
      const id = b.dataset.design;
      try { if (id === 'standard') localStorage.removeItem('pf-design'); else localStorage.setItem('pf-design', id); } catch (e) {}
      location.reload();
    });
    menuEl.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !menue.classList.contains('auf')) return;
      e.stopPropagation(); oeffne(false); knopf.focus();
    });
  }
  // Menü oben rechts: angemeldet (Dropdown mit Abmelden) oder Gast (Klick öffnet die Anmeldung)
  function showMenu(){
    if (menuEl) menuEl.remove();
    const host = document.querySelector('.pf-right') || document.querySelector('.hdr-right') || document.querySelector('header') || document.body;
    const L = lehrerSitzung();
    menuEl = document.createElement('div');
    menuEl.className = 'ts-wrap';
    if (aktiv){
      const klasse = ls.get(K.klasse);
      menuEl.innerHTML = `<button class="ts-badge saving" type="button"><span class="ts-dot"></span>👤 <span class="ts-lang">${escH(ls.get(K.anzeige) || ls.get(K.code))}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(ls.get(K.anzeige) || ls.get(K.code))}</b>${klasse ? ' (Klasse ' + escH(klasse) + ')' : ''}<br><span class="ts-status"></span></div>
        ${DESIGN_HTML}<button type="button" data-a="ab">Abmelden</button></div>`;
    } else if (L){
      menuEl.innerHTML = `<button class="ts-badge" type="button">👤 <span class="ts-lang">${escH(L.name)}</span></button>
        <div class="ts-dd"><div class="ts-info">Angemeldet als <b>${escH(L.name)}</b> (${L.rolle === 'admin' ? 'Admin' : 'Lehrkraft'})</div>
        <a href="${BASE + CONFIG.verwaltung}">Verwaltung: Klassen und Auswertung</a>
        ${DESIGN_HTML}<button type="button" data-a="ab">Abmelden</button></div>`;
    } else {
      menuEl.innerHTML = `<button class="ts-badge gast" type="button" title="Fortschritt wird nicht gespeichert. Klicken zum Anmelden."><span class="ts-dot"></span>Nicht angemeldet<span class="ts-lang">&nbsp;– Fortschritt wird nicht gespeichert</span></button>`;
    }
    host.insertBefore(menuEl, host.firstChild);
    menuEl.querySelector('.ts-badge').addEventListener('click', () => {
      if (!aktiv && !L){ showLogin(); return; }
      menuEl.classList.toggle('open');
      if (!menuEl.classList.contains('open')) designZu();
    });
    const ab = menuEl.querySelector('[data-a="ab"]');
    if (ab) ab.addEventListener('click', abmelden);
    designWahl();
    document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) { menuEl.classList.remove('open'); designZu(); } });
  }

  function showLogin(msg){
    if (document.querySelector('.ts-ov')) return;
    const ov = document.createElement('div');
    ov.className = 'ts-ov';
    ov.innerHTML = `<div class="ts-box" role="dialog" aria-modal="true" aria-label="Anmelden">
      <button class="ts-x" type="button" aria-label="Schließen und ohne Anmeldung nutzen" title="Ohne Anmeldung nutzen">×</button>
      <form class="ts-f1" autocomplete="off">
        <h2>Anmelden</h2>
        <p>Gib deinen Zugangscode oder deinen Benutzernamen ein.</p>
        <input class="ts-in" name="kennung" placeholder="Code oder Benutzername" autocapitalize="none" spellcheck="false" aria-label="Code oder Benutzername">
        <button class="ts-btn" type="submit">Weiter</button>
      </form>
      <form class="ts-f2" hidden>
        <h2>Passwort</h2>
        <p>für <b class="ts-wer"></b></p>
        <input class="ts-in" name="passwort" type="password" autocomplete="current-password" aria-label="Passwort">
        <button class="ts-btn" type="submit">Anmelden</button>
        <button class="ts-zurueck" type="button">Anderen Namen eingeben</button>
      </form>
      <div class="ts-err">${msg || ''}</div>
      <button class="ts-gast" type="button">Seite ohne Anmeldung nutzen<small>Dein Fortschritt wird dann nur in diesem Browser gespeichert.</small></button>
    </div>`;
    document.body.appendChild(ov);
    const f1 = ov.querySelector('.ts-f1'), f2 = ov.querySelector('.ts-f2'), err = ov.querySelector('.ts-err');
    const k = f1.kennung, pw = f2.passwort;
    setTimeout(() => k.focus(), 50);

    const gast = () => { ss.set(SS.gast, '1'); ov.remove(); document.removeEventListener('keydown', esc); };
    const esc = e => { if (e.key === 'Escape') gast(); };
    document.addEventListener('keydown', esc);
    ov.querySelector('.ts-x').addEventListener('click', gast);
    ov.querySelector('.ts-gast').addEventListener('click', gast);
    ov.querySelector('.ts-zurueck').addEventListener('click', () => { f2.hidden = true; f1.hidden = false; err.textContent = ''; k.select(); });

    async function senden(btn, body){
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch(CONFIG.api + '/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
          .then(async x => { const j = await x.json().catch(() => ({})); if (!x.ok) throw new Error(x.status === 429 ? 'Zu viele Versuche – bitte kurz warten.' : (j.message || 'Anmeldung fehlgeschlagen.')); return j; });
        if (r.passwort){ f1.hidden = true; f2.hidden = false; ov.querySelector('.ts-wer').textContent = body.kennung; pw.value = ''; pw.focus(); return; }
        if (r.rolle === 'schueler'){
          ls.set(K.code, r.cred); ls.set(K.anzeige, r.anzeige); ls.set(K.klasse, r.klasse || '');
          ss.del(SS.lehrer); ss.del('ts-reload');
          aktiv = true;
          await uebernehmen().catch(() => {});
        } else {
          ss.set(SS.lehrer, JSON.stringify({rolle: r.rolle, token: r.token, name: r.name}));
        }
        location.reload();
      } catch (x){
        err.textContent = x.message || 'Anmeldung fehlgeschlagen.';
        (f2.hidden ? k : pw).select();
      } finally { btn.disabled = false; }
    }
    f1.addEventListener('submit', e => {
      e.preventDefault();
      const v = k.value.trim();
      if (!v){ err.textContent = 'Bitte gib deinen Code oder Benutzernamen ein.'; return; }
      senden(f1.querySelector('.ts-btn'), {kennung: v});
    });
    f2.addEventListener('submit', e => {
      e.preventDefault();
      if (!pw.value){ err.textContent = 'Bitte gib dein Passwort ein.'; return; }
      senden(f2.querySelector('.ts-btn'), {kennung: k.value.trim(), passwort: pw.value});
    });
  }

  async function abmelden(){
    const ohneDesign = () => { try { localStorage.removeItem('pf-design'); } catch (e) {} };   // Design gilt nur für Angemeldete
    if (lehrerSitzung()){ ohneDesign(); ss.del(SS.lehrer); ss.del(SS.gast); location.reload(); return; }
    if (!confirm(`Abmelden?\n\nAngemeldet als ${ls.get(K.anzeige) || ls.get(K.code)}. Dein Fortschritt bleibt auf dem Server gespeichert.`)) return;
    if (pushPending) await push();
    await flush();
    if (queue().length && !confirm('Einige gelöste Aufgaben konnten noch nicht übertragen werden (keine Verbindung). Trotzdem abmelden?')) return;
    ohneDesign(); wipeLocal(); ss.del(SS.gast); ss.del('ts-sichtbar');
    location.reload();
  }
  function abgelaufen(){
    aktiv = false;
    wipeLocal(); ss.del('ts-sichtbar');
    showMenu();
    showLogin('Deine Anmeldung ist nicht mehr gültig. Bitte melde dich neu an.');
  }

  /* ---------- Bedingte Menüpunkte (z. B. Tipp-Aufgabe nur mit aufgegebener Aufgabe) ---------- */
  function zeigeTools(ids){
    // Tool-ids bestehen nur aus a–z, 0–9 und - (katalog.js); andere werden ignoriert
    ids.filter(id => /^[a-z0-9-]+$/.test(id)).forEach(id => document.querySelectorAll(`[data-tool="${id}"]`).forEach(el => el.classList.add('pf-sichtbar')));
  }
  async function sichtbar(){
    try { zeigeTools(JSON.parse(ss.get('ts-sichtbar') || '[]')); } catch (e) {}   // Stand der letzten Seite, ohne Flackern
    try { const r = await api('/sichtbar'); ss.set('ts-sichtbar', JSON.stringify(r.tools || [])); zeigeTools(r.tools || []); } catch (e) {}
  }

  /* ---------- Start ---------- */
  async function start(){
    if (!hosted || window.PF_EINZELDATEI) return;          // Einzeldatei: immer ohne Anmeldung, Fortschritt nur im Browser
    try {
      const h = await fetch('/api/health', {cache: 'no-store'});
      if (!h.ok) return;                                    // kein PocketBase: Seite läuft nur lokal
    } catch (e){ return; }
    injectCss();
    aktiv = !!ls.get(K.code);
    showMenu();
    if (!aktiv){
      if (!lehrerSitzung() && !ss.get(SS.gast)) showLogin();
      return;
    }
    sichtbar();
    try { await pull(); flush(); }
    catch (err){ if (err.status === 401) abgelaufen(); else setStatus('offline'); }
  }

  lastSnap = JSON.stringify(snapshot());   // Stand beim Laden der Seite (vor deren Initialisierung)
  window.TrainerSync = {changed, event, anmelden: () => showLogin(), get aktiv(){ return aktiv; }, get lehrer(){ return lehrerSitzung(); }, abmelden};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<script>/* ../../lib/aufgaben.js */
/* aufgaben.js – Aufgabenbausteine für alle Fächer: Aufgaben als Daten, Prüfung und Rückmeldung eingebaut
 *
 * Einbinden (Pfad zum Ordner pb_public/lib/, z. B. aus BWR/9II/finanzierung/ ../../../lib/):
 *   <link rel="stylesheet" href="../../../lib/aufgaben.css">   <script src="../../../lib/aufgaben.js"><\/script>
 * Farben kommen aus den Variablen der Seite (--panel, --panel2, --border, --accent, --text, --muted).
 *
 * Aufgabe = Objekt mit typ. Für alle Typen: nr (z. B. '7.1'), frage (Aufgabenstellung, HTML),
 * erinnerung und material (HTML, stehen über der Aufgabe; erinnerungZu:true = Erinnerung startet zugeklappt), ok (Text bei Erfolg),
 * Formeln mit Bruchstrich in jedem HTML-Text: <span class="bruch"><span>Zähler</span><span>Nenner</span></span> (aufgaben.css),
 *   kombi        Kombinierte Aufgabe: teile:[Aufgabe, …] (mindestens zwei, keine Kombi in der Kombi). Teil 2 erscheint
 *                erst, wenn Teil 1 richtig gelöst ist, usw.; erledigt, wenn der letzte Teil gelöst ist (dann ok).
 *                nr, frage, erinnerung, material der Kombi stehen über allen Teilen, jeder Teil hat eigene.
 *                (Früher: danach:{…} an einer Aufgabe – Aufgaben-JSON mit danach wandelt lib/seite.js um.)
 *   mc           options:[Texte], correct:[Indizes] (mehrere = Mehrfachauswahl, oder multi:true), why:{Index: Erklärung},
 *                after (Text nach Erfolg), mono, mischen:false (Reihenfolge behalten), sofort:false
 *                (bei genau einer richtigen Antwort wird sonst beim Antippen sofort geprüft),
 *                html:true (Antworten als HTML, z. B. Bruch; ohne html sind Antworten reiner Text, „A1<5“ bleibt lesbar).
 *                Dasselbe Format wie type:'choice' in den Excel-Erklärungen.
 *   zahlen       felder:[{t (Text), l (Lösung), e (Einheit), h (Hinweis bei Fehler), tol (Toleranz, Std. 0,005)}]
 *                Eingabe im deutschen Format (1.234,50 €), Knopftext über knopf:'…'
 *   luecken      text:'… [[richtig|falsch|falsch]] …' → Auswahllisten (erste Antwort richtig, wird gemischt)
 *                ziehen:true → Wortbank statt Auswahllisten: Wörter in die Lücken ziehen oder erst Wort, dann Lücke
 *                antippen (Wort in der Lücke antippen = zurück). Bank: je Lücke das richtige Wort, dazu die falschen
 *                Antworten der Lücken und extra:['…'] (weitere Ablenker), Doppelte nur einmal. [[Wort]] ohne | reicht hier.
 *   zuordnen     felder:[[id, Titel]], karten:[{t (Text), z (Feld-id)}]; Ziehen mit Maus/Finger oder
 *                erst Karte, dann Feld antippen. Richtige bleiben liegen, falsche gehen zurück.
 *   tabelle      Tabelle zum Ausfüllen (z. B. Tilgungsplan): spalten:['Jahr', 'Zinsen', …],
 *                zeilen:[['1', 40000, {l:2000}, …], …] – Text bzw. Zahl = vorgegeben (Zahlen mit 2 Nachkommastellen),
 *                {l: Lösung} = Eingabefeld; hinweise:{Spaltenindex: 'Zinsen = Restschuld · 5 %'}, tol (Std. 0,005),
 *                einheit (z. B. '€', erscheint im Spaltenkopf). Falsche Felder werden rot, Hinweise je Spalte.
 *   wahrheit     Tabelle mit ja/nein zum Anklicken (z. B. Wahrheitstabelle UND/ODER): spalten:['Titel', 'jahr >= 2000', …]
 *                (HTML erlaubt), zeilen:[['Oben', true, false, {l:false}], …] – true/false = vorgegeben (ja/nein),
 *                Text bzw. Zahl = vorgegeben, {l:true|false} = Feld zum Anklicken (leer → ja → nein → ja …);
 *                werte:['ja', 'nein'] (Beschriftung für true/false), hinweise:{Spaltenindex: 'Text bei Fehler'}.
 *   freitext     felder:['1. Sicherheit', '2. Sicherheit'] (Beschriftungen, je ein Eingabefeld),
 *                antworten:[['Grundschuld'], ['Zession', 'Abtretung von Forderungen'], …] (je Eintrag Schreibweisen);
 *                ein Feld ist richtig, wenn ein Begriff darin vorkommt (Groß/klein, ä/ae egal), jedes Feld braucht
 *                einen anderen Eintrag. Tippfehler (Abstand bis 45 % bei langen, 30 % bei kurzen Wörtern) gelten als

 *   verbessern   Fehlersuche: text mit Zeilen (\n), Fehler als [[falsch|richtig|auch richtig]] (falsch wird angezeigt;

/* ---------- Lern-Chat: Ablauf ---------- */
const textVon = m => typeof m === 'string' ? m : m.bot;

  else if (q.zahl){ if (!String(wert).trim()) return; ok = Math.abs(zahl(wert) - q.zahl.l) <= (q.zahl.tol == null ? 0.005 : q.zahl.tol); text = wert + (q.zahl.e && !/€|%/.test(wert) ? ' ' + q.zahl.e : ''); }

}

/* ---------- Endlos (zufällige Aufgaben je Stufe, Serie und Rekord) ---------- */

/* ---------- Training: Aufgaben auf Zeit und/oder endlos ---------- */
const trStufen = T => Array.isArray(T.stufen) && T.stufen.length ? T.stufen : [{name:'', szenarien:T.szenarien, woerterbuch:T.woerterbuch}];

function zahlAblenker(l, falsch, runden){
  const d = Number.isInteger(l) ? 1 : runden ? Math.pow(10, -Math.max(0, runden - 1)) : 0.1;
  const r = x => Math.round(x * 1e9) / 1e9;

  const aus = [];
  kand.forEach(x => { if (Math.abs(x - l) > 1e-9 && (l < 0 || x >= 0) && !aus.some(y => Math.abs(y - x) < 1e-9) && aus.length < 3) aus.push(x); });
  return aus;
}
// Aufgabengeber einer Stufe → () => {frage (HTML), loesung (Text), optionen (MC: [{t, ok}]), pruefe(text) → 'ok' | 'fast' | 'falsch', zahl}
function trGeber(st, T){

    return a;

      const sz = st.szenarien[Math.floor(Math.random() * st.szenarien.length)], w = Formel.wuerfle(sz);

    if (mc){
      const andere = [];
      mischen(E.filter((_, j) => j !== i)).forEach(x => { const t = alternativen(x[rueck ? 0 : 1])[0]; if (!nach.some(n => norm(n) === norm(t)) && !andere.some(a => norm(a) === norm(t))) andere.push(t); });

      pruefe(s){

        const nah = nach.some(n => { const v = norm(n).replace(/ /g, ''); return abstand(t.replace(/ /g, ''), v) <= Math.max(1, Math.floor(v.length * 0.2)); });

    if (mc && phase === 'laeuft' && /^[1-4]$/.test(e.key) && akt.optionen[+e.key - 1]){ const b = root.querySelector(`[data-tropt="${+e.key - 1}"]`); if (b && !b.disabled){ e.preventDefault(); antwort(null, +e.key - 1); } }
  }
  document.addEventListener('keydown', taste);
  root.addEventListener('af-variante', startBild);
  startBild();
  return {stop:halt, start:starte};
}

window.Aufgaben = {baue, sequenz, endlos, training, mc, mehrfach, finde, zahl, eur, mischen, esc, bsText, TYPEN, EXPERIMENTELL};

<script>/* ../../lib/formel.js */
/* formel.js – Rechenausdrücke aus Aufgaben-JSON sicher auswerten (ohne eval) und Zahlen-Aufgaben würfeln
 *
 * Genutzt von lib/aufgaben.js (Training mit Szenarien) und lib/seite.js (Prüfung, auch im PocketBase-Hook).
 * Im Browser: <script src="lib/formel.js"><\/script> → window.Formel; in Node/Hook: require(…/lib/formel.js).
 *
 * Ausdruck: Zahlen (Punkt als Komma: 2.5), Namen (a, b, preis), + - * / (auch · : und ×), ^ (Potenz), Klammern,
 *   Vergleiche < <= > >= == != (auch = und <>), und / oder / nicht (auch && || !),
 *   Funktionen runden(x, n), abs(x), min(…), max(…), wurzel(x), ganz(x) (abrunden), rest(a, b).
 * API
 *   Formel.pruefe(text, namen?)  → null oder Fehlermeldung (deutsch); namen = erlaubte Namen (Liste), sonst alle
 *   Formel.namen(text)           → verwendete Namen
 *   Formel.wert(text, werte)     → Zahl (Vergleiche: 1/0); wirft Error bei Fehlern
 *   Formel.zahlText(n)           → deutsch: 1.234,5
 *   Formel.pruefeSzenario(sz)    → Liste von Fehlermeldungen (leer = in Ordnung), würfelt zur Probe
 *   Formel.wuerfle(sz, zufall?)  → {frage (HTML), loesung (Zahl), falsch: [Zahlen], werte}
 * Szenario = {frage: '{a} + {b} =', werte: {a: [1, 10], b: [1, 10, 0.5], c: {aus: [2, 5]}, d: 'a*b'},
 *             bedingung: 'b <= a', loesung: 'a + b', runden: 2, einheit: '€', falsch: ['a - b']}
 *   Im Fragetext: {a} = Wert von a, {=a*10} = Wert eines Ausdrucks.
 */
(function () {
  'use strict';
  const FUNK = {
    runden: (x, n) => { const f = Math.pow(10, n || 0); return Math.round(x * f + (x >= 0 ? 1e-9 : -1e-9)) / f; },
    abs: Math.abs, min: Math.min, max: Math.max, wurzel: Math.sqrt, ganz: Math.floor, rest: (a, b) => a % b
  };
  const WORT = {und: '&&', oder: '||', nicht: '!'};

  function lex(s) {
    const t = []; let i = 0, m;
    s = String(s);
    while (i < s.length) {
      const r = s.slice(i);
      if ((m = r.match(/^\s+/))) { i += m[0].length; continue; }
      if ((m = r.match(/^\d+(\.\d+)?/))) { t.push({t: 'zahl', v: +m[0], p: i}); i += m[0].length; continue; }
      if ((m = r.match(/^[A-Za-zÄÖÜäöüß_][A-Za-z0-9ÄÖÜäöüß_]*/))) {
        const w = m[0].toLowerCase();
        t.push(WORT[w] ? {t: 'op', v: WORT[w], p: i} : {t: 'name', v: m[0], p: i}); i += m[0].length; continue;
      }
      if ((m = r.match(/^(<=|>=|==|!=|<>|&&|\|\||[-+*\/^()<>=,!·:×])/))) {
        const v = {'·': '*', '×': '*', ':': '/', '<>': '!=', '=': '=='}[m[0]] || m[0];
        t.push({t: 'op', v, p: i}); i += m[0].length; continue;
      }
      throw new Error(`Das Zeichen „${r[0]}“ kann ich nicht rechnen`);
    }
    return t;
  }
  // Baum: {z} Zahl, {n} Name, {f, a:[…]} Funktion, {o, a, b} Rechenzeichen, {u, a} einstellig
  function parse(s) {
    const t = lex(s); let i = 0;
    const ist = v => t[i] && t[i].t === 'op' && t[i].v === v;
    const fehl = was => { throw new Error(was); };
    function oder() { let a = und(); while (ist('||')) { i++; a = {o: '||', a, b: und()}; } return a; }
    function und() { let a = vergleich(); while (ist('&&')) { i++; a = {o: '&&', a, b: vergleich()}; } return a; }
    function vergleich() {
      const a = summe();
      for (const v of ['<=', '>=', '==', '!=', '<', '>']) if (ist(v)) { i++; return {o: v, a, b: summe()}; }
      return a;
    }
    function summe() { let a = produkt(); while (ist('+') || ist('-')) { const o = t[i++].v; a = {o, a, b: produkt()}; } return a; }
    function produkt() { let a = einst(); while (ist('*') || ist('/')) { const o = t[i++].v; a = {o, a, b: einst()}; } return a; }
    function einst() { if (ist('-')) { i++; return {u: '-', a: einst()}; } if (ist('!')) { i++; return {u: '!', a: einst()}; } if (ist('+')) { i++; return einst(); } return potenz(); }
    function potenz() { const a = atom(); if (ist('^')) { i++; return {o: '^', a, b: einst()}; } return a; }
    function atom() {
      const x = t[i];
      if (!x) fehl('Der Ausdruck endet zu früh');
      if (x.t === 'zahl') { i++; return {z: x.v}; }
      if (x.t === 'name') {
        i++;
        if (ist('(')) {
          const f = x.v.toLowerCase(); if (!FUNK[f]) fehl(`Die Funktion „${x.v}“ gibt es nicht (möglich: ${Object.keys(FUNK).join(', ')})`);
          i++; const a = [];
          if (!ist(')')) for (;;) { a.push(oder()); if (ist(',')) { i++; continue; } break; }
          if (!ist(')')) fehl(`Bei „${x.v}(…)“ fehlt die schließende Klammer`);
          i++; return {f, a};
        }
        return {n: x.v};
      }
      if (ist('(')) { i++; const e = oder(); if (!ist(')')) fehl('Es fehlt eine schließende Klammer )'); i++; return e; }
      fehl(`„${x.v}“ steht hier an der falschen Stelle`);
    }
    if (!t.length) fehl('Der Ausdruck ist leer');
    const e = oder();
    if (i < t.length) fehl(`„${t[i].v}“ steht hier an der falschen Stelle` + (t[i].v === ',' ? ' – Kommazahlen mit Punkt schreiben (2.5)' : ''));
    return e;
  }
  const CACHE = new Map();
  function baum(s) { s = String(s); if (!CACHE.has(s)) CACHE.set(s, parse(s)); return CACHE.get(s); }
  function namenIn(e, out) {
    if (e.n) out.add(e.n);
    ['a', 'b'].forEach(k => { if (e[k] && typeof e[k] === 'object' && !Array.isArray(e[k])) namenIn(e[k], out); });
    if (Array.isArray(e.a)) e.a.forEach(x => namenIn(x, out));
    return out;
  }
  function rechne(e, w) {
    if (e.z !== undefined) return e.z;
    if (e.n !== undefined) { if (!(e.n in w)) throw new Error(`„${e.n}“ ist kein Wert`); return w[e.n]; }
    if (e.f) return FUNK[e.f](...e.a.map(x => rechne(x, w)));
    if (e.u) { const a = rechne(e.a, w); return e.u === '-' ? -a : a ? 0 : 1; }
    const a = rechne(e.a, w), b = rechne(e.b, w);
    switch (e.o) {
      case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return a / b; case '^': return Math.pow(a, b);
      case '<': return +(a < b); case '<=': return +(a <= b); case '>': return +(a > b); case '>=': return +(a >= b);
      case '==': return +(Math.abs(a - b) < 1e-9); case '!=': return +(Math.abs(a - b) >= 1e-9);
      case '&&': return +(a && b); case '||': return +(a || b);
    }
  }
  function pruefe(text, namen) {
    try {
      const e = baum(text);
      if (namen) { const fremd = [...namenIn(e, new Set())].filter(n => !namen.includes(n)); if (fremd.length) return `„${fremd[0]}“ ist kein festgelegter Wert` + (namen.length ? ` (festgelegt: ${namen.join(', ')})` : ''); }
      return null;
    } catch (x) { return x.message; }
  }
  const namen = text => [...namenIn(baum(text), new Set())];
  const wert = (text, w) => { const v = rechne(baum(text), w || {}); if (typeof v !== 'number' || !isFinite(v)) throw new Error('Das Ergebnis ist keine Zahl (z. B. durch 0 geteilt)'); return v; };
  const sauber = n => Math.round(n * 1e9) / 1e9;   // 0.1 + 0.2 → 0.3
  function zahlText(n) {
    n = sauber(n);
    const [g, k] = String(Math.abs(n)).split('.');
    return (n < 0 ? '−' : '') + g.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (k ? ',' + k : '');
  }

  /* ---------- Szenarien ---------- */
  function wertBeschreibung(v) {   // Fehler in einer Wert-Angabe oder null
    if (Array.isArray(v)) {
      if (v.length < 2 || v.length > 3 || v.some(x => typeof x !== 'number')) return 'braucht [von, bis] oder [von, bis, Schritt] mit Zahlen';
      if (v[0] > v[1]) return '„von“ ist größer als „bis“';
      if (v.length === 3 && !(v[2] > 0)) return 'der Schritt muss größer als 0 sein';
      return null;
    }
    if (v && typeof v === 'object') return Array.isArray(v.aus) && v.aus.length && v.aus.every(x => typeof x === 'number') ? null : 'braucht {"aus": [Zahlen]}';
    if (typeof v === 'string') return null;
    return 'muss [von, bis], {"aus": […]} oder eine Formel sein';
  }
  function einWert(v, w, r) {
    if (Array.isArray(v)) {
      const s = v[2] || 1, n = Math.floor((v[1] - v[0]) / s + 1e-9);
      return sauber(v[0] + Math.floor(r() * (n + 1)) * s);
    }
    if (v && v.aus) return v.aus[Math.floor(r() * v.aus.length)];
    return wert(v, w);
  }
  function rund(sz, x) { return sz.runden != null ? FUNK.runden(x, sz.runden) : sauber(x); }
  function wuerfle(sz, r) {
    r = r || Math.random;
    for (let n = 0; n < 200; n++) {
      const w = {};
      Object.keys(sz.werte || {}).forEach(k => { w[k] = einWert(sz.werte[k], w, r); });
      if (sz.bedingung && !wert(sz.bedingung, w)) continue;
      const loesung = rund(sz, wert(sz.loesung, w));
      const frage = String(sz.frage || '').replace(/\{=([^}]+)\}|\{([A-Za-zÄÖÜäöüß_][\wÄÖÜäöüß]*)\}/g, (_, aus, nm) => zahlText(aus ? wert(aus, w) : w[nm]));
      const falsch = (sz.falsch || []).map(f => rund(sz, wert(f, w))).filter(x => Math.abs(x - loesung) > 1e-9);
      return {frage, loesung, falsch, werte: w};
    }
    throw new Error('Die Bedingung ist auch nach 200 Versuchen nicht erfüllt – Wertebereiche oder Bedingung anpassen');
  }
  function pruefeSzenario(sz) {
    const f = [];
    if (!sz || typeof sz !== 'object') return ['Szenario muss ein Objekt sein'];
    if (typeof sz.frage !== 'string' || !sz.frage.trim()) f.push('Der Fragetext fehlt (z. B. „{a} + {b}“)');
    const werte = sz.werte && typeof sz.werte === 'object' && !Array.isArray(sz.werte) ? sz.werte : null;
    if (!werte) f.push('„werte“ fehlt (z. B. {"a": [1, 10], "b": [1, 10]})');
    const bekannt = [];
    Object.keys(werte || {}).forEach(k => {
      if (!/^[A-Za-zÄÖÜäöüß_][\wÄÖÜäöüß]*$/.test(k)) f.push(`Der Name „${k}“ geht nicht – nur Buchstaben, Ziffern und _`);
      const fb = wertBeschreibung(werte[k]);
      if (fb) f.push(`Wert ${k}: ${fb}`);
      else if (typeof werte[k] === 'string') { const e = pruefe(werte[k], bekannt); if (e) f.push(`Wert ${k} = ${werte[k]}: ${e}`); }
      bekannt.push(k);
    });
    if (typeof sz.loesung !== 'string' && typeof sz.loesung !== 'number') f.push('Die Lösung fehlt (Formel, z. B. „a + b“)');
    else { const e = pruefe(String(sz.loesung), bekannt); if (e) f.push(`Lösung „${sz.loesung}“: ${e}`); }
    if (sz.bedingung != null) { const e = pruefe(sz.bedingung, bekannt); if (e) f.push(`Bedingung „${sz.bedingung}“: ${e}`); }
    (Array.isArray(sz.falsch) ? sz.falsch : sz.falsch == null ? [] : [null]).forEach(x => { const e = typeof x === 'string' ? pruefe(x, bekannt) : 'muss eine Formel sein'; if (e) f.push(`Falsche Antwort „${x}“: ${e}`); });
    if (sz.runden != null && !(Number.isInteger(sz.runden) && sz.runden >= 0 && sz.runden <= 6)) f.push('„runden“ = Anzahl Nachkommastellen (0 bis 6)');
    String(sz.frage || '').replace(/\{=([^}]+)\}|\{([^}]*)\}/g, (_, aus, nm) => {
      if (aus) { const e = pruefe(aus, bekannt); if (e) f.push(`Im Fragetext {=${aus}}: ${e}`); }
      else if (!bekannt.includes(nm)) f.push(`Im Fragetext steht {${nm}}, aber „${nm}“ ist kein festgelegter Wert`);
    });
    if (!f.length) { try { for (let i = 0; i < 30; i++) wuerfle(sz); } catch (x) { f.push(x.message); } }
    return f;
  }

  const Formel = {pruefe, namen, wert, zahlText, wuerfle, pruefeSzenario, FUNKTIONEN: Object.keys(FUNK)};
  if (typeof module !== 'undefined' && module.exports) module.exports = Formel; else window.Formel = Formel;
})();

<script>/* ../../lib/designs.js */
/* designs.js – andere Optik für Übungen (v. a. für heruntergeladene Übungen aus „Übung erstellen“)
 *
 * Ein Design = CSS (nur unter html[data-design="<id>"] gültig, überschreibt die Farbvariablen --bg, --panel, --text …),
 * optional eine Flammen-Vorlage (HTML, {n} = Stufe; lib/aufgaben.js nutzt sie über window.PF_FLAMME) und
 * modus 'dunkel' | 'hell' (fest – dann kein Hell/Dunkel-Knopf) oder frei (weglassen).
 * Titelkarte nutzt den Hell/Dunkel-Knopf für zwei Hintergründe (hell = Punkte, dunkel = Raster); wechsel = Text eines
 * eigenen Knopfs für Seiten ohne diesen Knopf (Einzeldatei, ByCS-Paket).
 * Genutzt von lib/seite.js (Aufgaben-JSON mit "design": "<id>" → CSS eingebettet), dem Editor (Auswahl neben „Vorschau“)
 * und nav.js/sync.js (Einstellung für Angemeldete, localStorage pf-design: lädt diese Datei nach, experimentell –
 * handgebaute Seiten wie Excel/SQL haben eigenes CSS und sehen dann nur teilweise anders aus).
 * Im Browser: window.Designs, in Node/Hook: require(…/lib/designs.js).
 *
 * API
 *   Designs.liste()          → [{id, name, beschreibung, modus, gruppe, kurz, farbe}]  (gruppe: Varianten wie „Titelkarte“, kurz = Name in der Gruppe, farbe = Hintergrund)
 *   Designs.hole(id)         → Design oder null ('standard' = kein Design)
 *   Designs.kopf(id)         → HTML für <head>: <style> + <script> (data-design, Flamme, feste Hell/Dunkel-Wahl)
 *   Designs.anwenden(id)     → im laufenden Dokument einschalten (für die Einstellung)
 * Neues Design: unten in D eintragen; CSS immer mit S (= Selektor des Designs) beginnen lassen.
 */
(function () {
  'use strict';
  const sel = id => `html[data-design="${id}"][data-design]`;   // doppelt: schlägt :root, [data-theme] und html[data-theme]

  /* ---------- Kommandozeile ---------- */

${S}{--bg:#090d09;--panel:#0c120c;--panel2:#101a10;--text:#b4f5b4;--muted:#6db078;--border:#1f4f28;--accent:#3cff6e;--accent-text:#3cff6e;
  --on-color:#090d09;--err:#ff6b5e;--ok:#3cff6e;--plus:#3cff6e;--minus:#ff6b5e;--plus-bg:rgba(60,255,110,.10);--minus-bg:rgba(255,107,94,.13);
  --ok-bg:rgba(60,255,110,.10);--err-bg:rgba(255,107,94,.13);--slot:#101a10;--slot-border:#2c6b37;--marke:#3cff6e;

  /* ---------- gemeinsame Bausteine ---------- */
  // Farbvariablen + fester Modus (Hell/Dunkel-Knopf weg) + weniger Bewegung, wenn gewünscht
  // knopf: true = Hell/Dunkel-Knopf bleibt (das Design nutzt ihn selbst, z. B. Titelkarte: Punkte ↔ Raster)
  const grund = (S, v, dunkel, knopf) => `
${S}{${Object.keys(v).map(k => `--${k}:${v[k]}`).join(';')};color-scheme:${dunkel ? 'dark' : 'light'}}
${knopf ? '' : `${S} #pfTheme,${S} #themeBtn{display:none!important}`}
@media (prefers-reduced-motion:reduce){${S} *,${S} *::before,${S} *::after{animation:none!important;transition:none!important}}`;
  // eine Schrift für alles außer Code und Code-Editoren (:where → schwach, Überschriften o. Ä. können mit !important eine andere setzen)
  const schrift = (S, stapel) => `
${S} body,${S} body :where(:not(code,pre,kbd,.CodeMirror,.CodeMirror *)){font-family:${stapel}!important}`;
  // Standardflamme im Stil des Designs (Form bleibt, nur Farben/Kontur): aus, an, Kontur, Zahl aus, Zahl an
  const flamme = (S, f) => `
${S} .af-flamme path,${S} .flame path{fill:${f.aus};stroke:${f.rand || 'none'};stroke-width:${f.breite || 1.4}px;stroke-linejoin:round${f.strich ? ';stroke-dasharray:' + f.strich : ''}}
${S} .af-flamme:hover path,${S} .flame:hover path{fill:${f.hover || f.aus}}
${S} .af-flamme.on path{fill:${f.an || 'url(#af-fg)'}}${S} .flame.on path{fill:${f.an || 'url(#fg)'}}
${S} .af-flamme text,${S} .flame text{fill:${f.zahl}}
${S} .af-flamme.on text,${S} .flame.on text{fill:${f.zahlAn || '#fff'}}
${S} .af-flamme.on,${S} .flame.on{filter:${f.glanz || 'none'}${f.ruhig ? ';animation:none' : ''}}`;
  // eigene Flammenform: Knopf ohne Standardglühen/-flackern
  const eigene = S => `
${S} .af-flamme.on,${S} .flame.on{filter:none;animation:none}`;
  // Rückmeldung bei richtig mit Ausruf davor
  const ausruf = (S, text, stil) => `
${S} .af-fb.ok::before,${S} .tr-rueck.ok::before{content:"${text}";${stil}}`;

  const D = {

  const WECHSEL_JS = text => `addEventListener('load',function(){if(document.querySelector('#themeBtn,#pfTheme'))return;`
    + `var b=document.createElement('button');b.type='button';b.className='pf-wechsel';b.title=${JSON.stringify(text)};b.setAttribute('aria-label',${JSON.stringify(text)});b.textContent='◐';`
    + `b.onclick=function(){var r=document.documentElement,t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('wenn-theme',t);}catch(e){}};document.body.appendChild(b);});`;

      + (d.modus ? `document.documentElement.dataset.theme=${JSON.stringify(d.modus === 'dunkel' ? 'dark' : 'light')};` : '')
      + (d.wechsel ? WECHSEL_JS(d.wechsel) : '');
    return `<style id="pf-design">${d.css.replace(/<\/style/gi, '<\\/style')}</style>\n<script>${js}<\/script>`;

      document.querySelectorAll('.flame, .af-flamme').forEach(b => { const t = b.querySelector('svg text'); if (t) b.innerHTML = d.flamme.replace(/\{n\}/g, t.textContent.trim()); });
    }

  }
  const Designs = {liste, hole, kopf, anwenden};
  if (typeof module !== 'undefined' && module.exports) module.exports = Designs; else window.Designs = Designs;
})();

<script>/* ../../lib/szenario.js */
/* szenario.js – Szenario (verzweigter Lern-Chat, Typ chat in lib/aufgaben.js) als Bild: Kästen und Pfeile
 *
 * Genutzt vom Baukasten (vorlage-szenario.js: Szenario visuell bauen) und von Seiten, die ein Szenario zeigen
 * (IT/tools/demo-aufgabentypen.html). Dazu lib/szenario.css.
 *   <link rel="stylesheet" href="…/lib/szenario.css">  <script src="…/lib/szenario.js"><\/script>
 *
 * API
 *   Szenario.zeige(el, aufgabe)     Bild einer chat-Aufgabe in el (nur ansehen); el muss sichtbar sein (Höhen werden gemessen).
 *                                   Nach einer Änderung von Schrift oder Design einfach noch einmal aufrufen.
 *   Szenario.lesen(aufgabe) → G     Modell: {start, zaehler, nodes: [{k, m (Nachricht als Objekt ohne weiter/ende),
 *                                   out (Ziel-k oder null = Ende), aout: [je Antwort Ziel-k, null = Ende, undefined = wie der Kasten]}]}
 *   Szenario.schreiben(G) → nachrichten   zurück ins Format von chat: Reihenfolge so, dass möglichst viele Pfeile „nächste
 *                                   Nachricht“ bedeuten, sonst "weiter": "<id>" (ids m1, m2 … entstehen von selbst), "ende", "entscheidung"
 *   Szenario.zeichne(innen, G, {sel}) → {Kasten-k: Nummer}   Kästen (.sz-n, data-n) mit Anschlüssen (.sz-port, data-port="k:"
 *                                   bzw. "k:<Antwort>") in Ebenen ab Start setzen, Pfeile als SVG; sel = markierter Kasten
 *   Szenario.art(n) → 'text' | 'knoepfe' | 'zahl' | 'freitext', Szenario.alleEigen(n), Szenario.kurz(html, n), Szenario.SYMBOL
 * Bild lesen: ● Anschluss, ■ Ende, gestrichelter Pfeil = Sprung zurück oder quer, gestrichelter Kasten = wird nie erreicht.
 */
(function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const nurText = h => String(h || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  const kurz = (h, n) => { const t = nurText(h).trim(); return t.length > n ? t.slice(0, n - 2).replace(/\s+\S*$/, '') + ' …' : t; };
  const art = n => n.m.zahl ? 'zahl' : n.m.freitext ? 'freitext' : n.m.antworten ? 'knoepfe' : 'text';
  // Knöpfe, bei denen jede Antwort einen eigenen Pfeil hat: der Anschluss „danach“ wird nie benutzt
  const alleEigen = n => art(n) === 'knoepfe' && n.m.antworten.length > 0 && n.m.antworten.every((x, j) => n.aout[j] !== undefined);

  /* ---------- Aufgabe ↔ Modell ---------- */
  function lesen(a) {
    const N = Array.isArray(a.nachrichten) ? a.nachrichten : [];
    const ziel = id => id == null ? -1 : N.findIndex(n => n && typeof n === 'object' && n.id === id);
    const nach = (m, i) => { if (m && typeof m === 'object' && m.ende) return null; const j = m && typeof m === 'object' ? ziel(m.weiter) : -1, t = j >= 0 ? j : i + 1; return t < N.length ? 'n' + t : null; };
    const nodes = N.map((m, i) => {
      const o = typeof m === 'string' ? {bot: m} : JSON.parse(JSON.stringify(m || {bot: ''}));
      const n = {k: 'n' + i, m: o, out: null, aout: []};
      (o.antworten || []).forEach((x, j) => { n.aout[j] = x.ende ? null : ziel(x.weiter) >= 0 ? 'n' + ziel(x.weiter) : undefined; delete x.weiter; delete x.ende; });
      // "ende" an einer Frage gilt nur für Antworten ohne eigenen Pfeil – das ist hier der Anschluss „danach“
      n.out = nach(m, i);
      delete o.weiter; delete o.ende; delete o.entscheidung;
      return n;
    });
    return {start: nodes.length ? 'n0' : null, nodes, zaehler: nodes.length};
  }
  function reihe(G) {   // Reihenfolge der Nachrichten: Ketten entlang „danach“, Abzweigungen dahinter, Unerreichbares am Ende
    const by = {}, ord = [], drin = new Set();
    G.nodes.forEach(n => { by[n.k] = n; });
    const kette = k => {
      const offen = [];
      while (k != null && by[k] && !drin.has(k)) { const n = by[k]; drin.add(k); ord.push(n); n.aout.forEach(t => { if (t) offen.push(t); }); k = alleEigen(n) ? null : n.out; }
      offen.forEach(kette);
    };
    kette(G.start); G.nodes.forEach(n => kette(n.k));
    return ord;
  }
  function schreiben(G) {
    const ord = reihe(G), by = {}, ziele = new Set(), plan = [];
    G.nodes.forEach(n => { by[n.k] = n; });
    ord.forEach((n, p) => {
      const naechste = ord[p + 1] ? ord[p + 1].k : null, e = {weiter: undefined, ende: false, a: []};
      if (!alleEigen(n)) { if (n.out == null || !by[n.out]) e.ende = p < ord.length - 1; else if (n.out !== naechste) { e.weiter = n.out; ziele.add(n.out); } }
      (n.m.antworten || []).forEach((x, j) => {
        const t = n.aout[j];
        if (t === undefined || (!alleEigen(n) && t === n.out && t != null)) e.a[j] = {};
        else if (t == null || !by[t]) e.a[j] = {ende: true};
        else { e.a[j] = {weiter: t}; ziele.add(t); }
      });
      plan.push(e);
    });
    // Marken: eigene Namen bleiben, m1, m2 … entstehen nur für Sprungziele und verschwinden sonst wieder
    const belegt = new Set(G.nodes.map(n => n.m.id).filter(id => id != null && !/^m\d+$/.test(id)));
    let nr = 1;
    G.nodes.forEach(n => {
      if (n.m.id != null && /^m\d+$/.test(n.m.id)) { if (ziele.has(n.k) && !belegt.has(n.m.id)) belegt.add(n.m.id); else delete n.m.id; }
      if (n.m.id === '') delete n.m.id;
    });
    G.nodes.forEach(n => { if (ziele.has(n.k) && n.m.id == null) { while (belegt.has('m' + nr)) nr++; n.m.id = 'm' + nr; belegt.add(n.m.id); } });
    return ord.map((n, p) => {
      const e = plan[p], m = JSON.parse(JSON.stringify(n.m));
      if (e.weiter) m.weiter = by[e.weiter].m.id;
      if (e.ende) m.ende = true;
      (m.antworten || []).forEach((x, j) => { if (e.a[j].ende) x.ende = true; else if (e.a[j].weiter) x.weiter = by[e.a[j].weiter].m.id; });
      if (m.antworten && !m.antworten.some(x => x.ok) && !m.antworten.some(x => x.weiter != null || x.ende)) m.entscheidung = true;
      return Object.keys(m).length === 1 && typeof m.bot === 'string' ? m.bot : m;
    });
  }
  const SYMBOL = {text: '💬', knoepfe: '🔘', zahl: '🔢', freitext: '✎'};

  /* ---------- Bild: Kästen in Ebenen (Breitensuche ab Start), Pfeile als SVG darüber ---------- */
  const W = 230, LUECKE = 34, ZEILE = 58;
  function zeichne(innen, G, opt) {
    const sel = opt && opt.sel, by = k => G.nodes.find(n => n.k === k) || null;
    const kinder = {}, tiefe = {}, wurzeln = [], lose = new Set();
    const ziele = n => { const l = []; n.aout.forEach(t => { if (t && by(t)) l.push(t); }); if (!alleEigen(n) && n.out && by(n.out)) l.push(n.out); return [...new Set(l)]; };
    const suche = r => { wurzeln.push(r); tiefe[r] = 0; kinder[r] = []; const q = [r]; while (q.length) { const k = q.shift(); ziele(by(k)).forEach(c => { if (tiefe[c] == null) { tiefe[c] = tiefe[k] + 1; kinder[k].push(c); kinder[c] = []; q.push(c); } }); } };
    if (G.start && by(G.start)) suche(G.start);
    G.nodes.forEach(n => { if (tiefe[n.k] == null) { lose.add(n.k); suche(n.k); } });
    const nummer = {}; let z = 0;
    const zaehle = k => { nummer[k] = ++z; kinder[k].forEach(zaehle); }; wurzeln.forEach(zaehle);
    const kasten = n => {
      const t = art(n), wahl = t === 'knoepfe' && !n.m.antworten.some(x => x.ok);
      const ant = t === 'knoepfe' ? n.m.antworten.map((x, j) => `<div class="sz-a"><span>${esc(kurz(x.t, 24) || '?')}${wahl ? '' : x.ok ? ' ✓' : ' ✗'}</span><span class="sz-port${n.aout[j] === undefined ? ' erbt' : n.aout[j] == null ? ' stopp' : ''}" data-port="${n.k}:${j}" title="${n.aout[j] === undefined ? 'geht weiter wie der Kasten – ziehen für einen eigenen Pfeil' : 'Pfeil auf einen Kasten ziehen'}"></span></div>`).join('')
        : t === 'zahl' ? `<div class="sz-a sz-ein"><span>Zahl: ${esc(n.m.zahl.l)}${n.m.zahl.e ? ' ' + esc(n.m.zahl.e) : ''}</span></div>` : t === 'freitext' ? `<div class="sz-a sz-ein"><span>Begriff: ${esc(kurz(((n.m.freitext.antworten || [])[0] || [])[0] || '', 18))}</span></div>` : '';
      return `<div class="sz-n${n.k === sel ? ' sel' : ''}${lose.has(n.k) ? ' lose' : ''}${t !== 'text' ? ' frage' : ''}" data-n="${n.k}" tabindex="0">
        <div class="sz-kopf"><span>${wahl ? '🔀' : SYMBOL[t]} ${nummer[n.k]}</span>${n.k === G.start ? '<b>Start</b>' : lose.has(n.k) ? '<b class="warn" title="Kein Pfeil führt hierher">nie erreicht</b>' : ''}${n.m.id && !/^m\d+$/.test(n.m.id) ? `<small>⚑ ${esc(n.m.id)}</small>` : ''}</div>
        <div class="sz-text">${esc(kurz(n.m.bot, 90)) || '<i>ohne Text</i>'}</div>${ant}
        <span class="sz-port unten${alleEigen(n) ? ' aus' : n.out == null || !by(n.out) ? ' stopp' : ''}" data-port="${n.k}:" title="Pfeil auf einen Kasten ziehen"></span></div>`;
    };
    innen.innerHTML = G.nodes.map(kasten).join('') || '<p class="hinweis sz-leer">Noch keine Nachricht. Klicke links einen Baustein an.</p>';
    // Höhen messen, dann setzen
    const el = {}, h = {}, x = {}, y = {}, zeilenH = [];
    innen.querySelectorAll('.sz-n').forEach(e => { el[e.dataset.n] = e; h[e.dataset.n] = e.offsetHeight; });
    G.nodes.forEach(n => { zeilenH[tiefe[n.k]] = Math.max(zeilenH[tiefe[n.k]] || 0, h[n.k]); });
    const oben = [], unten = zeilenH.reduce((s, v, i) => { oben[i] = s; return s + v + ZEILE; }, 14);
    let blatt = 0;
    const setze = k => { if (!kinder[k].length) x[k] = 30 + blatt++ * (W + LUECKE); else { kinder[k].forEach(setze); x[k] = (x[kinder[k][0]] + x[kinder[k][kinder[k].length - 1]]) / 2; } y[k] = oben[tiefe[k]]; };
    wurzeln.forEach(setze);
    G.nodes.forEach(n => { el[n.k].style.left = x[n.k] + 'px'; el[n.k].style.top = y[n.k] + 'px'; });
    const breit = 44 + Math.max(1, blatt) * (W + LUECKE), hoch = Math.max(60, unten - ZEILE + 24);
    innen.style.width = breit + 'px'; innen.style.height = hoch + 'px';
    // Pfeile
    const R = innen.getBoundingClientRect(), mitte = p => { const r = p.getBoundingClientRect(); return [r.left + r.width / 2 - R.left, r.top + r.height / 2 - R.top]; };
    let pfade = '';
    // Pfeil nach unten: Bogen. Pfeil zurück (Ziel nicht tiefer): außen am Kasten vorbei durch die Lücke zwischen den Spalten
    // nach oben und von der Seite auf das Ziel. Das SVG liegt hinter den Kästen, Linien verschwinden also hinter ihnen.
    const pfeil = (port, nach, seite, klasse, von) => {
      const [x1, y1] = mitte(port), x2 = x[nach] + W / 2, y2 = y[nach] - 3;
      let weg;
      if (y2 > y1 + 14) { const c1 = seite ? [x1 + 46, y1] : [x1, y1 + 34]; weg = `M${x1} ${y1} C${c1[0]} ${c1[1]}, ${x2} ${y2 - 40}, ${x2} ${y2}`; }
      else {
        const rechts = seite || x1 >= x2, xs = rechts ? x[von] + W + LUECKE / 2 : x[von] - LUECKE / 2, xe = x2 + (xs >= x2 ? 26 : -26);
        weg = `M${x1} ${y1} ${seite ? '' : `V${y1 + 20} `}H${xs} V${y2 - 22} H${xe} V${y2}`;
      }
      pfade += `<path class="${klasse}" d="${weg}" marker-end="url(#sz-spitze${klasse.includes('ant') ? '-a' : ''})"/>`;
    };
    G.nodes.forEach(n => {
      if (!alleEigen(n) && n.out && by(n.out)) pfeil(el[n.k].querySelector('.sz-port.unten'), n.out, false, 'sz-pf' + (kinder[n.k].includes(n.out) ? '' : ' quer'), n.k);
      n.aout.forEach((t, j) => { if (t && by(t)) pfeil(el[n.k].querySelector(`[data-port="${n.k}:${j}"]`), t, true, 'sz-pf ant' + (kinder[n.k].includes(t) ? '' : ' quer'), n.k); });
    });
    innen.insertAdjacentHTML('beforeend', `<svg class="sz-svg" width="${breit}" height="${hoch}" aria-hidden="true"><defs>
      <marker id="sz-spitze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sz-sp" d="M0 0L10 5L0 10z"/></marker>
      <marker id="sz-spitze-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sz-sp a" d="M0 0L10 5L0 10z"/></marker></defs>${pfade}<path class="sz-zug" d=""/></svg>`);
    return nummer;
  }
  function zeige(el, aufgabe) {
    el = typeof el === 'string' ? document.querySelector(el) : el;
    el.classList.add('sz-flaeche', 'sz-fest');
    el.innerHTML = '<div class="sz-innen"></div>';
    zeichne(el.firstChild, lesen(aufgabe), {});
    el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Aufbau des Szenarios als Kästen mit Pfeilen');
  }
  const Szenario = {zeige, zeichne, lesen, schreiben, art, alleEigen, kurz, SYMBOL, BREITE: W};
  if (typeof window !== 'undefined') window.Szenario = Szenario;
  if (typeof module !== 'undefined' && module.exports) module.exports = Szenario;
})();

   "titel": "Zahlen eingeben (zahlen)",
   "html": "<h2>Zahlen eingeben (zahlen)<\/h2><p class=\"info\">Für Rechenaufgaben mit einem oder mehreren Ergebnissen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Ergebnisse eintippen, auch mit Tausenderpunkt, Komma und Einheit (1.234,50 €). „Prüfen“ oder Enter. Falsche Felder werden rot, dazu kann ein Hinweis erscheinen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🔢 Zahlen eingeben<\/b> anklicken und je Feld Beschriftung, Lösung, Einheit und bei Bedarf einen Hinweis eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: je <code>t<\/code> (Beschriftung), <code>l<\/code> (Lösung als Zahl mit Punkt), <code>e<\/code> (Einheit), <code>h<\/code> (Hinweis bei Fehler)<\/li><li><code>tol<\/code>: Toleranz, Standard 0,005<\/li><li><code>knopf<\/code>: anderer Text für „Prüfen“<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"zahlen\",\n \"frage\": \"Probiere die Eingabe aus.\",\n \"felder\": [ { \"t\": \"Schreibe „eintausendzweihundertvierunddreißig Euro fünfzig“ als Zahl\", \"l\": 1234.5, \"e\": \"€\", \"h\": \"Zum Beispiel 1.234,50 oder 1234,5.\" }, { \"t\": \"Dieses Feld hat die Lösung 3,33 und die Toleranz 0,01. Tippe 3,34 ein\", \"l\": 3.33, \"tol\": 0.011, \"h\": \"Alles von 3,32 bis 3,34 zählt.\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Zuordnen",
   "titel": "Zuordnen (zuordnen)",
   "html": "<h2>Zuordnen (zuordnen)<\/h2><p class=\"info\">Für Kategorien: Begriffe, Beispiele oder Fälle in Felder sortieren.<\/p><h3>So arbeiten die Schüler<\/h3><p>Karten in das passende Feld ziehen oder erst die Karte, dann das Feld antippen. Nach „Prüfen“ bleiben richtige Karten liegen, falsche wandern zurück.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🗂 Zuordnen<\/b> anklicken, die Felder benennen und in jedes Feld seine Karten eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: <code>[[\"kennung\", \"Überschrift\"], …]<\/code>, mindestens zwei<\/li><li><code>karten<\/code>: je <code>t<\/code> (Text) und <code>z<\/code> (Kennung des richtigen Feldes)<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"zuordnen\",\n \"frage\": \"Welche Angabe gehört zu welchem Aufgabentyp?\",\n \"felder\": [ [ \"z\", \"Zuordnen\" ], [ \"l\", \"Lückentext\" ]\n ],\n \"karten\": [ { \"t\": \"felder mit Kennung und Überschrift\", \"z\": \"z\" }, { \"t\": \"karten mit Text und Kennung\", \"z\": \"z\" }, { \"t\": \"Karten ziehen oder antippen\", \"z\": \"z\" }, { \"t\": \"[[richtig|falsch]]\", \"z\": \"l\" }, { \"t\": \"Wortbank mit extra\", \"z\": \"l\" }, { \"t\": \"Auswahllisten\", \"z\": \"l\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Begriffe",
   "titel": "Begriffe eintippen (freitext)",
   "html": "<h2>Begriffe eintippen (freitext)<\/h2><p class=\"info\">Für Fachbegriffe, die die Schüler selbst wissen und schreiben sollen. Tippfehler werden erkannt.<\/p><h3>So arbeiten die Schüler<\/h3><p>Begriffe eintippen. Groß- und Kleinschreibung ist egal. Bei einem Tippfehler heißt es „fast richtig“ mit Hinweis auf die Schreibweise. Jedes Feld braucht einen anderen Begriff.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>✎ Begriffe eintippen<\/b> anklicken, die Felder beschriften und die möglichen Antworten eintragen (je Zeile ein Begriff, Schreibweisen mit Komma).<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: Beschriftungen, je ein Eingabefeld<\/li><li><code>antworten<\/code>: Liste der richtigen Begriffe, jeder als Liste gleichwertiger Schreibweisen<\/li><li><code>\"tippfehler\": \"ok\"<\/code>: Tippfehler zählen als richtig, <code>h<\/code>: Hinweis bei falscher Antwort<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"freitext\",\n \"frage\": \"Nenne die zwei Felder, die jede Aufgabe „Begriffe eintippen“ im JSON braucht. Probiere auch einen Tippfehler aus.\",\n \"felder\": [ \"1. Feld\", \"2. Feld\"\n ],\n \"antworten\": [ [ \"felder\" ], [ \"antworten\", \"Antworten-Liste\" ]\n ],\n \"h\": \"Lies oben unter „Im JSON“ nach.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Tabelle",
   "titel": "Tabelle ausfüllen (tabelle)",
   "html": "<h2>Tabelle ausfüllen (tabelle)<\/h2><p class=\"info\">Für Rechnungen in Tabellenform: Tilgungsplan, Abschreibung, Kalkulation.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die leeren Felder ausfüllen und „Prüfen“. Falsche Felder werden rot, je Spalte kann ein Hinweis mit der Rechenregel erscheinen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>▦ Tabelle ausfüllen<\/b> anklicken. Jede Zelle lässt sich umschalten: <b>T<\/b> Text, <b>#<\/b> vorgegebene Zahl, <b>✎<\/b> Eingabefeld mit Lösung.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>spalten<\/code>: Spaltenköpfe, <code>zeilen<\/code>: je Zeile genau so viele Zellen<\/li><li>Text oder Zahl = vorgegeben, <code>{\"l\": Lösung}<\/code> = Eingabefeld<\/li><li><code>hinweise<\/code>: Rechenregel je Spalte, <code>einheit<\/code>, <code>tol<\/code><\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"tabelle\",\n \"frage\": \"Fülle die leeren Felder aus. Nur Zellen mit {\\\"l\\\": …} sind Eingabefelder.\",\n \"einheit\": \"€\",\n \"spalten\": [ \"Stück\", \"Preis je Stück\", \"Gesamt\"\n ],\n \"zeilen\": [ [ \"3\", 2.5, { \"l\": 7.5 } ], [ \"4\", { \"l\": 1.5 }, 6 ], [ \"10\", 0.99, { \"l\": 9.9 } ]\n ],\n \"hinweise\": { \"1\": \"Preis je Stück = Gesamt : Stück\", \"2\": \"Gesamt = Stück · Preis je Stück\"\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Ja/Nein-Tabelle",
   "titel": "Ja/Nein-Tabelle (wahrheit)",
   "html": "<h2>Ja/Nein-Tabelle (wahrheit)<\/h2><p class=\"info\">Für Wahrheitstabellen (UND, ODER) und alle Tabellen, in denen je Zelle nur ja oder nein gefragt ist.<\/p><h3>So arbeiten die Schüler<\/h3><p>Felder mit „?“ anklicken: Jeder Klick wechselt zwischen ja und nein. Dann „Prüfen“.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Für diesen Typ gibt es noch keinen Baustein. In „Übung erstellen“ oben auf <b>JSON<\/b> umschalten und die Aufgabe dort eintragen, zum Beispiel das JSON unten kopieren und anpassen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>spalten<\/code>, <code>zeilen<\/code> wie bei der Tabelle<\/li><li><code>true<\/code> / <code>false<\/code> = vorgegeben, <code>{\"l\": true}<\/code> bzw. <code>{\"l\": false}<\/code> = Feld zum Anklicken<\/li><li><code>werte<\/code>: zwei eigene Wörter statt ja und nein, <code>hinweise<\/code> je Spalte<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"wahrheit\",\n \"frage\": \"Was bedeutet welche Zelle im JSON?\",\n \"spalten\": [ \"Zelle im JSON\", \"ist vorgegeben\", \"wird angeklickt\"\n ],\n \"zeilen\": [ [ \"true\", { \"l\": true }, { \"l\": false } ], [ \"{\\\"l\\\": false}\", { \"l\": false }, { \"l\": true } ], [ \"\\\"Text\\\"\", { \"l\": true }, { \"l\": false } ], [ \"{\\\"l\\\": true}\", { \"l\": false }, { \"l\": true } ]\n ],\n \"hinweise\": { \"1\": \"Vorgegeben ist alles ohne geschweifte Klammer.\", \"2\": \"Angeklickt werden nur Zellen der Form {\\\"l\\\": …}.\"\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

       }
      ],

   "kurz": "Buchungssatz",
   "titel": "Buchungssatz (buchungssatz)",
   "html": "<h2>Buchungssatz (buchungssatz)<\/h2><p class=\"info\">Für BWR: Buchungssätze bilden, mit Prüfung von Konten, Seiten, Steuer und Beträgen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Konto über Nummer oder Kürzel suchen (z. B. „ve“ oder „4400“), Betrag eintragen, weitere Konten mit „+ Soll-Konto“ / „+ Haben-Konto“. Die Rückmeldung sagt, ob Konten, Seiten oder Beträge nicht stimmen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>⚖ Buchungssatz<\/b> anklicken, mit „Konten auswählen …“ die Konten aus dem Kontenplan holen (auch Ablenker) und die Lösung in Soll und Haben eintragen. Schalter: „Jgst. 7“ (Konten ohne Nummer) und „Beträge ziehen“.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>konten<\/code>: Auswahl für die Schüler, <code>soll<\/code> / <code>haben<\/code>: <code>[[\"Konto\", Betrag], …]<\/code><\/li><li><code>steuer<\/code>: Steuerkonten für den Hinweis „Denke an …“, <code>nebenrechnung<\/code>: erscheint nach der Lösung<\/li><li><code>betraege<\/code>: Beträge zum Ziehen, <code>\"jgst\": 7<\/code>: Konten nur mit Kürzel<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"buchungssatz\",\n \"frage\": \"Kauf einer Maschine auf Ziel, netto 10.000,00 €, 19 % Umsatzsteuer. Bilde den Buchungssatz.\",\n \"konten\": [ \"0700 MA\", \"2600 VORST\", \"2800 BK\", \"4400 VE\", \"4800 UST\"\n ],\n \"soll\": [ [ \"0700 MA\", 10000 ], [ \"2600 VORST\", 1900 ]\n ],\n \"haben\": [ [ \"4400 VE\", 11900 ]\n ],\n \"steuer\": [ \"2600 VORST\"\n ],\n \"nebenrechnung\": \"Vorsteuer: 10.000,00 € · 19 : 100 = 1.900,00 €\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Lern-Chat",
   "titel": "Lern-Chat (chat)",
   "html": "<h2>Lern-Chat (chat)<\/h2><p class=\"info\">Für kleinschrittige Erarbeitung im Gespräch, wie bei LearningSnacks: Der Bot erklärt und fragt nach.<\/p><h3>So arbeiten die Schüler<\/h3><p>Knöpfe antippen oder Antwort eintippen und senden. Bei Fehlern erklärt der Bot und macht weiter. Am Ende stehen die Punkte, mit „Noch einmal“ beginnt der Chat neu.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>💬 Lern-Chat<\/b> anklicken und die Nachrichten eintragen. Je Nachricht wählst du: Text, Knöpfe, Zahl oder Begriff.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>name<\/code>, <code>bild<\/code> (Emoji), <code>nachrichten<\/code>: Text oder Frage <code>{\"bot\": \"…\"}<\/code> mit einer Antwortform<\/li><li><code>antworten<\/code>: Knöpfe mit <code>t<\/code>, <code>ok<\/code> und <code>r<\/code> (Antwort des Bots)<\/li><li><code>zahl<\/code>: <code>{\"l\": 200, \"e\": \"€\"}<\/code> oder <code>freitext<\/code>: <code>{\"antworten\": [[\"Begriff\"]]}<\/code>, dazu <code>r<\/code> und <code>rFalsch<\/code><\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"chat\",\n \"name\": \"Chat-Hilfe\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"nachrichten\": [ \"Hallo! Ich zeige dir die drei Antwortformen im Lern-Chat.\", { \"bot\": \"Erstens Knöpfe. Wie viele davon dürfen richtig sein?\", \"antworten\": [ { \"t\": \"nur einer\", \"r\": \"Es dürfen auch mehrere sein.\" }, { \"t\": \"einer oder mehrere\", \"ok\": true, \"r\": \"Genau, jeder Knopf mit \\\"ok\\\": true ist richtig.\" } ] }, { \"bot\": \"Zweitens eine Zahl. Wie viele Antwortformen gibt es insgesamt?\", \"zahl\": { \"l\": 3 }, \"r\": \"Richtig: Knöpfe, Zahl und Begriff.\", \"rFalsch\": \"Es sind drei: Knöpfe, Zahl und Begriff.\" }, { \"bot\": \"Drittens ein Begriff. In welchem Feld stehen alle Nachrichten?\", \"freitext\": { \"antworten\": [ [ \"nachrichten\" ] ] }, \"r\": \"Stimmt.\", \"rFalsch\": \"Sie stehen im Feld „nachrichten“.\" }, \"Das war alles. Verzweigungen zeigt die nächste Seite „Szenario“.\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "chat",
     "name": "Chat-Hilfe",
     "bild": "💡",
     "nachrichten": [
      "Hallo! Ich zeige dir die drei Antwortformen im Lern-Chat.",
      {
       "bot": "Erstens Knöpfe. Wie viele davon dürfen richtig sein?",
       "antworten": [
        {
         "t": "nur einer",
         "r": "Es dürfen auch mehrere sein."
        },
        {
         "t": "einer oder mehrere",
         "ok": true,
         "r": "Genau, jeder Knopf mit \"ok\": true ist richtig."
        }
       ]
      },
      {
       "bot": "Zweitens eine Zahl. Wie viele Antwortformen gibt es insgesamt?",
       "zahl": {
        "l": 3
       },
       "r": "Richtig: Knöpfe, Zahl und Begriff.",
       "rFalsch": "Es sind drei: Knöpfe, Zahl und Begriff."
      },
      {
       "bot": "Drittens ein Begriff. In welchem Feld stehen alle Nachrichten?",

        "antworten": [
         [
          "nachrichten"
         ]
        ]
       },
       "r": "Stimmt.",
       "rFalsch": "Sie stehen im Feld „nachrichten“."
      },
      "Das war alles. Verzweigungen zeigt die nächste Seite „Szenario“."
     ]
    }
   ],
