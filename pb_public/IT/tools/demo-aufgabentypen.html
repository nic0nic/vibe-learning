document.addEventListener('DOMContentLoaded', function () {
  if (!window.Designs) return;
  var L = Designs.liste().filter(function (d) { return d.id !== 'standard'; }), root = document.documentElement, esc = Aufgaben.esc;

    + L.filter(function (d) { return !d.gruppe; }).map(opt).join('')
    + gruppen.map(function (g) { return '<optgroup label="' + esc(g) + '">' + L.filter(function (d) { return d.gruppe === g; }).map(opt).join('') + '</optgroup>'; }).join('')
    + '</select> <span class="muted" id="demoDesignText"></span>';
  document.querySelector('.bar').appendChild(box);
  var wahl = box.querySelector('select'), text = box.querySelector('#demoDesignText');
  if (root.dataset.design && Designs.hole(root.dataset.design)) wahl.value = root.dataset.design;   // im Konto gewähltes Design

  wahl.addEventListener('change', function () {
    Designs.anwenden(wahl.value);

      var t = null; try { t = localStorage.getItem('wenn-theme'); } catch (e) {}
      root.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    zeige(); bild(true);
  });
  zeige();
  // Bild des Szenarios (lib/szenario.js) in den Platzhalter .sz-bild zeichnen, sobald die Seite „Szenario“ angezeigt wird

  function bild(neu) { var el = document.querySelector('.sz-bild'); if (el && chat && window.Szenario && (neu || !el.firstChild)) Szenario.zeige(el, chat); }

  bild(false);
});

   "kurz": "Multiple Choice",
   "titel": "Multiple Choice (mc)",
   "html": "<h2>Multiple Choice (mc)<\/h2><p class=\"info\">Für schnelle Verständnisfragen mit einer oder mehreren richtigen Antworten.<\/p><h3>So arbeiten die Schüler<\/h3><p>Antwort antippen. Ist genau eine Antwort richtig, wird sofort geprüft; bei mehreren richtigen Antworten wählen die Schüler aus und drücken „Prüfen“. Zu jeder falschen Antwort kann eine Erklärung erscheinen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>☑ Multiple Choice<\/b> anklicken, Antworten eintragen und bei den richtigen das Häkchen setzen. Unter jeder falschen Antwort ist Platz für „Warum falsch?“.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>options<\/code>: die Antworten, <code>correct<\/code>: Nummern der richtigen (gezählt ab 0)<\/li><li><code>why<\/code>: Erklärung je falscher Antwort, <code>after<\/code>: Zusatz nach der richtigen Antwort<\/li><li><code>\"mischen\": false<\/code>: Reihenfolge behalten, <code>\"html\": true<\/code>: Antworten mit Formatierung (z. B. Brüche)<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"mc\",\n \"frage\": \"Wann wird eine Multiple-Choice-Aufgabe sofort beim Antippen geprüft?\",\n \"options\": [ \"wenn genau eine Antwort richtig ist\", \"immer\", \"nie, es braucht immer „Prüfen“\"\n ],\n \"correct\": [ 0\n ],\n \"why\": { \"1\": \"Bei mehreren richtigen Antworten müssen die Schüler erst alle auswählen.\", \"2\": \"Bei genau einer richtigen Antwort reicht das Antippen.\"\n },\n \"after\": \"Mit \\\"sofort\\\": false lässt sich das abschalten.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "titel": "Zahlen eingeben (zahlen)",
   "html": "<h2>Zahlen eingeben (zahlen)<\/h2><p class=\"info\">Für Rechenaufgaben mit einem oder mehreren Ergebnissen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Ergebnisse eintippen, auch mit Tausenderpunkt, Komma und Einheit (1.234,50 €). „Prüfen“ oder Enter. Falsche Felder werden rot, dazu kann ein Hinweis erscheinen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🔢 Zahlen eingeben<\/b> anklicken und je Feld Beschriftung, Lösung, Einheit und bei Bedarf einen Hinweis eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: je <code>t<\/code> (Beschriftung), <code>l<\/code> (Lösung als Zahl mit Punkt), <code>e<\/code> (Einheit), <code>h<\/code> (Hinweis bei Fehler)<\/li><li><code>tol<\/code>: Toleranz, Standard 0,005<\/li><li><code>knopf<\/code>: anderer Text für „Prüfen“<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"zahlen\",\n \"frage\": \"Probiere die Eingabe aus.\",\n \"felder\": [ { \"t\": \"Schreibe „eintausendzweihundertvierunddreißig Euro fünfzig“ als Zahl\", \"l\": 1234.5, \"e\": \"€\", \"h\": \"Zum Beispiel 1.234,50 oder 1234,5.\" }, { \"t\": \"Dieses Feld hat die Lösung 3,33 und die Toleranz 0,01. Tippe 3,34 ein\", \"l\": 3.33, \"tol\": 0.011, \"h\": \"Alles von 3,32 bis 3,34 zählt.\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Lückentext",
   "titel": "Lückentext (luecken)",
   "html": "<h2>Lückentext (luecken)<\/h2><p class=\"info\">Für Merksätze und Regeln: mit Auswahllisten oder mit einer Wortbank zum Ziehen.<\/p><h3>So arbeiten die Schüler<\/h3><p>In jeder Lücke die richtige Antwort wählen oder ein Wort aus der Wortbank in die Lücke ziehen (oder erst Wort, dann Lücke antippen).<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>⬚ Lückentext<\/b> anklicken und den Text schreiben. Ein Wort doppelklicken macht es zur Lücke; danach die falschen Antworten eintragen. Oben zwischen „Auswahllisten“ und „Wortbank“ wählen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>text<\/code> mit Lücken <code>[[richtig|falsch|falsch]]<\/code> – die <b>erste<\/b> Antwort ist die richtige<\/li><li><code>\"ziehen\": true<\/code>: Wortbank statt Auswahllisten, dann reicht <code>[[Wort]]<\/code><\/li><li><code>extra<\/code>: weitere Ablenker für die Wortbank<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"luecken\",\n \"frage\": \"Vervollständige die Anleitung.\",\n \"text\": \"Eine Lücke steht in [[doppelten|einfachen|runden]] eckigen Klammern. Die [[erste|letzte|längste]] Antwort darin ist die richtige. Getrennt wird mit einem [[senkrechten Strich|Komma|Punkt]].\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "html": "<h2>Zuordnen (zuordnen)<\/h2><p class=\"info\">Für Kategorien: Begriffe, Beispiele oder Fälle in Felder sortieren.<\/p><h3>So arbeiten die Schüler<\/h3><p>Karten in das passende Feld ziehen oder erst die Karte, dann das Feld antippen. Nach „Prüfen“ bleiben richtige Karten liegen, falsche wandern zurück.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🗂 Zuordnen<\/b> anklicken, die Felder benennen und in jedes Feld seine Karten eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: <code>[[\"kennung\", \"Überschrift\"], …]<\/code>, mindestens zwei<\/li><li><code>karten<\/code>: je <code>t<\/code> (Text) und <code>z<\/code> (Kennung des richtigen Feldes)<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"zuordnen\",\n \"frage\": \"Welche Angabe gehört zu welchem Aufgabentyp?\",\n \"felder\": [ [ \"z\", \"Zuordnen\" ], [ \"l\", \"Lückentext\" ]\n ],\n \"karten\": [ { \"t\": \"felder mit Kennung und Überschrift\", \"z\": \"z\" }, { \"t\": \"karten mit Text und Kennung\", \"z\": \"z\" }, { \"t\": \"Karten ziehen oder antippen\", \"z\": \"z\" }, { \"t\": \"[[richtig|falsch]]\", \"z\": \"l\" }, { \"t\": \"Wortbank mit extra\", \"z\": \"l\" }, { \"t\": \"Auswahllisten\", \"z\": \"l\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Begriffe",
   "titel": "Begriffe eintippen (freitext)",
   "html": "<h2>Begriffe eintippen (freitext)<\/h2><p class=\"info\">Für Fachbegriffe, die die Schüler selbst wissen und schreiben sollen. Tippfehler werden erkannt.<\/p><h3>So arbeiten die Schüler<\/h3><p>Begriffe eintippen. Groß- und Kleinschreibung ist egal. Bei einem Tippfehler heißt es „fast richtig“ mit Hinweis auf die Schreibweise. Jedes Feld braucht einen anderen Begriff.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>✎ Begriffe eintippen<\/b> anklicken, die Felder beschriften und die möglichen Antworten eintragen (je Zeile ein Begriff, Schreibweisen mit Komma).<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>felder<\/code>: Beschriftungen, je ein Eingabefeld<\/li><li><code>antworten<\/code>: Liste der richtigen Begriffe, jeder als Liste gleichwertiger Schreibweisen<\/li><li><code>\"tippfehler\": \"ok\"<\/code>: Tippfehler zählen als richtig, <code>h<\/code>: Hinweis bei falscher Antwort<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"freitext\",\n \"frage\": \"Nenne die zwei Felder, die jede Aufgabe „Begriffe eintippen“ im JSON braucht. Probiere auch einen Tippfehler aus.\",\n \"felder\": [ \"1. Feld\", \"2. Feld\"\n ],\n \"antworten\": [ [ \"felder\" ], [ \"antworten\", \"Antworten-Liste\" ]\n ],\n \"h\": \"Lies oben unter „Im JSON“ nach.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

  {
   "kurz": "Tabelle",
   "titel": "Tabelle ausfüllen (tabelle)",
   "html": "<h2>Tabelle ausfüllen (tabelle)<\/h2><p class=\"info\">Für Rechnungen in Tabellenform: Tilgungsplan, Abschreibung, Kalkulation.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die leeren Felder ausfüllen und „Prüfen“. Falsche Felder werden rot, je Spalte kann ein Hinweis mit der Rechenregel erscheinen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>▦ Tabelle ausfüllen<\/b> anklicken. Jede Zelle lässt sich umschalten: <b>T<\/b> Text, <b>#<\/b> vorgegebene Zahl, <b>✎<\/b> Eingabefeld mit Lösung.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>spalten<\/code>: Spaltenköpfe, <code>zeilen<\/code>: je Zeile genau so viele Zellen<\/li><li>Text oder Zahl = vorgegeben, <code>{\"l\": Lösung}<\/code> = Eingabefeld<\/li><li><code>hinweise<\/code>: Rechenregel je Spalte, <code>einheit<\/code>, <code>tol<\/code><\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"tabelle\",\n \"frage\": \"Fülle die leeren Felder aus. Nur Zellen mit {\\\"l\\\": …} sind Eingabefelder.\",\n \"einheit\": \"€\",\n \"spalten\": [ \"Stück\", \"Preis je Stück\", \"Gesamt\"\n ],\n \"zeilen\": [ [ \"3\", 2.5, { \"l\": 7.5 } ], [ \"4\", { \"l\": 1.5 }, 6 ], [ \"10\", 0.99, { \"l\": 9.9 } ]\n ],\n \"hinweise\": { \"1\": \"Preis je Stück = Gesamt : Stück\", \"2\": \"Gesamt = Stück · Preis je Stück\"\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Ja/Nein-Tabelle",
   "titel": "Ja/Nein-Tabelle (wahrheit)",
   "html": "<h2>Ja/Nein-Tabelle (wahrheit)<\/h2><p class=\"info\">Für Wahrheitstabellen (UND, ODER) und alle Tabellen, in denen je Zelle nur ja oder nein gefragt ist.<\/p><h3>So arbeiten die Schüler<\/h3><p>Felder mit „?“ anklicken: Jeder Klick wechselt zwischen ja und nein. Dann „Prüfen“.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Für diesen Typ gibt es noch keinen Baustein. In „Übung erstellen“ oben auf <b>JSON<\/b> umschalten und die Aufgabe dort eintragen, zum Beispiel das JSON unten kopieren und anpassen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>spalten<\/code>, <code>zeilen<\/code> wie bei der Tabelle<\/li><li><code>true<\/code> / <code>false<\/code> = vorgegeben, <code>{\"l\": true}<\/code> bzw. <code>{\"l\": false}<\/code> = Feld zum Anklicken<\/li><li><code>werte<\/code>: zwei eigene Wörter statt ja und nein, <code>hinweise<\/code> je Spalte<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"wahrheit\",\n \"frage\": \"Was bedeutet welche Zelle im JSON?\",\n \"spalten\": [ \"Zelle im JSON\", \"ist vorgegeben\", \"wird angeklickt\"\n ],\n \"zeilen\": [ [ \"true\", { \"l\": true }, { \"l\": false } ], [ \"{\\\"l\\\": false}\", { \"l\": false }, { \"l\": true } ], [ \"\\\"Text\\\"\", { \"l\": true }, { \"l\": false } ], [ \"{\\\"l\\\": true}\", { \"l\": false }, { \"l\": true } ]\n ],\n \"hinweise\": { \"1\": \"Vorgegeben ist alles ohne geschweifte Klammer.\", \"2\": \"Angeklickt werden nur Zellen der Form {\\\"l\\\": …}.\"\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "wahrheit",
     "frage": "Was bedeutet welche Zelle im JSON?",
     "spalten": [
      "Zelle im JSON",
      "ist vorgegeben",
      "wird angeklickt"
     ],
     "zeilen": [
      [
       "true",
       {
        "l": true
       },

        "l": false
       }
      ],
      [
       "{\"l\": false}",

        "l": false
       },
       {
        "l": true
       }
      ],
      [
       "\"Text\"",
       {
        "l": true
       },
       {
        "l": false
       }
      ],
      [
       "{\"l\": true}",

        "l": false
       },
       {

       }
      ]
     ],
     "hinweise": {
      "1": "Vorgegeben ist alles ohne geschweifte Klammer.",
      "2": "Angeklickt werden nur Zellen der Form {\"l\": …}."
     }
    }

   "kurz": "Buchungssatz",
   "titel": "Buchungssatz (buchungssatz)",
   "html": "<h2>Buchungssatz (buchungssatz)<\/h2><p class=\"info\">Für BWR: Buchungssätze bilden, mit Prüfung von Konten, Seiten, Steuer und Beträgen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Konto über Nummer oder Kürzel suchen (z. B. „ve“ oder „4400“), Betrag eintragen, weitere Konten mit „+ Soll-Konto“ / „+ Haben-Konto“. Die Rückmeldung sagt, ob Konten, Seiten oder Beträge nicht stimmen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>⚖ Buchungssatz<\/b> anklicken, mit „Konten auswählen …“ die Konten aus dem Kontenplan holen (auch Ablenker) und die Lösung in Soll und Haben eintragen. Schalter: „Jgst. 7“ (Konten ohne Nummer) und „Beträge ziehen“.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>konten<\/code>: Auswahl für die Schüler, <code>soll<\/code> / <code>haben<\/code>: <code>[[\"Konto\", Betrag], …]<\/code><\/li><li><code>steuer<\/code>: Steuerkonten für den Hinweis „Denke an …“, <code>nebenrechnung<\/code>: erscheint nach der Lösung<\/li><li><code>betraege<\/code>: Beträge zum Ziehen, <code>\"jgst\": 7<\/code>: Konten nur mit Kürzel<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"buchungssatz\",\n \"frage\": \"Kauf einer Maschine auf Ziel, netto 10.000,00 €, 19 % Umsatzsteuer. Bilde den Buchungssatz.\",\n \"konten\": [ \"0700 MA\", \"2600 VORST\", \"2800 BK\", \"4400 VE\", \"4800 UST\"\n ],\n \"soll\": [ [ \"0700 MA\", 10000 ], [ \"2600 VORST\", 1900 ]\n ],\n \"haben\": [ [ \"4400 VE\", 11900 ]\n ],\n \"steuer\": [ \"2600 VORST\"\n ],\n \"nebenrechnung\": \"Vorsteuer: 10.000,00 € · 19 : 100 = 1.900,00 €\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Lern-Chat",
   "titel": "Lern-Chat (chat)",
   "html": "<h2>Lern-Chat (chat)<\/h2><p class=\"info\">Für kleinschrittige Erarbeitung im Gespräch, wie bei LearningSnacks: Der Bot erklärt und fragt nach.<\/p><h3>So arbeiten die Schüler<\/h3><p>Knöpfe antippen oder Antwort eintippen und senden. Bei Fehlern erklärt der Bot und macht weiter. Am Ende stehen die Punkte, mit „Noch einmal“ beginnt der Chat neu.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>💬 Lern-Chat<\/b> anklicken und die Nachrichten eintragen. Je Nachricht wählst du: Text, Knöpfe, Zahl oder Begriff.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>name<\/code>, <code>bild<\/code> (Emoji), <code>nachrichten<\/code>: Text oder Frage <code>{\"bot\": \"…\"}<\/code> mit einer Antwortform<\/li><li><code>antworten<\/code>: Knöpfe mit <code>t<\/code>, <code>ok<\/code> und <code>r<\/code> (Antwort des Bots)<\/li><li><code>zahl<\/code>: <code>{\"l\": 200, \"e\": \"€\"}<\/code> oder <code>freitext<\/code>: <code>{\"antworten\": [[\"Begriff\"]]}<\/code>, dazu <code>r<\/code> und <code>rFalsch<\/code><\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"chat\",\n \"name\": \"Chat-Hilfe\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"nachrichten\": [ \"Hallo! Ich zeige dir die drei Antwortformen im Lern-Chat.\", { \"bot\": \"Erstens Knöpfe. Wie viele davon dürfen richtig sein?\", \"antworten\": [ { \"t\": \"nur einer\", \"r\": \"Es dürfen auch mehrere sein.\" }, { \"t\": \"einer oder mehrere\", \"ok\": true, \"r\": \"Genau, jeder Knopf mit \\\"ok\\\": true ist richtig.\" } ] }, { \"bot\": \"Zweitens eine Zahl. Wie viele Antwortformen gibt es insgesamt?\", \"zahl\": { \"l\": 3 }, \"r\": \"Richtig: Knöpfe, Zahl und Begriff.\", \"rFalsch\": \"Es sind drei: Knöpfe, Zahl und Begriff.\" }, { \"bot\": \"Drittens ein Begriff. In welchem Feld stehen alle Nachrichten?\", \"freitext\": { \"antworten\": [ [ \"nachrichten\" ] ] }, \"r\": \"Stimmt.\", \"rFalsch\": \"Sie stehen im Feld „nachrichten“.\" }, \"Das war alles. Verzweigungen zeigt die nächste Seite „Szenario“.\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "chat",
     "name": "Chat-Hilfe",
     "bild": "💡",
     "nachrichten": [
      "Hallo! Ich zeige dir die drei Antwortformen im Lern-Chat.",
      {
       "bot": "Erstens Knöpfe. Wie viele davon dürfen richtig sein?",
       "antworten": [
        {
         "t": "nur einer",
         "r": "Es dürfen auch mehrere sein."
        },
        {
         "t": "einer oder mehrere",
         "ok": true,
         "r": "Genau, jeder Knopf mit \"ok\": true ist richtig."
        }
       ]
      },
      {
       "bot": "Zweitens eine Zahl. Wie viele Antwortformen gibt es insgesamt?",
       "zahl": {
        "l": 3
       },
       "r": "Richtig: Knöpfe, Zahl und Begriff.",
       "rFalsch": "Es sind drei: Knöpfe, Zahl und Begriff."
      },
      {
       "bot": "Drittens ein Begriff. In welchem Feld stehen alle Nachrichten?",
       "freitext": {
        "antworten": [
         [
          "nachrichten"
         ]
        ]
       },
       "r": "Stimmt.",
       "rFalsch": "Sie stehen im Feld „nachrichten“."
      },
      "Das war alles. Verzweigungen zeigt die nächste Seite „Szenario“."
     ]
    }

   "kurz": "Szenario",
   "titel": "Szenario (chat mit Verzweigungen)",
   "html": "<h2>Szenario (chat mit Verzweigungen)<\/h2><p class=\"info\">Der Lern-Chat kann jetzt verzweigen: Entscheidungen führen zu unterschiedlichen Verläufen, zum Beispiel bei einer Kreditberatung oder einem Datenschutz-Fall. Alte Chats laufen unverändert.<\/p><h3>So arbeiten die Schüler<\/h3><p>Wie im Lern-Chat: Knöpfe antippen oder Antworten eintippen. Je nach Antwort geht das Gespräch anders weiter.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>💬 Lern-Chat<\/b> anklicken und <b>🗺 Szenario visuell bauen …<\/b> wählen: Dort setzt du die Nachrichten als Kästen zusammen und ziehst Pfeile zwischen ihnen. Oder den Schalter „Szenario (Verzweigungen)“ einschalten, Nachrichten eine <b>Marke<\/b> geben und bei Antworten „weiter zu“ dieser Marke wählen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>\"id\": \"marke\"<\/code> an einer Nachricht: Sprungziel<\/li><li><code>\"weiter\": \"marke\"<\/code> an einem Antwort-Knopf oder einer Nachricht: dorthin springen statt zur nächsten Nachricht<\/li><li><code>\"ende\": true<\/code>: Der Chat endet hier<\/li><li>Hat kein Knopf <code>\"ok\": true<\/code>, ist es eine Entscheidung ohne richtig und falsch<\/li><li>Text mit Marke als Objekt: <code>{\"bot\": \"Text\", \"id\": \"marke\"}<\/code><\/li><\/ul><p><b>Achte darauf:<\/b> Jeder Zweig braucht ein Ende – entweder eine Nachricht mit „Ende“ oder einen Sprung zu einem gemeinsamen Schluss. Sonst läuft der Chat einfach in den nächsten Zweig weiter.<\/p><h3>Das Szenario unten als Bild<\/h3><p>So zeigt es auch der Baukasten unter „🗺 Szenario visuell bauen …“: Jeder Kasten ist eine Nachricht, jeder Pfeil führt zur nächsten. ● ist ein Anschluss, ■ ein Ende, ein gestrichelter Pfeil springt zurück.<\/p><div class=\"sz-bild\"><\/div><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"chat\",\n \"name\": \"Szenario-Hilfe\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"nachrichten\": [ \"Hallo! Ich bin selbst ein Szenario und zeige dir, wie ich gebaut bin.\", { \"id\": \"menue\", \"bot\": \"Was möchtest du wissen?\", \"antworten\": [ { \"t\": \"Wie springe ich?\", \"weiter\": \"sprung\" }, { \"t\": \"Was ist eine Entscheidung?\", \"weiter\": \"wahl\" }, { \"t\": \"Wie endet ein Chat?\", \"weiter\": \"schluss\" } ] }, { \"id\": \"sprung\", \"bot\": \"Diese Nachricht hat die Marke &lt;code&gt;sprung&lt;/code&gt;. Der Knopf, den du gedrückt hast, hat &lt;code&gt;\\\"weiter\\\": \\\"sprung\\\"&lt;/code&gt;.\" }, { \"bot\": \"Wohin geht es ohne &lt;code&gt;weiter&lt;/code&gt;?\", \"antworten\": [ { \"t\": \"zur nächsten Nachricht\", \"ok\": true, \"r\": \"Genau, einfach der Reihe nach.\" }, { \"t\": \"zum Anfang\", \"r\": \"Nein: Ohne &lt;code&gt;weiter&lt;/code&gt; kommt die nächste Nachricht.\" } ], \"weiter\": \"menue\" }, { \"id\": \"wahl\", \"bot\": \"Die Frage „Was möchtest du wissen?“ ist eine Entscheidung: Kein Knopf hat &lt;code&gt;\\\"ok\\\": true&lt;/code&gt;. Sie zählt nicht als Frage und wird nicht als richtig oder falsch gewertet.\", \"weiter\": \"menue\" }, { \"id\": \"schluss\", \"bot\": \"Eine Nachricht mit &lt;code&gt;\\\"ende\\\": true&lt;/code&gt; beendet den Chat – so wie diese. Mit „Noch einmal“ kannst du die anderen Wege gehen.\", \"ende\": true }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "chat",
     "name": "Szenario-Hilfe",
     "bild": "🧭",
     "nachrichten": [
      "Hallo! Ich bin selbst ein Szenario und zeige dir, wie ich gebaut bin.",
      {
       "id": "menue",
       "bot": "Was möchtest du wissen?",
       "antworten": [
        {
         "t": "Wie springe ich?",
         "weiter": "sprung"
        },
        {
         "t": "Was ist eine Entscheidung?",
         "weiter": "wahl"
        },
        {
         "t": "Wie endet ein Chat?",
         "weiter": "schluss"
        }
       ]
      },
      {
       "id": "sprung",
       "bot": "Diese Nachricht hat die Marke <code>sprung<\/code>. Der Knopf, den du gedrückt hast, hat <code>\"weiter\": \"sprung\"<\/code>."
      },
      {
       "bot": "Wohin geht es ohne <code>weiter<\/code>?",
       "antworten": [
        {
         "t": "zur nächsten Nachricht",
         "ok": true,
         "r": "Genau, einfach der Reihe nach."
        },
        {
         "t": "zum Anfang",
         "r": "Nein: Ohne <code>weiter<\/code> kommt die nächste Nachricht."
        }
       ],
       "weiter": "menue"
      },
      {
       "id": "wahl",
       "bot": "Die Frage „Was möchtest du wissen?“ ist eine Entscheidung: Kein Knopf hat <code>\"ok\": true<\/code>. Sie zählt nicht als Frage und wird nicht als richtig oder falsch gewertet.",
       "weiter": "menue"
      },
      {
       "id": "schluss",
       "bot": "Eine Nachricht mit <code>\"ende\": true<\/code> beendet den Chat – so wie diese. Mit „Noch einmal“ kannst du die anderen Wege gehen.",
       "ende": true
      }
     ]
    }

   "kurz": "Kombi",
   "titel": "Kombinierte Aufgabe (kombi)",
   "html": "<h2>Kombinierte Aufgabe (kombi)<\/h2><p class=\"info\">Für Aufgaben in mehreren Schritten: erst rechnen, dann buchen, dann beurteilen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Zuerst ist nur Teil 1 zu sehen. Jeder weitere Teil erscheint, sobald der vorige richtig gelöst ist.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🧩 Kombinierte Aufgabe<\/b> (unter „Kombinieren“) anklicken und Bausteine in die Zone „＋ Teil …“ ziehen. Oder einen Baustein auf eine vorhandene Aufgabe ziehen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>teile<\/code>: Liste von mindestens zwei Aufgaben beliebigen Typs (keine Kombi in der Kombi)<\/li><li><code>frage<\/code>, <code>material<\/code>, <code>ok<\/code> der Kombi stehen über bzw. unter allen Teilen<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"kombi\",\n \"frage\": \"Diese Aufgabe besteht aus zwei Teilen.\",\n \"ok\": \"Beide Teile gelöst.\",\n \"teile\": [ { \"typ\": \"zahlen\", \"frage\": \"Teil 1: Wie viele Teile braucht eine kombinierte Aufgabe mindestens?\", \"felder\": [ { \"t\": \"Anzahl\", \"l\": 2, \"h\": \"Mit nur einem Teil wäre es eine einfache Aufgabe.\" } ] }, { \"typ\": \"mc\", \"frage\": \"Teil 2: Wann ist dieser zweite Teil erschienen?\", \"options\": [ \"als Teil 1 richtig gelöst war\", \"sofort beim Öffnen\", \"nach dem ersten Versuch, egal ob richtig\" ], \"correct\": [ 0 ] }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Verbessern",
   "titel": "Fehler verbessern (verbessern)",
   "html": "<h2>Fehler verbessern (verbessern)<\/h2><p class=\"info\">Fehlersuche wie in den Bereichen HTML und Python, aber für beliebige Texte: Rechtschreibung, Grammatik, Code, Buchungssätze.<\/p><h3>So arbeiten die Schüler<\/h3><p>Erst die Zeile mit dem Fehler anklicken. Dann in dieser Zeile alle falschen Stellen anklicken (nochmal klicken wählt wieder ab) und „Prüfen“. Zum Schluss die Stellen verbessern und wieder „Prüfen“. Bei nur einer Zeile entfällt der erste Schritt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🩹 Fehler verbessern<\/b> anklicken und den Text mit den eingebauten Fehlern eintragen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>text<\/code>: reiner Text, Zeilen mit <code>\\n<\/code>, Fehler als <code>[[falsch|richtig]]<\/code> – das <b>Falsche zuerst<\/b>, es wird angezeigt<\/li><li>weitere richtige Lösungen anhängen: <code>[[falsch|richtig|auch richtig]]<\/code>; <code>[[zu viel|]]<\/code> = Stelle löschen<\/li><li>Stellen sind Wörter (durch Leerzeichen getrennt); ein Fehler mitten im Wort braucht eine eigene Klammer: <code>Titel[[&lt;/h2&gt;|&lt;/h1&gt;]]<\/code><\/li><li><code>\"mono\": true<\/code>: Code, <code>\"gross\": false<\/code>: Groß/klein egal, <code>h<\/code>: Hinweis<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"verbessern\",\n \"frage\": \"In dieser Anleitung stecken drei Fehler. Finde und verbessere sie.\",\n \"text\": \"Fehler stehen in [[einfachen|doppelten]] eckigen Klammern.\\nIn der Klammer steht zuerst das [[Richtige|Falsche]] und danach die Verbesserung.\\nDie Schüler klicken zuerst die Zeile mit dem Fehler an.\\nGetrennt wird mit einem senkrechten [[Komma|Strich]].\",\n \"gross\": false,\n \"h\": \"Lies oben unter „Im JSON“ nach.\",\n \"ok\": \"Alle drei Fehler verbessert – so funktioniert der Typ.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "verbessern",

     "gross": false,
     "h": "Lies oben unter „Im JSON“ nach.",
     "ok": "Alle drei Fehler verbessert – so funktioniert der Typ."
    }
   ],
   "id": "s12"
  },
  {
   "kurz": "Kreuzwort",
   "titel": "Kreuzworträtsel (kreuzwort)",
   "html": "<h2>Kreuzworträtsel (kreuzwort)<\/h2><p class=\"info\">Zum Wiederholen von Fachbegriffen. Sparsam einsetzen: Es kostet die Schüler viel Zeit für wenige Begriffe.<\/p><h3>So arbeiten die Schüler<\/h3><p>Ein Feld oder einen Hinweis anklicken und tippen, der Cursor springt weiter. Leertaste oder nochmaliges Antippen wechselt zwischen waagrecht und senkrecht, die Pfeiltasten bewegen den Cursor. „Prüfen“ färbt falsche Buchstaben rot.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Aufgaben“ den Baustein <b>🔠 Kreuzworträtsel<\/b> anklicken und je Zeile Lösungswort und Hinweis eintragen. Das Gitter entsteht von selbst und sieht immer gleich aus.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>woerter<\/code>: Liste aus <code>{\"w\": \"Wort\", \"t\": \"Hinweis\"}<\/code>, 2 bis 25 Wörter<\/li><li>Buchstaben A–Z, Ä, Ö, Ü; ß wird SS, Leerzeichen und Bindestriche entfallen<\/li><li>Wörter ohne gemeinsamen Buchstaben stehen einzeln unter dem Gitter<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"kreuzwort\",\n \"frage\": \"Löse das Rätsel rund um das Kreuzworträtsel.\",\n \"woerter\": [ { \"w\": \"Gitter\", \"t\": \"Es entsteht von selbst aus der Wortliste\" }, { \"w\": \"Hinweis\", \"t\": \"Das steht im Feld t\" }, { \"w\": \"Leertaste\", \"t\": \"Wechselt die Schreibrichtung\" }, { \"w\": \"Baukasten\", \"t\": \"Dort stellst du die Aufgabe zusammen\" }, { \"w\": \"Senkrecht\", \"t\": \"Von oben nach unten\" }, { \"w\": \"Umlaut\", \"t\": \"Ä, Ö oder Ü: ein … bekommt ein eigenes Feld\" }\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Training",
   "titel": "Training (Schritt mit training)",
   "html": "<h2>Training (Schritt mit training)<\/h2><p class=\"info\">Für Drill: Kopfrechnen oder Vokabeln, eine Aufgabe nach der anderen, auf Wunsch auf Zeit oder endlos mit Serie und Bestleistung.<\/p><h3>So arbeiten die Schüler<\/h3><p>„Start“ drücken, Antwort eintippen und Enter (oder aus vier Antworten wählen). Am Ende stehen Ergebnis, Bestleistung und die Fehler.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links ganz oben <b>⏱ Training (Zeit / endlos)<\/b> anklicken. Das Training ist kein Aufgabentyp, sondern ein eigener Schritt: Es steht allein auf seiner Seite. Zahlen-Aufgaben entstehen aus einer Vorlage mit Zufallswerten, Vokabeln lassen sich aus Excel oder Quizlet einfügen.<\/p><p><b>Im JSON:<\/b><\/p><ul><li>Schritt mit <code>training<\/code> statt <code>aufgaben<\/code><\/li><li><code>\"antwort\"<\/code>: <code>\"eingabe\"<\/code> oder <code>\"mc\"<\/code>, <code>anzahl<\/code>: Aufgaben pro Runde (weglassen = endlos)<\/li><li><code>zeit<\/code>: <code>{\"start\": 5, \"schritt\": -0.1, \"min\": 1.5}<\/code> (weglassen = ohne Zeit)<\/li><li><code>szenarien<\/code>: Zahlen-Aufgaben mit <code>frage<\/code>, <code>werte<\/code>, <code>loesung<\/code> – oder <code>woerterbuch<\/code> mit <code>eintraege<\/code><\/li><li><code>stufen<\/code>: mehrere Stufen mit eigenem Inhalt, eigener Antwortform und Zeit<\/li><\/ul><details><summary>JSON dieses Schritts anzeigen<\/summary><pre>{\n \"kurz\": \"Training\",\n \"titel\": \"Training\",\n \"training\": { \"antwort\": \"eingabe\", \"anzahl\": 5, \"szenarien\": [ { \"frage\": \"{a} · {b} =\", \"werte\": { \"a\": [ 2, 9 ], \"b\": [ 2, 9 ] }, \"loesung\": \"a * b\", \"falsch\": [ \"a + b\" ] } ]\n } }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Reihenfolge",
   "titel": "Reihenfolge (reihenfolge)",
   "html": "<h2>Reihenfolge (reihenfolge) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für Abläufe und Schemata: Kalkulationsschema, Schritte eines Verfahrens, Zeilen eines Programms.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die Karten erscheinen gemischt. Sie lassen sich ziehen, mit ▲ ▼ verschieben oder man tippt erst eine Karte und dann die Zielstelle an. „Prüfen“ zeigt, welche Karten schon richtig stehen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>⇅ Reihenfolge<\/b> anklicken, die Karten in der richtigen Reihenfolge eintragen. Der Schalter „Code“ zeigt die Karten in Schreibmaschinenschrift und behält die Einrückung.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>karten<\/code>: die Texte in der <b>richtigen<\/b> Reihenfolge, gemischt wird von selbst<\/li><li><code>\"mono\": true<\/code>: Karten sind reiner Text (Codezeilen)<\/li><li><code>h<\/code>: Hinweis bei falscher Reihenfolge<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"reihenfolge\",\n \"frage\": \"Bringe die Schritte in die richtige Reihenfolge: So entsteht eine Reihenfolge-Aufgabe.\",\n \"karten\": [ \"Tools → Übung erstellen öffnen\", \"Links unter „Experimentell (β)“ den Baustein „Reihenfolge“ anklicken\", \"Aufgabenstellung eintragen\", \"Karten in der richtigen Reihenfolge eintragen\", \"Mit „Vorschau“ ausprobieren\", \"Herunterladen oder einreichen\"\n ],\n \"h\": \"Erst öffnen, dann den Baustein wählen, zuletzt herunterladen.\",\n \"ok\": \"Genau so entsteht die Aufgabe.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Offen",
   "titel": "Offene Antwort (offen)",
   "html": "<h2>Offene Antwort (offen) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für „Begründe“, „Beurteile“, „Erläutere“: Antworten, die sich nicht automatisch prüfen lassen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Sie schreiben ihre Antwort, lassen sich die Musterlösung zeigen und haken ab, welche Punkte ihre Antwort enthält. Danach können sie die Antwort überarbeiten oder die Selbstkontrolle abschließen.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>📝 Offene Antwort<\/b> anklicken, Musterlösung eintragen und je Zeile ein Kriterium zum Abhaken.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>muster<\/code>: Musterlösung (Formatierung erlaubt)<\/li><li><code>kriterien<\/code>: Liste zum Abhaken (kann fehlen)<\/li><li><code>zeilen<\/code>: Höhe des Textfelds, <code>min<\/code>: Mindestzahl Zeichen<\/li><\/ul><p><b>Wichtig:<\/b> Die Aufgabe gilt als gelöst, sobald die Selbstkontrolle abgeschlossen ist, egal wie viele Haken gesetzt sind. Der Text wird nicht gespeichert und nicht an die Lehrkraft übertragen.<\/p><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"offen\",\n \"frage\": \"Erkläre in zwei Sätzen, wofür sich der Aufgabentyp „Offene Antwort“ eignet und wie die Antwort kontrolliert wird.\",\n \"min\": 30,\n \"muster\": \"&lt;p&gt;Der Typ eignet sich für Aufgaben, die eine eigene Formulierung verlangen, zum Beispiel Begründungen und Beurteilungen. Die Antwort wird nicht automatisch bewertet: Die Schüler vergleichen sie mit der Musterlösung und haken Kriterien ab.&lt;/p&gt;\",\n \"kriterien\": [ \"nennt Aufgaben mit eigener Formulierung (begründen, beurteilen …)\", \"sagt, dass nicht automatisch bewertet wird\", \"nennt Musterlösung und Kriterien zum Abhaken\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "kurz": "Markieren",
   "titel": "Markieren (markieren)",
   "html": "<h2>Markieren (markieren) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für „Finde alle …“: Wortarten, Fachbegriffe, Bestandteile eines Belegs, Zeilen eines Programms.<\/p><h3>So arbeiten die Schüler<\/h3><p>Sie klicken die gesuchten Wörter oder Zeilen an, ein zweiter Klick hebt die Markierung auf. Nach „Prüfen“ bleiben richtige Stellen grün, falsche werden rot und wieder abgewählt.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🖍 Markieren<\/b> anklicken und den Text eintragen. Jede gesuchte Stelle kommt in doppelte eckige Klammern. Oben wählst du, ob Wörter oder ganze Zeilen angeklickt werden.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>text<\/code>: reiner Text, gesuchte Stellen als <code>[[so]]<\/code>, neue Zeile mit <code>\\n<\/code><\/li><li><code>\"einheit\": \"zeile\"<\/code>: ganze Zeilen anklicken (gesucht ist jede Zeile mit <code>[[<\/code>)<\/li><li><code>\"mono\": true<\/code>: Code, <code>\"anzahl\": false<\/code>: Anzahl nicht verraten, <code>h<\/code>: Hinweis<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"markieren\",\n \"frage\": \"Markiere alle Feldnamen, die es beim Typ „Markieren“ gibt.\",\n \"text\": \"Der Text der Aufgabe steht im Feld [[text]]. Mit [[einheit]] legst du fest, ob Wörter oder Zeilen angeklickt werden. Für Code gibt es [[mono]], und mit [[anzahl]] verschweigst du, wie viele Stellen gesucht sind. Das Feld karten gehört dagegen zu einem anderen Typ.\",\n \"h\": \"Gesucht sind vier Feldnamen.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "html": "<h2>Bild beschriften (beschriften) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Für Abbildungen: Bestandteile eines Belegs, Oberfläche eines Programms, Hardware, Diagramme.<\/p><h3>So arbeiten die Schüler<\/h3><p>Die Begriffe liegen in der Wortbank. Sie werden auf die nummerierten Punkte im Bild gezogen (oder: erst Begriff, dann Punkt antippen). Richtige bleiben liegen, falsche wandern zurück.<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🏷 Bild beschriften<\/b> anklicken, mit „Bild auswählen“ ein Bild hochladen (es wird verkleinert und eingebettet) und für jeden Punkt ins Bild klicken. Den Begriff trägst du in der Liste darunter ein.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>bild<\/code>: eingebettetes Bild (<code>data:image/…;base64,…<\/code>, höchstens 600 kB)<\/li><li><code>punkte<\/code>: je <code>x<\/code> und <code>y<\/code> in Prozent von links und oben, <code>t<\/code> = Begriff<\/li><li><code>extra<\/code>: weitere Begriffe als Ablenker, <code>alt<\/code>: Bildbeschreibung<\/li><\/ul><details><summary>JSON der Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"beschriften\",\n \"frage\": \"Das Bild zeigt, wie eine Beschriften-Aufgabe aufgebaut ist. Beschrifte die Teile.\",\n \"alt\": \"Schema einer Beschriften-Aufgabe: oben ein gestrichelter Kasten mit Kärtchen, darunter ein Bild mit zwei Kreisen, unten ein Knopf\",\n \"bild\": \"data:image/svg+xml;base64,…\",\n \"punkte\": [ { \"x\": 80, \"y\": 18.5, \"t\": \"Wortbank\" }, { \"x\": 33, \"y\": 18.5, \"t\": \"Begriff zum Ziehen\" }, { \"x\": 51.5, \"y\": 40, \"t\": \"Punkt im Bild\" }, { \"x\": 15.5, \"y\": 86, \"t\": \"Knopf „Prüfen“\" }\n ],\n \"extra\": [ \"Musterlösung\", \"Lücke\"\n ] }<\/pre><\/details><h3>Ausprobieren<\/h3>",

   "titel": "Blöcke bauen (bloecke)",
   "html": "<h2>Blöcke bauen (bloecke) <small>– experimentell<\/small><\/h2><p class=\"muted\">Dieser Typ ist noch im Test: Format und Bedienung können sich ändern.<\/p><p class=\"info\">Wie beim blockbasierten Programmieren: Formeln, Buchungssätze in Worten oder kurze Programme aus Bausteinen zusammensetzen.<\/p><h3>So arbeiten die Schüler<\/h3><p>Einen Block antippen setzt ihn ans Ende, ein Block im Feld verschwindet beim Antippen wieder. Durch Ziehen landet ein Block an einer bestimmten Stelle (auf den Block ziehen, vor dem er stehen soll).<\/p><h3>So erstellst du die Aufgabe<\/h3><p><b>Im Baukasten:<\/b> Tools → Übung erstellen, links unter „Experimentell (β)“ den Baustein <b>🧱 Blöcke bauen<\/b> anklicken. Je Zeile einen Block für den Vorrat eintragen (auch Ablenker), darunter die Lösung in der richtigen Reihenfolge.<\/p><p><b>Im JSON:<\/b><\/p><ul><li><code>bloecke<\/code>: Vorrat, <code>loesung<\/code>: Blöcke in der richtigen Reihenfolge (oder <code>loesungen<\/code>: mehrere Listen)<\/li><li><code>\"gleichwertig\": true<\/code>: jede rechnerisch gleichwertige Formel zählt, z. B. K · p oder p · K<\/li><li><code>start<\/code>: fester Text davor, <code>\"einmal\": true<\/code>: jeder Block nur einmal, <code>\"senkrecht\": true<\/code>: untereinander, <code>\"mono\": true<\/code>: Code<\/li><\/ul><details><summary>JSON der ersten Aufgabe unten anzeigen<\/summary><pre>{\n \"typ\": \"bloecke\",\n \"mono\": true,\n \"frage\": \"Baue den Anfang einer Blöcke-Aufgabe, so wie er im JSON steht.\",\n \"bloecke\": [ \"{\", \"}\", \"\\\"typ\\\"\", \"\\\"bloecke\\\"\", \"\\\"mc\\\"\", \":\", \",\", \"[\"\n ],\n \"loesung\": [ \"{\", \"\\\"typ\\\"\", \":\", \"\\\"bloecke\\\"\", \"}\"\n ],\n \"h\": \"Erst die geschweifte Klammer, dann Feldname, Doppelpunkt und Wert.\" }<\/pre><\/details><h3>Ausprobieren<\/h3>",
   "aufgaben": [
    {
     "typ": "bloecke",
     "mono": true,
     "frage": "Baue den Anfang einer Blöcke-Aufgabe, so wie er im JSON steht.",
