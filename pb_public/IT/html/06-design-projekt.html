<!doctype html>
<html lang="de" data-trainer="htmldesign">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design und Projekt – vibe learning</title>
<!--
  HTML-Kurs, Seite 6: gestalterische Ziele (Inhalt, Bedienbarkeit, Barrierefreiheit) und Anforderungen (Geräte), dann eine eigene Seite als Projekt.
  Durchgehendes Beispiel des Kurses: die Webseite der Rockband „Mouse Rat“ (Ausgangsstand in lib/mouserat.js).
  Aufgaben stehen unten in HTMLKURS, die Technik steckt in lib/htmlkurs.js (Aufbau dort oben beschrieben).
-->
<script src="../../katalog.js"></script>
<script src="../../nav.js"></script>
<script src="../../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="../python/lib/codemirror.css">
<script src="../python/lib/codemirror.min.js"></script>
<script src="lib/codemirror-html.js"></script>
<script src="lib/mediathek.js"></script>
<script src="lib/htmlwerk.js"></script>
<script src="lib/mouserat.js"></script>
</head>
<body>
<noscript><p>Bitte JavaScript aktivieren.</p></noscript>
<script>
const MR = window.MOUSERAT.html.replace('<p>Nächstes Konzert', '<p class="hinweis">Nächstes Konzert');
const HINWEIS = b => `
.hinweis {
  border: 2px solid #f2c94c;
  border-radius: 8px;
  background-color: #2b2e3f;
  padding: 12px;
  ${b};
}
`;
const CSS = window.MOUSERAT.css + `
p {
  line-height: 1.5;
}
`;

window.HTMLKURS = {
  id: 'htmldesign',
  titel: 'Design und Projekt',
  logo: 'Design',
  css: true, bilder: true,
  aufgaben: [
    {
      titel: 'Inhalt, der sich finden lässt', stufe: 1,
      wissen: `
<p>Eine Webseite ist für ihre <b>Besucher</b> da. Bevor du gestaltest, frag dich: Wer kommt auf die Seite, und was will die Person wissen? Bei Mouse Rat zum Beispiel: Wann ist das nächste Konzert? Wer spielt mit?</p>
<p>Das erste Ziel guter Gestaltung heißt deshalb <b>Inhaltsvermittlung</b>: Das Wichtige steht oben, und die Seite ist klar gegliedert.</p>
<ul>
  <li>genau eine {{h1}}: Sie sagt, worum es auf der Seite geht.</li>
  <li>{{h2}} für die Abschnitte, {{h3}} nur für Unterabschnitte. Keine Ebene wird übersprungen.</li>
  <li>Überschriften wählt man nach der Bedeutung. Fett gedruckter Text ist keine Überschrift.</li>
</ul>
<p>Davon profitieren alle: Wer die Seite überfliegt, findet sich zurecht. Vorleseprogramme springen von Überschrift zu Überschrift. Suchmaschinen erkennen, worum es geht.</p>`,
      auftrag: `
<p>Rivers hat an den Überschriften gedreht, „weil es so besser aussah“. Jetzt ist die Gliederung durcheinander.</p>
<p>Bringe sie in Ordnung:</p>
<ul>
  <li><b>Mouse Rat</b> ist die einzige Überschrift der ersten Ebene.</li>
  <li><b>Die Band</b>, <b>Konzerte</b> und <b>Musik</b> sind Überschriften der zweiten Ebene. Ihre {{id}} bleibt erhalten.</li>
</ul>`,
      start: MR.replace('<h1>Mouse Rat</h1>', '<h2>Mouse Rat</h2>').replace('<h2 id="band">Die Band</h2>', '<h4 id="band">Die Band</h4>')
        .replace('<h2 id="konzerte">Konzerte</h2>', '<h1 id="konzerte">Konzerte</h1>').replace('<h2 id="musik">Musik</h2>', '<p id="musik"><strong>Musik</strong></p>'),
      startCss: CSS + HINWEIS('font-weight: bold'),
      tipps: ['Ändere immer das öffnende <b>und</b> das schließende Tag.', '„Musik“ ist nur ein fetter Absatz. Daraus wird {{<h2 id="musik">Musik</h2>}}.'],
      tests: [
        {sel: 'h1', anzahl: 1, text: 'genau eine <code>h1</code>'},
        {sel: 'h1', enthaelt: 'Mouse Rat', text: '„Mouse Rat“ ist die <code>h1</code>'},
        {sel: 'h2#band', enthaelt: 'Die Band', text: '„Die Band“ ist eine <code>h2</code> mit der id <code>band</code>'},
        {sel: 'h2#konzerte', enthaelt: 'Konzerte', text: '„Konzerte“ ist eine <code>h2</code> mit der id <code>konzerte</code>'},
        {sel: 'h2#musik', enthaelt: 'Musik', text: '„Musik“ ist eine <code>h2</code> mit der id <code>musik</code>'},
        {sel: 'h3, h4, h5, h6', keine: true, text: 'keine übersprungene Ebene'}
      ]
    },
    {
      titel: 'Lesbar für alle', stufe: 2, datei: 'css',
      wissen: `
<p>Text muss man ohne Mühe lesen können, auch mit schwachen Augen, auf einem alten Bildschirm oder draußen in der Sonne. Darauf kommt es an:</p>
<table class="k-tab">
  <tr><th>Punkt</th><th>Faustregel</th></tr>
  <tr><td>Kontrast</td><td>Schrift und Hintergrund unterscheiden sich deutlich in der Helligkeit: hell auf dunkel oder dunkel auf hell.</td></tr>
  <tr><td>Schriftgröße</td><td>Fließtext mindestens {{16px}}</td></tr>
  <tr><td>Schriftart</td><td>für längere Texte eine schlichte Schrift, keine Zierschrift</td></tr>
</table>
~~~html
<p class="schlecht">Grau auf Grau liest niemand gern.</p>
<p class="gut">Dunkel auf Hell ist klar.</p>
~~~css
.schlecht { color: #999999; background-color: #bbbbbb; font-size: 11px; }
.gut { color: #222222; background-color: #f5f5f5; font-size: 16px; }
~~~
<p>Die Prüfung misst den Kontrast als Zahl. Für normalen Text verlangen die Regeln zur <b>Barrierefreiheit</b> mindestens 4,5.</p>`,
      auftrag: `
<p>Burly fand die Seite „zu normal“ und hat die Stilvorlage umgebaut. Seitdem beschweren sich die Fans: Man kann kaum etwas lesen.</p>
<p>Verbessere {{style.css}}:</p>
<ul>
  <li>Text und Überschriften heben sich deutlich vom Hintergrund ab.</li>
  <li>Die Schriftgröße der Seite beträgt mindestens {{16px}}.</li>
  <li>Die Schriftart ist wieder {{Arial, sans-serif}}.</li>
</ul>`,
      start: MR,
      startCss: `body {
  background-color: #1d1f2b;
  color: #4b4e60;
  font-family: cursive;
  font-size: 11px;
}

h1, h2 {
  color: #3a2f5c;
}

h1 {
  font-size: 48px;
  text-align: center;
}

a {
  color: #f2c94c;
}

p {
  line-height: 1.5;
}
` + HINWEIS('font-weight: bold'),
      tipps: ['Auf dem dunklen Hintergrund braucht es helle Schrift, zum Beispiel {{white}} für den Text und {{#f2c94c}} für die Überschriften.', 'Schriftgröße und Schriftart stehen in der Regel für {{body}}.'],
      tests: [
        {kontrast: 'p, li', min: 4.5, text: 'Text hebt sich deutlich vom Hintergrund ab (Kontrast mindestens 4,5)'},
        {kontrast: 'h1, h2', min: 4.5, text: 'Überschriften heben sich deutlich ab'},
        {stil: 'p, li', attribut: 'font-size', minPx: 16, text: 'Schriftgröße mindestens 16 Pixel'},
        {stil: 'body', attribut: 'font-family', wert: 'Arial, sans-serif', text: 'Schriftart <code>Arial, sans-serif</code>'}
      ]
    },
    {
      titel: 'Einfach zu bedienen', stufe: 2,
      wissen: `
<p><b>Bedienbarkeit</b> (englisch <i>Usability</i>) heißt: Besucher kommen ohne Nachdenken ans Ziel. Für Links gelten zwei Regeln.</p>
<p><b>1. Der Linktext sagt, wohin es geht.</b> Viele Menschen überfliegen eine Seite und lesen nur die Links. Vorleseprogramme können sogar alle Links als Liste vorlesen. „Hier, hier, hier“ hilft dann niemandem.</p>
<table class="k-tab">
  <tr><th>schlecht</th><th>gut</th></tr>
  <tr><td>Unsere Termine findest du {{<a …>hier</a>}}.</td><td>Sieh dir {{<a …>unsere Termine</a>}} an.</td></tr>
</table>
<p><b>2. Links sehen aus wie Links.</b> Sie haben eine andere Farbe als der übrige Text oder sind unterstrichen. Sonst findet sie niemand.</p>`,
      auftrag: `
<p>Andy hat das Menü und den Kontakt „cooler“ gemacht. Leider findet sich niemand mehr zurecht.</p>
<ul>
  <li><b>HTML:</b> Schreibe das Menü so um, dass jeder Linktext sein Ziel nennt: <b>Die Band</b>, <b>Konzerte</b>, <b>Musik</b>. Auch der Link ganz unten braucht einen sprechenden Text.</li>
  <li><b>CSS:</b> Sorge dafür, dass die Links eine andere Farbe haben als der normale Text.</li>
</ul>`,
      start: MR.replace('<p><a href="#band">Die Band</a> <a href="#konzerte">Konzerte</a> <a href="#musik">Musik</a></p>',
          '<p>Zur Band geht es <a href="#band">hier</a>. Konzerte: <a href="#konzerte">klick</a>. Für die Musik <a href="#musik">hier klicken</a>.</p>')
        .replace('<a href="mailto:band@mouserat.example">band@mouserat.example</a>', 'Schreib uns <a href="mailto:band@mouserat.example">hier</a>.'),
      startCss: CSS.replace('a {\n  color: #f2c94c;', 'a {\n  color: white;\n  text-decoration: none;') + HINWEIS('font-weight: bold'),
      tipps: ['Das Menü kann wieder ganz kurz sein: {{<a href="#band">Die Band</a>}} und so weiter.', 'Für den Kontakt passt die E-Mail-Adresse selbst als Linktext.', 'CSS: Gib {{a}} zum Beispiel die Farbe {{#f2c94c}}.'],
      tests: [
        {sel: 'a[href="#band"]', enthaelt: 'Band', text: 'Der Link zu <code>#band</code> nennt die Band'},
        {sel: 'a[href="#konzerte"]', enthaelt: 'Konzert', text: 'Der Link zu <code>#konzerte</code> nennt die Konzerte'},
        {sel: 'a[href="#musik"]', enthaelt: 'Musik', text: 'Der Link zu <code>#musik</code> nennt die Musik'},
        {test: doc => { const a = [...doc.querySelectorAll('a')]; return a.length >= 4 && a.every(x => x.textContent.trim().length >= 4 && !/\bhier\b|klick|^link$/i.test(x.textContent.trim())); }, text: 'kein Link heißt mehr „hier“ oder „klick“'},
        {stil: 'a', attribut: 'color', ungleich: 'white', text: 'Links haben eine andere Farbe als der Text'},
        {kontrast: 'a', min: 4.5, text: 'Links sind gut lesbar (Kontrast)'}
      ]
    },
    {
      titel: 'Barrierefrei', stufe: 2,
      wissen: `
<p><b>Barrierefreiheit</b> bedeutet: Alle Menschen können die Seite nutzen, auch wer blind ist, schlecht sieht oder keine Maus bedienen kann. In Deutschland sind viele Anbieter dazu gesetzlich verpflichtet.</p>
<p>Blinde Menschen lassen sich Seiten von einem <b>Vorleseprogramm</b> (Screenreader) vorlesen. Es liest den HTML-Text, nicht das Aussehen. Sauberes HTML ist deshalb schon die halbe Arbeit:</p>
<table class="k-tab">
  <tr><th>Im HTML</th><th>Nutzen</th></tr>
  <tr><td>{{lang="de"}} bei {{html}}</td><td>richtige Aussprache</td></tr>
  <tr><td>Überschriften in der richtigen Ebene</td><td>von Abschnitt zu Abschnitt springen</td></tr>
  <tr><td>sprechende Linktexte</td><td>Links ergeben auch einzeln Sinn</td></tr>
  <tr><td>{{alt}} bei jedem Bild</td><td>Bildinhalt wird vorgelesen</td></tr>
</table>
<p>Ein guter Alternativtext beschreibt, <b>was zu sehen ist</b>. „Bild“ oder der Dateiname sagen nichts.</p>`,
      auftrag: `
<p>Die Stadt Pawnee will auf die Seite der Band verlinken, aber nur, wenn sie barrierefrei ist. Die Prüferin hat zwei Mängel gefunden:</p>
<ul>
  <li>Die Sprache der Seite ist nicht angegeben.</li>
  <li>Die Alternativtexte der drei Bilder sind unbrauchbar.</li>
</ul>
<p>Behebe beide Mängel. Jeder Alternativtext soll aus mindestens drei Wörtern bestehen.</p>`,
      start: MR.replace('<html lang="de">', '<html>').replace('alt="Logo von Mouse Rat"', 'alt="Bild"')
        .replace('alt="Die vier Musiker von Mouse Rat auf der Bühne"', 'alt="band.svg"').replace('alt="Cover von „Das Hammer-Album“"', 'alt="Bild 3"'),
      startCss: CSS + HINWEIS('font-weight: bold'),
      tipps: ['Die Sprache steht als Attribut im Tag {{<html>}}.', 'Sieh dir jedes Bild in der Vorschau an und beschreibe es, zum Beispiel: {{alt="Vier Musiker auf einer Bühne"}}'],
      tests: [
        {sel: 'html[lang="de"]', text: 'Sprache der Seite: <code>lang="de"</code>'},
        {sel: 'img', anzahl: 3, text: 'drei Bilder'},
        {test: doc => { const b = [...doc.querySelectorAll('img')]; return b.length > 0 && b.every(i => { const a = (i.getAttribute('alt') || '').trim(); return a.split(/\s+/).length >= 3 && !/^(bild|foto|grafik)\b/i.test(a) && !/\.svg/i.test(a); }); }, text: 'Jeder Alternativtext beschreibt das Bild mit mindestens drei Wörtern'}
      ]
    },
    {
      titel: 'Für jedes Gerät', stufe: 2, datei: 'css',
      wissen: `
<p>Deine Besucher nutzen ganz verschiedene Geräte: Handy, Tablet, Laptop, großer Bildschirm. Dazu kommen verschiedene Browser und Auflösungen. Eine gute Seite funktioniert <b>überall</b>. Die meisten Menschen surfen heute mit dem Handy.</p>
<p>Über der Vorschau kannst du zwischen <b>Computer</b> und <b>Handy</b> umschalten. Muss man auf dem Handy seitwärts schieben, ist etwas zu breit.</p>
<p>Der häufigste Grund sind <b>feste Breiten</b> in Pixeln. Besser ist eine <b>Obergrenze</b>:</p>
<table class="k-tab">
  <tr><th>Angabe</th><th>Bedeutung</th></tr>
  <tr><td>{{width: 600px;}}</td><td>immer 600 Pixel breit, auch wenn der Bildschirm schmaler ist</td></tr>
  <tr><td>{{max-width: 600px;}}</td><td>höchstens 600 Pixel, auf schmalen Bildschirmen weniger</td></tr>
  <tr><td>{{max-width: 100%;}}</td><td>nie breiter als der Platz, der da ist</td></tr>
</table>`,
      auftrag: `
<p>Schalte die Vorschau auf <b>Handy</b>. Zwei Dinge ragen über den Rand hinaus.</p>
<ul>
  <li>Schreibe eine neue Regel für alle Bilder ({{img}}): Sie sind nie breiter als der vorhandene Platz.</li>
  <li>Der Hinweis auf das nächste Konzert hat eine feste Breite. Mache daraus eine Obergrenze.</li>
</ul>`,
      start: MR, startCss: CSS + HINWEIS('width: 600px'),
      tipps: ['{{img { max-width: 100%; }}}', 'In der Regel {{.hinweis}} wird aus {{width}} das Attribut {{max-width}}.'],
      tests: [
        {stil: 'img', attribut: 'max-width', wert: '100%', text: 'Bilder sind nie breiter als der Platz (<code>max-width: 100%</code>)'},
        {regel: '.hinweis', attribut: 'max-width', text: 'Der Hinweis hat eine Obergrenze statt einer festen Breite'},
        {passt: 375, text: 'Auf dem Handy ragt nichts über den Rand'}
      ]
    },
    {
      titel: 'Projekt: deine eigene Seite', stufe: 3, projekt: true,
      wissen: `
<p>Jetzt entwirfst du selbst. Profis fangen dabei nie mit dem Code an, sondern mit einem <b>Entwurf</b>.</p>
<table class="k-tab">
  <tr><th>Ziel</th><th>Frage an deinen Entwurf</th></tr>
  <tr><td>Inhaltsvermittlung</td><td>Für wen ist die Seite? Was will diese Person zuerst wissen?</td></tr>
  <tr><td>Wiedererkennung (Corporate Identity)</td><td>Welche zwei bis drei Farben, welche Schrift und welches Logo ziehen sich durch die ganze Seite?</td></tr>
  <tr><td>Bedienbarkeit (Usability)</td><td>Findet man jeden Abschnitt mit einem Klick? Sagen die Links, wohin sie führen?</td></tr>
  <tr><td>Barrierefreiheit</td><td>Ist alles gut lesbar? Hat jedes Bild einen Alternativtext?</td></tr>
  <tr><td>Verschiedene Geräte</td><td>Passt die Seite auch auf ein Handy?</td></tr>
</table>
<p><b>Wichtig:</b> Eine Webseite kann jeder lesen. Schreibe keine echten Adressen, Telefonnummern oder vollen Namen von dir oder anderen hinein.</p>`,
      auftrag: `
<ol>
  <li><b>Thema wählen:</b> ein Verein, ein Hobby, eine erfundene Band, eine Schülerfirma, dein Lieblingsessen …</li>
  <li><b>Skizze auf Papier:</b> Zeichne die Seite als Kästchen: Was steht oben, welche Abschnitte gibt es, wo sind Bilder? Notiere Farben und Schrift.</li>
  <li><b>Umsetzen:</b> Schreibe HTML und CSS. Die Bilder aus „Bilder“ darfst du verwenden.</li>
  <li><b>Prüfen:</b> Der Knopf „Prüfen“ zeigt, was noch fehlt. Sieh dir die Seite auch in der Handy-Ansicht an.</li>
  <li><b>Herunterladen:</b> Mit „Herunterladen“ speicherst du deine Seite als eine Datei. Sie öffnet sich per Doppelklick im Browser.</li>
</ol>`,
      start: `<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title></title>
    %CSS%
  </head>
  <body>

  </body>
</html>
`,
      startCss: 'body {\n  font-family: Arial, sans-serif;\n}\n',
      tipps: ['Fang mit dem HTML an: erst alle Überschriften, dann die Texte. Das Aussehen kommt zum Schluss.', 'Als Vorlage kannst du dir die Seite von Mouse Rat in den Aufgaben davor ansehen.'],
      tests: [
        {test: doc => doc.title.trim().length >= 3, text: 'Titel der Seite im <code>head</code>'},
        {sel: 'h1', anzahl: 1, text: 'genau eine <code>h1</code>'},
        {sel: 'h2', min: 2, text: 'mindestens zwei Abschnitte mit <code>h2</code>'},
        {test: doc => [...doc.querySelectorAll('p')].filter(p => p.textContent.trim().length >= 20).length >= 2, text: 'mindestens zwei Absätze mit Text'},
        {sel: 'ul > li, ol > li', min: 3, text: 'eine Liste mit mindestens drei Einträgen'},
        {sel: 'a[href]', min: 1, text: 'mindestens ein Link'},
        {test: doc => { const b = [...doc.querySelectorAll('img')]; return b.length > 0 && b.every(i => (i.getAttribute('alt') || '').trim().split(/\s+/).length >= 2); }, text: 'mindestens ein Bild, jedes mit beschreibendem Alternativtext'},
        {css: /(\{[^}]*\}[^{}]*){4}/, text: 'mindestens vier CSS-Regeln'},
        {test: doc => [...doc.querySelectorAll('[class]')].some(e => [...e.classList].some(k => [...doc.styleSheets].some(s => [...s.cssRules].some(r => r.selectorText && r.selectorText.includes('.' + k))))), text: 'mindestens eine Klasse, im HTML vergeben und im CSS gestaltet'},
        {stil: 'body', attribut: 'background-color', ungleich: ['transparent', 'white'], text: 'eigene Hintergrundfarbe für die Seite'},
        {kontrast: 'h1, h2, p, li, a', min: 4.5, text: 'Alle Texte sind gut lesbar (Kontrast mindestens 4,5)'},
        {passt: 375, text: 'Die Seite passt auf ein Handy'}
      ]
    }
  ]
};
</script>
<script src="lib/htmlkurs.js"></script>
</body>
</html>
