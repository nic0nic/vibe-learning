<!doctype html>
<html lang="de" data-trainer="htmllinks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links und Bilder – vibe learning</title>
<!--
  HTML-Kurs, Seite 3: Hyperlinks (extern, E-Mail, Sprungmarken) und Bilder mit Alternativtext.
  Durchgehendes Beispiel des Kurses: die Webseite der Rockband „Mouse Rat“.
  Aufgaben stehen unten in HTMLKURS, die Technik steckt in lib/htmlkurs.js (Aufbau dort oben beschrieben).
-->
<script src="../../katalog.js"></script>
<script src="../../nav.js"></script>
<script src="../../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="../python/lib/codemirror.css">
<script src="../python/lib/codemirror.min.js"></script>
<script src="lib/codemirror-html.js"></script>
<script src="lib/mediathek.js"></script>
<script src="lib/htmlwerk.js"></script>
</head>
<body>
<noscript><p>Bitte JavaScript aktivieren.</p></noscript>
<script>
// Grundgerüst mit beliebigem Inhalt im body
const SEITE = body => `<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Mouse Rat</title>
  </head>
  <body>
${body}
  </body>
</html>
`;
const BAND = `    <ul>
      <li>Andy: Gesang und Gitarre</li>
      <li>Burly: Gitarre</li>
      <li>Chang: Bass</li>
      <li>Rivers: Schlagzeug</li>
    </ul>
`;
const KONZERTE = (id) => `
    <h2${id ? ' id="konzerte"' : ''}>Konzerte</h2>
    <p>Nächstes Konzert: Samstag, 20 Uhr, Schlangenloch-Lounge</p>
`;
const MUSIK = (id) => `
    <h2${id ? ' id="musik"' : ''}>Musik</h2>
    <ol>
      <li>5000 Kerzen im Wind</li>
      <li>Die Grube</li>
      <li>Fang deinen Traum</li>
    </ol>
`;
const NAV = `    <p><a href="#band">Die Band</a> <a href="#konzerte">Konzerte</a> <a href="#musik">Musik</a></p>
`;
const KONTAKT = `    <p>Booking: <a href="mailto:band@mouserat.example">band@mouserat.example</a></p>`;
const ROCK = '<a href="https://de.wikipedia.org/wiki/Rockmusik">Rock</a>';

window.HTMLKURS = {
  id: 'htmllinks',
  titel: 'Links und Bilder',
  logo: 'Links und Bilder',
  bilder: true,
  aufgaben: [
    {
      titel: 'Ein Link', stufe: 1,
      wissen: `
<p>Links (Hyperlinks) verknüpfen Seiten miteinander. Erst sie machen aus einzelnen Seiten ein Netz. Ein Link ist das Element {{a}} (englisch <i>anchor</i>, Anker).</p>
~~~html
<p>Mehr dazu bei <a href="https://de.wikipedia.org">Wikipedia</a>.</p>
~~~
<table class="k-tab">
  <tr><th>Teil</th><th>Bedeutung</th></tr>
  <tr><td>Attribut {{href}}</td><td>das Ziel: die Adresse der Seite, mit {{https://}} am Anfang</td></tr>
  <tr><td>Inhalt von {{a}}</td><td>der Text, den man anklickt</td></tr>
</table>
<p>In der Vorschau öffnen sich Links nicht. Über der Vorschau steht stattdessen, wohin der Link führt.</p>`,
      auftrag: `
<p>Nicht jeder weiß, was Rock ist. Mache im Abschnitt „Die Band“ das Wort <b>Rock</b> zu einem Link auf diese Adresse:</p>
<p>{{https://de.wikipedia.org/wiki/Rockmusik}}</p>`,
      start: SEITE(`    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>

    <h2>Die Band</h2>
    <p>Wir spielen Rock, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE() + MUSIK()),
      tipps: ['Das öffnende Tag steht vor dem Wort, das schließende dahinter: {{<a href="…">Rock</a>}}', 'Die Adresse steht in Anführungszeichen. Kopiere sie am besten aus der Aufgabe.'],
      tests: [
        {sel: 'a[href="https://de.wikipedia.org/wiki/Rockmusik"]', text: 'Link mit der richtigen Adresse in <code>href</code>'},
        {test: doc => [...doc.querySelectorAll('h2 ~ p a[href^="https://de.wikipedia.org"]')].some(a => a.textContent.trim() === 'Rock'), text: 'Angeklickt wird genau das Wort „Rock“'}
      ]
    },
    {
      titel: 'Link zum Schreiben einer E-Mail', stufe: 1,
      wissen: `
<p>Ein Link kann auch das E-Mail-Programm öffnen. Dann beginnt das Ziel mit {{mailto:}}, direkt gefolgt von der Adresse.</p>
~~~html
<p>Fragen? Schreib an <a href="mailto:info@pawnee.example">info@pawnee.example</a>.</p>
~~~
<p>Der Linktext sollte verraten, was beim Klick passiert. Hier ist das die Adresse selbst.</p>`,
      auftrag: `
<p>Veranstalter sollen die Band buchen können. Ergänze ganz unten einen Absatz:</p>
<p>Booking: band@mouserat.example</p>
<p>Die Adresse ist ein Link, der eine E-Mail an {{band@mouserat.example}} beginnt.</p>`,
      start: SEITE(`    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>

    <h2>Die Band</h2>
    <p>Wir spielen ${ROCK}, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE() + MUSIK()),
      tipps: ['Das Ziel lautet {{mailto:band@mouserat.example}}, ohne Leerzeichen.', 'Ganzer Absatz: {{<p>Booking: <a href="mailto:band@mouserat.example">band@mouserat.example</a></p>}}'],
      tests: [
        {sel: 'p a[href="mailto:band@mouserat.example"]', text: 'Link mit dem Ziel <code>mailto:band@mouserat.example</code> in einem Absatz'},
        {sel: 'p', enthaelt: 'Booking', text: 'Der Absatz beginnt mit „Booking:“'},
        {sel: 'a[href^="mailto:"]', enthaelt: 'band@mouserat.example', text: 'Der Linktext ist die E-Mail-Adresse'}
      ]
    },
    {
      titel: 'Sprungmarken', stufe: 2,
      wissen: `
<p>Auf langen Seiten hilft ein kleines <b>Menü</b>, das zu den Abschnitten springt. Dazu braucht es zwei Dinge:</p>
<ol>
  <li>Das Ziel bekommt mit dem Attribut {{id}} einen Namen. Jede {{id}} gibt es auf einer Seite nur einmal.</li>
  <li>Der Link nennt als Ziel ein {{#}} und diesen Namen.</li>
</ol>
~~~html nur
<p><a href="#kontakt">Zum Kontakt</a></p>

<h2 id="kontakt">Kontakt</h2>
~~~
<p>Namen für {{id}} schreibst du klein, ohne Leerzeichen und ohne Umlaute.</p>`,
      auftrag: `
<p>Baue ein Menü für die Seite:</p>
<ul>
  <li>Gib den drei Überschriften {{h2}} die Namen {{band}}, {{konzerte}} und {{musik}}.</li>
  <li>Schreibe direkt unter den ersten Absatz einen neuen Absatz mit drei Links: <b>Die Band</b>, <b>Konzerte</b>, <b>Musik</b>. Jeder springt zu seinem Abschnitt.</li>
</ul>
<p>Probiere die Links in der Vorschau aus.</p>`,
      start: SEITE(`    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>

    <h2>Die Band</h2>
    <p>Wir spielen ${ROCK}, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE() + MUSIK() + KONTAKT),
      tipps: ['Die Überschrift: {{<h2 id="band">Die Band</h2>}}', 'Ein Link im Menü: {{<a href="#band">Die Band</a>}}. Zwischen die Links kommt ein Leerzeichen.'],
      tests: [
        {sel: 'h2#band', enthaelt: 'Die Band', text: 'Überschrift „Die Band“ heißt <code>band</code>'},
        {sel: 'h2#konzerte', enthaelt: 'Konzerte', text: 'Überschrift „Konzerte“ heißt <code>konzerte</code>'},
        {sel: 'h2#musik', enthaelt: 'Musik', text: 'Überschrift „Musik“ heißt <code>musik</code>'},
        {sel: 'p a[href="#band"]', text: 'Link zu <code>#band</code>'},
        {sel: 'p a[href="#konzerte"]', text: 'Link zu <code>#konzerte</code>'},
        {sel: 'p a[href="#musik"]', text: 'Link zu <code>#musik</code>'}
      ]
    },
    {
      titel: 'Ein Bild einbinden', stufe: 1,
      wissen: `
<p>Ein Bild steht nicht im HTML-Text. Es ist eine eigene Datei, und das Element {{img}} (englisch <i>image</i>) sagt dem Browser, wo sie liegt.</p>
~~~html
<img src="bilder/album.svg" alt="Albumcover mit einer schwarzen Schallplatte">
~~~
<table class="k-tab">
  <tr><th>Attribut</th><th>Bedeutung</th></tr>
  <tr><td>{{src}}</td><td>Quelle (englisch <i>source</i>): Ordner und Name der Bilddatei</td></tr>
  <tr><td>{{alt}}</td><td>Alternativtext: beschreibt, was auf dem Bild zu sehen ist</td></tr>
</table>
<p>Der Alternativtext ist <b>Pflicht</b>. Vorleseprogramme lesen ihn blinden Menschen vor, und er erscheint, wenn das Bild nicht lädt. Das gehört zur <b>Barrierefreiheit</b>: Alle sollen die Seite nutzen können.</p>
<p>{{img}} hat keinen Inhalt und kein schließendes Tag. Die Bilder für diesen Kurs findest du über den Knopf <b>Bilder</b>.</p>`,
      auftrag: `
<p>Setze das Logo der Band ganz oben auf die Seite, noch vor die Überschrift {{h1}}.</p>
<ul>
  <li>Datei: {{bilder/logo.svg}}</li>
  <li>Alternativtext: <b>Logo von Mouse Rat</b></li>
</ul>`,
      start: SEITE(`    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>
` + NAV + `
    <h2 id="band">Die Band</h2>
    <p>Wir spielen ${ROCK}, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE(1) + MUSIK(1) + KONTAKT),
      tipps: ['Setze die Schreibmarke vor {{<h1>}} und klicke oben auf „Bilder“. Dann fehlt nur noch der Alternativtext.', '{{<img src="bilder/logo.svg" alt="Logo von Mouse Rat">}}'],
      tests: [
        {quelle: /<img\b[^>]*\bsrc\s*=\s*["']bilder\/logo\.svg["']/i, text: 'Bild mit der Quelle <code>bilder/logo.svg</code>'},
        {sel: 'img[alt="Logo von Mouse Rat" i]', text: 'Alternativtext „Logo von Mouse Rat“'},
        {test: doc => { const i = doc.querySelector('img'), h = doc.querySelector('h1'); return !!i && !!h && !!(i.compareDocumentPosition(h) & 4); }, text: 'Das Logo steht vor der Überschrift'}
      ]
    },
    {
      titel: 'Größe und guter Alternativtext', stufe: 2,
      wissen: `
<p>Mit dem Attribut {{width}} legst du die Breite eines Bildes in Pixeln fest. Die Höhe passt der Browser selbst an, das Bild wird nicht verzerrt.</p>
~~~html
<img src="bilder/logo.svg" alt="Logo von Mouse Rat" width="80">
~~~
<p>Ein <b>guter Alternativtext</b> beschreibt kurz, was man sieht, so wie du es jemandem am Telefon sagen würdest.</p>
<table class="k-tab">
  <tr><th>schlecht</th><th>gut</th></tr>
  <tr><td>{{alt="Bild"}}</td><td>{{alt="Vier Musiker auf einer Bühne"}}</td></tr>
  <tr><td>{{alt="band.svg"}}</td><td>{{alt="Publikum mit erhobenen Armen"}}</td></tr>
</table>`,
      auftrag: `
<p>Zwei Dinge:</p>
<ul>
  <li>Das Logo ist zu groß. Stelle seine Breite auf {{120}} ein.</li>
  <li>Füge direkt unter der Überschrift „Die Band“ das Bild {{bilder/band.svg}} ein: Breite {{400}}, mit einem Alternativtext aus mindestens drei Wörtern, der das Bild beschreibt.</li>
</ul>`,
      start: SEITE(`    <img src="bilder/logo.svg" alt="Logo von Mouse Rat">
    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>
` + NAV + `
    <h2 id="band">Die Band</h2>
    <p>Wir spielen ${ROCK}, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE(1) + MUSIK(1) + KONTAKT),
      tipps: ['Die Breite ist ein weiteres Attribut im selben Tag: {{width="120"}}', 'Schau dir das Bild an: Wer ist zu sehen, und wo?'],
      tests: [
        {sel: 'img[alt="Logo von Mouse Rat" i][width="120"]', text: 'Logo mit der Breite 120'},
        {quelle: /<img\b[^>]*\bsrc\s*=\s*["']bilder\/band\.svg["']/i, text: 'Bild mit der Quelle <code>bilder/band.svg</code>'},
        {sel: 'h2#band + img[width="400"], h2#band + p > img[width="400"]:first-child', text: 'Bandfoto direkt unter „Die Band“, Breite 400'},
        {test: doc => { const i = doc.querySelector('img[width="400"]'), a = i ? (i.getAttribute('alt') || '').trim() : ''; return a.split(/\s+/).length >= 3 && !/^(bild|foto|band\.svg)/i.test(a); }, text: 'Alternativtext beschreibt das Bandfoto mit mindestens drei Wörtern'}
      ]
    },
    {
      titel: 'Ein Bild als Link', stufe: 3,
      wissen: `
<p>Auch ein Bild kann ein Link sein. Dann steht das {{img}} dort, wo sonst der Linktext steht: <b>im</b> Element {{a}}.</p>
~~~html
<a href="#oben"><img src="bilder/logo.svg" alt="Zum Seitenanfang" width="60"></a>
~~~
<p>Bei einem Bild als Link beschreibt der Alternativtext am besten das <b>Ziel</b>. Er ist dann der Linktext für alle, die das Bild nicht sehen.</p>`,
      auftrag: `
<p>Mouse Rat hat ein Album aufgenommen. Zeige es auf der Seite:</p>
<ul>
  <li>Füge direkt unter der Überschrift „Musik“ das Bild {{bilder/album.svg}} ein, Breite {{200}}, mit passendem Alternativtext.</li>
  <li>Das Logo ganz oben soll ein Link sein, der zum Abschnitt „Konzerte“ springt.</li>
</ul>`,
      start: SEITE(`    <img src="bilder/logo.svg" alt="Logo von Mouse Rat" width="120">
    <h1>Mouse Rat</h1>
    <p>Die beste Rockband aus Pawnee.</p>
` + NAV + `
    <h2 id="band">Die Band</h2>
    <img src="bilder/band.svg" alt="Die vier Musiker von Mouse Rat auf der Bühne" width="400">
    <p>Wir spielen ${ROCK}, wie er sein muss: <strong>laut und mit Gefühl</strong>.</p>
` + BAND + KONZERTE(1) + MUSIK(1) + KONTAKT),
      tipps: ['Schreibe {{<a href="#konzerte">}} vor das Logo und {{</a>}} dahinter.', 'Das Albumcover: {{<img src="bilder/album.svg" alt="…" width="200">}} nach {{<h2 id="musik">Musik</h2>}}'],
      tests: [
        {sel: 'a[href="#konzerte"] > img[width="120"]', text: 'Das Logo steht in einem Link zu <code>#konzerte</code>'},
        {quelle: /<img\b[^>]*\bsrc\s*=\s*["']bilder\/album\.svg["']/i, text: 'Bild mit der Quelle <code>bilder/album.svg</code>'},
        {sel: 'h2#musik + img[width="200"], h2#musik + p > img[width="200"]:first-child', text: 'Albumcover direkt unter „Musik“, Breite 200'},
        {test: doc => { const i = doc.querySelector('img[width="200"]'); return !!i && (i.getAttribute('alt') || '').trim().length >= 5; }, text: 'Das Albumcover hat einen Alternativtext'},
        {sel: 'img', anzahl: 3, text: 'drei Bilder auf der Seite'}
      ]
    }
  ]
};
</script>
<script src="lib/htmlkurs.js"></script>
</body>
</html>
