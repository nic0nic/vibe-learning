<!doctype html>
<html lang="de" data-trainer="pyif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedingte Anweisung – vibe learning</title>
<!--
  Geführte Übung zu if / elif / else mit automatischer Prüfung.
  Aufgaben stehen unten in PYKURS, die Technik steckt in lib/pykurs.js (Aufbau dort oben beschrieben).
-->
<script src="../../katalog.js"></script>
<script src="../../nav.js"></script>
<script src="../../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="lib/codemirror.css">
<script src="lib/codemirror.min.js"></script>
<script src="lib/skulpt.min.js"></script>
<script src="lib/skulpt-stdlib.js"></script>
</head>
<body>
<noscript><p>Bitte JavaScript aktivieren.</p></noscript>
<script>
const VERGLEICHE = `<table class="k-tab">
  <tr><th>Zeichen</th><th>Bedeutung</th><th>Beispiel</th></tr>
  <tr><td><code>==</code></td><td>gleich</td><td><code>zahl == 0</code></td></tr>
  <tr><td><code>!=</code></td><td>ungleich</td><td><code>zahl != 0</code></td></tr>
  <tr><td><code>&gt;</code> / <code>&lt;</code></td><td>größer / kleiner</td><td><code>zahl &gt; 0</code></td></tr>
  <tr><td><code>&gt;=</code> / <code>&lt;=</code></td><td>größer gleich / kleiner gleich</td><td><code>alter &gt;= 18</code></td></tr>
</table>`;
const NESTED_IF = {re: /^[ \t]+if\b/m, text: 'Verwende verschachtelte if-Anweisungen (ein if innerhalb eines if- oder else-Blocks).'};

window.PYKURS = {
  id: 'pyif',
  titel: 'Bedingte Anweisung',
  logo: 'if',
  aufgaben: [
    {
      titel: 'Positiv oder nicht?', stufe: 1,
      wissen: `
<p>Mit <code>if</code> führt Python Code nur aus, wenn eine <b>Bedingung</b> wahr ist. Mit <code>else</code> legst du fest, was sonst passiert.</p>
<pre class="py">
temperatur = int(input("Temperatur: "))
if temperatur < 0:
    print("Es friert.")
else:
    print("Es friert nicht.")
</pre>
<ul>
  <li>Nach der Bedingung und nach <code>else</code> steht ein <b>Doppelpunkt</b>.</li>
  <li>Alles, was dazugehört, wird <b>eingerückt</b> (4 Leerzeichen bzw. Tab-Taste).</li>
  <li><code>input()</code> liefert immer Text. <code>int(input("…"))</code> wandelt die Eingabe in eine ganze Zahl um.</li>
</ul>
${VERGLEICHE}`,
      auftrag: `
<p>Schreibe ein Programm, das nach einer Zahl fragt und ausgibt, ob die Zahl positiv ist.</p>
<ul>
  <li>Zahl größer als 0 → Ausgabe <code>positiv</code></li>
  <li>sonst (also auch bei 0) → Ausgabe <code>nicht positiv</code></li>
</ul>`,
      start: `zahl = int(input("Gib eine Zahl ein: "))\n\n# Schreibe hier deine if-Anweisung\n`,
      tipps: ['Die Bedingung lautet <code>zahl &gt; 0</code>.', 'Aufbau: <code>if zahl &gt; 0:</code>, darunter eingerückt <code>print("positiv")</code>, dann <code>else:</code> mit eingerücktem <code>print(...)</code>.'],
      tests: [{ein: ['5'], aus: ['positiv']}, {ein: ['-3'], aus: ['nicht positiv']}, {ein: ['0'], aus: ['nicht positiv']}, {ein: ['1'], aus: ['positiv']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Volljährig?', stufe: 1,
      wissen: `
<p>Achte bei Bedingungen auf den <b>Grenzwert</b>: Gehört er dazu oder nicht?</p>
<pre class="py">
punkte = int(input("Punkte: "))
if punkte >= 50:
    print("Ziel erreicht")
else:
    print("Ziel nicht erreicht")
</pre>
<p>Bei <code>&gt;= 50</code> zählt 50 schon dazu, bei <code>&gt; 50</code> nicht.</p>`,
      auftrag: `
<p>Schreibe ein Programm, das nach dem Alter fragt und ausgibt, ob die Person volljährig ist (ab 18 Jahren).</p>
<ul>
  <li>18 oder älter → <code>volljährig</code></li>
  <li>jünger → <code>minderjährig</code></li>
</ul>`,
      start: `alter = int(input("Wie alt bist du? "))\n\n`,
      tipps: ['Ist man mit genau 18 volljährig? Dann brauchst du <code>&gt;=</code>.'],
      tests: [{ein: ['17'], aus: ['minderjährig']}, {ein: ['18'], aus: ['volljährig']}, {ein: ['30'], aus: ['volljährig']}, {ein: ['5'], aus: ['minderjährig']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Welche Zahl ist größer?', stufe: 1,
      wissen: `
<p>Gibt es mehr als zwei Fälle, hilft <code>elif</code> (kurz für „else if“). Python prüft die Bedingungen von oben nach unten und führt nur den <b>ersten</b> passenden Block aus.</p>
<pre class="py">
a = int(input("Tore Heim: "))
b = int(input("Tore Gast: "))
if a > b:
    print("Heimsieg")
elif a < b:
    print("Auswärtssieg")
else:
    print("Unentschieden")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das zwei Zahlen einliest und ausgibt, welche größer ist:</p>
<ul>
  <li><code>Die erste Zahl ist größer.</code></li>
  <li><code>Die zweite Zahl ist größer.</code></li>
  <li><code>Beide Zahlen sind gleich.</code></li>
</ul>`,
      start: `zahl1 = int(input("Erste Zahl: "))\nzahl2 = int(input("Zweite Zahl: "))\n\n`,
      tipps: ['Du brauchst <code>if</code>, <code>elif</code> und <code>else</code>.'],
      tests: [{ein: ['5', '3'], aus: ['Die erste Zahl ist größer.']}, {ein: ['2', '9'], aus: ['Die zweite Zahl ist größer.']}, {ein: ['4', '4'], aus: ['Beide Zahlen sind gleich.']}, {ein: ['-1', '-7'], aus: ['Die erste Zahl ist größer.']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Gerade oder ungerade?', stufe: 2,
      wissen: `
<p>Der Operator <code>%</code> (Modulo) liefert den <b>Rest</b> einer ganzzahligen Division.</p>
<pre class="py">
print(17 % 5)   # 17 : 5 = 3 Rest 2
print(12 % 4)   # 12 : 4 = 3 Rest 0
print(9 % 2)    # 9 : 2 = 4 Rest 1
</pre>
<p>Ist der Rest 0, ist die Zahl durch die andere <b>teilbar</b>: <code>zahl % 3 == 0</code> heißt „zahl ist durch 3 teilbar“.</p>`,
      auftrag: `
<p>Schreibe ein Programm, das eine Zahl einliest und <code>gerade</code> oder <code>ungerade</code> ausgibt.</p>`,
      start: `zahl = int(input("Gib eine Zahl ein: "))\n\n`,
      tipps: ['Eine gerade Zahl ist durch 2 teilbar.', 'Bedingung: <code>zahl % 2 == 0</code>'],
      tests: [{ein: ['4'], aus: ['gerade']}, {ein: ['7'], aus: ['ungerade']}, {ein: ['0'], aus: ['gerade']}, {ein: ['-3'], aus: ['ungerade']}, {ein: ['100'], aus: ['gerade']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Bestanden?', stufe: 2,
      wissen: `
<p>Bevor du programmierst: Überlege genau, welche Werte zu welchem Fall gehören. Bei Schulnoten ist eine <b>kleinere</b> Zahl besser.</p>
<pre class="py">
platz = int(input("Platzierung: "))
if platz <= 3:
    print("Medaille")
else:
    print("keine Medaille")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das nach einer Note (1–6) fragt und ausgibt:</p>
<ul>
  <li>Note 1 bis 4 → <code>bestanden</code></li>
  <li>Note 5 oder 6 → <code>nicht bestanden</code></li>
</ul>`,
      start: `note = int(input("Deine Note (1-6): "))\n\n`,
      tipps: ['Bestanden ist man mit einer Note <b>kleiner oder gleich</b> 4.'],
      tests: [{ein: ['1'], aus: ['bestanden']}, {ein: ['4'], aus: ['bestanden']}, {ein: ['5'], aus: ['nicht bestanden']}, {ein: ['6'], aus: ['nicht bestanden']}, {ein: ['3'], aus: ['bestanden']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Wie warm ist es?', stufe: 2,
      wissen: `
<p>Bei einer <code>if</code>-<code>elif</code>-Kette kommt es auf die <b>Reihenfolge</b> an. Wurde ein Fall schon erkannt, werden die übrigen nicht mehr geprüft. Darum muss man unten nicht noch einmal alles abfragen:</p>
<pre class="py">
kmh = int(input("Geschwindigkeit in km/h: "))
if kmh <= 50:
    print("in Ordnung")
elif kmh <= 70:
    print("etwas zu schnell")   # hier ist kmh sicher schon über 50
else:
    print("viel zu schnell")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das eine Temperatur (ganze Zahl) einliest und ausgibt:</p>
<ul>
  <li>bis einschließlich 10 °C → <code>Es ist kalt</code></li>
  <li>über 10 bis einschließlich 25 °C → <code>Es ist angenehm</code></li>
  <li>über 25 °C → <code>Es ist heiß</code></li>
</ul>`,
      start: `temperatur = int(input("Temperatur in °C: "))\n\n`,
      tipps: ['Beginne mit dem kältesten Fall: <code>if temperatur &lt;= 10:</code>', 'Für den zweiten Fall reicht <code>elif temperatur &lt;= 25:</code>.'],
      tests: [{ein: ['5'], aus: ['Es ist kalt']}, {ein: ['10'], aus: ['Es ist kalt']}, {ein: ['11'], aus: ['Es ist angenehm']}, {ein: ['25'], aus: ['Es ist angenehm']}, {ein: ['26'], aus: ['Es ist heiß']}, {ein: ['-4'], aus: ['Es ist kalt']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Schaltjahr', stufe: 3,
      wissen: `
<p>Mehrere Bedingungen kannst du verknüpfen:</p>
<table class="k-tab">
  <tr><th>Operator</th><th>wahr, wenn …</th></tr>
  <tr><td><code>and</code></td><td>beide Bedingungen wahr sind</td></tr>
  <tr><td><code>or</code></td><td>mindestens eine Bedingung wahr ist</td></tr>
  <tr><td><code>not</code></td><td>die Bedingung falsch ist</td></tr>
</table>
<pre class="py">
alter = int(input("Alter: "))
if alter >= 6 and alter <= 14:
    print("Kinderticket")
else:
    print("kein Kinderticket")
</pre>
<p>Mit Klammern legst du fest, was zuerst ausgewertet wird, wie in Mathe.</p>`,
      auftrag: `
<p>Schreibe ein Programm, das nach einer Jahreszahl fragt und <code>Schaltjahr</code> oder <code>kein Schaltjahr</code> ausgibt.</p>
<p><i>Regel: Ein Jahr ist ein Schaltjahr, wenn es durch 4 teilbar ist, aber nicht durch 100 – außer es ist durch 400 teilbar.</i></p>`,
      start: `jahr = int(input("Jahreszahl: "))\n\n`,
      tipps: ['Teilbar durch 4: <code>jahr % 4 == 0</code>. Nicht teilbar durch 100: <code>jahr % 100 != 0</code>.',
              'Schaltjahr, wenn (durch 4 teilbar <b>und</b> nicht durch 100 teilbar) <b>oder</b> durch 400 teilbar.'],
      tests: [{ein: ['2024'], aus: ['Schaltjahr']}, {ein: ['2023'], aus: ['kein Schaltjahr']}, {ein: ['1900'], aus: ['kein Schaltjahr']}, {ein: ['2000'], aus: ['Schaltjahr']}, {ein: ['2100'], aus: ['kein Schaltjahr']}, {ein: ['1996'], aus: ['Schaltjahr']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Die größte von drei Zahlen', stufe: 3,
      wissen: `
<p>Ein <code>if</code> kann innerhalb eines anderen <code>if</code> stehen. Das nennt man <b>Verschachtelung</b>. Das innere <code>if</code> wird dabei noch einmal eingerückt.</p>
<pre class="py">
alter = int(input("Alter: "))
if alter >= 16:
    begleitung = input("Mit Begleitung? (ja/nein) ")
    if begleitung == "ja":
        print("Einlass bis 24 Uhr")
    else:
        print("Einlass bis 22 Uhr")
else:
    print("kein Einlass")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das drei Zahlen einliest und die <b>größte</b> der drei Zahlen ausgibt, z. B. <code>9</code> oder <code>Die größte Zahl ist 9</code>.</p>
<p>Verwende <b>verschachtelte</b> <code>if</code>-Anweisungen und nicht die Funktion <code>max()</code>.</p>`,
      start: `a = int(input("Erste Zahl: "))\nb = int(input("Zweite Zahl: "))\nc = int(input("Dritte Zahl: "))\n\n`,
      tipps: ['Vergleiche zuerst a mit b. Im Block für „a ist größer“ musst du dann nur noch a mit c vergleichen.',
              'Achte auf gleiche Zahlen: Mit <code>&gt;=</code> statt <code>&gt;</code> funktioniert auch 5, 5, 2.'],
      tests: [{ein: ['3', '7', '5'], aus: ['7'], zahl: true}, {ein: ['9', '2', '4'], aus: ['9'], zahl: true}, {ein: ['1', '2', '8'], aus: ['8'], zahl: true},
              {ein: ['5', '5', '2'], aus: ['5'], zahl: true}, {ein: ['4', '4', '4'], aus: ['4'], zahl: true}, {ein: ['-2', '-9', '-1'], aus: ['-1'], zahl: true}],
      muss: [NESTED_IF],
      nicht: [{re: /\bmax\s*\(/, text: 'Löse die Aufgabe ohne max().'}]
    },
    {
      titel: 'Login', stufe: 3,
      wissen: `
<p>Auch Texte kann man vergleichen. Der Text in der Bedingung steht in Anführungszeichen, und Groß-/Kleinschreibung zählt. Für Texte brauchst du <b>kein</b> <code>int()</code>.</p>
<pre class="py">
antwort = input("Hauptstadt von Frankreich? ")
if antwort == "Paris":
    print("Richtig!")
else:
    print("Leider falsch.")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das nach Benutzername und Passwort fragt und prüft:</p>
<ul>
  <li>Benutzername <code>admin</code> und Passwort <code>1234</code> → <code>Login erfolgreich</code></li>
  <li>nur der Benutzername falsch → <code>Falscher Benutzername</code></li>
  <li>nur das Passwort falsch → <code>Falsches Passwort</code></li>
  <li>beides falsch → <code>Falscher Benutzername und falsches Passwort</code></li>
</ul>`,
      start: `name = input("Benutzername: ")\npasswort = input("Passwort: ")\n\n`,
      tipps: ['Prüfe außen den Benutzernamen und innen (verschachtelt) das Passwort.', 'Im else-Teil (Name falsch) brauchst du noch ein inneres if für das Passwort.'],
      tests: [{ein: ['admin', '1234'], aus: ['Login erfolgreich']}, {ein: ['Admin', '1234'], aus: ['Falscher Benutzername']}, {ein: ['admin', '4321'], aus: ['Falsches Passwort']}, {ein: ['gast', '0000'], aus: ['Falscher Benutzername und falsches Passwort']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    },
    {
      titel: 'Wochentag', stufe: 3,
      wissen: `
<p>Programme sollten auch mit <b>ungültigen Eingaben</b> umgehen können. Prüfe deshalb zuerst, ob die Eingabe überhaupt erlaubt ist:</p>
<pre class="py">
monat = int(input("Monat (1-12): "))
if monat < 1 or monat > 12:
    print("ungültige Eingabe")
else:
    if monat <= 6:
        print("erstes Halbjahr")
    else:
        print("zweites Halbjahr")
</pre>`,
      auftrag: `
<p>Schreibe ein Programm, das nach einem Wochentag als Zahl fragt (1 = Montag … 7 = Sonntag) und ausgibt:</p>
<ul>
  <li>1 bis 5 → <code>Werktag</code></li>
  <li>6 oder 7 → <code>Wochenende</code></li>
  <li>jede andere Zahl → <code>ungültige Eingabe</code></li>
</ul>`,
      start: `tag = int(input("Wochentag (1-7): "))\n\n`,
      tipps: ['Prüfe zuerst, ob die Zahl kleiner als 1 oder größer als 7 ist.'],
      tests: [{ein: ['1'], aus: ['Werktag']}, {ein: ['5'], aus: ['Werktag']}, {ein: ['6'], aus: ['Wochenende']}, {ein: ['7'], aus: ['Wochenende']}, {ein: ['0'], aus: ['ungültige Eingabe']}, {ein: ['8'], aus: ['ungültige Eingabe']}, {ein: ['-2'], aus: ['ungültige Eingabe']}],
      muss: [{re: /\bif\b/, text: 'Verwende eine if-Anweisung.'}]
    }
  ]
};
</script>
<script src="lib/pykurs.js"></script>
</body>
</html>
