<!-- ===================== Lernmodus: Domi-No's ===================== -->
<script id="lesson">
/* Tabellenblätter aus Dominos.xlsx */

         rows:[['Lena', 19, 'ja'], ['Max', 18, 'nein'], ['Mia', 17, 'ja'], ['Jonas', 15, 'nein'], ['Sarah', 22, 'ja']]},
  a1:   {start:2, head:['Kunde', 'Bestellwert (€)', 'Rabatt (%)', 'Ergebnis'], cols:'ABCD',
         rows:[['Müller', 60, 5], ['Schmidt', 40, 15], ['Becker', 80, 10], ['Wagner', 30, 20]]},
  a2:   {start:3, head:['Name', 'Alter', 'Führerschein', 'Ergebnis'], cols:'ABCD',
         rows:[['Anna', 20, 'Ja'], ['Ben', 17, 'Ja'], ['Clara', 25, 'Nein'], ['David', 18, 'Ja']]},
  oder: {start:4, head:['Nachname', 'Bestelltes Menü', 'Rabatt (%)'], cols:'ABC',
         rows:[['Müller', 'Menü 1'], ['Schmidt', 'Menü 2'], ['Becker', 'Menü 3'], ['Wagner', 'Menü 1'], ['Fischer', 'Menü 2']]},
  a3:   {start:3, head:['Name', 'Alter', 'Mitgliedschaft', 'Ergebnis'], cols:'ABCD',
         rows:[['Anna', 20, 'Nein'], ['Ben', 16, 'Ja'], ['Clara', 17, 'Nein'], ['David', 18, 'Ja']]},
  a4:   {start:3, head:['Kunde', 'Bestellwert (€)', 'Rabatt (%)', 'Ergebnis'], cols:'ABCD',
         rows:[['Müller', 40, 5], ['Schmidt', 80, 8], ['Becker', 30, 15], ['Wagner', 60, 3]]}
};
function sheetEnv(sh, i){
  const env = {};
  sh.rows[i].forEach((v, c) => { env[sh.cols[c] + sh.start] = typeof v === 'number' ? {t:'num', v} : {t:'str', v}; });
  return env;
}

/* Aufgaben des Lernmodus – nutzen denselben Aufgabengenerator wie Übungen/Endlos */
const LSCEN = {
  fs: { name:'Führerschein', pick:() => ({}), build:() => ({comb:null, sheet:'bew', out:'D4',
    conds:[{c:0, op:'=', b:'ja', type:'text', values:['ja', 'nein']}], then:'ja', else:'nein',
    text:() => `Schreibe in Zelle ${B('D4')} eine WENN-Funktion, die entscheidet, ob Lenas Führerschein in ${B('C4')} das Kriterium erfüllt. Ausgegeben werden soll ${C('ja')} bzw. ${C('nein')}.`,
    resD:['Ja', 'kein Führerschein', 'nicht', 'erfüllt', 'falsch', 'Lena']}) },
  alter: { name:'Alter', pick:() => ({}), build:() => ({comb:null, sheet:'bew', out:'D4',
    conds:[{c:0, op:'>=', b:18, type:'int', lo:14, hi:30}], then:'ja', else:'nein',
    text:() => `Schreibe in Zelle ${B('D4')} eine WENN-Funktion, die entscheidet, ob das Alter in ${B('B4')} das Kriterium „mindestens 18“ erfüllt. Ausgegeben werden soll ${C('ja')} bzw. ${C('nein')}.`,
    resD:['Ja', 'volljährig', 'nicht', '18', 18, 'zu jung']}) },
  und: { name:'UND', pick:() => ({}), build:() => ({comb:'UND', sheet:'bew',
    conds:[{c:0, op:'>=', b:18, type:'int', lo:14, hi:30}, {c:1, op:'=', b:'ja', type:'text', values:['ja', 'nein']}], then:'ja', else:'nein',
    text:(c, o) => `Schreibe in Zelle ${B(o)} eine WENN-Funktion, die entscheidet, ob das Alter in ${B(c[0])} <b>und</b> der Führerschein in ${B(c[1])} jeweils das Kriterium erfüllen. Ausgegeben werden soll ${C('ja')} bzw. ${C('nein')}.`,
    resD:['Ja', 'nicht', 'erfüllt', 'volljährig', 18, 'Führerschein']}) },
  a2: { name:'Aufgabe 2', pick:() => ({}), build:() => ({comb:'UND', sheet:'a2',
    conds:[{c:0, op:'>=', b:18, type:'int', lo:14, hi:30}, {c:1, op:'=', b:'Ja', type:'text', values:['Ja', 'Nein']}], then:'geeignet', else:'nicht geeignet',
    text:(c, o) => `Tabellenblatt <i>Aufgabe2</i>: Als Lieferfahrer geeignet ist, wer mindestens 18 Jahre alt ist und einen Führerschein hat. Gib in ${B(o)} ${C('geeignet')} bzw. ${C('nicht geeignet')} aus.`,
    resD:['ja', 'nein', 'ungeeignet', 'Ja', 18, 'Führerschein']}) },
  a1: { name:'Aufgabe 1', pick:() => ({}), build:() => ({comb:'UND', sheet:'a1',
    conds:[{c:0, op:'>=', b:50, type:'int', lo:0, hi:150}, {c:1, op:'<=', b:10, type:'int', lo:0, hi:30}], then:'gewährt', else:'abgelehnt',
    text:(c, o) => `Tabellenblatt <i>Aufgabe1</i>: Kunden dürfen sich einen Rabatt wünschen. Er wird nur gewährt, wenn der Bestellwert mindestens 50 € beträgt und der gewünschte Rabatt höchstens 10 % ist. Gib in ${B(o)} ${C('gewährt')} bzw. ${C('abgelehnt')} aus.`,
    resD:['ja', 'nein', 'Rabatt', 10, 50, 'gewährt!']}) },
  oder: { name:'ODER', pick:() => ({}), build:() => ({comb:'ODER', sheet:'oder',
    conds:[{c:0, op:'=', b:'Menü 1', type:'text', values:['Menü 1', 'Menü 2', 'Menü 3']}, {c:0, op:'=', b:'Menü 2', type:'text', values:['Menü 1', 'Menü 2', 'Menü 3']}], then:10, else:0,
    text:(c, o) => `Tabellenblatt <i>ODER</i>: Wer ${C('Menü 1')} oder ${C('Menü 2')} bestellt, erhält 10 % Rabatt, alle anderen 0 %. Gib in ${B(o)} den Rabatt in Prozent als Zahl aus.`,
    resD:['10 %', '10', '0', 'nein', 0.1, 'Menü 1']}) },
  a3: { name:'Aufgabe 3', pick:() => ({}), build:() => ({comb:'ODER', sheet:'a3',
    conds:[{c:0, op:'>=', b:18, type:'int', lo:12, hi:30}, {c:1, op:'=', b:'Ja', type:'text', values:['Ja', 'Nein']}], then:'Zugang', else:'kein Zugang',
    text:(c, o) => `Tabellenblatt <i>Aufgabe 3</i>: Zum Pizza-Club-Abend kommt, wer mindestens 18 Jahre alt ist oder eine Mitgliedschaft hat. Gib in ${B(o)} ${C('Zugang')} bzw. ${C('kein Zugang')} aus.`,
    resD:['ja', 'nein', 'Mitglied', 'Ja', 18, 'Zutritt']}) },
  a4: { name:'Aufgabe 4', pick:() => ({}), build:() => ({comb:'ODER', sheet:'a4',
    conds:[{c:0, op:'<', b:50, type:'int', lo:0, hi:150}, {c:1, op:'>', b:10, type:'int', lo:0, hi:30}], then:'prüfen', else:'ok',
    text:(c, o) => `Tabellenblatt <i>Aufgabe 4</i>: Der Chef möchte eine Bestellung selbst prüfen, wenn der Bestellwert unter 50 € liegt oder der Rabatt mehr als 10 % beträgt. Gib in ${B(o)} ${C('prüfen')} bzw. ${C('ok')} aus.`,
    resD:['ja', 'nein', 'prüfen!', 'okay', 50, 10]}) }
};
const LCELL = {fs:['C', 4], alter:['B', 4], und:['B', 4], a2:['B', 3], a1:['B', 2], oder:['B', 4], a3:['B', 3], a4:['B', 3]};

const HELP_WENN = `<details class="help"><summary>Hilfe: Aufbau der WENN-Funktion</summary>
<p><code>=WENN(Prüfung; Dann_Wert; Sonst_Wert)</code></p>
<ul><li>Die <b>Prüfung</b> ist eine Bedingung, z. B. <code>B4&gt;=18</code> oder <code>C4="ja"</code>.</li>
<li>Text schreibst du in Anführungszeichen: <code>"ja"</code>. Zahlen und Zellen ohne.</li>
<li>Die Teile trennst du mit einem Semikolon <code>;</code>.</li></ul></details>`;
const HELP_OPS = `<details class="help"><summary>Hilfe: Vergleichszeichen</summary>
<table class="tt"><tr><th>Zeichen</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><code>=</code></td><td>gleich</td><td><code>C4="ja"</code></td></tr>
<tr><td><code>&lt;&gt;</code></td><td>ungleich</td><td><code>C4&lt;&gt;"ja"</code></td></tr>
<tr><td><code>&gt;</code></td><td>größer als / mehr als</td><td><code>B4&gt;18</code></td></tr>
<tr><td><code>&gt;=</code></td><td>größer oder gleich / mindestens / ab</td><td><code>B4&gt;=18</code></td></tr>
<tr><td><code>&lt;</code></td><td>kleiner als / unter</td><td><code>B4&lt;18</code></td></tr>
<tr><td><code>&lt;=</code></td><td>kleiner oder gleich / höchstens</td><td><code>B4&lt;=18</code></td></tr></table></details>`;
const HELP_UND = `<details class="help"><summary>Hilfe: WENN mit UND / ODER</summary>
<p><code>=WENN(UND(Bedingung1; Bedingung2); Dann_Wert; Sonst_Wert)</code></p>
<p>Die Klammer von UND bzw. ODER wird <b>vor</b> dem ersten Semikolon von WENN geschlossen.</p></details>`;

const T_BEW_UND = {
  cols:['Name', 'B4>=18', 'C4="ja"', 'UND(B4>=18; C4="ja")'],
  rows:SHEETS.bew.rows.map(r => [r[0], r[1] >= 18, r[2] === 'ja', r[1] >= 18 && r[2] === 'ja']), fill:[3]};
const T_MENU = {
  cols:['Nachname', 'B4="Menü 1"', 'B4="Menü 2"', 'ODER(B4="Menü 1"; B4="Menü 2")'],
  rows:SHEETS.oder.rows.map(r => [r[0], r[1] === 'Menü 1', r[1] === 'Menü 2', r[1] === 'Menü 1' || r[1] === 'Menü 2']), fill:[3]};
const T_ABS = {
  cols:['Bedingung1', 'Bedingung2', 'UND(Bedingung1; Bedingung2)', 'ODER(Bedingung1; Bedingung2)'],
  rows:[[true, true, true, true], [true, false, false, true], [false, true, false, true], [false, false, false, false]], fill:[2, 3]};

const STEPS = [
  {type:'info', title:'Willkommen bei Domi-No’s', sheet:'bew',
   html:`<p>Du erstellst Excel-Tabellen für die Pizza-Kette <b>Domi-No’s</b>, um bei der Auswahl von Personal zu helfen. Rechts siehst du die aktuelle Bewerberliste.</p>
   <p>So funktioniert diese Seite: Jeder Schritt erklärt etwas oder stellt dir eine Aufgabe. Erst wenn du sie richtig gelöst hast, geht es mit <b>Weiter</b> zum nächsten Schritt. Du bekommst sofort eine Rückmeldung.</p>
   <p>Am Ende kannst du verknüpfte Bedingungen mit <code>UND</code> und <code>ODER</code> in einer WENN-Funktion verwenden.</p>`},

  {type:'task', title:'Kriterium: Führerschein', task:'fs', level:8,
   html:`<p>Dein Chef startet eine Werbekampagne, um neues Personal zu finden. Deine Funktion soll automatisch entscheiden, ob Bewerber die Kriterien erfüllen. Das erste Kriterium: Sie brauchen einen Führerschein.</p>${HELP_WENN}`,
   after:'Excel hat deine Formel für alle Bewerber „nach unten gezogen“ – sieh dir die Spalte D an.'},

  {type:'task', title:'Kriterium: mindestens 18', task:'alter', level:8,
   html:`<p>Dein Chef stellt fest, dass sich viele 16-Jährige mit Mofa-Führerschein bewerben, denen er absagen muss. Neue Regel: Bewerber müssen <b>mindestens 18</b> sein.</p>${HELP_OPS}`,
   after:'Achte auf Max: Er ist genau 18 und erfüllt das Kriterium. Deshalb <code>&gt;=</code> und nicht <code>&gt;</code>.'},

  {type:'cond', title:'Die beiden Bedingungen', sheet:'bew',
   html:`<p>Schreibe jeweils die <b>Bedingung</b> (die Prüfung) auf, die du für Lena formuliert hast – nur die Bedingung, ohne <code>=WENN(</code>.</p>
   <details class="help"><summary>Zur Erinnerung: die beiden Kriterien</summary>
   <ul><li><b>Führerschein:</b> Der Bewerber muss einen Führerschein haben. In Spalte C steht dafür <code>ja</code> oder <code>nein</code>.</li>
   <li><b>Alter:</b> Der Bewerber muss <b>mindestens 18</b> Jahre alt sein. Das Alter steht in Spalte B.</li></ul>
   <p>Lena steht in Zeile 4.</p></details>`,
   fields:[{label:'Führerschein', ref:'C4="ja"'}, {label:'Alter', ref:'B4>=18'}],
   tests:{B4:[0, 15, 17, 18, 19, 22], C4:['ja', 'nein']}},

  {type:'choice', title:'Ein neues Problem', sheet:'bew', multi:true,
   html:`<p>Viele Bewerber sind jetzt zwar volljährig, haben aber keinen Führerschein – und umgekehrt. Der Chef will nur noch Bewerber, die <b>mindestens 18 sind und einen Führerschein haben</b>.</p><p><b>Wer kommt in Frage?</b> Wähle alle passenden Bewerber aus.</p>`,
   options:['Lena', 'Max', 'Mia', 'Jonas', 'Sarah'], correct:[0, 4],
   why:{1:'Max ist 18, hat aber keinen Führerschein.', 2:'Mia hat einen Führerschein, ist aber erst 17.', 3:'Jonas erfüllt keines der beiden Kriterien.'},
   after:'Genau! Beide Kriterien müssen gleichzeitig erfüllt sein. Mit einer einzelnen Bedingung kann WENN das nicht prüfen – dafür gibt es <code>UND</code>.'},

  {type:'dragcond', title:'Die Funktion UND', fn:'UND', sheet:'bew',
   html:`<div class="assign"><b>Kriterium des Chefs:</b> Bewerber müssen <b>mindestens 18</b> sein <b>und</b> einen <b>Führerschein</b> haben. Die Formel steht in Zeile 4 (Lena).</div>
   <p>Mit <code>UND</code> verknüpfst du mehrere Bedingungen zu <b>einer</b>. Die Bedingungen trennst du mit einem Semikolon:</p>
   <p class="formula-ex"><code>UND(Bedingung1; Bedingung2)</code></p>
   <p><code>UND</code> ist nur dann <code>WAHR</code>, wenn <b>alle</b> Bedingungen erfüllt sind.</p>

   html:`<div class="assign"><b>Kriterium des Chefs:</b> Bewerber müssen <b>mindestens 18</b> sein <b>und</b> einen <b>Führerschein</b> haben. Die Formel steht in Zeile 4 (Lena).</div>
   <p>Was ergibt <code>UND(B4&gt;=18; C4="ja")</code> für die einzelnen Bewerber? Denk daran: <code>UND</code> ist nur dann <code>WAHR</code>, wenn <b>alle</b> Bedingungen erfüllt sind.</p>
   <p><b>Aufgabe:</b> Klicke in der letzten Spalte auf die Felder und trage für jeden Bewerber ein, was <code>UND</code> ergibt.</p>`},

   correct:[2], mono:true,

  {type:'task', title:'Übung: Aufgabe 1', task:'a1', level:8,

   html:`<p>Entscheide für jede Regel, ob du sie mit <code>UND</code> oder mit <code>ODER</code> umsetzt. Vorsicht: Nicht jedes „und“ im Satz bedeutet <code>UND</code>!</p>`,
   items:[
     {t:'Lieferfahrer muss mindestens 18 sein und einen Führerschein haben.', a:'UND'},
     {t:'Rabatt gibt es für Schüler oder für Kunden über 65.', a:'ODER'},
     {t:'Die Filiale hat am Montag und am Dienstag geschlossen. (Ist heute geschlossen?)', a:'ODER', why:'Ein Tag kann nicht gleichzeitig Montag und Dienstag sein – geschlossen ist, wenn der Tag Montag <b>oder</b> Dienstag ist.'},
     {t:'Der Jugendtarif gilt von 14 bis einschließlich 17 Jahren.', a:'UND', why:'„von … bis“ heißt: mindestens 14 <b>und</b> höchstens 17.'},
     {t:'Eine Bestellung wird geprüft, wenn der Wert unter 50 € liegt oder der Rabatt über 10 % liegt.', a:'ODER'}
   ]},

  {type:'info', title:'Geschafft!', final:true,
   html:`<p>Du kannst jetzt Bedingungen in einer WENN-Funktion verknüpfen:</p>
   <ul><li><code>UND(Bedingung1; Bedingung2)</code> ist WAHR, wenn <b>alle</b> Bedingungen erfüllt sind.</li>
   <li><code>ODER(Bedingung1; Bedingung2)</code> ist WAHR, wenn <b>mindestens eine</b> Bedingung erfüllt ist.</li>
   <li>Die Verknüpfung steht als Prüfung in der WENN-Funktion: <code>=WENN(UND(…; …); Dann_Wert; Sonst_Wert)</code></li></ul>
   <p>Zum Üben geht es bei den <b>Übungen</b> (30 Aufgaben) oder im Modus <b>Endlos</b> weiter.</p>

<!-- ===================== Oberfläche ===================== -->
<script>
const KEY = 'uo-';

const LEVELS = WB_LEVELS;

/* gelöste Aufgabe bzw. erledigten Schritt an den Server melden (nur wenn die Seite über PocketBase läuft) */
function logSolved(erstmals){
  if (!window.TrainerSync) return;
  if (mode === 'lernen') TrainerSync.event({modus: 'erarbeitung', stufe: STEPS[learnIdx].level || 0, aufgabe: String(learnIdx + 1), titel: STEPS[learnIdx].title, gesamt: STEPS.length, erstmals});
  else TrainerSync.event({modus: mode === 'pfad' ? 'uebungen' : 'endlos', stufe: level,
    aufgabe: mode === 'pfad' ? String(pfadIdx + 1) : CUR.scen, titel: CUR.scen, gesamt: mode === 'pfad' ? STD.length : 0, erstmals});
}
let mode = ['endlos', 'lernen'].includes(load('mode')) ? load('mode') : 'lernen';
if (['lernen', 'pfad', 'endlos'].includes(location.hash.slice(1))){ mode = location.hash.slice(1); history.replaceState(null, '', location.pathname + location.search); }   // von und-oder-bezuege.html
let level = Math.min(9, Math.max(1, parseInt(load('level')) || 1));
let pfadIdx = Math.min(STD.length - 1, Math.max(0, parseInt(load('idx')) || 0));
let solved = {}; try { solved = JSON.parse(load('solved') || '{}') || {}; } catch (e) {}
let endScen = null, endSeed = 0, endCounted = false, streak = 0, best = parseInt(load('best')) || 0;
let CUR, S, uid = 0, poolSeed = rand(), pickerOpen = false;

/* ---------- Aufgaben- und Modussteuerung ---------- */
function loadTask(){
  if (mode === 'lernen'){ loadStep(); return; }
  if (mode === 'pfad'){ const [id, p] = STD[pfadIdx]; CUR = buildTask(id, p, 7919 * (pfadIdx + 1) + 13); }
  else CUR = buildTask(endScen, {}, endSeed);
  poolSeed = rand(); setup();
}
function setMode(m){ if (m === mode) return; mode = m; store('mode', m); pickerOpen = false; level = Math.min(9, Math.max(1, parseInt(load('level')) || 1)); if (m === 'endlos' && !endScen) newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function canNext(){ if (mode === 'lernen') return learnIdx < STEPS.length - 1 && learnDone.has(learnIdx); return mode === 'pfad' ? (pfadIdx < STD.length - 1 && isSolved(pfadIdx)) : endCounted; }
function nextTask(){ if (!canNext()) return; if (mode === 'lernen'){ gotoStep(learnIdx + 1); return; } if (mode === 'pfad') gotoTask(pfadIdx + 1); else { newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); } }
function setup(){ wbSetup(); }

/* ---------- Rendering ---------- */
function renderNav(){
  if (mode === 'lernen') navLernen(learnIdx, STEPS.length, STEPS[learnIdx].type === 'info');
  else navPfad();
  renderDock();
}

function renderDock(){
  const d = $('#dock');
  if (mode !== 'lernen'){ d.innerHTML = dockHTML(); return; }
  let h = `<button class="dockbtn" id="dockBtn" aria-expanded="${pickerOpen}">📘 Schritt ${learnIdx + 1}/${STEPS.length} <span class="sub">· ${learnDone.size} erledigt</span></button>`;
  if (pickerOpen) h += '<div class="picker steps"><div class="ptitle">Schritte – erledigte sind grün, gesperrte noch nicht erreichbar</div>' +
    STEPS.map((st, i) => `<button data-step="${i}" class="stepbtn${learnDone.has(i) ? ' solved' : ''}${i === learnIdx ? ' cur' : ''}"${stepUnlocked(i) ? '' : ' disabled'}>${i + 1}. ${esc(st.title)}</button>`).join('') +
    '<button class="stepreset" data-learnreset="1">Fortschritt zurücksetzen</button></div>';
  d.innerHTML = h;
}

function renderGrid(){
  if (CUR && CUR.sheet){ $('#grid').innerHTML = sheetHTML(CUR.sheet, S.success ? S.ast : null); return; }
  wbGrid();
}
function render(){
  if (mode === 'lernen' && STEPS[learnIdx].type !== 'task'){ renderLearnStep(); return; }
  const T = CUR, L = LEVELS[level];
  if (mode === 'lernen'){
    const st = STEPS[learnIdx];
    wbRender({lvl:'Erarbeitung · ' + st.title, meta:`Schritt ${learnIdx + 1} von ${STEPS.length}`, text:st.html + `<div class="assign"><b>Aufgabe:</b> ${T.text}</div>`});
  } else wbRender({lvl:`Stufe ${level}: ${L.name}`, meta:mode === 'pfad' ? `Übungen · Aufgabe ${pfadIdx + 1} von ${STD.length}` : `Endlos · Szenario: ${T.scen}`, text:T.text});
}
function check(){
  if (mode === 'lernen' && STEPS[learnIdx].type !== 'task'){ checkStep(); return; }
  if (mode === 'lernen') wbCheck({geloest:() => { const erstmals = !learnDone.has(learnIdx); markStep(); return erstmals; }, nachher:STEPS[learnIdx].after});
  else wbCheck();
}

/* ---------- Lernmodus ---------- */
let learnIdx = 0, learnDone = new Set(), LS = null;
try { const st = JSON.parse(load('learn') || '{}'); learnIdx = Math.min(STEPS.length - 1, Math.max(0, st.idx || 0)); learnDone = new Set(st.done || []); } catch (e) {}
function saveLearn(){ store('learn', JSON.stringify({idx:learnIdx, done:[...learnDone]})); }
function markStep(){ learnDone.add(learnIdx); saveLearn(); }
function firstOpen(){ for (let i = 0; i < STEPS.length; i++) if (!learnDone.has(i)) return i; return STEPS.length - 1; }
function stepUnlocked(i){ return i <= firstOpen() || learnDone.has(i); }

function loadStep(){
  learnIdx = Math.min(STEPS.length - 1, Math.max(0, learnIdx)); saveLearn();
  const st = STEPS[learnIdx];
  if (st.type === 'task'){
    const [col, row] = LCELL[st.task];
    CUR = buildTask(st.task, {col, row}, 101 + learnIdx);
    level = st.level; poolSeed = rand(); setup(); return;
  }
  CUR = null;
  S = {fb:null, success:false, ast:null};
  LS = {sel:new Set(), vals:{}, ans:{}, inputs:(st.fields || []).map(() => ''), fieldErr:{}, fieldOk:{}, wrong:new Set(), checked:false};
  if (st.type === 'dragcond'){
    uid = 0; const r = rng(rand());
    Object.assign(S, {items:{}, slots:{c1:null, c2:null}, row:[], pools:{fn:[], cond:[], cval:[], res:[]}});
    S.pools.cond = shuffle(st.options.map(l => { const id = 'b' + (++uid); S.items[id] = {id, kind:'cond', lit:l, label:l}; return id; }), r);
  }
  if (st.type === 'info') markStep();
  render();
}
function gotoStep(i){ learnIdx = i; pickerOpen = false; loadStep(); window.scrollTo({top:0, behavior:'smooth'}); }

function sheetHTML(sh, ast){
  const L = sh.cols.split(''), outCol = L[L.length - 1];
  const val = v => typeof v === 'number' ? fmtNum(v) : esc(v);
  let h = `<table class="grid sheet"><tr><th></th>${L.map(l => `<th>${l}</th>`).join('')}</tr>`;
  h += `<tr><th>${sh.start - 1}</th>${sh.head.map(x => `<td class="lbl hd">${esc(x)}</td>`).join('')}</tr>`;
  sh.rows.forEach((r, i) => {
    let out = '';
    if (ast){ const v = ev(ast, sheetEnv(sh, i)); out = esc(v.t === 'str' ? v.v : fmtVal(v)); }
    const cells = r.map(v => `<td>${val(v)}</td>`).join('');
    const outCell = r.length < L.length ? `<td class="${i === 0 ? 'fx' : 'res'}${ast ? ' filled' : ''}">${out}</td>` : '';
    h += `<tr><th>${sh.start + i}</th>${cells}${outCell}</tr>`;
  });
  return h + '</table>';
}

/* Bedingung einzeln prüfen: wird als =WENN(Bedingung;"WAHR";"FALSCH") ausgewertet */
function condCheck(inp, field, tests){
  let s = normQuotes(inp).trim();
  if (!s) return {err:'Bitte trage hier etwas ein.'};
  if (s.startsWith('=')) s = s.slice(1).trim();
  if (/^WENN\s*\(/i.test(s)) return {err:'Hier ist nur die Bedingung gefragt – ohne WENN.'};
  let depth = 0, inStr = false;
  for (const ch of s){ if (ch === '"') inStr = !inStr; else if (!inStr){ if (ch === '(') depth++; else if (ch === ')') depth--; else if (ch === ';' && depth === 0) return {err:'Mehrere Bedingungen verknüpft man mit UND(…; …) bzw. ODER(…; …).'}; } }
  let a;
  try { a = parseFormula(`=WENN(${s};"W";"F")`); }
  catch (e){ if (!(e instanceof FErr)) throw e; return {err:e.message.replace(/ \(der erste Teil von WENN\)/, '').replace(/^Die Prüfung fehlt\.$/, 'Die Bedingung ist unvollständig.')}; }
  const b = parseFormula(`=WENN(${field.ref};"W";"F")`);
  if (field.need && !usesFn(a, [field.need])) return {err:`Verwende hier die Funktion ${field.need}(Bedingung1; Bedingung2).`};
  for (const env of tests){
    const x = ev(a, env), y = ev(b, env);
    if (!same(x, y)){
      const cs = Object.keys(env).map(k => `${k} = <code>${esc(fmtVal(env[k]))}</code>`).join(' und ');
      const nice = v => v.t === 'str' ? (v.v === 'W' ? 'WAHR' : 'FALSCH') : fmtVal(v);
      return {err:`Wenn ${cs} ist, wäre deine Bedingung <b>${nice(x)}</b> – richtig wäre <b>${nice(y)}</b>.`, html:true};
    }
  }
  return {ok:true};
}
function condTests(spec){
  const keys = Object.keys(spec);
  return product(keys.map(k => spec[k].map(v => typeof v === 'number' ? {t:'num', v} : {t:'str', v})))
    .map(vs => Object.fromEntries(vs.map((v, i) => [keys[i], v])));
}

function renderLearnStep(){
  const st = STEPS[learnIdx];
  renderHeader();
  $('#lvlname').textContent = 'Erarbeitung · ' + st.title;
  $('#taskmeta').textContent = `Schritt ${learnIdx + 1} von ${STEPS.length}`;
  $('#tasktext').innerHTML = st.html;
  $('#grid').innerHTML = st.sheet ? sheetHTML(SHEETS[st.sheet], null) : '';
  $('#pools').innerHTML = ''; $('#pools').style.display = 'none';
  $('#workcard').style.display = st.type === 'info' ? 'none' : '';
  $('#wtlabel').textContent = 'Deine Antwort';
  $('#wthint').textContent = '';
  const W = $('#work');
  if (st.type === 'choice'){
    W.innerHTML = Aufgaben.mc.html(st, LS.sel, LS.checked);
  } else if (st.type === 'truth'){
    const t = st.table;
    W.innerHTML = `<div class="tscroll"><table class="truth"><tr>${t.cols.map((c, i) => `<th class="${t.fill.includes(i) ? 'fillh' : ''}">${i === 0 && typeof t.rows[0][0] === 'string' ? esc(c) : `<code>${esc(c)}</code>`}</th>`).join('')}</tr>` +
      t.rows.map((r, ri) => '<tr>' + r.map((v, ci) => {
        if (typeof v === 'string') return `<td class="nm">${esc(v)}</td>`;
        if (!t.fill.includes(ci)) return `<td><span class="tv ${v ? 'w' : 'f'}">${v ? 'WAHR' : 'FALSCH'}</span></td>`;
        const k = ri + ',' + ci, cur = LS.vals[k];
        return `<td><button class="tcell${cur ? (cur === 'WAHR' ? ' w' : ' f') : ''}${LS.wrong.has(k) ? ' bad' : ''}" data-tcell="${k}">${cur || '?'}</button></td>`;
      }).join('') + '</tr>').join('') + '</table></div><div class="ohint">Klicke auf ein Feld, um zwischen WAHR und FALSCH zu wechseln.</div>';
  } else if (st.type === 'classify'){
    W.innerHTML = '<div class="cls">' + st.items.map((it, i) => {
      const a = LS.ans[i], bad = LS.checked && a && a !== it.a;
      return `<div class="clsrow${bad ? ' bad' : ''}${LS.checked && a === it.a ? ' good' : ''}"><div class="clst">${esc(it.t)}</div><div class="clsb">` +
        ['UND', 'ODER'].map(v => `<button class="opt small${a === v ? ' sel' : ''}" data-cls="${i}" data-v="${v}">${v}</button>`).join('') + '</div></div>';
    }).join('') + '</div>';
  } else if (st.type === 'cond'){
    W.innerHTML = st.fields.map((f, i) => `<div class="condrow"><label for="cf${i}">${esc(f.label)}</label>
      <input id="cf${i}" class="condin acin${LS.fieldOk[i] ? ' ok' : ''}${LS.fieldErr[i] ? ' err' : ''}" data-f="${i}" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${esc(f.ph || 'Bedingung, z. B. A1>5')}" value="${esc(LS.inputs[i])}">
      <div class="condmsg">${LS.fieldErr[i] ? LS.fieldErr[i] : (LS.fieldOk[i] ? '✓ richtig' : '')}</div></div>`).join('');
  } else if (st.type === 'dragcond'){
    W.innerHTML = `<div class="formula">${blockHTML({kind:'fn', lit:st.fn}, {drag:false, live:true, role:role('cond')})}</div>`;
    $('#pools').innerHTML = `<div class="pool" data-drop="pool"><div class="pool-title">Bedingungen</div><div class="pool-items">${S.pools.cond.map(id => blockHTML(S.items[id], {ghost:isPlaced(id)})).join('')}</div></div>`;
    $('#pools').style.display = '';
    $('#wthint').textContent = '· Zum Entfernen eine Bedingung zurück nach unten ziehen';
  } else W.innerHTML = '';
  renderFeedback(); renderNav();
}

function checkStep(){
  const st = STEPS[learnIdx];
  let ok = false, html = '';
  if (st.type === 'choice'){
    if (!LS.sel.size){ S.fb = {type:'err', html:'Wähle zuerst eine Antwort aus.'}; renderFeedback(); return; }
    LS.checked = true;
    const r = Aufgaben.mc.pruefen(st, LS.sel);
    ok = r.ok;
    if (!ok) html = 'Noch nicht ganz.<br>' + r.gruende.join('<br>');
  } else if (st.type === 'truth'){
    const t = st.table; let wrong = 0, empty = 0; LS.wrong = new Set();
    t.rows.forEach((r, ri) => t.fill.forEach(ci => { const k = ri + ',' + ci, v = LS.vals[k]; if (!v) empty++; else if ((v === 'WAHR') !== r[ci]){ wrong++; LS.wrong.add(k); } }));
    if (empty) html = `Es ${empty === 1 ? 'ist noch ein Feld' : `sind noch ${empty} Felder`} mit „?“ offen.`;
    else if (wrong) html = `${wrong === 1 ? 'Ein Feld ist' : wrong + ' Felder sind'} noch falsch (rot markiert).<br>UND: nur WAHR, wenn <b>alle</b> Bedingungen WAHR sind. ODER: WAHR, sobald <b>mindestens eine</b> Bedingung WAHR ist.`;
    else ok = true;
  } else if (st.type === 'classify'){
    LS.checked = true;
    const open = st.items.filter((_, i) => !LS.ans[i]).length;
    const wrong = st.items.map((it, i) => LS.ans[i] && LS.ans[i] !== it.a ? i : -1).filter(i => i >= 0);
    if (open) html = `Bitte entscheide dich bei ${open === 1 ? 'einer Regel' : open + ' Regeln'} noch für UND oder ODER.`;
    else if (wrong.length) html = `${wrong.length === 1 ? 'Eine Regel ist' : wrong.length + ' Regeln sind'} noch falsch zugeordnet (rot markiert).` + wrong.map(i => st.items[i].why ? '<br>' + st.items[i].why : '').join('');
    else ok = true;
  } else if (st.type === 'dragcond'){
    if (!S.slots.c1 || !S.slots.c2) html = `Ziehe in beide Felder von ${st.fn} eine Bedingung.`;
    else {
      const r = condCheck(`${st.fn}(${S.items[S.slots.c1].lit};${S.items[S.slots.c2].lit})`, {ref:st.ref}, condTests(st.tests));
      ok = !!r.ok; if (!ok) html = r.html ? r.err : esc(r.err);
    }
    S.success = ok;
  } else if (st.type === 'cond'){
    const tests = condTests(st.tests);
    let all = true;
    st.fields.forEach((f, i) => {
      const r = condCheck(LS.inputs[i], f, tests);
      if (r.ok){ LS.fieldOk[i] = true; delete LS.fieldErr[i]; }
      else { all = false; delete LS.fieldOk[i]; LS.fieldErr[i] = r.html ? r.err : esc(r.err); }
    });
    ok = all;
    if (!ok) html = 'Noch nicht ganz – sieh dir die Hinweise unter den Eingabefeldern an.';
  }
  if (ok){
    const erstmals = !learnDone.has(learnIdx);
    markStep();
    logSolved(erstmals);
    S.fb = {type:'ok', html:'<b>Richtig! 🎉</b>' + (st.after ? '<br>' + st.after : '') + (canNext() ? '<br>Weiter geht es mit „Weiter“.' : '')};
  } else S.fb = {type:'err', html};
  render();
}

function learnClick(e){
  const o = e.target.closest('[data-opt]');
  if (o){ const st = STEPS[learnIdx], i = +o.dataset.opt;
    if (Aufgaben.mehrfach(st)){ LS.sel.has(i) ? LS.sel.delete(i) : LS.sel.add(i); } else LS.sel = new Set([i]);
    LS.checked = false; S.fb = null; render(); return true; }
  const tc = e.target.closest('[data-tcell]');
  if (tc){ const k = tc.dataset.tcell; LS.vals[k] = LS.vals[k] === 'WAHR' ? 'FALSCH' : 'WAHR'; LS.wrong.delete(k); S.fb = null; render(); return true; }
  const cl = e.target.closest('[data-cls]');
  if (cl){ LS.ans[+cl.dataset.cls] = cl.dataset.v; LS.checked = false; S.fb = null; render(); return true; }
  return false;
}

/* ---------- Ereignisse (Formelbau: wennbau.js) ---------- */
document.addEventListener('input', e => {
  if (e.target.matches('.condin')){ const i = +e.target.dataset.f; LS.inputs[i] = e.target.value; delete LS.fieldOk[i]; delete LS.fieldErr[i]; e.target.classList.remove('ok', 'err'); e.target.nextElementSibling.textContent = ''; }
});
document.addEventListener('click', e => {
  if (mode === 'lernen' && LS && STEPS[learnIdx].type !== 'task' && learnClick(e)) return;
  const mg = e.target.closest('[data-mode-go]'); if (mg){ setMode(mg.dataset.modeGo); return; }
  const sp = e.target.closest('[data-step]'); if (sp){ gotoStep(+sp.dataset.step); return; }
  if (e.target.closest('[data-learnreset]')){ if (confirm('Den gesamten Lernfortschritt löschen und von vorne beginnen?')){ learnDone.clear(); gotoStep(0); } return; }
  navClick(e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.condin')){ e.preventDefault(); check(); }
});
$('#resetBtn').addEventListener('click', () => { if (mode === 'lernen' && STEPS[learnIdx].type !== 'task') loadStep(); else setup(); });
$('#prevBtn').addEventListener('click', () => { if (mode === 'lernen') gotoStep(learnIdx - 1); else gotoTask(pfadIdx - 1); });
if (mode === 'endlos') newEndless();
loadTask();
</script>
