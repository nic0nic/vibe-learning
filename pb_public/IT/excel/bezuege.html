<script id="tasks">
/* Zellbezüge: Aufgaben, Erklärung und Einstellungen; die Technik steckt in uebertragen.js (Aufbau dort oben) */
const KEY = 'bz-';
const OV_INTRO = '<p>Was passiert mit den Zellbezügen, wenn man eine Formel auf andere Zellen überträgt – und wann braucht man das $-Zeichen? Jedes Thema erklärt das an einem Beispiel, stellt dir ein paar Fragen – und dann schreibst du selbst Formeln. Am besten gehst du die Themen der Reihe nach durch.</p>';
const SYM4 = ['=', '+', '-', '*', '/', '(', ')', ':', ';', 'SUMME(', 'MITTELWERT('];
const AC_FN = [
  {n:'MITTELWERT', v:'Zahl', d:'Berechnet den Durchschnitt (das arithmetische Mittel) der Argumente.'},
  {n:'SUMME',      v:'Zahl', d:'Addiert alle Zahlen.'}
];
const NAMES = ['Mia', 'Ben', 'Lea', 'Tim', 'Emma', 'Noah', 'Lina', 'Paul', 'Zoe', 'Finn', 'Ella', 'Luca', 'Hanna', 'Jonas', 'Aylin', 'Elias'];
const ART = {Kopfhörer:'den', Handyhülle:'die', Ladekabel:'das', Maus:'die', Tastatur:'die', 'USB-Stick':'den', Lautsprecher:'den'};

/* ---- Aufgaben-Generatoren: gleiche Struktur, Zahlen je nach Zufallsstartwert ---- */
const GENS = {
  einkauf:{title:'Schulbedarf', make(r){
    const it = pickN(r, ['Hefte', 'Bleistifte', 'Lineale', 'Radiergummis', 'Ordner', 'Klebestifte', 'Collegeblöcke', 'Textmarker'], 5);
    const c = {A4:'Artikel', B4:'Menge', C4:'Einzelpreis', D4:'Gesamtpreis'}, fmt = {};
    it.forEach((x, i) => { const n = 5 + i; c['A' + n] = x; c['B' + n] = ri(r, 2, 12); c['C' + n] = rd(r, 0.5, 4.5, 2); fmt['C' + n] = 'eur'; });
    return {intro:'Die Klasse bestellt Schulbedarf für das neue Schuljahr.', cells:c, fmt, ffmt:'eur', fill:['D5', 'D9'], ref:'=B5*C5',
      what:`den Gesamtpreis für die ${it[0]} berechnet`};
  }},
  punkte:{title:'Sportfest', make(r){
    const nm = pickN(r, NAMES, 5), c = {A4:'Disziplin', A5:'Sprint', A6:'Weitsprung', A7:'Ballwurf', A8:'Gesamtpunkte'};
    cols('B', 5).forEach((L, i) => { c[L + 4] = nm[i]; [5, 6, 7].forEach(n => { c[L + n] = ri(r, 10, 60); }); });
    return {intro:'Beim Sportfest bekommt jedes Kind in drei Disziplinen Punkte.', cells:c, fill:['B8', 'F8'], ref:'=SUMME(B5:B7)',
      what:`die Gesamtpunkte von ${nm[0]} berechnet`};
  }},
  kurs:{title:'Urlaubsgeld in Dollar', make(r){
    const c = {A2:'Kurs: 1 € in Dollar', B2:rd(r, 1.05, 1.18, 2), A4:'Euro', A5:'Dollar'}, fmt = {};
    cols('B', 5).forEach(L => { c[L + 4] = ri(r, 2, 40) * 5; fmt[L + 4] = 'eur'; });
    return {intro:'Lena fährt in die USA und rechnet verschiedene Beträge von Euro in Dollar um. Der Kurs steht in B2.', cells:c, fmt, ffmt:'usd',
      fill:['B5', 'F5'], ref:'=B4*$B$2', what:'den Betrag aus B4 in Dollar umrechnet'};
  }},
  mwst:{title:'Mehrwertsteuer', make(r){
    const it = pickN(r, ['Kopfhörer', 'Handyhülle', 'Ladekabel', 'Maus', 'Tastatur', 'USB-Stick', 'Lautsprecher'], 5);
    const c = {A2:'Mehrwertsteuersatz', B2:pick1(r, [0.19, 0.07]), A4:'Artikel', B4:'Nettopreis', C4:'Mehrwertsteuer'}, fmt = {B2:'pct'};
    it.forEach((x, i) => { const n = 5 + i; c['A' + n] = x; c['B' + n] = rd(r, 5, 80, 2); fmt['B' + n] = 'eur'; });
    return {intro:'Ein Elektronikladen berechnet die Mehrwertsteuer: Nettopreis · Steuersatz. Der Steuersatz steht in B2.', cells:c, fmt, ffmt:'eur',
      fill:['C5', 'C9'], ref:'=B5*$B$2', what:`die Mehrwertsteuer für ${ART[it[0]]} ${it[0]} berechnet`};
  }},
  lohn:{title:'Ferienjob', make(r){
    const nm = pickN(r, NAMES, 5), c = {A2:'Stundenlohn', B2:pick1(r, [12, 12.5, 13, 13.5, 14]), A4:'Name', B4:'Stunden', C4:'Verdienst'}, fmt = {B2:'eur'};
    nm.forEach((x, i) => { c['A' + (5 + i)] = x; c['B' + (5 + i)] = ri(r, 3, 24); });
    return {intro:'Fünf Jugendliche helfen in den Ferien im Supermarkt. Alle bekommen denselben Stundenlohn (B2).', cells:c, fmt, ffmt:'eur',
      fill:['C5', 'C9'], ref:'=B5*$B$2', what:`den Verdienst von ${nm[0]} berechnet`};
  }},
  anteil:{title:'Umfrage: Lieblingsfach', make(r){
    const f = pickN(r, ['Sport', 'Mathe', 'Deutsch', 'Englisch', 'Kunst', 'Musik', 'IT', 'Biologie'], 5);
    const c = {A4:'Fach', B4:'Stimmen', C4:'Anteil', A10:'Gesamt', B10:'=SUMME(B5:B9)'};
    f.forEach((x, i) => { c['A' + (5 + i)] = x; c['B' + (5 + i)] = ri(r, 2, 12); });
    return {intro:'Die 7. Klassen haben ihr Lieblingsfach gewählt. In B10 steht, wie viele Stimmen es insgesamt gab.', cells:c, ffmt:'pct',
      fill:['C5', 'C9'], ref:'=B5/$B$10', what:`berechnet, welcher Anteil aller Stimmen auf ${f[0]} entfällt`};
  }},
  schnitt:{title:'Weitsprung', make(r){
    const nm = pickN(r, NAMES, 6), c = {A4:'Name', B4:'Weite (m)', C4:'Abweichung', A12:'Durchschnitt', B12:'=MITTELWERT(B5:B10)'};
    nm.forEach((x, i) => { c['A' + (5 + i)] = x; c['B' + (5 + i)] = rd(r, 2.4, 4.8, 2); });
    return {intro:'Im Sportunterricht wurde Weitsprung gemessen. In B12 steht die durchschnittliche Weite.', cells:c,
      fill:['C5', 'C10'], ref:'=B5-$B$12', what:`berechnet, um wie viele Meter ${nm[0]} über (+) oder unter (−) dem Durchschnitt liegt`};
  }},
  abweichung:{title:'Weitsprung ohne Durchschnitt', make(r){
    const nm = pickN(r, NAMES, 6), c = {A4:'Name', B4:'Weite (m)', C4:'Abweichung'};
    nm.forEach((x, i) => { c['A' + (5 + i)] = x; c['B' + (5 + i)] = rd(r, 2.4, 4.8, 2); });
    return {intro:'Im Sportunterricht wurde Weitsprung gemessen. Diesmal steht der Durchschnitt in keiner eigenen Zelle.', cells:c,
      fill:['C5', 'C10'], ref:'=B5-MITTELWERT($B$5:$B$10)', what:`mit MITTELWERT berechnet, um wie viele Meter ${nm[0]} über (+) oder unter (−) dem Durchschnitt aller sechs liegt`,
      tip:'Der Bereich für MITTELWERT soll beim Übertragen fest bleiben – nur die eigene Weite wandert mit.'};
  }},
  einmaleins:{title:'Einmaleins-Tabelle', make(r){
    const c = {A4:'·'}, s1 = ri(r, 2, 7), s2 = ri(r, 2, 7);
    cols('B', 5).forEach((L, i) => { c[L + 4] = s1 + i; });
    [5, 6, 7, 8, 9].forEach((n, i) => { c['A' + n] = s2 + i; });
    return {intro:'Die Tabelle soll das Ergebnis jeder Zahl aus Spalte A mal jeder Zahl aus Zeile 4 zeigen.', cells:c,
      fill:['B5', 'F9'], ref:'=$A5*B$4', what:'die Zahl aus Spalte A mit der Zahl aus Zeile 4 multipliziert'};
  }},
  eintritt:{title:'Eintrittspreise im Freibad', make(r){
    const c = {C3:'Anzahl Personen', A4:'Gruppe', B4:'Preis', A5:'Kinder', A6:'Jugendliche', A7:'Erwachsene', A8:'Senioren'}, fmt = {};
    cols('C', 5).forEach((L, i) => { c[L + 4] = i + 1; });
    [5, 6, 7, 8].forEach(n => { c['B' + n] = rd(r, 1.5, 6.5, 1); fmt['B' + n] = 'eur'; });
    return {intro:'Das Freibad möchte eine Preistabelle aushängen: Was kostet der Eintritt für 1, 2, 3 … Personen?', cells:c, fmt, ffmt:'eur',
      fill:['C5', 'G8'], ref:'=$B5*C$4', what:'berechnet, was der Eintritt für die Gruppe in dieser Zeile bei der Personenzahl aus Zeile 4 kostet'};
  }},
  zins:{title:'Zinsen auf dem Sparbuch', make(r){
    const c = {A3:'', B3:'Zinssatz', A4:'Betrag'}, fmt = {};
    const z = shuffle([0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04], r).slice(0, 4).sort((a, b) => a - b);
    cols('B', 4).forEach((L, i) => { c[L + 4] = z[i]; fmt[L + 4] = 'pct'; });
    [5, 6, 7, 8].forEach(n => { c['A' + n] = ri(r, 2, 40) * 50; fmt['A' + n] = 'eur'; });
    return {intro:'Wie viele Zinsen bringt ein Jahr auf dem Sparbuch? Das hängt vom Betrag (Spalte A) und vom Zinssatz (Zeile 4) ab.', cells:c, fmt, ffmt:'eur',
      fill:['B5', 'E8'], ref:'=$A5*B$4', what:'die Zinsen für den Betrag aus Spalte A beim Zinssatz aus Zeile 4 berechnet'};
  }},
  rabatt:{title:'Rabatte im Sportgeschäft', make(r){
    const c = {B3:'Rabatt', A4:'Preis'}, fmt = {};
    const z = shuffle([0.05, 0.1, 0.15, 0.2, 0.25, 0.3], r).slice(0, 4).sort((a, b) => a - b);
    cols('B', 4).forEach((L, i) => { c[L + 4] = z[i]; fmt[L + 4] = 'pct'; });
    [5, 6, 7, 8, 9].forEach(n => { c['A' + n] = ri(r, 3, 30) * 5 - 0.01; fmt['A' + n] = 'eur'; });
    return {intro:'Ein Sportgeschäft gibt verschiedene Rabatte. Die Tabelle soll zeigen, wie viel Euro man jeweils spart.', cells:c, fmt, ffmt:'eur',
      fill:['B5', 'E9'], ref:'=$A5*B$4', what:'berechnet, wie viel Euro man beim Preis aus Spalte A mit dem Rabatt aus Zeile 4 spart'};
  }},
  ausflug:{title:'Wahl des Ausflugsziels', make(r){
    const z = ['Freizeitpark', 'Kletterhalle', 'Museum', 'Zoo'], k = ['7a', '7b', '7c', '7d'];
    const c = {A4:'Ziel', A9:'Gesamt', A11:'Anteile'};
    cols('B', 4).forEach((L, i) => { c[L + 4] = k[i]; c[L + 11] = k[i]; [5, 6, 7, 8].forEach(n => { c[L + n] = ri(r, 1, 12); }); c[L + 9] = `=SUMME(${L}5:${L}8)`; });
    z.forEach((x, i) => { c['A' + (5 + i)] = x; c['A' + (12 + i)] = x; });
    return {intro:'Jede 7. Klasse hat über das Ausflugsziel abgestimmt. In Zeile 9 steht, wie viele Stimmen jede Klasse abgegeben hat.', cells:c, ffmt:'pct',
      fill:['B12', 'E15'], ref:'=B5/B$9', what:'berechnet, welcher Anteil der Stimmen der 7a auf den Freizeitpark entfällt',
      tip:'Jede Klasse hat ihr eigenes Gesamt in Zeile 9.'};
  }},
  wachstum:{title:'Pflanzen-Wachstum', make(r){
    const p = ['Bohne', 'Kresse', 'Sonnenblume', 'Mais'], c = {A4:'Höhe in cm', A10:'Zuwachs seit Woche 1'};
    cols('B', 5).forEach((L, i) => { c[L + 4] = `Woche ${i + 1}`; });
    cols('C', 4).forEach((L, i) => { c[L + 10] = `Woche ${i + 2}`; });
    p.forEach((x, i) => { const n = 5 + i; c['A' + n] = x; c['A' + (11 + i)] = x; let h = rd(r, 1, 4, 1);
      cols('B', 5).forEach(L => { c[L + n] = h; h = +(h + rd(r, 0.5, 4, 1)).toFixed(1); }); });
    return {intro:'Die Klasse misst jede Woche, wie hoch ihre Pflanzen sind.', cells:c,
      fill:['C11', 'F14'], ref:'=C5-$B5', what:'berechnet, um wie viele Zentimeter die Bohne seit Woche 1 gewachsen ist',
      tip:'Woche 1 steht für jede Pflanze in Spalte B.'};
  }},
  kiosk:{title:'Kiosk-Umsatz', make(r){
    const it = ['Brezeln', 'Wasser', 'Äpfel', 'Müsliriegel'], d = ['Mo', 'Di', 'Mi', 'Do'];
    const c = {A4:'Umsatz', A9:'Gesamt', B9:'=SUMME(B5:E8)', A11:'Anteil am Gesamtumsatz'}, fmt = {B9:'eur'};
    cols('B', 4).forEach((L, i) => { c[L + 4] = d[i]; c[L + 11] = d[i]; [5, 6, 7, 8].forEach(n => { c[L + n] = rd(r, 8, 60, 2); fmt[L + n] = 'eur'; }); });
    it.forEach((x, i) => { c['A' + (5 + i)] = x; c['A' + (12 + i)] = x; });
    return {intro:'Der Schulkiosk hat vier Tage lang den Umsatz notiert. In B9 steht der Umsatz aller Tage zusammen.', cells:c, fmt, ffmt:'pct',
      fill:['B12', 'E15'], ref:'=B5/$B$9', what:'berechnet, welchen Anteil die Brezeln am Montag am Gesamtumsatz haben'};
  }},
  sparschwein:{title:'Sparschwein', make(r){
    const m = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni'], c = {A4:'Monat', B4:'Eingezahlt', C4:'Gespart insgesamt'}, fmt = {};
    m.forEach((x, i) => { c['A' + (5 + i)] = x; c['B' + (5 + i)] = ri(r, 1, 8) * 5; fmt['B' + (5 + i)] = 'eur'; });
    return {intro:'Ben zahlt jeden Monat Geld in sein Sparschwein ein.', cells:c, fmt, ffmt:'eur',
      fill:['C5', 'C10'], ref:'=SUMME($B$5:B5)', what:'mit SUMME berechnet, wie viel bis zu diesem Monat insgesamt im Sparschwein ist',
      tip:'Der Bereich beginnt immer bei B5 – nur das Ende soll mitwandern.'};
  }},
  sparplan:{title:'Taschengeld-Sparplan', make(r){
    const nm = pickN(r, NAMES, 4), m = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai'], c = {A4:'Eingezahlt', A10:'Gespart bis dahin'}, fmt = {};
    cols('B', 5).forEach((L, i) => { c[L + 4] = m[i]; c[L + 10] = m[i]; nm.forEach((_, j) => { c[L + (5 + j)] = ri(r, 1, 6) * 5; fmt[L + (5 + j)] = 'eur'; }); });
    nm.forEach((x, j) => { c['A' + (5 + j)] = x; c['A' + (11 + j)] = x; });
    return {intro:'Vier Kinder sparen einen Teil ihres Taschengelds. Oben steht, was sie jeden Monat einzahlen.', cells:c, fmt, ffmt:'eur',
      fill:['B11', 'F14'], ref:'=SUMME($B5:B5)', what:`mit SUMME berechnet, wie viel ${nm[0]} bis zu diesem Monat insgesamt gespart hat`,
      tip:'Jede Summe beginnt im Januar (Spalte B) – aber in der Zeile des jeweiligen Kindes.'};
  }},
  brutto:{title:'Preisliste mit Mehrwertsteuer', make(r){
    const it = pickN(r, ['Kopfhörer', 'Handyhülle', 'Ladekabel', 'Maus', 'USB-Stick', 'Tastatur'], 4);
    const c = {A2:'Mehrwertsteuersatz', B2:0.19, C3:'Anzahl', A4:'Artikel', B4:'Nettopreis'}, fmt = {B2:'pct'};
    cols('C', 4).forEach((L, i) => { c[L + 4] = i + 1; });
    it.forEach((x, j) => { c['A' + (5 + j)] = x; c['B' + (5 + j)] = rd(r, 4, 40, 2); fmt['B' + (5 + j)] = 'eur'; });
    return {intro:'Der Elektronikladen druckt eine Preisliste: Was kosten 1, 2, 3 oder 4 Stück mit Mehrwertsteuer? Bruttopreis = Nettopreis · Anzahl · (1 + Steuersatz).', cells:c, fmt, ffmt:'eur',
      fill:['C5', 'F8'], ref:'=$B5*C$4*(1+$B$2)', what:'den Bruttopreis für den Artikel in dieser Zeile und die Anzahl aus Zeile 4 berechnet'};
  }},
  temperatur:{title:'Temperaturen im Vergleich', make(r){
    const st = pickN(r, ['München', 'Hamburg', 'Berlin', 'Köln', 'Nürnberg', 'Dresden'], 4), d = ['Mo', 'Di', 'Mi', 'Do'];
    const c = {A4:'°C', A9:'Mittelwert', A11:'Abweichung vom Mittelwert'};
    cols('B', 4).forEach((L, i) => { c[L + 4] = d[i]; c[L + 11] = d[i]; c[L + 9] = `=MITTELWERT(${L}5:${L}8)`; st.forEach((_, j) => { c[L + (5 + j)] = ri(r, -2, 24); }); });
    st.forEach((x, j) => { c['A' + (5 + j)] = x; c['A' + (12 + j)] = x; });
    return {intro:'Mittags wurde in vier Städten die Temperatur gemessen. In Zeile 9 steht der Mittelwert jedes Tages.', cells:c,
      fill:['B12', 'E15'], ref:'=B5-B$9', what:`berechnet, um wie viel Grad die Temperatur in ${st[0]} am Montag vom Mittelwert des Tages abweicht`};
  }}
};

const GROUPS = [null, 'Mitwandern oder ganz festhalten ($B$2)', 'Nur Spalte oder nur Zeile festhalten ($A5, B$4)', 'Mehrere $ in einer Formel'];
// [Generator, Zufallsstartwert, Gruppe]
const STD = [
  ['einkauf', 11, 1], ['punkte', 12, 1], ['kurs', 13, 1], ['lohn', 14, 1], ['mwst', 15, 1], ['anteil', 16, 1], ['schnitt', 17, 1],
  ['einmaleins', 21, 2], ['eintritt', 22, 2], ['zins', 23, 2], ['rabatt', 24, 2], ['ausflug', 25, 2], ['wachstum', 26, 2], ['kiosk', 27, 2],
  ['sparschwein', 31, 3], ['sparplan', 32, 3], ['brutto', 33, 3], ['temperatur', 34, 3],
  // neue Aufgaben nur hinten anhängen: der Fortschritt hängt an der Nummer
  ['abweichung', 35, 3]
];

const HILFE = `<details class="help"><summary>Hilfe: Was bewirkt das $?</summary>
<table class="dl"><tr><th>Bezug</th><th>beim Übertragen nach rechts</th><th>beim Übertragen nach unten</th></tr>
<tr><td>B5</td><td>Spalte wandert mit</td><td>Zeile wandert mit</td></tr>
<tr><td>$B$5</td><td>bleibt B</td><td>bleibt 5</td></tr>
<tr><td>$B5</td><td>bleibt B</td><td>Zeile wandert mit</td></tr>
<tr><td>B$5</td><td>Spalte wandert mit</td><td>bleibt 5</td></tr></table>
<p>Merke: Das $ hält fest, was direkt dahinter steht – den Buchstaben (Spalte) oder die Zahl (Zeile).</p>
<p>Setze den Cursor in einen Bezug und drücke <b>F4</b> (oder den Knopf <code>$ F4</code>): B5 → $B$5 → B$5 → $B5 → B5.</p></details>`;

/* ---- Erklärung: Themen mit Schritten ---- */
const TOPICS = [
  {id:'kopieren', name:'Formeln übertragen', desc:'Was passiert mit B5, wenn man eine Formel nach unten oder rechts überträgt? (relative Bezüge)', steps:[
    {type:'info', title:'Einmal schreiben, oft verwenden', sheet:{gid:'einkauf', seed:11, formula:'=B5*C5', sel:'D5'}, html:`
      <p>In Excel schreibt man eine Formel nur <b>einmal</b> und überträgt sie dann auf die anderen Zellen – zum Beispiel mit dem kleinen Ausfüllkästchen unten rechts an der Zelle oder mit Kopieren und Einfügen.</p>
      <p>In D5 steht <code>=B5*C5</code>. Diese Formel wurde nach unten bis D9 übertragen.</p>
      <p><b>Klicke in der Tabelle auf D6, D7, D8 …</b> und sieh dir oben an, welche Formel dort steht.</p>`},
    {type:'info', title:'Excel passt die Bezüge an', sheet:{gid:'einkauf', seed:11, formula:'=B5*C5', sel:'D8'}, html:`
      <p>Excel hat die Formel beim Übertragen <b>angepasst</b>: In D6 steht <code>=B6*C6</code>, in D8 steht <code>=B8*C8</code>.</p>
      <ul><li>Überträgt man eine Formel <b>nach unten</b>, wird die <b>Zeilennummer</b> größer: B5 → B6 → B7 …</li>
      <li>Überträgt man sie <b>nach rechts</b>, rückt der <b>Spaltenbuchstabe</b> weiter: B5 → C5 → D5 …</li></ul>
      <p>Solche Bezüge heißen <b>relative Bezüge</b>: Sie wandern mit. Das ist meistens genau richtig – jede Zeile rechnet mit ihren eigenen Werten.</p>`},
    {type:'choice', title:'Frage: nach unten', mono:true, html:'<p>In D5 steht <code>=B5*C5</code>. Die Formel wird nach unten übertragen. Was steht dann in <b>D9</b>?</p>',
      options:['=B5*C5', '=B9*C9', '=B9*C5', '=D9*D9'], correct:[1],
      why:{0:'Dann würde jede Zeile mit den Werten aus Zeile 5 rechnen. Excel passt die Zeilennummer an.', 2:'Beide Bezüge sind relativ – beide wandern mit.', 3:'Die Spalten bleiben gleich, wenn man nach unten überträgt. Nur die Zeilennummer ändert sich.'},
      after:'Von Zeile 5 nach Zeile 9 sind es 4 Zeilen – also wird aus B5 → B9 und aus C5 → C9.'},
    {type:'choice', title:'Frage: nach rechts', mono:true, html:'<p>In B8 steht <code>=SUMME(B5:B7)</code>. Die Formel wird nach rechts bis F8 übertragen. Was steht dann in <b>D8</b>?</p>',
      options:['=SUMME(B5:B7)', '=SUMME(D5:D7)', '=SUMME(B7:B9)', '=SUMME(D8:D10)'], correct:[1],
      why:{0:'Dann würde jede Spalte die Punkte aus Spalte B zusammenzählen.', 2:'Nach rechts ändern sich die Buchstaben, nicht die Zeilennummern.', 3:'Die Zeilennummern bleiben gleich, wenn man nach rechts überträgt.'},
      after:'Nach rechts rücken die Buchstaben weiter: B → C → D. Die Zeilen 5 bis 7 bleiben.'},
    {type:'task', title:'Probiere es aus: nach unten', task:['einkauf', 11, 2], html:'<p>Jetzt du: Wähle die Zellen für die Formel in D5 aus. Der Trainer überträgt sie dann bis D9 – so wie Excel.</p>'},
    {type:'task', title:'Probiere es aus: nach rechts', task:['punkte', 12, 5], final:true, html:'<p>Diesmal schreibst du die ganze Formel selbst – und sie wird nach rechts übertragen.</p>'}
  ]},
  {id:'absolut', name:'Feste Bezüge: $B$2', desc:'Wenn alle Zeilen dieselbe Zelle brauchen – zum Beispiel einen Kurs oder Steuersatz.', steps:[
    {type:'info', title:'Das Problem', sheet:{gid:'kurs', seed:13, formula:'=B4*B2', sel:'C5'}, html:`
      <p>Lena rechnet Euro in Dollar um. In B5 steht <code>=B4*B2</code> – das stimmt. Nach dem Übertragen nach rechts kommt aber in C5 bis F5 <b>0</b> heraus.</p>
      <p><b>Klicke auf C5 und D5.</b> Was ist mit B2 passiert?</p>`},
    {type:'info', title:'Die Lösung: das $-Zeichen', sheet:{gid:'kurs', seed:13, formula:'=B4*$B$2', sel:'D5'}, html:`
      <p>Aus B2 wurde beim Übertragen C2, D2, E2 … – und dort steht nichts. Der Kurs steht aber nur in <b>B2</b>.</p>
      <p>Mit einem <b>$</b> hält man einen Teil des Bezugs fest: <code>$B$2</code> bleibt beim Übertragen immer B2. Das nennt man einen <b>absoluten Bezug</b>.</p>
      <p>In B5 steht jetzt <code>=B4*$B$2</code>. Klicke auf C5, D5 …: B4 wandert mit, $B$2 bleibt.</p>
      <p>Tipp: Setze den Cursor in einen Bezug und drücke <b>F4</b> – dann setzt Excel die $-Zeichen für dich.</p>`},
    {type:'choice', title:'Frage: Welche Formel?', mono:true, html:'<p>Welche Formel in B5 kann man richtig nach rechts übertragen? Der Kurs steht in B2, die Euro-Beträge in Zeile 4.</p>',
      options:['=B4*B2', '=B4*$B$2', '=$B$4*$B$2', '=$B$4*B2'], correct:[1],
      why:{0:'Aus B2 wird beim Übertragen C2, D2 … – dort steht kein Kurs.', 2:'Mit $B$4 rechnet jede Spalte mit dem Betrag aus B4. Der Betrag soll aber mitwandern.', 3:'Genau falsch herum: Der Betrag soll mitwandern, der Kurs soll fest bleiben.'}},
    {type:'choice', title:'Frage: nach unten', mono:true, html:'<p>In C5 steht <code>=B5*$B$2</code>. Die Formel wird nach unten übertragen. Was steht dann in <b>C8</b>?</p>',
      options:['=B8*$B$2', '=B8*$B$5', '=B5*$B$2', '=C8*$C$2'], correct:[0],
      why:{1:'$B$2 bleibt immer B2 – das $ vor der 2 hält die Zeile fest.', 2:'B5 hat kein $, also wandert es mit.', 3:'Nach unten bleiben die Buchstaben gleich.'}},
    {type:'task', title:'$ setzen', task:['kurs', 13, 1], html:'<p>Setze die $-Zeichen in die Formel. Tipp: Klicke in den Bezug und drücke F4 oder den Knopf <code>$ F4</code>.</p>'},
    {type:'task', title:'Zellen auswählen', task:['lohn', 14, 2], html:'<p>Jetzt wählst du die Zellen selbst aus und setzt die $-Zeichen.</p>'},
    {type:'task', title:'Anteile berechnen', task:['anteil', 16, 5], final:true, html:'<p>Jetzt schreibst du die ganze Formel selbst. Auch für Anteile braucht man einen festen Bezug: Jede Zeile teilt durch dieselbe Gesamtzahl.</p>'}
  ]},
  {id:'gemischt', name:'Nur Spalte oder Zeile fest', desc:'$A5 und B$4: wenn eine Formel nach rechts und nach unten übertragen wird.', steps:[
    {type:'info', title:'Eine Tabelle in zwei Richtungen', sheet:{gid:'einmaleins', seed:21, formula:'=$A5*B$4', sel:'D7'}, html:`
      <p>In der Einmaleins-Tabelle wird eine Formel nach rechts <b>und</b> nach unten übertragen. In B5 steht <code>=$A5*B$4</code>.</p>
      <ul><li><code>$A5</code>: Das $ steht vor dem <b>A</b> – die <b>Spalte</b> bleibt immer A, die Zeile wandert mit.</li>
      <li><code>B$4</code>: Das $ steht vor der <b>4</b> – die <b>Zeile</b> bleibt immer 4, die Spalte wandert mit.</li></ul>
      <p><b>Klicke auf verschiedene Zellen der Tabelle</b> und vergleiche die Formeln.</p>`},
    {type:'choice', title:'Frage: Was wird daraus?', mono:true, html:'<p>In B5 steht <code>=$A5*B$4</code>. Was steht nach dem Übertragen in <b>D7</b>?</p>',
      options:['=$A7*D$4', '=$A5*D$4', '=$A7*B$4', '=$C7*D$6'], correct:[0],
      why:{1:'Bei $A5 steht kein $ vor der 5 – die Zeile wandert also mit.', 2:'Bei B$4 steht kein $ vor dem B – die Spalte wandert also mit.', 3:'Das $ vor dem A hält die Spalte fest, das $ vor der 4 die Zeile.'}},
    {type:'choice', title:'Frage: Wohin das $?', mono:true, html:'<p>Die Formel soll nach rechts und nach unten übertragen werden. Ein Wert steht in Spalte A, jede Zeile hat ihren eigenen Wert. Wie muss der Bezug in Zeile 5 aussehen?</p>',
      options:['$A5', 'A$5', '$A$5', 'A5'], correct:[0],
      why:{1:'A$5 hält die Zeile fest – dann würde jede Zeile den Wert aus Zeile 5 nehmen.', 2:'$A$5 hält beides fest – dann rechnet jede Zeile mit dem Wert aus A5.', 3:'Ohne $ wandert beim Übertragen nach rechts auch die Spalte A mit (B, C, D …).'}},
    {type:'task', title:'$ setzen', task:['einmaleins', 21, 1], html:'<p>Setze die $-Zeichen so, dass die Formel im ganzen Bereich stimmt.</p>'},
    {type:'task', title:'Zellen auswählen', task:['eintritt', 22, 2], html:'<p>Wähle die Zellen aus und setze die $-Zeichen.</p>'},
    {type:'task', title:'Nur die Zeile festhalten', task:['ausflug', 25, 5], final:true, html:'<p>Jetzt schreibst du die ganze Formel selbst. Hier hat jede Klasse ihr eigenes Gesamt – welcher Teil des Bezugs muss also fest bleiben?</p>'}
  ]}
];
</script>
