<title>NICHT – Bedingungen umdrehen – vibe learning</title>
<!--
  Die Funktion NICHT in Excel, Aufhänger: Eine WENN-Formel mit UND lässt sich „von der anderen Seite“ mit ODER schreiben
  (UND ↔ ODER, jede Bedingung ins Gegenteil, Dann_Wert und Sonst_Wert tauschen).
  Modus Erarbeitung: Erklärungen, Aufgaben und Übung mit lib/aufgaben.js (Aufgaben.sequenz), am Ende ein Blitz-Training
    (Aufgaben.training): UND oder ODER in der gleichwertigen Formel wählen, Stufen „Umdrehen“ und „Mit NICHT“,
    Schalter „Auf Zeit“ (eigene Bestleistung über training.variante).
  Modus Endlos: Formel umdrehen bzw. ohne NICHT schreiben, 9 Stufen wie bei UND/ODER (wennbau.js: Bausteine → Freitext),
    Sachaufgaben aus uo-szenarien.js. Geprüft wird, ob die Formel immer dasselbe liefert, dazu umgedreht (andere
    Verknüpfung) bzw. ohne NICHT (CUR.muss).
  Gespeichert: nicht-stand = {schritt, erledigt}, nicht-blitz-training = {stufe, best}, nicht-zeit = '1' (Schalter an),
    nicht-mode, nicht-level, nicht-best (basis.js).
-->

<!-- ===================== Erarbeitung (lib/aufgaben.js) ===================== -->
<script>
'use strict';
const F = s => `<code class="fx">${esc(s)}</code>`;                                  // Formel im Fließtext
const FB = (...z) => `<div class="fxblock">${z.map(F).join('')}</div>`;               // Formeln untereinander
const LT = s => '<code class="fx">' + s.split(/(\[\[.*?\]\])/).map((t, i) => i % 2 ? t : esc(t)).join('') + '</code>';   // Lückentext-Formel

/* ---------- Blitz-Training: UND oder ODER? ---------- */
const GEGEN = {'<':'>=', '>=':'<', '>':'<=', '<=':'>', '=':'<>', '<>':'='};
const ANDERE = {UND:'ODER', ODER:'UND'};
const BL_OPS = Object.keys(GEGEN);
const BL_TEXTE = ['"ja"', '"nein"', '"bezahlt"', '"Gold"', '"Bayern"', '"rot"', '"Mitglied"'];
const BL_ERG = [['"ja"', '"nein"'], ['"Rabatt"', '"kein Rabatt"'], ['"bestanden"', '"nicht bestanden"'], ['0', '4,90'],
  ['"frei"', '"Gebühr"'], ['"Bonus"', '"kein Bonus"'], ['"darf rein"', '"darf nicht rein"'], ['10%', '0%']];
const zufall = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const eins = l => l[zufall(0, l.length - 1)];
function blBedingungen(){
  const n = Math.random() < 0.75 ? 2 : 3, zellen = Aufgaben.mischen(['B2', 'C2', 'D2', 'E2']).slice(0, n).sort();
  return zellen.map(z => Math.random() < 0.65
    ? {z, op:eins(BL_OPS), v:String(eins([zufall(1, 6), zufall(2, 20) * 5, zufall(12, 21), zufall(1, 10) * 100]))}
    : {z, op:eins(['=', '=', '<>']), v:eins(BL_TEXTE)});
}
const blTxt = b => b.z + b.op + b.v, blNeg = b => ({...b, op:GEGEN[b.op]});
const LUECKE = '\u0000';
const blZeig = s => esc(s).replace(LUECKE, '<span class="blank">?</span>');
let blZuletzt = '';
function blAufgabe(arten){
  return () => {
    let f, c, r, art;
    do { f = eins(['UND', 'ODER']); c = blBedingungen(); r = eins(BL_ERG); art = eins(arten); } while (art + f === blZuletzt && Math.random() < 0.6);
    blZuletzt = art + f;
    const [x, y] = r, g = ANDERE[f], orig = `=WENN(${f}(${c.map(blTxt).join(';')});${x};${y})`;
    const um = Aufgaben.mischen(c.slice());
    const V = {   // Formel mit Lücke, richtige Funktion, Begründung
      um:    [`=WENN(${LUECKE}(${c.map(blNeg).map(blTxt).join(';')});${y};${x})`, g, 'Bedingungen umgedreht, Dann/Sonst getauscht'],
      gleich:[`=WENN(${LUECKE}(${um.map(blTxt).join(';')});${x};${y})`, f, 'nichts umgedreht, nur andere Reihenfolge'],
      aussen:[`=WENN(NICHT(${LUECKE}(${um.map(blTxt).join(';')}));${y};${x})`, f, 'NICHT außen, dafür Dann/Sonst getauscht'],
      beides:[`=WENN(NICHT(${LUECKE}(${c.map(blNeg).map(blTxt).join(';')}));${x};${y})`, g, 'NICHT außen und jede Bedingung umgedreht'],
      jede:  [`=WENN(${LUECKE}(${c.map(b => 'NICHT(' + blTxt(b) + ')').join(';')});${y};${x})`, g, 'jede Bedingung mit NICHT umgedreht, Dann/Sonst getauscht']
    }[art];
    return {
      frage:`<div class="ef"><span class="el">Diese Formel …</span><code>${esc(orig)}</code><span class="el">… liefert immer dasselbe wie:</span><code>${blZeig(V[0])}</code></div>`,
      loesung:`${V[1]} (${V[2]})`,
      optionen:[{t:'UND', ok:V[1] === 'UND'}, {t:'ODER', ok:V[1] === 'ODER'}]
    };
  };
}
/* Schalter „Auf Zeit“: setzt die Zeit in beiden Stufen, eigene Bestleistung */
const ZEIT = {start:12, schritt:-0.2, min:5}, ZEIT_KEY = 'nicht-zeit';
let aufZeit = false; try { aufZeit = localStorage.getItem(ZEIT_KEY) === '1'; } catch (e) {}
const BL_STUFEN = [
  {name:'Umdrehen', antwort:'mc', neu:blAufgabe(['um', 'um', 'um', 'gleich', 'gleich'])},
  {name:'Mit NICHT', antwort:'mc', neu:blAufgabe(['um', 'gleich', 'aussen', 'aussen', 'beides', 'beides', 'jede', 'jede'])}];
const zeitSetzen = () => BL_STUFEN.forEach(s => { s.zeit = aufZeit ? ZEIT : null; });
zeitSetzen();
function zeitBauen(el){
  const box = el.querySelector('.zeitbox'); if (!box) return;
  const zeigen = () => { box.innerHTML = `<div class="zeitschalter"><button type="button" class="sys" role="switch" aria-checked="${aufZeit}"><span class="knopf"></span>⏱ Auf Zeit</button><span class="muted">${aufZeit ? 'Der Balken läuft ab – mit jeder richtigen Antwort etwas schneller.' : 'Ohne Zeitdruck.'}</span></div>`; };
  box.addEventListener('click', e => {
    if (!e.target.closest('.sys')) return;
    aufZeit = !aufZeit; zeitSetzen();
    try { localStorage.setItem(ZEIT_KEY, aufZeit ? '1' : '0'); } catch (e) {}
    if (window.TrainerSync) TrainerSync.changed();
    zeigen(); box.querySelector('.sys').focus();
    const tr = el.querySelector('.af-training'); if (tr) tr.dispatchEvent(new Event('af-variante'));
  });
  zeigen();
}

/* ---------- Schritte der Erarbeitung ---------- */
const RABATT = '=WENN(UND(B2<18;C2="ja");"Rabatt";"kein Rabatt")', LEA = '=WENN(ODER(B2>=18;C2<>"ja");"kein Rabatt";"Rabatt")';
let lernGebaut = false;
function lernBauen(){
  if (lernGebaut) return; lernGebaut = true;
  Aufgaben.sequenz({el:'#lern', key:'nicht', schritte:[
  {id:'info', kurz:'Einstieg', html:`<h2>Zwei Formeln – dasselbe Ergebnis?</h2>
    <p>Im Freibad gibt es einen Schülerrabatt: Wer <b>jünger als 18</b> ist <b>und</b> einen <b>Schülerausweis</b> hat, zahlt weniger. In Spalte B steht das Alter, in Spalte C, ob ein Ausweis da ist („ja“ oder „nein“).</p>
    <p>Tim schreibt die Formel so, wie die Regel klingt:</p>${FB(RABATT)}
    <p>Lea denkt von der anderen Seite: <i>„Wann gibt es <b>keinen</b> Rabatt? Wenn jemand 18 oder älter ist <b>oder</b> keinen Ausweis hat.“</i></p>${FB(LEA)}
    <div class="info"><p>Die beiden Formeln sehen ganz verschieden aus: UND gegen ODER, andere Vergleichszeichen, Dann_Wert und Sonst_Wert vertauscht. Liefern sie trotzdem immer dasselbe? Das prüfst du jetzt.</p></div>`},
  {id:'e1', kurz:'1 Vergleich', erinnerung:`<p>Tim: ${F(RABATT)}<br>Lea: ${F(LEA)}</p>`, aufgaben:[
    {typ:'wahrheit', nr:'1.1', frage:'Ergänze, was die beiden Prüfungen für jede Person ergeben.', werte:['WAHR', 'FALSCH'],
      spalten:['Person', 'Alter (B2)', 'Ausweis (C2)', esc('UND(B2<18;C2="ja")'), esc('ODER(B2>=18;C2<>"ja")')],
      zeilen:[['Mia', 15, 'ja', {l:true}, {l:false}], ['Tom', 17, 'nein', {l:false}, {l:true}], ['Ali', 18, 'ja', {l:false}, {l:true}], ['Eva', 20, 'nein', {l:false}, {l:true}]],
      hinweise:{3:'UND ist nur WAHR, wenn beide Bedingungen stimmen. Ali ist 18 – ist 18 kleiner als 18?', 4:'ODER ist schon WAHR, wenn eine Bedingung stimmt.'}},
    {typ:'mc', nr:'1.2', frage:'Was fällt dir in der Tabelle auf?', options:['Wo die UND-Prüfung WAHR ist, ist die ODER-Prüfung FALSCH – und umgekehrt.', 'Beide Prüfungen ergeben immer dasselbe.', 'Die ODER-Prüfung ist immer WAHR.'], correct:[0],
      why:{1:'Schau dir Mia an: einmal WAHR, einmal FALSCH.', 2:'Bei Mia ist sie FALSCH.'}},
    {typ:'wahrheit', nr:'1.3', frage:'Was zeigen die beiden Formeln an?', werte:['Rabatt', 'kein Rabatt'],
      spalten:['Person', 'Alter', 'Ausweis', 'Tims Formel', 'Leas Formel'],
      zeilen:[['Mia', 15, 'ja', {l:true}, {l:true}], ['Tom', 17, 'nein', {l:false}, {l:false}], ['Ali', 18, 'ja', {l:false}, {l:false}], ['Eva', 20, 'nein', {l:false}, {l:false}]],
      hinweise:{4:'Bei Lea steht „kein Rabatt“ vorne: Ist ihre Prüfung WAHR, gibt es keinen Rabatt.'},
      ok:'Genau: Die Prüfung ist genau umgekehrt – und weil Lea auch Dann_Wert und Sonst_Wert vertauscht hat, kommt dasselbe heraus.'}]},
  {id:'nicht', kurz:'NICHT', html:`<h2>Die Funktion NICHT</h2>
    <p>Leas Trick ist: <b>alles umdrehen</b>. Dafür hat Excel eine eigene Funktion. <b>NICHT</b> dreht einen Wahrheitswert um:</p>
    <table class="gegen"><tr><th>Prüfung</th><th>NICHT(Prüfung)</th></tr><tr><td>WAHR</td><td>FALSCH</td></tr><tr><td>FALSCH</td><td>WAHR</td></tr></table>
    <div class="merk"><div class="mt">Aufbau</div><p>${F('=NICHT(Prüfung)')}</p><p>Beispiel mit B2 = 15:</p>${FB('=NICHT(B2<18)')}<p>B2&lt;18 ist WAHR, also liefert die Formel FALSCH.</p></div>
    <p>Meist steht NICHT als Prüfung in einer WENN-Funktion. Wer <b>keinen</b> Ausweis hat, zahlt den vollen Preis:</p>${FB('=WENN(NICHT(C2="ja");"voller Preis";"Ausweis da")')}
    <p>Oft kommt man auch ohne NICHT aus, mit dem <b>Gegenteil</b> der Bedingung:</p>
    <table class="gegen"><tr><th>Bedingung</th><th>NICHT(…) ist dasselbe wie</th></tr>
      <tr><td>B2&lt;18</td><td>B2&gt;=18</td></tr><tr><td>B2&gt;18</td><td>B2&lt;=18</td></tr><tr><td>B2&lt;=18</td><td>B2&gt;18</td></tr><tr><td>B2&gt;=18</td><td>B2&lt;18</td></tr>
      <tr><td>C2="ja"</td><td>C2&lt;&gt;"ja"</td></tr><tr><td>C2&lt;&gt;"ja"</td><td>C2="ja"</td></tr></table>
    <div class="info"><p><b>Achtung:</b> Das Gegenteil von ${F('B2<18')} ist ${F('B2>=18')}, nicht ${F('B2>18')}. Wer genau 18 ist, ist nicht jünger als 18 – die 18 gehört zum Gegenteil dazu.</p></div>`},
  {id:'e2', kurz:'2 NICHT', erinnerung:`<p>${F('NICHT')} dreht WAHR und FALSCH um. Gegenteile: &lt; ↔ &gt;=, &gt; ↔ &lt;=, = ↔ &lt;&gt;</p>`, aufgaben:[
    {typ:'wahrheit', nr:'2.1', frage:'Was ergeben die Prüfungen?', werte:['WAHR', 'FALSCH'],
      spalten:['B2', esc('B2>=50'), esc('NICHT(B2>=50)'), esc('NICHT(B2<50)')],
      zeilen:[[30, false, {l:true}, {l:false}], [50, true, {l:false}, {l:true}], [80, true, {l:false}, {l:true}]],
      hinweise:{2:'NICHT dreht den Wert aus der Spalte davor um.', 3:'Prüfe zuerst B2<50 und drehe das Ergebnis dann um.'}},
    {typ:'zuordnen', nr:'2.2', frage:'Ordne jeder Formel die Bedingung zu, die dasselbe bedeutet.',
      felder:[['a', F('B2>=18')], ['b', F('B2>18')], ['c', F('B2<=50')], ['d', F('C2<>"ja"')], ['e', F('D2="Gold"')]],
      karten:[{t:F('NICHT(B2<18)'), z:'a'}, {t:F('NICHT(B2<=18)'), z:'b'}, {t:F('NICHT(B2>50)'), z:'c'}, {t:F('NICHT(C2="ja")'), z:'d'}, {t:F('NICHT(D2<>"Gold")'), z:'e'}]},
    {typ:'mc', nr:'2.3', frage:`Welche Formel liefert dasselbe wie ${F('=WENN(NICHT(B2<18);"Erwachsen";"Kind")')}?`, mono:true,
      options:['=WENN(B2<18;"Kind";"Erwachsen")', '=WENN(B2<18;"Erwachsen";"Kind")', '=WENN(B2>18;"Erwachsen";"Kind")', '=WENN(NICHT(B2>=18);"Erwachsen";"Kind")'], correct:[0],
      why:{1:'Ohne NICHT ist die Prüfung umgekehrt – dann müssen Dann_Wert und Sonst_Wert die Plätze tauschen.', 2:'Wer genau 18 ist, bekäme hier „Kind“.', 3:'NICHT(B2>=18) ist dasselbe wie B2<18 – genau umgekehrt.'},
      after:'Statt NICHT kann man auch Dann_Wert und Sonst_Wert tauschen.'}]},
  {id:'regel', kurz:'Umdrehen', html:`<h2>NICHT vor UND und ODER</h2>

    ${FB('NICHT(UND(B2<18;C2="ja"))', 'ODER(NICHT(B2<18);NICHT(C2="ja"))', 'ODER(B2>=18;C2<>"ja")')}

<!-- ===================== Endlos: Formeln umdrehen (wennbau.js) ===================== -->
<script>
'use strict';
const KEY = 'nicht-';
const LEVELS = WB_LEVELS;
const STD = [];   // keine festen Übungen, nur Erarbeitung und Endlos
function logSolved(erstmals){
  if (window.TrainerSync) TrainerSync.event({modus:'endlos', stufe:level, aufgabe:CUR.scen, titel:'Umdrehen: ' + CUR.scen, gesamt:0, erstmals});
}
let mode = load('mode') === 'endlos' ? 'endlos' : 'lernen';
let level = Math.min(9, Math.max(1, parseInt(load('level')) || 1));
let pfadIdx = 0, solved = {};
let endScen = null, endSeed = 0, endCounted = false, streak = 0, best = parseInt(load('best')) || 0;
let CUR, S, uid = 0, poolSeed = rand(), pickerOpen = false;

/* Aufgabe: Formel aus einem Szenario umdrehen bzw. ohne NICHT schreiben
   um      gegeben F(a;b);x;y            gesucht G(¬a;¬b);y;x   (muss: Verknüpfung G)
   aussen  gegeben NICHT(G(¬a;¬b));x;y   gesucht F(a;b);x;y     (muss: ohne NICHT)
   tausch  gegeben NICHT(F(a;b));y;x     gesucht G(¬a;¬b);y;x   (muss: ohne NICHT; F(a;b);x;y zählt auch)
   innen   gegeben F(NICHT(¬a);NICHT(¬b));x;y   gesucht F(a;b);x;y   (muss: ohne NICHT)            */
const UM_ARTEN = ['um', 'um', 'um', 'um', 'aussen', 'aussen', 'tausch', 'innen'];
function umdrehAufgabe(id, seed){
  const T0 = buildTask(id, {}, seed), r = rng(seed + 7), CD = T0.CD;
  const f = T0.comb, g = ANDERE[f], x = T0.then, y = T0.else, art = pick1(r, UM_ARTEN);
  const pos = c => c.cell + c.op + c.L(c.b), neg = c => c.cell + GEGEN[c.op] + c.L(c.b);
  const P = CD.map(pos), N = CD.map(neg);
  const wenn = (pr, a, b) => `=WENN(${pr};${a};${b})`;
  const gegeben = {um:T0.sol, aussen:wenn(`NICHT(${g}(${N.join(';')}))`, x, y), tausch:wenn(`NICHT(${f}(${P.join(';')}))`, y, x),
    innen:wenn(`${f}(${N.map(n => 'NICHT(' + n + ')').join(';')})`, x, y)}[art];
  const umgedreht = art === 'um' || art === 'tausch';
  const comb = umgedreht ? g : f, conds = umgedreht ? N : P, th = umgedreht ? y : x, el = umgedreht ? x : y;
  const T = {...T0, comb, conds, then:th, else:el, sol:wenn(`${comb}(${conds.join(';')})`, th, el), noLogic:false, art, gegeben};
  // Ablenker: nur, wenn sie an dieser Stelle eingesetzt die Lösung falsch machen
  const mk = cs => wenn(`${comb}(${cs.join(';')})`, th, el);
  const failsSub = (i, c) => { const cs = conds.slice(); cs[i] = c; try { return !checkAgainst(mk(cs), T).ok; } catch (e) { return true; } };
  const NAH = {'>=':'>', '>':'>=', '<':'<=', '<=':'<'}, SPIEGEL = {'>=':'<=', '>':'<', '<':'>', '<=':'>='};
  const condD = [], cvalD = [];
  CD.forEach((c, i) => {
    const op = umgedreht ? GEGEN[c.op] : c.op, lit = c.L(c.b);
    let cands = [c.cell + GEGEN[op] + lit];                                          // nicht umgedreht bzw. falsch umgedreht
    if (c.type === 'text') cands.push(...[...new Set(c.values)].filter(v => v !== c.b).slice(0, 2).map(v => c.cell + op + c.L(v)));
    else cands.push(...[NAH[op], SPIEGEL[op]].filter(Boolean).map(o => c.cell + o + lit), c.cell + op + c.L(c.rd(c.b + c.step)));
    let n = 0;
    for (const k of shuffle(cands, r)) if (n < 2 && !conds.includes(k) && !condD.includes(k) && failsSub(i, k)){ condD.push(k); n++; }
    const vals = c.type === 'text' ? [...new Set(c.values)].filter(v => v !== c.b).map(c.L) : ['"' + c.numLit(c.b) + '"', ...[1, -1, 2].map(s => c.L(c.rd(c.b + s * c.step)))];
    n = 0;
    for (const v of vals) if (n < 2 && !T.cvals.includes(v) && !cvalD.includes(v) && failsSub(i, c.cell + op + v)){ cvalD.push(v); n++; }
  });
  T.condD = condD; T.cvalD = cvalD;
  T.muss = ast => {
    if (art === 'um'){
      const top = ast.args[0];
      return top.k === 'call' && top.name === g ? '' : `Die Formel liefert dasselbe – aber sie ist noch nicht umgedreht. Verwende ${g} statt ${f}.`;
    }
    return usesFn(ast, ['NICHT']) ? 'Die Formel liefert dasselbe – aber sie soll ohne NICHT auskommen. Ersetze NICHT(…) durch das Gegenteil.' : '';
  };
  const auftrag = art === 'um'
    ? '<b>Dreh die Formel um:</b> Schreibe eine Formel, die immer dasselbe Ergebnis liefert – mit der anderen Verknüpfung, jeder Bedingung im Gegenteil und getauschtem Dann_Wert und Sonst_Wert.'
    : '<b>Schreibe die Formel ohne NICHT:</b> Sie soll immer dasselbe Ergebnis liefern. Ersetze NICHT durch das Gegenteil – und überlege, ob UND/ODER und Dann_Wert/Sonst_Wert dabei wechseln.';
  T.text = `<p>In Zelle ${B(T0.out)} steht diese Formel:</p><div class="gegeben"><code>${esc(gegeben)}</code></div><p>${auftrag}</p>`
    + `<details class="worum"><summary>Worum geht es?</summary><p>${T0.text}</p></details>`
    + (LEVELS[level].mode === 'text' && LEVELS[level].help ? `<details class="help"><summary>Hilfe: umdrehen</summary><ul><li>UND ↔ ODER</li><li>Gegenteile: &lt; ↔ &gt;=, &gt; ↔ &lt;=, = ↔ &lt;&gt;</li><li>NICHT(UND(a;b)) = ODER(NICHT(a);NICHT(b))</li><li>Prüfung umgedreht → Dann_Wert und Sonst_Wert tauschen</li></ul></details>` : '');
  return T;
}

/* ---------- Modus und Ablauf (basis.js, bausteine.js) ---------- */
function loadTask(){
  const lern = mode === 'lernen';
  $('#lern').style.display = lern ? '' : 'none';
  $('#engine').style.display = $('#dock').style.display = lern ? 'none' : '';
  if (lern){ renderHeader(); lernBauen(); return; }
  CUR = umdrehAufgabe(endScen, endSeed); poolSeed = rand(); setup();
}
function setMode(m){ if (m === mode) return; mode = m; store('mode', m); if (m === 'endlos' && !endScen) newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function setup(){ if (mode === 'endlos'){ CUR = umdrehAufgabe(endScen, endSeed); wbSetup(); } }   // neu, damit die Hilfe zur Stufe passt
function canNext(){ return endCounted; }
function nextTask(){ if (!canNext()) return; newEndless(); loadTask(); window.scrollTo({top:0, behavior:'smooth'}); }
function renderNav(){ navPfad(); renderDock(); }
function renderDock(){ $('#dock').innerHTML = dockHTML(); }
function renderGrid(){ wbGrid(); }
function render(){ wbRender({lvl:`Stufe ${level}: ${LEVELS[level].name}`, meta:`Endlos · ${CUR.art === 'um' ? 'Umdrehen' : 'Ohne NICHT'} · ${CUR.scen}`, text:CUR.text}); }
function check(){ wbCheck(); }

document.addEventListener('click', e => { if (!e.target.closest('#lern')) navClick(e); });
$('#resetBtn').addEventListener('click', () => setup());
$('#prevBtn').addEventListener('click', () => {});
if (mode === 'endlos') newEndless();
loadTask();
</script>
