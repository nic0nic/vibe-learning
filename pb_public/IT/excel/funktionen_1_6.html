document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="tabelle.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/>
  </linearGradient></defs></svg>

<header>
  <div class="hdr-left">
    <div class="brand"><span>=</span>Funktionen<span>()</span></div>
    <div class="modes" role="group" aria-label="Modus">
      <button data-mode="lernen">Erklärung</button><button data-mode="pfad">Übungen</button><button data-mode="endlos">Endlos</button>
    </div>
  </div>
  <div class="hdr-right">
    <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel umschalten"></button>
    <div class="flames" id="flames" aria-label="Stufe wählen"></div>
  </div>
</header>

<main>
  <section class="card" id="taskcard">
    <div class="meta">
      <span class="lvlname" id="lvlname"></span>
      <span id="taskmeta"></span>

  <section class="card" id="sheetcard">
    <div class="fbar" id="fbar"></div>

  </section>

  <section class="card" id="workcard">
    <div class="worktitle">Deine Antwort</div>
    <div id="work"></div>
  </section>

  <div class="actions" id="actions">
    <button class="btn primary" id="checkBtn">Prüfen</button>
    <button class="btn" id="resetBtn">Zurücksetzen</button>
    <button class="btn" id="ovBtn">Übersicht</button>
    <span class="spacer"></span>
    <button class="btn" id="skipBtn" title="Neue Aufgabe – die Serie beginnt wieder bei 0">Andere Aufgabe</button>
    <button class="btn" id="prevBtn" aria-label="Zurück">◀</button>
    <button class="btn" id="nextBtn">Nächste Aufgabe ▶</button>
  </div>
  <div id="fb"></div>
</main>

<div class="dock" id="dock"></div>

<script src="../../lib/aufgaben.js"></script>

<!-- ===================== Szenarien & Aufgaben ===================== -->
<script id="tasks">
/* Zufallswerte für Endlos und für die Testtabellen beim Prüfen */
const G = {
  n:(lo, hi, dp = 0, step = 1) => r => dp ? +(lo + r() * (hi - lo)).toFixed(dp) : lo + step * Math.floor(r() * ((hi - lo) / step + 1)),
  hole:(p, vals, g) => r => r() < p ? pick1(r, vals) : g(r),
  x:p => r => r() < p ? 'x' : null
};
const DAYS5 = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];
const DAYS7 = [...DAYS5, 'Samstag', 'Sonntag'];

/* Unterschied größter – kleinster Wert einer Spalte (MIN/MAX schon vorhanden) */
const diffMake = phr => x => {
  const R = x.last + 2, c = x.c, rg = `${c}${x.first}:${c}${x.last}`;
  x.cells['A' + R] = 'Kleinster Wert'; x.cells[c + R] = `=MIN(${rg})`;
  x.cells['A' + (R + 1)] = 'Größter Wert'; x.cells[c + (R + 1)] = `=MAX(${rg})`;
  x.cells['A' + (R + 2)] = 'Unterschied';
  const t = c + (R + 2);
  return {target:t, ref:`=${c}${R + 1}-${c}${R}`, text:`Berechne in ${B(t)}, ${phr(x.p)}. Die Werte in ${B(c + R)} und ${B(c + (R + 1))} helfen dir.`};
};

const SC = {
  brezel: {title:'Brezelverkauf der SMV', intro:'Die SMV verkauft in der Pause Brezeln und Muffins.', top:3,
    head:['Tag', 'Brezeln', 'Muffins'], cols:'BC', names:DAYS5,
    data:[[38, 21], [42, 25], [30, 18], [45, 27], [51, 30]],
    g:{B:G.n(30, 60), C:G.n(10, 30)},
    T:[
      {id:'sum', k:'col', fn:'SUMME', cols:'BC', lab:'Summe', q:p => `wie viele ${p.h} in der Woche insgesamt verkauft wurden`},
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'BC', lab:'Durchschnitt pro Tag', q:p => `wie viele ${p.h} im Durchschnitt pro Tag verkauft wurden`},
      {id:'max', k:'col', fn:'MAX', cols:'BC', lab:'Meiste an einem Tag', q:p => `wie viele ${p.h} an einem Tag höchstens verkauft wurden`},
      {id:'min', k:'col', fn:'MIN', cols:'BC', lab:'Wenigste an einem Tag', q:p => `wie viele ${p.h} am schwächsten Tag verkauft wurden`},
      {id:'rsum', k:'row', fn:'SUMME', rng:'BC', out:'D', hdr:'Zusammen', q:p => `wie viele Brezeln und Muffins am ${p.n} zusammen verkauft wurden`},
      {id:'all', k:'block', fn:'SUMME', rng:'BC', lab:'Alles zusammen', q:() => 'wie viele Brezeln und Muffins in der ganzen Woche zusammen verkauft wurden'},
      {id:'geld', k:'x', make:x => {
        const R = x.last + 2, t = 'B' + (R + 1);
        x.cells['A' + R] = 'Preis pro Brezel'; x.cells['B' + R] = 0.8; x.fmt['B' + R] = 'eur';
        x.cells['A' + (R + 1)] = 'Einnahmen Brezeln'; x.fmt[t] = 'eur';
        return {target:t, ref:`=SUMME(B${x.first}:B${x.last})*B${R}`,
          text:`Eine Brezel kostet 0,80 € (Zelle ${B('B' + R)}). Berechne in ${B(t)}, wie viel Geld die SMV in der Woche mit Brezeln eingenommen hat. Verwende dafür die Zelle ${B('B' + R)}.`}; }},
      {id:'mehr', k:'x', make:x => {
        const R = x.last + 2, t = 'B' + R;
        x.cells['A' + R] = 'Mehr Brezeln als Muffins';
        return {target:t, ref:`=SUMME(B${x.first}:B${x.last})-SUMME(C${x.first}:C${x.last})`,
          text:`Berechne in ${B(t)} mit einer einzigen Formel, wie viele Brezeln in der Woche mehr verkauft wurden als Muffins.`}; }}
    ]},

  pfand: {title:'Pfandflaschen-Sammelaktion', intro:'Die 7. Klassen sammeln vier Wochen lang Pfandflaschen für die Klassenkasse.', top:3,
    head:['Klasse', 'Woche 1', 'Woche 2', 'Woche 3', 'Woche 4'], cols:'BCDE', names:['7a', '7b', '7c', '7d'],
    data:[[34, 41, 28, 50], [45, 38, 52, 47], [22, 30, 35, 29], [40, 44, 39, 51]],
    g:{B:G.n(15, 55), C:G.n(15, 55), D:G.n(15, 55), E:G.n(15, 55)},
    T:[
      {id:'rsum', k:'row', fn:'SUMME', rng:'BE', out:'F', hdr:'Gesamt', q:p => `wie viele Flaschen die ${p.n} insgesamt gesammelt hat`},
      {id:'ravg', k:'row', fn:'MITTELWERT', rng:'BE', out:'F', hdr:'Durchschnitt', q:p => `wie viele Flaschen die ${p.n} im Durchschnitt pro Woche gesammelt hat`},
      {id:'rmax', k:'row', fn:'MAX', rng:'BE', out:'F', hdr:'Beste Woche', q:p => `wie viele Flaschen die ${p.n} in ihrer besten Woche gesammelt hat`},
      {id:'csum', k:'col', fn:'SUMME', cols:'BCDE', lab:'Summe pro Woche', q:p => `wie viele Flaschen alle Klassen zusammen in ${p.h} gesammelt haben`},
      {id:'cmin', k:'col', fn:'MIN', cols:'BCDE', lab:'Wenigste', q:p => `wie viele Flaschen die schwächste Klasse in ${p.h} gesammelt hat`},
      {id:'all', k:'block', fn:'SUMME', rng:'BE', lab:'Alle Flaschen', q:() => 'wie viele Flaschen alle Klassen in allen vier Wochen zusammen gesammelt haben'},
      {id:'geld', k:'x', make:x => {
        const R = x.last + 2, t = 'B' + (R + 1);
        x.cells['A' + R] = 'Pfand pro Flasche'; x.cells['B' + R] = 0.25; x.fmt['B' + R] = 'eur';
        x.cells['A' + (R + 1)] = 'Pfandgeld gesamt'; x.fmt[t] = 'eur';
        return {target:t, ref:`=SUMME(B${x.first}:E${x.last})*B${R}`,
          text:`Für jede Flasche gibt es 0,25 € Pfand (${B('B' + R)}). Berechne in ${B(t)} mit einer einzigen Formel, wie viel Pfandgeld alle Klassen zusammen bekommen.`}; }}
    ]},

  einkauf: {title:'Einkauf für das Klassenfest', intro:'Die Klasse kauft für das Klassenfest ein. In Spalte D sind die Kosten schon ausgerechnet (Preis mal Menge).', top:3,
    head:['Artikel', 'Preis pro Stück', 'Menge', 'Kosten'], cols:'BCD',
    names:['Apfelsaft (1 Liter)', 'Brezeln', 'Chips', 'Gummibärchen', 'Pappbecher (50 Stück)', 'Servietten', 'Würstchen (Packung)'],
    data:[[1.29, 6], [0.45, 30], [1.79, 5], [0.99, 8], [2.49, 1], [1.19, 2], [3.49, 4]].map((r, i) => [...r, `=B${4 + i}*C${4 + i}`]),
    fmt:{B:'eur', D:'eur'}, g:{B:G.n(0.39, 3.99, 2), C:G.n(2, 30)},
    T:[
      {id:'ges', k:'x', lv:[1, 2, 3, 4], make:x => {
        const R = x.last + 2; x.cells['A' + R] = 'Gesamtkosten'; x.fmt['D' + R] = 'eur';
        return {target:'D' + R, fn:'SUMME', rng:`D${x.first}:D${x.last}`, q:'wie viel der ganze Einkauf kostet'}; }},
      {id:'teuer', k:'x', lv:[1, 2, 3, 4], make:x => {
        const R = x.last + 2; x.cells['A' + R] = 'Teuerster Artikel (Stückpreis)'; x.fmt['B' + R] = 'eur';
        return {target:'B' + R, fn:'MAX', rng:`B${x.first}:B${x.last}`, q:'welcher Stückpreis am höchsten ist'}; }},
      {id:'rest', k:'x', make:x => {
        const R = x.last + 2;
        x.cells['A' + R] = 'Gesamtkosten'; x.cells['D' + R] = `=SUMME(D${x.first}:D${x.last})`;
        x.cells['A' + (R + 1)] = 'Zuschuss Elternbeirat'; x.cells['D' + (R + 1)] = 20;
        x.cells['A' + (R + 2)] = 'Restbetrag';
        [R, R + 1, R + 2].forEach(k => x.fmt['D' + k] = 'eur');
        return {target:'D' + (R + 2), ref:`=D${R}-D${R + 1}`,
          text:`Der Elternbeirat gibt 20 € dazu (${B('D' + (R + 1))}). Berechne in ${B('D' + (R + 2))}, wie viel die Klasse noch selbst bezahlen muss.`}; }},
      {id:'pro', k:'x', make:x => {
        const R = x.last + 2;
        x.cells['A' + R] = 'Gesamtkosten'; x.cells['D' + R] = `=SUMME(D${x.first}:D${x.last})`;
        x.cells['A' + (R + 1)] = 'Zuschuss Elternbeirat'; x.cells['D' + (R + 1)] = 20;
        x.cells['A' + (R + 2)] = 'Restbetrag'; x.cells['D' + (R + 2)] = `=D${R}-D${R + 1}`;
        x.cells['A' + (R + 3)] = 'Anzahl Schülerinnen und Schüler'; x.cells['D' + (R + 3)] = 26;
        x.cells['A' + (R + 4)] = 'Betrag pro Person';
        [R, R + 1, R + 2, R + 4].forEach(k => x.fmt['D' + k] = 'eur');
        return {target:'D' + (R + 4), ref:`=D${R + 2}/D${R + 3}`,
          text:`Die Klasse bezahlt den Restbetrag gemeinsam. Berechne in ${B('D' + (R + 4))}, wie viel jede Schülerin und jeder Schüler bezahlen muss.`}; }},
      {id:'pro1', k:'x', make:x => {
        const R = x.last + 2;
        x.cells['A' + R] = 'Zuschuss Elternbeirat'; x.cells['D' + R] = 20;
        x.cells['A' + (R + 1)] = 'Anzahl Schülerinnen und Schüler'; x.cells['D' + (R + 1)] = 26;
        x.cells['A' + (R + 2)] = 'Betrag pro Person';
        x.fmt['D' + R] = 'eur'; x.fmt['D' + (R + 2)] = 'eur';
        return {target:'D' + (R + 2), ref:`=(SUMME(D${x.first}:D${x.last})-D${R})/D${R + 1}`,
          text:`Der Elternbeirat gibt 20 € dazu (${B('D' + R)}), den Rest teilen sich die 26 Kinder (${B('D' + (R + 1))}). Berechne in ${B('D' + (R + 2))} mit einer einzigen Formel, wie viel jedes Kind bezahlen muss. Tipp: Denk an Klammern!`}; }}
    ]},

  temp: {title:'Temperaturen in der Projektwoche', intro:'Die Wetter-AG hat jeden Tag morgens und mittags die Temperatur gemessen.', top:3,
    head:['Tag', 'Morgens (°C)', 'Mittags (°C)'], cols:'BC', names:DAYS5,
    data:[[8, 15], [6, 13], [9, 17], [4, 12], [7, 16]],
    g:{B:G.n(-3, 10), C:G.n(8, 22)}, noun:{B:'morgens', C:'mittags'},
    T:[
      {id:'min', k:'col', fn:'MIN', cols:'BC', lab:'Niedrigste Temperatur', q:p => `welche Temperatur ${p.h} am niedrigsten war`},
      {id:'max', k:'col', fn:'MAX', cols:'BC', lab:'Höchste Temperatur', q:p => `welche Temperatur ${p.h} am höchsten war`},
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'BC', lab:'Durchschnitt', q:p => `wie warm es ${p.h} im Durchschnitt war`},
      {id:'ravg', k:'row', fn:'MITTELWERT', rng:'BC', out:'D', hdr:'Tagesmittel', q:p => `wie warm es am ${p.n} im Durchschnitt war`},
      {id:'diff', k:'x', cols:'BC', make:diffMake(p => `wie viel Grad zwischen der höchsten und der niedrigsten Temperatur ${p.h} liegen`)}
    ]},

  bjs: {title:'Bundesjugendspiele', intro:'Hier sind die Ergebnisse von acht Schülerinnen und Schülern der 7a.', top:3,
    head:['Name', '50-m-Lauf (Sekunden)', 'Weitsprung (Meter)', 'Ballwurf (Meter)'], cols:'BCD',
    names:['Mia', 'Jonas', 'Aylin', 'Luca', 'Sophie', 'Ben', 'Emma', 'Noah'],
    data:[[8.4, 3.65, 28.5], [7.9, 4.1, 35], [8.9, 3.2, 22], [8.1, 3.95, 38.5], [8.6, 3.4, 26], [7.6, 4.35, 41], [9.2, 3.05, 19.5], [8, 3.8, 33.5]],
    g:{B:G.n(7.2, 9.8, 1), C:G.n(2.8, 4.6, 2), D:G.n(15, 45, 1)}, noun:{B:'beim 50-m-Lauf', C:'beim Weitsprung', D:'beim Ballwurf'},
    T:[
      {id:'min', k:'col', fn:'MIN', cols:'BCD', lab:'Kleinster Wert', q:p => `welcher Wert ${p.h} am kleinsten ist`},
      {id:'max', k:'col', fn:'MAX', cols:'BCD', lab:'Größter Wert', q:p => `welcher Wert ${p.h} am größten ist`},
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'BCD', lab:'Durchschnitt', q:p => `welches Ergebnis ${p.h} im Durchschnitt erreicht wurde`},
      {id:'best', k:'col', lv:[4], fn:c => c === 'B' ? 'MIN' : 'MAX', cols:'BCD', lab:'Bestes Ergebnis', goal:'das beste Ergebnis',
       q:p => `welches das beste Ergebnis ${p.h} ist`, hint:'Überlege genau: Ist beim Laufen eine kleine oder eine große Zahl besser?',
       after:p => p.c === 'B' ? 'Beim Laufen ist die <b>kleinste</b> Zeit die beste – deshalb MIN.' : ''},
      {id:'diff', k:'x', cols:'BCD', make:diffMake(p => `wie groß der Unterschied zwischen dem größten und dem kleinsten Wert ${p.h} ist`)},
      {id:'spann', k:'x', cols:'BCD', make:x => {
        const R = x.last + 2, c = x.c, t = c + R, rg = `${c}${x.first}:${c}${x.last}`;
        x.cells['A' + R] = 'Unterschied';
        return {target:t, ref:`=MAX(${rg})-MIN(${rg})`, text:`Berechne in ${B(t)} mit einer einzigen Formel, wie groß der Unterschied zwischen dem größten und dem kleinsten Wert ${x.p.h} ist.`}; }}
    ]},

  screen: {title:'Bildschirmzeit-Check', intro:'Drei Freunde haben eine Woche lang aufgeschrieben, wie viele Minuten sie am Handy waren.', top:3,
    head:['Tag', 'Lena', 'Tim', 'Ali'], cols:'BCD', names:DAYS7,
    data:[[95, 120, 60], [80, 135, 75], [110, 90, 45], [70, 150, 80], [125, 160, 90], [180, 210, 140], [150, 195, 120]],
    g:{B:G.n(30, 220, 0, 5), C:G.n(30, 220, 0, 5), D:G.n(30, 220, 0, 5)},
    T:[
      {id:'sum', k:'col', fn:'SUMME', cols:'BCD', lab:'Minuten in der Woche', q:p => `wie viele Minuten ${p.h} in der Woche insgesamt am Handy war`},
      {id:'min', k:'col', fn:'MIN', cols:'BCD', lab:'Wenigste Minuten an einem Tag', q:p => `wie viele Minuten ${p.h} an einem Tag am wenigsten am Handy war`},
      {id:'max', k:'col', fn:'MAX', cols:'BCD', lab:'Meiste Minuten an einem Tag', q:p => `wie viele Minuten ${p.h} an einem Tag am längsten am Handy war`},
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'BCD', lab:'Durchschnitt pro Tag', q:p => `wie viele Minuten ${p.h} im Durchschnitt pro Tag am Handy war`},
      {id:'rsum', k:'row', fn:'SUMME', rng:'BD', out:'E', hdr:'Zusammen', q:p => `wie viele Minuten alle drei am ${p.n} zusammen am Handy waren`},
      {id:'std', k:'x', cols:'BCD', make:x => {
        const R = x.last + 2, c = x.c, t = c + (R + 1);
        x.cells['A' + R] = 'Minuten in der Woche'; x.cells[c + R] = `=SUMME(${c}${x.first}:${c}${x.last})`;
        x.cells['A' + (R + 1)] = 'Stunden in der Woche';
        return {target:t, ref:`=${c}${R}/60`, text:`Rechne in ${B(t)} die Minuten von ${x.p.h} (${B(c + R)}) in Stunden um. Tipp: 1 Stunde = 60 Minuten. Welches Rechenzeichen brauchst du?`}; }},
      {id:'std1', k:'x', cols:'BCD', make:x => {
        const R = x.last + 2, c = x.c, t = c + R;
        x.cells['A' + R] = 'Stunden in der Woche';
        return {target:t, ref:`=SUMME(${c}${x.first}:${c}${x.last})/60`, text:`Berechne in ${B(t)} mit einer einzigen Formel, wie viele <b>Stunden</b> ${x.p.h} in der Woche am Handy war (1 Stunde = 60 Minuten).`}; }},
      {id:'diff', k:'x', cols:'BCD', make:diffMake(p => `wie viele Minuten zwischen dem längsten und dem kürzesten Handytag von ${p.h} liegen`)}
    ]},

  vokabel: {title:'Vokabeltests in Englisch', intro:'Lena hat in diesem Halbjahr sechs Vokabeltests geschrieben, bei jedem gab es 20 Punkte. Eine leere Zelle heißt: Lena war krank.', top:3,
    head:['Test', 'Punkte'], cols:'B', names:['Test 1', 'Test 2', 'Test 3', 'Test 4', 'Test 5', 'Test 6'],
    data:[[14], [17], [12], [19], [15], [null]],
    g:{B:G.hole(0.2, [null], G.n(5, 20))},
    T:[
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'B', lab:'Durchschnitt', q:() => 'wie viele Punkte Lena im Durchschnitt erreicht hat'},
      {id:'sum', k:'col', fn:'SUMME', cols:'B', lab:'Summe', q:() => 'wie viele Punkte Lena insgesamt erreicht hat'},
      {id:'max', k:'col', fn:'MAX', cols:'B', lab:'Bester Test', q:() => 'wie viele Punkte Lena in ihrem besten Test hatte'},
      {id:'min', k:'col', fn:'MIN', cols:'B', lab:'Schlechtester Test', q:() => 'wie viele Punkte Lena in ihrem schlechtesten Test hatte'},
      {id:'cnt', k:'col', fn:'ANZAHL', cols:'B', lab:'Mitgeschrieben', q:() => 'bei wie vielen Tests Lena mitgeschrieben hat'},
      {id:'fehlt', k:'x', make:x => {
        const R = x.last + 2, t = 'B' + R;
        x.cells['A' + R] = 'Fehlende Punkte im Schnitt';
        return {target:t, ref:`=20-MITTELWERT(B${x.first}:B${x.last})`, text:`Berechne in ${B(t)} mit einer Formel, wie viele Punkte Lena im Durchschnitt zur vollen Punktzahl von 20 fehlen.`}; }}
    ]},

  wetter: {title:'Wetterstation der Schule', intro:'Die Wetter-AG hat ein halbes Jahr lang Daten gesammelt.', top:3,
    head:['Monat', 'Temperatur (°C)', 'Regen (mm)', 'Sonnenstunden'], cols:'BCD', names:['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni'],
    data:[[1.5, 58, 55], [2.8, 49, 80], [6.4, 52, 125], [10.2, 45, 180], [14.6, 70, 210], [18.1, 82, 230]],
    g:{B:G.n(-2, 20, 1), C:G.n(25, 95), D:G.n(40, 250)},
    T:[
      {id:'avg', k:'col', fn:'MITTELWERT', cols:'BCD', lab:'Durchschnitt', q:{B:'wie warm es im Durchschnitt war', C:'wie viel es im Durchschnitt pro Monat geregnet hat', D:'wie viele Sonnenstunden es im Durchschnitt pro Monat gab'}},
      {id:'min', k:'col', fn:'MIN', cols:'BCD', lab:'Niedrigster Wert', q:{B:'welche Monatstemperatur am niedrigsten war', C:'wie viel es im trockensten Monat geregnet hat', D:'wie viele Sonnenstunden der trübste Monat hatte'}},
      {id:'max', k:'col', fn:'MAX', cols:'BCD', lab:'Höchster Wert', q:{B:'welche Monatstemperatur am höchsten war', C:'wie viel es im regenreichsten Monat geregnet hat', D:'wie viele Sonnenstunden der sonnigste Monat hatte'}},
      {id:'sum', k:'col', fn:'SUMME', cols:'CD', lab:'Summe', q:{C:'wie viel es im Halbjahr insgesamt geregnet hat', D:'wie viele Sonnenstunden es im Halbjahr insgesamt gab'}},
      {id:'abw', k:'x', rows:true, make:x => {

/* ---- Aufgabe aus Szenario + Vorlage bauen ---- */
function genData(sc, r){ return sc.data.map(row => sc.cols.split('').map((c, j) => sc.g && sc.g[c] ? sc.g[c](r) : row[j])); }
function baseCells(sc, data){
  const cells = {};
  sc.head.forEach((h, i) => { cells[ad(i, sc.top)] = h; });
  sc.names.forEach((nm, i) => {
    const r = sc.top + 1 + i; cells['A' + r] = nm;
    sc.cols.split('').forEach((c, j) => { const v = data[i][j]; if (v != null) cells[c + r] = v; });
  });
  return cells;
}
const isSimpleTpl = t => t.k !== 'x' || !!(t.lv && t.lv.includes(1));
function tplLevels(t){ return t.lv || (t.k === 'x' ? [5] : [1, 2, 3, 4]); }
function buildCells(sc, t, p, data){
  const cells = baseCells(sc, data), fmt = {}, first = sc.top + 1, last = sc.top + sc.names.length;
  let o;
  if (t.k === 'col'){ const R = last + 2; cells['A' + R] = t.lab; o = {target:(t.outCol || p.c) + R, rng:`${p.c}${first}:${p.c}${last}`}; }
  else if (t.k === 'row'){ cells[t.out + sc.top] = t.hdr; o = {target:t.out + p.r, rng:`${t.rng[0]}${p.r}:${t.rng[1]}${p.r}`}; }
  else if (t.k === 'block'){ const R = last + 2; cells['A' + R] = t.lab; o = {target:(t.outCol || 'B') + R, rng:`${t.rng[0]}${first}:${t.rng[1]}${last}`}; }
  else o = t.make({cells, fmt, first, last, top:sc.top, p, c:p.c});
  if (!o.fn && t.fn) o.fn = typeof t.fn === 'function' ? t.fn(p.c) : t.fn;
  if (!o.ref) o.ref = `=${o.fn}(${o.rng})`;
  if (!o.q && t.q) o.q = typeof t.q === 'function' ? t.q(p) : t.q[p.c];
  o.cells = cells; o.fmt = fmt;
  return o;
}
/* Szenario mit leer:true: In den Prüfvarianten fehlen 1–3 ganze Zeilen (Name und Werte), damit sich auch die Länge
   der Liste ändert und eine abgeschriebene Anzahl (z. B. =8-ANZAHL(…)) auffällt. Angezeigt wird die volle Liste. */
function leereZeilen(cells, sc, p, r){
  const rows = shuffle(sc.names.map((_, i) => sc.top + 1 + i).filter(x => x !== p.r), r).slice(0, 1 + Math.floor(r() * 3));
  rows.forEach(x => { delete cells['A' + x]; sc.cols.split('').forEach(c => { delete cells[c + x]; }); });
}
const VERB = ['Berechne', 'Ermittle', 'Bestimme'];
function makeTask(scId, tid, p0, lv, seed, named){
  const sc = SC[scId], t = sc.T.find(x => x.id === tid);
  const r = rng(seed == null ? 4242 : seed);
  const p = Object.assign({}, p0 || {});
  if (t.cols && !p.c) p.c = pick1(r, t.cols.split(''));
  if ((t.k === 'row' || t.rows) && !p.r) p.r = sc.top + 1 + Math.floor(r() * sc.names.length);
  if (p.c) p.h = (sc.noun && sc.noun[p.c]) || sc.head[colN(p.c)];
  if (p.r) p.n = sc.names[p.r - sc.top - 1];
  const o = buildCells(sc, t, p, seed == null ? sc.data : genData(sc, r));
  const variants = [];
  for (let i = 0; i < 8; i++){
    const vr = rng((seed == null ? 99 : seed) * 31 + i * 977 + 1), v = buildCells(sc, t, p, genData(sc, vr)).cells;
    if (sc.leer) leereZeilen(v, sc, p, vr);
    variants.push(v);
  }
  const verb = VERB[(seed == null ? colN(o.target.match(/[A-Z]+/)[0]) + +o.target.match(/\d+/)[0] : Math.floor(r() * 3)) % 3];
  // Aufgaben mit Rechenzeichen gehen erst ab Stufe 3 (Bausteine)
  const simple = !!(o.fn && o.rng && o.ref === `=${o.fn}(${o.rng})`);
  const eff = !simple && lv < 3 ? 3 : lv;
  let text;
  if (!simple) text = o.text;
  else if (eff === 1) text = `In ${B(o.target)} soll mit ${C(o.fn)} berechnet werden, ${o.q}. Markiere dazu den passenden Bereich.`;
  else if (eff === 2) text = `In ${B(o.target)} soll stehen, ${o.q}. Ziehe die passende Funktion in die Formel und markiere den Bereich.`;
  else if (named) text = `${verb} in ${B(o.target)} mit der Funktion ${C(o.fn)}, ${o.q}.`;
  else text = `${verb} in ${B(o.target)}, ${o.q}.`;
  if (t.hint && !named && eff >= 2) text += `<br><span class="intro">${t.hint}</span>`;
  const ops = [...new Set((o.ref.slice(1).replace(/"[^"]*"/g, '').match(/[+\-*/]/g) || []))];
  return {scId, tid, p, lv:eff, wanted:lv, simple, named:!!named, sc, t, title:sc.title, intro:sc.intro, cells:o.cells, fmt:Object.assign({}, o.fmt), colFmt:sc.fmt || {},
    target:o.target, ref:o.ref, fn:o.fn, rng:o.rng, text, need:named && simple && eff >= 3 ? [o.fn] : [], noFn:!!(o.noFn || t.noFn), variants, ops,
    goal:t.goal, after:t.after ? t.after(p) : ''};
}

     options:['17', '12', '73', '15'], correct:[0],

     options:['MIN', 'MAX', 'SUMME', 'MITTELWERT'], correct:[0],
     why:{1:'MAX findet die größte Zeit – das ist beim Laufen die langsamste!', 2:'SUMME zählt alle Zeiten zusammen.', 3:'MITTELWERT liefert die durchschnittliche Zeit.'},

    {type:'task', title:'MIN anwenden', task:['temp', 'min', {c:'B'}, 4], html:'<p>Wie kalt war es am kältesten Morgen?</p>'},

    {type:'info', title:'Merkkasten MIN und MAX', final:true,

  ]},

     html:`<p>Beide Funktionen <b>zählen</b> Zellen – sie rechnen nicht mit den Zahlen.</p>

     why:{1:'5 wäre ANZAHL. ANZAHL2 zählt auch Text wie „krank“.', 2:'B10 ist leer – leere Zellen zählt ANZAHL2 nicht.', 3:'2 ist nur die Zahl der Wörter „krank“.'}},

     why:{1:'Namen sind Text – ANZAHL würde 0 ergeben.'}},

    {type:'task', title:'Zahlen zählen', task:['ha', 'cnt', {c:'G'}, 4], html:'<p>Wer gefehlt hat, hat „fehlt“ statt Punkten. Gezählt werden sollen nur die Punktzahlen.</p>'},
    {type:'info', title:'Merkkasten ANZAHL', final:true,
     html:`<ul><li><code>=ANZAHL(B4:B11)</code> zählt die Zellen mit einer <b>Zahl</b>.</li><li><code>=ANZAHL2(B4:B11)</code> zählt alle Zellen, die <b>nicht leer</b> sind – Zahlen und Text.</li><li>Leere Zellen zählen bei beiden nicht.</li></ul>`}
  ]}
];
const STEP_TOTAL = TOPICS.reduce((s, t) => s + t.steps.length, 0);
</script>

<!-- ===================== Oberfläche ===================== -->
<script>
const KEY = 'fn-';

let mode = ['pfad', 'endlos', 'lernen'].includes(load('mode')) ? load('mode') : 'lernen';
let level = clamp(parseInt(load('level')) || 1, 1, 5);
let pfadIdx = clamp(parseInt(load('idx')) || 0, 0, STD.length - 1);
let solved = {}; try { const x = JSON.parse(load('solved') || '{}'); solved = x && !Array.isArray(x) ? x : {}; } catch (e) {}
let endPick = null, endSeed = 0, endCounted = false, streak = 0, best = parseInt(load('best')) || 0;
let learn = {topic:null, prog:{}};
try { const o = JSON.parse(load('learn') || '{}'); learn.prog = o.prog || {}; learn.topic = TOPICS.some(t => t.id === o.topic) ? o.topic : null; } catch (e) {}
let CUR = null, S = {}, LS = null, pickerOpen = false, PT = null;

/* gelöste Aufgabe bzw. erledigten Schritt an den Server melden (nur wenn die Seite über PocketBase läuft) */
function logSolved(erstmals){
  if (!window.TrainerSync) return;
  if (mode === 'lernen'){
    const tp = topic(), i = prog().idx, st = tp.steps[i];
    TrainerSync.event({modus:'erarbeitung', stufe:st.task ? st.task[3] : 0, aufgabe:`${tp.id}-${i + 1}`, titel:`${tp.name}: ${st.title}`, gesamt:STEP_TOTAL, erstmals});
  } else TrainerSync.event({modus:mode === 'pfad' ? 'uebungen' : 'endlos', stufe:level,
    aufgabe:mode === 'pfad' ? String(pfadIdx + 1) : `${CUR.scId}-${CUR.tid}`, titel:CUR.title, gesamt:mode === 'pfad' ? STD.length : 0, erstmals});
}

/* ---------- Aufgaben- und Modussteuerung ---------- */
function resetS(){ S = {text:'', gap:'', fnsel:'', row:[], made:[], mk:'', mkOpen:false, success:false, fb:null, result:null, inspect:null, sel:null, src:''}; }
function loadTask(){
  PT = null; resetS(); LS = null; CUR = null;
  if (mode === 'lernen'){ if (learn.topic) loadStep(); else render(); return; }
  if (mode === 'pfad'){ const e = STD[pfadIdx]; CUR = makeTask(e[0], e[1], e[2], level, null, e[3] === 1); }
  else CUR = makeTask(endPick.sc, endPick.t, {}, level, endSeed, endPick.named);
  render();
}
function loadStep(){
  const p = prog(), tp = topic();
  p.idx = clamp(p.idx, 0, tp.steps.length - 1); saveLearn();
  const st = tp.steps[p.idx];
  resetS(); CUR = null; LS = null;
  if (st.type === 'task') CUR = makeTask(...st.task, null, true);
  if (st.type === 'choice') LS = {sel:new Set(), checked:false};
  if (st.sheet) S.inspect = st.sheet.sel || null;
  if (st.type === 'info') markStep();
  render();
}
function newEndless(){
  const all = [];
  Object.entries(SC).forEach(([sc, d]) => d.T.forEach(t => { if (level >= 3 || isSimpleTpl(t)) all.push({sc, t:t.id}); }));
  const pool = all.filter(x => !endPick || x.sc !== endPick.sc);
  endPick = pick1(Math.random, pool.length ? pool : all); endSeed = rand(); endCounted = false;
  const t = SC[endPick.sc].T.find(x => x.id === endPick.t);
  endPick.named = t.goal ? false : level === 1 ? true : level === 2 ? false : Math.random() < 0.4;
}
function setLevel(n){ level = n; store('level', n); if (mode === 'endlos') newEndless(); pickerOpen = false; loadTask(); }
/* ---------- Rendering ---------- */
function render(){
  renderHeader();
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  if (mode === 'lernen' && !learn.topic){ renderOverview(OV_INTRO); return; }
  show('#actions', true);
  const st = mode === 'lernen' ? curStep() : null;
  if (st){
    const tp = topic();
    $('#lvlname').textContent = `${tp.name} · ${st.title}`;
    $('#taskmeta').textContent = `Schritt ${prog().idx + 1} von ${tp.steps.length}`;
    let h = st.html;
    if (CUR) h += `<div class="assign"><div class="intro">${esc(CUR.intro)}</div><b>Aufgabe:</b> ${CUR.text}</div>${CUR.lv >= 4 ? HELP_FN : HELP_FN.replace(/<p class="howin">[\s\S]*?<\/p>/, '')}`;
    if (st.final) h += finalButtons();
    $('#tasktext').innerHTML = h;
  } else {
    $('#lvlname').textContent = `Stufe ${level}: ${LEVELS[level].name}` + (CUR.lv !== level ? ' – diese Aufgabe mit Bausteinen' : '');
    $('#taskmeta').textContent = mode === 'pfad' ? `Übungen · Aufgabe ${pfadIdx + 1} von ${STD.length}` : `Endlos · ${CUR.title}`;
    $('#tasktext').innerHTML = `<div class="intro"><b>${esc(CUR.title)}:</b> ${esc(CUR.intro)}</div><p>${CUR.text}</p>${CUR.lv >= 4 ? HELP_FN : HELP_FN.replace(/<p class="howin">[\s\S]*?<\/p>/, '')}`;
  }
  show('#sheetcard', !!(CUR || (st && st.sheet)));
  show('#workcard', !!(st && st.type === 'choice'));
  if (CUR || (st && st.sheet)){ renderFbar(); renderGrid(); }
  if (st && st.type === 'choice') renderChoice(st);
  renderFeedback(); renderNav();
}

function finalButtons(){
  const i = TOPICS.findIndex(t => t.id === learn.topic), nx = TOPICS[i + 1];
  return `<p style="margin-top:12px">${nx ? `<button class="btn primary" data-topic-go="${nx.id}">Weiter mit ${esc(nx.name)}</button> ` : ''}<button class="btn${nx ? '' : ' primary'}" data-ov="1">Zur Übersicht</button> <button class="btn" data-mode-go="pfad">Zu den Übungen</button></p>`;
}

const OV_INTRO = '<p>Wähle aus, was du dir ansehen möchtest. Jedes Thema erklärt eine Funktion an einem Beispiel, stellt dir ein paar einfache Fragen – und dann schreibst du die Funktion selbst.</p>';

/* ---------- Tabelle & Bearbeitungsleiste ---------- */
function curSheet(){
  if (CUR) return {cells:CUR.cells, fmt:CUR.fmt, colFmt:CUR.colFmt, top:CUR.sc.top};
  const st = mode === 'lernen' && learn.topic ? curStep() : null;
  if (!st || !st.sheet) return null;
  const sc = SC[st.sheet.sc];
  return {cells:Object.assign(baseCells(sc, sc.data), st.sheet.extra || {}), fmt:{}, colFmt:sc.fmt || {}, top:sc.top};
}
function fmtOf(sh, a){ return sh.fmt[a] || sh.colFmt[a.match(/[A-Z]+/)[0]]; }
function liveText(){
  if (!CUR) return '';
  if (CUR.lv === 1) return `=${CUR.fn}(${S.gap})`;
  if (CUR.lv === 2) return S.fnsel ? `=${S.fnsel}(${S.gap})` : '=';
  if (CUR.lv === 3) return S.row.map(x => x.lit).join('');
  return S.text;
}
function curRefs(sh){
  if (CUR) return refsInText(liveText());
  const raw = S.inspect && sh.cells[S.inspect];
  return typeof raw === 'string' && raw[0] === '=' ? refsInText(raw) : [];
}

function renderGrid(){
  const sh = curSheet(); if (!sh) return;
  const cells = sh.cells, keys = Object.keys(cells).concat(CUR ? [CUR.target] : []);
  let maxC = 0, maxR = sh.top;
  keys.forEach(a => { const x = addr(a); maxC = Math.max(maxC, x.c); maxR = Math.max(maxR, x.r); });
  const book = new Sheet(cells), refs = curRefs(sh), col = {};
  refs.forEach((rg, i) => rangeCells(rg.a, rg.b).forEach(c => { col[c] = i % 6; }));
  let h = `<table class="xl${CUR ? ' pick' : ''}"><tr><th></th>`;
  for (let c = 0; c <= maxC; c++) h += `<th>${colL(c)}</th>`;
  h += '</tr>';
  for (let r = sh.top; r <= maxR; r++){
    h += `<tr><th>${r}</th>`;
    for (let c = 0; c <= maxC; c++){
      const a = ad(c, r), cls = [];
      let content = '';
      if (CUR && a === CUR.target){
        cls.push('tgt');
        if (S.success){ cls.push('done'); content = esc(fmtVal(S.result, fmtOf(sh, a))); }
        else content = esc(liveText() === '=…()' ? '' : liveText());
      } else {
        const v = book.val(a);
        content = esc(fmtVal(v, fmtOf(sh, a)));
        if (r === sh.top) cls.push('hd');
        else if (c === 0) cls.push('lbl');
        if (v.t === 'num' || v.t === 'err') cls.push('num');
      }
      if (col[a] != null) cls.push('rc' + col[a]);
      if (S.sel && S.sel.has(a)) cls.push('sel');
      if (!CUR && S.inspect === a) cls.push('ins');
      h += `<td data-c="${a}" class="${cls.join(' ')}">${content}</td>`;
    }
    h += '</tr>';
  }
  $('#grid').innerHTML = h + '</table>';
  $('#sheetcard').classList.toggle('solved', !!S.success);
  const chips = refs.map((rg, i) => `<span class="chip c${i % 6}">${rg.txt || rg.a}</span>`).join('');
  $('#chips').innerHTML = CUR
    ? (chips || '') + `<span class="howto">${chips ? '' : 'Tipp: '}Bereiche kannst du auch mit der Maus in der Tabelle markieren – klicken und ziehen.</span>`
    : chips + '<span class="howto">Klicke auf eine Zelle, um oben zu sehen, was darin steht.</span>';
}

function renderFbar(){
  const sh = curSheet(); if (!sh) return;
  const ia = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
  let inner;
  if (CUR){
    if (CUR.lv === 1) inner = `<span>=${CUR.fn}(</span><input id="gap" class="gapin pin" ${ia} placeholder="Bereich" value="${esc(S.gap)}" aria-label="Bereich"><span>)</span>`;
    else if (CUR.lv === 2) inner = `<span>=</span><div class="slot fnslot" data-drop="fnslot">${S.fnsel
        ? `<div class="block fn" data-drag="1" data-kind="fn" data-val="${S.fnsel}" data-from="slot"><span class="fname">${S.fnsel}(</span><input id="gap" class="gapin pin" ${ia} placeholder="Bereich" value="${esc(S.gap)}" aria-label="Bereich"><span class="fname">)</span></div>`
        : '<span class="ph">Funktion hierher ziehen</span>'}</div>`;
    else if (CUR.lv === 3) inner = `<div class="row" data-drop="row">${S.row.map((x, i) => `<span class="iw">${blockHTML(x.lit, {kind:'rowitem', ri:i})}</span>`).join('') || '<span class="ph">Ziehe Zeichen und Bausteine hierher, um die Formel zu bauen.</span>'}</div>`;
    else inner = `<input id="ft" class="ftin acin pin" ${ia} placeholder="Formel eingeben, z. B. =SUMME(…)" value="${esc(S.text)}" aria-label="Formel">`;
    $('#fbar').innerHTML = `<div class="nbox" title="Namenfeld: Hier kommt deine Formel hin">${CUR.target}</div><span class="fxl">fx</span><div class="fin">${inner}</div>`;
    renderPools();
  } else {
    const raw = S.inspect ? sh.cells[S.inspect] : null;
    const txt = raw == null ? '' : typeof raw === 'number' ? fmtNum(raw) : raw;
    $('#pools').innerHTML = '';
    $('#fbar').innerHTML = `<div class="nbox">${S.inspect || ''}</div><span class="fxl">fx</span><div class="fshow${txt ? '' : ' empty'}">${txt ? esc(txt) : (S.inspect ? '(leer)' : 'Klicke auf eine Zelle')}</div>`;
  }
  $('#selhint').textContent = '';
}

/* ---------- Bereich mit der Maus markieren (wie in Excel) ---------- */
function activeInput(){ return $('#ft') || $('#gap') || $('#mk'); }

/* ---------- Blöcke (Stufe 2 und 3) ---------- */
const blockKind = lit => FUNCS.includes(lit) ? 'fn' : /^[=();:+\-*/]$/.test(lit) ? 'sym' : 'val';
function blockHTML(lit, o){
  const k = blockKind(lit), attrs = `data-drag="1" data-kind="${o.kind}" data-val="${esc(lit)}"${o.ri != null ? ` data-ri="${o.ri}"` : ''}`;
  return `<div class="block ${k}${o.ghost ? ' ghost' : ''}" ${attrs}>${esc(lit)}${o.del != null ? `<button class="bx" data-del="${o.del}" title="Baustein löschen" aria-label="Baustein löschen">×</button>` : ''}</div>`;
}
function renderPools(){
  const P = $('#pools'), ia = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
  if (CUR.lv === 2){
    P.innerHTML = `<div class="pool" data-drop="pool"><div class="pool-title">Funktionen</div><div class="pool-items">${FUNCS.map(f =>
      `<div class="block fn${S.fnsel === f ? ' ghost' : ''}" data-drag="1" data-kind="fn" data-val="${f}">${f}( )</div>`).join('')}</div></div>`;
    return;
  }
  if (CUR.lv !== 3){ P.innerHTML = ''; return; }
  const syms = ['=', '(', ')', ';', ...CUR.ops];
  const mk = S.mkOpen
    ? `<div class="mkrow"><input id="mk" class="gapin pin" ${ia} placeholder="z. B. B4:B8" value="${esc(S.mk)}" aria-label="Neuer Baustein"><button class="btn small primary" id="mkOk">Übernehmen</button><button class="btn small" id="mkX">Abbrechen</button></div>
       <div class="ohint">Markiere die Zellen in der Tabelle oder tippe den Bereich ein. Auch eine einzelne Zelle (B4) oder eine Zahl (60) geht.</div>`
    : '<button class="btn small" id="mkBtn">＋ Bereich erstellen</button>';
  P.innerHTML = `<div class="pool sympool" data-drop="pool"><div class="pool-title">Funktionen</div><div class="pool-items">${FUNCS.map(x => blockHTML(x, {kind:'sym'})).join('')}</div></div>
    <div class="pool sympool" data-drop="pool"><div class="pool-title">Zeichen</div><div class="pool-items">${syms.map(x => blockHTML(x, {kind:'sym'})).join('')}</div></div>
    <div class="pool" data-drop="pool"><div class="pool-title">Deine Bausteine</div><div class="pool-items">${S.made.map((x, i) => blockHTML(x, {kind:'sym', del:i})).join('')}${mk}</div></div>`;
}
function openMaker(){ S.mkOpen = true; S.mk = ''; renderPools(); const m = $('#mk'); if (m) m.focus(); }
function makeBlock(){
  const raw = (S.mk || '').trim().replace(/\s+/g, '').toUpperCase();
  let lit = null;
  if (/^\$?[A-Z]{1,3}\$?\d{1,5}$/.test(raw)) lit = normRef(raw);
  else if (/^\$?[A-Z]{1,3}\$?\d{1,5}:\$?[A-Z]{1,3}\$?\d{1,5}$/.test(raw)){ const [a, b] = raw.split(':'); lit = normRange(a, b); }
  else if (/^\d+(,\d+)?$/.test(raw)) lit = raw;
  if (!lit){ hint(raw ? `„${S.mk}“ ist kein Bereich. Beispiele: B4:B8, B4 oder 60.` : 'Markiere zuerst Zellen in der Tabelle oder tippe einen Bereich ein.'); const m = $('#mk'); if (m) m.focus(); return; }
  if (!S.made.includes(lit)) S.made.push(lit);
  S.mkOpen = false; S.mk = ''; S.sel = null;
  renderPools(); renderGrid();
}

/* Drag & Drop: Hooks für den Kern in basis.js */
function dropOk(t){
  const d = t.dataset.drop;
  if (CUR.lv === 2) return d === 'fnslot' ? D.kind === 'fn' : d === 'pool' && D.from === 'slot';
  if (d === 'row') return D.kind === 'sym' || D.kind === 'rowitem';
  return d === 'pool' && D.kind === 'rowitem';
}
function dragData(b, e){
  if (!CUR || e.target.closest('input,button') || b.classList.contains('ghost')) return null;
  return {kind:b.dataset.kind, val:b.dataset.val, ri:b.dataset.ri != null ? +b.dataset.ri : null, from:b.dataset.from, src:b.dataset.kind !== 'sym'};
}
function dragGhost(g){ g.querySelectorAll('input').forEach(x => { x.value = S.gap; x.removeAttribute('id'); }); }
// Antippen statt Ziehen: Funktion einsetzen bzw. Zeichen hinten anhängen
function dragTap(d){
  if (d.kind === 'fn' && d.from !== 'slot') applyDrop(d, 'fnslot', 0);
  else if (d.kind === 'sym') applyDrop(d, 'row', S.row.length);
}
function applyDrop(d, type, idx){
  if (type === 'fnslot'){ S.fnsel = d.val; }
  else if (type === 'row'){
    if (d.kind === 'rowitem'){ const [it] = S.row.splice(d.ri, 1); if (d.ri < idx) idx--; S.row.splice(idx, 0, it); }
    else S.row.splice(idx, 0, {lit:d.val});
  } else if (type === 'pool'){
    if (d.from === 'slot') S.fnsel = '';
    else if (d.kind === 'rowitem') S.row.splice(d.ri, 1);
  }
  S.sel = null; clearMarks(); renderFbar(); renderGrid();
  if (type === 'fnslot'){ const g = $('#gap'); if (g){ g.focus(); const n = g.value.length; g.setSelectionRange(n, n); } }
}
function insertionPoint(inp){
  if (inp.id === 'mk') return {start:0, end:inp.value.length};
  const v = inp.value, [s, e] = caret(inp), before = v.slice(0, s), gap = inp.id === 'gap';
  const okBefore = pc => gap ? /[;:(+\-*/]/.test(pc) : /[=(;+\-*/^:]/.test(pc);
  // direkt davor steht schon ein Bezug: ersetzen (wie der Zeigemodus in Excel)
  const m = before.match(/\$?[A-Za-z]{1,3}\$?\d{1,5}(?:\s*:\s*\$?[A-Za-z]{1,3}\$?\d{1,5})?$/);
  if (m){
    const st = s - m[0].length, pre = v.slice(0, st).replace(/\s+$/, '');
    if ((gap && pre === '') || okBefore(pre.slice(-1))) return {start:st, end:Math.max(s, e)};
  }
  const pc = before.replace(/\s+$/, '').slice(-1);
  if (gap){ if (!before.trim() || okBefore(pc)) return {start:s, end:e}; return {err:'Setze zuerst ein Semikolon ; – dann kannst du noch einen Bereich markieren.'}; }
  if (!v.trim()) return {err:'Tippe zuerst = und den Funktionsnamen mit Klammer, z. B. =SUMME( – dann kannst du den Bereich mit der Maus markieren.'};
  if (okBefore(pc)) return {start:s, end:e};
  return {err:'Hier kann kein Bereich eingefügt werden. Setze den Cursor hinter „(“, „;“ oder ein Rechenzeichen.'};
}
function syncInput(inp, keepSel){
  if (inp.id === 'ft') S.text = inp.value; else if (inp.id === 'gap') S.gap = inp.value; else if (inp.id === 'mk') S.mk = inp.value;
  if (!keepSel) S.sel = null;
  clearMarks(); renderGrid();
  if (inp.id === 'ft') acUpdate(inp);
}
gridEl.addEventListener('pointerdown', e => {
  const td = e.target.closest('td[data-c]'); if (!td || e.button > 0) return;
  const a = td.dataset.c;
  if (!CUR){ if (curSheet()){ S.inspect = a; renderFbar(); renderGrid(); } return; }
  e.preventDefault();
  if (CUR.lv === 3 && !$('#mk')) openMaker();
  const inp = activeInput();
  if (!inp){ hint('Ziehe zuerst eine Funktion in die Formel – dann kannst du den Bereich markieren.'); return; }
  if (a === CUR.target){ hint(`In ${a} steht deine Formel selbst – diese Zelle darf nicht im Bereich vorkommen.`); focusInp(inp); return; }
  const at = insertionPoint(inp);
  if (at.err){ hint(at.err); focusInp(inp); return; }
  $('#selhint').textContent = '';
  PT = {inp, anchor:a, cur:a, start:at.start, end:at.end, base:inp.value};
  applyPT();
  try { gridEl.setPointerCapture(e.pointerId); } catch (x) {}
});
gridEl.addEventListener('pointermove', e => {
  if (!PT) return;
  const td = cellAt(e.clientX, e.clientY);
  if (td && td.dataset.c !== PT.cur && td.dataset.c !== CUR.target){ PT.cur = td.dataset.c; applyPT(); }
});
/* ---------- Prüfen ---------- */
function composed(){
  const lv = CUR.lv;
  if (lv === 1){ if (!S.gap.trim()) return {missing:'Markiere zuerst den Bereich in der Tabelle (oder tippe ihn ein).'}; return {src:`=${CUR.fn}(${S.gap})`}; }
  if (lv === 2){
    if (!S.fnsel) return {missing:'Ziehe zuerst eine Funktion in die Formel.'};
    if (!S.gap.trim()) return {missing:'Klicke in das Feld in der Klammer und markiere den Bereich in der Tabelle (oder tippe ihn ein).'};
    return {src:`=${S.fnsel}(${S.gap})`};
  }
  if (lv === 3){
    if (!S.row.length) return {missing:'Ziehe Zeichen und Bausteine in die Formelzeile.'};
    return {src:S.row.map(x => x.lit).join('')};
  }
  return {src:S.text};
}
function cellList(list){
  if (!list.length) return '';
  const xs = list.map(addr), c1 = Math.min(...xs.map(x => x.c)), c2 = Math.max(...xs.map(x => x.c)), r1 = Math.min(...xs.map(x => x.r)), r2 = Math.max(...xs.map(x => x.r));
  if (list.length > 1 && (c2 - c1 + 1) * (r2 - r1 + 1) === list.length) return `${ad(c1, r1)} bis ${ad(c2, r2)}`;
  return list.slice(0, 6).join(', ') + (list.length > 6 ? ' …' : '');
}
function diagnose(ast, refAst, T, book){
  const out = [], a = topCall(ast), b = topCall(refAst);
  if (a && b){
    if (a.name !== b.name){
      if (a.name === 'ANZAHL' && b.name === 'ANZAHL2') out.push('ANZAHL zählt nur Zellen mit Zahlen. Hier stehen aber Einträge mit Text (z. B. Namen oder x) – die zählt nur ANZAHL2.');
      else if (a.name === 'ANZAHL2' && b.name === 'ANZAHL') out.push('ANZAHL2 zählt auch Zellen mit Text mit (z. B. „krank“ oder „fehlt“). Gezählt werden sollen hier nur die Zahlen.');
      else out.push(`${C(a.name)} ${FDESC[a.name]}. Gesucht ist aber ${T.goal || GOAL[b.name]}.`);
    }
    const two = a.args.length === 2 && a.args.every(x => x.k === 'ref') && b.args.length === 1 && b.args[0].k === 'range';
    if (two && new Set([a.args[0].v, a.args[1].v, b.args[0].a, b.args[0].b]).size === 2)
      out.push(`${C(a.args[0].v + ';' + a.args[1].v)} sind nur die zwei Zellen ${a.args[0].v} und ${a.args[1].v}. Für alle Zellen dazwischen schreibst du einen Doppelpunkt: ${C(a.args[0].v + ':' + a.args[1].v)}.`);
    else if (a.name === b.name || ['ANZAHL', 'ANZAHL2'].includes(a.name) && ['ANZAHL', 'ANZAHL2'].includes(b.name)){
      const mine = cellsOfRefs(refsOf(a)), want = cellsOfRefs(refsOf(b));
      const miss = [...want].filter(c => !mine.has(c)), moreAll = [...mine].filter(c => !want.has(c));
      const more = moreAll.some(c => book.val(c).t !== 'empty') ? moreAll : [];
      if (miss.length || more.length){
        let s = 'Dein Bereich passt noch nicht.';
        if (miss.length) s += ` Es fehlt noch: ${cellList(miss)}.`;
        if (more.length){
          const hd = more.filter(c => addr(c).r === T.sc.top);
          s += ` Zu viel dabei: ${cellList(more)}${hd.length === more.length ? ' (Überschrift)' : ''}.`;
        }
        out.push(s);
      }
    }
  }
  const lits = numsOf(ast).filter(n => !numsOf(refAst).includes(n));
  if (lits.length) out.push('Schreibe keine Zahlen aus der Tabelle ab – verwende Zellbezüge. Dann rechnet Excel automatisch neu, wenn sich eine Zahl ändert.');
  return out;
}
function judge(src, T){
  let ast;
  try { ast = parseFormula(src); } catch (e){ if (!(e instanceof FErr)) throw e; return {err:esc(e.message)}; }
  const refs = refsOf(ast), cells = cellsOfRefs(refs), refAst = parseFormula(T.ref);
  const myFns = fnsOf(ast), refFns = fnsOf(refAst), f = c => fmtVal(c, fmtOf(T, T.target));
  if (cells.has(T.target)) return {err:`Deine Formel steht in ${T.target} und verwendet ${T.target} selbst. Das nennt Excel einen <b>Zirkelbezug</b>. Nimm ${T.target} aus dem Bereich heraus.`};
  for (const fn of T.need) if (!myFns.has(fn)) return {err:`Verwende hier die Funktion ${C(fn)}.`, task:true};
  if (T.noFn && myFns.size) return {err:'Hier sollst du ohne Funktion rechnen – nur mit den Zellen und einem Rechenzeichen.', task:true};
  const book = new Sheet(T.cells), got = book.with(T.target, src).val(T.target), exp = book.with(T.target, T.ref).val(T.target);
  if (!refs.length) return {err:`Deine Formel ergibt ${C(esc(f(got)))}, enthält aber keinen einzigen Zellbezug. Schreibe keine Zahlen ab, sondern verwende Zellen bzw. Bereiche wie B4:B8. Dann rechnet Excel automatisch neu, wenn sich eine Zahl ändert.`};
  if (refFns.size && !myFns.size && !T.noFn)
    return {err:(same(got, exp) ? 'Das Ergebnis stimmt – aber ' : `Deine Formel ergibt ${C(esc(f(got)))}. Außerdem: `) + 'Verwende eine Funktion, statt alle Zellen einzeln zu verrechnen.', task:same(got, exp)};
  if (!same(got, exp)){
    let h = `Deine Formel ergibt ${C(esc(f(got)))} – das ist noch nicht das gesuchte Ergebnis.`;
    if (got.t === 'err' && got.v === '#WERT!') h += '<br>#WERT! bedeutet: Es wird mit einer Zelle gerechnet, in der Text steht.';
    if (got.t === 'err' && got.v === '#DIV/0!') h += '<br>#DIV/0! bedeutet: Es wird durch 0 geteilt – oder im Bereich steht gar keine Zahl.';
    const d = diagnose(ast, refAst, T, book);
    return {err:h + d.map(x => '<br>' + x).join('')};
  }
  for (const v of T.variants){
    const sh = new Sheet(v);
    if (!same(sh.with(T.target, src).val(T.target), sh.with(T.target, T.ref).val(T.target))){
      const d = diagnose(ast, refAst, T, book);
      return {err:'Deine Formel liefert hier zufällig das richtige Ergebnis – aber nicht mehr, wenn sich die Einträge in der Tabelle ändern.' + d.map(x => '<br>' + x).join('')};
    }
  }
  const notes = [], a = topCall(ast), b = topCall(refAst);
  if (a && b && a.name === b.name){
    const want = cellsOfRefs(refsOf(b)), extra = [...cellsOfRefs(refsOf(a))].filter(c => !want.has(c));
    if (extra.length) notes.push(`Dein Bereich enthält auch ${cellList(extra)}. Das klappt hier nur, weil dort keine Zahl steht. Genauer wäre ${C(b.args.map(x => x.k === 'range' ? x.a + ':' + x.b : fmtNode(x)).join(';'))}.`);
  }
  return {ok:true, ast, val:got, notes};
}
function fmtNode(n){ return n.k === 'ref' ? n.v : n.k === 'num' ? fmtNum(n.v) : '…'; }
function colorFormula(src){
  let i = 0;
  return esc(src).replace(/(^|[^A-Za-z0-9_$ÄÖÜäöüß])(\$?[A-Za-z]{1,3}\$?\d{1,5}(?:\s*:\s*\$?[A-Za-z]{1,3}\$?\d{1,5})?)(?![A-Za-z0-9(])/g,
    (m, pre, ref) => `${pre}<span class="c${(i++) % 6}">${ref}</span>`);
}
const normF = s => normQuotes(s).replace(/[\s$]/g, '').toUpperCase();

function check(){
  if (!CUR){ if (LS) checkChoice(); return; }
  const cur = composed();
  if (cur.missing){ S.fb = {type:'err', html:esc(cur.missing)}; S.success = false; renderFeedback(); return; }
  const res = judge(cur.src, CUR);
  if (!res.ok){
    let html = res.err;
    if (CUR.lv === 5 && !res.task){
      let ok = true; try { parseFormula(cur.src); } catch (e){ ok = false; }
      html = ok ? 'Die Formel ist gültig, liefert aber nicht das gesuchte Ergebnis.' : 'Die Formel enthält einen Fehler.';
    }
    S.success = false; S.fb = {type:'err', html}; renderFeedback(); renderGrid(); return;
  }
  S.success = true; S.result = res.val; S.src = cur.src;
  let erstmals;
  if (mode === 'lernen'){ erstmals = !stepDone(prog().idx); markStep(); }
  else erstmals = countSolved();
  logSolved(erstmals);
  const fm = fmtOf(CUR, CUR.target);
  let h = `<b>Richtig! 🎉</b> In ${B(CUR.target)} steht jetzt ${C(esc(fmtVal(res.val, fm)))}.<br><span class="fcol">${colorFormula(cur.src)}</span>`;
  if (CUR.lv >= 3 && normF(cur.src) !== normF(CUR.ref)) h += `<span class="note">Deine Formel ist gleichwertig zur Musterlösung ${C(esc(CUR.ref))}.</span>`;
  res.notes.forEach(n => { h += `<span class="note">${n}</span>`; });
  if (CUR.after) h += `<span class="note">${CUR.after}</span>`;
  const st = mode === 'lernen' ? curStep() : null;
  if (st && st.after) h += `<span class="note">${st.after}</span>`;
  if (canNext()) h += `<span class="note">Weiter geht es mit „${mode === 'lernen' ? 'Weiter' : 'Nächste Aufgabe'}“.</span>`;
  S.fb = {type:'ok', html:h};
  renderGrid(); renderFeedback(); renderNav();
}

function clearMarks(){
  if (!S.success && !S.fb) return;
  S.success = false; S.fb = null; S.result = null;
  renderFeedback();
}

/* ---------- Autovervollständigung (basis.js): Funktionen dieser Seite ---------- */
const AC_FN = [
  {n:'ANZAHL',     v:'Wert',  d:'Zählt, wie viele Zellen in einem Bereich Zahlen enthalten.'},
  {n:'ANZAHL2',    v:'Wert',  d:'Zählt, wie viele Zellen in einem Bereich nicht leer sind (Zahlen und Text).'},
  {n:'MAX',        v:'Zahl',  d:'Gibt den größten Wert aus einer Reihe von Werten zurück.'},
  {n:'MIN',        v:'Zahl',  d:'Gibt den kleinsten Wert aus einer Reihe von Werten zurück.'},
  {n:'MITTELWERT', v:'Zahl',  d:'Berechnet den Durchschnitt (das arithmetische Mittel) der Argumente.'},
  {n:'SUMME',      v:'Zahl',  d:'Addiert alle Zahlen.'}
];
AC.word = before => { const m = before.match(/[A-Za-zÄÖÜäöüß]+\d*$/); return m && (before.trimStart().startsWith('=') && !/\d$/.test(m[0]) || /^ANZAHL2$/i.test(m[0])) ? m[0] : null; };

/* ---------- Ereignisse ---------- */
document.addEventListener('change', e => {
  if (e.target.id === 'fnsel'){ S.fnsel = e.target.value; clearMarks(); renderGrid(); }
});
document.addEventListener('click', e => {
  if (e.target.closest('#mkBtn')){ openMaker(); return; }
  if (e.target.closest('#mkOk')){ makeBlock(); return; }
  if (e.target.closest('#mkX')){ S.mkOpen = false; S.sel = null; renderPools(); renderGrid(); return; }
  const dl = e.target.closest('[data-del]'); if (dl){ S.made.splice(+dl.dataset.del, 1); renderPools(); return; }
  topicClick(e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.pin')){ e.preventDefault(); if (e.target.id === 'mk') makeBlock(); else check(); }
  if (e.key === 'Escape' && e.target.id === 'mk'){ S.mkOpen = false; renderPools(); }
});
if (mode === 'endlos') newEndless();
loadTask();
</script>
