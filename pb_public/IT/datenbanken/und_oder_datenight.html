<script>
/* Datenight: Herr Maier datet drei Wochen lang jeden Tag dieselbe Person, die Wünsche werden immer verrückter.
   Aufgaben wie in abfragen.html; auch = gleichwertige Bedingungen (z. B. Ko-Regie, Jahrtausend ab 2000). */
const P = ['Frau Montag', 'Herr Dienstag', 'Frau Mittwoch', 'Frau Donnerstag', 'Die Person am Freitag', 'Herr Samstag', 'Frau Sonntag'];
const sagt = (i, w, text) => `<b>${P[i]}</b>${w > 1 ? ` (${w}. Date)` : ''} sagt: „${text}“`;
const NULLTIPP = 'Noch nicht gesehen heißt: keine eigene Bewertung – in SQL <code>eigene_bewertung IS NULL</code>, in Access <code>Ist Null</code>.';
const KUBRICK = s => s.replace(/regie = 'Stanley Kubrick'/g, "regie LIKE '%Kubrick%'");
const AUFGABEN = [
  // Woche 1: die Wünsche vom Access-Arbeitsblatt der Lehrkraft
  {frage:sagt(0, 1, 'Ich will etwas ansehen, das du entweder sehr gut (9 oder besser) oder eher schlecht (4 oder schlechter) fandest.'),
   felder:['titel', 'imdb_bewertung', 'jahr', 'eigene_bewertung'], where:'eigene_bewertung >= 9 OR eigene_bewertung <= 4',
   tipp:'Zwei Bedingungen, von denen <b>eine</b> reichen soll: in SQL <code>OR</code>, in Access zwei verschiedene Zeilen.'},
  {frage:sagt(1, 1, 'Ich will einen Film sehen, der dieses Jahrtausend erschienen ist. Außerdem soll er unter 2 Stunden dauern und du sollst ihn noch nicht gesehen haben.'),
   felder:['titel', 'imdb_bewertung', 'jahr', 'eigene_bewertung'], where:"art = 'Film' AND jahr >= 2001 AND laufzeit < 120 AND eigene_bewertung IS NULL",
   auch:["art = 'Film' AND jahr >= 2000 AND laufzeit < 120 AND eigene_bewertung IS NULL"],
   tipp:'Alle Bedingungen müssen gleichzeitig gelten: in SQL <code>AND</code>, in Access alles in <b>dieselbe</b> Zeile. ' + NULLTIPP},
  {frage:sagt(2, 1, 'Ich will, dass wir eine Fernsehserie anschauen, die als Genre Mystery gelistet hat.'),
   felder:['titel', 'jahr', 'imdb_bewertung'], where:"art = 'Fernsehserie' AND genres LIKE '%Mystery%'", sort:'jahr ASC'},
  {frage:sagt(3, 1, 'Ich will etwas schauen, was die Genres Liebesfilm und Horror bedient.'),
   felder:['titel', 'jahr', 'imdb_bewertung', 'genres'], where:"genres LIKE '%Liebesfilm%' AND genres LIKE '%Horror%'",
   tipp:'Zweimal dasselbe Feld: in Access entweder <code>Wie "*Liebesfilm*" Und Wie "*Horror*"</code> in eine Zelle oder das Feld zweimal in den Entwurf.'},
  {frage:sagt(4, 1, 'Ich will eine Miniserie ganz durchschauen, die vor 2000 erschien.'),
   felder:['titel', 'jahr', 'eigene_bewertung', 'art'], where:"art = 'Miniserie' AND jahr < 2000", sort:'jahr DESC'},
  {frage:sagt(5, 1, 'Ich will einen Film schauen, der in den 1960er Jahren rausgekommen ist.'),
   felder:['titel', 'jahr', 'eigene_bewertung', 'genres'], where:"art = 'Film' AND jahr >= 1960 AND jahr <= 1969", sort:'jahr DESC',
   tipp:'Ein Bereich sind zwei Bedingungen für dasselbe Feld: <code>jahr &gt;= 1960 AND jahr &lt;= 1969</code>, in Access <code>&gt;=1960 Und &lt;=1969</code> oder <code>Zwischen 1960 Und 1969</code>.'},
  {frage:sagt(6, 1, 'Ich will entweder einen Film schauen, der in den 1960er oder 1970er Jahren rausgekommen ist und bei dem Stanley Kubrick Regie führte. Alternativ einen Film von Ridley Scott, den du noch nicht gesehen hast.'),
   felder:['titel', 'jahr', 'eigene_bewertung', 'regie'], sort:'jahr DESC',
   where:"(art = 'Film' AND jahr >= 1960 AND jahr <= 1979 AND regie = 'Stanley Kubrick') OR (art = 'Film' AND regie = 'Ridley Scott' AND eigene_bewertung IS NULL)",
   tipp:'Zwei Alternativen mit je mehreren Bedingungen: in SQL Klammern um jede Alternative, in Access zwei Zeilen – <code>"Film"</code> muss dann in beiden stehen.'},
  // Woche 2: dieselben Personen, die Wünsche werden genauer
  {frage:sagt(0, 2, 'Letztes Mal war mir das zu viel Auswahl. Diesmal will ich Extreme: Entweder du hast eine 10 gegeben oder höchstens eine 3. Aber auf IMDb muss es mindestens 8 Punkte haben – deinem Geschmack traue ich nicht.'),
   felder:['titel', 'eigene_bewertung', 'imdb_bewertung'], where:'(eigene_bewertung = 10 OR eigene_bewertung <= 3) AND imdb_bewertung >= 8',
   tipp:'Klammern entscheiden: <code>(A OR B) AND C</code>. In Access steht C in <b>jeder</b> Zeile.'},
  {frage:sagt(1, 2, 'Wieder etwas, das du noch nicht kennst. Aber kürzer als 100 Minuten, ich muss früh raus. Und lustig soll es sein: eine Komödie oder ein Animationsfilm.'),
   felder:['titel', 'laufzeit', 'genres'], where:"eigene_bewertung IS NULL AND laufzeit < 100 AND (genres LIKE '%Komödie%' OR genres LIKE '%Animation%')"},
  {frage:sagt(2, 2, 'Serien sind super. Mystery oder Science-Fiction, Hauptsache auf IMDb mindestens 8 Punkte. Die besten zuerst!'),
   felder:['titel', 'genres', 'imdb_bewertung'], where:"art = 'Fernsehserie' AND (genres LIKE '%Mystery%' OR genres LIKE '%Science-Fiction%') AND imdb_bewertung >= 8", sort:'imdb_bewertung DESC'},
  {frage:sagt(3, 2, 'Liebe und Horror war schön. Heute darf es auch Liebe im Krieg sein: ein Liebesfilm, der außerdem Horror oder Kriegsfilm ist.'),
   felder:['titel', 'jahr', 'genres'], where:"genres LIKE '%Liebesfilm%' AND (genres LIKE '%Horror%' OR genres LIKE '%Kriegsfilm%')"},
  {frage:sagt(4, 2, 'Eine Serie zum Durchschauen – egal ob Mini- oder Fernsehserie. Aber jede Folge höchstens 30 Minuten, sonst schlafe ich ein.'),
   felder:['titel', 'art', 'laufzeit'], where:"(art = 'Miniserie' OR art = 'Fernsehserie') AND laufzeit <= 30"},
  {frage:sagt(5, 2, 'Die 60er waren toll. Jetzt die 70er! Ein Film, den du noch nicht gesehen hast – oder einer, den du mit mindestens 9 bewertet hast. Den würdest du ja gern nochmal sehen.'),
   felder:['titel', 'jahr', 'eigene_bewertung'], where:"art = 'Film' AND jahr >= 1970 AND jahr <= 1979 AND (eigene_bewertung IS NULL OR eigene_bewertung >= 9)", sort:'jahr ASC'},
  {frage:sagt(6, 2, 'Kubrick oder Ridley Scott, egal aus welchem Jahr. Aber ein Film soll es sein, höchstens zwei Stunden lang, die kürzesten zuerst.'),
   felder:['titel', 'regie', 'laufzeit'], where:"art = 'Film' AND laufzeit <= 120 AND (regie = 'Stanley Kubrick' OR regie = 'Ridley Scott')", sort:'laufzeit ASC'},
  // Woche 3: es wird absurd
  {frage:sagt(0, 3, 'Ich will sehen, wie seltsam dein Geschmack ist: Einträge, bei denen du und IMDb euch völlig uneinig seid. Entweder du hast höchstens 4 gegeben und IMDb mindestens 7,5 – oder du mindestens 9 und IMDb höchstens 6,5.'),
   felder:['titel', 'eigene_bewertung', 'imdb_bewertung'], where:'(eigene_bewertung <= 4 AND imdb_bewertung >= 7.5) OR (eigene_bewertung >= 9 AND imdb_bewertung <= 6.5)'},
  {frage:sagt(1, 3, 'Etwas Ungesehenes, das dich herausfordert: entweder uralt (vor 1960) oder ein Brocken von über drei Stunden.'),
   felder:['titel', 'jahr', 'laufzeit'], where:'eigene_bewertung IS NULL AND (jahr < 1960 OR laufzeit > 180)', sort:'jahr ASC'},
  {frage:sagt(2, 3, 'Mystery-Serien, gerne – aber bitte keine Krimis! Da steckt doch immer ein Mord dahinter.'),
   felder:['titel', 'genres'], where:"art = 'Fernsehserie' AND genres LIKE '%Mystery%' AND genres NOT LIKE '%Krimi%'",
   tipp:'„Enthält nicht“: in SQL <code>NOT LIKE \'%Krimi%\'</code>, in Access <code>Nicht Wie "*Krimi*"</code>.'},
  {frage:sagt(3, 3, 'Entweder Horror, aber nur, wenn du ihn mit mindestens 8 bewertet hast – oder einen Liebesfilm, den du noch nicht kennst. Alphabetisch bitte.'),
   felder:['titel', 'genres', 'eigene_bewertung'], where:"(genres LIKE '%Horror%' AND eigene_bewertung >= 8) OR (genres LIKE '%Liebesfilm%' AND eigene_bewertung IS NULL)", sort:'titel ASC'},
  {frage:sagt(4, 3, 'Ich mag nur Titel, die mit dem Wort „Der“ anfangen. Es soll eine Fernsehserie sein – oder ein Film, der vor 1980 erschien.'),
   felder:['titel', 'art', 'jahr'], where:"titel LIKE 'Der %' AND (art = 'Fernsehserie' OR (art = 'Film' AND jahr < 1980))",
   auch:["titel LIKE 'Der%' AND (art = 'Fernsehserie' OR (art = 'Film' AND jahr < 1980))"]},
  {frage:sagt(5, 3, 'Ein Film aus den 60ern oder 70ern, den du noch nicht gesehen hast, und zwar ein Western oder ein Kriegsfilm. Die längsten zuerst, ich habe Zeit.'),
   felder:['titel', 'jahr', 'laufzeit', 'genres'], where:"art = 'Film' AND jahr >= 1960 AND jahr <= 1979 AND eigene_bewertung IS NULL AND (genres LIKE '%Western%' OR genres LIKE '%Kriegsfilm%')", sort:'laufzeit DESC'},
  {frage:sagt(6, 3, 'Zum Abschluss will ich alles: Entweder einen Film von Stanley Kubrick oder Ridley Scott, den du noch nicht gesehen hast und der vor 1980 erschien – oder einen Film, den du mit mindestens 9 bewertet hast, der auf IMDb mindestens 8,5 hat und kürzer als 100 Minuten ist.'),
   felder:['titel', 'jahr', 'regie', 'eigene_bewertung'], sort:'jahr ASC',
   where:"(art = 'Film' AND eigene_bewertung IS NULL AND jahr < 1980 AND (regie = 'Stanley Kubrick' OR regie = 'Ridley Scott')) OR (art = 'Film' AND eigene_bewertung >= 9 AND imdb_bewertung >= 8.5 AND laufzeit < 100)"}
];
// Ko-Regie (z. B. Spartacus: Stanley Kubrick, Anthony Mann) zählt auch
AUFGABEN.forEach(a => { if (/Stanley Kubrick/.test(a.where)) a.auch = (a.auch || []).concat(KUBRICK(a.where)); });

/* Endlos: zwei oder drei Bedingungen, verknüpft mit UND/ODER */
const ATOME = [
  (r, Z) => ({f:'art', sql:"art = 'Film'", t:'ist ein Film'}),
  (r, Z) => ({f:'art', sql:"art = 'Fernsehserie'", t:'ist eine Fernsehserie'}),
  (r, Z) => { const y = Z.pick1(r, [1960, 1970, 1980, 1990]); return {f:'jahr', sql:`jahr < ${y}`, t:`ist vor ${y} erschienen`}; },
  (r, Z) => { const y = Z.pick1(r, [2000, 2010, 2015]); return {f:'jahr', sql:`jahr >= ${y}`, t:`ist ${y} oder später erschienen`}; },
  (r, Z) => { const m = Z.pick1(r, [90, 100, 120]); return {f:'laufzeit', sql:`laufzeit <= ${m}`, t:`dauert höchstens ${m} Minuten`}; },
  (r, Z) => { const m = Z.pick1(r, [150, 180]); return {f:'laufzeit', sql:`laufzeit > ${m}`, t:`dauert länger als ${m} Minuten`}; },
  (r, Z) => { const x = Z.pick1(r, ['7.5', '8', '8.5']); return {f:'imdb_bewertung', sql:`imdb_bewertung >= ${x}`, t:`hat auf IMDb mindestens ${x.replace('.', ',')} Punkte`}; },
  (r, Z) => { const n = Z.pick1(r, [8, 9]); return {f:'eigene_bewertung', sql:`eigene_bewertung >= ${n}`, t:`hat von Herrn Maier mindestens ${n} Punkte bekommen`}; },
  (r, Z) => { const n = Z.pick1(r, [3, 4, 5]); return {f:'eigene_bewertung', sql:`eigene_bewertung <= ${n}`, t:`hat von Herrn Maier höchstens ${n} Punkte bekommen`}; },
  (r, Z) => ({f:'eigene_bewertung', sql:'eigene_bewertung IS NULL', t:'ist noch nicht gesehen (keine eigene Bewertung)'}),
  (r, Z) => { const g = Z.pick1(r, ['Horror', 'Komödie', 'Animation', 'Western', 'Kriegsfilm', 'Liebesfilm', 'Science-Fiction', 'Mystery', 'Krimi', 'Fantasy']); return {f:'genres', sql:`genres LIKE '%${g}%'`, t:`gehört zum Genre ${g}`}; }
];
function atome(r, Z, n){
  const out = [];
  for (const k of Z.shuffle(ATOME.map((_, i) => i), r)){ const a = ATOME[k](r, Z); if (!out.some(x => x.f === a.f)) out.push(a); if (out.length === n) break; }
  return out;
}
function kombi(r, Z, sqlv, zeilen, at){
  const felder = ['titel', ...new Set(at.map(a => a.f).filter(f => f !== 'art'))];
  return {frage:`Herr Maier plant einen Filmabend. Gesucht sind alle Einträge, für die gilt:<ul class="bed">${zeilen.map(z => `<li>${z}</li>`).join('')}</ul>`, felder, where:sqlv};
}
const b = s => `<b>${s}</b>`;
const ENDLOS = [
  (r, Z) => { const [A, B] = atome(r, Z, 2); return kombi(r, Z, `${A.sql} AND ${B.sql}`, [A.t, b('und') + ' ' + B.t], [A, B]); },
  (r, Z) => { const [A, B] = atome(r, Z, 2); return kombi(r, Z, `${A.sql} OR ${B.sql}`, [A.t, b('oder') + ' ' + B.t], [A, B]); },
  (r, Z) => { const [A, B, C] = atome(r, Z, 3); return kombi(r, Z, `${A.sql} AND ${B.sql} AND ${C.sql}`, [A.t, b('und') + ' ' + B.t, b('und') + ' ' + C.t], [A, B, C]); },
  (r, Z) => { const [A, B, C] = atome(r, Z, 3); return kombi(r, Z, `(${A.sql} OR ${B.sql}) AND ${C.sql}`, [`${A.t} ${b('oder')} ${B.t}`, b('und außerdem') + ' ' + C.t], [A, B, C]); },
  (r, Z) => { const [A, B, C] = atome(r, Z, 3); return kombi(r, Z, `(${A.sql} AND ${B.sql}) OR ${C.sql}`, [`${A.t} ${b('und')} ${B.t}`, b('oder aber') + ' ' + C.t], [A, B, C]); }
];

/* Erarbeitung (nur Access): Kriterien in einer Zeile = UND, in verschiedenen Zeilen = ODER, Wahrheitstabelle.
   Nach dem Merkblatt „Kriterien bei Abfragen“ der Lehrkraft. Weggelassen: Und/Oder in einer Zelle, Feld zweimal im Entwurf. */
const U = '<span class="wort-und">UND</span>', O = '<span class="wort-oder">ODER</span>';
const ja = true, nein = false, frag = l => ({l});
// kleiner Ausschnitt der Tabelle filme (Werte aus filme.js)
const ausschnitt = (spalten, zeilen) => `<table class="ds"><thead><tr>${spalten.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>` +
  zeilen.map(z => '<tr>' + z.map((v, i) => `<td${i ? ' class="z"' : ''}>${String(v).replace('.', ',')}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
// Entwurfsraster als Bild: felder, zeilen = [[Kriterium je Feld], …] (erste Zeile „Kriterien:“, dann „oder:“)
const raster = (titel, felder, zeilen) => `<div class="mini"><div class="mtitel">${titel}</div><div class="agridw"><table class="agrid">` +
  `<tr><th>Feld:</th>${felder.map(f => `<td>${f}</td>`).join('')}</tr><tr><th>Anzeigen:</th>${felder.map(() => '<td class="ashow">☑</td>').join('')}</tr>` +
  zeilen.map((z, r) => `<tr class="krit"><th>${r ? 'oder:' : 'Kriterien:'}</th>${z.map(k => `<td>${k}</td>`).join('')}</tr>`).join('') + '</table></div></div>';
const UND_FILME = [['Oben', 2009, 96], ['Inception', 2010, 148], ['Toy Story', 1995, 81], ['Titanic', 1997, 194], ['Ratatouille', 2007, 111], ['Zurück in die Zukunft', 1985, 116]];
const ODER_FILME = [['Forrest Gump', 9, 8.8], ['Toy Story', 9, 8.3], ['Inception', 8, 8.8], ['Ice Age', 8, 7.5], ['Matrix', 7, 8.7], ['Titanic', 7, 7.9]];
const MERKE_UND = `<div class="merke"><b>Merke: ${U}</b>Kriterien, die in <b>derselben Zeile</b> stehen, müssen <b>alle</b> erfüllt sein, damit ein Datensatz erscheint.</div>`;
const MERKE_ODER = `<div class="merke"><b>Merke: ${O}</b>Kriterien in <b>verschiedenen Zeilen</b> („Kriterien:“ und „oder:“) sind Alternativen. Ein Datensatz erscheint, wenn er die Kriterien <b>einer</b> Zeile erfüllt.</div>`;
const ERARBEITUNG = [
  {titel:'Datenight', html:`<p>Herr Maier hat sich vorgenommen, drei Wochen lang jeden Tag ein Date zu haben – mit Filmabend. Alles, was er je gesehen hat (und alles, was er noch sehen will), steht in seiner Datenbank, in der Tabelle <code>filme</code>.</p>
   <p>Seine Dates haben Wünsche, und meistens besteht ein Wunsch aus <b>mehreren</b> Kriterien. In dieser Erarbeitung lernst du, wie du Kriterien in der Access-Entwurfsansicht mit ${U} und ${O} verknüpfst.</p>
   <p>So funktioniert die Seite: Jeder Schritt erklärt etwas oder stellt eine Aufgabe. Erst wenn sie richtig gelöst ist, geht es mit <b>Weiter</b> zum nächsten Schritt.</p>`},

  {titel:'Wiederholung: Kriterien', arbeit:'Zuordnen',
   html:`<p>Zuerst eine Wiederholung. In der Zeile „Kriterien:“ der Entwurfsansicht steht, welche Datensätze gesucht sind. Bei Text steht <code>*</code> für beliebig viele Zeichen (auch keins), bei Zahlen vergleichst du mit <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>=</code> und <code>&lt;&gt;</code>.</p>`,
   aufgabe:{typ:'zuordnen', frage:'Ordne jedem Kriterium seine Bedeutung zu.',
     felder:[['text', 'Kriterium für Text'], ['zahl', 'Kriterium für Zahlen']],
     karten:[
       {t:'Wie "*Mystery*" – der Text enthält irgendwo „Mystery“', z:'text'},
       {t:'Wie "Der*" – der Text beginnt mit „Der“', z:'text'},
       {t:'"Film" – der Text ist genau „Film“', z:'text'},
       {t:'>=9 – mindestens 9', z:'zahl'},
       {t:'<120 – kleiner als 120', z:'zahl'},
       {t:'<>2000 – nicht 2000', z:'zahl'}]}},

  {titel:'Ein Kriterium', krit:'bloecke',
   html:`<p>Frau Mittwoch ist wählerisch.</p>`,
   access:{frage:'<b>Frau Mittwoch</b> sagt: „Ich schaue nur etwas, das auf IMDb mindestens 9 Punkte hat.“', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 9',
     tipp:'Wähle oben die Felder aus und ziehe das Kriterium in die Zeile „Kriterien:“ unter das richtige Feld.'},
   nachher:'Ein Kriterium – kein Problem. Spannend wird es, wenn mehrere Kriterien zusammenkommen.'},

  {titel:'Zwei Kriterien: Herr Dienstag', arbeit:'Auswählen',
   html:`<p><b>Herr Dienstag</b> sagt: „Ich will etwas sehen, das <b>ab dem Jahr 2000</b> erschienen ist. <b>Außerdem</b> soll es <b>kürzer als 120 Minuten</b> sein, ich muss früh raus.“</p>
   ${ausschnitt(['titel', 'jahr', 'laufzeit'], UND_FILME)}`,
   aufgabe:{typ:'mc', frage:'Welche dieser Filme kommen für Herrn Dienstag in Frage?', multi:true,
     options:UND_FILME.map(f => f[0]), correct:[0, 4],
     why:{1:'Inception ist von 2010, dauert aber 148 Minuten.', 2:'Toy Story ist kurz genug, erschien aber 1995.', 3:'Titanic erfüllt keines der beiden Kriterien.', 5:'Zurück in die Zukunft ist kurz genug, erschien aber 1985.'}},
   nachher:'Genau! Nur die Filme, die <b>beide</b> Kriterien erfüllen, passen.'},

  {titel:'Tabelle: UND', arbeit:'Tabelle ausfüllen',
   html:`<p>Halte das Ergebnis in einer Tabelle fest. Die ersten beiden Spalten zeigen, ob ein Film das jeweilige Kriterium erfüllt.</p>`,
   aufgabe:{typ:'wahrheit', frage:`Erscheint der Datensatz, wenn beide Kriterien mit ${U} verknüpft sind?`,
     spalten:['titel', 'jahr', 'laufzeit', 'Kriterium 1<br><code>jahr: &gt;=2000</code>', 'Kriterium 2<br><code>laufzeit: &lt;120</code>', `${U}<br>erscheint?`],
     zeilen:UND_FILME.map(([t, j, l]) => [t, j, l, j >= 2000, l < 120, frag(j >= 2000 && l < 120)]),
     hinweise:{5:`Bei ${U} erscheint ein Datensatz nur, wenn <b>beide</b> Kriterien erfüllt sind.`}},
   nachher:`Bei ${U} reicht ein einziges „nein“, und der Datensatz fällt heraus.`},

  {titel:'UND im Entwurf', krit:'bloecke',
   html:`${MERKE_UND}<p>Setze den Wunsch von Herrn Dienstag in der Entwurfsansicht um.</p>`,
   access:{frage:'<b>Herr Dienstag</b> sagt: „Ab dem Jahr 2000 erschienen <b>und</b> kürzer als 120 Minuten.“', felder:['titel', 'jahr', 'laufzeit'], where:'jahr >= 2000 AND laufzeit < 120',
     tipp:'Beide Kriterien gehören in <b>dieselbe</b> Zeile („Kriterien:“) – jeweils unter ihr Feld.'},
   nachher:'In SQL wird aus „derselben Zeile“ das Wort <code>AND</code>.'},

  {titel:'Zwei Kriterien: Frau Montag', arbeit:'Auswählen',
   html:`<p><b>Frau Montag</b> sagt: „Ich traue deinem Geschmack nur halb. Zeig mir etwas, das <b>du mit mindestens 9</b> bewertet hast – <b>oder</b> etwas, das <b>auf IMDb mindestens 8,5</b> hat.“</p>
   ${ausschnitt(['titel', 'eigene_bewertung', 'imdb_bewertung'], ODER_FILME)}`,
   aufgabe:{typ:'mc', frage:'Welche dieser Filme kommen für Frau Montag in Frage?', multi:true,
     options:ODER_FILME.map(f => f[0]), correct:[0, 1, 2, 4],
     why:{3:'Ice Age hat von Herrn Maier 8 und auf IMDb 7,5 – keines von beiden reicht.', 5:'Titanic hat 7 und 7,9 – keines von beiden reicht.'}},
   nachher:'Richtig! Hier reicht <b>ein</b> erfülltes Kriterium. Forrest Gump erfüllt sogar beide – auch das passt.'},

  {titel:'Tabelle: ODER', arbeit:'Tabelle ausfüllen',
   aufgabe:{typ:'wahrheit', frage:`Erscheint der Datensatz, wenn die Kriterien mit ${O} verknüpft sind?`,
     spalten:['titel', 'eigene_bewertung', 'imdb_bewertung', 'Kriterium 1<br><code>eigene_bewertung: &gt;=9</code>', 'Kriterium 2<br><code>imdb_bewertung: &gt;=8,5</code>', `${O}<br>erscheint?`],
     zeilen:ODER_FILME.map(([t, e, i]) => [t, e, String(i).replace('.', ','), e >= 9, i >= 8.5, frag(e >= 9 || i >= 8.5)]),
     hinweise:{5:`Bei ${O} erscheint ein Datensatz, wenn <b>mindestens ein</b> Kriterium erfüllt ist – auch wenn beide erfüllt sind.`}},
   nachher:`Bei ${O} reicht ein einziges „ja“, und der Datensatz ist dabei.`},

  {titel:'ODER im Entwurf', krit:'bloecke',
   html:`${MERKE_ODER}<p>Setze den Wunsch von Frau Montag in der Entwurfsansicht um.</p>`,
   access:{frage:'<b>Frau Montag</b> sagt: „Von dir mindestens 9 <b>oder</b> auf IMDb mindestens 8,5.“', felder:['titel', 'eigene_bewertung', 'imdb_bewertung'], where:'eigene_bewertung >= 9 OR imdb_bewertung >= 8.5',
     tipp:'Ein Kriterium kommt in die Zeile „Kriterien:“, das andere in die Zeile „oder:“ darunter.'},
   nachher:'In SQL wird aus „verschiedenen Zeilen“ das Wort <code>OR</code>.'},

  {titel:'Die Tabelle für UND und ODER', arbeit:'Tabelle ausfüllen',
   html:`<p>Fasse zusammen: Für zwei Kriterien gibt es nur vier Möglichkeiten. Die Tabelle gilt für <b>alle</b> Kriterien, egal ob Jahr, Laufzeit oder Genre.</p>`,
   aufgabe:{typ:'wahrheit', frage:'Fülle die Tabelle für UND und ODER vollständig aus.',
     spalten:['Kriterium 1 erfüllt?', 'Kriterium 2 erfüllt?', `${U}<br>(dieselbe Zeile)<br>erscheint?`, `${O}<br>(verschiedene Zeilen)<br>erscheint?`],
     zeilen:[[ja, ja, frag(ja), frag(ja)], [ja, nein, frag(nein), frag(ja)], [nein, ja, frag(nein), frag(ja)], [nein, nein, frag(nein), frag(nein)]],
     hinweise:{2:`${U}: nur „ja“, wenn <b>beide</b> Kriterien erfüllt sind.`, 3:`${O}: „ja“, sobald <b>mindestens eins</b> erfüllt ist.`}},
   nachher:`<div class="merke"><b>Merke</b><ul><li>${U}: Der Datensatz erscheint nur, wenn <b>alle</b> Kriterien erfüllt sind. In Access: alle Kriterien in <b>dieselbe Zeile</b>.</li><li>${O}: Der Datensatz erscheint, wenn <b>mindestens ein</b> Kriterium erfüllt ist. In Access: Kriterien in <b>verschiedene Zeilen</b>.</li></ul></div>`},

  {titel:'Kontrollfrage: Welcher Entwurf?', arbeit:'Auswählen',
   html:`<p>Herr Maier hat zwei Entwürfe gebaut. Der Unterschied ist klein – das Ergebnis nicht.</p>
   <div class="minis">${raster('Entwurf A', ['art', 'jahr'], [['"Film"', '&lt;2000']])}${raster('Entwurf B', ['art', 'jahr'], [['"Film"', ''], ['', '&lt;2000']])}</div>`,
   aufgabe:{typ:'mc', frage:'<b>Herr Samstag</b> will einen Film, der vor 2000 erschienen ist. Welcher Entwurf passt?', options:['Entwurf A', 'Entwurf B'], correct:[0],
     why:{1:'In Entwurf B stehen die Kriterien in verschiedenen Zeilen. Dann reicht eines davon – es kämen auch neue Filme und alte Serien.'},
     danach:{typ:'mc', frage:'Und was findet Entwurf B?', options:['Nur Filme, die vor 2000 erschienen sind', 'Alle Filme, egal aus welchem Jahr, und dazu alles, was vor 2000 erschienen ist (auch Serien)', 'Gar nichts, weil keine Zeile beide Kriterien enthält'], correct:[1],
       why:{0:'Das wäre Entwurf A: beide Kriterien in derselben Zeile.', 2:'Eine leere Zelle bedeutet: Für dieses Feld gibt es in dieser Zeile keine Einschränkung.'}}}},

  {titel:'UND oder ODER?', arbeit:'Zuordnen',
   html:`<p>Nicht jedes „und“ in einem Satz bedeutet ${U}. Überlege immer: Muss ein einzelner Datensatz <b>alle</b> Kriterien gleichzeitig erfüllen – oder reicht <b>eins</b>?</p>`,
   aufgabe:{typ:'zuordnen', frage:'Wie setzt du die Wünsche in Access um?',
     felder:[['und', 'UND: alle Kriterien in dieselbe Zeile'], ['oder', 'ODER: Kriterien in verschiedene Zeilen']],
     karten:[
       {t:'Ein Film, der nach 2010 erschienen ist.', z:'und'},
       {t:'Etwas, das du noch nicht gesehen hast und das kürzer als 90 Minuten ist.', z:'und'},
       {t:'Eine Fernsehserie mit mindestens 9 Punkten auf IMDb.', z:'und'},
       {t:'Etwas von Stanley Kubrick oder von Ridley Scott.', z:'oder'},
       {t:'Ich mag Miniserien und Fernsehserien – Hauptsache eine Serie!', z:'oder'},
       {t:'Entweder sehr alt (vor 1960) oder sehr lang (über 180 Minuten).', z:'oder'}]},
   nachher:'Achtung bei „Miniserien und Fernsehserien“: Ein Eintrag kann nicht gleichzeitig beides sein. Gemeint ist: Miniserie <b>oder</b> Fernsehserie.'},

  {titel:'Selbst eintippen: UND', krit:'text',
   html:`<p>Jetzt ohne Bausteine: Tippe die Kriterien selbst in die Zellen. Texte schreibst du in Anführungszeichen, z. B. <code>"Film"</code>.</p>`,
   access:{frage:'<b>Herr Samstag</b> sagt: „Heute eine <b>Fernsehserie</b>, aber nur eine mit <b>mindestens 9</b> Punkten auf IMDb.“', felder:['titel', 'imdb_bewertung'], where:"art = 'Fernsehserie' AND imdb_bewertung >= 9",
     tipp:'Das Feld <code>art</code> brauchst du nur für das Kriterium – nimm bei „Anzeigen:“ den Haken weg.'}},

  {titel:'Selbst eintippen: ODER', krit:'text',
   html:`<p>Diesmal haben beide Kriterien <b>dasselbe Feld</b>. Das Feld steht nur einmal im Entwurf – die Kriterien stehen in derselben Spalte, aber in verschiedenen Zeilen.</p>`,
   access:{frage:'<b>Frau Sonntag</b> sagt: „Ich will eine Serie! Eine <b>Miniserie</b> oder eine <b>Fernsehserie</b>, das ist mir egal.“', felder:['titel', 'art'], where:"art = 'Miniserie' OR art = 'Fernsehserie'",
     tipp:'<code>"Miniserie"</code> in die Zeile „Kriterien:“, <code>"Fernsehserie"</code> darunter in die Zeile „oder:“.'}},

  {titel:'Geschafft!', final:true,
   html:`<p>Du kannst jetzt Kriterien in der Access-Entwurfsansicht verknüpfen:</p>
   <table class="ds"><thead><tr><th>Kriterium 1</th><th>Kriterium 2</th><th>${U} – dieselbe Zeile</th><th>${O} – verschiedene Zeilen</th></tr></thead><tbody>
   <tr><td>ja</td><td>ja</td><td>erscheint</td><td>erscheint</td></tr><tr><td>ja</td><td>nein</td><td>—</td><td>erscheint</td></tr>
   <tr><td>nein</td><td>ja</td><td>—</td><td>erscheint</td></tr><tr><td>nein</td><td>nein</td><td>—</td><td>—</td></tr></tbody></table>
   <p><b>Ausblick:</b> Reicht die Unterscheidung in Zeilen nicht, kann man in eine Zelle auch mehrere Kriterien schreiben, z. B. <code>&gt;=1960 Und &lt;=1969</code>. Das brauchst du in Woche 2 und 3 der Übungen.</p>
   <p>Jetzt hat Herr Maier drei Wochen Dates vor sich – hilf ihm bei den <b>Übungen</b> oder übe im Modus <b>Endlos</b>.</p>
   <p><button class="btn primary" data-mode-go="pfad">Zu den Übungen</button> <button class="btn" data-mode-go="endlos">Endlos üben</button></p>`}
];
