<!doctype html>
<html lang="de" data-trainer="sqlfrei">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film-Datenbank – vibe learning</title>
<script src="../../katalog.js"></script>
<script src="../../nav.js"></script>
<script src="../../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="../python/lib/codemirror.css">
<link rel="stylesheet" href="lib/show-hint.min.css">
<link rel="stylesheet" href="../excel/basis.css">
<link rel="stylesheet" href="abfragen.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#d9230f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffd23f"/>
  </linearGradient></defs></svg>

<header>
  <div class="hdr-left">
    <div class="brand"><span>&gt;</span>Film-Datenbank<span>;</span></div>
  </div>
  <div class="hdr-right">
    <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel umschalten"></button>
    <div class="flames" id="flames" aria-label="Stufe wählen"></div>
  </div>
</header>

<main>
  <section class="card">
    <div class="meta">
      <span class="lvlname" id="lvlname"></span>
      <span id="taskmeta"></span>
    </div>
    <div class="tasktext" id="tasktext"></div>
  </section>

  <section class="card" id="workcard">
    <div class="worktitle" id="worktitle"></div>
    <div id="work"></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="runBtn" title="Abfrage ausführen (Strg + Enter)">▶ Ausführen</button>
    <button class="btn" id="resetBtn">Zurücksetzen</button>
    <button class="btn" id="tabBtn"></button>
    <!-- braucht basis.js, hier ohne Aufgaben nicht sichtbar -->
    <button id="checkBtn" hidden></button><button id="nextBtn" hidden></button><button id="skipBtn" hidden></button><button id="prevBtn" hidden></button>
  </div>
  <div id="fb"></div>
  <section class="card" id="ergebnis" style="display:none"></section>
</main>

<div class="dock" id="dock"></div>

<script src="filme.js"></script>
<script src="lib/sql-asm.js"></script>
<script src="../python/lib/codemirror.min.js"></script>
<script src="lib/show-hint.min.js"></script>
<script src="../excel/basis.js"></script>
<script>
/* Freie Abfragen ohne Aufgaben: abfragen.js schaltet Prüfen, Modi und Dock ab. */
window.SQLKURS = {
  id: 'sqlfrei',
  tabelle: DB_FILME,
  intro: 'Die Tabelle <code>filme</code> enthält die Sammlung von Herrn Maier: 888 Filme und Serien. 484 davon hat er bewertet, die übrigen stehen noch auf seiner Merkliste (<code>eigene_bewertung</code> ist dort leer). Stelle eigene Abfragen – das Ergebnis erscheint unten als Tabelle.',
  stufen: [null,
    {name:'Felder anklicken, Bedingung als Baustein', ui:'block'},
    {name:'Felder anklicken, Bedingung eintippen',    ui:'text'},
    {name:'SQL mit Gerüst und Erklärung',             ui:'sql', vorlage:'erklaert'},
    {name:'SQL mit Gerüst',                           ui:'sql', vorlage:'geruest'},
    {name:'SQL ohne Hilfe',                           ui:'sql', vorlage:'leer'}
  ]
};
</script>
<script src="abfragen.js"></script>
</body>
</html>
