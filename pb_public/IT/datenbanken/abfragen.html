<script>
/* Aufgaben: frage, felder (angezeigt), where (Bedingung), sort, tipp (nur Stufe 1–3).
   Die Musterlösung baut abfragen.js daraus: SELECT felder FROM filme WHERE … ORDER BY … */
const AUFGABEN = [
  {frage:'Herr Maier möchte sich zuerst einen Überblick über seine ganze Sammlung verschaffen.', felder:['*'],
   tipp:'Mit <code>*</code> werden alle Felder angezeigt.'},
  {frage:'Für eine Liste zum Ausdrucken braucht er nur Titel und Erscheinungsjahr.', felder:['titel', 'jahr']},
  {frage:'Wer hat bei welchem Eintrag Regie geführt und wie gut ist er auf IMDb bewertet?', felder:['titel', 'regie', 'imdb_bewertung']},
  {frage:'Welche Filme von David Fincher stehen in der Sammlung?', felder:['titel', 'jahr'], where:"regie = 'David Fincher'",
   tipp:"Texte stehen in SQL in einfachen Anführungszeichen: <code>'David Fincher'</code>. Das Zeichen <code>'</code> tippst du mit Shift + #."},
  {frage:'Welche Fernsehserien stehen in der Sammlung?', felder:['titel', 'jahr'], where:"art = 'Fernsehserie'"},
  {frage:'Welche Einträge fand Herr Maier perfekt? Er hat ihnen eine 10 gegeben.', felder:['titel', 'regie', 'jahr'], where:'eigene_bewertung = 10',
   tipp:'Zahlen schreibt man ohne Anführungszeichen.'},
  {frage:'Welche Einträge sind vor 1970 erschienen?', felder:['titel', 'jahr'], where:'jahr < 1970',
   tipp:'Vergleichszeichen: <code>=</code> gleich, <code>&lt;&gt;</code> ungleich, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>'},
  {frage:'Welche Filme dauern länger als drei Stunden (180 Minuten)?', felder:['titel', 'laufzeit'], where:'laufzeit > 180'},
  {frage:'Welche Einträge haben auf IMDb mindestens 8.5 Punkte?', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 8.5',
   tipp:'Kommazahlen schreibt man in SQL mit Punkt: <code>8.5</code>'},
  {frage:'Was fand Herr Maier richtig schlecht? Gesucht sind alle Einträge mit einer eigenen Bewertung von höchstens 3.', felder:['titel', 'eigene_bewertung', 'imdb_bewertung'], where:'eigene_bewertung <= 3'},
  {frage:'Welche Einträge sind keine Filme?', felder:['titel', 'art'], where:"art <> 'Film'",
   tipp:'<code>&lt;&gt;</code> bedeutet „ungleich“.'},
  {frage:'Welche Filme von Christopher Nolan stehen in der Sammlung? Die ältesten sollen oben stehen.', felder:['titel', 'jahr'], where:"regie = 'Christopher Nolan'", sort:'jahr ASC',
   tipp:'<code>ORDER BY jahr ASC</code> sortiert aufsteigend (klein → groß), <code>DESC</code> absteigend (groß → klein).'},
  {frage:'Welche Einträge haben auf IMDb mehr als 8.7 Punkte? Die besten sollen oben stehen.', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung > 8.7', sort:'imdb_bewertung DESC'},
  {frage:'Welche Einträge sind 2019 erschienen? Sortiere die Titel von A bis Z.', felder:['titel', 'art', 'jahr'], where:'jahr = 2019', sort:'titel ASC'},
  {frage:'Herr Maier sucht alle Harry-Potter-Filme.', felder:['titel', 'jahr'], where:"titel LIKE 'Harry Potter%'",
   tipp:"<code>LIKE</code> vergleicht mit einem Muster. <code>%</code> steht für beliebig viele Zeichen: <code>'Harry Potter%'</code> heißt „beginnt mit Harry Potter“."},
  {frage:'Welche Einträge gehören (auch) zum Genre Horror?', felder:['titel', 'jahr', 'genres'], where:"genres LIKE '%Horror%'",
   tipp:"<code>'%Horror%'</code> findet Horror an jeder Stelle im Text, auch wenn noch andere Genres dabeistehen."},
  {frage:'Bei welchen Einträgen war Quentin Tarantino an der Regie beteiligt – allein oder zusammen mit anderen?', felder:['titel', 'regie'], where:"regie LIKE '%Tarantino%'"},
  {frage:'Bei welchen Filmen haben die Coen-Brüder Regie geführt? Die ältesten sollen oben stehen.', felder:['titel', 'regie', 'jahr'], where:"regie LIKE '%Coen%'", sort:'jahr ASC'},
  {frage:'Herr Maier hat Lust auf einen Western. Die neuesten sollen oben stehen.', felder:['titel', 'jahr', 'genres'], where:"genres LIKE '%Western%'", sort:'jahr DESC'},
  {frage:'Unter welchem deutschen Titel lief der Film mit dem Originaltitel „In Bruges“?', felder:['titel', 'originaltitel', 'jahr'], where:"originaltitel = 'In Bruges'"},
  {frage:'Bei welchen Einträgen ist keine Regie eingetragen?', felder:['titel', 'art'], where:'regie IS NULL',
   tipp:"Leere Felder findet man mit <code>IS NULL</code>, nicht mit <code>= ''</code>."},
  {frage:'Was hat Herr Maier seit dem 1. Januar 2025 gesehen? Sortiere nach dem Datum, das älteste zuerst.', felder:['titel', 'gesehen_am'], where:"gesehen_am >= '2025-01-01'", sort:'gesehen_am ASC',
   tipp:"Ein Datum schreibt man wie einen Text: <code>'2025-01-01'</code> (Jahr-Monat-Tag)."}
];

/* Endlos: jede Vorlage würfelt eine Aufgabe. Z.liste(sql) liefert die erste Spalte aller Zeilen. */
const q = s => "'" + s.replace(/'/g, "''") + "'";
const extra = (r, Z, pflicht, pool, n) => pflicht.concat(Z.shuffle(pool.filter(f => !pflicht.includes(f)), r).slice(0, n));
const sortiere = (r, felder, f, ab) => r() < 0.35 && felder.includes(f) ? f + (ab ? ' DESC' : ' ASC') : undefined;
const ENDLOS = [
  (r, Z) => { const d = Z.pick1(r, Z.liste("SELECT regie FROM filme WHERE regie NOT LIKE '%,%' GROUP BY regie HAVING COUNT(*) >= 3 AND COUNT(*) = (SELECT COUNT(*) FROM filme f WHERE f.regie LIKE '%' || filme.regie || '%')"));
    const f = extra(r, Z, ['titel'], ['jahr', 'imdb_bewertung', 'eigene_bewertung', 'genres'], 1 + Z.ri(r, 0, 1));
    return {frage:`Bei welchen Einträgen hat ${d} Regie geführt?`, felder:f, where:`regie = ${q(d)}`, sort:sortiere(r, f, 'jahr')}; },
  (r, Z) => { const a = Z.pick1(r, ['Fernsehserie', 'Miniserie', 'Kurzfilm', 'Video']);
    const f = extra(r, Z, ['titel', 'art'], ['jahr', 'imdb_bewertung', 'laufzeit'], 1);
    return {frage:`Welche Einträge der Art „${a}“ stehen in der Sammlung?`, felder:f, where:`art = ${q(a)}`}; },
  (r, Z) => { const y = Z.pick1(r, [1960, 1970, 1975, 1980, 1985, 1990]); const f = extra(r, Z, ['titel', 'jahr'], ['regie', 'eigene_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge sind vor ${y} erschienen?`, felder:f, where:`jahr < ${y}`, sort:sortiere(r, f, 'jahr')}; },
  (r, Z) => { const y = Z.pick1(r, Z.liste('SELECT jahr FROM filme GROUP BY jahr HAVING COUNT(*) BETWEEN 4 AND 40'));
    const f = extra(r, Z, ['titel'], ['jahr', 'art', 'regie', 'imdb_bewertung'], 1 + Z.ri(r, 0, 1));
    return {frage:`Welche Einträge sind im Jahr ${y} erschienen?`, felder:f, where:`jahr = ${y}`, sort:sortiere(r, f, 'titel')}; },
  (r, Z) => { const kurz = r() < 0.5, m = kurz ? Z.pick1(r, [80, 85, 90]) : Z.pick1(r, [150, 160, 170]);
    const f = extra(r, Z, ['titel', 'laufzeit'], ['art', 'jahr'], Z.ri(r, 0, 1));
    return {frage: kurz ? `Welche Einträge dauern weniger als ${m} Minuten?` : `Welche Einträge dauern länger als ${m} Minuten?`, felder:f, where:`laufzeit ${kurz ? '<' : '>'} ${m}`, sort:sortiere(r, f, 'laufzeit', !kurz)}; },
  (r, Z) => { const x = Z.pick1(r, ['8.3', '8.5', '8.6', '8.8']); const f = extra(r, Z, ['titel', 'imdb_bewertung'], ['jahr', 'eigene_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge haben auf IMDb mindestens ${x} Punkte?`, felder:f, where:`imdb_bewertung >= ${x}`, sort:sortiere(r, f, 'imdb_bewertung', true)}; },
  (r, Z) => { const v = Z.pick1(r, [['= 10', 'genau 10 Punkte'], ['= 9', 'genau 9 Punkte'], ['<= 3', 'höchstens 3 Punkte'], ['<= 4', 'höchstens 4 Punkte'], ['= 2', 'genau 2 Punkte']]);
    const f = extra(r, Z, ['titel', 'eigene_bewertung'], ['jahr', 'regie', 'imdb_bewertung'], 1);
    return {frage:`Welchen Einträgen hat Herr Maier ${v[1]} gegeben?`, felder:f, where:`eigene_bewertung ${v[0]}`}; },
  (r, Z) => { const g = Z.pick1(r, ['Western', 'Horror', 'Animation', 'Musical', 'Kriegsfilm', 'Sportfilm', 'Biografie', 'Fantasy', 'Dokumentarfilm', 'Geschichte']);
    const f = extra(r, Z, ['titel', 'genres'], ['jahr', 'imdb_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge gehören (auch) zum Genre ${g}?`, felder:f, where:`genres LIKE ${q('%' + g + '%')}`, sort:sortiere(r, f, 'jahr', r() < 0.5)}; },
  (r, Z) => { const t = Z.pick1(r, Z.liste("SELECT titel FROM filme WHERE art = 'Film' AND regie IS NOT NULL"));
    const f = extra(r, Z, ['titel'], ['jahr', 'regie', 'laufzeit', 'eigene_bewertung'], 2);
    return {frage:`Herr Maier will mehr über den Film „${t}“ wissen.`, felder:f, where:`titel = ${q(t)}`}; },
  (r, Z) => { const n = Z.pick1(r, ['Coen', 'Nolan', 'Kubrick', 'Spielberg', 'Scorsese', 'Fincher', 'Leone', 'Jackson']);
    const f = extra(r, Z, ['titel', 'regie'], ['jahr', 'imdb_bewertung'], 1);
    return {frage:`Bei welchen Einträgen hat jemand mit dem Nachnamen ${n} Regie geführt?`, felder:f, where:`regie LIKE ${q('%' + n + '%')}`, sort:sortiere(r, f, 'jahr')}; }
];

window.SQLKURS = {
  id: 'sql',
  tabelle: DB_FILME,
  stufen: [null,
    {name:'Felder anklicken, Bedingung als Baustein', ui:'block'},
    {name:'Felder anklicken, Bedingung eintippen',    ui:'text'},
    {name:'SQL mit Gerüst und Erklärung',             ui:'sql', vorlage:'erklaert'},
    {name:'SQL mit Gerüst',                           ui:'sql', vorlage:'geruest'},
    {name:'SQL ohne Hilfe',                           ui:'sql', vorlage:'leer'}
  ],
  aufgaben: AUFGABEN,
  endlos: ENDLOS
};
</script>
