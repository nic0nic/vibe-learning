<script>
/* Aufgaben: frage, felder (angezeigt), where (Bedingung), sort, tipp (nur Stufe 1–3).
   Die Musterlösung baut abfragen.js daraus: SELECT felder FROM filme WHERE … ORDER BY … */
const AUFGABEN = [
  {frage:'Herr Maier möchte sich zuerst einen Überblick über seine ganze Sammlung verschaffen.', felder:['*'],
   tipp:'Mit <code>*</code> werden alle Felder angezeigt.'},
  {frage:'Für eine Liste zum Ausdrucken braucht er nur Titel und Erscheinungsjahr.', felder:['titel', 'jahr']},
  {frage:'Wer hat bei welchem Eintrag Regie geführt und wie gut ist er auf IMDb bewertet?', felder:['titel', 'regie', 'imdb_bewertung']},
  {frage:'Welche Filme von David Fincher stehen in der Sammlung?', felder:['titel', 'jahr'], where:"regie = 'David Fincher'",
   tipp:"Texte stehen in SQL in einfachen Anführungszeichen: <code>'David Fincher'</code>. Das Zeichen <code>'</code> tippst du mit Shift + #."},
  {frage:'Welche Fernsehserien stehen in der Sammlung?', felder:['titel', 'jahr'], where:"art = 'Fernsehserie'"},
  {frage:'Welche Einträge fand Herr Maier perfekt? Er hat ihnen eine 10 gegeben.', felder:['titel', 'regie', 'jahr'], where:'eigene_bewertung = 10',
   tipp:'Zahlen schreibt man ohne Anführungszeichen.'},
  {frage:'Welche Einträge sind vor 1970 erschienen?', felder:['titel', 'jahr'], where:'jahr < 1970',
   tipp:'Vergleichszeichen: <code>=</code> gleich, <code>&lt;&gt;</code> ungleich, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>'},
  {frage:'Welche Filme dauern länger als drei Stunden (180 Minuten)?', felder:['titel', 'laufzeit'], where:'laufzeit > 180'},
  {frage:'Welche Einträge haben auf IMDb mindestens 8.5 Punkte?', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 8.5',
   tipp:'Kommazahlen schreibt man in SQL mit Punkt: <code>8.5</code>'},
  {frage:'Was fand Herr Maier richtig schlecht? Gesucht sind alle Einträge mit einer eigenen Bewertung von höchstens 3.', felder:['titel', 'eigene_bewertung', 'imdb_bewertung'], where:'eigene_bewertung <= 3'},
  {frage:'Welche Einträge sind keine Filme?', felder:['titel', 'art'], where:"art <> 'Film'",
   tipp:'<code>&lt;&gt;</code> bedeutet „ungleich“.'},
  {frage:'Welche Filme von Christopher Nolan stehen in der Sammlung? Die ältesten sollen oben stehen.', felder:['titel', 'jahr'], where:"regie = 'Christopher Nolan'", sort:'jahr ASC',
   tipp:'<code>ORDER BY jahr ASC</code> sortiert aufsteigend (klein → groß), <code>DESC</code> absteigend (groß → klein).'},
  {frage:'Welche Einträge haben auf IMDb mehr als 8.7 Punkte? Die besten sollen oben stehen.', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung > 8.7', sort:'imdb_bewertung DESC'},
  {frage:'Welche Einträge sind 2019 erschienen? Sortiere die Titel von A bis Z.', felder:['titel', 'art', 'jahr'], where:'jahr = 2019', sort:'titel ASC'},
  {frage:'Herr Maier sucht alle Harry-Potter-Filme.', felder:['titel', 'jahr'], where:"titel LIKE 'Harry Potter%'",
   tipp:"<code>LIKE</code> vergleicht mit einem Muster. <code>%</code> steht für beliebig viele Zeichen: <code>'Harry Potter%'</code> heißt „beginnt mit Harry Potter“."},
  {frage:'Welche Einträge gehören (auch) zum Genre Horror?', felder:['titel', 'jahr', 'genres'], where:"genres LIKE '%Horror%'",
   tipp:"<code>'%Horror%'</code> findet Horror an jeder Stelle im Text, auch wenn noch andere Genres dabeistehen."},
  {frage:'Bei welchen Einträgen war Quentin Tarantino an der Regie beteiligt – allein oder zusammen mit anderen?', felder:['titel', 'regie'], where:"regie LIKE '%Tarantino%'"},
  {frage:'Bei welchen Filmen haben die Coen-Brüder Regie geführt? Die ältesten sollen oben stehen.', felder:['titel', 'regie', 'jahr'], where:"regie LIKE '%Coen%'", sort:'jahr ASC'},
  {frage:'Herr Maier hat Lust auf einen Western. Die neuesten sollen oben stehen.', felder:['titel', 'jahr', 'genres'], where:"genres LIKE '%Western%'", sort:'jahr DESC'},
  {frage:'Unter welchem deutschen Titel lief der Film mit dem Originaltitel „In Bruges“?', felder:['titel', 'originaltitel', 'jahr'], where:"originaltitel = 'In Bruges'"},
  {frage:'Bei welchen Einträgen ist keine Regie eingetragen?', felder:['titel', 'art'], where:'regie IS NULL',
   tipp:"Leere Felder findet man mit <code>IS NULL</code>, nicht mit <code>= ''</code>."},
  {frage:'Was hat Herr Maier seit dem 1. Januar 2025 gesehen? Sortiere nach dem Datum, das älteste zuerst.', felder:['titel', 'gesehen_am'], where:"gesehen_am >= '2025-01-01'", sort:'gesehen_am ASC',
   tipp:"Ein Datum schreibt man wie einen Text: <code>'2025-01-01'</code> (Jahr-Monat-Tag)."}
];

/* Endlos: jede Vorlage würfelt eine Aufgabe. Z.liste(sql) liefert die erste Spalte aller Zeilen. */
const q = s => "'" + s.replace(/'/g, "''") + "'";
const extra = (r, Z, pflicht, pool, n) => pflicht.concat(Z.shuffle(pool.filter(f => !pflicht.includes(f)), r).slice(0, n));
const sortiere = (r, felder, f, ab) => r() < 0.35 && felder.includes(f) ? f + (ab ? ' DESC' : ' ASC') : undefined;
const ENDLOS = [
  (r, Z) => { const d = Z.pick1(r, Z.liste("SELECT regie FROM filme WHERE regie NOT LIKE '%,%' GROUP BY regie HAVING COUNT(*) >= 3 AND COUNT(*) = (SELECT COUNT(*) FROM filme f WHERE f.regie LIKE '%' || filme.regie || '%')"));
    const f = extra(r, Z, ['titel'], ['jahr', 'imdb_bewertung', 'eigene_bewertung', 'genres'], 1 + Z.ri(r, 0, 1));
    return {frage:`Bei welchen Einträgen hat ${d} Regie geführt?`, felder:f, where:`regie = ${q(d)}`, sort:sortiere(r, f, 'jahr')}; },
  (r, Z) => { const a = Z.pick1(r, ['Fernsehserie', 'Miniserie', 'Kurzfilm', 'Video']);
    const f = extra(r, Z, ['titel', 'art'], ['jahr', 'imdb_bewertung', 'laufzeit'], 1);
    return {frage:`Welche Einträge der Art „${a}“ stehen in der Sammlung?`, felder:f, where:`art = ${q(a)}`}; },
  (r, Z) => { const y = Z.pick1(r, [1960, 1970, 1975, 1980, 1985, 1990]); const f = extra(r, Z, ['titel', 'jahr'], ['regie', 'eigene_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge sind vor ${y} erschienen?`, felder:f, where:`jahr < ${y}`, sort:sortiere(r, f, 'jahr')}; },
  (r, Z) => { const y = Z.pick1(r, Z.liste('SELECT jahr FROM filme GROUP BY jahr HAVING COUNT(*) BETWEEN 4 AND 40'));
    const f = extra(r, Z, ['titel'], ['jahr', 'art', 'regie', 'imdb_bewertung'], 1 + Z.ri(r, 0, 1));
    return {frage:`Welche Einträge sind im Jahr ${y} erschienen?`, felder:f, where:`jahr = ${y}`, sort:sortiere(r, f, 'titel')}; },
  (r, Z) => { const kurz = r() < 0.5, m = kurz ? Z.pick1(r, [80, 85, 90]) : Z.pick1(r, [150, 160, 170]);
    const f = extra(r, Z, ['titel', 'laufzeit'], ['art', 'jahr'], Z.ri(r, 0, 1));
    return {frage: kurz ? `Welche Einträge dauern weniger als ${m} Minuten?` : `Welche Einträge dauern länger als ${m} Minuten?`, felder:f, where:`laufzeit ${kurz ? '<' : '>'} ${m}`, sort:sortiere(r, f, 'laufzeit', !kurz)}; },
  (r, Z) => { const x = Z.pick1(r, ['8.3', '8.5', '8.6', '8.8']); const f = extra(r, Z, ['titel', 'imdb_bewertung'], ['jahr', 'eigene_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge haben auf IMDb mindestens ${x} Punkte?`, felder:f, where:`imdb_bewertung >= ${x}`, sort:sortiere(r, f, 'imdb_bewertung', true)}; },
  (r, Z) => { const v = Z.pick1(r, [['= 10', 'genau 10 Punkte'], ['= 9', 'genau 9 Punkte'], ['<= 3', 'höchstens 3 Punkte'], ['<= 4', 'höchstens 4 Punkte'], ['= 2', 'genau 2 Punkte']]);
    const f = extra(r, Z, ['titel', 'eigene_bewertung'], ['jahr', 'regie', 'imdb_bewertung'], 1);
    return {frage:`Welchen Einträgen hat Herr Maier ${v[1]} gegeben?`, felder:f, where:`eigene_bewertung ${v[0]}`}; },
  (r, Z) => { const g = Z.pick1(r, ['Western', 'Horror', 'Animation', 'Musical', 'Kriegsfilm', 'Sportfilm', 'Biografie', 'Fantasy', 'Dokumentarfilm', 'Geschichte']);
    const f = extra(r, Z, ['titel', 'genres'], ['jahr', 'imdb_bewertung'], Z.ri(r, 0, 1));
    return {frage:`Welche Einträge gehören (auch) zum Genre ${g}?`, felder:f, where:`genres LIKE ${q('%' + g + '%')}`, sort:sortiere(r, f, 'jahr', r() < 0.5)}; },
  (r, Z) => { const t = Z.pick1(r, Z.liste("SELECT titel FROM filme WHERE art = 'Film' AND regie IS NOT NULL"));
    const f = extra(r, Z, ['titel'], ['jahr', 'regie', 'laufzeit', 'eigene_bewertung'], 2);
    return {frage:`Herr Maier will mehr über den Film „${t}“ wissen.`, felder:f, where:`titel = ${q(t)}`}; },
  (r, Z) => { const n = Z.pick1(r, ['Coen', 'Nolan', 'Kubrick', 'Spielberg', 'Scorsese', 'Fincher', 'Leone', 'Jackson']);
    const f = extra(r, Z, ['titel', 'regie'], ['jahr', 'imdb_bewertung'], 1);
    return {frage:`Bei welchen Einträgen hat jemand mit dem Nachnamen ${n} Regie geführt?`, felder:f, where:`regie LIKE ${q('%' + n + '%')}`, sort:sortiere(r, f, 'jahr')}; }
];

/* Erarbeitung: Teile einer Abfrage zeigen → Abfragen abändern → Bedingungen ziehen.
   SELECT immer durch Anklicken im Tabfenster. SQL in <pre class="sqlv"> färbt abfragen.js ein. */
const sql = s => `<pre class="sqlv cm-s-default">${s}</pre>`;
const AUSF = 'Klicke auf <b>▶ Ausführen</b> und sieh dir das Ergebnis an.';
const NOLAN = "regie = 'Christopher Nolan'";
const ERARBEITUNG = [
  {titel:'Herr Maiers Filmsammlung', html:`<p>Herr Maier hat alle Filme und Serien, die er gesehen hat oder noch sehen will, in einer Datenbank gesammelt – in der Tabelle <code>filme</code>. Jede <b>Zeile</b> ist ein Datensatz (ein Film oder eine Serie), jede <b>Spalte</b> ein Feld, z. B. <code>titel</code> oder <code>jahr</code>.</p>
   <p>Will er etwas wissen, stellt er der Datenbank eine Frage: eine <b>Abfrage</b>. In SQL besteht sie aus bis zu vier Teilen, immer in dieser Reihenfolge:</p>
   <table class="teile"><tr><td>SELECT</td><td>Welche <b>Spalten</b> (Felder) sollen angezeigt werden?</td></tr><tr><td>FROM</td><td>Aus welcher <b>Tabelle</b> kommen die Daten?</td></tr>
   <tr><td>WHERE</td><td>Welche <b>Datensätze</b> (Zeilen) sollen erscheinen? – eine Bedingung</td></tr><tr><td>ORDER BY</td><td>In welcher <b>Reihenfolge</b>?</td></tr></table>
   <p>In dieser Erarbeitung siehst du zuerst fertige Abfragen, dann änderst du Abfragen ab, und am Ende baust du sie selbst: Die Felder wählst du im <b>Tabfenster</b> durch Anklicken, Bedingungen ziehst du in die WHERE-Zeile.</p>
   <p>💡 Oben rechts kannst du die <b>Tooltipps</b> einschalten. Dann erklärt die Seite jeden Begriff und jeden Baustein, über den du mit der Maus fährst.</p>`},

  // 1. Abfragen zeigen
  {titel:'SELECT und FROM', ui:'block', zeigen:true, auftrag:AUSF,
   html:`<p>Die einfachste Abfrage hat nur zwei Teile:</p>${sql('SELECT titel, jahr\nFROM filme')}
   <ul><li><code>SELECT titel, jahr</code> – zeige die Felder <code>titel</code> und <code>jahr</code>,</li><li><code>FROM filme</code> – aus der Tabelle <code>filme</code>.</li></ul>
   <p>Unten steht dieselbe Abfrage in der <b>Entwurfsansicht</b>. Links ist das <b>Tabfenster</b> mit allen Feldern der Tabelle. Die Felder für SELECT sind dort angeklickt.</p>`,
   entwurf:{felder:['titel', 'jahr']},
   nachher:'Das Ergebnis hat nur die zwei Spalten <code>titel</code> und <code>jahr</code> – aber <b>alle</b> Datensätze der Tabelle. SELECT wählt <b>Spalten</b> aus. Mit <code>*</code> statt der Feldnamen würden alle Spalten angezeigt.'},

  {titel:'WHERE', ui:'block', zeigen:true, auftrag:AUSF,
   html:`<p>Meist will Herr Maier nicht alle Datensätze sehen, sondern nur bestimmte, z. B. die alten Filme. Dafür gibt es <code>WHERE</code> mit einer <b>Bedingung</b>:</p>${sql('SELECT titel, jahr\nFROM filme\nWHERE jahr &lt; 1960')}
   <p>Die Bedingung <code>jahr &lt; 1960</code> besteht aus einem <b>Feld</b>, einem <b>Vergleichszeichen</b> und einem <b>Wert</b>. Im Entwurf steht sie als Baustein in der Zeile WHERE.</p>`,
   entwurf:{felder:['titel', 'jahr'], where:'jahr < 1960'},
   nachher:'Jetzt erscheinen nur noch die Datensätze, die vor 1960 erschienen sind – wie viele es sind, steht über dem Ergebnis. WHERE wählt <b>Zeilen</b> aus.'},

  {titel:'ORDER BY', ui:'block', zeigen:true, auftrag:AUSF,
   html:`<p>Ohne Sortierung erscheinen die Datensätze in der Reihenfolge der Tabelle. Mit <code>ORDER BY</code> sortierst du nach einem Feld:</p>${sql('SELECT titel, imdb_bewertung\nFROM filme\nWHERE imdb_bewertung &gt;= 8.8\nORDER BY imdb_bewertung DESC')}
   <ul><li><code>ASC</code> – aufsteigend: A → Z, 1 → 9</li><li><code>DESC</code> – absteigend: Z → A, 9 → 1</li></ul>`,
   entwurf:{felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 8.8', sort:'imdb_bewertung DESC'},
   nachher:'Ganz oben steht der Eintrag mit der besten IMDb-Bewertung. ORDER BY ändert nur die <b>Reihenfolge</b> – welche Datensätze erscheinen, bestimmt WHERE.'},

  {titel:'Die vier Teile', arbeit:'Zuordnen',
   aufgabe:{typ:'zuordnen', frage:'Zu welchem Teil der Abfrage gehört das?',
     felder:[['s', 'SELECT'], ['f', 'FROM'], ['w', 'WHERE'], ['o', 'ORDER BY']],
     karten:[
       {t:'wählt die Spalten (Felder) aus', z:'s'}, {t:'* – alle Felder', z:'s'},
       {t:'nennt die Tabelle', z:'f'}, {t:'filme', z:'f'},
       {t:'wählt die Datensätze (Zeilen) mit einer Bedingung aus', z:'w'}, {t:'jahr &lt; 1960', z:'w'},
       {t:'legt die Reihenfolge fest', z:'o'}, {t:'DESC – absteigend', z:'o'}]}},

  {titel:'Eine Abfrage lesen', arbeit:'Auswählen',
   html:`<p>Herr Maier hat diese Abfrage geschrieben:</p>${sql('SELECT titel, laufzeit\nFROM filme\nWHERE laufzeit &gt; 180\nORDER BY laufzeit DESC')}`,
   aufgabe:{typ:'mc', frage:'Was zeigt die Abfrage?',
     options:['Titel und Laufzeit aller Einträge, die länger als 180 Minuten dauern – der längste oben',
       'Titel und Laufzeit aller Einträge – der längste oben',
       'Alle Felder der Einträge, die länger als 180 Minuten dauern',
       'Titel und Laufzeit aller Einträge, die länger als 180 Minuten dauern – der kürzeste oben'], correct:[0],
     why:{1:'WHERE laufzeit > 180 lässt nur die Einträge durch, die länger als 180 Minuten dauern.', 2:'SELECT nennt nur zwei Felder: titel und laufzeit.', 3:'DESC sortiert absteigend: die größte Laufzeit steht oben.'}}},

  // 2. Abfragen abändern
  {titel:'Abändern: SELECT', ui:'block', vorgabe:{felder:['titel', 'jahr'], where:NOLAN},
   html:`<p>Ab jetzt änderst du fertige Abfragen ab. Diese Abfrage zeigt Titel und Jahr aller Filme von Christopher Nolan – führe sie ruhig zuerst aus.</p>`,
   entwurf:{frage:'Herr Maier will bei den Nolan-Filmen statt des Jahres sehen, wie gut sie auf IMDb bewertet sind.', felder:['titel', 'imdb_bewertung'], where:NOLAN,
     tipp:'Klicke im Tabfenster auf <code>jahr</code> (herausnehmen) und auf <code>imdb_bewertung</code> (aufnehmen).'},
   nachher:'SELECT änderst du, indem du im Tabfenster Felder an- und abklickst.'},

  {titel:'Abändern: der Wert', ui:'block', vorgabe:{felder:['titel', 'imdb_bewertung'], where:NOLAN},
   html:`<p>Herr Maier will dieselbe Liste für einen anderen Regisseur.</p>`,
   entwurf:{frage:'Welche Filme von Steven Spielberg stehen in der Sammlung?', felder:['titel', 'imdb_bewertung'], where:"regie = 'Steven Spielberg'",
     tipp:'Ändere nur den Wert im Bedingungs-Baustein. Die Anführungszeichen setzt der Entwurf selbst – schau in die SQL-Vorschau.'},
   nachher:"In SQL steht ein Text in einfachen Anführungszeichen: <code>'Steven Spielberg'</code>."},

  {titel:'Abändern: das Vergleichszeichen', ui:'block', vorgabe:{felder:['titel', 'jahr'], where:'jahr < 1960'},
   html:`<p>Diese Abfrage findet die alten Filme. Herr Maier will jetzt das Gegenteil: die ganz neuen.</p>`,
   entwurf:{frage:'Welche Einträge sind <b>ab</b> 2023 erschienen?', felder:['titel', 'jahr'], where:'jahr >= 2023',
     tipp:'„ab 2023“ heißt: 2023 gehört dazu. Ändere das Vergleichszeichen und den Wert.'},
   nachher:'<code>&lt;</code> und <code>&gt;</code> schließen den Wert aus, <code>&lt;=</code> und <code>&gt;=</code> schließen ihn ein.'},

  {titel:'Abändern: die Richtung', ui:'block', vorgabe:{felder:['titel', 'jahr'], where:NOLAN, sort:'jahr ASC'},
   html:`<p>Diese Abfrage zeigt die Nolan-Filme, die ältesten zuerst.</p>`,
   entwurf:{frage:'Herr Maier will die <b>neuesten</b> Nolan-Filme oben sehen.', felder:['titel', 'jahr'], where:NOLAN, sort:'jahr DESC',
     tipp:'Ändere bei ORDER BY nur die Richtung.'},
   nachher:'DESC sortiert absteigend: Die größte Jahreszahl, also der neueste Film, steht oben.'},

  {titel:'Abändern: Sortierung ergänzen', ui:'block', vorgabe:{felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 8.8'},
   html:`<p>Diese Abfrage findet die am besten bewerteten Einträge – aber unsortiert.</p>`,
   entwurf:{frage:'Herr Maier will die Liste alphabetisch, von A bis Z.', felder:['titel', 'imdb_bewertung'], where:'imdb_bewertung >= 8.8', sort:'titel ASC'},
   nachher:'Sortieren kannst du nach jedem Feld. Bei einem Text heißt aufsteigend: alphabetisch.'},

  // 3. Bedingungen ziehen
  {titel:'Bedingungen', html:`<p>Jetzt baust du die Abfragen wieder selbst. Die Bedingung wählst du dabei aus mehreren Bausteinen aus – <b>nicht alle passen</b>.</p>
   <div class="merke"><b>Merke: Bedingungen</b><ul>
   <li>Eine Bedingung hat ein <b>Feld</b>, ein <b>Vergleichszeichen</b> und einen <b>Wert</b>: <code>jahr &lt; 1960</code></li>
   <li>Vergleichszeichen: <code>=</code> gleich, <code>&lt;&gt;</code> ungleich, <code>&lt;</code> kleiner, <code>&lt;=</code> kleiner oder gleich, <code>&gt;</code> größer, <code>&gt;=</code> größer oder gleich</li>
   <li>Texte stehen in einfachen Anführungszeichen: <code>art = 'Film'</code>. Zahlen stehen ohne, Kommazahlen mit Punkt: <code>imdb_bewertung &gt;= 8.5</code></li>
   <li><code>LIKE</code> vergleicht mit einem Muster, <code>%</code> steht für beliebig viele Zeichen: <code>genres LIKE '%Horror%'</code> heißt „enthält Horror“.</li></ul></div>
   <p>So geht es: Felder im Tabfenster anklicken, die passende Bedingung in die WHERE-Zeile ziehen (oder anklicken), bei Bedarf sortieren.</p>`},

  {titel:'Bedingung ziehen: Text', ui:'zieh', bausteine:["art = 'Film'", "art <> 'Fernsehserie'", "titel = 'Fernsehserie'"],
   entwurf:{frage:'Welche Fernsehserien stehen in der Sammlung?', felder:['titel', 'jahr'], where:"art = 'Fernsehserie'",
     tipp:'Das Feld <code>art</code> brauchst du nur für die Bedingung – angezeigt werden soll es nicht.'},
   nachher:'Mit <code>&lt;&gt;</code> hättest du genau das Gegenteil gefunden: alles außer Fernsehserien.'},

  {titel:'Bedingung ziehen: Grenzwert', ui:'zieh', bausteine:['eigene_bewertung > 9', 'eigene_bewertung <= 9', 'imdb_bewertung >= 9'],
   entwurf:{frage:'Welchen Einträgen hat Herr Maier <b>mindestens</b> 9 Punkte gegeben?', felder:['titel', 'eigene_bewertung'], where:'eigene_bewertung >= 9'},
   nachher:'„mindestens 9“ schließt die 9 ein – deshalb <code>&gt;=</code>. Und es geht um Herrn Maiers <b>eigene</b> Bewertung, nicht um IMDb.'},

  {titel:'Bedingung und Sortierung', ui:'zieh', bausteine:['laufzeit < 180', 'jahr > 180', 'laufzeit > 3'],
   entwurf:{frage:'Welche Einträge dauern länger als drei Stunden (180 Minuten)? Die längsten sollen oben stehen.', felder:['titel', 'laufzeit'], where:'laufzeit > 180', sort:'laufzeit DESC'},
   nachher:'Die Laufzeit steht in Minuten in der Tabelle. <code>laufzeit &gt; 3</code> hätte fast alles gefunden.'},

  {titel:'Muster mit LIKE', ui:'zieh', bausteine:["genres = 'Horror'", "genres LIKE 'Horror'", "genres LIKE '%Komödie%'"],
   entwurf:{frage:'Welche Einträge gehören (auch) zum Genre Horror?', felder:['titel', 'genres'], where:"genres LIKE '%Horror%'",
     tipp:'Ein Eintrag kann mehrere Genres haben, z. B. „Horror, Thriller“. Sieh dir dazu die Tabelle an.'},
   nachher:"<code>genres = 'Horror'</code> findet nur Einträge, bei denen <b>nur</b> Horror steht. <code>'%Horror%'</code> findet Horror an jeder Stelle."},

  {titel:'Alles zusammen', ui:'zieh', bausteine:['regie = Christopher Nolan', "titel = 'Christopher Nolan'", "regie <> 'Christopher Nolan'"],
   entwurf:{frage:'Welche Filme hat Christopher Nolan gedreht? Die auf IMDb am besten bewerteten sollen oben stehen.', felder:['titel', 'imdb_bewertung'], where:NOLAN, sort:'imdb_bewertung DESC'},
   nachher:'Du kannst jetzt eine Abfrage aus allen vier Teilen zusammensetzen.'},

  {titel:'Geschafft!', final:true, html:`<p>Du kennst jetzt alle Teile einer Abfrage:</p>
   ${sql('SELECT titel, imdb_bewertung\nFROM filme\nWHERE regie = \'Christopher Nolan\'\nORDER BY imdb_bewertung DESC')}
   <table class="teile"><tr><td>SELECT</td><td>Spalten (Felder), <code>*</code> = alle</td></tr><tr><td>FROM</td><td>Tabelle</td></tr>

   <p>In den <b>Übungen</b> stellst du die Bedingung zuerst als Baustein ein (Stufe 1), dann tippst du sie selbst (Stufe 2) und schreibst schließlich ganze SQL-Abfragen (Stufe 3 bis 5).</p>
