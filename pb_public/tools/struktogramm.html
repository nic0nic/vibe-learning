<!doctype html>
<html lang="de" data-trainer="strukto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struktogramm-Editor – vibe learning</title>
<!--
  Struktogramm-Editor: Elemente aus der linken Leiste ins Struktogramm ziehen (oder anklicken:
  dann kommen sie hinter das markierte Element), anklicken zum Bearbeiten.
  Zeichnen und Export: struktogramm.js. Gespeichert wird im Browser (strukto-diagramm),
  über PocketBase pro Schüler. python-struktogramm.html übergibt Diagramme über sessionStorage.
  Tastatur: Pfeiltasten wechseln zwischen Bauteilen und Lücken, Buchstaben fügen in Lücken ein
  (TASTE_LEISTE), Enter bearbeitet den Text und kehrt zurück.
-->
<script src="../katalog.js"></script>
<script src="../nav.js"></script>
<script src="../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="struktogramm.css">
<script src="struktogramm.js"></script>
<style>
.arbeit{display:grid;grid-template-columns:224px minmax(0,1fr) 260px;gap:12px;align-items:start}
@media (max-width:1000px){.arbeit{grid-template-columns:1fr}.leiste{flex-direction:row!important;flex-wrap:wrap}}
.leiste{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.teil{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 10px;cursor:grab;font:600 14px system-ui,sans-serif;color:var(--text);text-align:left;touch-action:none;user-select:none}
.teil:hover{border-color:var(--accent)}
.teil svg{flex:none;width:30px;height:22px}
.teil:active{cursor:grabbing}
.leinwand{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-height:60vh}
.leinwand svg{user-select:none}
.leinwand.zieht{cursor:grabbing}
.leinwand:focus{outline:none}
.leinwand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.leinwand svg{overflow:visible}
.zieht #ueber>:not(.ziel):not(.quelle){display:none}
#ueber .puls{animation:puls 1.1s ease-in-out infinite}
@keyframes puls{50%{opacity:.5}}
.teil kbd,.panel kbd{font:600 11px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--panel2)}
.teil span{flex:1}
.teil kbd{flex:none}
.geist.nein{opacity:.55}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font:800 15px var(--mono)}
.panel p{margin:0}
.panel textarea{width:100%;min-height:80px;resize:vertical;font:14px/1.4 var(--mono)}
.panel .zeile{display:flex;gap:6px;flex-wrap:wrap}
.panel .fall{display:flex;gap:6px}
.panel .fall input{flex:1;min-width:0}
.geist{position:fixed;z-index:100;pointer-events:none;background:var(--marke);color:#fff;padding:5px 10px;border-radius:8px;font:600 13px system-ui,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:translate(10px,10px)}
[data-theme=dark] .geist{color:#2e3440}
.meldung{font-size:13px;color:var(--muted);min-height:18px;margin:-4px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand">Struktogramm<span>-Editor</span></div>
    <input class="feld" id="name" placeholder="Name des Programms" maxlength="200" aria-label="Name des Programms">
    <label class="klein">Breite <select class="feld" id="breite"></select></label>
    <button class="btn" id="rueck" type="button" title="Rückgängig (Strg+Z)">↶</button>
    <button class="btn" id="vor" type="button" title="Wiederholen (Strg+Y)">↷</button>
    <button class="btn" id="neu" type="button">Neu</button>
    <button class="btn" id="oeffnen" type="button" title="Gespeichertes Struktogramm (.json) öffnen">Öffnen</button>
    <button class="btn" id="speichern" type="button" title="Als Datei speichern, um später weiterzuarbeiten">Speichern</button>
    <input type="file" id="datei" accept=".json,application/json" hidden>
    <span class="spacer"></span>
    <span class="gruppe"><span class="hint">Export</span>
      <button class="btn haupt" data-export="svg" type="button">SVG</button>
      <button class="btn haupt" data-export="html" type="button">HTML</button>
      <button class="btn haupt" data-export="jpg" type="button">JPG</button>
      <button class="btn zahnrad" id="zahnrad" type="button" title="Exportfarben einstellen" aria-label="Exportfarben einstellen">⚙</button>
    </span>
  </div>
  <div class="meldung" id="meldung"></div>
  <div class="arbeit">
    <div class="leiste" id="leiste" aria-label="Elemente"></div>
    <div class="leinwand" id="bild" tabindex="0" aria-label="Struktogramm, mit Pfeiltasten bedienbar"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SPEICHER = 'strukto-diagramm';
const NAME = Object.fromEntries(Strukto.TYPEN.map(t => [t.typ, t.name]));
const SVGNS = 'http://www.w3.org/2000/svg';
const TASTE_LEISTE = {anweisung: 'A', wenn: 'V', fall: 'F', kopf: 'K', fuss: 'U', aufruf: 'R', abbruch: 'X', block: 'B'};

/* ---------- Zustand ---------- */
let doc = {name: '', breite: 0, kinder: []};
try { doc = Strukto.pruefe(JSON.parse(localStorage.getItem(SPEICHER))) || doc; } catch (e) {}
let auswahl = null;            // {el} = Bauteil oder {liste, i} = Lücke
let bild = null;               // letztes Ergebnis von Strukto.zeichne
const rueck = [], vor = [];
let gruppe = null;             // aufeinanderfolgende Tipp-Änderungen = ein Rückgängig-Schritt

function speichern(){
  try { localStorage.setItem(SPEICHER, JSON.stringify(doc)); } catch (e) {}
  window.TrainerSync && TrainerSync.changed();
}
function aendern(fn, g){
  if (!g || g !== gruppe){ rueck.push(JSON.stringify(doc)); if (rueck.length > 200) rueck.shift(); vor.length = 0; }
  gruppe = g || null;
  fn();
  speichern(); zeichnen();
}
function zurueck(von, nach){
  if (!von.length) return;
  nach.push(JSON.stringify(doc));
  doc = Strukto.pruefe(JSON.parse(von.pop())) || doc;
  gruppe = null; auswahl = null;
  speichern(); kopfFelder(); zeichnen(); panel();
}
function melde(t){ $('#meldung').textContent = t || ''; }

/* ---------- Werkzeugleiste ---------- */
function mini(typ){
  const r = '<rect x="1" y="1" width="28" height="20" fill="none"/>';
  const p = {
    anweisung: r,
    wenn: r + '<path d="M1 1 15 9 29 1M1 9H29M15 9V21"/>',
    fall: r + '<path d="M1 1 20 9 29 1M1 9H29M10 9V21M20 9V21"/>',
    kopf: r + '<path d="M7 8H29M7 8V21"/>',
    fuss: r + '<path d="M7 1V14H29"/>',
    aufruf: r + '<path d="M5 1V21M25 1V21"/>',
    abbruch: r + '<path d="M7 1 2 11 7 21"/>',
    block: r + '<path d="M1 8H29"/><rect x="5" y="8" width="20" height="9" fill="none"/>'
  }[typ];
  return `<svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${p}</svg>`;
}
$('#leiste').innerHTML = Strukto.TYPEN.map(t => `<button class="teil" type="button" data-typ="${t.typ}" title="Ziehen oder anklicken">${mini(t.typ)}<span>${esc(t.name)}</span><kbd>${TASTE_LEISTE[t.typ]}</kbd></button>`).join('');
$('#breite').innerHTML = Strukto.BREITEN.map(b => `<option value="${b}">${b ? b + ' px' : 'automatisch'}</option>`).join('');
function kopfFelder(){ $('#name').value = doc.name; $('#breite').value = String(doc.breite); }

/* ---------- Zeichnen ---------- */
// auswahl: {el} = Bauteil, {liste, i} = Lücke vor liste[i] (bei leerer Liste das leere Feld)
const istLuecke = a => !!(a && a.liste);
function zoneVon(liste, i){ return bild.zonen.find(z => z.liste === liste && z.i === i); }
function zeichnen(){
  bild = Strukto.zeichne(doc, Strukto.farbenAusCss(), {leer: doc.kinder.length ? '∅' : 'Element hierher ziehen'});
  const box = $('#bild');
  box.innerHTML = bild.svg;
  const svg = box.firstElementChild;
  const g = document.createElementNS(SVGNS, 'g');
  g.id = 'ueber'; svg.appendChild(g);
  const t = auswahlTreffer();
  if (t) markiere(g, 'auswahl', t.x, t.y, t.w, t.H);
  else if (istLuecke(auswahl)){
    const z = zoneVon(auswahl.liste, auswahl.i);
    if (z) luecke(g, z); else auswahl = null;
  } else auswahl = null;
  document.querySelectorAll('[data-export]').forEach(b => { b.disabled = !doc.kinder.length; });
  $('#rueck').disabled = !rueck.length; $('#vor').disabled = !vor.length;
}
function farbe(n, d){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || d; }
// Markierungen über dem Struktogramm: auswahl (Bauteil), luecke (Einfügestelle), leer (leeres Feld), quelle (wird verschoben)
function markiere(g, art, x, y, w, h){
  const a = farbe('--marke', '#c05a1c');   // eigene Farbe, damit Marken auch im grauen Bereich auffallen
  const grp = document.createElementNS(SVGNS, 'g');
  grp.setAttribute('pointer-events', 'none');
  const r = attrs => { const e = document.createElementNS(SVGNS, 'rect'); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); grp.appendChild(e); };
  if (art === 'auswahl') r({x, y, width: w, height: h, fill: a, 'fill-opacity': 0.14, stroke: a, 'stroke-width': 3});
  else if (art === 'leer') r({x: x + 2, y: y + 2, width: Math.max(0, w - 4), height: Math.max(0, h - 4), fill: a, 'fill-opacity': 0.25, stroke: a, 'stroke-width': 3, 'stroke-dasharray': '7 4'});
  else if (art === 'luecke'){
    r({x: x - 2, y: y - 8, width: w + 4, height: 16, rx: 8, fill: a, 'fill-opacity': 0.25});
    r({x: x + 2, y: y - 3, width: Math.max(0, w - 4), height: 6, rx: 3, fill: a});
  }
  else if (art === 'quelle') r({x, y, width: w, height: h, fill: farbe('--panel', '#fff'), 'fill-opacity': 0.7, stroke: a, 'stroke-width': 2, 'stroke-dasharray': '6 4'});
  if (art === 'luecke' || art === 'leer') grp.classList.add('puls');
  g.appendChild(grp);
  return grp;
}
const luecke = (g, z) => z.leer ? markiere(g, 'leer', z.x, z.y0, z.w, z.h) : markiere(g, 'luecke', z.x, z.y, z.w, 0);
function auswahlTreffer(){ return auswahl && auswahl.el ? bild.treffer.find(t => t.el === auswahl.el) : null; }

function punkt(e){
  const svg = $('#bild svg'), p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function trifft(p){
  const leer = bild.zonen.find(z => z.leer && p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y0 && p.y <= z.y0 + z.h);
  if (leer) return {liste: leer.liste, i: 0};
  let best = null;
  bild.treffer.forEach(t => { if (p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h) best = t; });
  return best ? {el: best.el} : null;
}

/* ---------- Bearbeiten ---------- */
function unterlisten(el, set){
  set = set || new Set();
  Strukto.listen(el).forEach(l => { set.add(l); l.forEach(k => unterlisten(k, set)); });
  return set;
}
function einfuegen(el, liste, i, fokus){
  aendern(() => { liste.splice(i, 0, el); auswahl = {el}; });
  panel(fokus !== false);
}
function neuEinfuegen(typ){
  const el = Strukto.neu(typ);
  const t = auswahlTreffer();
  if (t) einfuegen(el, t.liste, t.i + 1);
  else if (istLuecke(auswahl)) einfuegen(el, auswahl.liste, auswahl.i);
  else einfuegen(el, doc.kinder, doc.kinder.length);
}
function verschieben(el, liste, i){
  const t = bild.treffer.find(x => x.el === el);
  if (!t || unterlisten(el).has(liste)) return;
  if (t.liste === liste && (i === t.i || i === t.i + 1)) return;
  aendern(() => {
    t.liste.splice(t.i, 1);
    liste.splice(t.liste === liste && i > t.i ? i - 1 : i, 0, el);
    auswahl = {el};
  });
  panel();
}
// Löschen: danach ist die Lücke an derselben Stelle ausgewählt
function loeschen(){
  const t = auswahlTreffer();
  if (!t) return;
  aendern(() => { t.liste.splice(t.i, 1); auswahl = {liste: t.liste, i: t.i}; });
  panel();
}

/* ---------- Tastatur: Weg durch das Struktogramm ---------- */
// ↑ ↓ laufen abwechselnd über Lücken und Bauteile, in Verzweigungen und Fallauswahl durch die linke Spalte;
// ← → wechseln die Spalte. Fußgesteuerte Schleife: erst der Rumpf, dann die Bedingung unten.
function struktur(){
  const L = new Map(), E = new Map();
  (function lauf(liste, owner, spalte, eltern, idx){
    L.set(liste, {owner, spalte, eltern, idx});
    liste.forEach((el, i) => { E.set(el, {liste, i}); Strukto.listen(el).forEach((k, s) => lauf(k, el, s, liste, i)); });
  })(doc.kinder, null, 0, null, 0);
  return {L, E};
}
const lk = (liste, i) => ({liste, i});
const innen = el => el.typ !== 'fuss' && Strukto.listen(el).length > 0;
const obenRein = el => el.typ === 'fuss' ? lk(el.kinder, 0) : {el};
function untenRein(el){
  if (!innen(el)) return {el};
  const l = Strukto.listen(el)[0];
  return lk(l, l.length);
}
function runter(pos, S){
  if (pos.el){
    if (innen(pos.el)) return lk(Strukto.listen(pos.el)[0], 0);
    const e = S.E.get(pos.el);
    return lk(e.liste, e.i + 1);
  }
  if (pos.i < pos.liste.length) return obenRein(pos.liste[pos.i]);
  const o = S.L.get(pos.liste);
  if (!o.owner) return pos;
  return o.owner.typ === 'fuss' ? {el: o.owner} : lk(o.eltern, o.idx + 1);
}
function hoch(pos, S){
  if (pos.el){
    if (pos.el.typ === 'fuss') return lk(pos.el.kinder, pos.el.kinder.length);
    const e = S.E.get(pos.el);
    return lk(e.liste, e.i);
  }
  if (pos.i > 0) return untenRein(pos.liste[pos.i - 1]);
  const o = S.L.get(pos.liste);
  if (!o.owner) return pos;
  return o.owner.typ === 'fuss' ? lk(o.eltern, o.idx) : {el: o.owner};
}
function seitlich(pos, S, r){
  let liste, idx, istEl;
  if (pos.el){ const e = S.E.get(pos.el); liste = e.liste; idx = e.i; istEl = true; }
  else { liste = pos.liste; idx = pos.i; istEl = false; }
  for (;;){
    const o = S.L.get(liste);
    if (!o || !o.owner) return pos;
    const ziel = (o.owner.typ === 'wenn' || o.owner.typ === 'fall') && Strukto.listen(o.owner)[o.spalte + r];
    if (ziel){
      if (istEl && ziel.length) return {el: ziel[Math.min(idx, ziel.length - 1)]};
      return lk(ziel, Math.min(idx, ziel.length));
    }
    liste = o.eltern; idx = o.idx; istEl = true;
  }
}
function waehle(pos){
  auswahl = pos; zeichnen(); panel();
  const m = $('#ueber') && $('#ueber').lastElementChild;
  if (m && m.scrollIntoView) m.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
function bearbeiten(){
  const ta = $('#text'), t = auswahlTreffer();
  if (!ta || !t) return;
  ta.focus();
  if (ta.value === Strukto.neu(t.el.typ).text) ta.select(); else ta.setSelectionRange(ta.value.length, ta.value.length);
}
function zumBild(){ gruppe = null; $('#bild').focus({preventScroll: true}); }
const TASTEN = Object.fromEntries(Object.entries(TASTE_LEISTE).map(([typ, k]) => [k.toLowerCase(), typ]));

/* ---------- Eigenschaften ---------- */
const HILFE = `<p class="hinweis"><b>Tastatur:</b> ↑ ↓ wechselt zwischen Bauteilen und Lücken, ← → zwischen den Spalten einer Verzweigung oder Fallauswahl.</p>
  <p class="hinweis">In einer Lücke: <kbd>A</kbd> Anweisung, <kbd>V</kbd> Verzweigung, <kbd>F</kbd> Fallauswahl, <kbd>K</kbd> kopfgesteuerte, <kbd>U</kbd> fußgesteuerte Schleife, <kbd>R</kbd> Aufruf, <kbd>X</kbd> Aussprung, <kbd>B</kbd> Block.</p>
  <p class="hinweis"><kbd>Enter</kbd> Text bearbeiten, noch einmal <kbd>Enter</kbd> zurück (Zeilenumbruch: Umschalt+Enter). <kbd>Entf</kbd> löscht, Strg+Z macht rückgängig.</p>`;
function panel(fokus){
  const p = $('#panel'), t = auswahlTreffer();
  if (!t){
    p.innerHTML = istLuecke(auswahl)
      ? `<h3>Lücke</h3><p class="hinweis">Hier wird eingefügt: Buchstabe drücken oder ein Element der Leiste anklicken.</p>${HILFE}`
      : `<h3>Bearbeiten</h3><p class="hinweis">Ein Element anklicken, um seinen Text zu ändern. Neue Elemente aus der Leiste ins Struktogramm ziehen oder anklicken (kommt hinter das markierte Element). Markierte Elemente lassen sich mit der Maus verschieben.</p>${HILFE}`;
    return;
  }
  const el = t.el;
  const label = {wenn: 'Bedingung', fall: 'Ausdruck', kopf: 'Bedingung / Zählbereich', fuss: 'Bedingung'}[el.typ] || 'Text';
  p.innerHTML = `<h3>${esc(NAME[el.typ])}</h3>
    <label class="klein" for="text">${label}</label>
    <textarea class="feld" id="text" spellcheck="false">${esc(el.text)}</textarea>
    ${el.typ === 'fall' ? `<label class="klein">Fälle</label>${el.faelle.map((f, k) => `<div class="fall"><input class="feld" data-fall="${k}" value="${esc(f.text)}" aria-label="Fall ${k + 1}"><button class="btn" data-weg="${k}" type="button" title="Fall entfernen"${el.faelle.length <= 2 ? ' disabled' : ''}>✕</button></div>`).join('')}
      <div class="zeile"><button class="btn" id="fallNeu" type="button">+ Fall</button></div>` : ''}
    ${el.typ === 'wenn' ? '<div class="zeile"><button class="btn" id="tauschen" type="button">wahr und falsch tauschen</button></div>' : ''}
    <div class="zeile">
      <button class="btn" id="hoch" type="button" title="nach oben"${t.i === 0 ? ' disabled' : ''}>↑</button>
      <button class="btn" id="runter" type="button" title="nach unten"${t.i === t.liste.length - 1 ? ' disabled' : ''}>↓</button>
      <button class="btn" id="kopie" type="button">Duplizieren</button>
      <button class="btn" id="weg" type="button">Löschen</button>
    </div>
    <p class="hinweis"><kbd>Enter</kbd> bearbeiten / zurück, <kbd>Entf</kbd> löschen, Pfeiltasten wechseln.</p>`;
  const ta = $('#text');
  ta.addEventListener('input', () => aendern(() => { el.text = ta.value; }, 'text'));
  ta.addEventListener('focus', () => { gruppe = null; });
  const zurueckTaste = e => { if ((e.key === 'Enter' && !e.shiftKey) || e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); zumBild(); } };
  ta.addEventListener('keydown', zurueckTaste);
  if (fokus){ ta.focus(); ta.select(); }
  p.querySelectorAll('[data-fall]').forEach(inp => {
    inp.addEventListener('focus', () => { gruppe = null; });
    inp.addEventListener('keydown', zurueckTaste);
    inp.addEventListener('input', () => aendern(() => { el.faelle[+inp.dataset.fall].text = inp.value; }, 'fall' + inp.dataset.fall));
  });
  p.querySelectorAll('[data-weg]').forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.weg;
    if (el.faelle[k].kinder.length && !confirm('Der Fall enthält Elemente. Trotzdem entfernen?')) return;
    aendern(() => el.faelle.splice(k, 1)); panel();
  }));
  const an = (id, fn) => { const b = p.querySelector('#' + id); if (b) b.addEventListener('click', fn); };
  an('fallNeu', () => { aendern(() => el.faelle.splice(el.faelle.length - 1, 0, {text: String(el.faelle.length), kinder: []})); panel(); });
  an('tauschen', () => { aendern(() => { [el.ja, el.nein] = [el.nein, el.ja]; }); });
  an('hoch', () => { aendern(() => { t.liste.splice(t.i, 1); t.liste.splice(t.i - 1, 0, el); }); panel(); });
  an('runter', () => { aendern(() => { t.liste.splice(t.i, 1); t.liste.splice(t.i + 1, 0, el); }); panel(); });
  an('kopie', () => { einfuegen(Strukto.pruefe({kinder: [el]}).kinder[0], t.liste, t.i + 1); });
  an('weg', loeschen);
}

/* ---------- Ziehen und Ablegen ---------- */
let zug = null;   // {typ | el, x0, y0, aktiv, geist, ziel}
function zielZone(p){
  const verboten = zug.el ? unterlisten(zug.el) : new Set();
  let best = null, bestD = Infinity;
  bild.zonen.forEach(z => {
    if (verboten.has(z.liste) || p.x < z.x - 4 || p.x > z.x + z.w + 4) return;
    let d = Math.abs(p.y - z.y);
    if (z.leer && p.y >= z.y0 && p.y <= z.y0 + z.h && p.x >= z.x && p.x <= z.x + z.w) d = -1;
    d += z.w / 10000;   // bei gleichem Abstand die innere (schmalere) Stelle
    if (d < bestD){ bestD = d; best = z; }
  });
  if (bestD < 40) return best;
  // unterhalb des Struktogramms: ans Ende
  if (p.y > bild.inhalt.y + bild.inhalt.h && p.x >= 0 && p.x <= bild.breite) return zoneVon(doc.kinder, doc.kinder.length) || null;
  return null;
}
function zugStart(e, daten){
  zug = Object.assign({x0: e.clientX, y0: e.clientY, aktiv: false, ziel: null}, daten);
  window.addEventListener('pointermove', zugBewegen);
  window.addEventListener('pointerup', zugEnde);
  window.addEventListener('pointercancel', zugAbbruch);
}
function zugBewegen(e){
  if (!zug) return;
  const g = $('#ueber');
  if (!zug.aktiv){
    if (Math.hypot(e.clientX - zug.x0, e.clientY - zug.y0) < 6) return;
    zug.aktiv = true;
    zug.geist = document.createElement('div');
    zug.geist.className = 'geist';
    zug.geist.textContent = NAME[zug.typ || zug.el.typ];
    document.body.appendChild(zug.geist);
    $('#bild').classList.add('zieht');
    const t = zug.el && bild.treffer.find(x => x.el === zug.el);
    if (t) markiere(g, 'quelle', t.x, t.y, t.w, t.H).classList.add('quelle');
  }
  e.preventDefault();
  zug.geist.style.left = e.clientX + 'px'; zug.geist.style.top = e.clientY + 'px';
  const alt = g.querySelector('.ziel');
  if (alt) alt.remove();
  zug.ziel = zielZone(punkt(e));
  zug.geist.classList.toggle('nein', !zug.ziel);
  if (zug.ziel) luecke(g, zug.ziel).classList.add('ziel');
}
function zugEnde(){
  const z = zug;
  zugAbbruch();
  if (!z) return;
  if (!z.aktiv){
    if (z.typ) neuEinfuegen(z.typ);
    else { auswahl = z.treffer; zeichnen(); panel(); }
    return;
  }
  if (!z.ziel) return;
  if (z.typ) einfuegen(Strukto.neu(z.typ), z.ziel.liste, z.ziel.i);
  else verschieben(z.el, z.ziel.liste, z.ziel.i);
}
function zugAbbruch(){
  window.removeEventListener('pointermove', zugBewegen);
  window.removeEventListener('pointerup', zugEnde);
  window.removeEventListener('pointercancel', zugAbbruch);
  if (zug && zug.geist) zug.geist.remove();
  $('#bild').classList.remove('zieht');
  document.querySelectorAll('#ueber .ziel, #ueber .quelle').forEach(x => x.remove());
  zug = null;
}

$('#leiste').addEventListener('pointerdown', e => {
  const b = e.target.closest('.teil');
  if (!b || e.button) return;
  e.preventDefault();
  zugStart(e, {typ: b.dataset.typ});
});
$('#leiste').addEventListener('keydown', e => {
  const b = e.target.closest('.teil');
  if (b && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.stopPropagation(); neuEinfuegen(b.dataset.typ); }
});
$('#bild').addEventListener('pointerdown', e => {
  if (e.button || !$('#bild svg')) return;
  $('#bild').focus({preventScroll: true});
  const tr = trifft(punkt(e));
  if (!tr){ auswahl = null; zeichnen(); panel(); return; }
  // Elemente nur mit der Maus verschieben; am Handy bleibt Wischen zum Blättern (↑ ↓ im Bearbeiten-Feld)
  if (tr.el && e.pointerType === 'mouse'){ e.preventDefault(); zugStart(e, {el: tr.el, treffer: tr}); return; }
  auswahl = tr; zeichnen(); panel();
});
$('#bild').addEventListener('dblclick', bearbeiten);

/* ---------- Leiste oben ---------- */
$('#name').addEventListener('focus', () => { gruppe = null; });
$('#name').addEventListener('input', () => aendern(() => { doc.name = $('#name').value; }, 'name'));
$('#breite').addEventListener('change', () => aendern(() => { doc.breite = +$('#breite').value; }));
$('#rueck').addEventListener('click', () => zurueck(rueck, vor));
$('#vor').addEventListener('click', () => zurueck(vor, rueck));
$('#neu').addEventListener('click', () => {
  if (doc.kinder.length && !confirm('Ein neues, leeres Struktogramm anfangen? Mit ↶ kommst du zurück.')) return;
  aendern(() => { doc = {name: '', breite: doc.breite, kinder: []}; auswahl = null; });
  kopfFelder(); panel(); melde('');
});
$('#speichern').addEventListener('click', () => {
  const name = (doc.name.trim().replace(/[^\wäöüÄÖÜß-]+/g, '_').replace(/^_+|_+$/g, '') || 'struktogramm') + '.struktogramm.json';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], {type: 'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
$('#oeffnen').addEventListener('click', () => $('#datei').click());
$('#datei').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let neu = null;
  try { neu = f.size < 2000000 ? Strukto.pruefe(JSON.parse(await f.text())) : null; } catch (err) {}
  if (!neu){ alert('Diese Datei ist kein gespeichertes Struktogramm.'); return; }
  aendern(() => { doc = neu; auswahl = null; });
  kopfFelder(); panel(); melde(`„${f.name}“ geöffnet. Mit ↶ kommst du zum vorherigen Struktogramm zurück.`);
});
Strukto.zahnrad($('#zahnrad'));
document.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', () => {
  Promise.resolve(Strukto.exportiere(doc, b.dataset.export)).catch(err => alert(err.message));
}));

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const tippt = /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable;
  const strg = e.ctrlKey || e.metaKey;
  if (tippt || document.querySelector('.ts-ov') || e.altKey) return;
  if (strg && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? zurueck(vor, rueck) : zurueck(rueck, vor); return; }
  if (strg && e.key.toLowerCase() === 'y'){ e.preventDefault(); zurueck(vor, rueck); return; }
  if (strg) return;
  const pfeil = {ArrowDown: 'runter', ArrowUp: 'hoch', ArrowLeft: -1, ArrowRight: 1}[e.key];
  if (pfeil !== undefined){
    e.preventDefault();
    const S = struktur();
    let pos;
    if (!auswahl) pos = e.key === 'ArrowUp' ? lk(doc.kinder, doc.kinder.length) : doc.kinder.length ? obenRein(doc.kinder[0]) : lk(doc.kinder, 0);
    else pos = pfeil === 'runter' ? runter(auswahl, S) : pfeil === 'hoch' ? hoch(auswahl, S) : seitlich(auswahl, S, pfeil);
    waehle(pos);
    return;
  }
  const amBild = ae === document.body || ae === $('#bild');
  if (e.key === 'Enter' && amBild && auswahlTreffer()){ e.preventDefault(); bearbeiten(); return; }
  if (istLuecke(auswahl) && TASTEN[e.key.toLowerCase()]){
    e.preventDefault();
    einfuegen(Strukto.neu(TASTEN[e.key.toLowerCase()]), auswahl.liste, auswahl.i, false);
    zumBild();
    return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && auswahlTreffer()){ e.preventDefault(); loeschen(); return; }
  if (e.key === 'Escape' && auswahl){ auswahl = null; zeichnen(); panel(); }
});

/* ---------- Start ---------- */
try {
  const ue = sessionStorage.getItem('strukto-uebergabe');
  if (ue){
    sessionStorage.removeItem('strukto-uebergabe');
    const neu = Strukto.pruefe(JSON.parse(ue));
    if (neu){
      if (doc.kinder.length) rueck.push(JSON.stringify(doc));
      doc = neu; speichern();
      melde('Aus Python übernommen.' + (rueck.length ? ' Mit ↶ kommst du zu deinem vorherigen Struktogramm zurück.' : ''));
    }
  }
} catch (e) {}
kopfFelder(); zeichnen(); panel();
new MutationObserver(zeichnen).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
