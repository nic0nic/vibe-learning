<!doctype html>
<html lang="de" data-trainer="kurzkredit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurzfristige Kredite – vibe learning</title>
<!--
  Erarbeitung zu Kapitel 7 der Ergänzung zum Selbstlernheft Finanzierung (Saitgig):
  Kontokorrent-, Dispositions- und Lieferantenkredit. Schritte in SCHRITTE (Info oder Aufgabe 7.1–7.5),
  jede Seite enthält alle Werte, die man für ihre Aufgabe braucht (Material wird wiederholt).
  Lieferantenkredit: Zahlungsdatum eingeben → Zeitleiste zeigt Dauer von Lieferanten- und Kontokorrentkredit.
  Gespeichert: kurzkredit-stand = {schritt, erledigt:{id:true}}. Auswertung: TrainerSync.event, modus erarbeitung.
-->
<script src="../../../katalog.js"></script>
<script src="../../../nav.js"></script>
<script src="../../../sync.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem('wenn-theme');}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();
</script>
<link rel="stylesheet" href="../../bwr.css">
<style>
.wrap{max-width:1000px}
.schritte{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.schritte .btn{font-size:13px;padding:5px 10px}
.schritte .btn.erl::after{content:" ✓";color:var(--ok)}
.schritte .btn.on.erl::after{color:inherit}
.info{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 12px}
.alltag{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.alltag b:first-child{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.unten{display:flex;justify-content:space-between;gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
.aufgabe{font-weight:600;margin:4px 0 10px}
.aufgabe .nrk{display:inline-block;min-width:36px;font-family:var(--mono)}
.erledigt{font-size:13px;color:var(--ok);font-weight:700;margin:0 0 8px}
ul.merk{margin:0 0 12px;padding-left:20px}
ul.merk li{margin-bottom:3px}
/* Grafiken */
.grafik{width:100%;height:auto;display:block;margin:4px 0 10px}
.grafik text{fill:var(--text);font:12px system-ui,sans-serif}
.grafik .achse{stroke:var(--text);stroke-width:1.5}
.grafik .limit{stroke:var(--err);stroke-width:2;stroke-dasharray:6 4}
.grafik .kurve{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.grafik .ueberzogen{fill:var(--err);fill-opacity:.35}
.grafik .schr{stroke:var(--text);stroke-opacity:.45;stroke-width:2}
.grafik .rotT{fill:var(--err);font-weight:700}
.grafik .gruen{fill:#a3be8c}.grafik .orange{fill:#ebcb8b}.grafik .rot{fill:#d08770;fill-opacity:.7}
.grafik text.bt{fill:#2e3440;font-weight:700;text-anchor:middle}
.grafik text.bt.k{font-weight:400}
.grafik .tick{stroke:var(--muted)}
.grafik text.dt{fill:var(--muted);font-size:11px;text-anchor:middle}
.grafik text.key{font-weight:700;text-anchor:middle}
.grafik .marke{stroke:var(--text);stroke-width:2.5}
.grafik text.mt{font-weight:800;font-size:13px}
.grafik .lk{fill:var(--accent)}
.grafik .kk{fill:url(#tlSchr);stroke:var(--text);stroke-width:1}
.datum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 6px}
.datum input[type=text]{width:90px;font-family:var(--mono);text-align:center}
.datum input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.stand{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:0 0 12px}
/* Fragen mit Eingabe */
.fragen{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.frage{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.frage .ft{flex:1 1 320px}
.frage input{width:120px;text-align:right;font-family:var(--mono)}
.frage .ok{color:var(--ok);font-weight:700}.frage .nein{color:var(--err);font-weight:700}
.frage input.richtig{border-color:var(--ok);background:var(--plus-bg)}
.frage input.falsch{border-color:var(--err);background:var(--minus-bg)}
/* Zuordnen (Drag and Drop) */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--border);border-radius:12px;margin-bottom:12px}
.zonen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.zonen{grid-template-columns:minmax(0,1fr)}}
.zone{border:2px solid var(--border);border-radius:12px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.zone h3{margin:0 0 4px!important;text-align:center;font-size:14px}
.zone.ziel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.kk-karte{background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:8px;padding:7px 10px;font-size:14px;cursor:grab;touch-action:none;user-select:none;max-width:100%}
.pool .kk-karte{flex:1 1 220px}
.kk-karte.gewaehlt{outline:3px solid var(--accent)}
.kk-karte.quelle{opacity:.35}
.kk-karte.fix{border-left-color:var(--ok);background:var(--plus-bg);cursor:default}
.kk-karte.weg{animation:wackeln .5s;border-left-color:var(--err);background:var(--minus-bg)}
@keyframes wackeln{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.geist{position:fixed;z-index:100;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-2deg);width:240px}
/* Multiple Choice */
.mc{margin:0 0 14px}
.mc .q{font-weight:600;margin:0 0 6px}
.mc .opts{display:flex;flex-direction:column;gap:6px}
.mc .opt{text-align:left;font:15px system-ui,sans-serif;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.mc .opt:hover{border-color:var(--accent)}
.mc .opt.richtig{background:var(--plus-bg);border-color:var(--ok)}
.mc .opt.falsch{background:var(--minus-bg);border-color:var(--err)}
.mc .opt:disabled{cursor:default}
/* Lückentext */
.lueckentext{line-height:2.4;font-size:16px}
.lueckentext select{font:15px system-ui,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:3px 6px}
.lueckentext select.richtig{border-color:var(--ok);background:var(--plus-bg)}
.lueckentext select.falsch{border-color:var(--err);background:var(--minus-bg)}
.ueberblick p{margin:0 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="brand">Kurzfristige<span> Kredite</span></div><span class="spacer"></span><span class="muted" id="zaehler"></span></div>
  <nav class="schritte" id="schritte" aria-label="Schritte"></nav>
  <main class="karte" id="inhalt" aria-live="polite"></main>
</div>
<script>
'use strict';
/* ---------- Helfer ---------- */
const KEY = 'kurzkredit-';
const ldJ = (k, d) => { try { const x = JSON.parse(localStorage.getItem(KEY + k)); return x == null ? d : x; } catch (e) { return d; } };
function st(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} if (window.TrainerSync) TrainerSync.changed(); }
const $ = s => document.querySelector(s);
const r2 = n => Math.round(n * 100) / 100;
const eur = n => r2(n).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
function zahl(s){
  s = String(s).replace(/€|%|Tage?|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? +s : NaN;
}
function mischen(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Material (Werte aus dem Heft, Kapitel 7) ---------- */
const R = {netto:10000, ust:1900, brutto:11900, skonto:2, tageSkonto:10, tageZiel:30, zinsenKK:58.31};
R.bruttoSkonto = r2(R.brutto * R.skonto / 100); R.nettoSkonto = r2(R.bruttoSkonto / 1.19); R.ueberweisung = r2(R.brutto - R.bruttoSkonto);
const rechnungHTML = () => `<div class="material"><div class="mt">Material: Eingangsrechnung eines Holzlieferanten (Auszug)</div>
  <table class="beleg"><tr><td>Rechnungsdatum</td><td>02.11.</td></tr><tr><td>20 Hälse aus Ahorn, Warenwert netto</td><td>${eur(R.netto)}</td></tr>
  <tr><td>+ 19 % Umsatzsteuer</td><td>${eur(R.ust)}</td></tr><tr class="summe"><td>Rechnungsbetrag</td><td>${eur(R.brutto)}</td></tr></table>
  <p style="margin:8px 0 0">Zahlungsbedingungen: Zahlbar innerhalb von 30 Tagen ohne Abzug; bei Zahlung innerhalb von 10 Tagen 2 % Skonto.</p></div>`;
const kkTextHTML = () => `<p style="margin:8px 0 0">Saitgig hat zurzeit kein Guthaben. Nutzt Jakob das Skonto, muss er den Überweisungsbetrag mit dem Kontokorrentkredit bezahlen. Die Bank verlangt dafür für die 20 Tage <b>${eur(R.zinsenKK)}</b> Zinsen.</p>`;

/* ---------- Zustand ---------- */
let stand = ldJ('stand', {});
if (!stand.erledigt) stand.erledigt = {};
const Z = {};   // Zustand der Aufgaben in dieser Sitzung (Eingaben, Rückmeldungen)
function erledigt(s){
  const erstmals = !stand.erledigt[s.id];
  stand.erledigt[s.id] = true; st('stand', stand);
  if (s.aufgabe && window.TrainerSync) TrainerSync.event({modus:'erarbeitung', stufe:0, aufgabe:s.id, titel:s.titel, gesamt:SCHRITTE.filter(x => x.aufgabe).length, erstmals});
}

/* ---------- Grafik Kontokorrentkredit ---------- */
function kkGrafik(){
  const P = [[0, 20], [1, 8], [2, -30], [3, -45], [4, -25], [5, 10], [6, -5], [7, -50], [8, -82], [9, -62], [10, -20], [11, 15]];
  const X = t => 70 + t * 48, Y = v => 40 + (30 - v) * 1.7;
  const pts = P.map(([t, v]) => X(t) + ',' + Y(v)).join(' '), flaeche = `${X(0)},${Y(0)} ${pts} ${X(11)},${Y(0)}`;
  return `<svg class="grafik" viewBox="0 0 640 280" role="img" aria-label="Kontostand eines Geschäftsbankkontos im Zeitverlauf mit Kreditlinie">
    <defs><pattern id="kkSchr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="schr"/></pattern>
    <clipPath id="kkU0"><rect x="0" y="${Y(0)}" width="640" height="300"/></clipPath><clipPath id="kkUL"><rect x="0" y="${Y(-70)}" width="640" height="300"/></clipPath></defs>
    <polygon points="${flaeche}" fill="url(#kkSchr)" clip-path="url(#kkU0)"/>
    <polygon points="${flaeche}" class="ueberzogen" clip-path="url(#kkUL)"/>
    <line class="achse" x1="62" x2="632" y1="${Y(0)}" y2="${Y(0)}"/><line class="achse" x1="62" x2="62" y1="22" y2="256"/>
    <line class="limit" x1="62" x2="632" y1="${Y(-70)}" y2="${Y(-70)}"/>
    <polyline class="kurve" points="${pts}"/>
    <text x="6" y="18">Kontostand</text><text x="56" y="${Y(0) + 4}" text-anchor="end">0 €</text><text x="632" y="${Y(0) + 18}" text-anchor="end">Zeit</text>
    <text x="70" y="${Y(-70) - 7}" class="rotT">Kreditlinie (Limit) – 70.000 €</text>
    <text x="${X(0) + 4}" y="${Y(20) - 10}">Guthaben</text>
    <text x="${X(5)}" y="${Y(10) - 10}" text-anchor="middle">Kunde zahlt ein</text>
    <text x="${X(8) - 14}" y="${Y(-70) + 19}" text-anchor="end" class="rotT">geduldete Überziehung (noch teurer!) →</text>
    <text x="62" y="276">schraffiert = Kontokorrentkredit beansprucht → Zinsen</text></svg>`;
}

/* ---------- Zeitleiste Lieferantenkredit ---------- */
const datum = d => { const n = 2 + d; return n <= 30 ? String(n).padStart(2, '0') + '.11.' : String(n - 30).padStart(2, '0') + '.12.'; };
function tagAus(s){
  const m = String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
  if (!m) return null;
  const tag = +m[1], monat = +m[2];
  const d = monat === 11 ? tag - 2 : monat === 12 ? 28 + tag : NaN;
  return d >= 0 && d <= 40 && tag >= 1 && tag <= (monat === 11 ? 30 : 31) ? d : null;
}
function zeitleiste(d){
  const X = t => 30 + t * 15, mitte = (a, b) => (X(a) + X(b)) / 2;
  let h = `<svg class="grafik" viewBox="0 0 660 230" role="img" aria-label="Zeitleiste des Lieferantenkredits mit Zahlung am ${datum(d)}">
    <defs><pattern id="tlSchr" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ebcb8b" fill-opacity=".35"/><line x1="0" y1="0" x2="0" y2="8" class="schr"/></pattern></defs>
    <rect class="gruen" x="${X(0)}" y="34" width="${X(10) - X(0)}" height="38"/><rect class="orange" x="${X(10)}" y="34" width="${X(30) - X(10)}" height="38"/><rect class="rot" x="${X(30)}" y="34" width="${X(40) - X(30)}" height="38"/>
    <text class="bt" x="${mitte(0, 10)}" y="50">10 Tage Skontofrist</text><text class="bt k" x="${mitte(0, 10)}" y="65">kostenlos</text>
    <text class="bt" x="${mitte(10, 30)}" y="50">20 Tage bis zum Zahlungsziel</text><text class="bt k" x="${mitte(10, 30)}" y="65">Preis = entgangenes Skonto</text>
    <text class="bt" x="${mitte(30, 40)}" y="57">zu spät</text>`;
  for (let t = 0; t <= 40; t++) h += `<line class="tick" x1="${X(t)}" x2="${X(t)}" y1="72" y2="${t % 5 ? 76 : 80}"/>`;
  [[0, 'Rechnung'], [10, 'Ende Skontofrist'], [30, 'Zahlungsziel']].forEach(([t, s]) => { h += `<text class="key" x="${X(t)}" y="94">${datum(t)}</text><text class="dt" x="${X(t)}" y="107">${s}</text>`; });
  [5, 15, 20, 25, 35, 40].forEach(t => { h += `<text class="dt" x="${X(t)}" y="94">${datum(t)}</text>`; });
  const lx = Math.min(Math.max(X(d), 60), 600);
  h += `<path class="marke" d="M${X(d) - 6},24 L${X(d) + 6},24 L${X(d)},33 z" style="fill:var(--text)"/><line class="marke" x1="${X(d)}" x2="${X(d)}" y1="76" y2="214"/><text class="mt" x="${lx}" y="18" text-anchor="middle">Zahlung am ${datum(d)}</text>`;
  if (d > 0) h += `<rect class="lk" x="${X(0)}" y="136" width="${X(d) - X(0)}" height="16" rx="3"/>`;
  h += `<text x="${X(0)}" y="130">${d > 0 ? `Lieferantenkredit: ${d} ${d === 1 ? 'Tag' : 'Tage'} (02.11. bis ${datum(d)})` : 'Sofortige Zahlung: kein Lieferantenkredit'}</text>`;
  if (d <= 10){
    const tx = Math.min(X(d), 330);
    h += `<rect class="kk" x="${X(d)}" y="186" width="${X(30) - X(d)}" height="16" rx="3"/><text x="${tx}" y="180">Kontokorrentkredit: ${30 - d} Tage (${datum(d)} bis 02.12.)</text>`;
  }
  return h + '</svg>';
}
function standText(d){
  if (d <= 10) return `<b>Zahlung mit Skonto.</b> Jakob überweist ${eur(R.ueberweisung)}. Der Lieferantenkredit dauert ${d} ${d === 1 ? 'Tag' : 'Tage'} und ist kostenlos. Weil Saitgig kein Guthaben hat, zahlt Jakob mit dem Kontokorrentkredit. Er läuft so lange, bis Jakob ohnehin hätte zahlen müssen (Zahlungsziel 02.12.): <b>${30 - d} Tage</b>.`;
  if (d <= 30) return `<b>Zahlung ohne Abzug.</b> Jakob überweist ${eur(R.brutto)}. Der Lieferantenkredit dauert ${d} Tage – die Tage nach dem 12.11. bezahlt Jakob mit dem entgangenen Skonto.`;
  return `<b>Zu spät!</b> Das Zahlungsziel (02.12.) ist um ${d - 30} ${d - 30 === 1 ? 'Tag' : 'Tage'} überschritten. Saitgig gerät in Zahlungsverzug – der Lieferer kann mahnen und Verzugszinsen verlangen.`;
}

/* ---------- Bausteine für Aufgaben ---------- */
// Fragen mit Zahleneingabe: [{id, t (Frage), l (Lösung), e (Einheit), h (Hinweis bei Fehler)}]
function fragenHTML(z, fr){
  return '<div class="fragen">' + fr.map(f => {
    const r = z.ok && z.ok[f.id];
    return `<div class="frage"><span class="ft">${f.t}</span><input class="feld${r === true ? ' richtig' : r === false ? ' falsch' : ''}" data-frage="${f.id}" value="${z.ein && z.ein[f.id] || ''}" inputmode="decimal" autocomplete="off" aria-label="Antwort"${r === true ? ' readonly' : ''}><span>${f.e}</span>${r === true ? '<span class="ok">✓</span>' : r === false ? '<span class="nein">✗</span>' : ''}</div>`
      + (r === false && f.h ? `<div class="nr" style="margin:0 0 0 2px">${f.h}</div>` : '');
  }).join('') + '</div>';
}
function fragenPruefen(z, fr){
  z.ok = z.ok || {};
  fr.forEach(f => { const v = zahl(z.ein && z.ein[f.id]); z.ok[f.id] = Math.abs(v - f.l) < 0.005; });
  return fr.every(f => z.ok[f.id]);
}
// Multiple Choice: q = {id, q, o:[Antworten], r (Index richtig), w:{Index: Erklärung}}
function mcHTML(z, qs){
  return qs.map(q => {
    const g = z.mc && z.mc[q.id], ord = z.ord[q.id] || (z.ord[q.id] = mischen(q.o.map((_, i) => i)));
    return `<div class="mc"><p class="q">${q.q}</p><div class="opts">${ord.map(i => `<button class="opt${g && g.ok && i === q.r ? ' richtig' : g && !g.ok && g.i === i ? ' falsch' : ''}" type="button" data-mc="${q.id}" data-i="${i}"${g && g.ok ? ' disabled' : ''}>${q.o[i]}</button>`).join('')}</div>`
      + (g ? `<div class="fb ${g.ok ? 'ok' : 'falsch'}">${g.ok ? '✓ Richtig.' + (q.e ? ' ' + q.e : '') : (q.w && q.w[g.i]) || 'Das stimmt nicht. Versuche es noch einmal.'}</div>` : '') + '</div>';
  }).join('');
}

/* ---------- Schritte ---------- */
const KARTEN = [
  {id:'k1', t:'Das Geschäftsbankkonto darf bis zur Kreditlinie überzogen werden.', z:'kk'},
  {id:'k2', t:'Er sichert die Liquidität eines Unternehmens im laufenden Geschäftsverkehr.', z:'kk'},
  {id:'k3', t:'Zahlungseingänge von Kunden tilgen ihn automatisch.', z:'kk'},
  {id:'k4', t:'Kontoführungsgebühren dafür bucht das Unternehmen auf 6750 KGV.', z:'kk'},
  {id:'d1', t:'Die Bank räumt ihn Privatkunden ein.', z:'dispo'},
  {id:'d2', t:'Man überzieht damit sein privates Girokonto.', z:'dispo'},
  {id:'d3', t:'Seine Höhe hängt von regelmäßigen Geldeingängen wie dem Gehalt ab.', z:'dispo'},
  {id:'d4', t:'Die Bank bietet ihn dir vielleicht mit deinem ersten Ausbildungsgehalt an.', z:'dispo'},
  {id:'l1', t:'Der Lieferer gewährt ein Zahlungsziel, z. B. 30 Tage.', z:'lk'},
  {id:'l2', t:'Bis zum Ende der Skontofrist ist er kostenlos.', z:'lk'},
  {id:'l3', t:'Sein Preis ist das entgangene Skonto.', z:'lk'},
  {id:'l4', t:'Auf ein Jahr hochgerechnet entspricht er oft einem Zinssatz von rund 36 %.', z:'lk'}
];
const ZONEN = [['kk', 'Kontokorrentkredit'], ['dispo', 'Dispositionskredit'], ['lk', 'Lieferantenkredit']];
const MC72 = [
  {id:'a', q:'Welche Aussage unterscheidet Kontokorrent- und Dispositionskredit richtig?',
    o:['Kontokorrentkredit: Unternehmen auf dem Geschäftsbankkonto – Dispositionskredit: Privatkunden auf dem Girokonto',
       'Kontokorrentkredit: Privatkunden auf dem Girokonto – Dispositionskredit: Unternehmen auf dem Geschäftsbankkonto',
       'Der Kontokorrentkredit ist zinslos, der Dispositionskredit nicht.',
       'Der Dispositionskredit ist langfristig, der Kontokorrentkredit kurzfristig.'], r:0,
    w:{1:'Genau vertauscht: Unternehmen haben ein Geschäftsbankkonto, Privatkunden ein Girokonto.', 2:'Für beide Kredite verlangt die Bank Zinsen.', 3:'Beide Kredite sind kurzfristig.'}},
  {id:'b', q:'Wovon hängt die Höhe eines Dispositionskredits vor allem ab?',
    o:['von der Kreditwürdigkeit und den regelmäßigen Geldeingängen, z. B. dem Gehalt', 'vom Skontosatz der Lieferer', 'von der Zahl der Maschinen im Unternehmen', 'von der Laufzeit eines Darlehens'], r:0,
    w:{1:'Skonto gehört zum Lieferantenkredit.', 2:'Den Dispo bekommen Privatkunden, nicht Unternehmen.', 3:'Der Dispo hat keine feste Laufzeit wie ein Darlehen.'}},
  {id:'c', q:'Was haben Kontokorrent- und Dispositionskredit gemeinsam?',
    o:['Das Konto darf bis zu einer Obergrenze überzogen werden; Zinsen fallen nur für die beanspruchte Höhe und Dauer an.',
       'Beide sind bis zum Ende einer Frist kostenlos.', 'Beide dienen zur langfristigen Finanzierung von Maschinen.', 'Beide gewährt ein Lieferer.'], r:0,
    w:{1:'Kostenlos bis zum Ende einer Frist ist nur der Lieferantenkredit (Skontofrist).', 2:'Beide sind kurzfristig – Maschinen finanziert man langfristig (Goldene Finanzierungsregel).', 3:'Beide gewährt die Bank.'}}

function setzeTag(d, vomRegler){
  Z.lk.d = d;
  $('#lkBild').innerHTML = zeitleiste(d); $('#lkStand').innerHTML = standText(d);
  if (vomRegler) $('#lkDatum').value = datum(d); else $('#lkRegler').value = d;
}

/* Ziehen mit Maus, Stift oder Finger */
let zieht = false, zug = null;
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('.kk-karte'); if (!k || k.classList.contains('fix')) return;
  zug = {id:k.dataset.karte, el:k, x:e.clientX, y:e.clientY, geist:null};
});
document.addEventListener('pointermove', e => {
  if (!zug) return;
  if (!zug.geist){
    if (Math.hypot(e.clientX - zug.x, e.clientY - zug.y) < 6) return;
    zug.geist = zug.el.cloneNode(true); zug.geist.classList.add('geist'); zug.geist.classList.remove('gewaehlt'); document.body.appendChild(zug.geist);
    zug.el.classList.add('quelle'); zieht = true;
  }
  e.preventDefault();
  zug.geist.style.left = (e.clientX - 120) + 'px'; zug.geist.style.top = (e.clientY - 20) + 'px';
  document.querySelectorAll('.zone.ziel').forEach(x => x.classList.remove('ziel'));
  const ziel = document.elementFromPoint(e.clientX, e.clientY);
  const zo = ziel && ziel.closest('.zone'); if (zo) zo.classList.add('ziel');
});
document.addEventListener('pointerup', e => {
  if (!zug) return;
  const g = zug; zug = null;
  if (!g.geist) return;
  g.geist.remove();
  const ziel = document.elementFromPoint(e.clientX, e.clientY), zo = ziel && ziel.closest('[data-zone]');
  if (zo) legen(g.id, zo.dataset.zone);
  render(); setTimeout(() => { zieht = false; }, 0);
});
document.addEventListener('pointercancel', () => { if (zug && zug.geist) zug.geist.remove(); zug = null; zieht = false; render(); });

render();
</script>
</body>
</html>
