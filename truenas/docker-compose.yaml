# IT-Tools (PocketBase) für TrueNAS SCALE 24.10+
# Apps > Discover Apps > ⋮ > Install via YAML  → diesen Inhalt einfügen.
# Pfad unter "volumes" an deinen Dataset anpassen. Dort müssen
# pb_hooks/, pb_migrations/ und pb_public/ liegen (optional pb_data/ vom Testrechner).
# Beim ersten Start wird PocketBase 0.40.5 (offizielles Release von GitHub) in den Dataset geladen.

services:
  it-tools:
    image: alpine:3.20
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /mnt/Software/it-tools:/pb
    working_dir: /pb
    command:
      - sh
      - -c
      - |
        if [ ! -x /pb/pocketbase ]; then
          wget -qO /tmp/pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip &&
          unzip -o /tmp/pb.zip pocketbase -d /pb && chmod +x /pb/pocketbase || exit 1
        fi
        exec /pb/pocketbase serve --http 0.0.0.0:8090 \
          --dir /pb/pb_data --hooksDir /pb/pb_hooks \
          --migrationsDir /pb/pb_migrations --publicDir /pb/pb_public \
          --hooksWatch=false
